/**
 * Walk previous_league_id backward from the newest league to enumerate every
 * season the league existed on Sleeper. Returns newest → oldest.
 */
async function buildLeagueHistory(head) {
  const out = [];
  let cur = head, guard = 0;
  while (cur && guard < 30) {
    out.push({ league_id: cur.league_id, season: cur.season, name: cur.name });
    const prev = cur.previous_league_id;
    if (!prev || prev === '0') break;
    try { cur = await getLeague(prev); } catch { break; }
    guard++;
  }
  return out;
}

// Real Sleeper team logo for a named team. Sleeper stores a custom team avatar
// in metadata.avatar (a full sleepercdn URL, or an id); fall back to the
// account avatar. Returns null if the league isn't loaded or no match.
function teamAvatarByName(name) {
  if (!name || !S.bundle || !S.bundle.users) return null;
  const key = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const want = key(name); if (!want) return null;
  const u = S.bundle.users.find(u => {
    const tn = key(u.metadata && u.metadata.team_name), dn = key(u.display_name);
    return (tn && (tn === want || tn.includes(want) || want.includes(tn))) || (dn && (dn === want || dn.includes(want) || want.includes(dn)));
  });
  if (!u) return null;
  const meta = u.metadata && u.metadata.avatar;
  if (meta && /^https?:\/\//.test(meta)) return meta;
  if (meta) return `https://sleepercdn.com/avatars/${meta}`;
  return avatarUrl(u.avatar);
}
// A reusable horizontal-bar data graphic. Magnitude data, one brand hue (so it's
// colour-blind safe by construction and prints in colour). rows: [{label,value,sub,star}].
function barGraphic(rows, opts) {
  opts = opts || {};
  const max = opts.max || Math.max(1, ...rows.map(r => r.value || 0));
  const fmt = opts.fmt || (v => String(v));
  const bars = rows.map((r, i) => {
    const pct = Math.max(3, Math.round(((r.value || 0) / max) * 100));
    const rank = opts.rankStart != null ? (opts.rankStart + i) : (i + 1);
    return `<div class="bg-row">
      <div class="bg-rank">${opts.noRank ? '' : rank}</div>
      <div class="bg-body">
        <div class="bg-top"><span class="bg-label">${esc(r.label)}${r.star ? ` <span class="bg-star">${'★'.repeat(Math.min(r.star, 5))}</span>` : ''}</span><span class="bg-val">${esc(r.valText != null ? r.valText : fmt(r.value))}</span></div>
        <div class="bg-track"><div class="bg-fill" style="width:${pct}%"></div></div>
        ${r.sub ? `<div class="bg-sub">${esc(r.sub)}</div>` : ''}
      </div></div>`;
  }).join('');
  return `<div class="bargfx">${opts.title ? `<div class="bg-title">${esc(opts.title)}</div>` : ''}${bars}</div>`;
}

// A fun, league-first cover: illustrated art, a matchup-driven headline (chat
// included as a source), and a manager as the cover subject.
// The single most INTERESTING thing that happened this week — the story the
// cover should be built around. Ranks candidates by drama (an upset or a champ
// falling beats a blowout beats a nail-biter beats a power run), ties it to a
// running league arc when the same names are involved, and hands back a scene
// direction so the cover art is about THAT, never a generic football stock shot.
function topStoryline(nl) {
  const stories = (nl.stories || []).filter(s => s && s.winner && s.loser);
  const power = nl.powerRankings || [];
  const rankOf = {}; power.forEach(p => rankOf[p.manager] = p.rank);
  const deskArt = (S.desk || []).find(a => a.week === nl.week);
  const big = [...stories].filter(s => !s.tie).sort((a, b) => b.margin - a.margin)[0];
  const close = [...stories].filter(s => !s.tie).sort((a, b) => a.margin - b.margin)[0];
  const upsets = stories.filter(s => !s.tie)
    .map(s => ({ s, gap: (rankOf[s.winner.manager] || 99) - (rankOf[s.loser.manager] || 0) }))
    .filter(x => x.gap >= 3).sort((a, b) => b.gap - a.gap);
  const champLoss = stories.find(s => !s.tie && isDefending(s.loser.manager));
  const trade = (nl.trades || [])[0];
  const c = [];
  if (champLoss) c.push({ score: 92, kind: 'upset', subject: champLoss.winner, foe: champLoss.loser,
    label: `${champLoss.winner.manager} dethrones the champ`, blurb: `The defending champion ${champLoss.loser.manager} got taken down by ${champLoss.winner.manager}, ${champLoss.winner.score}–${champLoss.loser.score}.` });
  if (upsets[0]) c.push({ score: 84, kind: 'upset', subject: upsets[0].s.winner, foe: upsets[0].s.loser,
    label: `${upsets[0].s.winner.manager} shocks ${upsets[0].s.loser.manager}`, blurb: `A ${upsets[0].gap}-spot upset: ${upsets[0].s.winner.manager} stunned ${upsets[0].s.loser.manager}, ${upsets[0].s.winner.score}–${upsets[0].s.loser.score}.` });
  if (deskArt) c.push({ score: 74, kind: 'chat', subject: null, foe: null,
    label: deskArt.headline, blurb: `The group chat erupted: ${deskArt.headline}.` });
  if (big && big.margin >= 28) c.push({ score: 66, kind: 'blowout', subject: big.winner, foe: big.loser,
    label: `${big.winner.manager} buries ${big.loser.manager}`, blurb: `${big.winner.manager} laid a ${big.margin}-point beatdown on ${big.loser.manager}.` });
  if (trade) c.push({ score: 58, kind: 'trade', subject: null, foe: null,
    label: `A trade shakes the league`, blurb: `A deal went down that could reshape the race.` });
  if (close && close.margin <= 5) c.push({ score: 52, kind: 'nailbiter', subject: close.winner, foe: close.loser,
    label: `${close.winner.manager} survives ${close.loser.manager}`, blurb: `A ${close.margin}-point nail-biter: ${close.winner.manager} edged ${close.loser.manager}.` });
  if (power[0]) c.push({ score: 38, kind: 'power', subject: null, foe: null,
    label: `${power[0].manager} is running away with it`, blurb: `${power[0].manager} sits alone atop the power rankings.` });
  c.sort((a, b) => b.score - a.score);
  const top = c[0] || { kind: 'chaos', subject: null, foe: null, label: 'Another week of chaos', blurb: 'A wild, messy week across the league.' };
  // Tie to a running arc from the dossier when the same people are involved.
  const names = [top.subject && top.subject.manager, top.foe && top.foe.manager].filter(Boolean);
  const nrm = s => String(s || '').toLowerCase().replace(/[^a-z0-9]/g, '');
  const arc = (S.dossier && S.dossier.arcs || []).find(a => {
    const hay = nrm(a.title + ' ' + a.blurb);
    return names.some(n => hay.includes(nrm(n))) || (top.kind === 'upset' && /dynasty|coronation/i.test(a.title));
  }) || null;
  return { ...top, arc };
}
function coverPackage(nl) {
  const power = nl.powerRankings || [];
  const teams = nl.stories.flatMap(s => [s.winner, s.loser]);
  const big = [...nl.stories].filter(s => !s.tie).sort((a,b)=>b.margin-a.margin)[0];
  const close = [...nl.stories].filter(s => !s.tie).sort((a,b)=>a.margin-b.margin)[0];
  const leader = power[0], cellar = power[power.length - 1];
  const deskArt = (S.desk || []).find(a => a.week === nl.week);
  const U = s => String(s || '').toUpperCase();
  const seed = Math.round((nl.week || 1) * 13 + (big ? big.margin : 0) + (leader ? leader.manager.length : 0));
  const pick = (arr, o) => seededPick(arr, seed + o);

  const cands = [];
  if (deskArt) cands.push(U(deskArt.headline));              // let the group chat headline the issue
  if (big) cands.push(pick([`${U(big.winner.manager)} BURIES ${U(big.loser.manager)}`, `${U(big.loser.manager)} GETS LEFT FOR DEAD`, `MASSACRE: ${U(big.winner.manager)} RUNS IT UP`], 2));
  if (leader) cands.push(pick([`CAN ANYONE STOP ${U(leader.manager)}?`, `${U(leader.manager)} IS RUNNING AWAY WITH IT`], 3));
  if (close) cands.push(`${U(close.winner.manager)} STEALS ONE FROM ${U(close.loser.manager)}`);
  if (cellar) cands.push(`${U(cellar.manager)} HITS ROCK BOTTOM`);
  // Bias toward the chat headline when it exists, else the juiciest matchup.
  const headline = deskArt && pick([true, false, false], 5) ? cands[0] : pick(cands.filter(Boolean).slice(deskArt ? 1 : 0), 1) || 'ANOTHER WEEK OF CHAOS';

  const subjTeam = big ? big.winner : (leader ? teams.find(t => t.manager === leader.manager) : teams[0]);
  const subject = subjTeam ? {
    name: subjTeam.manager, score: subjTeam.score,
    tag: (big && subjTeam === big.winner) ? `${big.margin}-POINT DEMOLITION OF ${U(big.loser.manager)}` : leader && subjTeam.manager === leader.manager ? 'YOUR LEAGUE LEADER' : 'TOP DOG OF THE WEEK',
  } : null;

  // Cover teasers = real articles that are actually inside this issue, like a
  // true magazine cover. Each line points to a section the reader will find.
  const lines = [];
  const norm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const headlineKey = norm(headline);
  const pushArt = (label, hd) => { if (!hd) return; if (norm(hd) === headlineKey) return; // don't repeat the main hook
    lines.push(label ? `${label}: ${U(hd)}` : U(hd)); };
  if (nl.feature) pushArt(nl.feature.flag && /investigat|cold case|ledger|microfiche/i.test(nl.feature.flag) ? 'INVESTIGATION' : 'FEATURE', nl.feature.headline);
  // The best game stories that are written up inside.
  (nl.stories || []).filter(s => s && s.headline && !s.tie).sort((a, b) => (b.margin || 0) - (a.margin || 0))
    .slice(0, 2).forEach(s => pushArt('', s.headline));
  if (deskArt) pushArt('WATER COOLER', deskArt.headline);
  if (nl.lead && lines.length < 4) pushArt('THE LEAD', nl.lead.headline);
  // Segment callouts (only if the segment is actually in the issue).
  if ((nl.powerRankings || []).length && lines.length < 4) lines.push(`POWER RANKINGS BY THE MACHINES`);
  if ((nl.moneyLines || []).length && lines.length < 4) lines.push(`MONEY LINES BY PORK CHOP EXPRESS`);
  return { headline, subject, lines: lines.slice(0, 4) };
}
function coverHtml(nl) {
  const pkg = coverPackage(nl);

}

function lastSeasonFinish(){

  if (!i || !i.hasData || !i.stats || !i.stats.seasons || !i.stats.seasons.length) return map;
  const se = i.stats.seasons[0];
  const tmap = {}; (se.teams || []).forEach(t => tmap[t.id] = aliasOf(t.owner || t.name));
  (se.standings || []).forEach(st => { const who = tmap[st.teamId]; if (who && st.rank) map[normName(who)] = st.rank; });

}
function buildPredraft(){

  const posOf = id => (players[id]?.position || players[id]?.fantasy_positions?.[0] || '');
  const NEED = ['QB','RB','WR','TE'];
  const rk = id => { const r = players[id] && players[id].search_rank; return (typeof r === 'number' && r > 0) ? r : 99999; };
  let teams = b.rosters.map(r => {
    const u = r.owner_id ? b.usersById[r.owner_id] : null;
    const name = (u && (u.metadata?.team_name || u.display_name)) || ('Team ' + r.roster_id);
    const avatar = avatarUrl(u && u.avatar);
    const ids = (r.players || []).filter(id => id && players[id]);
    const roster = ids.map(id => ({ id, name: playerName(players[id], id), pos: posOf(id), rank: rk(id),
      age: players[id].age || null, team: players[id].team || 'FA', rookie: players[id].years_exp === 0 }));
    const skill = roster.filter(p => NEED.includes(p.pos)).sort((a, b) => a.rank - b.rank);
    const core = skill.slice(0, 5);
    const ages = roster.map(p => p.age).filter(Boolean);
    const avgAge = ages.length ? Math.round(ages.reduce((s, a) => s + a, 0) / ages.length * 10) / 10 : null;
    const bestByPos = {}; NEED.forEach(P => { const best = skill.find(p => p.pos === P); bestByPos[P] = best ? best.rank : 99999; });
    const needs = NEED.slice().sort((x, y) => bestByPos[y] - bestByPos[x]).slice(0, 2).filter(P => bestByPos[P] > 40);
    const strength = skill.filter(p => p.rank < 260).slice(0, 10).reduce((s, p) => s + Math.max(0, 260 - p.rank), 0);
    return { rosterId: r.roster_id, name, avatar, roster, core, skill, avgAge, needs, bestByPos, strength, hist: histFor(name) };
  });
  const maxStr = Math.max(1, ...teams.map(t => t.strength));
  teams.forEach(t => { t.strScore = t.strength / maxStr;
    const h = t.hist, pedi = h ? (h.titles * 0.14 + (h.wins / ((h.wins + h.losses) || 1)) * 0.5) : 0;
    t.power = t.strScore * 1.0 + pedi;
    const age = t.avgAge || 26, young = age <= 25, old = age >= 27, strong = t.strScore >= 0.66, weak = t.strScore <= 0.42;
    t.verdict = strong && old ? 'Win-now window' : strong && young ? 'Young and dangerous'
      : weak && young ? 'Full rebuild mode' : weak && old ? 'Stuck in the middle' : young ? 'On the rise' : 'In the mix';
  });
  const ranked = teams.slice().sort((a, b) => b.power - a.power);
  ranked.forEach((t, i) => t.seed = i + 1);
  // Preseason power rankings — "The Machines"
  const noteFor = (t) => {
    const bits = [];
    if (t.hist && t.hist.titles) bits.push(`${t.hist.titles}× champ pedigree`);
    if (t.core[0]) bits.push(`built around ${t.core[0].name}`);
    if (t.needs.length) bits.push(`must address ${t.needs.join(' & ')}`);
    bits.push(t.verdict.toLowerCase());

  };

    tag: t.hist && t.hist.titles ? `${t.hist.titles}× champ` : (t.avgAge ? `avg age ${t.avgAge}` : ''), note: noteFor(t) }));
  // Draft board — user order first, else real worst-to-first, else reverse power
  const userLines = String(pd.order || '').split(/\n/).map(s => s.trim()).filter(Boolean);
  const findTeam = nm => { const q = normName(nm); return teams.find(t => normName(t.name) === q) ||

  } else if (S.draftOrder && S.draftOrder.picks && S.draftOrder.picks.length) {

    orderAuto = false; orderReal = true;

      return { pick: p.pick, round: p.round, team: t ? t.name : p.team, from: p.from || '', need: t ? t.needs.join('/') : '' }; });
  } else {

    const withFin = teams.map(t => ({ t, fin: finish[normName((t.hist && t.hist.display) || t.name)] ?? null }));
    const known = withFin.filter(x => x.fin != null).sort((a, b) => b.fin - a.fin);

    const tot = hh.aWins + hh.bWins; if (tot < 4) continue; rivs.push({ a: A, b: B, aw: hh.aWins, bw: hh.bWins, tot });
  }
  rivs.sort((p, q) => q.tot - p.tot);
  const rivalries = rivs.slice(0, 3).map(r => ({ a: r.a, b: r.b,
    line: `${r.tot} career meetings — ${r.aw === r.bw ? `dead even at ${r.aw}–${r.bw}` : (r.aw > r.bw ? `${r.a} leads ${r.aw}–${r.bw}` : `${r.b} leads ${r.bw}–${r.aw}`)}.` }));

  const sup = [];

  if (mostT) sup.push({ emoji: '🏆', title: 'Most Pedigree', name: mostT.name, detail: `${mostT.hist.titles} title${mostT.hist.titles > 1 ? 's' : ''}${mostT.hist.titleYears.length ? ' (' + mostT.hist.titleYears.slice(0, 3).join(', ') + ')' : ''}.` });
  if (ranked[0]) sup.push({ emoji: '🧱', title: 'Deepest Roster', name: ranked[0].name, detail: 'Tops the preseason board on raw talent on hand.' });
  const young = teams.filter(t => t.avgAge).sort((a, b) => a.avgAge - b.avgAge)[0];
  if (young) sup.push({ emoji: '🌱', title: 'Rebuild Watch', name: young.name, detail: `Youngest roster in the league — avg age ${young.avgAge}.` });
  const old = teams.filter(t => t.avgAge).sort((a, b) => b.avgAge - a.avgAge)[0];

  const preds = [];
  if (champTeam) preds.push(champTeam.seed <= 3 ? `${champ} still looks the part — don't be shocked when the crown stays put.` : `The title hangover is real: ${champ} slips out of the top three this year.`);

  // The Column
  const span = (S.histIndex && S.histIndex.hasData) ? S.histIndex.span : '';
  const top3 = ranked.slice(0, 3).map(t => t.name);
  const cellar = ranked.slice(-2).map(t => t.name);
  const leadP = [];
  leadP.push(champ
    ? `${champ} sits on the throne heading into the draft${span ? `, the latest name on a trophy that goes back to ${span.split('–')[0]}` : ''}. The other ${teams.length - 1} are already sharpening the knives.`
    : `A fresh season opens with the board wide open and every roster telling itself this is the year.`);
  if (top3.length) leadP.push(`The machines have ${top3[0]} out front, with ${top3.slice(1).join(' and ')} in hot pursuit. If there's a favorite, it lives at the top of that list.`);
  if (cellar.length) leadP.push(`At the other end, ${cellar.join(' and ')} are staring down a rebuild — which, conveniently, means the top of the draft board runs through them.`);
  if (pd.storylines && pd.storylines.trim()) String(pd.storylines).split(/\n{2,}|\n/).map(s => s.trim()).filter(Boolean).forEach(s => leadP.push(s));

    paragraphs: leadP };

async function sharePredraft(){

  L.push('🔮 *PRESEASON POWER — The Machines*');

  try { await navigator.clipboard.writeText(text); toast('Copied — best shared as a PDF (⤓)'); } catch { showCopyModal(text); }

async function renderNews() {

// The colours/branding only print when Chrome's "Background graphics" is ON —
// it's OFF by default. Make that impossible to miss before the print dialog.
function showPrintTips() {
  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.innerHTML = `<div class="modal-box" style="max-width:420px">
    <div class="at" style="margin-bottom:10px;font-size:16px">🖨️ Before you save the PDF</div>
    <div class="dt" style="line-height:1.7;font-size:14px">
      In the print dialog:<br>
      • <b>Destination:</b> Save as PDF<br>
      • <b style="color:var(--accent)">Turn ON “Background graphics”</b> (under <i>More settings</i>) — this is what prints the colours, the masthead and all the branding. It’s off by default, which is why a plain white page comes out.<br>
      • <b>Margins:</b> Default.
    </div>
    <div style="height:14px"></div>
    <button class="btn" data-act="do-print" data-close="1">Open the print dialog →</button>
    <div style="height:8px"></div><button class="btn ghost" data-close="1">Cancel</button></div>`;
  wrap.addEventListener('click', e => {
    if (e.target.dataset.act === 'do-print') { wrap.remove(); setTimeout(() => window.print(), 250); return; }
    if (e.target === wrap || e.target.dataset.close) wrap.remove();
  });
  document.body.appendChild(wrap);
}

// The full magazine body (everything under the cover). frozen=true drops the
// interactive bits so a saved back-issue renders as a clean, static read.
function issueBodyHtml(nl, deskArts, frozen) {
  const wk = nl.week;
  S.viewDesk = deskArts || [];   // what the share buttons read for Water Cooler pieces
  const lead = `<div class="lead"><h1>${esc(nl.lead.headline)}</h1>
    <div class="standfirst">${esc(nl.lead.standfirst)}</div>
    ${nl.lead.paragraphs.map(p=>`<p class="body">${esc(p)}</p>`).join('')}</div>`;
  const feature = nl.feature ? articleHtml(nl.feature, true) : '';
  const desk = (deskArts && deskArts.length)
    ? deskArts.map(a => articleHtml(a, false, (frozen || S.guest) ? null : a.id) + shareRow('desk:' + a.id)).join('')
    : ((frozen || S.guest) ? `<div class="card" style="text-align:center"><div class="dt">No group-chat column in this issue.</div></div>`
      : `<div class="card" style="text-align:center"><div class="dt" style="margin-bottom:10px">No dispatches yet. Paste your league group chat and the desk will write one up.</div><button class="btn" data-act="desk">✍️ Write from the group chat</button></div>`);
  const awards = nl.awards.length ? `<div class="card awards" style="border-color:var(--accent-d)">
    <div class="at">Week ${wk} Superlatives</div>
    ${nl.awards.map(a=>`<div class="award"><span class="em">${a.emoji}</span><div style="flex:1">
      <div class="lab">${esc(a.title)}</div><div class="nm">${esc(a.name)}</div><div class="dt">${esc(a.detail)}</div>
    </div></div>`).join('')}</div>` : '';
  const prRows = nl.powerRankings || [];
  const usePts = prRows.some(p => p.week);
  const maxW = Math.max(...prRows.map(p => p.week || 0), 1);
  const nrows = prRows.length || 1;
  const power = prRows.length ? `<div class="card">
    ${columnMasthead(LOGO_MACHINES, 'The Machines', `Power Rankings${nl.powerSource === 'commish' ? ' · from the league office' : ''}`)}
    ${prRows.map(p => { const pct = usePts ? Math.round((p.week / maxW) * 100) : Math.round(((nrows - p.rank + 1) / nrows) * 100);
      return `<div class="pr">
      <span class="ovr" style="width:24px">${p.rank}</span>
      <div style="flex:1">
        <div class="nm">${esc(p.manager)}${p.tag ? ` <span class="faint" style="font-weight:600;font-size:12px">${esc(p.tag)}</span>` : ''}</div>
        <div class="prbar"><div class="prfill" style="width:${pct}%"></div></div>
        ${p.note ? `<div class="dt">${esc(p.note)}</div>` : ''}
      </div></div>`; }).join('')}</div>` : '';
  const mlRows = nl.moneyLines || [];
  const money = mlRows.length ? `<div class="card">
    ${columnMasthead(LOGO_PCE, 'Pork Chop Express', `The Betting Board${nl.moneySource === 'auto' ? ' · sample lines' : ''}`)}
    ${moneyLinesHtml(mlRows)}</div>` : '';
  const coverStory = nl.stories[0] ? storyHtml(nl.stories[0], true) + shareRow('story:0') : '';
  const otherStories = nl.stories.slice(1).map((s, i) => storyHtml(s, false) + shareRow('story:' + (i + 1))).join('');
  const trades = nl.trades && nl.trades.length
    ? nl.trades.map((t, i) => tradeCardHtml(t) + shareRow('trade:' + i)).join('')
    : `<div class="card" style="text-align:center"><div class="dt">${seededPick(['Not a single trade this week. A league full of cowards.', 'The trade market was dead. Everybody clutching their roster like it’s worth a damn.', 'No deals went down. Gutless week on the wire.'], (wk || 1) * 5)}</div></div>`;
  const colophon = `<div class="colophon">Auto-written from real Sleeper box scores — every stat line and margin is genuine. The voice, jokes, and profanity are on the house.</div>`;
  const numbers = numbersHtml(nl.numbers);
  return sec('Cover Story') + coverStory
    + sec('The Column') + lead + shareRow('lead')
    + (feature ? sec('League Feature') + feature + shareRow('feature') : '')
    + (numbers ? sec('By the Numbers') + numbers + shareRow('numbers') : '')
    + (power ? power + shareRow('power') : '')
    + (money ? money + shareRow('money') : '')
    + studsDudsHtml(nl.studs, nl.duds) + ((nl.studs && nl.studs.length) || (nl.duds && nl.duds.length) ? shareRow('studsduds') : '')
    + shameHtml(nl.shame) + ((nl.shame && nl.shame.length) ? shareRow('shame') : '')
    + awards + (nl.awards.length ? shareRow('awards') : '')
    + sec('The Trade Block') + trades
    + sec('The Water Cooler') + desk
    + (otherStories ? sec('More Game Stories') + otherStories : '')
    + colophon;
}

function judgeTrade(net, giveVal) {
  const base = Math.max(giveVal, 20), pct = net / base;
  if (giveVal === 0) return { label:'Build your offer', detail:'Tap players on each side to see the verdict.', color:'var(--faint)' };
  if (pct > 0.15)  return { label:'You win this trade', detail:"You're getting meaningfully more value than you send.", color:'var(--accent)' };
  if (pct < -0.15) return { label:"You're overpaying", detail:'You send more value than you get back — ask for a sweetener.', color:'var(--red)' };

}

function ordinal(n) { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
async function buildTradeReview(wk) {

function reviewTrade(t, V) {
  const b = S.bundle;
  const ridMgr = (rid) => { const r = b.rosters.find(x => x.roster_id === rid); return r ? managerName(r.owner_id) : ('Team ' + rid); };
  const pinfo = (id) => { const p = b.players[id]; return { id, name: playerName(p, id), pos: posOfPlayer(p) || '', val: Math.round(V.value(id)) }; };
  const parts = (t.roster_ids || []).slice();
  if (parts.length < 2) return null;
  const adds = t.adds || {}, budgets = t.waiver_budget || [], picks = t.draft_picks || [];
  const sides = parts.map(rid => {
    const received = Object.keys(adds).filter(pid => adds[pid] === rid).map(pinfo).sort((a, b) => b.val - a.val);
    const faabIn = budgets.filter(w => w.receiver === rid).reduce((s, w) => s + (w.amount || 0), 0);
    const picksIn = picks.filter(dp => dp.owner_id === rid && dp.previous_owner_id !== rid)
      .map(dp => `${dp.season} ${ordinal(dp.round)} pick`);
    const recvVal = sum(received.map(p => p.val)) + faabIn * 0.25;
    return { rid, manager: ridMgr(rid), received, faabIn, picksIn, recvVal };
  });
  const nameList = (arr) => arr.length ? joinList(arr.map(p => p.name)) : '';
  const extras = (s) => { const e = []; if (s.faabIn) e.push(`$${s.faabIn} FAAB`); s.picksIn.forEach(p => e.push(p)); return e; };
  const seed = Math.round((t.created || 0) / 1e6) + parts.reduce((a, r) => a + r, 0) + Math.round(sum(sides[0].received.map(p => p.val)));
  const pick = (arr, o) => seededPick(arr, seed + o);

  // Two-team deal — the common case, and the one worth real commentary.
  if (sides.length === 2) {
    const A = sides[0], B = sides[1];
    const aGot = [...A.received, ...extras(A).map(x => ({ name: x, val: 0 }))];
    const bGot = [...B.received, ...extras(B).map(x => ({ name: x, val: 0 }))];
    const aHead = A.received[0], bHead = B.received[0];
    const diff = Math.round(A.recvVal - B.recvVal);
    const winner = diff >= 0 ? A : B, loser = diff >= 0 ? B : A;
    const margin = Math.abs(diff);
    const scale = Math.max(A.recvVal, B.recvVal, 20);

    const tilted = !lopsided && margin >= scale * 0.12 && margin >= 8;
    const U = s => String(s || '').toUpperCase();

    let headline;
    if (lopsided) headline = pick([`${winner.manager} Fleeces ${loser.manager}`, `${loser.manager} Got Robbed in Broad Daylight`, `${winner.manager} Wins the Trade Before the Ink Dries`], 1);
    else if (tilted) headline = pick([`${winner.manager} Gets the Better of ${loser.manager}`, `Edge to ${winner.manager} in Swap with ${loser.manager}`], 1);
    else headline = pick([`${A.manager} and ${B.manager} Make an Honest Deal`, `${A.manager}, ${B.manager} Trade Even-Up`], 1);

    const P = [];
    // The deal itself.
    const aSent = nameList(B.received) || (extras(A).length ? '' : 'a bag of magic beans');
    const aExtra = extras(A).length ? ` (plus ${joinList(extras(A))} headed their way)` : '';
    const bExtra = extras(B).length ? ` (plus ${joinList(extras(B))})` : '';
    P.push(`${A.manager} shipped ${nameList(B.received) || 'nothing but paperwork'}${bExtra} to ${B.manager} in exchange for ${nameList(A.received) || 'a warm handshake'}${aExtra}.`);
    // The verdict.
    if (lopsided && (aHead || bHead)) {
      P.push(pick([
        `Let's not dress it up: by our board this is highway robbery. ${winner.manager} walks away +${margin} in projected value, headlined by ${(winner.received[0]||{}).name || 'the haul'}. ${loser.manager}, buddy, call somebody before you do that again.`,
        `Our valuations have ${winner.manager} winning this by ${margin} points, and it isn't close. ${(winner.received[0]||{}).name || 'The centerpiece'} alone tilts the whole thing. Somewhere ${loser.manager} is telling themselves it was about "fit."`,
      ], 2));
    } else if (tilted) {
      P.push(pick([
        `Reasonable deal, but the needle tips toward ${winner.manager} — about +${margin} in value, with ${(winner.received[0]||{}).name || 'the return'} the piece that moves it. ${loser.manager} can live with it if the fit's right.`,
        `Close enough to be defensible, but ${winner.manager} got the slightly fatter end (+${margin}). Both of these clowns will claim they won, as they always do.`,
      ], 2));
    } else {
      P.push(pick([
        `This one's a genuine coin-flip — value's within ${margin <= 2 ? 'a point or two' : margin + ' points'} either way. Both sides addressed a need, nobody got hosed, and that's honestly the rarest result in this league.`,
        `Dead even by the numbers. ${A.manager} and ${B.manager} each got a guy they wanted, and for once the group chat has nothing to scream about. Boring. We approve.`,
      ], 2));

      dek: lopsided ? `A lopsided one — and everybody knows it.` : tilted ? `A slight edge, dissected.` : `A fair swap, for once.`,
      byline: 'The Trade Desk', paragraphs: P, sides };
  }

  // Multi-team blockbuster — summarize each haul, crown the biggest winner.
  const ranked = [...sides].sort((a, b) => b.recvVal - a.recvVal);
  const P = [`A ${sides.length}-team blockbuster went through. ` +
    sides.map(s => `${s.manager} lands ${nameList(s.received) || joinList(extras(s)) || 'future considerations'}`).join('; ') + '.'];
  P.push(`By our board, ${ranked[0].manager} made out best on paper — the rest can argue about it in the chat, which they will.`);
  return { id: 'trade_' + (t.transaction_id || seed), kind: 'trade',
    headline: `${sides.length}-Team Blockbuster Shakes Up the League`, dek: `Everybody got something. Somebody got fleeced.`,
    byline: 'The Trade Desk', paragraphs: P, sides };
}

// ---------------------------------------------------------------------
//  The Trade Court — every completed trade in league HISTORY, graded on
//  today's market ($ scale, 1.01 = $100, same board as the Trade Value
//  Report / calculator), and every CURRENT GM judged from shark to mark.
//  Player prices come from the $-value engine; picks from a calibrated
//  round model; deals net out via adds (received) vs drops (gave up) so
//  N-team blockbusters settle correctly.
// ---------------------------------------------------------------------
const TC_PICK_KNOWN  = { 1: 48, 2: 18, 3: 6, 4: 3 };   // avg in-round $, past/known draft
const TC_PICK_FUTURE = { 1: 40, 2: 15, 3: 5, 4: 2 };   // unknown-slot future pick $
const TC_WIN = 12;                                      // $ net that counts as a win
function tcMoney(n) { const r = Math.round(n); return (r < 0 ? '-$' : '$') + Math.abs(r); }
function tcPickVal(dp, nowSeason) {
  const r = dp.round || 1;
  const yr = parseInt(dp.season) || nowSeason;
  const out = yr - nowSeason;                           // >0 = still a future pick today
  if (out >= 1) { let v = TC_PICK_FUTURE[r] || 1; if (out >= 2) v = Math.round(v * Math.pow(0.88, out - 1)); return v; }
  return TC_PICK_KNOWN[r] || 1;
}
function tcPickLabel(dp) {
  const r = dp.round || 1, suf = r === 1 ? '1st' : r === 2 ? '2nd' : r === 3 ? '3rd' : r + 'th';
  return `${dp.season} ${suf}`;
}
function tcPlayerVal(id) {
  const b = S.bundle, p = b && b.players ? b.players[id] : null;
  const dv = (typeof playerDollarValue === 'function') ? playerDollarValue(playerName(p, id)) : null;
  if (dv && dv.val) return dv.val;
  return ({ QB: 22, RB: 18, WR: 18, TE: 10, K: 2, DEF: 2 })[posOfPlayer(p)] || 8;  // retired/unknown floor
}
// Score one raw Sleeper trade on the $ board. Uses adds (who got a player) and
// drops (who gave one up), plus draft picks and FAAB, so each side's net is exact.
function tcScoreTrade(t, ridToOwner, nowSeason) {
  const rids = (t.roster_ids || []).slice();
  if (rids.length < 2) return null;
  const adds = t.adds || {}, drops = t.drops || {}, picks = t.draft_picks || [], faab = t.waiver_budget || [];
  const side = {};
  rids.forEach(rid => side[rid] = { rid, owner: ridToOwner[rid] || null, recv: 0, gave: 0, got: [] });
  const nm = id => playerName(S.bundle.players[id], id), ps = id => posOfPlayer(S.bundle.players[id]) || '';
  for (const pid in adds)  { const rid = adds[pid];  if (side[rid]) { const v = tcPlayerVal(pid); side[rid].recv += v; side[rid].got.push({ name: nm(pid), pos: ps(pid), val: v, kind: 'p' }); } }
  for (const pid in drops) { const rid = drops[pid]; if (side[rid]) side[rid].gave += tcPlayerVal(pid); }
  picks.forEach(dp => {
    if (dp.owner_id === dp.previous_owner_id) return;
    const v = tcPickVal(dp, nowSeason);
    if (side[dp.owner_id])          { side[dp.owner_id].recv += v; side[dp.owner_id].got.push({ name: tcPickLabel(dp) + ' pick', val: v, kind: 'k' }); }
    if (side[dp.previous_owner_id])   side[dp.previous_owner_id].gave += v;
  });
  faab.forEach(w => { const v = Math.round((w.amount || 0) * 0.03);
    if (side[w.receiver]) { side[w.receiver].recv += v; if (v) side[w.receiver].got.push({ name: `$${w.amount} FAAB`, val: v, kind: 'f' }); }
    if (side[w.sender]) side[w.sender].gave += v; });
  const sides = rids.map(rid => { const s = side[rid]; s.net = s.recv - s.gave; s.got.sort((a, b) => b.val - a.val); return s; });
  return { id: t.transaction_id, created: t.created || 0, sides };
}
// Walk every season, pull all completed trades, grade them, tally each owner.
async function tcBuildLedger() {
  try { await ensureValues(); } catch {}
  const b = S.bundle;
  const nowSeason = parseInt(b.league.season) || 0;
  const history = await buildLeagueHistory(b.league);        // newest → oldest
  const currentOwners = new Set(Object.keys(b.usersById));
  const ledger = {}, allTrades = [], coverage = [];
  for (const lg of history) {
    let rosters, users;
    try { [rosters, users] = await Promise.all([getRosters(lg.league_id), getLeagueUsers(lg.league_id)]); } catch { coverage.push({ season: lg.season, trades: 0, error: true }); continue; }
    const ridToOwner = {}; (rosters || []).forEach(r => ridToOwner[r.roster_id] = r.owner_id);
    const uById = {}; (users || []).forEach(u => uById[u.user_id] = u);
    // Weeks 0-18 covers offseason legs + the full season; invalid legs return [].
    const wkTxns = await Promise.all(Array.from({ length: 19 }, (_, i) => i).map(w => getTransactions(lg.league_id, w).catch(() => [])));
    const txns = [].concat(...wkTxns).filter(t => t && t.type === 'trade' && t.status === 'complete');
    coverage.push({ season: lg.season, trades: txns.length });
    for (const t of txns) {
      const scored = tcScoreTrade(t, ridToOwner, nowSeason);
      if (!scored) continue;
      scored.leagueSeason = lg.season;
      scored.sides.forEach(s => {
        const u = uById[s.owner] || b.usersById[s.owner];
        s.name = u ? (u.metadata && u.metadata.team_name || u.display_name || 'Manager') : 'Departed GM';
        s.current = currentOwners.has(s.owner);
        if (!s.owner) return;
        const L = ledger[s.owner] || (ledger[s.owner] = { owner: s.owner, name: s.name, current: s.current, trades: 0, net: 0, recv: 0, gave: 0, wins: 0, losses: 0, even: 0, best: null, worst: null });
        L.name = s.name; L.trades++; L.net += s.net; L.recv += s.recv; L.gave += s.gave;
        if (s.net > TC_WIN) L.wins++; else if (s.net < -TC_WIN) L.losses++; else L.even++;
        if (!L.best  || s.net > L.best.net)  L.best  = { net: s.net, trade: scored };
        if (!L.worst || s.net < L.worst.net) L.worst = { net: s.net, trade: scored };
      });
      allTrades.push(scored);
    }
  }
  return { allTrades, ledger, nowSeason, seasons: history.map(h => h.season), coverage };
}
function tcVerdict(net) {
  if (net >= 55)  return { ic: '🦈', tag: 'The Shark',    line: 'Fleeces the league for sport. Stop answering their texts.' };
  if (net >= 18)  return { ic: '📈', tag: 'Operator',     line: 'Wins more than they lose and knows it.' };
  if (net > -18)  return { ic: '⚖️', tag: 'Fair Dealer',  line: 'Trades roughly even. Boringly, suspiciously honest.' };
  if (net > -55)  return { ic: '📉', tag: 'Overpayer',    line: 'Reaches, and pays the tax every single time.' };
  return          { ic: '🎁', tag: 'The Mark',    line: 'A standing charity to the rest of the league.' };
}
// The chat-derived trade record: per-team deal VOLUME (2021-2026) and the
// landmark precedents, both mined from the league group chat in a prior pass.
// This is activity, not net value — it covers all 16 teams the Sleeper-era

function tcChatLedger() {
  const I = S.draftIntel || {}, tm = I.tradeMarket || {};
  const raw = tm.activeTraders || '';
  const after = raw.split(':').slice(1).join(':');
  const vol = []; const re = /([A-Za-z][A-Za-z .'’\-]+?)\s+(\d+)/g; let m;
  while ((m = re.exec(after))) { const team = m[1].trim().replace(/[.,]+$/, ''); const n = +m[2]; if (team && n) vol.push({ team, count: n }); }
  vol.sort((a, b) => b.count - a.count);
  const precedents = (I.tradePrecedents || []).map(p => p.deal).filter(Boolean);

function tcChatAssetVal(a, season, atTime) {

function tcGradeChatLedger() {

// Consensus rank, RE-WEIGHTED FOR NON-PPR. Sleeper's search_rank is a
// PPR-leaning consensus, so a standard-scoring room drafts differently:
// per-player adjustments from the class research where we have them, else
// positional defaults (RBs rise, catch-volume WRs/TEs fall).
function adpRankFn(pool) {
  const b = S.bundle; const rankIdx = new Map(pool.map((id, i) => [id, i]));
  const I = S.draftIntel || {};
  const byName = new Map(((I.classBoard) || []).filter(p => p.scoringAdj != null).map(p => [normName(p.name), p.scoringAdj]));
  const POS_ADJ = { RB: -2, WR: 0.5, TE: 1, QB: 0 };
  return id => {
    const p = b.players[id];
    const r = p && p.search_rank;
    const base = (typeof r === 'number' && r > 0) ? r : ((rankIdx.get(id) ?? 500) + 300);
    const named = byName.get(normName(playerName(p, id)));
    const adj = named != null ? named : (POS_ADJ[posOfPlayer(p)] || 0);
    return base + adj;

}

function boardAtSlot(m, slot, count) {

    .filter(p => p.pct >= 0.12)

      <div>
        <div class="seclabel" style="margin-bottom:6px">📥 You get <span style="float:right;color:var(--accent);font-weight:800">$${getR}${C.qb && getA !== getR ? ` <span style="color:#f5b301;font-size:11px">($${getA} w/ tax)</span>` : ''}</span></div>

// Trade evaluator: what moving up/down actually buys you, in players and points.

//  Godwin → 9), cross-checked against the standard pick-value chart.
function leaguePrice(delta) {
  const a = Math.abs(delta);
  if (a <= 20) return 'a swap of late sweeteners';
  if (a <= 40) return '≈ a late 2nd or a depth vet (the Moore-for-27 tier)';
  if (a <= 70) return '≈ a FUTURE 2nd (the twice-run “28 + future 2nd → 23” deal)';
  if (a <= 110) return '≈ a solid vet starter (Hubbard→17 / Kupp→22 tier)';
  if (a <= 160) return '≈ a FUTURE 1st (Big Blue’s 16 ↔ future-1st deal)';
  return '≈ a star player or startable QB (Godwin→9 / McCarthy→1.01 tier)';

async function deskGenerate(opts) {

  const angle = ($(pd ? '#pdChatAngle' : '#chatAngle') || {}).value || '';
  const err = $(pd ? '#pdDeskErr' : '#deskErr');
  const btn = document.querySelector(pd ? '[data-act="predraft-desk-generate"]' : '[data-act="desk-generate"]');
  if (err) err.textContent = '';
  if (text.trim().length < 8) { if (err) err.textContent = 'Import your chat file or paste a snippet first.'; return; }
  if (!parseChat(text).length) { if (err) err.textContent = "Couldn't find any 'Name: message' lines in that. Make sure it's a chat export."; return; }

  let art = null;
  const useAI = !!(S.apiKey || '').trim();
  if (btn) { btn.disabled = true; btn.textContent = useAI ? 'Claude is writing…' : 'Writing…'; }
  try {
    if (useAI) {
      try {
        art = await generateChatArticleAI(text, angle);
      } catch (e) {
        // Soft-fail to the offline template so the manager still gets an article.
        art = generateChatArticle(text, angle);
        const why = (e && /^api-401/.test(e.message)) ? 'that API key was rejected'
          : (e && /^api-/.test(e.message)) ? 'the Claude API returned an error'
          : 'the AI writer is unreachable';
        toast(`Used the offline writer — ${why}.`);
      }
    } else {
      art = generateChatArticle(text, angle);
    }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Write the article →'; }
  }
  if (!art) { if (err) err.textContent = "Couldn't turn that into an article. Make sure it's a chat export."; return; }
  if (pd) {
    art.predraft = true;
    S.desk.unshift(art); saveDesk();
    archiveArticle(art, { section: 'The Water Cooler · Offseason' });
    toast('Offseason article added to the Draft Issue');
    return showPredraftDesk();
  }
  art.week = S.activeWeek;
  S.desk.unshift(art); saveDesk();
  archiveArticle(art, { week: S.activeWeek, section: 'The Water Cooler' });
  S.deskChatText = null;
  delete S.newsCache[S.activeWeek];
  S.tab = 'stories'; renderShell(); renderTab();
  toast('Article added to The Water Cooler');
}

    if (!title.trim()) { toast('Give it a title'); return; }
    S.storylines = S.storylines || { custom: [], status: {}, hidden: [] };
    const id = t.dataset.id;
    if (id) { const a = S.storylines.custom.find(x => x.id === id); if (a) { a.title = title.trim(); a.blurb = blurb.trim(); a.status = status; } }
    else S.storylines.custom.unshift({ id: 'user_' + storyIdOf(title) + '_' + (S.storylines.custom.length + 1), title: title.trim(), blurb: blurb.trim(), status });
    saveStorylines(); S.newsCache = {}; toast('Storyline saved'); return showStorylines();
  }
  if (act === 'storyline-delete') { S.storylines.custom = (S.storylines.custom || []).filter(x => x.id !== t.dataset.id); if (S.storylines.status) delete S.storylines.status[t.dataset.id]; saveStorylines(); S.newsCache = {}; return showStorylines(); }
  if (act === 'storyline-hide') { S.storylines = S.storylines || { custom: [], status: {}, hidden: [] }; S.storylines.hidden = [...new Set([...(S.storylines.hidden || []), t.dataset.id])]; saveStorylines(); S.newsCache = {}; return showStorylines(); }
  if (act === 'storyline-unhide-all') { if (S.storylines) S.storylines.hidden = []; saveStorylines(); S.newsCache = {}; return showStorylines(); }
  if (act === 'archive-articles') return showArticleArchive();
  if (act === 'arch-read') return showArchivedArticle(t.dataset.id);
  if (act === 'quiz-save') {
    const wk = t.dataset.week; const ans = {};
    document.querySelectorAll('[data-quiz]').forEach(el => { const v = (el.value || '').trim(); if (v) ans[el.dataset.quiz] = v; });
    S.quiz = S.quiz || {}; if (Object.keys(ans).length) S.quiz[wk] = ans; else delete S.quiz[wk];
    saveQuiz(); delete S.newsCache[wk]; toast('Brief saved — the desk will build around it'); return showDashboard();
  }
  if (act === 'quiz-clear') { if (S.quiz) delete S.quiz[t.dataset.week]; saveQuiz(); delete S.newsCache[t.dataset.week]; toast('Brief cleared'); return showDashboard(); }
  if (act === 'cal-new') return showCalendarForm(null);
  if (act === 'cal-edit') return showCalendarForm(t.dataset.id);
  if (act === 'cal-save') {
    const title = (($('#calTitle') || {}).value || '').trim(); const date = ($('#calDate') || {}).value || '';
    const type = ($('#calType') || {}).value || 'event'; const note = (($('#calNote') || {}).value || '').trim();
    if (!title || !date) { toast('Add a title and a date'); return; }
    S.calendar = S.calendar || [];
    const id = t.dataset.id;
    if (id) { const ev = S.calendar.find(x => x.id === id); if (ev) { ev.title = title; ev.date = date; ev.type = type; ev.note = note; } }
    else S.calendar.push({ id: 'c' + (S.calendar.length + 1) + '_' + date, date, type, title, note, custom: true });
    saveCalendar(); toast(id ? 'Date updated' : 'Added to the calendar'); return showCalendar();
  }
  if (act === 'cal-delete') { S.calendar = (S.calendar || []).filter(x => x.id !== t.dataset.id); saveCalendar(); return showCalendar(); }
  if (act === 'cover-art') return showCoverArt(t.dataset.kind || 'week');
  if (act === 'gen-cover-prompt') {
    const kind = t.dataset.kind || 'week';
    const btn = t, err = $('#coverPromptErr'); if (err) err.textContent = '';
    if (!(S.apiKey || '').trim()) { if (err) err.textContent = 'Add your Anthropic API key in Settings first.'; return; }
    if (kind === 'predraft' ? !(S.currentPredraft || buildPredraft()) : !S.currentNl) { if (err) err.textContent = kind === 'predraft' ? 'Build the Pre-Draft Issue first.' : 'Open a week with a scored issue first.'; return; }
    btn.disabled = true; btn.textContent = '✨ Writing the direction…';
    try { const p = await generateCoverPrompt(kind); S.coverPrompt = S.coverPrompt || {}; S.coverPrompt[coverSlotFor(kind)] = p; showCoverArt(kind); }
    catch (e) { btn.disabled = false; btn.textContent = '✨ Generate cover direction'; if (err) err.textContent = /^api-401/.test(e.message) ? 'That API key was rejected.' : /^api-/.test(e.message) ? 'The AI is unreachable right now.' : 'Something went wrong — try again.'; }
    return;
  }
  if (act === 'copy-cover-prompt') { const ta = $('#coverPromptTxt'); if (ta) { try { await navigator.clipboard.writeText(ta.value); toast('Prompt copied — paste into your image AI'); } catch { ta.select(); } } return; }
  if (act === 'cover-img-clear') { const kind = t.dataset.kind || 'week'; const slot = coverSlotFor(kind); if (S.coverImg) delete S.coverImg[slot]; saveCoverImg(); if (kind !== 'predraft') delete S.newsCache[S.activeWeek]; return showCoverArt(kind); }
  if (act === 'copy-espn') { try { await navigator.clipboard.writeText(ESPN_SNIPPET); toast('Snippet copied'); } catch { showCopyModal(ESPN_SNIPPET); } return; }
  if (act === 'history-clear') { S.espnHist = null; saveEspnHist(); refreshHistIndex(); S.newsCache = {}; toast('History removed'); return showHistory(); }
  if (act === 'alias-clear') { S.histAliases = {}; saveHistAliases(); refreshHistIndex(); S.newsCache = {}; toast('Name merges reset'); return showHistory(); }
  if (act === 'save-issue') return saveCurrentIssue();
  if (act === 'open-issue') return openSavedIssue(t.dataset.id);
  if (act === 'delete-issue') { e.stopPropagation(); return deleteSavedIssue(t.dataset.id); }
  if (act === 'back-archive') { S.reading = false; return showArchive(); }
  if (act === 'desk-generate') return deskGenerate();
  if (act === 'power-clear') { if (S.power) delete S.power[S.activeWeek]; savePower(); delete S.newsCache[S.activeWeek]; return showDesk(); }
  if (act === 'money-clear') { if (S.money) delete S.money[S.activeWeek]; saveMoney(); delete S.newsCache[S.activeWeek]; return showDesk(); }
  if (act === 'publish-draft') return openProof(t.dataset.kind || 'week');
  if (act === 'publish') return publishFinal(t.dataset.kind || 'week');
  if (act === 'proof-edit') return proofEdit();
  if (act === 'predraft') return showPredraftDesk();
  if (act === 'draft-room') { S.reading = false; S.tab = 'draft'; renderShell(); return renderTab(); }
  if (act === 'predraft-view') return showPredraft();
  if (act === 'predraft-build') { readPredraftForm(); return showPredraft(); }
  if (act === 'predraft-save-notes') { readPredraftForm(); toast('Saved'); return showPredraftDesk(); }
  if (act === 'predraft-share') return sharePredraft();
  if (act === 'predraft-save-issue') return savePredraftIssue();
  if (act === 'predraft-clear-futures') { S.predraft = S.predraft || defaultPredraft(); S.predraft.futures = []; savePredraft(); return showPredraftDesk(); }
  if (act === 'predraft-desk-generate') return deskGenerate({ predraft: true });
  if (act === 'predraft-desk-delete') { S.desk = (S.desk || []).filter(a => a.id !== t.dataset.id); saveDesk(); return showPredraftDesk(); }
  if (act === 'desk-delete') { S.desk = S.desk.filter(a => a.id !== t.dataset.id); saveDesk(); delete S.newsCache[S.activeWeek];
    if ($('#setbody') || document.querySelector('.setup-logo')) return showDesk(); renderShell(); return renderTab(); }
  if (act === 'back' || act === 'back-news') { S.reading = false; if (S.tab !== 'stories' && S.tab !== 'create') S.tab = 'menu'; renderShell(); return renderTab(); }
  if (act === 'signout') { localStorage.removeItem(SKEY); S.user=S.leagueId=S.season=S.bundle=S.history=null; return renderSetup(); }
  if (act === 'switch-league') { S.leagueId=t.dataset.id; S.season=t.dataset.season; saveSession(); return enterApp(); }
  if (act === 'trade-partner') { S.trade.partnerId = Number(t.dataset.id); S.trade.get = new Set(); return drawTrade(); }
  if (act === 'trade-toggle') { const set=S.trade[t.dataset.side], id=t.dataset.id; set.has(id)?set.delete(id):set.add(id); return drawTrade(); }
  if (act === 'mock-rookies') { S.draft.rookiesOnly = !S.draft.rookiesOnly; S.draft.mock = null; return drawWarRoom(); }
  if (act === 'mock-run') { toast('Running 200 mocks…'); setTimeout(() => { S.draft.mock = runMockDraft(200); S.draft.mockStale = false; drawWarRoom(); const el = document.getElementById('warMock'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 30); return; }
  if (act === 'intel-add') {
    const team = ($('#intelTeam') || {}).value || '';
    const itype = S.draft.intelType || 'takes';
    S.draft.intel = S.draft.intel || [];
    if (itype === 'takes') {
      const disp = (($('#intelPlayer') || {}).value || '').trim();
      if (!team || !disp) { toast('Pick a team and a player'); return; }
      const b = S.bundle; const pool = draftMockPool();
      const id = pool.find(pid => (playerName(b.players[pid], pid) + ' · ' + (b.players[pid]?.team || 'FA')) === disp)
        || pool.find(pid => normName(playerName(b.players[pid], pid)) === normName(disp.split(' · ')[0]));
      if (!id) { toast("Couldn't find that player in the draftable pool"); return; }
      S.draft.intel.push({ type: 'takes', team, playerId: id, playerName: playerName(b.players[id], id) });
    } else if (itype === 'leans' || itype === 'avoids') {
      const pos = ($('#intelPos') || {}).value || '';
      if (!team || !pos) { toast('Pick a team and a position'); return; }
      S.draft.intel.push({ type: itype, team, pos });
    } else if (itype === 'bpa') {
      if (!team) { toast('Pick a team'); return; }
      S.draft.intel.push({ type: 'bpa', team });
    } else {
      const text = (($('#intelText') || {}).value || '').trim();
      if (!text) { toast('Write the note first'); return; }
      S.draft.intel.push({ type: 'note', team, text });
    }
    saveDraftState();
    if (S.draft.mock) S.draft.mockStale = true;   // don't auto-run — mark stale, wait for a manual Re-run
    toast(S.draft.mock ? 'Condition added — hit “Re-run the mock” up top to apply' : 'Intel logged');
    drawWarRoom();
    setTimeout(() => { const el = document.getElementById('warIntel'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50);
    return;
  }
  if (act === 'intel-remove') { S.draft.intel = (S.draft.intel || []).filter((_, i) => i !== +t.dataset.i); saveDraftState(); if (S.draft.mock) S.draft.mockStale = true; drawWarRoom(); setTimeout(() => { const el = document.getElementById('warIntel'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 50); return; }
  if (act === 'pv-lookup') {
    const inp = $('#pvLookup'), r = $('#pvResult'); const q = ((inp && inp.value) || '').trim();
    if (!r) return; if (!q) { r.innerHTML = ''; return; }
    const v = playerDollarValue(q);
    r.innerHTML = v
      ? `<span style="color:var(--accent);font-weight:800;font-size:15px">$${v.val}</span> &nbsp;<b>${esc(v.name || q)}</b> <span class="faint">(${esc(v.pos)})</span><br><span class="faint" style="font-size:11px">${esc(v.src)}${v.est ? ' — rough estimate; confirm with the tiers below or ask the Advisor' : ''}</span>
        <div style="margin-top:7px;display:flex;gap:6px">
          <button data-act="pv-add" data-side="give" data-pos="${esc(v.pos || '')}" data-val="${v.val}" data-label="${esc((v.name || q).replace(/~/g, ''))}" class="btn ghost" style="width:auto;padding:4px 11px;font-size:12px;margin:0">＋ You give</button>
          <button data-act="pv-add" data-side="get" data-pos="${esc(v.pos || '')}" data-val="${v.val}" data-label="${esc((v.name || q).replace(/~/g, ''))}" class="btn ghost" style="width:auto;padding:4px 11px;font-size:12px;margin:0">＋ You get</button>
        </div>`
      : `<span class="faint">No match for “${esc(q)}”. Try a fuller name, or price it with the position tiers in the add-asset dropdown below.</span>`;
    return;
  }
  if (act === 'pv-add') {
    const C = calcState();
    C[t.dataset.side === 'get' ? 'get' : 'give'].push({ pos: t.dataset.pos || '', val: +t.dataset.val || 0, label: t.dataset.label || 'Player' });
    saveDraftState(); return refreshCalc(true);
  }
  if (act === 'calc-remove') { const C = calcState(); C[t.dataset.side].splice(+t.dataset.i, 1); saveDraftState(); return refreshCalc(); }
  if (act === 'calc-qb') { const C = calcState(); C.qb = !C.qb; saveDraftState(); return refreshCalc(); }
  if (act === 'calc-swap') { const C = calcState(); const g = C.give; C.give = C.get; C.get = g; saveDraftState(); return refreshCalc(); }
  if (act === 'calc-clear') { S.draft.calc = { give: [], get: [], qb: (S.draft.calc || {}).qb || false }; saveDraftState(); return refreshCalc(); }
  if (act === 'advisor-send') {
    const inp = $('#advisorInput'); const q = ((inp && inp.value) || '').trim();
    if (!q) return;
    S.draft.advisorLog = S.draft.advisorLog || [];
    S.draft.advisorLog.push({ role: 'user', text: q }); saveDraftState();
    drawWarRoom();
    const logBox = $('#advisorLog'); if (logBox) { logBox.insertAdjacentHTML('beforeend', `<div class="faint" id="advThinking" style="font-size:12px;margin:6px 0">🧠 thinking…</div>`); logBox.scrollIntoView(false); }
    try { const a = await warAdvisorAsk(q); S.draft.advisorLog.push({ role: 'assistant', text: a }); saveDraftState(); }
    catch (e) { S.draft.advisorLog.push({ role: 'assistant', text: /^api-401/.test(e.message) ? 'That API key was rejected — check Settings.' : 'I could not reach the AI just now — try again.' }); }
    drawWarRoom();
    const el = $('#advisorLog'); if (el) el.scrollIntoView(false);
    return;
  }
  if (act === 'advisor-clear') { S.draft.advisorLog = []; saveDraftState(); return drawWarRoom(); }
});

// Change events: season switcher (<select>) and chat-file import (<input file>).
document.body.addEventListener('change', async (e) => {
  const it = e.target.closest('[data-act="intel-type"]');
  if (it) { S.draft.intelType = it.value; return drawWarRoom(); }
  const cadd = e.target.closest('[data-act="calc-add"]');
  if (cadd) { const v = cadd.value; if (v) { const parts = v.split('~'); const pos = parts[0]; const val = +parts[1]; const label = parts.slice(2).join('~'); const C = calcState(); C[cadd.dataset.side].push({ pos, val, label }); saveDraftState(); } return refreshCalc(); }
  const cw = e.target.closest('[data-act="ci-week"]');
  if (cw) { S.activeWeek = Math.min(18, Math.max(1, parseInt(cw.value, 10) || 1)); return showCreateIssue(); }
  const pf = e.target.closest('[data-act="predraft-feature"]');
  if (pf) { S.predraft = Object.assign(defaultPredraft(), S.predraft);
    const ids = (S.predraft.featureIds || []).slice();
    ids[parseInt(pf.dataset.slot, 10) || 0] = pf.value || '';
    S.predraft.featureIds = [ids[0], ids[1]].filter(Boolean);
    savePredraft(); toast('Feature updated'); return; }
  const cf = e.target.closest('[data-act="ci-feature"]');
  if (cf) { S.featureOverride = S.featureOverride || {}; const wk = S.activeWeek;
    if (cf.value) S.featureOverride[wk] = cf.value; else delete S.featureOverride[wk];
    saveFeatureOverride(); delete S.newsCache[wk]; toast(cf.value ? 'Feature set for this issue' : 'Feature cleared'); return; }
  const ss = e.target.closest('[data-act="storyline-status"]');
  if (ss) { S.storylines = S.storylines || { custom: [], status: {}, hidden: [] }; S.storylines.status = S.storylines.status || {};
    S.storylines.status[ss.dataset.id] = ss.value; saveStorylines(); S.newsCache = {}; toast('Status updated');
    // update the card's left border live without a full re-render
    const card = ss.closest('.card'); if (card) card.style.borderLeftColor = statusColor(ss.value); return; }
  const sel = e.target.closest('[data-act="season-select"]');
  if (sel) {
    const opt = sel.options[sel.selectedIndex];
    S.leagueId = sel.value; S.season = opt.dataset.season; saveSession();
    return enterApp();
  }
  const alias = e.target.closest('[data-act="alias-set"]');
  if (alias) {
    const name = alias.dataset.name, target = alias.value;
    S.histAliases = S.histAliases || {};
    if (target && normName(target) !== normName(name)) S.histAliases[normName(name)] = target;
    else delete S.histAliases[normName(name)];
    saveHistAliases(); refreshHistIndex(); S.newsCache = {};
    return showHistory();
  }
  const file = e.target.closest('[data-act="desk-file"]');
  if (file && file.files && file.files[0]) {
    const f = file.files[0];
    const st = $('#chatFileStatus');
    try {
      const buf = await f.arrayBuffer();
      const isZip = u8sig(buf) || /\.zip$/i.test(f.name);
      if (isZip && st) st.textContent = 'Unzipping…';
      const text = isZip ? await extractChatFromZip(buf) : new TextDecoder('utf-8').decode(buf);
      const n = parseChat(text).length;
      if (!n) { if (st) st.innerHTML = `Read <b>${esc(f.name)}</b>, but found no chat messages inside. Is it the exported chat?`; S.deskChatText = null; return; }
      S.deskChatText = text;
      if (st) st.innerHTML = `✓ Loaded <b>${esc(f.name)}</b> — <b>${n}</b> messages parsed. The desk will write about the most recent chatter. Hit “Write the article” below.`;
    } catch (err) {
      if (st) st.innerHTML = `Couldn't read that file — ${esc((err && err.message) || 'unknown error')}. You can also paste a snippet below.`;
      S.deskChatText = null;
    }
  }
  const hfile = e.target.closest('[data-act="history-file"]');
  if (hfile && hfile.files && hfile.files[0]) {
    const f = hfile.files[0]; const st = $('#histFileStatus');
    if (st) st.textContent = 'Reading your history…';
    try {
      const obj = JSON.parse(await f.text());
      const norm = normalizeHistory(obj);
      if (!norm || !norm.seasons.length) { if (st) st.innerHTML = 'Couldn’t find any seasons in that file. Make sure it’s the <b>espn-history.json</b> the snippet created.'; return; }
      S.espnHist = norm; saveEspnHist(); refreshHistIndex(); S.newsCache = {};
      if (st) st.innerHTML = `✓ Imported <b>${norm.seasons.length}</b> seasons.`;
      showHistory();
    } catch (err) { if (st) st.innerHTML = `Couldn’t read that file — ${esc((err && err.message) || 'invalid JSON')}.`; }
    return;
  }
  const cimg = e.target.closest('[data-act="cover-img-file"]');
  if (cimg && cimg.files && cimg.files[0]) {
    const kind = cimg.dataset.kind || 'week'; const slot = coverSlotFor(kind);
    const st = $('#coverImgStatus'); if (st) st.textContent = 'Adding the image…';
    try {
      const dataUrl = await downscaleImage(cimg.files[0], 1400);
      S.coverImg = S.coverImg || {}; S.coverImg[slot] = dataUrl; saveCoverImg();
      if (kind !== 'predraft') delete S.newsCache[S.activeWeek];
      showCoverArt(kind);
    } catch (err) { if (st) st.textContent = `Couldn't use that image — ${esc((err && err.message) || 'unknown error')}.`; }
    return;
  }
  const pfile = e.target.closest('[data-act="power-file"]');
  if (pfile && pfile.files && pfile.files[0]) {
    const f = pfile.files[0];
    const st = $('#powerFileStatus');
    if (st) st.textContent = 'Reading the spreadsheet…';
    try {
      const buf = await f.arrayBuffer();
      if (!u8sig(buf)) throw new Error('that isn’t an .xlsx — export/Save As Excel Workbook (.xlsx)');
      const rows = await extractRowsFromXlsx(buf);
      const ranked = parsePowerRows(rows);
      if (!ranked || !ranked.length) { if (st) st.innerHTML = `Read <b>${esc(f.name)}</b>, but couldn't find a team column. Give it headers like <b>Rank · Team · Record · Comment</b>.`; return; }
      S.power = S.power || {}; S.power[S.activeWeek] = ranked; savePower();
      delete S.newsCache[S.activeWeek];
      if (st) st.innerHTML = `✓ Loaded <b>${esc(f.name)}</b> — <b>${ranked.length}</b> teams ranked for Week ${S.activeWeek}. It's in this week's issue now.`;
      (S.tab === 'create') ? showCreateIssue() : showDesk();
    } catch (err) {
      if (st) st.innerHTML = `Couldn't read that file — ${esc((err && err.message) || 'unknown error')}.`;
    }
  }
  const mfile = e.target.closest('[data-act="money-file"]');
  if (mfile && mfile.files && mfile.files[0]) {
    const f = mfile.files[0];
    const st = $('#moneyFileStatus');
    if (st) st.textContent = 'Reading the board…';
    try {
      const buf = await f.arrayBuffer();
      if (!u8sig(buf)) throw new Error('that isn’t an .xlsx — export/Save As Excel Workbook (.xlsx)');
      const rows = await extractRowsFromXlsx(buf);
      const board = parseMoneyRows(rows);
      if (!board || !board.length) { if (st) st.innerHTML = `Read <b>${esc(f.name)}</b>, but couldn't find a matchup column. Give it headers like <b>Matchup · Money Line · Spread · O/U · Pick</b>.`; return; }
      S.money = S.money || {}; S.money[S.activeWeek] = board; saveMoney();
      delete S.newsCache[S.activeWeek];
      if (st) st.innerHTML = `✓ Loaded <b>${esc(f.name)}</b> — <b>${board.length}</b> lines on the board for Week ${S.activeWeek}. Pork Chop Express is live in this week's issue.`;
      (S.tab === 'create') ? showCreateIssue() : showDesk();
    } catch (err) {
      if (st) st.innerHTML = `Couldn't read that file — ${esc((err && err.message) || 'unknown error')}.`;
    }
  }
  const ffile = e.target.closest('[data-act="predraft-futures-file"]');
  if (ffile && ffile.files && ffile.files[0]) {
    const f = ffile.files[0];
    const st = $('#pdFutStatus');
    if (st) st.textContent = 'Reading the board…';
    try {
      const buf = await f.arrayBuffer();
      if (!u8sig(buf)) throw new Error('that isn’t an .xlsx — export/Save As Excel Workbook (.xlsx)');
      const board = parseMoneyRows(await extractRowsFromXlsx(buf));
      if (!board || !board.length) { if (st) st.innerHTML = `Read <b>${esc(f.name)}</b>, but couldn't find a team column. Give it headers like <b>Team · Odds · O/U · Note</b>.`; return; }
      S.predraft = Object.assign(defaultPredraft(), S.predraft, { futures: board }); savePredraft();
      if (st) st.innerHTML = `✓ Loaded <b>${esc(f.name)}</b> — <b>${board.length}</b> futures. Pork Chop Express is in the Draft Issue now.`;
      showPredraftDesk();
    } catch (err) {
      if (st) st.innerHTML = `Couldn't read that file — ${esc((err && err.message) || 'unknown error')}.`;
    }
  }
});

// Live search in the Article Archive — filter as you type without losing focus.
document.body.addEventListener('input', (e) => {
  const s = e.target.closest('[data-act="arch-search-input"]');
  if (s) { S.archiveQuery = s.value; showArticleArchive(); }
});
