<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Gridiron GM" />
<title>Gridiron GM</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%88%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg:#0b0f14; --bg2:#121822; --card:#161e2a; --card2:#1b2532; --border:#243040;
    --text:#e8eef5; --dim:#9fb0c3; --faint:#64748b; --accent:#31d158; --accent-d:#1f7a38;
    --blue:#4c8dff; --amber:#f5a623; --red:#ff5c5c; --purple:#a970ff;
    --serif: Georgia, 'Times New Roman', serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--text); font-family:var(--sans); }
  body { min-height:100dvh; }
  #app { max-width:640px; margin:0 auto; padding:16px 16px calc(84px + env(safe-area-inset-bottom)); }
  h1,h2,h3 { margin:0; }
  a { color:var(--blue); }
  button { font-family:inherit; cursor:pointer; }
  input { font-family:inherit; }
  .muted { color:var(--dim); }
  .faint { color:var(--faint); }
  .center { text-align:center; }

  /* cards & primitives */
  .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:14px; }
  .row { display:flex; align-items:center; gap:10px; }
  .btn { display:block; width:100%; border:1px solid var(--accent); background:var(--accent); color:#04210d;
         font-weight:800; font-size:15px; padding:13px; border-radius:12px; }
  .btn.ghost { background:transparent; color:var(--text); border-color:var(--border); }
  .btn.danger { background:transparent; color:var(--red); border-color:var(--red); }
  .btn:disabled { opacity:.45; }
  .input { width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:12px;
           color:var(--text); padding:13px; font-size:15px; }
  .label { color:var(--dim); font-size:13px; font-weight:600; margin-bottom:8px; display:block; }
  .seclabel { color:var(--faint); font-size:11px; font-weight:800; text-transform:uppercase;
              letter-spacing:.5px; margin:14px 4px 8px; }
  .avatar { border-radius:50%; background:var(--card2); object-fit:cover; flex:none;
            display:inline-flex; align-items:center; justify-content:center; color:var(--dim); font-weight:800; }
  .pos { border:1px solid var(--faint); border-radius:8px; padding:2px 6px; min-width:36px; text-align:center;
         font-size:11px; font-weight:800; letter-spacing:.5px; flex:none; }
  .pill { border:1px solid var(--dim); border-radius:999px; padding:2px 9px; font-size:11px; font-weight:800; }
  .spinner { width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--accent);
             border-radius:50%; animation:spin 1s linear infinite; margin:24px auto; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loadwrap { text-align:center; padding:30px 10px; color:var(--dim); }
  .empty { text-align:center; padding:36px 16px; color:var(--dim); }
  .empty b { color:var(--text); display:block; font-size:17px; margin-bottom:6px; }
  .err { color:var(--red); font-size:13px; margin-top:8px; }

  /* header / masthead */
  .masthead { display:flex; align-items:center; border-bottom:2px solid var(--text); padding-bottom:8px; margin-bottom:14px; }
  .masthead .kick { color:var(--accent); font-size:11px; font-weight:900; letter-spacing:2px; }
  .masthead .lg { font-family:var(--serif); font-style:italic; font-weight:900; font-size:26px; line-height:1.1; }
  .gear { margin-left:auto; font-size:22px; background:none; border:none; color:var(--faint); }

  /* week stepper */
  .week { display:flex; align-items:center; justify-content:space-between; background:var(--bg2);
          border:1px solid var(--border); border-radius:999px; padding:4px 8px; margin-bottom:14px; }
  .week button { background:none; border:none; color:var(--text); font-size:24px; font-weight:700; padding:2px 16px; }
  .week button:disabled { opacity:.3; }
  .week .wc { display:flex; align-items:center; gap:8px; font-weight:800; }
  .week .now { color:var(--accent); font-size:11px; font-weight:900; border:1px solid var(--accent-d);
               border-radius:8px; padding:1px 5px; }

  /* newsletter */
  .lead h1 { font-family:var(--serif); font-size:28px; line-height:1.15; margin-bottom:6px; }
  .standfirst { color:var(--faint); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px; }
  .body { font-family:var(--serif); color:var(--dim); font-size:16px; line-height:1.5; margin:0 0 10px; }
  .awards .at { font-weight:800; font-size:17px; border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:6px; }
  .award { display:flex; gap:12px; align-items:center; padding:7px 0; }
  .award .em { font-size:26px; }
  .award .lab { color:var(--faint); font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.5px; }
  .award .nm { font-weight:800; }
  .award .dt { color:var(--dim); font-size:13px; }
  .rule { text-align:center; font-size:11px; font-weight:900; letter-spacing:2px; color:var(--text);
          border-top:1px solid var(--border); border-bottom:1px solid var(--border); padding:8px 0; margin:14px 0; }
  .story .sl { display:flex; align-items:center; gap:8px; padding-bottom:8px; margin-bottom:8px; border-bottom:1px solid var(--border); }
  .story .tt { flex:1; display:flex; align-items:center; gap:8px; }
  .story .tt.r { flex-direction:row-reverse; text-align:right; }
  .story .tn { color:var(--dim); font-size:13px; font-weight:700; }
  .story .ts { font-size:17px; font-weight:900; }
  .story .win .tn, .story .win .ts { color:var(--accent); }
  .story .dash { color:var(--faint); font-weight:700; }
  .story h2 { font-family:var(--serif); font-size:21px; line-height:1.2; margin-bottom:4px; }
  .story .dek { color:var(--blue); font-size:13px; font-weight:700; font-style:italic; margin-bottom:8px; }
  .colophon { color:var(--faint); font-size:11px; text-align:center; line-height:1.4; margin-top:8px; }
  /* magazine graphics */
  .drop { float:left; font-family:var(--serif); font-weight:800; font-size:46px; line-height:38px; padding:2px 8px 0 0; color:var(--accent); }
  .scorebar { display:flex; height:6px; border-radius:3px; overflow:hidden; background:var(--red); margin:8px 0 12px; }
  .scorew { background:var(--accent); height:100%; }
  .sbgrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-bottom:14px; }
  .sbcard { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:10px 12px; }
  .sbrow { display:flex; justify-content:space-between; align-items:center; padding:2px 0; color:var(--dim); font-size:14px; }
  .sbrow.w { color:var(--text); font-weight:800; }
  .sbrow.w .sbs { color:var(--accent); }
  .sbn { max-width:70%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sbs { font-variant-numeric:tabular-nums; font-weight:700; }
  .sbtag { margin-top:6px; padding-top:6px; border-top:1px solid var(--border); color:var(--faint); font-size:10px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; }
  .tiles { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
  .tile { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 8px; text-align:center; }
  .tile .tv { font-size:22px; font-weight:900; color:var(--text); }
  .tile .tl { font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.4px; color:var(--faint); margin-top:2px; }
  .tile .ts2 { font-size:11px; color:var(--dim); margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pr { display:flex; gap:8px; align-items:flex-start; padding:8px 0; border-bottom:1px solid rgba(255,255,255,.05); }
  .prbar { height:5px; background:var(--bg2); border-radius:3px; overflow:hidden; margin:4px 0; }
  .prfill { height:100%; background:linear-gradient(90deg,var(--accent-d),var(--accent)); border-radius:3px; }
  .sd { display:flex; align-items:center; gap:8px; padding:8px 2px; border-bottom:1px solid rgba(255,255,255,.05); }
  .sd .val { font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; min-width:44px; text-align:right; }
  /* magazine cover + sections */
  .cover { position:relative; margin:-16px -16px 16px; padding:22px 16px 18px; overflow:hidden;
           background:radial-gradient(130% 120% at 100% 0%, rgba(49,209,88,.22), transparent 55%), linear-gradient(165deg,#10171f,#0b0f14 70%);
           border-bottom:3px solid var(--accent); }
  .cover-tools { position:absolute; top:12px; right:12px; display:flex; gap:6px; z-index:2; }
  .cover-mast { font-family:var(--serif); font-weight:900; font-style:italic; font-size:40px; line-height:.92;
                letter-spacing:-1px; text-transform:uppercase; margin-right:60px; text-shadow:0 2px 20px rgba(0,0,0,.5); }
  .cover-sub { color:var(--accent); font-size:11px; font-weight:900; letter-spacing:4px; margin-top:6px; }
  .cover-issue { color:var(--dim); font-size:11px; font-weight:800; letter-spacing:2px; margin-top:2px; }
  .cover-full { padding:0; min-height:90vh; }
  .cover-bg { position:absolute; inset:0; width:100%; height:100%; z-index:0; }
  .cover-inner { position:relative; z-index:1; min-height:90vh; padding:24px 18px 22px; display:flex; flex-direction:column; }
  .cover-hook-big { font-family:var(--serif); font-weight:900; font-size:46px; line-height:.98; letter-spacing:-1px;
                    margin-top:auto; text-shadow:0 2px 24px rgba(0,0,0,.6); }
  .cover-subject { margin-top:16px; }
  .cs-name { font-family:var(--serif); font-weight:900; font-style:italic; font-size:26px; line-height:1; }
  .cs-row { display:flex; align-items:baseline; gap:12px; margin-top:4px; }
  .cs-score { font-weight:900; font-size:44px; line-height:1; color:var(--accent); letter-spacing:-1px; }
  .cs-tag { font-size:11px; font-weight:900; letter-spacing:1.5px; color:var(--text); background:rgba(255,255,255,.08);
            border:1px solid var(--border); padding:3px 8px; border-radius:6px; }
  .cover-lines { margin-top:18px; border-top:1px solid rgba(255,255,255,.15); padding-top:12px; display:flex; flex-direction:column; gap:7px; }
  .cover-line { font-size:12px; font-weight:800; letter-spacing:.3px; text-transform:uppercase; color:var(--text);
                padding-left:15px; position:relative; line-height:1.25; }
  .cover-line::before { content:'▸'; position:absolute; left:0; color:var(--accent); }
  .sec { font-family:var(--serif); font-weight:800; font-size:13px; letter-spacing:3px; text-transform:uppercase;
         color:var(--text); padding:6px 0 6px 12px; margin:18px 0 12px; border-left:4px solid var(--accent);
         border-bottom:1px solid var(--border); }
  .card { box-shadow:0 1px 0 rgba(255,255,255,.02), 0 8px 24px -18px rgba(0,0,0,.9); }
  .at { display:flex; align-items:center; gap:6px; letter-spacing:.3px; }
  .story.feature { border-color:var(--accent); background:linear-gradient(180deg,rgba(49,209,88,.06),transparent 40%); }
  .feat-flag { display:inline-block; background:var(--accent); color:#04210d; font-size:10px; font-weight:900;
               letter-spacing:1.5px; padding:3px 8px; border-radius:6px; margin-bottom:10px; }
  .story.feature h2 { font-size:26px; line-height:1.12; }
  .pullquote { font-family:var(--serif); font-style:italic; font-size:19px; line-height:1.35; color:var(--text);
               border-left:3px solid var(--accent); padding:4px 0 4px 14px; margin:10px 0 12px; }
  /* how-it-unfolded timeline */
  .timeline { margin-top:12px; padding-top:10px; border-top:1px solid var(--border); }
  .tlh { font-size:10px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--faint); margin-bottom:6px; }
  .tlnames { display:flex; justify-content:space-between; font-size:11px; font-weight:700; margin-bottom:4px; }
  .tlnames .wn { color:var(--accent); } .tlnames .ln { color:var(--dim); }
  .tlrow { display:flex; align-items:center; gap:8px; padding:3px 0; }
  .tlwin { width:58px; font-size:10px; font-weight:800; color:var(--faint); text-transform:uppercase; letter-spacing:.5px; }
  .tlnum { width:44px; font-size:13px; font-variant-numeric:tabular-nums; color:var(--dim); text-align:center; }
  .tlnum.up { color:var(--text); font-weight:800; }
  .tlbar { flex:1; height:6px; border-radius:3px; background:var(--cardAlt,#1b2532); overflow:hidden; position:relative; }
  .tlbw { height:100%; background:var(--accent); border-radius:3px; }
  /* cover toolbar, bylines, modal, toast */
  .cover-tools { position:absolute; top:12px; right:12px; display:flex; gap:6px; }
  .ctool { background:rgba(255,255,255,.06); border:1px solid var(--border); color:var(--text); font-size:16px;
           width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  .byline { font-size:11px; font-weight:800; letter-spacing:.5px; text-transform:uppercase; color:var(--faint); margin-bottom:8px; }
  .linkbtn { background:none; border:none; color:var(--blue); font-size:12px; font-weight:700; padding:0; text-decoration:underline; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50; }
  .modal-box { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px; width:100%; max-width:460px; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%) translateY(20px); background:var(--text); color:var(--bg);
           font-weight:800; font-size:13px; padding:10px 16px; border-radius:999px; opacity:0; transition:all .25s; z-index:60; pointer-events:none; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* generic list rows */
  .prow { display:flex; align-items:center; gap:8px; padding:9px 4px; }
  .prow .nm { font-weight:600; }
  .prow .tm { color:var(--faint); font-size:11px; }
  .prow .val { font-size:17px; font-weight:800; width:44px; text-align:right; font-variant-numeric:tabular-nums; }
  .divider { border-bottom:1px solid rgba(255,255,255,.05); }

  /* trade */
  .verdict { text-align:center; }
  .verdict .vt { font-size:20px; font-weight:900; }
  .verdict .vs { color:var(--dim); font-size:13px; margin:4px 0 8px; }
  .tally { display:flex; align-items:center; margin-top:6px; }
  .tally .t { flex:1; text-align:center; }
  .tally .tv { font-size:26px; font-weight:900; }
  .tally .tl { color:var(--faint); font-size:11px; text-transform:uppercase; }
  .tally .arw { color:var(--faint); font-size:22px; padding:0 8px; }
  .netbar { display:flex; height:8px; border-radius:4px; overflow:hidden; margin:8px 0 6px; }
  .partners { display:flex; gap:8px; overflow-x:auto; padding:4px 0; -webkit-overflow-scrolling:touch; }
  .pchip { flex:none; width:84px; text-align:center; padding:8px; border:1px solid var(--border);
           border-radius:12px; background:none; color:var(--dim); }
  .pchip.on { border-color:var(--accent); background:var(--card2); color:var(--text); }
  .pchip .pn { font-size:11px; font-weight:600; margin-top:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .selrow { display:flex; align-items:center; gap:8px; padding:9px 4px; border:none; background:none; width:100%; text-align:left; color:var(--text); border-radius:10px; }
  .selrow.on { background:var(--card2); }
  .check { width:22px; height:22px; border-radius:6px; border:1.5px solid var(--border); flex:none;
           display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:900; color:#04210d; }

  /* draft */
  .needs { display:flex; flex-wrap:wrap; gap:10px; }
  .need { display:flex; align-items:center; gap:4px; }
  .filters { display:flex; gap:8px; overflow-x:auto; padding:8px 0; position:sticky; top:0; background:var(--bg); z-index:5; }
  .fchip { flex:none; padding:6px 14px; border-radius:999px; border:1px solid var(--border);
           background:var(--bg2); color:var(--dim); font-weight:800; font-size:13px; }
  .fchip.on { background:var(--accent); border-color:var(--accent); color:#04210d; }
  .tier { display:flex; align-items:center; gap:8px; padding:12px 4px 4px; }
  .tier .tx { color:var(--amber); font-size:11px; font-weight:900; letter-spacing:1px; }
  .tier .tl { flex:1; height:1px; background:var(--border); }
  .ovr { color:var(--faint); font-size:13px; font-weight:800; width:26px; text-align:center; }

  /* tab bar */
  .tabbar { position:fixed; left:0; right:0; bottom:0; background:var(--bg2); border-top:1px solid var(--border);
            display:flex; padding-bottom:env(safe-area-inset-bottom); z-index:20; }
  .tabbar .max { max-width:640px; margin:0 auto; width:100%; display:flex; }
  .tab { flex:1; background:none; border:none; color:var(--faint); padding:10px 0 12px; font-size:11px; font-weight:700; }
  .tab .ic { font-size:20px; display:block; margin-bottom:2px; }
  .tab.on { color:var(--accent); }
  .setup-logo { font-family:var(--serif); font-weight:900; font-size:30px; }
  .seasonsel { background:var(--bg2); color:var(--text); border:1px solid var(--border);
               border-radius:8px; padding:6px 10px; font-size:14px; font-weight:800; }
  .fileinput { width:100%; color:var(--dim); font-size:13px; }
  .fileinput::file-selector-button { background:var(--accent); color:#04210d; border:none; font-weight:800;
    padding:9px 14px; border-radius:10px; margin-right:12px; font-size:14px; }
</style>
</head>
<body>
<div id="app"><div class="loadwrap"><div class="spinner"></div>Loading Gridiron GM…</div></div>

<script>
"use strict";
// =====================================================================
//  Gridiron GM — a single-file Sleeper companion (News Room, Trade, Draft)
//  Everything below is vanilla JS. Data comes from Sleeper's public,
//  read-only API; nothing is stored except your chosen username + league
//  (in localStorage). No accounts, no keys.
// =====================================================================

const $ = (s, r=document) => r.querySelector(s);
const app = $('#app');
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round1 = (x) => Math.round(x * 10) / 10;
const sum = (xs) => xs.reduce((a,b)=>a+b, 0);
const joinList = (a) => a.length <= 1 ? (a[0] || '') : a.length === 2 ? `${a[0]} and ${a[1]}` : `${a.slice(0, -1).join(', ')}, and ${a[a.length - 1]}`;

// ---------------------------------------------------------------------
//  Sleeper API
// ---------------------------------------------------------------------
const CORE = 'https://api.sleeper.app/v1';
const DATA = 'https://api.sleeper.com';

async function fetchJson(url) {
  const r = await fetch(url, { headers: { accept: 'application/json' } });
  if (!r.ok) throw new Error('Sleeper request failed (' + r.status + ')');
  return r.json();
}
const getUser        = (u)      => fetchJson(`${CORE}/user/${encodeURIComponent(u.trim())}`);
const getNflState    = ()       => fetchJson(`${CORE}/state/nfl`);
const getUserLeagues = (id,s)   => fetchJson(`${CORE}/user/${id}/leagues/nfl/${s}`);
const getLeague      = (id)     => fetchJson(`${CORE}/league/${id}`);
const getRosters     = (id)     => fetchJson(`${CORE}/league/${id}/rosters`);
const getLeagueUsers = (id)     => fetchJson(`${CORE}/league/${id}/users`);
const getMatchups    = (id,w)   => fetchJson(`${CORE}/league/${id}/matchups/${w}`);
const getLeagueDrafts= (id)     => fetchJson(`${CORE}/league/${id}/drafts`);
const getDraftPicks  = (id)     => fetchJson(`${CORE}/draft/${id}/picks`);

const POS_QP = '&position[]=QB&position[]=RB&position[]=WR&position[]=TE&position[]=K&position[]=DEF';
async function getWeeklyStats(s,w)      { try { return rowsToMap(await fetchJson(`${DATA}/stats/nfl/${s}/${w}?season_type=regular${POS_QP}`)); } catch { return {}; } }
async function getWeeklyProjections(s,w){ try { return rowsToMap(await fetchJson(`${DATA}/projections/nfl/${s}/${w}?season_type=regular${POS_QP}`)); } catch { return {}; } }
async function getSeasonProjections(s)  { try { return rowsToMap(await fetchJson(`${DATA}/projections/nfl/${s}?season_type=regular${POS_QP}`)); } catch { return {}; } }

function rowsToMap(rows) {
  const out = {};
  const list = Array.isArray(rows) ? rows : Object.values(rows || {});
  for (const r of list) if (r && r.player_id && r.stats) out[r.player_id] = r.stats;
  return out;
}

function avatarUrl(a) { return a ? `https://sleepercdn.com/avatars/thumbs/${a}` : null; }
function playerName(p, id) {
  if (!p) return id ? 'Player ' + id : 'Unknown';
  if (p.full_name) return p.full_name;
  const c = [p.first_name, p.last_name].filter(Boolean).join(' ').trim();
  return c || (id ? 'Player ' + id : 'Unknown');
}

// Player dictionary (~5MB) — cached in IndexedDB for a day, memory for the session.
let _players = null;
async function getPlayers() {
  if (_players) return _players;
  const cached = await idbGet('players');
  if (cached && cached.ts && Date.now() - cached.ts < 864e5 && cached.data) {
    _players = cached.data; return _players;
  }
  _players = await fetchJson(`${CORE}/players/nfl`);
  idbSet('players', { ts: Date.now(), data: _players }).catch(()=>{});
  return _players;
}
function idbGet(key){return new Promise(res=>{try{const q=indexedDB.open('gridirongm',1);
  q.onupgradeneeded=()=>q.result.createObjectStore('kv');
  q.onsuccess=()=>{try{const g=q.result.transaction('kv','readonly').objectStore('kv').get(key);
    g.onsuccess=()=>res(g.result||null);g.onerror=()=>res(null);}catch{res(null);}};
  q.onerror=()=>res(null);}catch{res(null);}});}
function idbSet(key,val){return new Promise(res=>{try{const q=indexedDB.open('gridirongm',1);
  q.onupgradeneeded=()=>q.result.createObjectStore('kv');
  q.onsuccess=()=>{try{const tx=q.result.transaction('kv','readwrite');tx.objectStore('kv').put(val,key);
    tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch{res(false);}};
  q.onerror=()=>res(false);}catch{res(false);}});}

// ---------------------------------------------------------------------
//  Scoring — dot product of a stat bag with the league's scoring rules
// ---------------------------------------------------------------------
function scoreStats(stats, scoring) {
  if (!stats || !scoring) return 0;
  let t = 0;
  for (const k in scoring) { const v = stats[k]; if (typeof v === 'number') t += v * scoring[k]; }
  return t;
}

// ---------------------------------------------------------------------
//  Stat lines — raw Sleeper stats → readable box-score fragments
// ---------------------------------------------------------------------
const n = (s,k) => (typeof s?.[k] === 'number' ? s[k] : 0);
function rushFrag(s){ const a=n(s,'rush_att'),y=Math.round(n(s,'rush_yd')),td=n(s,'rush_td');
  let f=a?`${a} car, ${y} rush yds`:`${y} rush yds`; if(td)f+=`, ${td} TD`; return f; }
function recFrag(s){ const r=n(s,'rec'),y=Math.round(n(s,'rec_yd')),td=n(s,'rec_td'),tg=n(s,'rec_tgt');
  let f=`${r} rec, ${y} yds`; if(td)f+=`, ${td} TD`; if(tg)f+=` (${tg} tgt)`; return f; }
function statLine(pos, s) {
  if (!s) return '';
  const p = [];
  if (pos === 'QB') {
    const c=n(s,'pass_cmp'), a=n(s,'pass_att');
    if (a) p.push(`${c}/${a}`);
    if (n(s,'pass_yd')) p.push(`${Math.round(n(s,'pass_yd'))} pass yds`);
    if (n(s,'pass_td')) p.push(`${n(s,'pass_td')} pass TD`);
    if (n(s,'pass_int')) p.push(`${n(s,'pass_int')} INT`);
    if (n(s,'rush_yd')>=15 || n(s,'rush_td')) p.push(rushFrag(s));
    return p.filter(Boolean).join(', ');
  }
  if (pos === 'RB') { if(n(s,'rush_att'))p.push(rushFrag(s)); if(n(s,'rec'))p.push(recFrag(s)); return p.join(' · '); }
  if (pos === 'WR' || pos === 'TE') { if(n(s,'rec')||n(s,'rec_tgt'))p.push(recFrag(s)); if(n(s,'rush_yd')||n(s,'rush_td'))p.push(rushFrag(s)); return p.join(' · '); }
  if (pos === 'K') { const m=n(s,'fgm'),a=n(s,'fga'); if(a)p.push(`${m}/${a} FG`); if(n(s,'xpm'))p.push(`${n(s,'xpm')} XP`); if(n(s,'fgm_50p'))p.push(`${n(s,'fgm_50p')} from 50+`); return p.join(', '); }
  if (pos === 'DEF') { if(n(s,'sack'))p.push(`${n(s,'sack')} sk`); if(n(s,'int'))p.push(`${n(s,'int')} INT`); if(n(s,'ff'))p.push(`${n(s,'ff')} FF`); if(n(s,'fum_rec'))p.push(`${n(s,'fum_rec')} FR`); if(n(s,'def_td'))p.push(`${n(s,'def_td')} TD`); if(s.pts_allow!==undefined)p.push(`${n(s,'pts_allow')} pts allowed`); return p.join(', '); }
  return '';
}
function hasProduction(s){ return !!s && (n(s,'pass_yd')>0||n(s,'rush_yd')>0||n(s,'rec')>0||n(s,'fgm')>0||n(s,'sack')>0||n(s,'def_td')>0); }
function perfVerb(pts){ return pts>=30?'detonated for':pts>=24?'erupted for':pts>=18?'went off for':pts>=12?'delivered':pts>=7?'chipped in':pts>=3?'managed just':'was held to'; }
function bustAdj(pts){ return pts<=2?'a total no-show':pts<=5?'a crushing dud':pts<=8?'a quiet letdown':'underwhelming'; }
// Game-slot awareness (kickoff window), so articles can reference timing when
// it's known. Sleeper weekly totals don't carry this, so real leagues will pass
// null and these degrade to no-timing prose; the sample bakes real slots in.
const SLOT_ORDER = ['TNF','SUN_EARLY','SUN_LATE','SNF','MNF'];
const SLOT_LABEL = { TNF:'Thursday night', SUN_EARLY:'the early window', SUN_LATE:'the late window', SNF:'Sunday night', MNF:'Monday night' };
const SLOT_SHORT = { TNF:'Thu', SUN_EARLY:'Sun early', SUN_LATE:'Sun late', SNF:'SNF', MNF:'Mon' };
const SLOT_CLAUSE = { TNF:'in the Thursday night game', SUN_EARLY:'in the early Sunday window', SUN_LATE:'in the late Sunday window', SNF:'in the Sunday night game', MNF:'in the Monday night game' };
const SLOT_LATE = new Set(['SNF','MNF']);
function slotClause(slot){ return SLOT_CLAUSE[slot] ? ` ${SLOT_CLAUSE[slot]}` : ''; }

/**
 * Reconstructs how a matchup unfolded across game windows (Thu → Mon) from each
 * starter's slot. Returns the running scoreboard per active window plus a story
 * arc (wire / comeback / frontRun / nail / steady). Null when slots are unknown
 * (real Sleeper data today), so the prose simply omits timing.
 */
function buildTimeline(winner, loser) {
  const hasSlots = [...winner.starters, ...loser.starters].some(e => e.slot);
  if (!hasSlots) return null;
  const slotSum = (team, slot) => team.starters.filter(e => e.slot === slot).reduce((s, e) => s + e.points, 0);
  let wCum = 0, lCum = 0;
  const windows = [];
  for (const slot of SLOT_ORDER) {
    const wPts = round1(slotSum(winner, slot)), lPts = round1(slotSum(loser, slot));
    if (wPts === 0 && lPts === 0) continue;
    wCum = round1(wCum + wPts); lCum = round1(lCum + lPts);
    windows.push({ slot, name: SLOT_LABEL[slot], wPts, lPts, wCum, lCum, lead: round1(wCum - lCum) });
  }
  if (!windows.length) return null;
  const fin = windows.length - 1;
  const preFinalLead = fin > 0 ? windows[fin - 1].lead : windows[0].lead;
  const maxDeficit = Math.max(0, ...windows.map(w => -w.lead));  // furthest the winner ever fell behind
  const earlyShare = winner.score > 0 ? windows[Math.min(1, fin)].wCum / winner.score : 0;
  let arc;
  if (preFinalLead < 0 || maxDeficit >= 20) arc = 'comeback';   // down late, or dug out of a real hole
  else if (maxDeficit <= 3) arc = (earlyShare >= 0.6 && windows.length >= 3) ? 'frontRun' : 'wire';
  else if (Math.abs(preFinalLead) <= 10) arc = 'nail';          // close going into the last window
  else arc = 'steady';                                          // traded blows, then pulled clear
  // Decisive window = the final go-ahead (last flip from behind/tied to ahead);
  // otherwise the last active window.
  let dIdx = fin;
  if (arc === 'comeback') { for (let i = 1; i < windows.length; i++) if (windows[i-1].lead <= 0 && windows[i].lead > 0) dIdx = i; }
  const dWin = windows[dIdx];
  const dScorers = winner.starters.filter(e => e.slot === dWin.slot && e.points > 0).sort((a,b)=>b.points-a.points).slice(0, 2);
  return { windows, arc, decisive: dWin, dScorers, preFinalLead: Math.abs(preFinalLead) };
}

// Harry Doyle (Bob Uecker) flourishes for the game stories.
function scoredTD(s){ return (n(s,'rush_td')+n(s,'rec_td')+n(s,'pass_td')+n(s,'def_td')) > 0; }
function heroHype(pts, seed){
  const big = ['went thermonuclear for','put on an absolute clinic for','dropped a cool','detonated for','went bananas for'];
  const mid = ['went to work for','delivered','posted','came to play and put up'];
  const low = ['scraped together','mustered just','managed a whisper of'];
  return seededPick(pts>=24 ? big : pts>=11 ? mid : low, seed);
}

// ---------------------------------------------------------------------
//  News Room — build a full newsletter from a week's matchups + stats
// ---------------------------------------------------------------------
function seededPick(arr, seed){ return arr[Math.abs(Math.round(seed)) % arr.length]; }
function flexMatch(a,b){ if(a===b)return true; const f=new Set(['RB','WR','TE']); return f.has(a)&&f.has(b); }

function buildNewsletter(inp) {
  const { week, league, matchups, rosters, usersById, players, weeklyStats, weeklyProjections } = inp;
  const scoring = league.scoring_settings;
  const rosterById = new Map(rosters.map(r => [r.roster_id, r]));

  const managerFor = (rid) => {
    const r = rosterById.get(rid);
    const u = r && r.owner_id ? usersById[r.owner_id] : null;
    return { name: (u && (u.metadata?.team_name || u.display_name)) || ('Team ' + rid), avatar: avatarUrl(u && u.avatar) };
  };
  const posOf = (id) => players[id]?.position || players[id]?.fantasy_positions?.[0] || '';
  const pointsFor = (entry, id) =>
    (entry.players_points && typeof entry.players_points[id] === 'number') ? entry.players_points[id] : scoreStats(weeklyStats[id], scoring);

  const makeEntry = (entry, id) => {
    const pos = posOf(id), stats = weeklyStats[id];
    return { id, player: players[id], pos, points: round1(pointsFor(entry,id)),
             projected: round1(scoreStats(weeklyProjections[id], scoring)), stats, line: statLine(pos, stats),
             slot: players[id] ? players[id].slot || null : null };
  };

  const buildTeam = (entry) => {
    const starterIds = (entry.starters || []).filter(Boolean);
    const benchIds = (entry.players || []).filter(id => id && !starterIds.includes(id));
    const starters = starterIds.map(id => makeEntry(entry, id));
    const bench = benchIds.map(id => makeEntry(entry, id));
    const score = round1(entry.points && entry.points > 0 ? entry.points : sum(starters.map(e=>e.points)));
    const { name, avatar } = managerFor(entry.roster_id);
    const top = [...starters].sort((a,b)=>b.points-a.points)[0] || null;

    const bustPool = starters.filter(e => ['QB','RB','WR','TE'].includes(e.pos) && e.projected >= 8)
                             .sort((a,b)=>(a.points-a.projected)-(b.points-b.projected));
    const bust = (bustPool.length && bustPool[0].points < bustPool[0].projected - 5) ? bustPool[0] : null;

    let benchRegret = null;
    const bestBench = [...bench].sort((a,b)=>b.points-a.points)[0];
    if (bestBench) {
      const weak = [...starters].filter(s=>flexMatch(s.pos, bestBench.pos)).sort((a,b)=>a.points-b.points)[0];
      if (weak && bestBench.points - weak.points >= 6)
        benchRegret = { bench: bestBench, starter: weak, diff: round1(bestBench.points - weak.points) };
    }
    return { rosterId: entry.roster_id, manager: name, avatar, score, starters, bench, top, bust, benchRegret };
  };

  const byMatchup = new Map();
  for (const m of matchups) { if (m.matchup_id == null) continue;
    if (!byMatchup.has(m.matchup_id)) byMatchup.set(m.matchup_id, []); byMatchup.get(m.matchup_id).push(m); }
  const anyPoints = matchups.some(m => (m.points || 0) > 0);

  const stories = [];
  for (const [mid, pair] of byMatchup) {
    if (pair.length < 2) continue;
    const a = buildTeam(pair[0]), b = buildTeam(pair[1]);
    const [winner, loser] = a.score >= b.score ? [a,b] : [b,a];
    stories.push(writeStory({ mid, winner, loser, tie: a.score===b.score,
      margin: round1(Math.abs(a.score-b.score)), combined: round1(a.score+b.score) }));
  }
  stories.sort((a,b)=>(b.combined-b.margin*0.5)-(a.combined-a.margin*0.5));

  const power = computePower(stories, rosterById);
  return { week, leagueName: league.name, lead: writeLead(stories, week, league.name),
           stories, awards: writeAwards(stories), powerRankings: power,
           feature: writeFeature(stories, power, week, league.name),
           scoreboard: buildScoreboard(stories), numbers: buildNumbers(stories),
           studs: buildStuds(stories), duds: buildDuds(stories), shame: buildShame(stories),
           hasData: anyPoints && stories.length > 0 };
}

// ---- Magazine sections ------------------------------------------------------
function buildScoreboard(stories) {
  return stories.map(s => ({
    win: { manager: s.winner.manager, avatar: s.winner.avatar, score: s.winner.score },
    lose: { manager: s.loser.manager, avatar: s.loser.avatar, score: s.loser.score },
    tie: s.tie, margin: s.margin,
  }));
}
function buildNumbers(stories) {
  const teams = stories.flatMap(s => [s.winner, s.loser]);
  const all = teams.map(t => t.score);
  const hi = [...teams].sort((a,b)=>b.score-a.score)[0];
  const lo = [...teams].sort((a,b)=>a.score-b.score)[0];
  const big = [...stories].filter(s=>!s.tie).sort((a,b)=>b.margin-a.margin)[0];
  const close = [...stories].filter(s=>!s.tie).sort((a,b)=>a.margin-b.margin)[0];
  const total = round1(sum(all));
  return [
    { label: 'High Score', value: hi ? String(hi.score) : '—', sub: hi ? hi.manager : '' },
    { label: 'Low Score', value: lo ? String(lo.score) : '—', sub: lo ? lo.manager : '' },
    { label: 'Biggest Blowout', value: big ? `+${big.margin}` : '—', sub: big ? big.winner.manager : '' },
    { label: 'Closest Game', value: close ? `${close.margin}` : '—', sub: close ? `${close.winner.manager} d. ${close.loser.manager}` : '' },
    { label: 'Points Scored', value: String(total), sub: `${teams.length} teams` },
    { label: 'Avg Team', value: all.length ? String(round1(total/all.length)) : '—', sub: 'per lineup' },
  ];
}
function allStarters(stories) {
  const out = [];
  stories.forEach(s => [s.winner, s.loser].forEach(t => t.starters.forEach(e =>
    out.push({ e, manager: t.manager }))));
  return out;
}
function buildStuds(stories) {
  return allStarters(stories).sort((a,b)=>b.e.points-a.e.points).slice(0,5).map(x => ({
    name: playerName(x.e.player, x.e.id), pos: x.e.pos, points: x.e.points,
    line: x.e.line && hasProduction(x.e.stats) ? x.e.line : '', manager: x.manager,
  }));
}
function buildDuds(stories) {
  // Started skill players who most badly missed a real projection.
  return allStarters(stories)
    .filter(x => ['QB','RB','WR','TE'].includes(x.e.pos) && x.e.projected >= 10)
    .map(x => ({ ...x, miss: x.e.projected - x.e.points }))
    .filter(x => x.miss >= 6)
    .sort((a,b)=>b.miss-a.miss).slice(0,5).map(x => ({
      name: playerName(x.e.player, x.e.id), pos: x.e.pos, points: x.e.points,
      projected: x.e.projected, manager: x.manager,
    }));
}
function buildShame(stories) {
  const out = [];
  stories.forEach(s => [s.winner, s.loser].forEach(t => { if (t.benchRegret) out.push({
    manager: t.manager, benched: playerName(t.benchRegret.bench.player, t.benchRegret.bench.id),
    benchPts: t.benchRegret.bench.points, started: playerName(t.benchRegret.starter.player, t.benchRegret.starter.id),
    startPts: t.benchRegret.starter.points, diff: t.benchRegret.diff }); }));
  return out.sort((a,b)=>b.diff-a.diff).slice(0,4);
}

// ---- League feature article -------------------------------------------------
function writeFeature(stories, power, week, leagueName) {
  if (!stories.length || !power.length) return null;
  const teams = stories.flatMap(s => [s.winner, s.loser]);
  const top = power[0], bottom = power[power.length - 1], second = power[1];
  const drama = stories[0];
  const hasRecords = /-/.test(top.tag);
  const P = [];
  P.push(`${top.manager} is running this league, and after Week ${week} it's getting hard to argue otherwise${hasRecords ? ` (${top.tag})` : ''}. ${top.note} Everyone else is playing for second, and they know it.`);
  if (second) P.push(`The chase is led by ${second.manager}, ${lc(second.note)} — close enough to smell it, far enough to still choke. Behind them the middle of the ${leagueName} is a genuine knife fight: three or four teams separated by a good week and a lucky bounce, none of them safe, all of them dangerous.`);
  P.push(`Then, down in the cellar paying rent, sits ${bottom.manager}. ${bottom.note} At this point the season's about pride, draft position, and not getting roasted in this very publication.`);
  P.push(`If you want the week distilled to one image, it's ${drama.winner.manager} hanging ${drama.winner.score} on the board and ${drama.loser.manager} left to explain themselves. That's the league right now: a handful of teams peaking, a handful in freefall, and everybody one Sunday from a mood swing.`);
  return { headline: `State of the League: ${top.manager} on Top, ${bottom.manager} in the Basement`, dek: `Week ${week} — where everyone stands, and who's about to panic.`, byline: 'The Gazette', paragraphs: P };
}
function lc(s) { return s ? s.charAt(0).toLowerCase() + s.slice(1).replace(/\.$/, '') : s; }

// ---- The Water Cooler: turn a pasted group chat into an article -------------
const CHAT_NOISE = /(omitted|end-to-end encrypted|changed the (subject|group|icon)|changed this group|added |removed | left\b| joined | was added|deleted this message|this message was deleted|missed (voice|video) call|null|created group|pinned a message|changed their phone number|<Media|GIF omitted|sticker omitted|image omitted|video omitted|audio omitted|document omitted)/i;
function parseChat(raw) {
  const lines = String(raw || '')
    .replace(/[‎‏‪-‮]/g, '')   // strip WhatsApp's invisible direction marks
    .split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const msgs = [];
  const re = /^(?:\[[^\]]+\]\s*)?(?:\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4},?\s+[\d:]+(?:\s*[APMapm]{2})?\s*[-–—]\s*)?([\p{L}0-9 ._'’-]{1,28}?):\s+(.+)$/u;
  for (const l of lines) {
    const m = l.match(re);
    if (m && m[2]) msgs.push({ author: m[1].trim(), text: m[2].trim() });
    else if (msgs.length) msgs[msgs.length - 1].text += ' ' + l;
    // else: a stray line with no author — skip it rather than inventing "Someone"
  }
  return msgs.filter(m => m.text.length && !CHAT_NOISE.test(m.text));
}
const CHAT_THEMES = {
  trade: /\b(trade|deal|offer|swap|veto|package)\b/i,
  waiver: /\b(waiver|pickup|pick up|drop|faab|free agent|add)\b/i,
  rules: /\b(commissioner|commish|rule|collusion|cheat|unfair|settings|scoring)\b/i,
  smack: /\b(suck|sucks|trash|garbage|destroy|beat|lucky|scrub|bum|clown|choke|washed|donkey|bad)\b/i,
  injury: /\b(injur|hurt|questionable|IR|out for|tweaked)\b/i,
};
const THEME_HEAD = { trade: 'Trade Winds Blow Through the Chat', waiver: 'Waiver-Wire Warfare', rules: 'Rules Revolt in the Group Chat', smack: 'The Trash Talk Boils Over', injury: 'Injury Panic Sweeps the League' };
const CHAT_SAY = ['fired off', 'offered up', 'declared', 'shot back', 'announced', 'insisted', 'typed out', 'ranted'];
function generateChatArticle(raw, angle) {
  const all = parseChat(raw);
  if (!all.length) return null;
  // A WhatsApp export can span months; write about the most recent stretch.
  const msgs = all.slice(-220);
  const counts = {}; msgs.forEach(m => counts[m.author] = (counts[m.author] || 0) + 1);
  const loudest = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  const questions = msgs.filter(m => /\?\s*$/.test(m.text));
  const tc = {}; for (const k in CHAT_THEMES) tc[k] = msgs.filter(m => CHAT_THEMES[k].test(m.text)).length;
  const topTheme = Object.keys(tc).sort((a, b) => tc[b] - tc[a]).find(k => tc[k] > 0) || null;
  const punchy = msgs.filter(m => m.text.length <= 180 && (/[!?]/.test(m.text) || CHAT_THEMES.smack.test(m.text) || /\b(robbery|insulting|collusion|veto|last place|first place)\b/i.test(m.text)));
  const q = (punchy.length >= 2 ? punchy : msgs.filter(m => m.text.length <= 200));
  const seed = msgs.length * 7 + (loudest ? loudest.length : 0);
  const pick = (arr, o) => seededPick(arr, seed + o);
  const say = (i) => pick(CHAT_SAY, i);
  const headline = (angle && angle.trim()) ? angle.trim() : (topTheme ? THEME_HEAD[topTheme] : 'Chaos in the Group Chat');
  const P = [];
  P.push(pick([`The group chat was a warzone again this week.`, `Another week, another meltdown in the league chat.`, `The keyboards were smoking in the group chat.`], 1) +
    (loudest && counts[loudest] > 1 ? ` ${loudest} led the charge with ${counts[loudest]} messages, because of course they did.` : ''));
  if (q[0]) P.push(`It got going when ${q[0].author} ${say(2)}: “${q[0].text}”`);
  if (q[1]) P.push(`“${q[1].text}” ${say(3)} ${q[1].author}${q[2] ? `, to which ${q[2].author} ${say(4)}: “${q[2].text}”` : `.`}`);
  if (questions[0]) P.push(`The unanswered question of the week, courtesy of ${questions[0].author}: “${questions[0].text}” Nobody had a straight answer.`);
  else if (topTheme === 'trade') P.push(`Whether any of this produces an actual trade remains, as ever, deeply doubtful.`);
  P.push(pick([`The Gazette will keep monitoring the situation, purely for entertainment.`, `Cooler heads did not prevail. They never do.`, `We'll check back next week when someone rage-quits again.`], 5));
  return { id: 'desk_' + seed + '_' + msgs.length, kind: 'chat', headline, dek: `Dispatches from the group chat.`, byline: 'The Water Cooler Desk', paragraphs: P };
}

// Power rankings: blend season record (if any) with this week's output, plus a
// one-liner per team. Falls back to weekly scoring when records aren't loaded.
function computePower(stories, rosterById) {
  const byId = {};
  stories.forEach(s => { byId[s.winner.rosterId] = s.winner; byId[s.loser.rosterId] = s.loser; });
  const rows = Object.values(byId).map(t => {
    const r = rosterById.get(t.rosterId), st = r ? r.settings : {};
    const pf = (st.fpts || 0) + (st.fpts_decimal || 0) / 100;
    return { manager: t.manager, week: t.score, wins: st.wins || 0, losses: st.losses || 0, ties: st.ties || 0, pf };
  });
  const hasRecords = rows.some(r => r.wins || r.losses);
  rows.sort((a, b) => hasRecords ? (b.wins - a.wins || b.pf - a.pf || b.week - a.week) : (b.week - a.week));
  return rows.map((r, i) => ({
    rank: i + 1, manager: r.manager, week: r.week,
    tag: hasRecords ? `${r.wins}-${r.losses}${r.ties ? '-' + r.ties : ''}` : `${r.week.toFixed(1)} pts`,
    note: powerNote(i, rows.length, r),
  }));
}
function powerNote(i, n, r) {
  const s = Math.round(r.week * 10 + i);
  if (i === 0) return seededPick(['On the throne and insufferable about it.', 'King of the hill until further notice.', 'Everyone else is playing for second.'], s);
  if (i === n - 1) return seededPick(['Rock bottom, and still digging.', 'A weekly donation to the rest of the league.', 'Somebody stage an intervention.'], s);
  if (i === 1) return seededPick(['Knocking on the door with bad intentions.', 'One good Sunday from the top spot.'], s);
  if (i === n - 2) return seededPick(['Circling the drain but not gone yet.', 'Two spots from a real problem.'], s);
  return seededPick(['Firmly in the mushy middle.', 'Dangerous or forgettable — jury’s out.', 'Neither contender nor cautionary tale. Yet.', 'Quietly fine, loudly average.', 'Could go either way, probably goes sideways.', 'The definition of a Tuesday-afternoon team.'], s + i * 7);
}

function writeStory(ctx) {
  const { winner, loser, tie, margin, combined } = ctx;
  const seed = Math.round(winner.score*10 + loser.score + winner.rosterId);
  const pick = (arr, o) => seededPick(arr, seed + o);
  const blowout = margin >= 35, nail = margin > 0 && margin <= 12;
  const W = winner.manager, L = loser.manager;
  const nm = (e) => playerName(e.player, e.id);
  const nml = (e) => nm(e) + (e && e.line && hasProduction(e.stats) ? ` (${e.line})` : '');
  const wS = [...winner.starters].sort((a,b)=>b.points-a.points);
  const lS = [...loser.starters].sort((a,b)=>b.points-a.points);
  const hero = wS[0] || winner.top, goat = lS[0] || loser.top;
  const heroName = hero ? nm(hero) : 'somebody';
  const heroDifference = !!hero && !tie && hero.points >= margin;
  const P = [];

  // ---- Marquee ----
  let headline;
  if (tie) headline = pick([`${W}, ${L} Settle Jack Squat`, `Two Teams, Zero Balls: ${W} Ties ${L}`], 1);
  else if (blowout) headline = pick([`${W} Beats the Brakes Off ${L}`, `${W} ${winner.score}, ${L} ${loser.score}: A Damn Massacre`, `${heroName} and ${W} Curb-Stomp ${L}`], 1);
  else if (nail) headline = pick([`${heroName} Drags ${W}'s Ass Past ${L}`, `${W} Survives ${L} by a Nut Hair`, `${L} Shits the Bed Late Against ${W}`], 1);
  else headline = pick([`${W} Handles ${L}'s Business`, `${W} Grinds ${L} Into Paste`], 1);

  const dek = tie ? `Two teams, zero winners, and one scoreboard that needs a drink.`
    : heroDifference ? `${heroName} was the whole damn ballgame — and ${L} had no answer.`
    : blowout ? `${W} showed up. ${L} forgot to.`
    : `Final: ${W} ${winner.score}, ${L} ${loser.score}.`;

  // ---- P1: the call ----
  if (tie) {
    P.push(`${W} and ${L} spent all week clubbing each other and finished in a ${winner.score}-apiece deadlock — the rare result where both group chats go dead quiet at once. A tie. In football. Somebody explain the goddamn point of that.`);
  } else {
    P.push(pick([`Here's how it went down: `, `To the tape. `, `Set the scene: `], 2) +
      `${W} ${blowout ? pick([`beat the brakes off ${L}`,`ran ${L} off the damn field`,`treated ${L} like a crash-test dummy`], 3) : nail ? pick([`outlasted ${L}`,`survived ${L}`,`ripped ${L}'s heart out`], 3) : pick([`handled ${L}`,`ground ${L} down`,`took care of ${L}`], 3)}, ${winner.score} to ${loser.score}${nail ? `, and the ${margin}-point final doesn't come close to capturing how sweaty it got — ${L} is gonna be sick about this one for a week` : blowout ? `, a beatdown so lopsided it oughta be illegal in most states` : ''}.`);
  }

  // ---- P1.5: how it unfolded across the game windows (Thu → Mon) ----
  const tl = !tie ? buildTimeline(winner, loser) : null;
  if (tl) P.push(writeTimeline(tl, W, L, margin, nm));

  // ---- P2: the hero, real stat line + swing framing ----
  if (hero && hero.points > 0) {
    let p = `The engine was ${heroName}, who ${heroHype(hero.points, seed)} ${hero.points}`;
    if (hero.line && hasProduction(hero.stats)) p += ` on ${hero.line}`;
    p += '. ';
    if (heroDifference && nail) {
      p += (scoredTD(hero.stats)
        ? pick([`He found the end zone right when ${W} needed it, and there's your difference: `, `He punched it in with the matchup hanging in the balance: `], 4)
        : pick([`And that output is the whole ballgame: `, `Here's the kick in the nuts for ${L}: `], 4)) +
        pick([`his day was worth more than the ${margin}-point margin by itself. Take him out and ${W} loses, full stop.`,
              `he alone outscored the ${margin} points ${W} won by. No ${heroName}, no win, and ${L} knows it.`], 5);
    } else if (heroDifference) {
      p += pick([`Bigger than the margin, bigger than the moment — the man single-handedly ruined ${L}'s whole week.`, `No ${heroName}, no win for ${W}. Ain't complicated.`], 6);
    } else if (blowout) {
      p += pick([`By halftime this stopped being a matchup and became a crime scene.`, `${L} brought a squirt gun to a house fire.`], 6);
    } else if (hero.points >= 22) {
      p += pick([`That's not stat-padding, that's a damn statement.`, `He didn't have to go that hard. He did it anyway, the animal.`], 6);
    } else {
      p += pick([`Nothing flashy, just enough to cash the check.`, `Quietly did his job while everybody else screwed around.`], 6);
    }
    P.push(p.trim());
  }

  // ---- P3: winner's supporting cast ----
  const support = wS.slice(1).filter(e => e.points >= 9).slice(0, 3);
  if (support.length) {
    const items = support.map(e => `${nm(e)} ${e.points>=20?'piled on':e.points>=13?'added':'kicked in'} ${e.points}${e.line&&hasProduction(e.stats)?` (${e.line})`:''}`);
    P.push(`And ${heroName} didn't do it alone. ` + joinList(items) + `. ` +
      pick([`When the whole lineup shows the hell up, this is what it looks like.`, `Depth wins leagues, and ${W}'s got it in spades.`, `That's a roster firing on every damn cylinder.`], 7));
  }

  // ---- P4: the QB / trenches note ----
  const wQB = winner.starters.find(e => e.pos === 'QB');
  const wDEF = winner.starters.find(e => e.pos === 'DEF' && e.points >= 10);
  if (wQB && wQB !== hero && !support.includes(wQB) && wQB.points >= 8) {
    let p = `Under center, ${nm(wQB)} ran the offense like he owned the place${wQB.line ? ` — ${wQB.line}` : ''} for ${wQB.points}.`;
    if (wDEF) p += ` The ${nm(wDEF)} even chipped in ${wDEF.points}, because when it rains it pours.`;
    P.push(p);
  } else if (wDEF) {
    P.push(`Don't sleep on the ${nm(wDEF)}, which quietly banked ${wDEF.points} while everyone was busy watching the skill guys.`);
  }

  // ---- P5: the losing side's fight ----
  if (goat && goat.points > 0 && !tie) {
    let p = pick([`It wasn't for lack of a pulse on ${L}'s side. `, `${L} didn't go quietly. `, `Credit where it's due — ${L} threw a punch. `], 8) +
      `${nml(goat)} led the resistance with ${goat.points}`;
    const lSup = lS.slice(1).filter(e => e.points >= 11).slice(0, 2);
    if (lSup.length) p += `, with ${joinList(lSup.map(e => `${e.points} from ${nm(e)}`))} keeping it interesting`;
    p += `. ` + pick([`But a hell of an effort and four bucks gets you a gas-station coffee.`, `Add it all up and it still spells L-O-S-S.`, `All that, and the scoreboard didn't give a shit.`], 9);
    P.push(p);
  }

  // ---- P6: the bust ----
  if (loser.bust) {
    const b = loser.bust, bn = nm(b), miss = round1(b.projected - b.points);
    P.push(pick([
      `Now the autopsy, and it's ugly: ${bn} was penciled in for ${b.projected} and turned in a steaming ${b.points}. That's not a slump, that's a hostage situation.`,
      `${bn} is why ${L}'s manager was up at 3 a.m. staring at the ceiling. Projected ${b.projected}, produced ${b.points} — you'd get more out of a damn Magic 8-Ball.`,
      `Every loss needs a goat, and ${L} nominates ${bn}: ${b.projected} projected, ${b.points} delivered, a ${miss}-point faceplant with the matchup on the line. Absolute dogshit.`,
    ], 10));
  }

  // ---- P7: the bench blunder / management ----
  if (loser.benchRegret) {
    const r = loser.benchRegret, bn = nm(r.bench), sn = nm(r.starter);
    P.push(pick([
      `And here's the part ${L} will choke on all week: ${bn} dropped ${r.bench.points} in street clothes on the bench while ${sn} shit the bed for ${r.starter.points} in the starting lineup — a ${r.diff}-point coaching decision in a ${margin}-point loss. The call is coming from inside the house, jackass.`,
      `File it under self-inflicted: ${r.diff} points of ${bn} rotting on ${L}'s bench while ${sn} no-showed in the lineup. In a ${margin}-point loss. You can't fire the GM, but ${L} damn well should.`,
    ], 11));
  } else if (winner.benchRegret && !blowout) {
    const r = winner.benchRegret;
    P.push(`Even in the win, ${W} left ${r.bench.points} stapled to the bench in ${nm(r.bench)} — a champagne problem, but a problem.`);
  }

  // ---- P8: by the numbers / what-if ----
  if (loser.bust && (loser.bust.projected - loser.bust.points) >= margin && !tie) {
    const b = loser.bust;
    P.push(`The cruelest math of the day: ${nm(b)} missed his projection by ${round1(b.projected - b.points)} — more than the entire ${margin}-point final. He hits his number and we're writing ${L}'s victory column instead. Fantasy football: a cruel, stupid, beautiful sonofabitch of a game.`);
  } else {
    P.push(pick([
      `Combined, the two hung ${combined} on the board${combined >= 260 ? ' — a genuine track meet' : combined <= 180 ? ', a rock fight nobody should brag about' : ''}.`,
      `Two teams, ${combined} combined points, and exactly one of them gets to feel good about their damn self.`,
    ], 12));
  }

  // ---- P9: the sign-off ----
  P.push(pick([
    `${W} struts into next week; ${L} has some soul-searching and a stiff drink ahead.`,
    `Print the box score, ${W}. ${L} — light it on fire and never speak of it again.`,
    `${W} moves to the right side of the standings. ${L} goes home to a group chat that just went real quiet.`,
  ], 13));

  return { id:'g'+ctx.mid, headline, dek, paragraphs:P, winner, loser, tie, margin, combined, timeline: tl };
}

// Narrate how the matchup moved across game windows, from the timeline arc.
function writeTimeline(tl, W, L, margin, nm) {
  const dw = tl.decisive, first = tl.windows[0], last = tl.windows[tl.windows.length - 1];
  const scorers = tl.dScorers.length ? joinList(tl.dScorers.map(e => `${nm(e)} (${e.points})`)) : 'the late guns';
  const earlyCum = tl.windows[Math.min(1, tl.windows.length - 1)].wCum;
  switch (tl.arc) {
    case 'comeback':
      return `It didn't start pretty for ${W}, who trailed for a good chunk of the week before ${scorers} caught fire ${slotClause(dw.slot).trim()} and flipped it to ${dw.wCum}–${dw.lCum}. Once ahead, ${W} never gave it back.`;
    case 'frontRun':
      return `${W} front-loaded the whole damn thing — ${earlyCum} on the board before the late games even kicked off — then sat back and watched ${L} chase a lead that was never coming back.`;
    case 'nail':
      return `This one went the distance. ${L} was still within ${tl.preFinalLead} heading into ${last.name}, but ${scorers} slammed the door ${slotClause(last.slot).trim()} to make it ${last.wCum}–${last.lCum} final.`;
    case 'wire':
      return `From the early windows on, ${W} kept ${L} at arm's length, building from ${first.name} through ${last.name} to a comfortable ${last.wCum}–${last.lCum} without ever really sweating it.`;
    default:
      return `${W} and ${L} traded haymakers into the afternoon before ${W} pulled clear, turning it into a ${last.wCum}–${last.lCum} final by ${last.name}.`;
  }
}

function writeLead(stories, week, leagueName) {
  if (!stories.length) return { headline:`Week ${week}: Quiet in the Booth`, standfirst:'Scores still trickling in.', paragraphs:[] };
  const teams = stories.flatMap(s=>[s.winner,s.loser]);
  const high = [...teams].sort((a,b)=>b.score-a.score)[0];
  const low  = [...teams].sort((a,b)=>a.score-b.score)[0];
  const closest = [...stories].sort((a,b)=>a.margin-b.margin)[0];
  const biggest = [...stories].sort((a,b)=>b.margin-a.margin)[0];
  const top = [...teams.flatMap(t=>t.starters)].sort((a,b)=>b.points-a.points)[0];
  const s = Math.round(high.score + week);
  const pick = (arr, o) => seededPick(arr, s + o);
  const topName = top ? playerName(top.player, top.id) : 'the studs';
  const headline = pick([
    `Week ${week}: ${high.manager} Lights the Scoreboard on Fire`,
    `Week ${week} From the Booth: Chaos, Carnage, and a ${closest.margin}-Point Heart Attack`,
    `Week ${week}: ${topName} Runs the Whole Show`,
  ], 1);
  const P = [];
  let p1 = pick([`Another week in the books, and the scoreboard's got jokes. `, `Welcome to the wrap, degenerates. `, `Let's survey the wreckage. `], 2) +
    `${high.manager} torched the league for a week-high ${high.score}`;
  if (top && top.points > 0) p1 += `, and you can thank ${topName}, who ${top.line && hasProduction(top.stats) ? `went nuclear for ${top.points} on ${top.line}` : `dropped ${top.points}`}`;
  p1 += `. Meanwhile, down in the shitter, ${low.manager} mustered a grand total of ${low.score} — the fantasy equivalent of showing up to a gunfight and forgetting the damn gun.`;
  P.push(p1);
  if (closest && !closest.tie) {
    let p2 = `The heart-attack special went to ${closest.winner.manager}, who survived ${closest.loser.manager} by ${closest.margin} — the kind of finish that takes a year off your life.`;
    if (biggest && biggest !== closest) p2 += ` On the other end of the dignity spectrum, ${biggest.winner.manager} beat ${biggest.loser.manager} by a frankly obscene ${biggest.margin}.`;
    P.push(p2);
  }
  P.push(pick([`Enough preamble. To the carnage.`, `Now — to the tape, where every crime is documented in full.`, `Grab a beer. Here's how it all shook out, matchup by bloody matchup.`], 3));
  return { headline, standfirst:`${leagueName} · Week ${week} · the only wrap that reads the box score so you don't have to`, paragraphs:P };
}

function writeAwards(stories) {
  if (!stories.length) return [];
  const teams = stories.flatMap(s=>[s.winner,s.loser]);
  const starters = teams.flatMap(t=>t.starters);
  const A = [];
  const topTeam = [...teams].sort((a,b)=>b.score-a.score)[0];
  if (topTeam) A.push({ emoji:'👑', title:'Team of the Week', name:topTeam.manager,
    detail:`${topTeam.score} points${topTeam.top?` · led by ${playerName(topTeam.top.player,topTeam.top.id)} (${topTeam.top.points})`:''}` });
  const topP = [...starters].sort((a,b)=>b.points-a.points)[0];
  if (topP && topP.points > 0) A.push({ emoji:'🔥', title:'Performance of the Week', name:playerName(topP.player,topP.id), detail:`${topP.points} pts${topP.line?` · ${topP.line}`:''}` });
  const busts = teams.map(t=>t.bust).filter(Boolean);
  const worst = [...busts].sort((a,b)=>(a.points-a.projected)-(b.points-b.projected))[0];
  if (worst) A.push({ emoji:'🧊', title:'Faceplant of the Week', name:playerName(worst.player,worst.id), detail:`Projected ${worst.projected}, scored ${worst.points}` });
  const closest = [...stories].sort((a,b)=>a.margin-b.margin)[0];
  if (closest && !closest.tie && closest.margin <= 12) A.push({ emoji:'😰', title:'Nail-Biter', name:`${closest.winner.manager} def. ${closest.loser.manager}`, detail:`Margin of ${closest.margin}` });
  const regrets = teams.map(t=>t.benchRegret).filter(Boolean);
  const wr = [...regrets].sort((a,b)=>b.diff-a.diff)[0];
  if (wr) A.push({ emoji:'🪑', title:'Bench Blunder', name:playerName(wr.bench.player,wr.bench.id), detail:`${wr.bench.points} pts stranded on the bench` });
  return A;
}

// ---------------------------------------------------------------------
//  Values (season-long, league-scored) for Trade + Draft
// ---------------------------------------------------------------------
const REAL_POS = new Set(['QB','RB','WR','TE','K','DEF']);
function computeValues(seasonRaw, scoring, players) {
  const projectionBased = Object.keys(seasonRaw).length > 0;
  const cache = new Map();
  const value = (id) => {
    if (cache.has(id)) return cache.get(id);
    let v = 0;
    if (projectionBased && seasonRaw[id]) v = scoreStats(seasonRaw[id], scoring);
    else { const rank = players[id]?.search_rank; if (typeof rank === 'number' && rank > 0) v = Math.max(0, 300 - rank) / 3; }
    cache.set(id, v); return v;
  };
  const ranked = Object.keys(players).filter(id => {
    const p = players[id], pos = p.position || p.fantasy_positions?.[0];
    return pos && REAL_POS.has(pos) && (p.team || pos === 'DEF');
  }).sort((a,b)=>value(b)-value(a));
  return { value, ranked, projectionBased };
}
function startingNeeds(rosterPositions) {
  const needs = {};
  for (const slot of rosterPositions) {
    if (slot === 'BN' || slot === 'IR' || slot === 'TAXI') continue;
    const base = (slot.includes('FLEX') || slot === 'SUPER_FLEX') ? 'FLEX' : slot;
    needs[base] = (needs[base] || 0) + 1;
  }
  return needs;
}

// ---------------------------------------------------------------------
//  Sample league — a self-contained 8-team demo so the News Room can be
//  previewed and tuned without a real Sleeper season. Stats are generated
//  deterministically per week (stable output), scored by the real engine.
//  Clearly labeled as a sample; not presented as real historical results.
// ---------------------------------------------------------------------
function ds(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
function genStats(pos, seed) {
  const r = (a, b, k) => Math.round(a + (b - a) * ds(seed + k));
  if (pos === 'QB') { const att = r(28,42,1), cmp = Math.round(att*(0.58+0.12*ds(seed+2)));
    return { pass_att:att, pass_cmp:cmp, pass_yd:r(190,360,3), pass_td:r(0,4,4), pass_int:r(0,2,5),
      rush_yd: ds(seed+6)>0.7 ? r(10,45,7) : 0, rush_td: ds(seed+8)>0.9 ? 1 : 0 }; }
  if (pos === 'RB') { const rec = r(1,6,5);
    return { rush_att:r(7,21,1), rush_yd:r(25,135,2), rush_td: ds(seed+3)>0.6 ? r(0,2,4) : 0,
      rec, rec_yd:r(2,55,6), rec_td: ds(seed+7)>0.88 ? 1 : 0, rec_tgt: rec + r(0,3,9) }; }
  if (pos === 'WR') { const rec = r(2,10,1);
    return { rec, rec_yd:r(18,155,2), rec_td: ds(seed+3)>0.7 ? r(0,2,4) : 0, rec_tgt: rec + r(1,5,5) }; }
  if (pos === 'TE') { const rec = r(2,8,1);
    return { rec, rec_yd:r(15,95,2), rec_td: ds(seed+3)>0.8 ? 1 : 0, rec_tgt: rec + r(1,3,5) }; }
  if (pos === 'K') { const fgm = r(1,4,1);
    return { fgm, fga: fgm + (ds(seed+3)>0.6?1:0), xpm:r(1,4,2), fgm_50p: ds(seed+4)>0.8?1:0 }; }
  if (pos === 'DEF') return { sack:r(1,5,1), int:r(0,2,2), ff:r(0,2,3), fum_rec:r(0,1,4),
      def_td: ds(seed+5)>0.85?1:0, pts_allow:r(7,31,6) };
  return {};
}

  const league = { league_id:'demo', name:'Sample League', season:'2025', status:'complete',
    total_rosters:8, avatar:null, scoring_settings:DEMO_SCORING,
    roster_positions:['QB','RB','RB','WR','WR','TE','FLEX','K','DEF','BN','BN'], settings:{} };
  const bundle = { league, rosters, users: Object.values(usersById), players, usersById, rostersByOwner,
    myRoster: rosters[0] };

  // A week's worth of stats + a couple of storyline overrides (one bust, one
  // bench blunder). Game-window timing emerges organically from player slots.
  function week(wk) {
    const weeklyStats = {}, weeklyProjections = {};
    for (const id in players) weeklyStats[id] = genStats(players[id].position, hashId(id) * 100 + wk * 7);

    const bustTeam = rosters[wk % 8];
    const bustId = bustTeam.starters[1]; // RB1
    weeklyStats[bustId] = { rush_att:8, rush_yd:14, rush_td:0, rec:1, rec_yd:5, rec_tgt:3 };
    weeklyProjections[bustId] = { rush_att:16, rush_yd:92, rush_td:1, rec:4, rec_yd:31, rec_tgt:5 };

    const benchTeam = rosters[(wk * 3) % 8];
    const benchId = benchTeam.players[10]; // BN2
    const starterId = benchTeam.starters[4]; // WR2
    weeklyStats[benchId] = players[benchId].position === 'RB'
      ? { rush_att:19, rush_yd:128, rush_td:2, rec:3, rec_yd:24, rec_tgt:4 }
      : { rec:9, rec_yd:151, rec_td:2, rec_tgt:12 };
    weeklyStats[starterId] = { rec:2, rec_yd:16, rec_td:0, rec_tgt:6 };

    const matchups = rosters.map((r, i) => {
      const pts = r.starters.reduce((s, id) => s + scoreStats(weeklyStats[id], DEMO_SCORING), 0);
      return { roster_id: r.roster_id, matchup_id: Math.floor(i / 2) + 1, points: Math.round(pts * 100) / 100,
        players: r.players, starters: r.starters, players_points: null, starters_points: null };
    });
    return { matchups, weeklyStats, weeklyProjections };
  }
  return { bundle, week };
}
function hashId(id) { let h = 0; for (let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) % 100000; return h; }

function magazineToText(nl) {
  if (!nl) return '';
  const L = [];
  L.push(`*${String(nl.leagueName || '').toUpperCase()}* — FANTASY LEAGUE MAGAZINE`);
  L.push(`_Week ${nl.week} Edition_`);
  L.push('');
  L.push('📋 *SCORES*');
  (nl.scoreboard || []).forEach(g => L.push(`${g.win.manager} ${g.win.score} — ${g.lose.score} ${g.lose.manager}`));
  if (nl.lead) { L.push(''); L.push(`📰 *${nl.lead.headline}*`); if (nl.lead.paragraphs[0]) L.push(nl.lead.paragraphs[0]); }
  L.push(''); L.push('🏈 *GAME STORIES*');
  (nl.stories || []).forEach(s => { L.push(`*${s.headline}*`); if (s.paragraphs[0]) L.push(s.paragraphs[0]); L.push(''); });
  (S.desk || []).filter(a => a.week === nl.week).forEach(a => { L.push(`💬 *${a.headline}*`); if (a.paragraphs[0]) L.push(a.paragraphs[0]); L.push(''); });
  if (nl.powerRankings) { L.push('🔮 *POWER RANKINGS*'); nl.powerRankings.forEach(p => L.push(`${p.rank}. ${p.manager} (${p.tag})`)); }
  const url = (typeof location !== 'undefined' && location.href) ? location.href : '';
  L.push(''); L.push(`— Read the full illustrated edition: ${url}`);
  return L.join('\n');
}

/**
 * Fetch a user's NFL leagues across the current season and the two prior ones,
 * tagging each with its season and sorting newest-first. This is what lets you
 * pick last year's team to test the News Room on completed, real data.
 */
async function leaguesAcrossSeasons(userId, baseSeason) {
  const base = Number(baseSeason) || new Date().getFullYear();
  const seasons = [String(base), String(base - 1), String(base - 2)];
  const results = await Promise.all(seasons.map((s) => getUserLeagues(userId, s).catch(() => [])));
  const all = [];
  results.forEach((ls, i) => (ls || []).forEach((lg) => { if (!lg.season) lg.season = seasons[i]; all.push(lg); }));
  all.sort((a, b) => Number(b.season) - Number(a.season) || String(a.name).localeCompare(String(b.name)));
  return all;
}

  } catch (e) { S.setup.error = 'Something went wrong. Check your connection and try again.'; }
  finally { S.setup.busy = false; renderSetup(); }
}

/**
 * Walk previous_league_id backward from the newest league to enumerate every
 * season the league existed on Sleeper. Returns newest → oldest.
 */
async function buildLeagueHistory(head) {
  const out = [];
  let cur = head, guard = 0;
  while (cur && guard < 30) {
    out.push({ league_id: cur.league_id, season: cur.season, name: cur.name });
    const prev = cur.previous_league_id;
    if (!prev || prev === '0') break;
    try { cur = await getLeague(prev); } catch { break; }
    guard++;
  }
  return out;
}

// A fun, league-first cover: illustrated art, a matchup-driven headline (chat
// included as a source), and a manager as the cover subject.
function coverPackage(nl) {
  const power = nl.powerRankings || [];
  const teams = nl.stories.flatMap(s => [s.winner, s.loser]);
  const big = [...nl.stories].filter(s => !s.tie).sort((a,b)=>b.margin-a.margin)[0];
  const close = [...nl.stories].filter(s => !s.tie).sort((a,b)=>a.margin-b.margin)[0];
  const leader = power[0], cellar = power[power.length - 1];
  const deskArt = (S.desk || []).find(a => a.week === nl.week);
  const U = s => String(s || '').toUpperCase();
  const seed = Math.round((nl.week || 1) * 13 + (big ? big.margin : 0) + (leader ? leader.manager.length : 0));
  const pick = (arr, o) => seededPick(arr, seed + o);

  const cands = [];
  if (deskArt) cands.push(U(deskArt.headline));              // let the group chat headline the issue
  if (big) cands.push(pick([`${U(big.winner.manager)} BURIES ${U(big.loser.manager)}`, `${U(big.loser.manager)} GETS LEFT FOR DEAD`, `MASSACRE: ${U(big.winner.manager)} RUNS IT UP`], 2));
  if (leader) cands.push(pick([`CAN ANYONE STOP ${U(leader.manager)}?`, `${U(leader.manager)} IS RUNNING AWAY WITH IT`], 3));
  if (close) cands.push(`${U(close.winner.manager)} STEALS ONE FROM ${U(close.loser.manager)}`);
  if (cellar) cands.push(`${U(cellar.manager)} HITS ROCK BOTTOM`);
  // Bias toward the chat headline when it exists, else the juiciest matchup.
  const headline = deskArt && pick([true, false, false], 5) ? cands[0] : pick(cands.filter(Boolean).slice(deskArt ? 1 : 0), 1) || 'ANOTHER WEEK OF CHAOS';

  const subjTeam = big ? big.winner : (leader ? teams.find(t => t.manager === leader.manager) : teams[0]);
  const subject = subjTeam ? {
    name: subjTeam.manager, score: subjTeam.score,
    tag: (big && subjTeam === big.winner) ? `${big.margin}-POINT DEMOLITION OF ${U(big.loser.manager)}` : leader && subjTeam.manager === leader.manager ? 'YOUR LEAGUE LEADER' : 'TOP DOG OF THE WEEK',
  } : null;

  const lines = [];
  if (leader && cellar) lines.push(`POWER RANKINGS: ${leader.manager} on top, ${cellar.manager} in the cellar`);
  if (close) lines.push(`${close.winner.manager} edge ${close.loser.manager} by ${close.margin}`);
  if (deskArt) lines.push(`GROUP CHAT: ${deskArt.headline}`);
  else if (nl.studs && nl.studs[0]) lines.push(`${nl.studs[0].manager} rode ${nl.studs[0].name}'s ${nl.studs[0].points} to glory`);
  return { headline, subject, lines: lines.slice(0, 4) };
}
function starPoints(cx, cy, outer, inner, points) {
  let p = '';
  for (let i = 0; i < points * 2; i++) { const r = i % 2 ? inner : outer; const a = (Math.PI / points) * i - Math.PI / 2; p += `${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)} `; }
  return p.trim();
}
function coverArt(seed) {
  const palette = ['#f5a623', '#4c8dff', '#ff5c5c', '#a970ff'];
  const c2 = palette[Math.abs(seed) % palette.length];
  let lines = '';
  for (let i = -2; i < 10; i++) { const x = i * 60; lines += `<line x1="${x}" y1="800" x2="${x + 260}" y2="0" stroke="rgba(255,255,255,.05)" stroke-width="2"/>`; }
  let dots = '';
  for (let r = 0; r < 6; r++) for (let c = 0; c < 7; c++) dots += `<circle cx="${250 + c * 22}" cy="${34 + r * 22}" r="${3.4 - r * 0.35}" fill="${c2}" opacity="${0.55 - r * 0.07}"/>`;
  const burst = starPoints(300, 470, 210, 88, 16);
  return `<svg class="cover-bg" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111a22"/><stop offset="1" stop-color="#090d12"/></linearGradient>
      <radialGradient id="cr" cx="0.75" cy="0.12" r="0.95"><stop offset="0" stop-color="${c2}" stop-opacity=".30"/><stop offset="1" stop-color="${c2}" stop-opacity="0"/></radialGradient>
    </defs>
    <rect width="400" height="800" fill="url(#cg)"/>
    <g>${lines}</g>
    <rect width="400" height="800" fill="url(#cr)"/>
    <polygon points="${burst}" fill="var(--accent)" opacity=".12"/>
    <polygon points="${starPoints(300,470,150,64,16)}" fill="none" stroke="var(--accent)" stroke-opacity=".25" stroke-width="1.5"/>
    <g>${dots}</g>
  </svg>`;
}
function coverHtml(nl) {
  const pkg = coverPackage(nl);
  const seed = Math.round((nl.week || 1) * 7 + (pkg.subject ? pkg.subject.name.length : 0) + (pkg.headline ? pkg.headline.length : 0));
  return `<div class="cover cover-full">

    <div class="cover-inner">
      ${coverTools()}
      <div class="cover-mast">${esc(magTitle())}</div>
      <div class="cover-sub">FANTASY LEAGUE MAGAZINE · WEEK ${nl.week}${S.demo ? ' · SAMPLE' : ''}</div>

      </div>` : ''}
      <div class="cover-lines">${pkg.lines.map(l => `<div class="cover-line">${esc(l)}</div>`).join('')}</div>
    </div>
  </div>`;
}

async function renderNews() {

        ({ matchups, weeklyStats, weeklyProjections } = S.demo.week(wk));
      } else {

          getMatchups(S.leagueId, wk), getWeeklyStats(S.season, wk), getWeeklyProjections(S.season, wk),
        ]);

      nl = buildNewsletter({ week:wk, league:S.bundle.league, matchups, rosters:S.bundle.rosters,
        usersById:S.bundle.usersById, players:S.bundle.players, weeklyStats, weeklyProjections });
      S.newsCache[wk] = nl;
    } catch { nl = null; }
  }
  if (S.tab !== 'news' || S.activeWeek !== wk) return; // user moved on
  if (!nl || !nl.hasData) {
    const seasonHint = S.demo
      ? 'Use the week arrows to see another sample week.'

  const lead = `<div class="lead"><h1>${esc(nl.lead.headline)}</h1>

  const feature = nl.feature ? articleHtml(nl.feature, true) : '';
  const deskArts = (S.desk || []).filter(a => a.week === wk);

  const awards = nl.awards.length ? `<div class="card awards" style="border-color:var(--accent-d)">
    <div class="at">Week ${wk} Superlatives</div>
    ${nl.awards.map(a=>`<div class="award"><span class="em">${a.emoji}</span><div style="flex:1">
      <div class="lab">${esc(a.title)}</div><div class="nm">${esc(a.name)}</div><div class="dt">${esc(a.detail)}</div>
    </div></div>`).join('')}</div>` : '';
  const maxW = Math.max(...(nl.powerRankings||[]).map(p=>p.week||0), 1);
  const power = nl.powerRankings && nl.powerRankings.length ? `<div class="card">
    <div class="at">Power Rankings</div>
    ${nl.powerRankings.map(p=>`<div class="pr">
      <span class="ovr" style="width:24px">${p.rank}</span>
      <div style="flex:1">
        <div class="nm">${esc(p.manager)} <span class="faint" style="font-weight:600;font-size:12px">${esc(p.tag)}</span></div>
        <div class="prbar"><div class="prfill" style="width:${Math.round((p.week/maxW)*100)}%"></div></div>
        <div class="dt">${esc(p.note)}</div>
      </div></div>`).join('')}</div>` : '';
  const coverStory = nl.stories[0] ? storyHtml(nl.stories[0], true) : '';
  const otherStories = nl.stories.slice(1).map(s => storyHtml(s, false)).join('');
  const colophon = `<div class="colophon">Auto-written from real Sleeper box scores — every stat line and margin is genuine. The voice, jokes, and profanity are on the house.</div>`;
  setContent(coverHtml(nl) + seasonBar() + weekStepper()
    + sec('Cover Story') + coverStory
    + sec('The Column') + lead
    + (feature ? sec('League Feature') + feature : '')
    + sec('By the Numbers') + numbersHtml(nl.numbers)

}

function storyHtml(s, feature) {

function timelineHtml(s) {

async function ensureValues() {
  if (S.values) return;
  const raw = await getSeasonProjections(S.season);
  S.values = computeValues(raw, S.bundle.league.scoring_settings, S.bundle.players);
}
async function renderTrade() {
  setContent(spinner('Loading player values…'));
  await ensureValues();
  if (S.tab !== 'trade') return;
  drawTrade();
}
function drawTrade() {
  const b = S.bundle, V = S.values;
  const partners = b.rosters.filter(r => r.roster_id !== (b.myRoster && b.myRoster.roster_id));
  const partner = partners.find(r => r.roster_id === S.trade.partnerId) || null;
  const giveVal = sum([...S.trade.give].map(V.value));
  const getVal  = sum([...S.trade.get].map(V.value));
  const net = round1(getVal - giveVal);
  const vd = judgeTrade(net, giveVal);
  const sortByVal = ids => [...(ids||[])].sort((a,b)=>V.value(b)-V.value(a));

  const selRow = (id, side, tint) => {
    const p = b.players[id], on = S.trade[side].has(id);
    return `<button class="selrow ${on?'on':''}" data-act="trade-toggle" data-side="${side}" data-id="${esc(id)}">
      <span class="check" style="${on?`background:${tint};border-color:${tint}`:''}">${on?'✓':''}</span>
      ${posBadge(posOfPlayer(p))}
      <span style="flex:1"><span class="nm" style="display:block">${esc(playerName(p,id))}</span>
        <span class="tm">${esc(p?.team||'FA')}</span></span>
      <span class="val">${Math.round(V.value(id))}</span></button>`;
  };

  let html = '';
  if (!V.projectionBased) html += `<div class="center faint" style="font-size:11px;margin-bottom:8px">Season projections unavailable — values are an ADP-based estimate.</div>`;
  html += `<div class="card verdict" style="border-color:${vd.color}">
    <div class="vt" style="color:${vd.color}">${esc(vd.label)}</div>
    <div class="vs">${esc(vd.detail)}</div>
    <div class="tally">
      <div class="t"><div class="tv">${round1(giveVal)}</div><div class="tl">You give</div></div>
      <span class="arw">⇄</span>
      <div class="t"><div class="tv" style="color:var(--accent)">${round1(getVal)}</div><div class="tl">You get</div></div>
    </div>
    <div class="netbar">
      <div style="flex:${Math.max(giveVal,0.01)};background:var(--red)"></div>
      <div style="flex:${Math.max(getVal,0.01)};background:var(--accent)"></div>
    </div>
    <div class="muted" style="font-weight:700;font-size:13px">Net for you: ${net>0?'+':''}${net} value pts</div>
  </div>`;

  html += `<div class="seclabel">Trade with</div><div class="partners">`;
  html += partners.map(r => `<button class="pchip ${r.roster_id===S.trade.partnerId?'on':''}" data-act="trade-partner" data-id="${r.roster_id}">
      ${avatarHtml(avatarUrl(b.usersById[r.owner_id]?.avatar),30,managerName(r.owner_id))}
      <div class="pn">${esc(managerName(r.owner_id))}</div></button>`).join('');
  html += `</div>`;

  html += `<div class="seclabel">You give — tap to offer</div><div class="card" style="padding:6px 12px">
    ${sortByVal(b.myRoster && b.myRoster.players).map(id=>selRow(id,'give','var(--red)')).join('')}</div>`;

  if (partner) {
    html += `<div class="seclabel">${esc(managerName(partner.owner_id))} gives — tap to request</div>
      <div class="card" style="padding:6px 12px">${sortByVal(partner.players).map(id=>selRow(id,'get','var(--accent)')).join('')}</div>`;
  } else {
    html += empty('Pick a trade partner above', 'Then tap players from each side to build the deal.');
  }
  html += `<div class="colophon">Values are projected full-season fantasy points under your league's scoring. A guide, not gospel — needs, byes and upside are yours to weigh.</div>`;
  setContent(html);
}
function judgeTrade(net, giveVal) {
  const base = Math.max(giveVal, 20), pct = net / base;
  if (giveVal === 0) return { label:'Build your offer', detail:'Tap players on each side to see the verdict.', color:'var(--faint)' };
  if (pct > 0.15)  return { label:'You win this trade', detail:"You're getting meaningfully more value than you send.", color:'var(--accent)' };
  if (pct < -0.15) return { label:"You're overpaying", detail:'You send more value than you get back — ask for a sweetener.', color:'var(--red)' };
  return { label:'Fair deal', detail:'Value is close to even. It comes down to fit and need.', color:'var(--blue)' };
}
