// ---- Per-article share: render one article/section to a branded card image --
// A generic magazine-card renderer — headline + dek + prose, or a titled list —
// so every story and section can be saved/shared as its own image.
async function articleImageBlob(payload) {
  const W = 1080, PAD = 84, CW = W - PAD * 2;
  const cv = document.createElement('canvas'); const g = cv.getContext('2d'); if (!g) return null;
  const ACCENT = '#31d158', INK = '#e8eef5', DIM = '#9fb0c3', FAINT = '#64748b';
  const SERIF = 'Georgia, "Times New Roman", serif', SANS = 'Arial, sans-serif';
  const wrap = (text, font, maxW) => {
    g.font = font; const out = [];
    String(text).split('\n').forEach(seg => {
      const words = seg.split(/\s+/); let cur = '';
      for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
      out.push(cur);
    });
    return out;
  };
  // Lay the card out as a list of drawable line-groups, measuring height first.
  const groups = [];
  const add = (text, font, size, color, lh, gap, align) => { const lines = wrap(text, `${font}`, CW); groups.push({ lines, font, size, color, lh, gap: gap || 0, align: align || 'left' }); };
  add((payload.kicker || 'THE MAGAZINE').toUpperCase().split('').join(' '), `900 26px ${SANS}`, 26, ACCENT, 34, 0);
  add(payload.headline || '', `900 66px ${SERIF}`, 66, INK, 74, 20);
  if (payload.meta) add(payload.meta, `800 30px ${SANS}`, 30, ACCENT, 40, 14);
  if (payload.dek) add(payload.dek, `italic 700 34px ${SERIF}`, 34, DIM, 44, 16);
  (payload.paragraphs || []).forEach((p, i) => add(p, `400 33px ${SERIF}`, 33, INK, 47, i === 0 ? 26 : 18));
  (payload.lines || []).forEach((l, i) => add('•  ' + l, `600 31px ${SANS}`, 31, i % 2 ? DIM : INK, 44, i === 0 ? 24 : 10));
  // Height: sum groups + top/bottom pad + footer.
  let total = PAD;
  groups.forEach(gr => { total += gr.gap + gr.lines.length * gr.lh; });
  total += 90; // footer
  const H = Math.max(1080, Math.min(4400, total + PAD));
  cv.width = W; cv.height = H;
  // Background + texture (context state was reset by the resize).
  const grad = g.createLinearGradient(0, 0, W, H); grad.addColorStop(0, '#111a22'); grad.addColorStop(1, '#090d12');
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  g.strokeStyle = 'rgba(255,255,255,0.045)'; g.lineWidth = 3;
  for (let i = -2; i < 22; i++) { g.beginPath(); g.moveTo(i * 90, H); g.lineTo(i * 90 + 420, 0); g.stroke(); }
  const glow = g.createRadialGradient(W * 0.82, 120, 40, W * 0.82, 120, 640);
  glow.addColorStop(0, 'rgba(49,209,88,0.16)'); glow.addColorStop(1, 'rgba(49,209,88,0)');
  g.fillStyle = glow; g.fillRect(0, 0, W, H);
  // Draw the groups.
  g.textAlign = 'left'; let y = PAD + 40;
  for (const gr of groups) {
    y += gr.gap; g.font = gr.font; g.fillStyle = gr.color;
    for (const line of gr.lines) { g.fillText(line, PAD, y); y += gr.lh; }
  }
  // Footer strip.
  g.fillStyle = ACCENT; g.fillRect(PAD, H - 78, 46, 5);
  g.fillStyle = FAINT; g.font = `800 24px ${SANS}`;
  g.fillText(`${(S.magName || 'Skirt Chasers').toUpperCase()} · DYNASTY LEAGUE MAGAZINE · WK ${S.activeWeek}`, PAD, H - 44);
  return await new Promise(res => cv.toBlob(res, 'image/png', 0.92));
}

function buildSharePayload(id) {

async function leaguesAcrossSeasons(userId, baseSeason) {
  const base = Number(baseSeason) || new Date().getFullYear();
  const seasons = [String(base), String(base - 1), String(base - 2)];
  const results = await Promise.all(seasons.map((s) => getUserLeagues(userId, s).catch(() => [])));
  const all = [];
  results.forEach((ls, i) => (ls || []).forEach((lg) => { if (!lg.season) lg.season = seasons[i]; all.push(lg); }));
  all.sort((a, b) => Number(b.season) - Number(a.season) || String(a.name).localeCompare(String(b.name)));
  return all;
}

async function doLookup() {
  const name = (S.setup.username || '').trim();
  if (!name) return;
  S.setup.busy = true; S.setup.error = null; S.setup.user = null; S.setup.leagues = []; renderSetup();
  try {
    const base = (S.nflState && S.nflState.season) || String(new Date().getFullYear());
    const u = await getUser(name);
    if (!u || !u.user_id) { S.setup.error = `No Sleeper user found for "${name}".`; return; }
    S.setup.user = u; S.setup.season = base;
    const ls = await leaguesAcrossSeasons(u.user_id, base);
    S.setup.leagues = ls;
    if (!ls.length) S.setup.error = 'That user has no NFL leagues on Sleeper.';
  } catch (e) { S.setup.error = 'Something went wrong. Check your connection and try again.'; }
  finally { S.setup.busy = false; renderSetup(); }
}

async function enterApp() {
  app.innerHTML = spinner('Loading your league…');
  try {
    const [league, rosters, users, players] = await Promise.all([
      getLeague(S.leagueId), getRosters(S.leagueId), getLeagueUsers(S.leagueId), getPlayers(),
    ]);
    const usersById = {}; users.forEach(u => usersById[u.user_id] = u);
    const rostersByOwner = {}; rosters.forEach(r => { if (r.owner_id) rostersByOwner[r.owner_id] = r; });
    const myRoster = rosters.find(r => r.owner_id === S.user.user_id) || null;
    S.bundle = { league, rosters, users, players, usersById, rostersByOwner, myRoster };
    loadDesk(); loadPower(); loadEspnHist(); loadBundledHistory();
    S.values = null; S.newsCache = {}; S.draft = { posFilter:'ALL', draft:null, picks:[], loaded:false };
    S.trade = { partnerId:null, give:new Set(), get:new Set() };
    // Season history via Sleeper's previous_league_id chain — the reliable way
    // to see every season a league existed, even 20 years deep. Built in the
    // background so startup stays fast; the season switcher appears when ready.
    if (!S.history || !S.history.some(h => h.league_id === S.leagueId)) {
      S.history = [{ league_id: league.league_id, season: league.season, name: league.name }];
      buildLeagueHistory(league).then(h => {
        S.history = h;
        if (S.tab === 'news' && S.bundle && S.bundle.league.league_id === league.league_id) renderNews();
      });
    }
    renderShell(); renderTab();
  } catch (e) {
    app.innerHTML = empty("Couldn't load your league", 'Check your connection, then pull to refresh.');
  }
}

/**
 * Walk previous_league_id backward from the newest league to enumerate every
 * season the league existed on Sleeper. Returns newest → oldest.
 */
async function buildLeagueHistory(head) {
  const out = [];
  let cur = head, guard = 0;
  while (cur && guard < 30) {
    out.push({ league_id: cur.league_id, season: cur.season, name: cur.name });
    const prev = cur.previous_league_id;
    if (!prev || prev === '0') break;
    try { cur = await getLeague(prev); } catch { break; }
    guard++;
  }
  return out;
}

// A fun, league-first cover: illustrated art, a matchup-driven headline (chat
// included as a source), and a manager as the cover subject.
function coverPackage(nl) {
  const power = nl.powerRankings || [];
  const teams = nl.stories.flatMap(s => [s.winner, s.loser]);
  const big = [...nl.stories].filter(s => !s.tie).sort((a,b)=>b.margin-a.margin)[0];
  const close = [...nl.stories].filter(s => !s.tie).sort((a,b)=>a.margin-b.margin)[0];
  const leader = power[0], cellar = power[power.length - 1];
  const deskArt = (S.desk || []).find(a => a.week === nl.week);
  const U = s => String(s || '').toUpperCase();
  const seed = Math.round((nl.week || 1) * 13 + (big ? big.margin : 0) + (leader ? leader.manager.length : 0));
  const pick = (arr, o) => seededPick(arr, seed + o);

  const cands = [];
  if (deskArt) cands.push(U(deskArt.headline));              // let the group chat headline the issue
  if (big) cands.push(pick([`${U(big.winner.manager)} BURIES ${U(big.loser.manager)}`, `${U(big.loser.manager)} GETS LEFT FOR DEAD`, `MASSACRE: ${U(big.winner.manager)} RUNS IT UP`], 2));
  if (leader) cands.push(pick([`CAN ANYONE STOP ${U(leader.manager)}?`, `${U(leader.manager)} IS RUNNING AWAY WITH IT`], 3));
  if (close) cands.push(`${U(close.winner.manager)} STEALS ONE FROM ${U(close.loser.manager)}`);
  if (cellar) cands.push(`${U(cellar.manager)} HITS ROCK BOTTOM`);
  // Bias toward the chat headline when it exists, else the juiciest matchup.
  const headline = deskArt && pick([true, false, false], 5) ? cands[0] : pick(cands.filter(Boolean).slice(deskArt ? 1 : 0), 1) || 'ANOTHER WEEK OF CHAOS';

  const subjTeam = big ? big.winner : (leader ? teams.find(t => t.manager === leader.manager) : teams[0]);
  const subject = subjTeam ? {
    name: subjTeam.manager, score: subjTeam.score,
    tag: (big && subjTeam === big.winner) ? `${big.margin}-POINT DEMOLITION OF ${U(big.loser.manager)}` : leader && subjTeam.manager === leader.manager ? 'YOUR LEAGUE LEADER' : 'TOP DOG OF THE WEEK',
  } : null;

  const lines = [];
  // History nugget: title pedigree of the cover subject, when we know it.
  const subjHist = subject ? histFor(subject.name) : null;
  if (subjHist && subjHist.titles > 0) lines.push(`${U(subject.name)}: ${subjHist.titles}× CHAMP${subjHist.titleYears.length ? ' (' + subjHist.titleYears.slice(0, 3).join(', ') + ')' : ''}`);
  else if (S.histIndex && S.histIndex.defending) lines.push(`${U(S.histIndex.defending)} DEFENDS THE CROWN`);
  if (leader && cellar) lines.push(`POWER RANKINGS: ${leader.manager} on top, ${cellar.manager} in the cellar`);
  if (close) lines.push(`${close.winner.manager} edge ${close.loser.manager} by ${close.margin}`);
  if (deskArt) lines.push(`GROUP CHAT: ${deskArt.headline}`);
  else if (nl.studs && nl.studs[0]) lines.push(`${nl.studs[0].manager} rode ${nl.studs[0].name}'s ${nl.studs[0].points} to glory`);
  return { headline, subject, lines: lines.slice(0, 4) };
}

async function renderNews() {
  setContent(newsChrome() + spinner(`Writing the Week ${S.activeWeek} edition…`));
  const wk = S.activeWeek;
  let nl = S.newsCache[wk];
  if (!nl) {
    try {
      let matchups, weeklyStats, weeklyProjections;
      if (S.demo) {
        ({ matchups, weeklyStats, weeklyProjections } = S.demo.week(wk));
      } else {
        [matchups, weeklyStats, weeklyProjections] = await Promise.all([
          getMatchups(S.leagueId, wk), getWeeklyStats(S.season, wk), getWeeklyProjections(S.season, wk),
        ]);
      }
      nl = buildNewsletter({ week:wk, league:S.bundle.league, matchups, rosters:S.bundle.rosters,
        usersById:S.bundle.usersById, players:S.bundle.players, weeklyStats, weeklyProjections });
      try { nl.trades = await buildTradeReview(wk); } catch { nl.trades = []; }
      applyHistoryContext(nl);
      S.newsCache[wk] = nl;
    } catch { nl = null; }
  }
  if (S.tab !== 'news' || S.activeWeek !== wk) return; // user moved on
  if (!nl || !nl.hasData) {
    const canSampleLeague = !S.demo && S.bundle && S.leagueId !== 'demo';
    const seasonHint = S.demo
      ? 'Use the week arrows to see another sample week.'
      : canSampleLeague
        ? 'No games are scored for this week yet — Sleeper can’t import ESPN/Yahoo history. Preview a full issue built from YOUR league (real teams and managers, made-up scores) below. Your real newsletters appear here once the season kicks off.'
        : 'This is likely your first Sleeper season with no games played yet — Sleeper can’t import ESPN/Yahoo history. Preview the writing with a sample league below, and your real newsletters will appear here once the season kicks off.';
    const demoBtn = S.demo ? ''
      : canSampleLeague
        ? `<button class="btn" data-act="sample-league" style="max-width:340px;margin:12px auto 0">Preview a sample issue from your league →</button>`
        : `<button class="btn" data-act="demo" style="max-width:320px;margin:12px auto 0">Preview a sample league →</button>`;
    setContent(newsChrome() + empty(`No games scored for Week ${wk} yet`, seasonHint) + demoBtn);
    return;
  }
  S.currentNl = nl;
  // Commissioner's uploaded rankings override the auto ones for this week.
  if (!nl.autoPower) nl.autoPower = nl.powerRankings;
  const upow = S.power && S.power[wk];
  if (upow && upow.length) { nl.powerRankings = upow; nl.powerSource = 'commish'; }
  else { nl.powerRankings = nl.autoPower; nl.powerSource = null; }
  const deskArts = (S.desk || []).filter(a => a.week === wk);
  setContent(coverHtml(nl) + seasonBar() + weekStepper() + composeBar(wk, deskArts) + issueBodyHtml(nl, deskArts, false));
}

function issueBodyHtml(nl, deskArts, frozen) {
  const wk = nl.week;
  S.viewDesk = deskArts || [];   // what the share buttons read for Water Cooler pieces
  const lead = `<div class="lead"><h1>${esc(nl.lead.headline)}</h1>
    <div class="standfirst">${esc(nl.lead.standfirst)}</div>
    ${nl.lead.paragraphs.map(p=>`<p class="body">${esc(p)}</p>`).join('')}</div>`;
  const feature = nl.feature ? articleHtml(nl.feature, true) : '';
  const desk = (deskArts && deskArts.length)
    ? deskArts.map(a => articleHtml(a, false, (frozen || S.guest) ? null : a.id) + shareRow('desk:' + a.id)).join('')
    : ((frozen || S.guest) ? `<div class="card" style="text-align:center"><div class="dt">No group-chat column in this issue.</div></div>`
      : `<div class="card" style="text-align:center"><div class="dt" style="margin-bottom:10px">No dispatches yet. Paste your league group chat and the desk will write one up.</div><button class="btn" data-act="desk">✍️ Write from the group chat</button></div>`);
  const awards = nl.awards.length ? `<div class="card awards" style="border-color:var(--accent-d)">
    <div class="at">Week ${wk} Superlatives</div>
    ${nl.awards.map(a=>`<div class="award"><span class="em">${a.emoji}</span><div style="flex:1">
      <div class="lab">${esc(a.title)}</div><div class="nm">${esc(a.name)}</div><div class="dt">${esc(a.detail)}</div>
    </div></div>`).join('')}</div>` : '';
  const prRows = nl.powerRankings || [];
  const usePts = prRows.some(p => p.week);
  const maxW = Math.max(...prRows.map(p => p.week || 0), 1);
  const nrows = prRows.length || 1;
  const power = prRows.length ? `<div class="card">
    <div class="at">Power Rankings${nl.powerSource === 'commish' ? ' <span class="faint" style="font-size:11px;font-weight:700;letter-spacing:0">· from the league office</span>' : ''}</div>
    ${prRows.map(p => { const pct = usePts ? Math.round((p.week / maxW) * 100) : Math.round(((nrows - p.rank + 1) / nrows) * 100);
      return `<div class="pr">
      <span class="ovr" style="width:24px">${p.rank}</span>
      <div style="flex:1">
        <div class="nm">${esc(p.manager)}${p.tag ? ` <span class="faint" style="font-weight:600;font-size:12px">${esc(p.tag)}</span>` : ''}</div>
        <div class="prbar"><div class="prfill" style="width:${pct}%"></div></div>
        ${p.note ? `<div class="dt">${esc(p.note)}</div>` : ''}
      </div></div>`; }).join('')}</div>` : '';
  const coverStory = nl.stories[0] ? storyHtml(nl.stories[0], true) + shareRow('story:0') : '';
  const otherStories = nl.stories.slice(1).map((s, i) => storyHtml(s, false) + shareRow('story:' + (i + 1))).join('');
  const trades = nl.trades && nl.trades.length
    ? nl.trades.map((t, i) => tradeCardHtml(t) + shareRow('trade:' + i)).join('')
    : `<div class="card" style="text-align:center"><div class="dt">${seededPick(['Not a single trade this week. A league full of cowards.', 'The trade market was dead. Everybody clutching their roster like it’s worth a damn.', 'No deals went down. Gutless week on the wire.'], (wk || 1) * 5)}</div></div>`;
  const colophon = `<div class="colophon">Auto-written from real Sleeper box scores — every stat line and margin is genuine. The voice, jokes, and profanity are on the house.</div>`;
  const numbers = numbersHtml(nl.numbers);
  return sec('Cover Story') + coverStory
    + sec('The Column') + lead + shareRow('lead')
    + (feature ? sec('League Feature') + feature + shareRow('feature') : '')
    + (numbers ? sec('By the Numbers') + numbers + shareRow('numbers') : '')
    + (power ? power + shareRow('power') : '')
    + studsDudsHtml(nl.studs, nl.duds) + ((nl.studs && nl.studs.length) || (nl.duds && nl.duds.length) ? shareRow('studsduds') : '')
    + shameHtml(nl.shame) + ((nl.shame && nl.shame.length) ? shareRow('shame') : '')

async function ensureValues() {
  if (S.values) return;
  const raw = await getSeasonProjections(S.season);
  S.values = computeValues(raw, S.bundle.league.scoring_settings, S.bundle.players);
}
async function renderTrade() {
  setContent(spinner('Loading player values…'));
  await ensureValues();
  if (S.tab !== 'trade') return;
  drawTrade();
}
function drawTrade() {
  const b = S.bundle, V = S.values;
  const partners = b.rosters.filter(r => r.roster_id !== (b.myRoster && b.myRoster.roster_id));
  const partner = partners.find(r => r.roster_id === S.trade.partnerId) || null;
  const giveVal = sum([...S.trade.give].map(V.value));
  const getVal  = sum([...S.trade.get].map(V.value));
  const net = round1(getVal - giveVal);
  const vd = judgeTrade(net, giveVal);
  const sortByVal = ids => [...(ids||[])].sort((a,b)=>V.value(b)-V.value(a));

  const selRow = (id, side, tint) => {
    const p = b.players[id], on = S.trade[side].has(id);
    return `<button class="selrow ${on?'on':''}" data-act="trade-toggle" data-side="${side}" data-id="${esc(id)}">
      <span class="check" style="${on?`background:${tint};border-color:${tint}`:''}">${on?'✓':''}</span>
      ${posBadge(posOfPlayer(p))}
      <span style="flex:1"><span class="nm" style="display:block">${esc(playerName(p,id))}</span>
        <span class="tm">${esc(p?.team||'FA')}</span></span>
      <span class="val">${Math.round(V.value(id))}</span></button>`;
  };

  let html = '';
  if (!V.projectionBased) html += `<div class="center faint" style="font-size:11px;margin-bottom:8px">Season projections unavailable — values are an ADP-based estimate.</div>`;
  html += `<div class="card verdict" style="border-color:${vd.color}">
    <div class="vt" style="color:${vd.color}">${esc(vd.label)}</div>
    <div class="vs">${esc(vd.detail)}</div>
    <div class="tally">
      <div class="t"><div class="tv">${round1(giveVal)}</div><div class="tl">You give</div></div>
      <span class="arw">⇄</span>
      <div class="t"><div class="tv" style="color:var(--accent)">${round1(getVal)}</div><div class="tl">You get</div></div>
    </div>
    <div class="netbar">
      <div style="flex:${Math.max(giveVal,0.01)};background:var(--red)"></div>
      <div style="flex:${Math.max(getVal,0.01)};background:var(--accent)"></div>
    </div>
    <div class="muted" style="font-weight:700;font-size:13px">Net for you: ${net>0?'+':''}${net} value pts</div>
  </div>`;

  html += `<div class="seclabel">Trade with</div><div class="partners">`;
  html += partners.map(r => `<button class="pchip ${r.roster_id===S.trade.partnerId?'on':''}" data-act="trade-partner" data-id="${r.roster_id}">
      ${avatarHtml(avatarUrl(b.usersById[r.owner_id]?.avatar),30,managerName(r.owner_id))}
      <div class="pn">${esc(managerName(r.owner_id))}</div></button>`).join('');
  html += `</div>`;

  html += `<div class="seclabel">You give — tap to offer</div><div class="card" style="padding:6px 12px">
    ${sortByVal(b.myRoster && b.myRoster.players).map(id=>selRow(id,'give','var(--red)')).join('')}</div>`;

  if (partner) {
    html += `<div class="seclabel">${esc(managerName(partner.owner_id))} gives — tap to request</div>
      <div class="card" style="padding:6px 12px">${sortByVal(partner.players).map(id=>selRow(id,'get','var(--accent)')).join('')}</div>`;
  } else {
    html += empty('Pick a trade partner above', 'Then tap players from each side to build the deal.');
  }
  html += `<div class="colophon">Values are projected full-season fantasy points under your league's scoring. A guide, not gospel — needs, byes and upside are yours to weigh.</div>`;
  setContent(html);
}
function judgeTrade(net, giveVal) {
  const base = Math.max(giveVal, 20), pct = net / base;
  if (giveVal === 0) return { label:'Build your offer', detail:'Tap players on each side to see the verdict.', color:'var(--faint)' };
  if (pct > 0.15)  return { label:'You win this trade', detail:"You're getting meaningfully more value than you send.", color:'var(--accent)' };
  if (pct < -0.15) return { label:"You're overpaying", detail:'You send more value than you get back — ask for a sweetener.', color:'var(--red)' };
  return { label:'Fair deal', detail:'Value is close to even. It comes down to fit and need.', color:'var(--blue)' };
}

function ordinal(n) { const s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
async function buildTradeReview(wk) {
  try { await ensureValues(); } catch {}
  const V = S.values || { value: () => 0, projectionBased: false };
  if (S.demo) return fabricateTrades(wk, V);
  let txns = [];
  try { txns = await getTransactions(S.leagueId, wk); } catch { return []; }
  const trades = (txns || []).filter(t => t && t.type === 'trade' && t.status === 'complete');
  return trades.map(t => reviewTrade(t, V)).filter(Boolean).slice(0, 5);
}
function reviewTrade(t, V) {
  const b = S.bundle;
  const ridMgr = (rid) => { const r = b.rosters.find(x => x.roster_id === rid); return r ? managerName(r.owner_id) : ('Team ' + rid); };
  const pinfo = (id) => { const p = b.players[id]; return { id, name: playerName(p, id), pos: posOfPlayer(p) || '', val: Math.round(V.value(id)) }; };
  const parts = (t.roster_ids || []).slice();
  if (parts.length < 2) return null;
  const adds = t.adds || {}, budgets = t.waiver_budget || [], picks = t.draft_picks || [];
  const sides = parts.map(rid => {
    const received = Object.keys(adds).filter(pid => adds[pid] === rid).map(pinfo).sort((a, b) => b.val - a.val);
    const faabIn = budgets.filter(w => w.receiver === rid).reduce((s, w) => s + (w.amount || 0), 0);
    const picksIn = picks.filter(dp => dp.owner_id === rid && dp.previous_owner_id !== rid)
      .map(dp => `${dp.season} ${ordinal(dp.round)} pick`);
    const recvVal = sum(received.map(p => p.val)) + faabIn * 0.25;
    return { rid, manager: ridMgr(rid), received, faabIn, picksIn, recvVal };
  });
  const nameList = (arr) => arr.length ? joinList(arr.map(p => p.name)) : '';
  const extras = (s) => { const e = []; if (s.faabIn) e.push(`$${s.faabIn} FAAB`); s.picksIn.forEach(p => e.push(p)); return e; };
  const seed = Math.round((t.created || 0) / 1e6) + parts.reduce((a, r) => a + r, 0) + Math.round(sum(sides[0].received.map(p => p.val)));
  const pick = (arr, o) => seededPick(arr, seed + o);

  // Two-team deal — the common case, and the one worth real commentary.
  if (sides.length === 2) {
    const A = sides[0], B = sides[1];
    const aGot = [...A.received, ...extras(A).map(x => ({ name: x, val: 0 }))];
    const bGot = [...B.received, ...extras(B).map(x => ({ name: x, val: 0 }))];
    const aHead = A.received[0], bHead = B.received[0];
    const diff = Math.round(A.recvVal - B.recvVal);
    const winner = diff >= 0 ? A : B, loser = diff >= 0 ? B : A;
    const margin = Math.abs(diff);
    const scale = Math.max(A.recvVal, B.recvVal, 20);
    const lopsided = margin >= scale * 0.28 && margin >= 18;
    const tilted = !lopsided && margin >= scale * 0.12 && margin >= 8;
    const U = s => String(s || '').toUpperCase();

    let headline;
    if (lopsided) headline = pick([`${winner.manager} Fleeces ${loser.manager}`, `${loser.manager} Got Robbed in Broad Daylight`, `${winner.manager} Wins the Trade Before the Ink Dries`], 1);
    else if (tilted) headline = pick([`${winner.manager} Gets the Better of ${loser.manager}`, `Edge to ${winner.manager} in Swap with ${loser.manager}`], 1);
    else headline = pick([`${A.manager} and ${B.manager} Make an Honest Deal`, `${A.manager}, ${B.manager} Trade Even-Up`], 1);

    const P = [];
    // The deal itself.
    const aSent = nameList(B.received) || (extras(A).length ? '' : 'a bag of magic beans');
    const aExtra = extras(A).length ? ` (plus ${joinList(extras(A))} headed their way)` : '';
    const bExtra = extras(B).length ? ` (plus ${joinList(extras(B))})` : '';
    P.push(`${A.manager} shipped ${nameList(B.received) || 'nothing but paperwork'}${bExtra} to ${B.manager} in exchange for ${nameList(A.received) || 'a warm handshake'}${aExtra}.`);
    // The verdict.
    if (lopsided && (aHead || bHead)) {
      P.push(pick([
        `Let's not dress it up: by our board this is highway robbery. ${winner.manager} walks away +${margin} in projected value, headlined by ${(winner.received[0]||{}).name || 'the haul'}. ${loser.manager}, buddy, call somebody before you do that again.`,
        `Our valuations have ${winner.manager} winning this by ${margin} points, and it isn't close. ${(winner.received[0]||{}).name || 'The centerpiece'} alone tilts the whole thing. Somewhere ${loser.manager} is telling themselves it was about "fit."`,
      ], 2));
    } else if (tilted) {
      P.push(pick([
        `Reasonable deal, but the needle tips toward ${winner.manager} — about +${margin} in value, with ${(winner.received[0]||{}).name || 'the return'} the piece that moves it. ${loser.manager} can live with it if the fit's right.`,
        `Close enough to be defensible, but ${winner.manager} got the slightly fatter end (+${margin}). Both of these clowns will claim they won, as they always do.`,
      ], 2));
    } else {
      P.push(pick([
        `This one's a genuine coin-flip — value's within ${margin <= 2 ? 'a point or two' : margin + ' points'} either way. Both sides addressed a need, nobody got hosed, and that's honestly the rarest result in this league.`,
        `Dead even by the numbers. ${A.manager} and ${B.manager} each got a guy they wanted, and for once the group chat has nothing to scream about. Boring. We approve.`,
      ], 2));
    }
    return { id: 'trade_' + (t.transaction_id || seed), kind: 'trade', headline,
      dek: lopsided ? `A lopsided one — and everybody knows it.` : tilted ? `A slight edge, dissected.` : `A fair swap, for once.`,
      byline: 'The Trade Desk', paragraphs: P, sides };
  }

  // Multi-team blockbuster — summarize each haul, crown the biggest winner.
  const ranked = [...sides].sort((a, b) => b.recvVal - a.recvVal);
  const P = [`A ${sides.length}-team blockbuster went through. ` +
    sides.map(s => `${s.manager} lands ${nameList(s.received) || joinList(extras(s)) || 'future considerations'}`).join('; ') + '.'];
  P.push(`By our board, ${ranked[0].manager} made out best on paper — the rest can argue about it in the chat, which they will.`);
  return { id: 'trade_' + (t.transaction_id || seed), kind: 'trade',
    headline: `${sides.length}-Team Blockbuster Shakes Up the League`, dek: `Everybody got something. Somebody got fleeced.`,
    byline: 'The Trade Desk', paragraphs: P, sides };
}
// Sample/demo mode: fabricate a believable trade or two from the roster pool.
function fabricateTrades(wk, V) {
  const b = S.bundle, rosters = b.rosters || [];
  if (rosters.length < 2) return [];
  const out = [];
  const mk = (iA, iB, seedbump) => {
    const A = rosters[iA % rosters.length], B = rosters[iB % rosters.length];
    if (!A || !B || A.roster_id === B.roster_id) return;
    const aStart = A.starters || [], bStart = B.starters || [];
    // First deal: a lopsided 2-for-1. Second: a fair 1-for-1, for variety.
    const aSend = (seedbump === 0 ? [aStart[1], A.players[A.starters.length]] : [aStart[3]]).filter(id => id && b.players[id]);
    const bSend = (seedbump === 0 ? [bStart[3]] : [bStart[4]]).filter(id => id && b.players[id]);
    if (!aSend.length || !bSend.length) return;
    const adds = {}; aSend.forEach(id => adds[id] = B.roster_id); bSend.forEach(id => adds[id] = A.roster_id);
    const t = { transaction_id: `demo_${wk}_${seedbump}`, type: 'trade', status: 'complete',
      roster_ids: [A.roster_id, B.roster_id], adds, drops: {}, waiver_budget: seedbump ? [] : [{ sender: B.roster_id, receiver: A.roster_id, amount: 12 }],
      draft_picks: [], created: (wk * 864e5) + seedbump * 3600 };
    const r = reviewTrade(t, V); if (r) out.push(r);
  };
  mk(wk, wk * 3 + 1, 0);
  if (wk % 2 === 0) mk(wk * 5 + 2, wk * 2 + 4, 1);
  return out.slice(0, 3);
}
function tradeCardHtml(tr) {

}

async function renderDraft() {
  setContent(spinner('Building the draft board…'));
  await ensureValues();
  if (!S.draft.loaded) {
    try {
      const drafts = await getLeagueDrafts(S.leagueId);
      const live = (drafts||[]).find(d=>d.status==='drafting');
      const latest = live || [...(drafts||[])].sort((a,b)=>Number(b.season)-Number(a.season))[0] || null;
      S.draft.draft = latest;
      if (latest) S.draft.picks = await getDraftPicks(latest.draft_id);
    } catch {}
    S.draft.loaded = true;
  }
  if (S.tab !== 'draft') return;
  drawDraft();
}
function drawDraft() {
  const b = S.bundle, V = S.values, d = S.draft;
  const draftedIds = new Set(d.picks.map(p=>p.player_id));
  const myPicks = S.user ? d.picks.filter(p=>p.picked_by===S.user.user_id) : [];

  // roster needs
  const req = startingNeeds(b.league.roster_positions);
  const have = {}; myPicks.forEach(p => { const pos=b.players[p.player_id]?.position; if(pos) have[pos]=(have[pos]||0)+1; });
  const needs = [];
  for (const pos of ['QB','RB','WR','TE','K','DEF']) {
    const flexNeed = (pos==='RB'||pos==='WR'||pos==='TE') ? (req.FLEX||0) : 0;
    const target = (req[pos]||0) + (flexNeed?1:0);
    const deficit = target - (have[pos]||0);
    if (deficit > 0) needs.push({ pos, deficit });
  }
  needs.sort((a,b)=>b.deficit-a.deficit);

  // best available with tiers
  const avail = V.ranked.filter(id => {
    if (draftedIds.has(id)) return false;
    if (d.posFilter === 'ALL') return true;
    return posOfPlayer(b.players[id]) === d.posFilter;
  }).slice(0, 60);
  const topVal = avail.length ? V.value(avail[0]) : 0;
  const gap = Math.max(6, topVal * 0.045);
  const board = []; let tier = 1;
  avail.forEach((id, i) => { if (i>0 && V.value(avail[i-1]) - V.value(id) > gap) tier++; board.push({ id, tier }); });

  const status = d.draft && d.draft.status;
  const st = status==='drafting' ? {t:'DRAFT LIVE',c:'var(--accent)'}
    : status==='complete' ? {t:'DRAFT COMPLETE',c:'var(--faint)'}
    : status==='pre_draft' ? {t:'PRE-DRAFT',c:'var(--blue)'} : {t:'CHEAT SHEET',c:'var(--blue)'};

  let html = `<div class="card">
    <div class="row"><span class="pill" style="color:${st.c};border-color:${st.c}">${st.t}</span>
      <span class="muted" style="font-size:13px">${d.picks.length?`${d.picks.length} picks made`:'No picks yet'}${d.draft?` · ${esc(d.draft.type)} draft`:''}</span></div>
    <div class="seclabel" style="margin:12px 0 6px">Your roster needs</div>
    ${needs.length ? `<div class="needs">${needs.map(x=>`<span class="need">${posBadge(x.pos)}<b>×${x.deficit}</b></span>`).join('')}</div>`
      : `<div style="color:var(--accent);font-size:13px">Starting slots filled — draft best available or for depth.</div>`}
    ${!V.projectionBased?`<div class="faint" style="font-size:11px;margin-top:8px">Season projections unavailable — ranks use an ADP-based estimate.</div>`:''}
  </div>`;

  html += `<h2 style="font-family:var(--serif);font-size:22px;margin:6px 0">Best Available</h2>`;
  html += `<div class="filters">${['ALL','QB','RB','WR','TE','K','DEF'].map(p=>
    `<button class="fchip ${d.posFilter===p?'on':''}" data-act="draft-filter" data-pos="${p}">${p}</button>`).join('')}</div>`;

  html += `<div class="card" style="padding:6px 12px">`;
  if (!board.length) html += empty('No players available', 'Try a different position filter.');
  board.forEach((row, i) => {
    const p = b.players[row.id];
    const newTier = i===0 || board[i-1].tier !== row.tier;
    if (newTier) html += `<div class="tier"><span class="tx">TIER ${row.tier}</span><span class="tl"></span></div>`;
    html += `<div class="prow"><span class="ovr">${i+1}</span>${posBadge(posOfPlayer(p))}
      <span style="flex:1"><span class="nm" style="display:block">${esc(playerName(p,row.id))}</span>
        <span class="tm">${esc(p?.team||'FA')}${p?.years_exp===0?' · Rookie':''}</span></span>
      <span class="val">${Math.round(V.value(row.id))}</span></div>`;
  });
  html += `</div><div class="colophon">Value = projected full-season fantasy points under your league's scoring. Live drafts update as picks come in — reopen the tab to refresh.</div>`;
  setContent(html);
}

          ? '✨ <b>Claude</b> is writing this one — a real narrative column from your chat. (Add/remove your key in Settings.)'
          : 'Using the built-in template writer. Add your Anthropic API key in <b>Settings</b> to have Claude write a real narrative column instead.'}
      </div>
      <div id="deskErr" class="err"></div>
    </div>
    ${mine.length ? `<div class="seclabel">This week's dispatches</div>${mine.map(a=>`
      <div class="card"><div class="row" style="justify-content:space-between">
        <div style="font-weight:800">${esc(a.headline)}</div>
        <button class="linkbtn" data-act="desk-delete" data-id="${esc(a.id)}">delete</button></div>
        <div class="dt" style="margin-top:4px">${esc(a.paragraphs[0]||'')}</div></div>`).join('')}` : ''}

    <div class="seclabel">📊 Power Rankings (from Excel)</div>
    <p class="faint" style="font-size:12px;margin:-2px 4px 8px;line-height:1.5">Your commissioner does the rankings? Have him send the spreadsheet and drop it here — it replaces the auto rankings in this week's issue. Best columns: <b>Rank</b>, <b>Team</b>, <b>Record</b>, <b>Comment</b> (a header row helps; extra columns are fine).</p>
    <div class="card">
      <input id="powerFile" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" data-act="power-file" class="fileinput" />
      <div id="powerFileStatus" class="faint" style="font-size:12px;margin-top:8px;line-height:1.4">Pick the <b>.xlsx</b> file for Week ${S.activeWeek}.</div>
      ${powerHere.length ? `<div style="height:10px"></div>
        <div class="dt" style="font-weight:700;color:var(--accent)">✓ Loaded for Week ${S.activeWeek}: ${powerHere.length} teams ranked.</div>
        <div class="faint" style="font-size:12px;margin-top:4px">${powerHere.slice(0,3).map(p=>`${p.rank}. ${esc(p.manager)}`).join(' · ')}${powerHere.length>3?' …':''}</div>
        <div style="height:10px"></div><button class="btn ghost" data-act="power-clear">Remove uploaded rankings</button>` : ''}
    </div>
  </div>`;
}
async function deskGenerate() {
  const pasted = ($('#chatText') || {}).value || '';
  const text = (S.deskChatText && S.deskChatText.trim()) ? S.deskChatText : pasted;
  const angle = ($('#chatAngle') || {}).value || '';
  const err = $('#deskErr');
  const btn = document.querySelector('[data-act="desk-generate"]');
  if (err) err.textContent = '';
  if (text.trim().length < 8) { if (err) err.textContent = 'Import your chat file or paste a snippet first.'; return; }
  if (!parseChat(text).length) { if (err) err.textContent = "Couldn't find any 'Name: message' lines in that. Make sure it's a chat export."; return; }

  let art = null;
  const useAI = !!(S.apiKey || '').trim();
  if (btn) { btn.disabled = true; btn.textContent = useAI ? 'Claude is writing…' : 'Writing…'; }
  try {
    if (useAI) {
      try {
        art = await generateChatArticleAI(text, angle);
      } catch (e) {
        // Soft-fail to the offline template so the manager still gets an article.
        art = generateChatArticle(text, angle);
        const why = (e && /^api-401/.test(e.message)) ? 'that API key was rejected'
          : (e && /^api-/.test(e.message)) ? 'the Claude API returned an error'
          : 'the AI writer is unreachable';
        toast(`Used the offline writer — ${why}.`);
      }
    } else {
      art = generateChatArticle(text, angle);
    }
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = 'Write the article →'; }
  }
  if (!art) { if (err) err.textContent = "Couldn't turn that into an article. Make sure it's a chat export."; return; }
  art.week = S.activeWeek;
  S.desk.unshift(art); saveDesk();
  S.deskChatText = null;
  delete S.newsCache[S.activeWeek];
  S.tab = 'news'; renderShell(); renderTab();
  toast('Article added to The Water Cooler');
}

    <div id="setbody">${spinner('')}</div>`;
  let leagues = [];
  try {
    const base = (S.nflState && S.nflState.season) || S.season || String(new Date().getFullYear());
    leagues = await leaguesAcrossSeasons(S.user.user_id, base);
  } catch {}
  const u = S.user;
  $('#setbody').innerHTML = `
    <div class="card row">${avatarHtml(avatarUrl(u.avatar),48,u.display_name)}
      <div><div style="font-weight:800;font-size:17px">${esc(u.display_name)}</div><div class="muted">@${esc(u.username)}</div></div></div>
    <div class="seclabel">Magazine name</div>
    <div class="card">
      <input id="magName" class="input" value="${esc(S.magName || 'Skirt Chasers')}" placeholder="Skirt Chasers" />
      <div class="faint" style="font-size:11px;margin:6px 2px 0">Shown big on the cover, above “Dynasty League Magazine.”</div>
      <div style="height:10px"></div>
      <button class="btn" data-act="save-magname">Save magazine name</button>
    </div>
    <div class="seclabel">Water Cooler AI writer</div>
    <div class="card">
      <input id="apiKey" class="input" type="password" autocomplete="off" value="${esc(S.apiKey || '')}" placeholder="sk-ant-… (optional)" />
      <div class="faint" style="font-size:11px;margin:6px 2px 0;line-height:1.5">
        Paste your own <b>Anthropic API key</b> and the Water Cooler will use Claude to write a real narrative column from your league chat instead of the built-in template. Get one at <b>console.anthropic.com</b>. Each article costs you a few cents on your own account.<br>
        <b>Heads up:</b> this app lives on a public web address. Your key is saved <b>only in this browser</b> (local storage) — it's never committed, uploaded, or shared in magazine links — but don't paste it on a device you don't trust.
      </div>
      <div style="height:10px"></div>
      <button class="btn" data-act="save-apikey">Save API key</button>
      ${(S.apiKey||'').trim() ? `<div style="height:8px"></div><button class="btn ghost" data-act="clear-apikey">Remove key</button>` : ''}
    </div>
    <div class="seclabel">Preview</div>
    <div class="card">
      <div class="faint" style="font-size:12px;margin-bottom:10px;line-height:1.5">See a full issue built from this league — your real teams and managers, with made-up scores and outcomes. Great before the season starts.</div>
      <button class="btn ghost" data-act="sample-league">Preview a sample issue from my league →</button>
    </div>
    <div class="seclabel">League history</div>
    <div class="card">
      <div class="faint" style="font-size:12px;margin-bottom:10px;line-height:1.5">Import your old ESPN seasons for a permanent Record Book — champions, all-time standings, and league records.</div>
      <button class="btn ghost" data-act="history">🏆 Open the Record Book →</button>
    </div>
    <div class="seclabel">Your leagues</div>
    ${(leagues||[]).map(lg=>`<button class="card row" style="width:100%;text-align:left;color:var(--text);${lg.league_id===S.leagueId?'border-color:var(--accent)':''}" data-act="switch-league" data-id="${esc(lg.league_id)}" data-season="${esc(lg.season)}">
      ${avatarHtml(avatarUrl(lg.avatar),40,lg.name)}
      <div style="flex:1"><div style="font-weight:700">${esc(lg.name)}</div><div class="muted" style="font-size:13px">${esc(lg.season)} · ${lg.total_rosters}-team</div></div>
      ${lg.league_id===S.leagueId?'<span style="color:var(--accent);font-size:11px;font-weight:900">ACTIVE</span>':''}</button>`).join('')}
    <div style="height:8px"></div>
    <button class="btn danger" data-act="signout">Sign out</button>

// ---------------------------------------------------------------------
//  Event handling (delegated)
// ---------------------------------------------------------------------
document.body.addEventListener('click', async (e) => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const act = t.dataset.act;
  if (act === 'lookup') return doLookup();
  if (act === 'demo') return startDemo();
  if (act === 'sample-league') return startSampleFromLeague();
  if (act === 'exit-sample') return exitSample();
  if (act === 'pick-league') return pickLeague(t.dataset.id, t.dataset.season);
  if (act === 'tab') { S.tab = t.dataset.tab; renderShell(); return renderTab(); }
  if (act === 'week') {
    const dir = Number(t.dataset.dir);
    S.activeWeek = Math.min(18, Math.max(1, S.activeWeek + dir));
    if (S.tab === 'news') return renderNews();
    return;
  }
  if (act === 'settings') return showSettings();
  if (act === 'share') return shareMagazine();
  if (act === 'pdf') { toast('Choose “Save to PDF” in the print dialog'); setTimeout(() => window.print(), 350); return; }
  if (act === 'share-item') return shareArticle(t.dataset.id);
  if (act === 'save-magname') { const v = ($('#magName')||{}).value; S.magName = (v && v.trim()) || 'Skirt Chasers';
    try { localStorage.setItem('gg.magname', S.magName); } catch {} toast('Magazine name saved'); return; }
  if (act === 'save-apikey') { const v = (($('#apiKey')||{}).value || '').trim(); S.apiKey = v;
    try { v ? localStorage.setItem('gg.apikey', v) : localStorage.removeItem('gg.apikey'); } catch {}
    toast(v ? 'API key saved — the Water Cooler will use Claude' : 'API key cleared'); return showSettings(); }
  if (act === 'clear-apikey') { S.apiKey = ''; try { localStorage.removeItem('gg.apikey'); } catch {}
    toast('API key removed'); return showSettings(); }
  if (act === 'desk') return showDesk();
  if (act === 'archive') return showArchive();
  if (act === 'history') return showHistory();
  if (act === 'copy-espn') { try { await navigator.clipboard.writeText(ESPN_SNIPPET); toast('Snippet copied'); } catch { showCopyModal(ESPN_SNIPPET); } return; }
  if (act === 'history-clear') { S.espnHist = null; saveEspnHist(); refreshHistIndex(); S.newsCache = {}; toast('History removed'); return showHistory(); }
  if (act === 'alias-clear') { S.histAliases = {}; saveHistAliases(); refreshHistIndex(); S.newsCache = {}; toast('Name merges reset'); return showHistory(); }
  if (act === 'save-issue') return saveCurrentIssue();
  if (act === 'open-issue') return openSavedIssue(t.dataset.id);
  if (act === 'delete-issue') { e.stopPropagation(); return deleteSavedIssue(t.dataset.id); }
  if (act === 'back-archive') { S.reading = false; return showArchive(); }
  if (act === 'desk-generate') return deskGenerate();
  if (act === 'power-clear') { if (S.power) delete S.power[S.activeWeek]; savePower(); delete S.newsCache[S.activeWeek]; return showDesk(); }
  if (act === 'desk-delete') { S.desk = S.desk.filter(a => a.id !== t.dataset.id); saveDesk(); delete S.newsCache[S.activeWeek];
    if ($('#setbody') || document.querySelector('.setup-logo')) return showDesk(); renderShell(); return renderTab(); }
  if (act === 'back' || act === 'back-news') { S.reading = false; renderShell(); return renderTab(); }
  if (act === 'signout') { localStorage.removeItem(SKEY); S.user=S.leagueId=S.season=S.bundle=S.history=null; return renderSetup(); }
  if (act === 'switch-league') { S.leagueId=t.dataset.id; S.season=t.dataset.season; saveSession(); return enterApp(); }
  if (act === 'trade-partner') { S.trade.partnerId = Number(t.dataset.id); S.trade.get = new Set(); return drawTrade(); }
  if (act === 'trade-toggle') { const set=S.trade[t.dataset.side], id=t.dataset.id; set.has(id)?set.delete(id):set.add(id); return drawTrade(); }
  if (act === 'draft-filter') { S.draft.posFilter = t.dataset.pos; return drawDraft(); }
});

// Change events: season switcher (<select>) and chat-file import (<input file>).
document.body.addEventListener('change', async (e) => {
  const sel = e.target.closest('[data-act="season-select"]');
  if (sel) {
    const opt = sel.options[sel.selectedIndex];
    S.leagueId = sel.value; S.season = opt.dataset.season; saveSession();
    return enterApp();
  }
  const alias = e.target.closest('[data-act="alias-set"]');
  if (alias) {
    const name = alias.dataset.name, target = alias.value;
    S.histAliases = S.histAliases || {};
    if (target && normName(target) !== normName(name)) S.histAliases[normName(name)] = target;
    else delete S.histAliases[normName(name)];
    saveHistAliases(); refreshHistIndex(); S.newsCache = {};
    return showHistory();
  }
  const file = e.target.closest('[data-act="desk-file"]');
  if (file && file.files && file.files[0]) {
    const f = file.files[0];
    const st = $('#chatFileStatus');
    try {
      const buf = await f.arrayBuffer();
      const isZip = u8sig(buf) || /\.zip$/i.test(f.name);
      if (isZip && st) st.textContent = 'Unzipping…';
      const text = isZip ? await extractChatFromZip(buf) : new TextDecoder('utf-8').decode(buf);
      const n = parseChat(text).length;
      if (!n) { if (st) st.innerHTML = `Read <b>${esc(f.name)}</b>, but found no chat messages inside. Is it the exported chat?`; S.deskChatText = null; return; }
      S.deskChatText = text;
      if (st) st.innerHTML = `✓ Loaded <b>${esc(f.name)}</b> — <b>${n}</b> messages parsed. The desk will write about the most recent chatter. Hit “Write the article” below.`;
    } catch (err) {
      if (st) st.innerHTML = `Couldn't read that file — ${esc((err && err.message) || 'unknown error')}. You can also paste a snippet below.`;
      S.deskChatText = null;
    }
  }
  const hfile = e.target.closest('[data-act="history-file"]');
  if (hfile && hfile.files && hfile.files[0]) {
    const f = hfile.files[0]; const st = $('#histFileStatus');
    if (st) st.textContent = 'Reading your history…';
    try {
      const obj = JSON.parse(await f.text());
      const norm = normalizeHistory(obj);
      if (!norm || !norm.seasons.length) { if (st) st.innerHTML = 'Couldn’t find any seasons in that file. Make sure it’s the <b>espn-history.json</b> the snippet created.'; return; }
      S.espnHist = norm; saveEspnHist(); refreshHistIndex(); S.newsCache = {};
      if (st) st.innerHTML = `✓ Imported <b>${norm.seasons.length}</b> seasons.`;
      showHistory();
    } catch (err) { if (st) st.innerHTML = `Couldn’t read that file — ${esc((err && err.message) || 'invalid JSON')}.`; }
    return;
  }
  const pfile = e.target.closest('[data-act="power-file"]');
  if (pfile && pfile.files && pfile.files[0]) {
    const f = pfile.files[0];
    const st = $('#powerFileStatus');
    if (st) st.textContent = 'Reading the spreadsheet…';
    try {
      const buf = await f.arrayBuffer();
      if (!u8sig(buf)) throw new Error('that isn’t an .xlsx — export/Save As Excel Workbook (.xlsx)');
      const rows = await extractRowsFromXlsx(buf);
      const ranked = parsePowerRows(rows);
      if (!ranked || !ranked.length) { if (st) st.innerHTML = `Read <b>${esc(f.name)}</b>, but couldn't find a team column. Give it headers like <b>Rank · Team · Record · Comment</b>.`; return; }
      S.power = S.power || {}; S.power[S.activeWeek] = ranked; savePower();
      delete S.newsCache[S.activeWeek];
      if (st) st.innerHTML = `✓ Loaded <b>${esc(f.name)}</b> — <b>${ranked.length}</b> teams ranked for Week ${S.activeWeek}. It's in this week's issue now.`;
      showDesk();
    } catch (err) {
      if (st) st.innerHTML = `Couldn't read that file — ${esc((err && err.message) || 'unknown error')}.`;
    }
  }
});

init();
</script>
