<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>John &amp; Emma's Wedding</title>
<meta name="description" content="John &amp; Emma's private wedding-planning app.">
<meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B18" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="J &amp; E">
</head>
<body>
<style>
  :root{
    --paper:#FBF7F0; --panel:#FFFFFF; --ink:#2C2824; --muted:#7B7164;
    --gold:#AE8A54; --gold-deep:#8F6E3D; --gold-soft:#EFE3CC; --sage:#4C5F51;
    --blush:#D9B2A4; --line:#E6DCCB; --line-soft:#EFE8DA;
    --ok:#4C6B52; --warn:#A5762E; --crit:#9C4A3C;
    --shadow:0 10px 30px rgba(96,78,50,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#171B18; --panel:#1F251F; --ink:#EDE6D6; --muted:#9C927E;
      --gold:#C9A96E; --gold-deep:#DBBE85; --gold-soft:#3A3324; --sage:#93AC97;
      --blush:#C08D7C; --line:#39413A; --line-soft:#2A302A;
      --ok:#8FB896; --warn:#D8AE64; --crit:#D9897A;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#171B18; --panel:#1F251F; --ink:#EDE6D6; --muted:#9C927E;
    --gold:#C9A96E; --gold-deep:#DBBE85; --gold-soft:#3A3324; --sage:#93AC97;
    --blush:#C08D7C; --line:#39413A; --line-soft:#2A302A;
    --ok:#8FB896; --warn:#D8AE64; --crit:#D9897A;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --paper:#FBF7F0; --panel:#FFFFFF; --ink:#2C2824; --muted:#7B7164;
    --gold:#AE8A54; --gold-deep:#8F6E3D; --gold-soft:#EFE3CC; --sage:#4C5F51;
    --blush:#D9B2A4; --line:#E6DCCB; --line-soft:#EFE8DA;
    --ok:#4C6B52; --warn:#A5762E; --crit:#9C4A3C;
    --shadow:0 10px 30px rgba(96,78,50,.10);
  }

  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Optima","Candara","Gill Sans","Gill Sans MT","Segoe UI",system-ui,sans-serif;
    font-size:16.5px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  button,.chip,.tab{-webkit-user-select:none; user-select:none; touch-action:manipulation}
  .serif{font-family:"Didot","Bodoni MT","Bodoni 72","Playfair Display",Georgia,serif}
  .script{font-family:"Snell Roundhand","Savoye LET","Segoe Script","Brush Script MT",cursive}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- Intro ---------- */
  #intro{position:fixed; inset:0; z-index:100; background:var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer}
  #intro.done{display:none}
  #intro.leaving{animation:introOut 1.1s ease forwards}
  @keyframes introOut{to{opacity:0; visibility:hidden}}
  .intro-frame{position:absolute;
    top:calc(18px + env(safe-area-inset-top)); right:calc(18px + env(safe-area-inset-right));
    bottom:calc(18px + env(safe-area-inset-bottom)); left:calc(18px + env(safe-area-inset-left));
    border:1px solid var(--gold); opacity:0; animation:fadeIn 1.2s ease .1s forwards; pointer-events:none}
  .intro-frame::after{content:""; position:absolute; inset:6px; border:1px solid var(--line)}
  .intro-inner{text-align:center; padding:0 24px; max-width:900px}
  .intro-eyebrow{font-size:12px; letter-spacing:.42em; text-transform:uppercase; color:var(--gold-deep);
    opacity:0; animation:fadeIn 1s ease .5s forwards}
  .intro-names{display:flex; align-items:baseline; justify-content:center; gap:.18em;
    margin:18px 0 6px; font-size:clamp(44px,9vw,96px); line-height:1.05; letter-spacing:.02em}
  .intro-names .n{opacity:0}
  .intro-names .john{animation:fromLeft 1.5s cubic-bezier(.2,.7,.2,1) .7s forwards}
  .intro-names .emma{animation:fromRight 1.5s cubic-bezier(.2,.7,.2,1) .7s forwards}
  .intro-names .amp{font-size:.72em; color:var(--gold); opacity:0; padding:0 .12em;
    animation:ampIn 1s ease 1.9s forwards}
  @keyframes fromLeft{from{opacity:0; transform:translateX(-46vw)} 60%{opacity:1} to{opacity:1; transform:none}}
  @keyframes fromRight{from{opacity:0; transform:translateX(46vw)} 60%{opacity:1} to{opacity:1; transform:none}}
  @keyframes ampIn{from{opacity:0; transform:scale(.6)} to{opacity:1; transform:scale(1)}}
  @keyframes fadeIn{to{opacity:1}}
  .intro-figures{height:150px; margin:10px auto 4px; position:relative; width:260px}
  .intro-figures svg{position:absolute; bottom:0; opacity:0}
  .fig-john{left:34px; animation:figLeft 1.9s cubic-bezier(.25,.7,.25,1) 1s forwards}
  .fig-emma{right:34px; animation:figRight 1.9s cubic-bezier(.25,.7,.25,1) 1s forwards}
  @keyframes figLeft{from{opacity:0; transform:translateX(-44vw)} 40%{opacity:1} to{opacity:1; transform:none}}
  @keyframes figRight{from{opacity:0; transform:translateX(44vw)} 40%{opacity:1} to{opacity:1; transform:none}}
  .intro-heart{position:absolute; left:50%; top:8px; transform:translateX(-50%) scale(.5);
    color:var(--blush); font-size:22px; opacity:0; animation:ampIn .8s ease 2.7s forwards}
  .intro-tag{font-size:15px; color:var(--muted); letter-spacing:.16em; text-transform:uppercase;
    opacity:0; animation:fadeIn 1.2s ease 2.9s forwards}
  .intro-skip{position:absolute; bottom:34px; left:0; right:0; text-align:center;
    font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted);
    opacity:0; animation:fadeIn 1s ease 3.4s forwards}
  @media (prefers-reduced-motion: reduce){
    #intro *, #intro{animation-duration:.01s !important; animation-delay:0s !important}
    #intro.leaving{animation:introOut .3s ease forwards}
  }

  /* ---------- Shell ---------- */
  #app{opacity:0; transition:opacity .9s ease}
  #app.visible{opacity:1}
  .shell{max-width:920px; margin:0 auto;
    padding:calc(24px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
            calc(80px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
  .masthead{text-align:center; padding:20px 0 6px; border-bottom:1px solid var(--line); position:relative}
  .masthead .eyebrow{font-size:11px; letter-spacing:.4em; text-transform:uppercase; color:var(--gold-deep)}
  .masthead h1{font-size:clamp(30px,5.5vw,46px); font-weight:500; letter-spacing:.02em; margin:8px 0 2px}
  .masthead h1 .amp{color:var(--gold); font-size:.75em}
  .masthead .sub{color:var(--muted); font-size:12.5px; letter-spacing:.2em; text-transform:uppercase; margin-bottom:14px}
  .theme-btn{position:absolute; right:0; top:4px; background:none; border:1px solid var(--line);
    border-radius:999px; width:36px; height:36px; cursor:pointer; color:var(--muted); font-size:14px}
  .theme-btn:hover{border-color:var(--gold)}
  nav.tabs{display:flex; justify-content:center; gap:2px; flex-wrap:wrap; padding:10px 0 0}
  .tab{background:none; border:none; cursor:pointer; color:var(--muted); font:inherit;
    font-size:12px; letter-spacing:.16em; text-transform:uppercase; padding:7px 11px 9px;
    border-bottom:2px solid transparent}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink); border-bottom-color:var(--gold)}
  .tab:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px}
  main{padding-top:28px}
  footer{margin-top:60px; text-align:center; color:var(--muted); font-size:11px;
    letter-spacing:.24em; text-transform:uppercase}
  footer .amp{color:var(--gold)}

  /* ---------- Common ---------- */
  h2.sec{font-size:26px; font-weight:500; margin-bottom:6px}
  h3.sub{font-size:19px; font-weight:500; margin:26px 0 10px}
  p.lede{color:var(--muted); margin-bottom:22px; max-width:62ch}
  .eyebrow-sm{font-size:10.5px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:8px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:20px 20px; box-shadow:var(--shadow)}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px}
  .btn{display:inline-block; background:var(--sage); color:#FBF7F0; border:none; cursor:pointer;
    font:inherit; font-size:13.5px; letter-spacing:.14em; text-transform:uppercase;
    padding:12px 22px; border-radius:2px}
  .btn:hover{filter:brightness(1.08)}
  .btn.gold{background:var(--gold); color:#fff}
  :root[data-theme="dark"] .btn,:root[data-theme="dark"] .btn.gold{color:#14170f}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#14170f}}
  .btn.quiet{background:none; color:var(--ink); border:1px solid var(--line)}
  .btn.quiet:hover{border-color:var(--gold)}
  .btn.sm{font-size:12px; padding:8px 14px}
  .pill{display:inline-block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    border:1px solid var(--line); border-radius:999px; padding:4px 10px; color:var(--muted)}
  .pill.gold{border-color:var(--gold); color:var(--gold-deep); background:var(--gold-soft)}
  .pill.ok{border-color:var(--ok); color:var(--ok)}
  .pill.warn{border-color:var(--warn); color:var(--warn)}
  .pill.crit{border-color:var(--crit); color:var(--crit)}
  .note{border-left:2px solid var(--gold-soft); padding-left:12px; color:var(--muted); font-size:14px}
  .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
  table{border-collapse:collapse; width:100%; min-width:460px; font-size:14.5px}
  th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line-soft)}
  th{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:600}
  td.r,th.r{text-align:right}
  tr.total td{border-top:1px solid var(--gold); border-bottom:none; font-weight:600; padding-top:14px}
  input[type=text],input[type=email],input[type=number],select,textarea{
    background:var(--paper); border:1px solid var(--line); border-radius:3px;
    padding:9px 10px; font:inherit; font-size:14.5px; color:var(--ink); width:100%}
  label.fld{display:block; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--muted); margin:0 0 4px}
  .row{display:grid; gap:10px}
  .row.two{grid-template-columns:1fr 1fr}
  .row.three{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-size:13.5px; padding:11px 22px;
    border-radius:999px; opacity:0; pointer-events:none; transition:opacity .3s ease; z-index:80}
  .toast.show{opacity:1}

  /* stat tiles */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px 16px;
    box-shadow:var(--shadow)}
  .stat .k{font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted)}
  .stat .v{font-size:27px; font-weight:500; margin-top:5px; line-height:1.1}
  .stat .v small{font-size:14px; color:var(--muted)}
  .stat .d{font-size:12.5px; color:var(--muted); margin-top:3px}
  .stat.hero{border-color:var(--gold)}

  /* install banner */
  .install{display:none; align-items:flex-start; gap:14px; border:1px solid var(--gold);
    border-radius:4px; background:var(--gold-soft); padding:14px 16px; margin-bottom:22px}
  .install.show{display:flex}
  .install .ic{font-size:18px; color:var(--gold-deep)}
  .install .txt{flex:1; font-size:14px}
  .install .txt b{display:block; font-size:15px; margin-bottom:2px}
  .install .dismiss{background:none; border:none; cursor:pointer; color:var(--muted); font-size:15px}
  #installNow{background:var(--gold); color:#fff; border:none; border-radius:2px; cursor:pointer;
    font:inherit; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    padding:8px 14px; margin-top:9px; display:none}
  #installNow.show{display:inline-block}

  /* controls */
  .controls{background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:18px; box-shadow:var(--shadow); margin-bottom:22px}
  .ctl{margin-bottom:16px}
  .ctl:last-child{margin-bottom:0}
  .ctl .lab{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px}
  .ctl .lab span:first-child{font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted)}
  .ctl .lab span:last-child{font-size:15px; font-weight:600}
  input[type=range]{width:100%; accent-color:var(--gold)}
  .segs{display:flex; flex-wrap:wrap; gap:7px}
  .seg{background:none; border:1px solid var(--line); border-radius:999px; cursor:pointer;
    font:inherit; font-size:13.5px; color:var(--ink); padding:8px 14px}
  .seg:hover{border-color:var(--gold)}
  .seg.on{background:var(--gold-soft); border-color:var(--gold)}

  /* levers */
  .lever{display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-bottom:1px solid var(--line-soft); padding:12px 2px}
  .lever .lt{font-size:14.5px}
  .lever .lt small{display:block; color:var(--muted); font-size:12.5px}
  .lever .save{font-size:15px; font-weight:600; color:var(--ok); white-space:nowrap}

  /* venue cards */
  .venue{background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:18px; box-shadow:var(--shadow); margin-bottom:14px}
  .venue.pick{border-color:var(--gold)}
  .venue h4{font-size:19px; font-weight:500; margin-bottom:2px}
  .venue .where{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:9px}
  .venue .facts{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0}
  .venue .why{font-size:14px; color:var(--muted)}
  .venue .est{font-size:15px; margin-top:9px}
  .venue .est b{font-weight:600}

  /* checklist */
  .phase{margin-bottom:26px}
  .phase .ph{display:flex; align-items:baseline; gap:10px; border-bottom:1px solid var(--gold-soft);
    padding-bottom:7px; margin-bottom:4px}
  .phase .ph b{font-size:17px; font-weight:500}
  .phase .ph span{font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
  .task{display:flex; gap:11px; align-items:flex-start; padding:10px 2px; border-bottom:1px solid var(--line-soft)}
  .task input{margin-top:4px; width:17px; height:17px; accent-color:var(--sage); flex:none}
  .task .tt{flex:1; font-size:14.5px}
  .task .tt small{display:block; color:var(--muted); font-size:12.5px}
  .task.done .tt{color:var(--muted); text-decoration:line-through}
  .task .by{font-size:11.5px; color:var(--muted); white-space:nowrap; padding-top:2px}

  /* guests */
  .guestrow{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;
    padding:11px 2px; border-bottom:1px solid var(--line-soft)}
  .guestrow .gname{font-size:15px}
  .guestrow .gmeta{font-size:12.5px; color:var(--muted)}
  .rsvpsel{width:auto; min-width:112px; font-size:13px; padding:6px 8px}
  .del{background:none; border:none; cursor:pointer; color:var(--muted); font-size:15px; padding:2px 5px}
  .del:hover{color:var(--crit)}
  .addbox{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px; margin-bottom:20px}

  /* question popup */
  .qmodal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(24,20,14,.48); backdrop-filter:blur(3px); animation:modalFade .35s ease}
  .qmodal[hidden]{display:none}
  @keyframes modalFade{from{opacity:0} to{opacity:1}}
  .qpop{position:relative; width:min(640px,96vw); max-height:90vh; display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--gold); border-radius:4px;
    box-shadow:0 30px 90px rgba(20,14,6,.45); animation:popIn .5s cubic-bezier(.2,.85,.3,1)}
  @keyframes popIn{from{opacity:0; transform:scale(.9) translateY(22px)} to{opacity:1; transform:none}}
  .qpop::before{content:""; position:absolute; inset:7px; border:1px solid var(--line); pointer-events:none; z-index:1}
  .qpop .corner{position:absolute; color:var(--gold); font-size:15px; z-index:2; pointer-events:none}
  .c-tl{top:13px; left:15px} .c-tr{top:13px; right:15px; transform:scaleX(-1)}
  .c-bl{bottom:13px; left:15px; transform:scaleY(-1)} .c-br{bottom:13px; right:15px; transform:scale(-1,-1)}
  .qpop-scroll{overflow-y:auto; padding:34px 32px 26px}
  .qclose{position:absolute; top:14px; right:18px; z-index:3; background:var(--panel); border:none;
    cursor:pointer; color:var(--muted); font-size:17px; padding:4px 6px}
  .qpop .seal{width:44px; height:44px; border:1px solid var(--gold); border-radius:50%;
    display:flex; align-items:center; justify-content:center; margin:0 auto 12px;
    color:var(--gold); font-size:23px; background:var(--paper)}
  .qpop .qcount{text-align:center; font-size:11px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--gold-deep); margin-bottom:6px}
  .qpop .qcount .orn{color:var(--blush); letter-spacing:0; margin:0 9px}
  .qbar{display:flex; align-items:center; gap:12px; margin:14px 0 20px}
  .qbar .rail{flex:1; height:2px; background:var(--line); position:relative}
  .qbar .rail i{position:absolute; inset:0 auto 0 0; background:var(--gold); transition:width .4s ease}
  .qsection{font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--gold-deep);
    text-align:center; margin-bottom:11px}
  .qtitle{font-size:clamp(21px,3.3vw,27px); font-weight:500; line-height:1.3; text-align:center;
    text-wrap:balance; margin-bottom:10px}
  .qcontext{color:var(--muted); font-size:14px; margin-bottom:20px;
    border-left:2px solid var(--gold-soft); padding-left:12px}
  .grouplabel{font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:16px 0 9px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{background:none; border:1px solid var(--line); border-radius:999px; cursor:pointer;
    font:inherit; font-size:14.5px; color:var(--ink); padding:9px 15px}
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:var(--gold-soft); border-color:var(--gold)}
  .chip.on::before{content:"✓ "; color:var(--gold-deep)}
  .qnav{display:flex; justify-content:space-between; align-items:center; margin-top:24px}
  .qnav .hint{font-size:12px; color:var(--muted)}
  @media (prefers-reduced-motion: reduce){.qmodal,.qpop{animation:none !important}}

  /* review */
  .ritem{border-bottom:1px solid var(--line-soft); padding:15px 2px}
  .ritem .rq{font-size:15.5px; font-weight:600}
  .ritem .rq .n{color:var(--gold-deep); font-weight:400; margin-right:7px}
  .ritem .ra{margin-top:4px; font-size:14.5px}
  .ritem .ra .lbl{color:var(--muted); font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; margin-right:6px}
  .ritem .un{color:var(--blush); font-style:italic}
  .ritem .edit{background:none; border:none; cursor:pointer; color:var(--gold-deep); font:inherit;
    font-size:13px; text-decoration:underline; padding:0; margin-top:5px}
</style>

<div id="intro" role="button" aria-label="Skip intro" tabindex="0">
  <div class="intro-frame"></div>
  <div class="intro-inner">
    <div class="intro-eyebrow">Together with their families</div>
    <div class="intro-names serif">
      <span class="n john">John</span>
      <span class="n amp script">&amp;</span>
      <span class="n emma">Emma</span>
    </div>
    <div class="intro-figures">
      <span class="intro-heart">♥</span>
      <svg class="fig-john" width="74" height="140" viewBox="0 0 74 140" aria-hidden="true">
        <circle cx="37" cy="18" r="12" fill="currentColor"/>
        <path d="M37 33 C22 33 16 46 15 62 L20 120 L30 120 L33 78 L41 78 L44 120 L54 120 L59 62 C58 46 52 33 37 33 Z" fill="currentColor"/>
        <path d="M37 36 L42 48 L37 66 L32 48 Z" fill="var(--paper)"/>
      </svg>
      <svg class="fig-emma" width="86" height="140" viewBox="0 0 86 140" aria-hidden="true">
        <circle cx="43" cy="18" r="12" fill="currentColor"/>
        <path d="M43 32 C33 32 28 42 26 54 C20 82 12 106 8 122 L78 122 C74 106 66 82 60 54 C58 42 53 32 43 32 Z" fill="currentColor"/>
        <path d="M30 14 C30 6 37 2 43 2 C49 2 56 6 56 14 L43 20 Z" fill="currentColor" opacity=".55"/>
      </svg>
    </div>
    <div class="intro-tag">are getting married</div>

                            day:state.plan.day, weekend:state.plan.weekend});
    view.innerHTML =
      '<h2 class="sec serif">Westchester vs. West Palm Beach</h2>' +
      '<p class="lede">You asked for the comparison. Here it is honestly — including the part where ' +
      'your other answers already decided it.</p>' +

      '<div class="card" style="border-color:var(--gold); margin-bottom:22px">' +
        '<div class="eyebrow-sm">The deciding factor</div>' +
        '<p style="font-size:16px">You want a <b>winter</b> wedding, at an <b>oceanfront</b> venue, with an ' +
        '<b>outdoor ceremony</b>. In Westchester in January–March, all three are off the table: highs in the 30s–40s, ' +
        'no ocean, and outdoor ceremonies simply are not done. Westchester\'s peak is late September into October, ' +
        'for foliage over the Hudson.</p>' +
        '<p class="note" style="margin-top:12px">So the real question is not “which place” — it is ' +
        '<b>“winter beach or autumn estate?”</b> Your answers said beach.</p>' +
      '</div>' +

      '<div class="card" style="margin-bottom:22px">' +
        '<div class="eyebrow-sm">The money consequence of your season</div>' +
        '<p style="font-size:15px">Choosing January–March costs you twice over: it is the single most expensive ' +
        'window in Palm Beach <em>and</em> it is the window where Westchester is cheapest. At ' +
        state.plan.guests + ' guests that gap is about <b>' + money(Math.abs(fl.total - ny.total)) +
        '</b>. You are not paying that for a venue — you are paying it for ' +
        '70-degree weather and an ocean in February, which is a perfectly good thing to buy. ' +
        'It just helps to know that is the actual purchase.</p>' +
      '</div>' +

      '<div class="tablewrap card" style="padding:6px 14px 14px; margin-bottom:22px">' +
        '<table><thead><tr><th></th><th>West Palm Beach</th><th>Westchester</th></tr></thead><tbody>' +
        cmp("Your season (Jan–Mar)","<b>Peak</b> — dry, 70s–low 80s","<b>Deep off-season</b> — 30s–40s") +
        cmp("What that does to price","Top of the market","Same rooms discount 30–50%") +
        cmp("Oceanfront","Yes — that is the whole point","None. Long Island Sound at best") +
        cmp("Outdoor ceremony","Standard, with an indoor rain plan","Not viable in winter") +
        cmp("Estimate at " + state.plan.guests + " guests", "<b>" + money(fl.total) + "</b>",
            "<b>" + money(ny.total) + "</b>") +
        cmp("Per guest", money(fl.perGuest), money(ny.perGuest)) +
        cmp("Service charge + tax","24% + 7%","22% + 8.375%") +
        cmp("Guest travel","Flights + peak-winter hotels ($200–1,500/night)","Metro-North, 15-minute shuttles") +
        cmp("Booking lead time","12–18 months for winter Saturdays","14–24 months for autumn Saturdays") +
        cmp("Marriage license","$61 with a premarital course · no wait for out-of-staters","$40 · 24-hour wait · one witness") +
        cmp("Weekend format","Natural — guests are already travelling","Works well in Tarrytown; less expected") +
        '</tbody></table>' +
      '</div>' +

      '<h3 class="sub">If you ever traded winter for autumn</h3>' +
      '<div class="card" style="margin-bottom:22px">' +
        '<p style="color:var(--muted); margin-bottom:14px">These are the Westchester rooms that would earn the switch. ' +
        'All three are indoor-first, which is the trade.</p>' +
        WESTCHESTER.map(function(v){
          return '<div style="border-bottom:1px solid var(--line-soft); padding:12px 0">' +
            '<div style="font-size:16.5px">' + v.n + ' <span style="color:var(--muted); font-size:13px">· ' + v.w + '</span></div>' +
            '<div style="font-size:13px; color:var(--gold-deep); margin:2px 0 5px">' + v.pp + '</div>' +
            '<div style="font-size:14px; color:var(--muted)">' + v.why + '</div></div>'; }).join("") +
      '</div>' +

      '<div class="card">' +
        '<div class="eyebrow-sm">One more thing worth weighing</div>' +
        '<p style="font-size:14.5px; color:var(--muted)">Your guests are mostly in New York and the Northeast, ' +
        'and January–March is exactly when Palm Beach hotel rates peak — island rooms run $600–1,500 a night. ' +
        'Blocking rooms in <b style="color:var(--ink)">downtown West Palm Beach</b> ($200–400) instead of on the island ' +
        'is the single kindest thing you can do for their budgets. Palm Beach International has about ' +
        '63 weekly nonstops to New York alone, so getting there is the easy part.</p>' +
      '</div>';
  }
  function cmp(k,a,b){
    return '<tr><td style="color:var(--muted)">' + k + '</td><td>' + a + '</td><td>' + b + '</td></tr>';
  }

  /* ================= PLAN ================= */
  function renderPlan(){
    var groups = {};
    TASKS.forEach(function(t,i){
      var ph = phaseOf(t.m);
      (groups[ph] = groups[ph] || []).push({t:t, i:i});
    });
    var doneCount = TASKS.filter(function(_,i){ return state.done["t"+i]; }).length;

    view.innerHTML =
      '<h2 class="sec serif">The Plan</h2>' +
      '<p class="lede">Every task dated backward from ' + fmtDate(state.plan.date) + '. ' +
      'Because your date is about ' + Math.round(monthsOut()) + ' months out and peak-winter venues book ' +
      '12–18 months ahead, the first block is genuinely urgent.</p>' +

      '<div class="controls"><div class="ctl">' +
        '<label class="fld" for="dsel">Wedding date</label>' +
        '<select id="dsel">' + DATES.map(function(d){
          return '<option value="' + d.v + '"' + (state.plan.date===d.v?' selected':'') + '>' +
            d.l + ' — ' + d.note + '</option>'; }).join("") + '</select>' +
        '<div style="font-size:12.5px; color:var(--muted); margin-top:8px">Avoid: ' + AVOID.join(" · ") + '</div>' +
      '</div></div>' +

      '<div class="stats"><div class="stat"><div class="k">Tasks done</div>' +
        '<div class="v num">' + doneCount + '<small>/' + TASKS.length + '</small></div>' +
        '<div class="d">' + Math.round(doneCount/TASKS.length*100) + '% complete</div></div>' +
        '<div class="stat"><div class="k">Days to go</div><div class="v num">' + daysOut() + '</div>' +
        '<div class="d">' + fmtDate(state.plan.date) + '</div></div></div>' +

      PHASE_ORDER.filter(function(ph){ return groups[ph]; }).map(function(ph){
        var items = groups[ph];
        var when = shortDate(taskDate(items[0].t.m));
        return '<div class="phase"><div class="ph"><b>' + ph + '</b><span>' + when + '</span></div>' +
          items.map(function(o){
            var d = state.done["t"+o.i];
            return '<label class="task' + (d?" done":"") + '">' +
              '<input type="checkbox" data-task="' + o.i + '"' + (d?" checked":"") + '>' +
              '<span class="tt">' + o.t.t + (o.t.d ? '<small>' + o.t.d + '</small>' : '') + '</span>' +
              '<span class="by">by ' + shortDate(taskDate(o.t.m)) + '</span></label>'; }).join("") +
        '</div>';
      }).join("");

    document.getElementById("dsel").addEventListener("change", function(e){
      state.plan.date = e.target.value; save(); renderPlan(); toast("Date updated — all dates recalculated");
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-task]"), function(cb){
      cb.addEventListener("change", function(){
        var i = cb.getAttribute("data-task");
        if(cb.checked) state.done["t"+i] = true; else delete state.done["t"+i];
        save(); renderPlan();
      });
    });
  }

  /* ================= GUESTS ================= */
  var RSVPS = ["No reply","Yes","No","Maybe"];
  function renderGuests(){
    var gl = state.guests;
    var heads = gl.reduce(function(s,g){ return s + (g.party||1); }, 0);
    var yes = gl.reduce(function(s,g){ return s + (g.rsvp==="Yes" ? (g.party||1) : 0); }, 0);
    var no = gl.reduce(function(s,g){ return s + (g.rsvp==="No" ? (g.party||1) : 0); }, 0);
    var pending = heads - yes - no;

    view.innerHTML =
      '<h2 class="sec serif">The Guest List</h2>' +
      '<p class="lede">One record per household, carried all the way through: invited → RSVP → hotel → ' +
      'thank-you note. Your target is ' + state.plan.guests + ' guests, and destination weddings ' +
      'typically see 10–20% decline.</p>' +

      '<div class="stats">' +
        '<div class="stat hero"><div class="k">On the list</div><div class="v num">' + heads +
          '</div><div class="d">' + gl.length + ' households</div></div>' +
        '<div class="stat"><div class="k">Yes</div><div class="v num" style="color:var(--ok)">' + yes + '</div>' +
          '<div class="d">confirmed heads</div></div>' +
        '<div class="stat"><div class="k">Awaiting reply</div><div class="v num">' + pending + '</div>' +
          '<div class="d">' + no + ' declined</div></div>' +
        '<div class="stat"><div class="k">Vs. target</div><div class="v num">' +
          (heads - state.plan.guests >= 0 ? "+" : "") + (heads - state.plan.guests) + '</div>' +
          '<div class="d">target ' + state.plan.guests + '</div></div>' +
      '</div>' +

      '<div class="addbox">' +
        '<div class="row three" style="margin-bottom:10px">' +
          '<div><label class="fld" for="gn">Name / household</label><input type="text" id="gn" placeholder="The Bianchi family"></div>' +
          '<div><label class="fld" for="gp">Heads</label><input type="number" id="gp" min="1" max="12" value="2"></div>' +
          '<div><label class="fld" for="gsi">Side</label><select id="gsi">' +
            '<option>John</option><option>Emma</option><option>Both</option></select></div>' +
        '</div>' +
        '<button class="btn sm gold" id="gadd">Add to list</button>' +
      '</div>' +

      (gl.length ? gl.map(function(g,i){
        return '<div class="guestrow">' +
          '<div><div class="gname">' + esc(g.name) + '</div>' +
            '<div class="gmeta">' + (g.party||1) + (g.party>1?" heads":" head") + ' · ' + esc(g.side||"Both") +
            (g.hotel ? ' · hotel booked' : '') + '</div></div>' +
          '<div style="display:flex; gap:7px; align-items:center">' +
            '<select class="rsvpsel" data-rsvp="' + i + '">' + RSVPS.map(function(r){
              return '<option' + ((g.rsvp||"No reply")===r?" selected":"") + '>' + r + '</option>'; }).join("") + '</select>' +
            '<button class="del" data-delg="' + i + '" aria-label="Remove">✕</button>' +
          '</div></div>';
      }).join("")
      : '<div class="card"><p style="color:var(--muted)">No guests yet. Start with the must-invites — ' +
        'the people whose absence would change the day. Build outward from there.</p></div>');

    document.getElementById("gadd").addEventListener("click", function(){
      var n = document.getElementById("gn").value.trim();
      if(!n){ toast("Give them a name first"); return; }
      state.guests.push({name:n, party:+document.getElementById("gp").value || 1,
        side:document.getElementById("gsi").value, rsvp:"No reply", hotel:false});
      save(); renderGuests(); toast("Added");
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-rsvp]"), function(sel){
      sel.addEventListener("change", function(){
        state.guests[+sel.getAttribute("data-rsvp")].rsvp = sel.value; save(); renderGuests();
      });
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-delg]"), function(b){
      b.addEventListener("click", function(){
        state.guests.splice(+b.getAttribute("data-delg"), 1); save(); renderGuests();
      });
    });
  }

  /* ================= VENDORS ================= */
  function renderVendors(){
    var booked = VENDOR_CATS.filter(function(v){
      return state.vendors[v.c] && state.vendors[v.c].status === "Booked"; }).length;
    var committed = VENDOR_CATS.reduce(function(s,v){
      var r = state.vendors[v.c]; return s + (r && r.cost ? +r.cost : 0); }, 0);

    view.innerHTML =
      '<h2 class="sec serif">Vendors</h2>' +
      '<p class="lede">Fifteen categories, each with the date you should have it booked by — counted back from ' +
      fmtDate(state.plan.date) + '. Put your quotes in as you get them.</p>' +

      '<div class="stats">' +
        '<div class="stat hero"><div class="k">Booked</div><div class="v num">' + booked + '<small>/' +
          VENDOR_CATS.length + '</small></div><div class="d">vendors locked in</div></div>' +
        '<div class="stat"><div class="k">Committed</div><div class="v num">' + money(committed) + '</div>' +
          '<div class="d">across your quotes</div></div>' +
      '</div>' +

      VENDOR_CATS.map(function(v){
        var r = state.vendors[v.c] || {};
        var by = taskDate(v.lead);
        var late = by < new Date();
        var st = r.status || "Not started";
        var cls = st === "Booked" ? "pill ok" : (late && st === "Not started" ? "pill crit" : "pill");
        return '<div class="card" style="margin-bottom:12px">' +
          '<div style="display:flex; justify-content:space-between; align-items:baseline; gap:10px; flex-wrap:wrap">' +
            '<div style="font-size:17px">' + v.c + '</div>' +
            '<span class="' + cls + '">' + st + '</span>' +
          '</div>' +
          '<div style="font-size:12.5px; color:var(--muted); margin:4px 0 12px">Book by ' +
            shortDate(by) + (v.note ? ' · ' + v.note : '') + '</div>' +
          '<div class="row two" style="margin-bottom:10px">' +
            '<div><label class="fld">Who</label><input type="text" data-vn="' + esc(v.c) +
              '" value="' + esc(r.name||"") + '" placeholder="Name"></div>' +
            '<div><label class="fld">Quote</label><input type="number" data-vc="' + esc(v.c) +
              '" value="' + (r.cost||"") + '" placeholder="0"></div>' +
          '</div>' +
          '<label class="fld">Status</label><select data-vs="' + esc(v.c) + '">' +
            VENDOR_STATUS.map(function(s){
              return '<option' + (st===s?" selected":"") + '>' + s + '</option>'; }).join("") + '</select>' +
        '</div>';
      }).join("") +

      '<h3 class="sub">Tipping, when the time comes</h3>' +
      '<div class="tablewrap card" style="padding:6px 14px 14px">' +
        '<table><thead><tr><th>Vendor</th><th>Customary tip</th></tr></thead><tbody>' +
        [["Catering / waitstaff","15–20% of food &amp; beverage — check whether it is already in the service charge"],
         ["Photographer / videographer","$50–200 each"],
         ["DJ","10–15%, or $50–150"],
         ["Ceremony musicians","$25–50 per player"],
         ["Officiant","$50–100"],
         ["Hair &amp; makeup","15–25%, like a salon"],
         ["Florist / cake / rental crews","$5–20 per person on the delivery team"],
         ["Transportation","15–20% — check for included gratuity"],
         ["Month-of coordinator","Not expected; $100–500 for exceptional work"]].map(function(r){
           return '<tr><td>' + r[0] + '</td><td style="color:var(--muted)">' + r[1] + '</td></tr>'; }).join("") +
        '</tbody></table>' +
        '<p class="note" style="margin-top:12px">Scan every contract for “gratuity included” before you tip twice. ' +
        'Withdraw the cash about two weeks out and label an envelope per vendor.</p>' +
      '</div>';

    function bindV(attr, field, numeric){
      Array.prototype.forEach.call(view.querySelectorAll("[data-" + attr + "]"), function(el){
        el.addEventListener("change", function(){
          var c = el.getAttribute("data-" + attr);
          state.vendors[c] = state.vendors[c] || {};
          state.vendors[c][field] = numeric ? (+el.value || 0) : el.value;
          save();
          if(field === "status" || numeric) renderVendors();
        });
      });
    }
    bindV("vn","name",false); bindV("vc","cost",true); bindV("vs","status",false);
  }

  /* ================= ANSWERS ================= */
  function fmtAnswer(q){
    var a = state.answers[q.id];
    if(!a) return null;
    var parts = [];
    q.groups.forEach(function(g){
      var p = (a.picks && a.picks[g.key]) || [];
      if(p.length) parts.push({lbl:g.label||null, txt:p.join(" · ")});
    });
    (q.notes||[]).forEach(function(nt){
      var t = ((a.notes && a.notes[nt.key]) || "").trim();
      if(t) parts.push({lbl:nt.label, txt:t});
    });
    return parts.length ? parts : null;
  }
  function renderAnswers(){
    var n = Q.filter(function(q){ return fmtAnswer(q); }).length;
    view.innerHTML =
      '<h2 class="sec serif">Our Answers</h2>' +
      '<p class="lede">' + n + ' of 20 answered. Everything in this app is built from these — change an answer ' +
      'and the recommendations should change with it. Tap any question to reopen it.</p>' +
      Q.map(function(q,i){
        var parts = fmtAnswer(q);
        return '<div class="ritem"><div class="rq"><span class="n">' + (i+1) + '.</span>' + q.title + '</div>' +
          (parts ? parts.map(function(p){
            return '<div class="ra">' + (p.lbl ? '<span class="lbl">' + p.lbl + '</span>' : '') +
              esc(p.txt) + '</div>'; }).join("")
            : '<div class="ra un">Not answered yet</div>') +
          '<button class="edit" data-qi="' + i + '">' + (parts ? "Edit" : "Answer") + '</button></div>';
      }).join("") +
      '<div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:28px 0 8px">' +
        '<button class="btn gold" id="copyBtn">Copy answers for Claude</button>' +
        '<button class="btn quiet" id="dlBtn">Download everything</button>' +
      '</div>' +
      '<p style="text-align:center; color:var(--muted); font-size:13.5px">Download gives you the whole plan — ' +
      'answers, budget settings, guest list, vendors — as one file.</p>';

    Array.prototype.forEach.call(view.querySelectorAll("[data-qi]"), function(b){
      b.addEventListener("click", function(){ openQuestion(+b.getAttribute("data-qi")); });
    });
    document.getElementById("copyBtn").addEventListener("click", function(){
      var md = buildMarkdown();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(md).then(function(){ toast("Copied — paste it to Claude"); },
          function(){ fallbackCopy(md); });
      } else fallbackCopy(md);
    });
    document.getElementById("dlBtn").addEventListener("click", function(){
      var blob = new Blob([JSON.stringify({couple:"John & Emma", plan:state.plan,
        answers:state.answers, guests:state.guests, vendors:state.vendors,
        shortlist:Object.keys(state.venuePicks)}, null, 2)], {type:"application/json"});
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url; a.download = "john-emma-wedding.json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast("Downloaded");
    });
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copied — paste it to Claude"); }
    catch(e){ toast("Couldn’t copy — use Download instead"); }
    ta.remove();
  }
  function buildMarkdown(){
    var out = "# John & Emma — Answers to the 20 Questions\n\n";
    Q.forEach(function(q,i){
      out += "## " + (i+1) + ". " + q.title + "\n";
      var parts = fmtAnswer(q);
      if(parts) parts.forEach(function(p){
        out += "- " + (p.lbl ? "**" + p.lbl + ":** " : "") + p.txt + "\n"; });
      else out += "- (not answered)\n";
      out += "\n";
    });
    var b = computeBudget(state.plan);
    out += "## Current plan\n- Date: " + fmtDate(state.plan.date) +
      "\n- Guests: " + state.plan.guests +
      "\n- Venue tier: " + TIERS[state.plan.tier].label +
      "\n- Working budget: " + money(b.total) + " (" + money(b.perGuest) + "/guest)\n";
    return out;
  }

  /* ================= QUESTION POPUP ================= */
  var qmodal = document.getElementById("qmodal");
  var qpop = document.getElementById("qpop");
  var qpopContent = document.getElementById("qpopContent");
  var modalOpen = false;

  function openQuestion(i){ modalOpen = true; qmodal.hidden = false; buildQuestion(i); }
  function closeModal(){
    if(!modalOpen) return;
    modalOpen = false; qmodal.hidden = true; render();
  }
  document.getElementById("qclose").addEventListener("click", closeModal);
  qmodal.addEventListener("click", function(e){ if(e.target === qmodal) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });

  function buildQuestion(i){
    var q = Q[i], a = ans(q.id);
    var html =
      '<div class="seal script">&amp;</div>' +
      '<div class="qcount"><span class="orn">❦</span>Question ' + (i+1) + ' of 20<span class="orn">❦</span></div>' +
      '<div class="qbar"><span class="rail"><i style="width:' + Math.round(i/Q.length*100) + '%"></i></span></div>' +
      '<div class="qsection">' + q.section + '</div>' +
      '<div class="qtitle serif">' + q.title + '</div>' +
      '<div class="qcontext">' + q.context + '</div>';
    q.groups.forEach(function(g){
      if(g.label) html += '<div class="grouplabel">' + g.label + '</div>';
      html += '<div class="chips" data-group="' + g.key + '">';
      g.options.forEach(function(opt){
        var on = ((a.picks[g.key]||[]).indexOf(opt) !== -1);
        html += '<button class="chip' + (on?" on":"") + '" data-opt="' + esc(opt) + '">' + opt + '</button>';
      });
      html += '</div>';
    });
    (q.notes||[]).forEach(function(nt){
      html += '<div class="grouplabel">' + nt.label + '</div>' +
        '<textarea data-note="' + nt.key + '" placeholder="In your own words (optional)&hellip;">' +
        esc(a.notes[nt.key]||"") + '</textarea>';
    });
    html += '<div class="qnav">' +
        '<button class="btn quiet" id="backBtn">' + (i===0 ? "Close" : "Back") + '</button>' +
        '<span class="hint">Saves as you tap</span>' +
        '<button class="btn" id="nextBtn">' + (i===Q.length-1 ? "Done" : "Next") + '</button>' +
      '</div>';
    qpopContent.innerHTML = html;
    qpopContent.scrollTop = 0;
    qpop.style.animation = "none"; void qpop.offsetWidth; qpop.style.animation = "";

    Array.prototype.forEach.call(qpopContent.querySelectorAll(".chips"), function(chipsEl){
      var gkey = chipsEl.getAttribute("data-group");
      var g = q.groups.filter(function(x){ return x.key === gkey; })[0];
      Array.prototype.forEach.call(chipsEl.querySelectorAll(".chip"), function(chip){
        chip.addEventListener("click", function(){
          var opt = chip.getAttribute("data-opt");
          var cur = a.picks[gkey] || [];
          if(g.type === "single"){
            a.picks[gkey] = (cur[0] === opt) ? [] : [opt];
            Array.prototype.forEach.call(chipsEl.querySelectorAll(".chip"), function(c){ c.classList.remove("on"); });
            if(a.picks[gkey].length) chip.classList.add("on");
          } else {
            var ix = cur.indexOf(opt);
            if(ix === -1) cur.push(opt); else cur.splice(ix,1);
            a.picks[gkey] = cur; chip.classList.toggle("on");
          }
          save();
        });
      });
    });
    Array.prototype.forEach.call(qpopContent.querySelectorAll("textarea"), function(ta){
      ta.addEventListener("input", function(){
        a.notes[ta.getAttribute("data-note")] = ta.value; save();
      });
    });
    document.getElementById("backBtn").addEventListener("click", function(){
      if(i === 0) closeModal(); else buildQuestion(i-1);
    });
    document.getElementById("nextBtn").addEventListener("click", function(){
      if(i === Q.length-1) closeModal(); else buildQuestion(i+1);
    });
  }

  save();
  render();
})();
</script>
<script>
