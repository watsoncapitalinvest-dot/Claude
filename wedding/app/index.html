<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>John &amp; Emma's Wedding</title>
<style>
  :root{
    --paper:#FBF7F0; --panel:#FFFFFF; --ink:#2C2824; --muted:#7B7164;
    --gold:#AE8A54; --gold-deep:#8F6E3D; --gold-soft:#EFE3CC; --sage:#4C5F51;
    --blush:#D9B2A4; --line:#E6DCCB; --line-soft:#EFE8DA;
    --ok:#4C6B52;
    --shadow:0 10px 30px rgba(96,78,50,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#171B18; --panel:#1F251F; --ink:#EDE6D6; --muted:#9C927E;
      --gold:#C9A96E; --gold-deep:#DBBE85; --gold-soft:#3A3324; --sage:#93AC97;
      --blush:#C08D7C; --line:#39413A; --line-soft:#2A302A;
      --ok:#8FB896;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#171B18; --panel:#1F251F; --ink:#EDE6D6; --muted:#9C927E;
    --gold:#C9A96E; --gold-deep:#DBBE85; --gold-soft:#3A3324; --sage:#93AC97;
    --blush:#C08D7C; --line:#39413A; --line-soft:#2A302A;
    --ok:#8FB896;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --paper:#FBF7F0; --panel:#FFFFFF; --ink:#2C2824; --muted:#7B7164;
    --gold:#AE8A54; --gold-deep:#8F6E3D; --gold-soft:#EFE3CC; --sage:#4C5F51;
    --blush:#D9B2A4; --line:#E6DCCB; --line-soft:#EFE8DA;
    --ok:#4C6B52;
    --shadow:0 10px 30px rgba(96,78,50,.10);
  }

  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Optima","Candara","Gill Sans","Gill Sans MT","Segoe UI",system-ui,sans-serif;
    font-size:16.5px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .serif{font-family:"Didot","Bodoni MT","Bodoni 72","Playfair Display",Georgia,serif}
  .script{font-family:"Snell Roundhand","Savoye LET","Segoe Script","Brush Script MT",cursive}

  /* ---------- Intro overlay ---------- */
  #intro{
    position:fixed; inset:0; z-index:100; background:var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  #intro.done{display:none}
  #intro.leaving{animation:introOut 1.1s ease forwards}
  @keyframes introOut{to{opacity:0; visibility:hidden}}
  .intro-frame{
    position:absolute; inset:18px; border:1px solid var(--gold);
    opacity:0; animation:fadeIn 1.2s ease .1s forwards; pointer-events:none;
  }
  .intro-frame::after{
    content:""; position:absolute; inset:6px; border:1px solid var(--line);
  }
  .intro-inner{text-align:center; padding:0 24px; max-width:900px}
  .intro-eyebrow{
    font-size:12px; letter-spacing:.42em; text-transform:uppercase; color:var(--gold-deep);
    opacity:0; animation:fadeIn 1s ease .5s forwards;
  }
  .intro-names{
    display:flex; align-items:baseline; justify-content:center; gap:.18em;
    margin:18px 0 6px; font-size:clamp(44px,9vw,96px); line-height:1.05;
    letter-spacing:.02em;
  }
  .intro-names .n{opacity:0}
  .intro-names .john{animation:fromLeft 1.5s cubic-bezier(.2,.7,.2,1) .7s forwards}
  .intro-names .emma{animation:fromRight 1.5s cubic-bezier(.2,.7,.2,1) .7s forwards}
  .intro-names .amp{
    font-size:.72em; color:var(--gold); opacity:0; padding:0 .12em;
    animation:ampIn 1s ease 1.9s forwards;
  }
  @keyframes fromLeft{from{opacity:0; transform:translateX(-46vw)} 60%{opacity:1} to{opacity:1; transform:none}}
  @keyframes fromRight{from{opacity:0; transform:translateX(46vw)} 60%{opacity:1} to{opacity:1; transform:none}}
  @keyframes ampIn{from{opacity:0; transform:scale(.6)} to{opacity:1; transform:scale(1)}}
  @keyframes fadeIn{to{opacity:1}}
  .intro-figures{height:150px; margin:10px auto 4px; position:relative; width:260px}
  .intro-figures svg{position:absolute; bottom:0; opacity:0}
  .fig-john{left:34px; animation:figLeft 1.9s cubic-bezier(.25,.7,.25,1) 1s forwards}
  .fig-emma{right:34px; animation:figRight 1.9s cubic-bezier(.25,.7,.25,1) 1s forwards}
  @keyframes figLeft{from{opacity:0; transform:translateX(-44vw)} 40%{opacity:1} to{opacity:1; transform:none}}
  @keyframes figRight{from{opacity:0; transform:translateX(44vw)} 40%{opacity:1} to{opacity:1; transform:none}}
  .intro-heart{
    position:absolute; left:50%; top:8px; transform:translateX(-50%) scale(.5);
    color:var(--blush); font-size:22px; opacity:0; animation:ampIn .8s ease 2.7s forwards;
  }
  .intro-tag{
    font-size:15px; color:var(--muted); letter-spacing:.16em; text-transform:uppercase;
    opacity:0; animation:fadeIn 1.2s ease 2.9s forwards;
  }
  .intro-skip{
    position:absolute; bottom:34px; left:0; right:0; text-align:center;
    font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted);
    opacity:0; animation:fadeIn 1s ease 3.4s forwards;
  }
  @media (prefers-reduced-motion: reduce){
    #intro *, #intro{animation-duration:.01s !important; animation-delay:0s !important}
    #intro.leaving{animation:introOut .3s ease forwards}
  }

  /* ---------- App shell ---------- */
  #app{opacity:0; transition:opacity .9s ease}
  #app.visible{opacity:1}
  .shell{max-width:880px; margin:0 auto; padding:28px 20px 90px}
  .masthead{text-align:center; padding:26px 0 8px; border-bottom:1px solid var(--line); position:relative}
  .masthead .eyebrow{font-size:11px; letter-spacing:.4em; text-transform:uppercase; color:var(--gold-deep)}
  .masthead h1{font-size:clamp(34px,6vw,52px); font-weight:500; letter-spacing:.02em; margin:10px 0 2px}
  .masthead h1 .amp{color:var(--gold); font-size:.75em}
  .masthead .sub{color:var(--muted); font-size:13.5px; letter-spacing:.22em; text-transform:uppercase; margin-bottom:18px}
  .theme-btn{
    position:absolute; right:0; top:8px; background:none; border:1px solid var(--line);
    border-radius:999px; width:38px; height:38px; cursor:pointer; color:var(--muted); font-size:15px;
  }
  .theme-btn:hover{border-color:var(--gold)}

  nav.tabs{display:flex; justify-content:center; gap:6px; flex-wrap:wrap; padding:14px 0 0}
  .tab{
    background:none; border:none; cursor:pointer; color:var(--muted);
    font:inherit; font-size:13px; letter-spacing:.18em; text-transform:uppercase;
    padding:8px 14px 10px; border-bottom:2px solid transparent;
  }
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink); border-bottom-color:var(--gold)}
  .tab:focus-visible, button:focus-visible, textarea:focus-visible, .chip:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }

  main{padding-top:34px}

  /* ---------- Dashboard ---------- */
  .welcome{text-align:center; max-width:620px; margin:0 auto 34px}
  .welcome h2{font-size:30px; font-weight:500; margin-bottom:10px}
  .welcome p{color:var(--muted)}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:24px 22px; box-shadow:var(--shadow); position:relative;
  }
  .card.primary{border-color:var(--gold); grid-column:1 / -1}
  .card h3{font-size:21px; font-weight:500; margin-bottom:6px}
  .card p{color:var(--muted); font-size:14.5px}
  .card .lockline{
    display:inline-block; margin-top:14px; font-size:11px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--gold-deep); border:1px solid var(--line);
    padding:5px 10px; border-radius:999px;
  }
  .progress-note{font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:8px}
  .btn{
    display:inline-block; background:var(--sage); color:var(--paper); border:none; cursor:pointer;
    font:inherit; font-size:14px; letter-spacing:.16em; text-transform:uppercase;
    padding:13px 26px; border-radius:2px; margin-top:16px;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.gold{background:var(--gold); color:#fff}
  :root[data-theme="dark"] .btn, :root[data-theme="dark"] .btn.gold{color:#14170f}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn{color:#14170f} }
  .btn.quiet{background:none; color:var(--ink); border:1px solid var(--line)}
  .btn.quiet:hover{border-color:var(--gold)}
  .facts{margin-top:30px; border-top:1px solid var(--line); padding-top:18px}
  .facts h4{font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted); text-align:center; margin-bottom:14px}
  .facts ul{list-style:none; display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px}
  .facts li{font-size:13.5px; color:var(--muted); border-left:2px solid var(--gold-soft); padding-left:12px}
  .facts li b{color:var(--ink); font-weight:600}

  /* ---------- Question pop-up ---------- */
  .qmodal{
    position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(24,20,14,.48); backdrop-filter:blur(3px);
    animation:modalFade .35s ease;
  }
  .qmodal[hidden]{display:none}
  @keyframes modalFade{from{opacity:0} to{opacity:1}}
  .qpop{
    position:relative; width:min(640px,96vw); max-height:90vh;
    display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--gold); border-radius:4px;
    box-shadow:0 30px 90px rgba(20,14,6,.45);
    animation:popIn .5s cubic-bezier(.2,.85,.3,1);
  }
  @keyframes popIn{from{opacity:0; transform:scale(.9) translateY(22px)} to{opacity:1; transform:none}}
  .qpop::before{content:""; position:absolute; inset:7px; border:1px solid var(--line); border-radius:2px; pointer-events:none; z-index:1}
  .qpop .corner{position:absolute; color:var(--gold); font-size:15px; line-height:1; opacity:.9; z-index:2; pointer-events:none}
  .qpop .c-tl{top:13px; left:15px}
  .qpop .c-tr{top:13px; right:15px; transform:scaleX(-1)}
  .qpop .c-bl{bottom:13px; left:15px; transform:scaleY(-1)}
  .qpop .c-br{bottom:13px; right:15px; transform:scale(-1,-1)}
  .qpop-scroll{overflow-y:auto; padding:36px 36px 28px}
  .qpop .seal{
    width:46px; height:46px; border:1px solid var(--gold); border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 12px; color:var(--gold); font-size:24px; background:var(--paper);
  }
  .qpop .qcount{
    text-align:center; font-size:11px; letter-spacing:.32em; text-transform:uppercase;
    color:var(--gold-deep); margin-bottom:6px;
  }
  .qpop .qcount .orn{color:var(--blush); letter-spacing:0; margin:0 10px}
  .qclose{
    position:absolute; top:14px; right:18px; z-index:3; background:var(--panel); border:none; cursor:pointer;
    color:var(--muted); font-size:17px; line-height:1; padding:4px 6px;
  }
  .qclose:hover{color:var(--ink)}
  .qpop .qcard{border:none; box-shadow:none; background:none; padding:0}
  .qpop .qcard .section{text-align:center}
  .qpop .qcard h2{text-align:center}
  .qpop .qbar{margin:14px 0 20px}
  @media (prefers-reduced-motion: reduce){
    .qmodal, .qpop{animation:none !important}
  }

  /* ---------- Questionnaire ---------- */
  .qwrap{max-width:640px; margin:0 auto}
  .qbar{display:flex; align-items:center; gap:14px; margin-bottom:26px}
  .qbar .count{font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold-deep); white-space:nowrap}
  .qbar .rail{flex:1; height:2px; background:var(--line); position:relative}
  .qbar .rail i{position:absolute; left:0; top:0; bottom:0; background:var(--gold); transition:width .4s ease}
  .qcard{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:34px 30px; box-shadow:var(--shadow)}
  .qcard .section{font-size:11px; letter-spacing:.34em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:12px}
  .qcard h2{font-size:clamp(22px,3.4vw,28px); font-weight:500; line-height:1.3; text-wrap:balance; margin-bottom:10px}
  .qcard .context{color:var(--muted); font-size:14px; margin-bottom:22px; border-left:2px solid var(--gold-soft); padding-left:12px}
  .grouplabel{font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted); margin:18px 0 10px}
  .chips{display:flex; flex-wrap:wrap; gap:9px}
  .chip{
    background:none; border:1px solid var(--line); border-radius:999px; cursor:pointer;
    font:inherit; font-size:14.5px; color:var(--ink); padding:9px 16px; transition:all .15s ease;
  }
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:var(--gold-soft); border-color:var(--gold); color:var(--ink)}
  .chip.on::before{content:"✓ "; color:var(--gold-deep)}
  textarea{
    width:100%; min-height:74px; resize:vertical; background:var(--paper);
    border:1px solid var(--line); border-radius:3px; padding:12px 14px;
    font:inherit; font-size:14.5px; color:var(--ink); margin-top:6px;
  }
  textarea::placeholder{color:var(--muted); opacity:.75}
  .qnav{display:flex; justify-content:space-between; align-items:center; margin-top:26px}
  .qnav .hint{font-size:12px; color:var(--muted)}

  /* ---------- Review ---------- */
  .review h2{font-size:28px; font-weight:500; text-align:center; margin-bottom:6px}
  .review .rsub{text-align:center; color:var(--muted); margin-bottom:28px}
  .ritem{border-bottom:1px solid var(--line-soft); padding:16px 2px}
  .ritem .rq{font-size:16px; font-weight:600}
  .ritem .rq .num{color:var(--gold-deep); font-weight:400; margin-right:8px}
  .ritem .ra{color:var(--ink); margin-top:5px; font-size:15px}
  .ritem .ra .lbl{color:var(--muted); font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; margin-right:6px}
  .ritem .unanswered{color:var(--blush); font-style:italic}
  .ritem .edit{background:none; border:none; cursor:pointer; color:var(--gold-deep); font:inherit; font-size:13px; text-decoration:underline; padding:0; margin-top:6px}
  .export-row{display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin:30px 0 6px}
  .toast{
    position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-size:13.5px; letter-spacing:.06em;
    padding:11px 22px; border-radius:999px; opacity:0; pointer-events:none; transition:opacity .3s ease; z-index:50;
  }
  .toast.show{opacity:1}

  footer{margin-top:70px; text-align:center; color:var(--muted); font-size:12px; letter-spacing:.24em; text-transform:uppercase}
  footer .amp{color:var(--gold)}
</style>

<div id="intro" role="button" aria-label="Skip intro" tabindex="0">
  <div class="intro-frame"></div>
  <div class="intro-inner">
    <div class="intro-eyebrow">Together with their families</div>
    <div class="intro-names serif">
      <span class="n john">John</span>
      <span class="n amp script">&amp;</span>
      <span class="n emma">Emma</span>
    </div>
    <div class="intro-figures">
      <span class="intro-heart">♥</span>
      <svg class="fig-john" width="74" height="140" viewBox="0 0 74 140" aria-hidden="true">
        <circle cx="37" cy="18" r="12" fill="currentColor"/>
        <path d="M37 33 C22 33 16 46 15 62 L20 120 L30 120 L33 78 L41 78 L44 120 L54 120 L59 62 C58 46 52 33 37 33 Z" fill="currentColor"/>
        <path d="M37 36 L42 48 L37 66 L32 48 Z" fill="var(--paper)"/>
      </svg>
      <svg class="fig-emma" width="86" height="140" viewBox="0 0 86 140" aria-hidden="true">
        <circle cx="43" cy="18" r="12" fill="currentColor"/>
        <path d="M43 32 C33 32 28 42 26 54 C20 82 12 106 8 122 L78 122 C74 106 66 82 60 54 C58 42 53 32 43 32 Z" fill="currentColor"/>
        <path d="M30 14 C30 6 37 2 43 2 C49 2 56 6 56 14 L43 20 Z" fill="currentColor" opacity=".55"/>
      </svg>
    </div>
    <div class="intro-tag">are getting married</div>
  </div>
  <div class="intro-skip">Tap anywhere to enter</div>
</div>

<div id="app">
  <div class="shell">
    <header class="masthead">
      <button class="theme-btn" id="themeBtn" title="Toggle light / dark" aria-label="Toggle theme">◐</button>
      <div class="eyebrow">The Wedding Of</div>
      <h1 class="serif">John <span class="amp script">&amp;</span> Emma</h1>
      <div class="sub">Westchester, New York &nbsp;·&nbsp; or &nbsp;·&nbsp; West Palm Beach, Florida</div>
      <nav class="tabs" id="tabs"></nav>
    </header>
    <main id="view"></main>
    <footer>John <span class="amp">&amp;</span> Emma · Planned With Love</footer>
  </div>
</div>
<div class="qmodal" id="qmodal" hidden role="dialog" aria-modal="true" aria-label="Wedding question">
  <div class="qpop" id="qpop">
    <span class="corner c-tl">❧</span><span class="corner c-tr">❧</span>
    <span class="corner c-bl">❧</span><span class="corner c-br">❧</span>
    <button class="qclose" id="qclose" aria-label="Close question">✕</button>
    <div class="qpop-scroll" id="qpopContent"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  /* ---------------- Questions ---------------- */
  var Q = [
    {id:"location", section:"Where & When", title:"Which location is the wedding — Westchester, West Palm Beach, or still an open question?",
     context:"Near-opposite markets: Westchester peaks Sept–Oct (foliage, ~$300–700/guest); Palm Beach peaks Jan–Mar (dry season, ~$378–458/guest).",
     groups:[{key:"a", type:"single", options:["Westchester, NY","West Palm Beach, FL","Compare both for us","Somewhere else entirely"]}],
     notes:[{key:"note", label:"What draws you to each?"}]},
    {id:"season", section:"Where & When", title:"What season or date range are you dreaming of — and how flexible are you?",
     context:"Same venue, off-peak or a Friday/Sunday, saves 15–40%. WPB hurricane season runs June–Nov (Sept–Oct worst); October Saturdays are Westchester's hardest dates.",
     groups:[{key:"a", type:"multi", options:["Fall (Sept–Oct)","Winter (Jan–Mar)","Spring (Apr–June)","Summer (July–Aug)","Totally flexible"]}],
     notes:[{key:"note", label:"A specific date in mind, or dates to avoid?"}]},
    {id:"timeline", section:"Where & When", title:"How long do you want the engagement — married by when?",
     context:"Marquee venues in both markets book 12–24 months out for peak Saturdays; off-peak can be done in 6–9 months.",
     groups:[{key:"a", type:"single", options:["Within 12 months","12–18 months","18–24 months","No rush at all"]}]},
    {id:"guests", section:"Where & When", title:"Roughly how many guests?",
     context:"The single biggest budget lever — every 10 guests ≈ $3,000–$4,600 in your two markets. Westchester weddings average 166–176 guests; destination trims lists 15–25%.",
     groups:[{key:"a", type:"single", options:["Under 75","75–125","125–175","175 or more"]}],
     notes:[{key:"note", label:"Must-invites vs. nice-to-invites — any early thoughts?"}]},
    {id:"budget", section:"Money & Priorities", title:"What's the all-in budget range you're comfortable with?",
     context:"Realistic bands — Westchester: $60–110K for 125–150 guests at a named venue. WPB: $40–65K non-resort; $150K+ at the Breakers tier. Pad any number ~25–30% for tax, service charges, and tips.",
     groups:[{key:"a", type:"single", options:["Under $50K","$50–75K","$75–110K","$110K+","Help us figure it out"]}],
     notes:[{key:"note", label:"Who's contributing?"}]},
    {id:"splurge", section:"Money & Priorities", title:"Pick your splurge-worthy categories — up to three each.",
     context:"The planner's #1 tool for an honest budget: name what you'll gladly overspend on, and everything else gets economized.",
     groups:[
       {key:"john", label:"John's splurges", type:"multi", options:["Food & bar","Music & entertainment","Photography & video","Flowers & design","The venue itself","Attire"]},
       {key:"emma", label:"Emma's splurges", type:"multi", options:["Food & bar","Music & entertainment","Photography & video","Flowers & design","The venue itself","Attire"]}],
     notes:[{key:"note", label:"And what do you genuinely not care about?"}]},
    {id:"tradeoff", section:"Money & Priorities", title:"Guest count vs. per-guest experience — which way do you lean?",
     context:"A fixed budget buys either a bigger room or a better plate. Most couples discover they have a strong instinct here.",
     groups:[{key:"a", type:"single", options:["Big party, simpler details","Smaller list, top-shelf everything","A balanced middle"]}]},
    {id:"venue", section:"Venue & Vibe", title:"What venue style makes your hearts beat faster?",
     context:"Westchester's signatures: Tappan Hill, Whitby Castle, Glen Island, Lyndhurst, Blue Hill at Stone Barns. WPB's: The Breakers, Eau Palm Beach, Flagler Museum, Ann Norton Gardens, Pelican Club.",
     groups:[{key:"a", type:"multi", options:["Historic mansion / estate","Castle","Ballroom on the water","Oceanfront resort","Garden or museum","Farm-to-table","Country club"]}]},
    {id:"ceremony_setting", section:"Venue & Vibe", title:"Indoor ballroom or outdoor ceremony?",
     context:"Outdoor means a rain plan (and in Florida, a heat-and-thunderstorm plan). How much weather risk can you stomach?",
     groups:[{key:"a", type:"single", options:["Outdoors, with a rain plan","Indoors all the way","Open to either"]}]},
    {id:"formality", section:"Venue & Vibe", title:"How formal?",
     context:"This cascades into attire, invitations, venue fit, even ceremony time — black-tie + sunset ceremony is the current Palm Beach formula.",
     groups:[{key:"a", type:"single", options:["Black-tie","Formal / cocktail","Semi-formal","Relaxed & easy"]}]},
    {id:"format", section:"Venue & Vibe", title:"One perfect day, or a full wedding weekend?",
     context:"~31% of couples now host a welcome party, ~22% a farewell brunch. If guests fly to Florida, a multi-day format is almost expected.",
     groups:[{key:"a", type:"single", options:["One perfect day","Full weekend — welcome party to brunch","The day plus one extra event"]}]},
    {id:"ceremony_type", section:"Ceremony & People", title:"What does the ceremony itself look like?",
     context:"Affects officiant, venue eligibility, timeline length, and paperwork — Florida waives its 3-day resident wait and discounts the license $25 with a 4-hour premarital course.",
     groups:[{key:"a", type:"single", options:["Religious","A cultural blend","Secular & personal","Still deciding"]}],
     notes:[{key:"note", label:"Any family traditions that must be honored? An officiant in mind?"}]},
    {id:"party", section:"Ceremony & People", title:"Wedding party — how big, or none at all?",
     context:"Each attendant adds real cost (hair & makeup coverage, flowers, gifts, transport) and coordination load.",
     groups:[{key:"a", type:"single", options:["No wedding party","Small — 2–4 each","Medium — 5–7 each","Large — 8+ each"]}]},
    {id:"planner", section:"Ceremony & People", title:"Professional planner, month-of coordinator, or DIY with this app?",
     context:"Month-of runs $1,500–3,500; full-service $5–15K+. Some luxury venues (The Breakers) effectively require a professional planner.",
     groups:[{key:"a", type:"single", options:["Full-service planner","Month-of coordinator","DIY — this app is our planner","Decide later"]}]},
    {id:"food", section:"The Party", title:"Food & drink — what's the vision?",
     context:"Venue + catering is 40–50% of every wedding budget. This is the heart of the spend.",
     groups:[
       {key:"a", label:"Dinner style", type:"single", options:["Plated dinner","Stations","Family-style","Cocktail-style & heavy apps"]},
       {key:"bar", label:"The bar", type:"multi", options:["Top-shelf open bar","Signature cocktails","Espresso martini cart","Raw bar","Beer & wine is fine"]}],
     notes:[{key:"note", label:"Major dietary needs in the families?"}]},
    {id:"music", section:"The Party", title:"Live band, DJ, or both — and is this a dance-all-night crowd?",
     context:"DJs run $1,500–3,000 in both markets; bands $4,500–15,000+. Bands are the norm at Palm Beach resorts and Westchester country clubs.",
     groups:[{key:"a", type:"single", options:["Live band","DJ","Both — band and DJ","Strings for ceremony, DJ for party"]}],
     notes:[{key:"note", label:"Dance-all-night crowd? Must-play (or never-play) songs?"}]},
    {id:"photo", section:"The Party", title:"Photography & video — what style do you love?",
     context:"Photo + video typically takes 10–12% of budget; top shooters book 12+ months out and sell out first after venues.",
     groups:[{key:"a", type:"multi", options:["Editorial & posed","Documentary & candid","A mix of both","Videographer too","Content creator for same-day clips"]}]},
    {id:"travel", section:"The Feeling", title:"Where do your guests live, and how much travel can you ask of them?",
     context:"The real Westchester-vs-WPB question: flights plus $200–1,500/night winter hotels, or Metro-North and a 15-minute shuttle. (PBI has ~63 weekly nonstops to NYC.)",
     groups:[{key:"a", type:"single", options:["Mostly NY & the Northeast","Split between NY & Florida","Spread across the country","Mostly Florida"]}],
     notes:[{key:"note", label:"Anyone the travel decision hinges on?"}]},
    {id:"memory", section:"The Feeling", title:"The morning after — what do you hope everyone is still talking about?",
     context:"Close your eyes: it's the day after the wedding. What's the one thing that made it unmistakably yours?",
     groups:[{key:"a", type:"multi", options:["The dance floor","The food & drinks","How personal it felt","The setting & the views","The ceremony itself"]}],
     notes:[{key:"note", label:"Weddings you've attended that taught you what to do — or what not to do?"}]},
    {id:"worries", section:"The Feeling", title:"What is each of you most worried about?",
     context:"Couples on Reddit don't want more features — they want no ads, no vendor spam, and one place for everything. Tell us what 'planning felt easy' would look like.",
     groups:[{key:"a", type:"multi", options:["Cost creep","Family dynamics","Weather","Decision fatigue","The seating chart","Vendor wrangling"]}],
     notes:[
       {key:"john", label:"John — what would make planning feel easy?"},
       {key:"emma", label:"Emma — what would make planning feel easy?"}]}
  ];

  /* ---------------- State ---------------- */
  var KEY = "je-wedding-v1";
  var state = load();
  function load(){
    try{ var s = JSON.parse(localStorage.getItem(KEY)); if(s && s.answers) return s; }catch(e){}
    return {answers:{}, seenIntro:false, theme:null};
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function ans(id){ if(!state.answers[id]) state.answers[id] = {picks:{}, notes:{}}; return state.answers[id]; }
  function isAnswered(q){
    var a = state.answers[q.id]; if(!a) return false;
    var any = false;
    Object.keys(a.picks||{}).forEach(function(k){ if((a.picks[k]||[]).length) any = true; });
    Object.keys(a.notes||{}).forEach(function(k){ if((a.notes[k]||"").trim()) any = true; });
    return any;
  }
  function answeredCount(){ return Q.filter(isAnswered).length; }

  /* ---------------- Theme ---------------- */
  var themeBtn = document.getElementById("themeBtn");
  if(state.theme) document.documentElement.setAttribute("data-theme", state.theme);
  themeBtn.addEventListener("click", function(){
    var cur = document.documentElement.getAttribute("data-theme");
    var next;
    if(cur === "dark") next = "light";
    else if(cur === "light") next = "dark";
    else next = window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    state.theme = next; save();
  });

  /* ---------------- Intro ---------------- */
  var intro = document.getElementById("intro");
  var app = document.getElementById("app");
  var introTimer = setTimeout(endIntro, 4600);
  function endIntro(){
    clearTimeout(introTimer);
    if(intro.classList.contains("leaving") || intro.classList.contains("done")) return;
    intro.classList.add("leaving");
    app.classList.add("visible");
    setTimeout(function(){ intro.classList.add("done"); }, 1150);
    state.seenIntro = true; save();
  }
  intro.addEventListener("click", endIntro);
  intro.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" ") endIntro(); });
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    clearTimeout(introTimer); introTimer = setTimeout(endIntro, 1400);
  }

  /* ---------------- Router ---------------- */
  var view = document.getElementById("view");
  var tabsEl = document.getElementById("tabs");
  var route = {name:"home", qi:0};

  var TABS = [
    {id:"home", label:"Home"},
    {id:"questions", label:"The 20 Questions"},
    {id:"answers", label:"Our Answers"}
  ];
  function renderTabs(){
    tabsEl.innerHTML = "";
    TABS.forEach(function(t){
      var b = document.createElement("button");
      b.className = "tab" + (route.name===t.id || (t.id==="questions" && modalOpen) ? " active":"");
      b.textContent = t.label;
      b.addEventListener("click", function(){ go(t.id); });
      tabsEl.appendChild(b);
    });
  }
  function go(name, qi){
    if(name==="questions"){
      var next = Q.findIndex(function(q){ return !isAnswered(q); });
      openQuestion(next === -1 ? 0 : next);
      return;
    }
    route.name = name; if(typeof qi === "number") route.qi = qi;
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  }
  function render(){
    renderTabs();
    if(route.name==="home") renderHome();
    else if(route.name==="answers") renderReview();
  }

  /* ---------------- Home ---------------- */
  function renderHome(){
    var n = answeredCount();
    var cta = n===0 ? "Begin the questions" : (n<Q.length ? "Continue — " + n + " of 20 answered" : "Review your answers");
    view.innerHTML =
      '<div class="welcome">' +
        '<h2 class="serif">Welcome to your wedding, twice imagined.</h2>' +
        '<p>Hudson River estates in October gold, or the Atlantic at your backs in Palm Beach winter. ' +
        'Before this app plans anything, it needs to know the two of you. It starts with twenty questions — answer them together.</p>' +
      '</div>' +
      '<div class="cards">' +
        '<div class="card primary">' +
          '<div class="progress-note">' + (n===Q.length ? "Complete" : n + " of 20 answered") + '</div>' +
          '<h3 class="serif">The 20 Questions</h3>' +
          '<p>Location, season, budget, guest count, the vibe, the party, the worries — every answer becomes the app’s founding configuration. Grounded in research on both of your markets.</p>' +
          '<button class="btn gold" id="startBtn">' + cta + '</button>' +
        '</div>' +
        lockedCard("The Budget","A living budget that tells the truth — auto-adding tax, service charges, and gratuities, with every vendor payment date tracked.") +
        lockedCard("The Guest List","One record per guest, from address to RSVP to meal to hotel to seat to thank-you note.") +
        lockedCard("Venues & Vendors","Your shortlists — Tappan Hill to The Breakers — with contracts, deposits, and red-flag checks in one place.") +
        lockedCard("The Timeline","Every task auto-dated backward from your wedding date, from “book the venue” to “tip envelopes.”") +
      '</div>' +
      '<div class="facts">' +
        '<h4>From the research</h4>' +
        '<ul>' +
          '<li><b>Westchester</b> peaks Sept–Oct; named venues run $60–110K for 125–150 guests and book 14–24 months out.</li>' +
          '<li><b>West Palm Beach</b> peaks Jan–Mar; $40–65K non-resort, $150K+ at the Breakers tier. No license wait for out-of-staters.</li>' +
          '<li><b>Everywhere:</b> pad quotes ~25–30% — tax, service charges, and tips are the costs couples forget.</li>' +
        '</ul>' +
      '</div>';
    document.getElementById("startBtn").addEventListener("click", function(){
      if(n===Q.length) go("answers"); else go("questions");
    });
  }
  function lockedCard(title, body){
    return '<div class="card"><h3 class="serif">' + title + '</h3><p>' + body + '</p>' +
      '<span class="lockline">Unlocks after the questions</span></div>';
  }

  /* ---------------- Question pop-up ---------------- */
  var qmodal = document.getElementById("qmodal");
  var qpop = document.getElementById("qpop");
  var qpopContent = document.getElementById("qpopContent");
  var modalOpen = false;

  function openQuestion(i){
    route.qi = i;
    modalOpen = true;
    qmodal.hidden = false;
    buildQuestion(i);
    renderTabs();
  }
  function closeModal(){
    if(!modalOpen) return;
    modalOpen = false;
    qmodal.hidden = true;
    render();
  }
  document.getElementById("qclose").addEventListener("click", closeModal);
  qmodal.addEventListener("click", function(e){ if(e.target === qmodal) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });
  function repop(){
    qpop.style.animation = "none";
    void qpop.offsetWidth;
    qpop.style.animation = "";
  }

  function buildQuestion(i){
    route.qi = i;
    var q = Q[i];
    var a = ans(q.id);
    var pct = Math.round((i)/Q.length*100);
    var html =
        '<div class="seal script">&amp;</div>' +
        '<div class="qcount"><span class="orn">❦</span>Question ' + (i+1) + ' of 20<span class="orn">❦</span></div>' +
        '<div class="qbar"><span class="rail"><i style="width:' + pct + '%"></i></span></div>' +
        '<div class="qcard">' +
          '<div class="section">' + q.section + '</div>' +
          '<h2 class="serif">' + q.title + '</h2>' +
          '<div class="context">' + q.context + '</div>';
    q.groups.forEach(function(g){
      if(g.label) html += '<div class="grouplabel">' + g.label + '</div>';
      html += '<div class="chips" data-group="' + g.key + '">';
      g.options.forEach(function(opt){
        var on = (a.picks[g.key]||[]).indexOf(opt) !== -1;
        html += '<button class="chip' + (on?" on":"") + '" data-opt="' + opt.replace(/"/g,"&quot;") + '">' + opt + '</button>';
      });
      html += '</div>';
    });
    (q.notes||[]).forEach(function(nt){
      html += '<div class="grouplabel">' + nt.label + '</div>' +
        '<textarea data-note="' + nt.key + '" placeholder="In your own words (optional)&hellip;">' +
        (a.notes[nt.key]||"").replace(/</g,"&lt;") + '</textarea>';
    });
    html +=
        '</div>' +
        '<div class="qnav">' +
          '<button class="btn quiet" id="backBtn">' + (i===0 ? "Close" : "Back") + '</button>' +
          '<span class="hint">Answers save automatically</span>' +
          '<button class="btn" id="nextBtn">' + (i===Q.length-1 ? "Finish" : "Next") + '</button>' +
        '</div>';
    qpopContent.innerHTML = html;
    qpopContent.scrollTop = 0;
    repop();

    qpopContent.querySelectorAll(".chips").forEach(function(chipsEl){
      var gkey = chipsEl.getAttribute("data-group");
      var g = q.groups.filter(function(x){return x.key===gkey;})[0];
      chipsEl.querySelectorAll(".chip").forEach(function(chip){
        chip.addEventListener("click", function(){
          var opt = chip.getAttribute("data-opt");
          var cur = a.picks[gkey] || [];
          if(g.type==="single"){
            a.picks[gkey] = (cur[0]===opt) ? [] : [opt];
            chipsEl.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("on"); });
            if(a.picks[gkey].length) chip.classList.add("on");
          } else {
            var ix = cur.indexOf(opt);
            if(ix===-1) cur.push(opt); else cur.splice(ix,1);
            a.picks[gkey] = cur;
            chip.classList.toggle("on");
          }
          save();
        });
      });
    });
    qpopContent.querySelectorAll("textarea").forEach(function(ta){
      ta.addEventListener("input", function(){
        a.notes[ta.getAttribute("data-note")] = ta.value; save();
      });
    });
    document.getElementById("backBtn").addEventListener("click", function(){
      if(i===0) closeModal(); else buildQuestion(i-1);
    });
    document.getElementById("nextBtn").addEventListener("click", function(){
      if(i===Q.length-1){ modalOpen = false; qmodal.hidden = true; go("answers"); }
      else buildQuestion(i+1);
    });
  }

  /* ---------------- Review ---------------- */
  function fmtAnswer(q){
    var a = state.answers[q.id];
    if(!a) return null;
    var parts = [];
    q.groups.forEach(function(g){
      var p = (a.picks[g.key]||[]);
      if(p.length) parts.push({lbl:g.label||null, txt:p.join(" · ")});
    });
    (q.notes||[]).forEach(function(nt){
      var t = (a.notes[nt.key]||"").trim();
      if(t) parts.push({lbl:nt.label, txt:t});
    });
    return parts.length ? parts : null;
  }
  function renderReview(){
    var n = answeredCount();
    var html = '<div class="review qwrap">' +
      '<h2 class="serif">Our Answers</h2>' +
      '<div class="rsub">' + (n===Q.length ? "All 20 answered — beautifully done." : n + " of 20 answered — tap any question to finish it.") + '</div>';
    Q.forEach(function(q, i){
      var parts = fmtAnswer(q);
      html += '<div class="ritem"><div class="rq"><span class="num">' + (i+1) + '.</span>' + q.title + '</div>';
      if(parts){
        parts.forEach(function(p){
          html += '<div class="ra">' + (p.lbl ? '<span class="lbl">' + p.lbl + '</span>' : '') + p.txt.replace(/</g,"&lt;") + '</div>';
        });
      } else {
        html += '<div class="ra unanswered">Not answered yet</div>';
      }
      html += '<button class="edit" data-qi="' + i + '">' + (parts ? "Edit" : "Answer") + '</button></div>';
    });
    html += '<div class="export-row">' +
      '<button class="btn gold" id="copyBtn">Copy answers for Claude</button>' +
      '<button class="btn quiet" id="dlBtn">Download JSON</button>' +
      '</div>' +
      '<p style="text-align:center;color:var(--muted);font-size:13.5px">Copy your answers and paste them back to Claude in the chat — they become the app’s founding configuration, and the locked rooms open.</p>' +
      '</div>';
    view.innerHTML = html;
    view.querySelectorAll(".edit").forEach(function(b){
      b.addEventListener("click", function(){
        openQuestion(parseInt(b.getAttribute("data-qi"),10));
      });
    });
    document.getElementById("copyBtn").addEventListener("click", function(){
      var md = buildMarkdown();
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(md).then(function(){ toast("Copied — paste it to Claude"); },
          function(){ fallbackCopy(md); });
      } else fallbackCopy(md);
    });
    document.getElementById("dlBtn").addEventListener("click", function(){
      var blob = new Blob([JSON.stringify({couple:"John & Emma", exported:new Date().toISOString(), answers:state.answers}, null, 2)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var aEl = document.createElement("a");
      aEl.href = url; aEl.download = "john-emma-wedding-answers.json";
      document.body.appendChild(aEl); aEl.click(); aEl.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast("Downloaded");
    });
  }
  function fallbackCopy(text){
    var ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Copied — paste it to Claude"); }
    catch(e){ toast("Couldn’t copy — use Download instead"); }
    ta.remove();
  }
  function buildMarkdown(){
    var out = "# John & Emma — Answers to the 20 Questions\n\n";
    Q.forEach(function(q, i){
      out += "## " + (i+1) + ". " + q.title + "\n";
      var parts = fmtAnswer(q);
      if(parts){
        parts.forEach(function(p){ out += "- " + (p.lbl ? "**" + p.lbl + ":** " : "") + p.txt + "\n"; });
      } else {
        out += "- (not answered)\n";
      }
      out += "\n";
    });
    return out;
  }
  function toast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg; t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 2600);
  }

  render();
})();
</script>

</body>
</html>
