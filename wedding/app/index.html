<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>John &amp; Emma's Wedding</title>
<meta name="description" content="John &amp; Emma's wedding planner.">
<meta name="theme-color" content="#FBF7F0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B18" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="J &amp; E">
</head>
<body>
<style>
  :root{
    --paper:#FBF7F0; --panel:#FFFFFF; --ink:#2C2824; --muted:#7B7164;
    --gold:#AE8A54; --gold-deep:#8F6E3D; --gold-soft:#EFE3CC; --sage:#4C5F51;
    --blush:#D9B2A4; --line:#E6DCCB; --line-soft:#EFE8DA;
    --ok:#4C6B52; --warn:#A5762E; --crit:#9C4A3C;
    --shadow:0 10px 30px rgba(96,78,50,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#171B18; --panel:#1F251F; --ink:#EDE6D6; --muted:#9C927E;
      --gold:#C9A96E; --gold-deep:#DBBE85; --gold-soft:#3A3324; --sage:#93AC97;
      --blush:#C08D7C; --line:#39413A; --line-soft:#2A302A;
      --ok:#8FB896; --warn:#D8AE64; --crit:#D9897A;
      --shadow:0 10px 30px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#171B18; --panel:#1F251F; --ink:#EDE6D6; --muted:#9C927E;
    --gold:#C9A96E; --gold-deep:#DBBE85; --gold-soft:#3A3324; --sage:#93AC97;
    --blush:#C08D7C; --line:#39413A; --line-soft:#2A302A;
    --ok:#8FB896; --warn:#D8AE64; --crit:#D9897A;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  :root[data-theme="light"]{
    --paper:#FBF7F0; --panel:#FFFFFF; --ink:#2C2824; --muted:#7B7164;
    --gold:#AE8A54; --gold-deep:#8F6E3D; --gold-soft:#EFE3CC; --sage:#4C5F51;
    --blush:#D9B2A4; --line:#E6DCCB; --line-soft:#EFE8DA;
    --ok:#4C6B52; --warn:#A5762E; --crit:#9C4A3C;
    --shadow:0 10px 30px rgba(96,78,50,.10);
  }

  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--paper); color:var(--ink);
    font-family:"Optima","Candara","Gill Sans","Gill Sans MT","Segoe UI",system-ui,sans-serif;
    font-size:16.5px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior-y:none;
  }
  button,.chip,.tab{-webkit-user-select:none; user-select:none; touch-action:manipulation}
  .serif{font-family:"Didot","Bodoni MT","Bodoni 72","Playfair Display",Georgia,serif}
  .script{font-family:"Snell Roundhand","Savoye LET","Segoe Script","Brush Script MT",cursive}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- Intro ---------- */
  #intro{position:fixed; inset:0; z-index:100; background:var(--paper);
    display:flex; align-items:center; justify-content:center; cursor:pointer}
  #intro.done{display:none}
  #intro.leaving{animation:introOut 1.1s ease forwards}
  @keyframes introOut{to{opacity:0; visibility:hidden}}
  .intro-frame{position:absolute;
    top:calc(18px + env(safe-area-inset-top)); right:calc(18px + env(safe-area-inset-right));
    bottom:calc(18px + env(safe-area-inset-bottom)); left:calc(18px + env(safe-area-inset-left));
    border:1px solid var(--gold); opacity:0; animation:fadeIn 1.2s ease .1s forwards; pointer-events:none}
  .intro-frame::after{content:""; position:absolute; inset:6px; border:1px solid var(--line)}
  .intro-inner{text-align:center; padding:0 24px; max-width:900px}
  .intro-eyebrow{font-size:12px; letter-spacing:.42em; text-transform:uppercase; color:var(--gold-deep);
    opacity:0; animation:fadeIn 1s ease .5s forwards}
  .intro-names{display:flex; align-items:baseline; justify-content:center; gap:.18em;
    margin:18px 0 6px; font-size:clamp(44px,9vw,96px); line-height:1.05; letter-spacing:.02em}
  .intro-names .n{opacity:0}
  .intro-names .john{animation:fromLeft 1.5s cubic-bezier(.2,.7,.2,1) .7s forwards}
  .intro-names .emma{animation:fromRight 1.5s cubic-bezier(.2,.7,.2,1) .7s forwards}
  .intro-names .amp{font-size:.72em; color:var(--gold); opacity:0; padding:0 .12em;
    animation:ampIn 1s ease 1.9s forwards}
  @keyframes fromLeft{from{opacity:0; transform:translateX(-46vw)} 60%{opacity:1} to{opacity:1; transform:none}}
  @keyframes fromRight{from{opacity:0; transform:translateX(46vw)} 60%{opacity:1} to{opacity:1; transform:none}}
  @keyframes ampIn{from{opacity:0; transform:scale(.6)} to{opacity:1; transform:scale(1)}}
  @keyframes fadeIn{to{opacity:1}}
  .intro-figures{height:132px; margin:16px auto 6px; position:relative; width:188px}
  .intro-figures svg{position:absolute; bottom:6px; opacity:0}
  .fig-john{left:0; z-index:1; animation:figLeft 1.9s cubic-bezier(.25,.7,.25,1) 1s forwards}
  .fig-emma{right:0; animation:figRight 1.9s cubic-bezier(.25,.7,.25,1) 1s forwards}
  @keyframes figLeft{from{opacity:0; transform:translateX(-44vw)} 40%{opacity:1} to{opacity:1; transform:none}}
  @keyframes figRight{from{opacity:0; transform:translateX(44vw)} 40%{opacity:1} to{opacity:1; transform:none}}
  .intro-heart{position:absolute; left:50%; top:-4px; transform:translateX(-50%) scale(.5);
    color:var(--blush); font-size:20px; opacity:0; animation:ampIn .8s ease 2.7s forwards; z-index:2}
  .intro-tag{font-size:15px; color:var(--muted); letter-spacing:.16em; text-transform:uppercase;
    opacity:0; animation:fadeIn 1.2s ease 2.9s forwards}
  .intro-skip{position:absolute; bottom:34px; left:0; right:0; text-align:center;
    font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted);
    opacity:0; animation:fadeIn 1s ease 3.4s forwards}
  @media (prefers-reduced-motion: reduce){
    #intro *, #intro{animation-duration:.01s !important; animation-delay:0s !important}
    #intro.leaving{animation:introOut .3s ease forwards}
  }

  /* ---------- Shell ---------- */
  #app{opacity:0; transition:opacity .9s ease}
  #app.visible{opacity:1}
  .shell{max-width:920px; margin:0 auto;
    padding:calc(24px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
            calc(80px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left))}
  .masthead{text-align:center; padding:20px 0 6px; border-bottom:1px solid var(--line); position:relative}
  .masthead .eyebrow{font-size:11px; letter-spacing:.4em; text-transform:uppercase; color:var(--gold-deep)}
  .masthead h1{font-size:clamp(30px,5.5vw,46px); font-weight:500; letter-spacing:.02em; margin:8px 0 2px}
  .masthead h1 .amp{color:var(--gold); font-size:.75em}
  .masthead .sub{color:var(--muted); font-size:12.5px; letter-spacing:.2em; text-transform:uppercase; margin-bottom:14px}
  .theme-btn{position:absolute; right:0; top:4px; background:none; border:1px solid var(--line);
    border-radius:999px; width:36px; height:36px; cursor:pointer; color:var(--muted); font-size:14px}
  .theme-btn:hover{border-color:var(--gold)}
  nav.tabs{display:flex; justify-content:center; gap:2px; flex-wrap:wrap; padding:10px 0 0}
  .tab{background:none; border:none; cursor:pointer; color:var(--muted); font:inherit;
    font-size:12px; letter-spacing:.16em; text-transform:uppercase; padding:7px 11px 9px;
    border-bottom:2px solid transparent}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--ink); border-bottom-color:var(--gold)}
  .tab:focus-visible,button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px}
  main{padding-top:28px}
  footer{margin-top:60px; text-align:center; color:var(--muted); font-size:11px;
    letter-spacing:.24em; text-transform:uppercase}
  footer .amp{color:var(--gold)}

  /* ---------- Common ---------- */
  h2.sec{font-size:26px; font-weight:500; margin-bottom:6px}
  h3.sub{font-size:19px; font-weight:500; margin:26px 0 10px}
  p.lede{color:var(--muted); margin-bottom:22px; max-width:62ch}
  .eyebrow-sm{font-size:10.5px; letter-spacing:.3em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:8px}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:20px 20px; box-shadow:var(--shadow)}
  .cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px}
  .btn{display:inline-block; background:var(--sage); color:#FBF7F0; border:none; cursor:pointer;
    font:inherit; font-size:13.5px; letter-spacing:.14em; text-transform:uppercase;
    padding:12px 22px; border-radius:2px}
  .btn:hover{filter:brightness(1.08)}
  .btn.gold{background:var(--gold); color:#fff}
  :root[data-theme="dark"] .btn,:root[data-theme="dark"] .btn.gold{color:#14170f}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#14170f}}
  .btn.quiet{background:none; color:var(--ink); border:1px solid var(--line)}
  .btn.quiet:hover{border-color:var(--gold)}
  .btn.sm{font-size:12px; padding:8px 14px}
  .pill{display:inline-block; font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    border:1px solid var(--line); border-radius:999px; padding:4px 10px; color:var(--muted)}
  .pill.gold{border-color:var(--gold); color:var(--gold-deep); background:var(--gold-soft)}
  .pill.ok{border-color:var(--ok); color:var(--ok)}
  .pill.warn{border-color:var(--warn); color:var(--warn)}
  .pill.crit{border-color:var(--crit); color:var(--crit)}
  .note{border-left:2px solid var(--gold-soft); padding-left:12px; color:var(--muted); font-size:14px}
  .tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
  table{border-collapse:collapse; width:100%; min-width:460px; font-size:14.5px}
  th,td{text-align:left; padding:10px 12px; border-bottom:1px solid var(--line-soft)}
  th{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); font-weight:600}
  td.r,th.r{text-align:right}
  tr.total td{border-top:1px solid var(--gold); border-bottom:none; font-weight:600; padding-top:14px}
  input[type=text],input[type=email],input[type=number],select,textarea{
    background:var(--paper); border:1px solid var(--line); border-radius:3px;
    padding:9px 10px; font:inherit; font-size:14.5px; color:var(--ink); width:100%}
  label.fld{display:block; font-size:10.5px; letter-spacing:.2em; text-transform:uppercase;
    color:var(--muted); margin:0 0 4px}
  .row{display:grid; gap:10px}
  .row.two{grid-template-columns:1fr 1fr}
  .row.three{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--paper); font-size:13.5px; padding:11px 22px;
    border-radius:999px; opacity:0; pointer-events:none; transition:opacity .3s ease; z-index:80}
  .toast.show{opacity:1}

  /* stat tiles */
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:24px}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px 16px;
    box-shadow:var(--shadow)}
  .stat .k{font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted)}
  .stat .v{font-size:27px; font-weight:500; margin-top:5px; line-height:1.1}
  .stat .v small{font-size:14px; color:var(--muted)}
  .stat .d{font-size:12.5px; color:var(--muted); margin-top:3px}
  .stat.hero{border-color:var(--gold)}

  /* install banner */
  .install{display:none; align-items:flex-start; gap:14px; border:1px solid var(--gold);
    border-radius:4px; background:var(--gold-soft); padding:14px 16px; margin-bottom:22px}
  .install.show{display:flex}
  .install .ic{font-size:18px; color:var(--gold-deep)}
  .install .txt{flex:1; font-size:14px}
  .install .txt b{display:block; font-size:15px; margin-bottom:2px}
  .install .dismiss{background:none; border:none; cursor:pointer; color:var(--muted); font-size:15px}
  #installNow{background:var(--gold); color:#fff; border:none; border-radius:2px; cursor:pointer;
    font:inherit; font-size:12px; letter-spacing:.14em; text-transform:uppercase;
    padding:8px 14px; margin-top:9px; display:none}
  #installNow.show{display:inline-block}

  /* controls */
  .controls{background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:18px; box-shadow:var(--shadow); margin-bottom:22px}
  .ctl{margin-bottom:16px}
  .ctl:last-child{margin-bottom:0}
  .ctl .lab{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px}
  .ctl .lab span:first-child{font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--muted)}
  .ctl .lab span:last-child{font-size:15px; font-weight:600}
  input[type=range]{width:100%; accent-color:var(--gold)}
  .segs{display:flex; flex-wrap:wrap; gap:7px}
  .seg{background:none; border:1px solid var(--line); border-radius:999px; cursor:pointer;
    font:inherit; font-size:13.5px; color:var(--ink); padding:8px 14px}
  .seg:hover{border-color:var(--gold)}
  .seg.on{background:var(--gold-soft); border-color:var(--gold)}

  /* levers */
  .lever{display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-bottom:1px solid var(--line-soft); padding:12px 2px}
  .lever .lt{font-size:14.5px}
  .lever .lt small{display:block; color:var(--muted); font-size:12.5px}
  .lever .save{font-size:15px; font-weight:600; color:var(--ok); white-space:nowrap}

  /* venue cards */
  .venue{background:var(--panel); border:1px solid var(--line); border-radius:4px;
    padding:18px; box-shadow:var(--shadow); margin-bottom:14px}
  .venue.pick{border-color:var(--gold)}
  .venue h4{font-size:19px; font-weight:500; margin-bottom:2px}
  .venue .where{font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-deep); margin-bottom:9px}
  .venue .facts{display:flex; flex-wrap:wrap; gap:7px; margin:10px 0}
  .venue .why{font-size:14px; color:var(--muted)}
  .venue .est{font-size:15px; margin-top:9px}
  .venue .est b{font-weight:600}

  /* checklist */
  .phase{margin-bottom:26px}
  .phase .ph{display:flex; align-items:baseline; gap:10px; border-bottom:1px solid var(--gold-soft);
    padding-bottom:7px; margin-bottom:4px}
  .phase .ph b{font-size:17px; font-weight:500}
  .phase .ph span{font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--muted)}
  .task{display:flex; gap:11px; align-items:flex-start; padding:10px 2px; border-bottom:1px solid var(--line-soft)}
  .task input{margin-top:4px; width:17px; height:17px; accent-color:var(--sage); flex:none}
  .task .tt{flex:1; font-size:14.5px}
  .task .tt small{display:block; color:var(--muted); font-size:12.5px}
  .task.done .tt{color:var(--muted); text-decoration:line-through}
  .task .by{font-size:11.5px; color:var(--muted); white-space:nowrap; padding-top:2px}

  /* guests */
  .guestrow{display:grid; grid-template-columns:1fr auto; gap:10px; align-items:center;
    padding:11px 2px; border-bottom:1px solid var(--line-soft)}
  .guestrow .gname{font-size:15px}
  .guestrow .gmeta{font-size:12.5px; color:var(--muted)}
  .rsvpsel{width:auto; min-width:112px; font-size:13px; padding:6px 8px}
  .del{background:none; border:none; cursor:pointer; color:var(--muted); font-size:15px; padding:2px 5px}
  .del:hover{color:var(--crit)}
  .addbox{background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:16px; margin-bottom:20px}

  /* question popup */
  .qmodal{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
    padding:16px; background:rgba(24,20,14,.48); backdrop-filter:blur(3px); animation:modalFade .35s ease}
  .qmodal[hidden]{display:none}
  @keyframes modalFade{from{opacity:0} to{opacity:1}}
  .qpop{position:relative; width:min(640px,96vw); max-height:90vh; display:flex; flex-direction:column;
    background:var(--panel); border:1px solid var(--gold); border-radius:4px;
    box-shadow:0 30px 90px rgba(20,14,6,.45); animation:popIn .5s cubic-bezier(.2,.85,.3,1)}
  @keyframes popIn{from{opacity:0; transform:scale(.9) translateY(22px)} to{opacity:1; transform:none}}
  .qpop::before{content:""; position:absolute; inset:7px; border:1px solid var(--line); pointer-events:none; z-index:1}
  .qpop .corner{position:absolute; color:var(--gold); font-size:15px; z-index:2; pointer-events:none}
  .c-tl{top:13px; left:15px} .c-tr{top:13px; right:15px; transform:scaleX(-1)}
  .c-bl{bottom:13px; left:15px; transform:scaleY(-1)} .c-br{bottom:13px; right:15px; transform:scale(-1,-1)}
  .qpop-scroll{overflow-y:auto; padding:34px 32px 26px}
  .qclose{position:absolute; top:14px; right:18px; z-index:3; background:var(--panel); border:none;
    cursor:pointer; color:var(--muted); font-size:17px; padding:4px 6px}
  .qpop .seal{width:44px; height:44px; border:1px solid var(--gold); border-radius:50%;
    display:flex; align-items:center; justify-content:center; margin:0 auto 12px;
    color:var(--gold); font-size:23px; background:var(--paper)}
  .qpop .qcount{text-align:center; font-size:11px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--gold-deep); margin-bottom:6px}
  .qpop .qcount .orn{color:var(--blush); letter-spacing:0; margin:0 9px}
  .qbar{display:flex; align-items:center; gap:12px; margin:14px 0 20px}
  .qbar .rail{flex:1; height:2px; background:var(--line); position:relative}
  .qbar .rail i{position:absolute; inset:0 auto 0 0; background:var(--gold); transition:width .4s ease}
  .qsection{font-size:11px; letter-spacing:.32em; text-transform:uppercase; color:var(--gold-deep);
    text-align:center; margin-bottom:11px}
  .qtitle{font-size:clamp(21px,3.3vw,27px); font-weight:500; line-height:1.3; text-align:center;
    text-wrap:balance; margin-bottom:10px}
  .qcontext{color:var(--muted); font-size:14px; margin-bottom:20px;
    border-left:2px solid var(--gold-soft); padding-left:12px}
  .grouplabel{font-size:11.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--muted); margin:16px 0 9px}
  .chips{display:flex; flex-wrap:wrap; gap:8px}
  .chip{background:none; border:1px solid var(--line); border-radius:999px; cursor:pointer;
    font:inherit; font-size:14.5px; color:var(--ink); padding:9px 15px}
  .chip:hover{border-color:var(--gold)}
  .chip.on{background:var(--gold-soft); border-color:var(--gold)}
  .chip.on::before{content:"✓ "; color:var(--gold-deep)}
  .qnav{display:flex; justify-content:space-between; align-items:center; margin-top:24px}
  .qnav .hint{font-size:12px; color:var(--muted)}
  @media (prefers-reduced-motion: reduce){.qmodal,.qpop{animation:none !important}}

  /* review */
  .ritem{border-bottom:1px solid var(--line-soft); padding:15px 2px}
  .ritem .rq{font-size:15.5px; font-weight:600}
  .ritem .rq .n{color:var(--gold-deep); font-weight:400; margin-right:7px}
  .ritem .ra{margin-top:4px; font-size:14.5px}
  .ritem .ra .lbl{color:var(--muted); font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; margin-right:6px}
  .ritem .un{color:var(--blush); font-style:italic}
  .ritem .edit{background:none; border:none; cursor:pointer; color:var(--gold-deep); font:inherit;
    font-size:13px; text-decoration:underline; padding:0; margin-top:5px}

  /* ---- catalog ---- */
  .catgroup{margin-bottom:26px}
  .catgroup .ch{display:flex; align-items:baseline; justify-content:space-between; gap:10px;
    border-bottom:1px solid var(--gold-soft); padding-bottom:7px; margin-bottom:6px}
  .catgroup .ch b{font-size:17px; font-weight:500}
  .catgroup .ch span{font-size:13px; color:var(--gold-deep); font-variant-numeric:tabular-nums}
  .item{padding:12px 2px; border-bottom:1px solid var(--line-soft)}
  .item .top{display:flex; align-items:baseline; justify-content:space-between; gap:10px}
  .item .nm{font-size:15.5px}
  .item .nm small{display:block; color:var(--muted); font-size:12.5px; margin-top:2px}
  .item .amt{font-size:15.5px; font-weight:600; white-space:nowrap; font-variant-numeric:tabular-nums}
  .item.off .nm,.item.off .amt{color:var(--muted)}
  .item .opts{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
  .opt{background:none; border:1px solid var(--line); border-radius:999px; cursor:pointer;
    font:inherit; font-size:13px; color:var(--ink); padding:6px 12px; line-height:1.3}
  .opt:hover{border-color:var(--gold)}
  .opt.on{background:var(--gold-soft); border-color:var(--gold); font-weight:600}

  /* ================= MONEY, QUOTES & CUSTOM LINES ================= */
  function money(n){
    n = Math.round(n);

    return (neg ? "−$" : "$") + n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");

  /* all groups, including any the couple invented */
  function allGroups(){
    var gs = CATALOG.map(function(g){ return g.grp; });
    (state.customItems || []).forEach(function(it){
      if(gs.indexOf(it.grp) === -1) gs.push(it.grp);

    return gs;
  }
  /* built-in items for a group plus the couple's own */
  function itemsOf(grp){
    var base = [];
    CATALOG.forEach(function(g){ if(g.grp === grp) base = base.concat(g.items); });
    return base.concat((state.customItems || []).filter(function(it){ return it.grp === grp; }));
  }
  function allItems(){
    var out = [];
    allGroups().forEach(function(g){ out = out.concat(itemsOf(g)); });
    return out;
  }
  /* an item's options: built-in plus any the couple added */
  function optsOf(item){
    return (item.opts || []).concat((state.customOpts && state.customOpts[item.id]) || []);
  }
  function itemById(id){
    var all = allItems();
    for(var i=0;i<all.length;i++) if(all[i].id === id) return all[i];
    return null;
  }
  function pickOf(id){
    var v = state.picks[id];
    return (v === undefined || v === null) ? 0 : v;
  }
  function optOf(id){
    var it = itemById(id); if(!it) return null;
    var o = optsOf(it);
    return o[pickOf(id)] || o[0] || null;
  }
  /* quotes */
  function quotesFor(id){ return (state.quotes && state.quotes[id]) || []; }
  function acceptedQuote(id){
    var i = state.useQuote ? state.useQuote[id] : null;
    if(i === undefined || i === null) return null;
    var arr = quotesFor(id);
    return arr[i] || null;
  }
  function estimateOf(item, guests){
    var o = optsOf(item)[pickOf(item.id)];
    if(!o) return 0;
    if(item.unit === "guest") return o.p * guests;
    if(item.unit === "per50") return o.p * Math.max(1, Math.ceil(guests/50));
    return o.p;
  }
  /* a real quote always beats the estimate */
  function lineTotal(item, guests){
    var q = acceptedQuote(item.id);
    if(q) return q.unit === "guest" ? q.amt * guests
         : q.unit === "per50" ? q.amt * Math.max(1, Math.ceil(guests/50))
         : q.amt;
    return estimateOf(item, guests);
  }
  function computeTotal(guests){
    var sub = 0, quoted = 0, estimated = 0, byGrp = {};
    allGroups().forEach(function(grp){
      var s = 0;
      itemsOf(grp).forEach(function(it){
        var v = lineTotal(it, guests);
        s += v;
        if(acceptedQuote(it.id)) quoted += v; else estimated += v;
      });
      byGrp[grp] = s; sub += s;
    });
    var cont = sub * CONTINGENCY[state.plan.cont];
    return {sub:sub, cont:cont, total:sub + cont, byGrp:byGrp,
            quoted:quoted, estimated:estimated};
  }
  /* ---- cash contributions from family ---- */

    return (state.funds||[]).reduce(function(a,f){ return a + (+f.amt||0); }, 0);

  function fundsReceived(){

    var tent = opt("tent"), loo = opt("loo"), park = opt("park");
    if(tent && tent.cap && tent.cap < g)

      var t = ((their.picks||{})[it.id] === undefined ? 0 : their.picks[it.id]);
      var mq = savedUQ && savedUQ[it.id] !== undefined && savedQ[it.id]
             ? savedQ[it.id][savedUQ[it.id]] : null;
      var tq = their.useQuote && their.useQuote[it.id] !== undefined && their.quotes
             ? (their.quotes[it.id]||[])[their.useQuote[it.id]] : null;
      var mineLbl = mq ? (mq.who || "quote") + " " + money(mq.amt) : (o[m]||{l:"?"}).l;
      var theirLbl = tq ? (tq.who || "quote") + " " + money(tq.amt) : (o[t]||{l:"?"}).l;
      if(mineLbl !== theirLbl) itemDiffs.push({nm:it.nm, mine:mineLbl, theirs:theirLbl});
    });
    state.picks = savedPicks; state.plan = savedPlan; state.guests = savedGuests;
    state.quotes = savedQ; state.useQuote = savedUQ;

    (their.guests||[]).forEach(function(g){ theirKeys[guestKey(g)] = g; });
    var onlyTheirs = Object.keys(theirKeys).filter(function(k){ return !mineKeys[k]; })
      .map(function(k){ return theirKeys[k]; });
    var onlyMine = Object.keys(mineKeys).filter(function(k){ return !theirKeys[k]; })
      .map(function(k){ return mineKeys[k]; });
    return {mineTotal:mineTotal, theirTotal:theirTotal, mineGuests:g1, theirGuests:theirGuests,
            itemDiffs:itemDiffs, onlyTheirs:onlyTheirs, onlyMine:onlyMine,

  /* quotes and custom lines are facts, not preferences — combine both sides */
  function mergeCatalog(their){
    var addedQ = 0, addedI = 0, addedO = 0, addedF = 0;
    (their.funds || []).forEach(function(f){
      var dup = (state.funds||[]).some(function(x){
        return x.amt === f.amt && (x.who||"") === (f.who||"");
      });
      if(!dup){ state.funds.push(f); addedF++; }
    });
    var tq = their.quotes || {};
    Object.keys(tq).forEach(function(id){
      state.quotes[id] = state.quotes[id] || [];
      tq[id].forEach(function(q){
        var dup = state.quotes[id].some(function(x){
          return x.amt === q.amt && (x.who||"") === (q.who||"") && (x.unit||"total") === (q.unit||"total");
        });
        if(!dup){ state.quotes[id].push(q); addedQ++; }
      });
    });
    /* point each item at their accepted quote, matched by value not index */
    var tu = their.useQuote || {};
    Object.keys(tu).forEach(function(id){
      var want = (tq[id]||[])[tu[id]];
      if(!want) return;
      var i = (state.quotes[id]||[]).findIndex(function(x){
        return x.amt === want.amt && (x.who||"") === (want.who||"") &&
               (x.unit||"total") === (want.unit||"total");
      });
      if(i !== -1) state.useQuote[id] = i;
    });
    var to = their.customOpts || {};
    Object.keys(to).forEach(function(id){
      state.customOpts[id] = state.customOpts[id] || [];
      to[id].forEach(function(o){
        var dup = state.customOpts[id].some(function(x){ return x.l === o.l && x.p === o.p; });
        if(!dup){ state.customOpts[id].push(o); addedO++; }
      });
    });
    (their.customItems || []).forEach(function(it){
      var dup = state.customItems.some(function(x){
        return x.id === it.id || (x.nm === it.nm && x.grp === it.grp);
      });
      if(!dup){ state.customItems.push(it); addedI++; }
    });
    return {quotes:addedQ, items:addedI, opts:addedO, funds:addedF};

  function groupHtml(grp, g, wmap){

          '+ Add your own line</button>') +
      '</div>';

  function itemHtml(it, g, wmap){
    var opts = optsOf(it), pick = pickOf(it.id);
    var q = acceptedQuote(it.id), amt = lineTotal(it, g), est = estimateOf(it, g);
    var qs = quotesFor(it.id);
    var unitNote = "";
    if(!q){
      var o = opts[pick] || {p:0};
      unitNote = it.unit === "guest" ? (o.p ? money(o.p) + " × " + g + " guests" : "")
               : it.unit === "per50" ? (o.p ? money(o.p) + " × " + Math.max(1,Math.ceil(g/50)) +
                   " staff" : "") : "";
    } else {
      unitNote = q.unit === "guest" ? money(q.amt) + " × " + g + " guests, quoted"
               : q.unit === "per50" ? money(q.amt) + " × " + Math.max(1,Math.ceil(g/50)) + ", quoted"
               : "quoted";
    }
    var delta = q ? amt - est : 0;
    return '<div class="item' + (amt === 0 ? " off" : "") + '">' +
      '<div class="top"><span class="nm">' + esc(it.nm) +
        (it.custom ? ' <span class="pill" style="font-size:9.5px; padding:2px 7px">yours</span>' : '') +
        (q ? ' <span class="pill ok" style="font-size:9.5px; padding:2px 7px">quoted</span>' : '') +
        (it.note ? '<small>' + it.note + '</small>' : '') +
        (unitNote ? '<small>' + unitNote + '</small>' : '') +
        (q && delta !== 0 ? '<small style="color:' + (delta>0?'var(--crit)':'var(--ok)') + '">' +
          (delta>0 ? "+" : "") + money(delta) + ' vs the estimate of ' + money(est) + '</small>' : '') +
      '</span><span class="amt">' + (amt ? money(amt) : "—") + '</span></div>' +

      '<div class="opts" data-item="' + esc(it.id) + '">' +
        opts.map(function(op,i){
          return '<button class="opt' + (i===pick && !q ? ' on' : '') + '" data-oi="' + i + '">' +
            esc(op.l) + '<span class="p">' + (op.p ? money(op.p) +
            (it.unit==="guest"?"/g":it.unit==="per50"?" ea":"") : "$0") + '</span>' +
            (op.custom ? '</button><button class="opt" data-delopt="' + esc(it.id) + ':' + i +
              '" title="Remove this option" style="padding:6px 9px">✕' : '') +
            '</button>';
        }).join("") +
        '<button class="opt" data-addopt="' + esc(it.id) + '" style="border-style:dashed">+ option</button>' +
        (it.custom ? '<button class="opt" data-delitem="' + esc(it.id) +
          '" style="border-style:dashed">✕ remove line</button>' : '') +
      '</div>' +

      (openForm && openForm.type === "opt" && openForm.id === it.id ? optFormHtml(it) : "") +

      (qs.length
        ? '<div style="margin-top:10px">' + qs.map(function(qq,i){
            var using = (state.useQuote[it.id] === i);
            return '<div class="grow" style="border-bottom:none; padding:6px 0">' +
              '<span class="gn2">' + esc(qq.who || "Quote") + '<small>' + money(qq.amt) +
                (qq.unit === "guest" ? " per guest" : qq.unit === "per50" ? " each" : " total") +
                (qq.note ? ' · ' + esc(qq.note) : '') + '</small></span>' +
              '<button class="mv' + (using?' in':'') + '" data-usequote="' + esc(it.id) + ':' + i + '">' +
                (using ? "In use" : "Use this") + '</button>' +
              '<button class="del" data-delquote="' + esc(it.id) + ':' + i + '">✕</button></div>';
          }).join("") + '</div>'
        : "") +

      (openForm && openForm.type === "quote" && openForm.id === it.id
        ? quoteFormHtml(it)
        : '<button class="mv" data-addquote="' + esc(it.id) + '" style="margin-top:9px">' +
          (qs.length ? "+ Another quote" : "+ Enter a real quote") + '</button>') +

      (wmap[it.id] ? '<div class="warn-row"><span class="wi">▲</span><span>' + wmap[it.id] +
        '</span></div>' : "") +
    '</div>';
  }

  function redrawBudget(){
    var y = window.scrollY;
    save(); renderBudget(); window.scrollTo(0, y);
  }
  function wireBudget(){
    /* option choice */
    Array.prototype.forEach.call(view.querySelectorAll("[data-item]"), function(box){
      var id = box.getAttribute("data-item");
      Array.prototype.forEach.call(box.querySelectorAll("[data-oi]"), function(b){
        b.addEventListener("click", function(){
          state.picks[id] = +b.getAttribute("data-oi");
          if(state.useQuote[id] !== undefined) delete state.useQuote[id];
          openForm = null; redrawBudget();
        });
      });
    });
    /* open forms */
    Array.prototype.forEach.call(view.querySelectorAll("[data-addopt]"), function(b){
      b.addEventListener("click", function(){
        openForm = {type:"opt", id:b.getAttribute("data-addopt")}; redrawBudget(); });
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-addquote]"), function(b){
      b.addEventListener("click", function(){
        openForm = {type:"quote", id:b.getAttribute("data-addquote")}; redrawBudget(); });
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-additem]"), function(b){
      b.addEventListener("click", function(){
        openForm = {type:"item", grp:b.getAttribute("data-additem")}; redrawBudget(); });
    });
    var cancel = document.getElementById("formCancel");
    if(cancel) cancel.addEventListener("click", function(){ openForm = null; redrawBudget(); });

    /* save a custom option */
    var optSave = document.getElementById("optSave");
    if(optSave) optSave.addEventListener("click", function(){
      var l = document.getElementById("optL").value.trim();
      var p = +document.getElementById("optP").value || 0;
      if(!l){ toast("Give the option a name"); return; }
      var id = openForm.id;
      state.customOpts[id] = state.customOpts[id] || [];
      state.customOpts[id].push({l:l, p:p, custom:true});
      var it = itemById(id);
      state.picks[id] = optsOf(it).length - 1;
      delete state.useQuote[id];
      openForm = null; redrawBudget(); toast("Option added and selected");
    });

    /* quote unit toggle */
    var qUnit = "total";
    Array.prototype.forEach.call(view.querySelectorAll("[data-qu]"), function(b){
      b.addEventListener("click", function(){
        qUnit = b.getAttribute("data-qu");
        Array.prototype.forEach.call(view.querySelectorAll("[data-qu]"), function(x){
          x.classList.remove("on"); });
        b.classList.add("on");
      });
    });
    var qSave = document.getElementById("qSave");
    if(qSave) qSave.addEventListener("click", function(){
      var amt = +document.getElementById("qAmt").value || 0;
      if(!amt){ toast("Enter the amount"); return; }
      var id = openForm.id;
      state.quotes[id] = state.quotes[id] || [];
      state.quotes[id].push({who:document.getElementById("qWho").value.trim(), amt:amt,
        unit:qUnit, note:document.getElementById("qNote").value.trim()});
      state.useQuote[id] = state.quotes[id].length - 1;
      openForm = null; redrawBudget(); toast("Quote saved and in use");
    });

    /* custom line */
    var niUnit = "flat";
    Array.prototype.forEach.call(view.querySelectorAll("[data-niu]"), function(b){
      b.addEventListener("click", function(){
        niUnit = b.getAttribute("data-niu");
        Array.prototype.forEach.call(view.querySelectorAll("[data-niu]"), function(x){
          x.classList.remove("on"); });
        b.classList.add("on");
      });
    });
    var niSave = document.getElementById("niSave");
    if(niSave) niSave.addEventListener("click", function(){
      var nm = document.getElementById("niNm").value.trim();
      if(!nm){ toast("Give the line a name"); return; }
      var p = +document.getElementById("niP").value || 0;
      var id = "c" + Date.now().toString(36) + Math.floor(Math.random()*1000).toString(36);
      state.customItems.push({id:id, grp:openForm.grp, nm:nm, custom:true, unit:niUnit,
        note:document.getElementById("niNote").value.trim(),

      });
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-delquote]"), function(b){
      b.addEventListener("click", function(){
        var parts = b.getAttribute("data-delquote").split(":");
        var id = parts[0], i = +parts[1];
        state.quotes[id].splice(i,1);
        if(state.useQuote[id] === i) delete state.useQuote[id];
        else if(state.useQuote[id] > i) state.useQuote[id]--;
        redrawBudget();
      });
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-delopt]"), function(b){
      b.addEventListener("click", function(e){

        var id = parts[0], i = +parts[1];
        var it = itemById(id), baseLen = (it.opts || []).length;

      b.addEventListener("click", function(){

    /* contributions */

        state.plan.cont = +b.getAttribute("data-cont"); redrawBudget(); });

  /* ================= GUESTS ================= */
  var RSVPS = ["No reply","Yes","No","Maybe"];
  function renderGuests(){
    var inv = state.guests.filter(function(g){ return g.status === "invited"; });
    var pool = state.guests.filter(function(g){ return g.status !== "invited"; });
    var g = activeGuests(), c = computeTotal(g);
    var perHead = c.total / g;
    /* marginal cost of one more guest, and of inviting the whole pool */
    var marginal = computeTotal(g + 1).total - c.total;
    var ph = poolHeads();
    var poolCost = ph === 0 ? 0
      : (invitedHeads() > 0 ? computeTotal(g + ph).total - c.total
                            : computeTotal(ph).total);
    var poolLabel = invitedHeads() > 0 ? "Adding the whole pool" : "If you invited the pool";
    var poolNote = invitedHeads() > 0 ? "on top of today's total" : "as a total at " + ph + " guests";

    function row(gst, idx){
      var isIn = gst.status === "invited";
      return '<div class="grow">' +
        '<span class="gn2">' + esc(gst.name) + '<small>' + (gst.heads||1) +
          (gst.heads>1?" heads":" head") + ' · ' + esc(gst.side||"Both") +
          (isIn ? ' · ' + esc(gst.rsvp||"No reply") : '') + '</small></span>' +
        (isIn ? '<select class="rsvpsel" data-rsvp="' + idx + '">' + RSVPS.map(function(r){
            return '<option' + ((gst.rsvp||"No reply")===r?" selected":"") + '>' + r + '</option>';
          }).join("") + '</select>' : "") +
        '<button class="mv' + (isIn?' in':'') + '" data-toggle="' + idx + '">' +
          (isIn ? "Remove" : "Invite") + '</button>' +
        '<button class="del" data-del="' + idx + '" aria-label="Delete">✕</button>' +
      '</div>';
    }

    view.innerHTML =
      '<h2 class="sec serif">Guests</h2>' +
      '<p class="lede">Everyone starts in the pool. Invite them and the budget moves — right now each ' +
      'extra guest adds about ' + money(marginal) + ', and crossing a tent or trailer size adds a step ' +
      'on top of that.</p>' +

      '<div class="stats">' +
        '<div class="stat hero"><div class="k">Invited</div><div class="v num">' + invitedHeads() +
          '</div><div class="d">' + inv.length + ' households</div></div>' +
        '<div class="stat"><div class="k">In the pool</div><div class="v num">' + poolHeads() +
          '</div><div class="d">' + pool.length + ' households waiting</div></div>' +
        '<div class="stat"><div class="k">Plan total</div><div class="v num">' + money(c.total) +
          '</div><div class="d">' + (usingPlanning() ? "using planning number " + g
            : money(marginal) + " per extra guest") + '</div></div>' +
        '<div class="stat"><div class="k">' + poolLabel + '</div><div class="v num">' +
          (ph === 0 ? "—" : (invitedHeads() > 0 ? "+" : "") + money(poolCost)) +
          '</div><div class="d">' + (ph === 0 ? "pool is empty" : poolNote) + '</div></div>' +
      '</div>' +

      '<div class="addbox"><div class="row three" style="margin-bottom:10px">' +
        '<div><label class="fld" for="gn">Name / household</label>' +
          '<input type="text" id="gn" placeholder="The Bianchi family"></div>' +
        '<div><label class="fld" for="gp">Heads</label>' +
          '<input type="number" id="gp" min="1" max="12" value="2"></div>' +
        '<div><label class="fld" for="gsi">Side</label><select id="gsi"><option>John</option>' +
          '<option>Emma</option><option>Both</option></select></div>' +
      '</div>' +
      '<div style="display:flex; gap:8px; flex-wrap:wrap">' +
        '<button class="btn sm quiet" id="addPool">Add to pool</button>' +
        '<button class="btn sm gold" id="addInv">Add &amp; invite</button></div></div>' +

      '<div class="gcols">' +
        '<div class="gcol"><div class="gh"><b>Invited</b><span>' + invitedHeads() + ' heads</span></div>' +
          (inv.length ? state.guests.map(function(gst,i){
            return gst.status === "invited" ? row(gst,i) : ""; }).join("")
            : '<div class="empty">Nobody invited yet. Invite from the pool and watch the total move.</div>') +
        '</div>' +
        '<div class="gcol"><div class="gh"><b>The pool</b><span>' + poolHeads() + ' heads</span></div>' +
          (pool.length ? state.guests.map(function(gst,i){
            return gst.status !== "invited" ? row(gst,i) : ""; }).join("")
            : '<div class="empty">Pool is empty. Add everyone you might invite — deciding later is the point.</div>') +
        '</div>' +
      '</div>';

    document.getElementById("addPool").addEventListener("click", function(){ addGuest("pool"); });
    document.getElementById("addInv").addEventListener("click", function(){ addGuest("invited"); });
    function addGuest(status){
      var n = document.getElementById("gn").value.trim();
      if(!n){ toast("Give them a name first"); return; }
      state.guests.push({name:n, heads:+document.getElementById("gp").value||1,
        side:document.getElementById("gsi").value, status:status, rsvp:"No reply"});
      save(); renderGuests(); toast(status === "invited" ? "Added and invited" : "Added to pool");
    }
    Array.prototype.forEach.call(view.querySelectorAll("[data-toggle]"), function(b){
      b.addEventListener("click", function(){
        var i = +b.getAttribute("data-toggle");
        state.guests[i].status = state.guests[i].status === "invited" ? "pool" : "invited";
        save(); renderGuests();
      });
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-del]"), function(b){
      b.addEventListener("click", function(){
        state.guests.splice(+b.getAttribute("data-del"),1); save(); renderGuests();
      });
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-rsvp]"), function(s){
      s.addEventListener("change", function(){
        state.guests[+s.getAttribute("data-rsvp")].rsvp = s.value; save(); renderGuests();
      });
    });
  }

  /* ================= PLAN ================= */
  function renderPlan(){
    var groups = {};
    TASKS.forEach(function(t,i){ (groups[phaseOf(t.m)] = groups[phaseOf(t.m)]||[]).push({t:t,i:i}); });
    var doneCount = TASKS.filter(function(_,i){ return state.done["t"+i]; }).length;
    view.innerHTML =
      '<h2 class="sec serif">Plan</h2>' +
      '<div class="controls"><div class="ctl">' +
        '<label class="fld" for="dsel">Wedding date</label><select id="dsel">' +
        DATES.map(function(d){ return '<option value="' + d.v + '"' +
          (state.plan.date===d.v?' selected':'') + '>' + d.l + ' — ' + d.note + '</option>'; }).join("") +
        '</select><div style="font-size:12.5px; color:var(--muted); margin-top:8px">Avoid: ' +

        var items = groups[ph];
        return '<div class="phase"><div class="ph"><b>' + ph + '</b><span>' +
          shortDate(taskDate(items[0].t.m)) + '</span></div>' +

            var d = state.done["t"+o.i];
            return '<label class="task' + (d?" done":"") + '">' +
              '<input type="checkbox" data-task="' + o.i + '"' + (d?" checked":"") + '>' +
              '<span class="tt">' + o.t.t + (o.t.d?'<small>' + o.t.d + '</small>':'') + '</span>' +
              '<span class="by">by ' + shortDate(taskDate(o.t.m)) + '</span></label>';
          }).join("") + '</div>';
      }).join("");
    document.getElementById("dsel").addEventListener("change", function(e){

    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-task]"), function(cb){
      cb.addEventListener("change", function(){
        var i = cb.getAttribute("data-task");
        if(cb.checked) state.done["t"+i] = true; else delete state.done["t"+i];
        save(); var y = window.scrollY; renderPlan(); window.scrollTo(0,y);
      });
    });
  }

      return state.vendors[v.c] && state.vendors[v.c].status === "Booked"; }).length;
    var g = activeGuests(), c = computeTotal(g);

    function linesFor(cat){

      '<h2 class="sec serif">Vendors &amp; Payments</h2>' +

            '<div style="font-size:17px">' + v.c + '</div><span class="' + cls + '">' + st + '</span></div>' +
          '<div style="font-size:12.5px; color:var(--muted); margin:4px 0 12px">Book by ' +

          (money_ ? '<div style="margin-bottom:12px">' + money_ + '</div>' : '') +
          '<div class="row two" style="margin-bottom:10px">' +

              '" value="' + esc(r.name||"") + '" placeholder="Name"></div>' +

              '</option>'; }).join("") + '</select>' +
          '<div style="margin-top:10px"><button class="mv" data-go="budget">Enter a quote in Budget</button></div>' +
          '</div>';
      }).join("");
    bindGo();
    function bindV(attr, field, rerender){

    wirePayments();

  /* ================= SYNC ================= */
  var pendingImport = null;
  function renderSync(){

        '<div class="segs whoseg" id="whoSegs">' +

            return '<button class="seg' + (state.who===n?' on':'') + '" data-who="' + n + '">' + n +

      '<h3 class="sub">Send yours</h3>' +
      '<div class="card" style="margin-bottom:22px">' +
        '<p style="color:var(--muted); font-size:14px; margin-bottom:10px">' +

          '<button class="btn sm quiet" id="dlFile">Download file</button></div>' +
        '<textarea class="synccode" id="codeOut" readonly>' + code + '</textarea>' +
        '<p style="color:var(--muted); font-size:12.5px; margin-top:8px">Text or email this to ' +
        other + '. It carries the whole plan — choices, guests, vendors, tasks.</p>' +
      '</div>' +

      '<h3 class="sub">Bring theirs in</h3>' +
      '<div class="card" style="margin-bottom:22px">' +
        '<label class="fld" for="codeIn">Paste their sync code</label>' +
        '<textarea class="synccode" id="codeIn" placeholder="Paste here…"></textarea>' +
        '<div style="display:flex; gap:9px; flex-wrap:wrap; margin-top:10px">' +
          '<button class="btn sm" id="loadCode">Compare</button>' +
          '<label class="btn sm quiet" style="cursor:pointer">Load a file' +
            '<input type="file" id="fileIn" accept=".json,application/json" style="display:none"></label>' +
        '</div>' +
      '</div>' +
      '<div id="diffArea"></div>';

    Array.prototype.forEach.call(view.querySelectorAll("[data-who]"), function(b){
      b.addEventListener("click", function(){
        state.who = b.getAttribute("data-who"); save(); renderSync();
      });
    });
    document.getElementById("copyCode").addEventListener("click", function(){
      var t = document.getElementById("codeOut");
      if(navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(t.value).then(function(){ toast("Copied — send it to " + other); },
          function(){ t.select(); document.execCommand("copy"); toast("Copied"); });
      else { t.select(); document.execCommand("copy"); toast("Copied"); }
    });
    document.getElementById("dlFile").addEventListener("click", function(){
      var blob = new Blob([JSON.stringify(snapshot(), null, 2)], {type:"application/json"});
      var url = URL.createObjectURL(blob), a = document.createElement("a");
      a.href = url;
      a.download = "wedding-" + (state.who || "plan").toLowerCase() + ".json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      toast("Downloaded");
    });
    document.getElementById("loadCode").addEventListener("click", function(){
      var v = document.getElementById("codeIn").value.trim();
      if(!v){ toast("Paste their code first"); return; }
      var snap = decodeSnap(v);
      if(!snap || !snap.picks){ toast("That code did not read — ask them to copy it again"); return; }
      pendingImport = snap; showDiff();
    });
    document.getElementById("fileIn").addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0];
      if(!f) return;
      var fr = new FileReader();
      fr.onload = function(){
        var snap = null;
        try{ snap = JSON.parse(fr.result); }catch(err){}
        if(!snap || !snap.picks){ toast("That file did not read"); return; }
        pendingImport = snap; showDiff();
      };
      fr.readAsText(f);
    });
    if(pendingImport) showDiff();
  }
  function showDiff(){
    var their = pendingImport, d = diffAgainst(their);
    var area = document.getElementById("diffArea");
    if(!area) return;
    area.innerHTML =
      '<h3 class="sub">' + (their.who || "Their") + ' plan vs yours</h3>' +
      '<div class="card" style="margin-bottom:14px">' +
        '<div class="diffrow head"><span></span><span>Yours</span><span>' +

          '</span><span class="theirs num">' + money(d.theirTotal) + '</span></div>' +
        '<div class="diffrow"><span>Guests priced</span><span class="mine num">' + d.mineGuests +
          '</span><span class="theirs num">' + d.theirGuests + '</span></div>' +
        '<div class="diffrow"><span>People on the books</span><span class="mine num">' +
          state.guests.length + '</span><span class="theirs num">' +
          ((their.guests||[]).length) + '</span></div>' +
        '<div class="diffrow"><span>Family contributions</span><span class="mine num">' +
          money(d.mineFunds) + '</span><span class="theirs num">' + money(d.theirFunds) +
          '</span></div>' +
      '</div>' +

      (d.itemDiffs.length
        ? '<div class="card" style="margin-bottom:14px">' +
          '<div class="eyebrow-sm">' + d.itemDiffs.length + ' choices differ</div>' +
          '<div class="diffrow head"><span></span><span>Yours</span><span>' +
            esc(their.who||"Theirs") + '</span></div>' +

  function fmtAnswer(q){
    var a = state.answers[q.id]; if(!a) return null;
    var parts = [];
    q.groups.forEach(function(gr){
      var p = (a.picks && a.picks[gr.key]) || [];
      if(p.length) parts.push({lbl:gr.label||null, txt:p.join(" · ")});
    });
    (q.notes||[]).forEach(function(nt){
      var t = ((a.notes && a.notes[nt.key])||"").trim();
      if(t) parts.push({lbl:nt.label, txt:t});
    });
    return parts.length ? parts : null;
  }

  /* ================= THE YARD (site plan) ================= */
  var selId = null, dragging = null;

  function siteItems(){ return state.site.items; }
  function siteById(id){
    var a = siteItems();
    for(var i=0;i<a.length;i++) if(a[i].id === id) return a[i];
    return null;
  }
  function overlaps(a, b){
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }
  function tentArea(){
    return siteItems().filter(function(i){ return i.t === "tent"; })
      .reduce(function(s,i){ return s + i.w * i.h; }, 0);
  }
  function fitReport(){
    var lot = state.site.lot, out = [];
    siteItems().forEach(function(i){
      if(i.fixed) return;
      if(i.x < 0 || i.y < 0 || i.x + i.w > lot.w || i.y + i.h > lot.h)
        out.push({bad:true, t:i.nm + " runs off the lot"});
    });
    var tents = siteItems().filter(function(i){ return i.t === "tent"; });
    var houses = siteItems().filter(function(i){ return i.t === "house"; });
    var trees = siteItems().filter(function(i){ return i.t === "tree"; });
    tents.forEach(function(tn){
      houses.forEach(function(h){
        if(overlaps(tn,h)) out.push({bad:true, t:tn.nm + " overlaps " + h.nm});
      });
      trees.forEach(function(tr){
        if(overlaps(tn,tr)) out.push({bad:true,
          t:tn.nm + " sits under canopy — no overhead clearance, and roots mean ballast not stakes"});
      });
      /* guy lines and stake lines need room around a frame tent */
      var pad = {x:tn.x-5, y:tn.y-5, w:tn.w+10, h:tn.h+10};
      if(pad.x < 0 || pad.y < 0 || pad.x+pad.w > lot.w || pad.y+pad.h > lot.h)
        out.push({bad:false, t:tn.nm + " has under 5 ft of clearance on one side — ask the tent company if that works"});
    });
    var gen = siteItems().filter(function(i){ return i.t === "gen"; })[0];
    if(gen && tents.length){
      var t0 = tents[0];
      var dx = Math.abs((gen.x+gen.w/2) - (t0.x+t0.w/2));
      var dy = Math.abs((gen.y+gen.h/2) - (t0.y+t0.h/2));
      if(Math.sqrt(dx*dx+dy*dy) < 40)
        out.push({bad:false, t:"The generator is close to the tent — put it 40 ft away or you will hear it all night"});
    }
    if(!siteItems().some(function(i){ return i.t === "loo"; }))
      out.push({bad:false, t:"No restroom trailer placed. You are on septic — it has to go somewhere reachable by truck"});
    if(!out.length) out.push({bad:false, ok:true, t:"Nothing collides. Take these numbers to the tent company."});
    return out;
  }

  function svgHtml(){
    var lot = state.site.lot;
    var photo = state.sitePhoto;
    /* on a photo the hairlines vanish, so draw the grid brighter and label it */
    var gcol = photo ? "rgba(255,255,255,.55)" : "var(--line)";
    var gw = photo ? 0.5 : 0.4;
    var step = lot.w > 320 ? 50 : lot.w > 160 ? 20 : 10;
    var g = "";
    if(state.site.gridOn){
      for(var x=step; x<lot.w; x+=step)
        g += '<line x1="' + x + '" y1="0" x2="' + x + '" y2="' + lot.h + '" stroke="' + gcol +
             '" stroke-width="' + gw + '"/>';
      for(var y=step; y<lot.h; y+=step)
        g += '<line x1="0" y1="' + y + '" x2="' + lot.w + '" y2="' + y + '" stroke="' + gcol +
             '" stroke-width="' + gw + '"/>';
    }
    var photoLayer = photo
      ? '<image href="' + photo + '" x="0" y="0" width="' + lot.w + '" height="' + lot.h +
        '" preserveAspectRatio="none" opacity="' + state.site.photoOpacity + '"/>'
      : "";

    var shapes = siteItems().map(function(i){
      var f = FILLS[i.fill] || FILLS.soft;
      var isSel = i.id === selId;
      var body = i.round
        ? '<ellipse cx="' + (i.x+i.w/2) + '" cy="' + (i.y+i.h/2) + '" rx="' + (i.w/2) +
          '" ry="' + (i.h/2) + '" fill="' + f.f + '" stroke="' + (isSel ? "var(--gold)" : f.s) +
          '" stroke-width="' + (isSel?1.6:0.8) + '" stroke-dasharray="' + f.d + '"/>'
        : '<rect x="' + i.x + '" y="' + i.y + '" width="' + i.w + '" height="' + i.h +
          '" rx="1" fill="' + f.f + '" stroke="' + (isSel ? "var(--gold)" : f.s) +
          '" stroke-width="' + (isSel?1.6:0.8) + '" stroke-dasharray="' + f.d + '"/>';
      var label = "";
      if(i.w >= 12 && i.h >= 6){
        var fs = Math.max(3.5, Math.min(6, i.w/7));
        /* outline the type so it reads over grass, gravel or roof alike */
        var ink = photo ? "#fff" : "var(--ink)";
        var halo = photo
          ? ' stroke="rgba(0,0,0,.65)" stroke-width="' + (fs*0.28) + '" paint-order="stroke"'
          : '';
        var sub = photo ? "#f0e8d8" : "var(--muted)";
        label = '<text x="' + (i.x+i.w/2) + '" y="' + (i.y+i.h/2) + '" text-anchor="middle" ' +
          'dominant-baseline="middle" font-size="' + fs + '" fill="' + ink + '"' + halo + '>' +
          esc(i.nm) + '</text>' +
          '<text x="' + (i.x+i.w/2) + '" y="' + (i.y+i.h/2+fs*0.95) + '" text-anchor="middle" ' +
          'dominant-baseline="middle" font-size="' + (fs*0.62) + '" fill="' + sub + '"' + halo + '>' +
          Math.round(i.w) + '×' + Math.round(i.h) + ' ft</text>';
      }
      return '<g class="sitem" data-sid="' + i.id + '" style="cursor:grab">' + body + label + '</g>';
    }).join("");

    /* a 20 ft scale bar */
    var sb = '<g>' +
      (photo ? '<rect x="1" y="' + (lot.h-11) + '" width="34" height="9" rx="1.5" ' +
        'fill="rgba(0,0,0,.5)"/>' : "") +
      '<line x1="4" y1="' + (lot.h-5) + '" x2="24" y2="' + (lot.h-5) + '" stroke="' +
        (photo ? "#fff" : "var(--muted)") + '" stroke-width=".8"/>' +
      '<text x="16" y="' + (lot.h-6.5) + '" text-anchor="middle" font-size="3.4" fill="' +
        (photo ? "#fff" : "var(--muted)") + '">20 ft · grid ' + step + ' ft</text></g>';

    return '<svg class="site" id="siteSvg" viewBox="0 0 ' + lot.w + ' ' + lot.h + '">' +
      photoLayer + g +
      '<rect x="0" y="0" width="' + lot.w + '" height="' + lot.h +
        '" fill="none" stroke="var(--gold)" stroke-width="1"/>' +
      shapes + sb + '</svg>';
  }

  function wireSite(){
    var svg = document.getElementById("siteSvg");
    if(!svg) return;

    function ptToFeet(evt){
      var r = svg.getBoundingClientRect();
      var scale = state.site.lot.w / r.width;
      return {x:(evt.clientX - r.left) * scale, y:(evt.clientY - r.top) * scale};
    }
    Array.prototype.forEach.call(svg.querySelectorAll(".sitem"), function(el){
      el.addEventListener("pointerdown", function(e){
        var id = el.getAttribute("data-sid"), it = siteById(id);
        if(!it) return;
        selId = id;
        var p = ptToFeet(e);
        dragging = {id:id, dx:p.x - it.x, dy:p.y - it.y, moved:false};
        /* capture keeps the drag alive if the finger slides off the shape;
           it can throw on some browsers, and the drag must survive that */
        try{ el.setPointerCapture(e.pointerId); }catch(err){}
        e.preventDefault();
      });
      el.addEventListener("pointermove", function(e){
        if(!dragging || dragging.id !== el.getAttribute("data-sid")) return;
        var it = siteById(dragging.id); if(!it) return;
        var p = ptToFeet(e);
        var nx = Math.round(p.x - dragging.dx), ny = Math.round(p.y - dragging.dy);
        var lot = state.site.lot;
        it.x = Math.max(-10, Math.min(lot.w + 10 - it.w, nx));
        it.y = Math.max(-10, Math.min(lot.h + 10 - it.h, ny));
        dragging.moved = true;
        /* move just this shape, cheaply, while the finger is down */
        var f = FILLS[it.fill] || FILLS.soft;
        var shape = el.querySelector("rect, ellipse");
        if(it.round){ shape.setAttribute("cx", it.x + it.w/2); shape.setAttribute("cy", it.y + it.h/2); }
        else { shape.setAttribute("x", it.x); shape.setAttribute("y", it.y); }
        var texts = el.querySelectorAll("text");
        if(texts[0]){ texts[0].setAttribute("x", it.x + it.w/2); texts[0].setAttribute("y", it.y + it.h/2); }
        if(texts[1]){ texts[1].setAttribute("x", it.x + it.w/2); texts[1].setAttribute("y", it.y + it.h/2 + 4.5); }
        e.preventDefault();
      });
      el.addEventListener("pointerup", function(e){
        if(dragging && dragging.id === el.getAttribute("data-sid")){
          dragging = null; save(); renderSite();
        }
        e.preventDefault();
      });
      el.addEventListener("pointercancel", function(){ dragging = null; save(); renderSite(); });
    });

    Array.prototype.forEach.call(view.querySelectorAll("[data-kit]"), function(b){
      b.addEventListener("click", function(){
        var k = KIT[+b.getAttribute("data-kit")];
        var id = "i" + Date.now().toString(36) + Math.floor(Math.random()*999).toString(36);
        state.site.items.push({id:id, t:k.t, nm:k.nm, x:Math.round(state.site.lot.w/2 - k.w/2),
          y:Math.round(state.site.lot.h/2 - k.h/2), w:k.w, h:k.h, fill:k.fill, round:!!k.round});
        selId = id; save(); renderSite(); toast(k.nm + " added — drag it where you want it");
      });
    });

    var sel = selId ? siteById(selId) : null;
    if(sel){
      Array.prototype.forEach.call(view.querySelectorAll("[data-size]"), function(b){
        b.addEventListener("click", function(){
          var p = b.getAttribute("data-size").split("x");
          sel.w = +p[1]; sel.h = +p[0];
          sel.nm = "Tent " + p[0] + "×" + p[1];
          save(); renderSite();
        });
      });
      var sw = document.getElementById("selW"), sh = document.getElementById("selH");
      if(sw) sw.addEventListener("change", function(){ sel.w = Math.max(1, +sw.value||1); save(); renderSite(); });
      if(sh) sh.addEventListener("change", function(){ sel.h = Math.max(1, +sh.value||1); save(); renderSite(); });
      document.getElementById("selRot").addEventListener("click", function(){
        var t = sel.w; sel.w = sel.h; sel.h = t; save(); renderSite();
      });
      document.getElementById("selDup").addEventListener("click", function(){
        var c = JSON.parse(JSON.stringify(sel));
        c.id = "i" + Date.now().toString(36); c.x += 6; c.y += 6; c.fixed = false;
        state.site.items.push(c); selId = c.id; save(); renderSite();
      });
      document.getElementById("selDel").addEventListener("click", function(){
        state.site.items = state.site.items.filter(function(i){ return i.id !== selId; });
        selId = null; save(); renderSite();
      });
      document.getElementById("selClose").addEventListener("click", function(){
        selId = null; renderSite();
      });
    }

    var lw = document.getElementById("lotW"), lh = document.getElementById("lotH");
    lw.addEventListener("change", function(){
      var w = Math.max(20, +lw.value||130);
      /* with a photo underneath, depth follows the image so squares stay square */
      if(state.sitePhoto && state.site.photoAspect)
        state.site.lot.h = Math.round(w * state.site.photoAspect);
      state.site.lot.w = w;
      save(); renderSite();
    });
    lh.addEventListener("change", function(){
      if(state.sitePhoto) return;
      state.site.lot.h = Math.max(20, +lh.value||144); save(); renderSite(); });

    /* photo: downscale before storing so it fits in local storage */
    var pin = document.getElementById("photoIn");
    if(pin) pin.addEventListener("change", function(e){
      var f = e.target.files && e.target.files[0];
      if(!f) return;
      toast("Reading the photo…");
      var fr = new FileReader();
      fr.onload = function(){
        var img = new Image();
        img.onload = function(){
          var maxW = 1600;
          var scale = Math.min(1, maxW / img.width);
          var cw = Math.round(img.width * scale), ch = Math.round(img.height * scale);
          var cv = document.createElement("canvas");
          cv.width = cw; cv.height = ch;
          cv.getContext("2d").drawImage(img, 0, 0, cw, ch);
          var data;
          try{ data = cv.toDataURL("image/jpeg", 0.82); }
          catch(err){ toast("Could not read that image"); return; }
          state.sitePhoto = data;
          state.photoRemoved = false;
          state.site.photoAspect = img.height / img.width;
          state.site.lot.h = Math.round(state.site.lot.w * state.site.photoAspect);
          try{ save(); }
          catch(err){ state.sitePhoto = null; toast("That photo is too large to store"); }
          renderSite();
          toast("Photo loaded — now set how many feet it spans");
        };
        img.onerror = function(){ toast("Could not read that image"); };
        img.src = fr.result;
      };
      fr.readAsDataURL(f);
    });
    var pclr = document.getElementById("photoClear");
    if(pclr) pclr.addEventListener("click", function(){
      state.sitePhoto = null; state.photoRemoved = true; save(); renderSite();
      toast("Photo removed");
    });
    var pop = document.getElementById("photoOp");
    if(pop) pop.addEventListener("change", function(){
      state.site.photoOpacity = (+pop.value)/100; save(); renderSite(); });
    var gt = document.getElementById("gridTog");
    if(gt) gt.addEventListener("click", function(){
      state.site.gridOn = !state.site.gridOn; save(); renderSite(); });

    document.getElementById("resetSite").addEventListener("click", function(){
      var w = state.site.lot.w, aspect = state.site.photoAspect || DEFAULT_PHOTO_ASPECT;
      var op = state.site.photoOpacity, grid = state.site.gridOn;
      state.site = defaultSite();
      state.site.photoAspect = aspect; state.site.photoOpacity = op; state.site.gridOn = grid;
      if(state.sitePhoto){ state.site.lot.w = w; state.site.lot.h = Math.round(w * aspect); }
      selId = null; save(); renderSite();
      toast("Pieces cleared — photo and scale kept");
    });
  }

  /* ================= DECISIONS ================= */
  function decDate(d){ return taskDate(d.by); }
  function renderDecisions(){
    var open = state.decisions.filter(function(d){ return !d.chosen; });
    var done = state.decisions.filter(function(d){ return d.chosen; });
    var late = open.filter(function(d){ return decDate(d) < new Date(); }).length;

    function decHtml(d){
      var by = decDate(d), isLate = !d.chosen && by < new Date();
      return '<div class="dec' + (d.chosen?" settled":"") + (isLate?" late":"") + '">' +
        '<div class="dh"><span class="dq">' + esc(d.q) + '</span>' +
          '<span class="pill' + (d.chosen?" ok":isLate?" crit":"") + '">' +
          (d.chosen ? "Decided" : isLate ? "Overdue" : "By " + shortDate(by)) + '</span></div>' +
        (d.why ? '<div class="dwhy">' + esc(d.why) + '</div>' : '') +
        '<div class="dopts">' + (d.opts||[]).map(function(o,i){
          return '<button class="dopt' + (d.chosen === o.l ? ' on' : '') + '" data-dch="' + d.id +
            '|' + i + '">' + esc(o.l) + (o.d ? '<span class="dd">' + money(o.d) + '</span>' : '') +
            '</button>'; }).join("") + '</div>' +
        '<div class="row two" style="margin-bottom:8px">' +
          '<div><label class="fld">Who decides</label><select data-down="' + d.id + '">' +
            OWNERS.map(function(o){ return '<option' + ((d.owner||"Both")===o?" selected":"") + '>' +
              o + '</option>'; }).join("") + '</select></div>' +
          '<div><label class="fld">Note</label><input type="text" data-dnote="' + d.id +
            '" value="' + esc(d.note||"") + '" placeholder="why, or what we still need"></div>' +
        '</div>' +
        (d.chosen ? '<button class="mv" data-dclear="' + d.id + '">Reopen</button>' : '') +
        '<button class="del" data-ddel="' + d.id + '" style="float:right">✕</button>' +
      '</div>';
    }

    view.innerHTML =
      '<h2 class="sec serif">Decisions</h2>' +
      '<p class="lede">The next 90 days are decisions, not spending. Each one below unblocks something ' +
      'else — the deadlines are counted back from ' + fmtDate(state.plan.date) + '.</p>' +
      '<div class="stats">' +
        '<div class="stat hero"><div class="k">Still open</div><div class="v num">' + open.length +
          '</div><div class="d">of ' + state.decisions.length + '</div></div>' +
        '<div class="stat"><div class="k">Overdue</div><div class="v num" style="color:' +
          (late?'var(--crit)':'var(--ok)') + '">' + late + '</div><div class="d">past their date</div></div>' +
        '<div class="stat"><div class="k">Settled</div><div class="v num" style="color:var(--ok)">' +
          done.length + '</div><div class="d">locked in</div></div>' +
      '</div>' +
      (open.length ? '<h3 class="sub">Open</h3>' + open.map(decHtml).join("") : "") +
      '<div class="addbox" style="margin:14px 0">' +
        '<div class="row two" style="margin-bottom:9px">' +
          '<div><label class="fld">Add a decision</label>' +
            '<input type="text" id="ndQ" placeholder="What do we need to decide?"></div>' +
          '<div><label class="fld">Months before the day</label>' +
            '<input type="number" id="ndBy" value="12"></div></div>' +
        '<label class="fld">Options, separated by commas</label>' +
        '<input type="text" id="ndOpts" placeholder="Yes, No, Later" style="margin-bottom:9px">' +
        '<button class="btn sm gold" id="ndSave">Add</button></div>' +
      (done.length ? '<h3 class="sub">Settled</h3>' + done.map(decHtml).join("") : "");

    Array.prototype.forEach.call(view.querySelectorAll("[data-dch]"), function(b){
      b.addEventListener("click", function(){
        var p = b.getAttribute("data-dch").split("|");
        var d = state.decisions.filter(function(x){ return x.id === p[0]; })[0];
        var lbl = d.opts[+p[1]].l;
        d.chosen = (d.chosen === lbl) ? null : lbl;
        save(); renderDecisions();
      });
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-down]"), function(s){
      s.addEventListener("change", function(){
        var d = state.decisions.filter(function(x){ return x.id === s.getAttribute("data-down"); })[0];
        d.owner = s.value; save();
      });
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-dnote]"), function(s){
      s.addEventListener("change", function(){
        var d = state.decisions.filter(function(x){ return x.id === s.getAttribute("data-dnote"); })[0];
        d.note = s.value; save();
      });
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-dclear]"), function(b){
      b.addEventListener("click", function(){
        var d = state.decisions.filter(function(x){ return x.id === b.getAttribute("data-dclear"); })[0];
        d.chosen = null; save(); renderDecisions();
      });
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-ddel]"), function(b){
      b.addEventListener("click", function(){
        state.decisions = state.decisions.filter(function(x){ return x.id !== b.getAttribute("data-ddel"); });
        save(); renderDecisions();
      });
    });
    document.getElementById("ndSave").addEventListener("click", function(){
      var q = document.getElementById("ndQ").value.trim();
      if(!q){ toast("What is the decision?"); return; }
      var opts = document.getElementById("ndOpts").value.split(",")
        .map(function(x){ return x.trim(); }).filter(Boolean)
        .map(function(l){ return {l:l, d:0}; });
      if(!opts.length) opts = [{l:"Yes", d:0},{l:"No", d:0}];
      state.decisions.push({id:"d" + Date.now().toString(36), q:q, why:"",
        by:+document.getElementById("ndBy").value || 12, opts:opts, owner:"Both"});
      save(); renderDecisions(); toast("Decision added");
    });
  }

  /* ================= PAYMENTS (inside Vendors) ================= */
  function payTotals(){
    var paid = 0, due = 0, over = 0, now = new Date();
    (state.payments||[]).forEach(function(p){
      if(p.status === "Paid") paid += (+p.amt||0);
      else {
        due += (+p.amt||0);
        if(p.due && new Date(p.due) < now) over += (+p.amt||0);
      }
    });
    return {paid:paid, due:due, over:over};
  }
  function paymentsHtml(){
    var t = payTotals();
    var list = (state.payments||[]).slice().sort(function(a,b){
      return (a.due||"9999") < (b.due||"9999") ? -1 : 1; });
    return '<h3 class="sub">Payments</h3>' +
      '<div class="stats">' +
        '<div class="stat hero"><div class="k">Still owed</div><div class="v num">' + money(t.due) +
          '</div><div class="d">' + (t.over ? money(t.over) + " overdue" : "nothing overdue") + '</div></div>' +
        '<div class="stat"><div class="k">Paid so far</div><div class="v num" style="color:var(--ok)">' +
          money(t.paid) + '</div><div class="d">' +
          (state.payments||[]).filter(function(p){ return p.status==="Paid"; }).length +
          ' payments</div></div>' +
      '</div>' +
      '<div class="card" style="margin-bottom:14px">' +
        (list.length ? list.map(function(p,i){
          var isPaid = p.status === "Paid";
          var late = !isPaid && p.due && new Date(p.due) < new Date();
          return '<div class="payrow">' +
            '<span class="pw">' + esc(p.what || "Payment") +
              '<small>' + esc(p.who || "") + (p.due ? ' · due ' + p.due : ' · no date') +
              (late ? ' · overdue' : '') + '</small></span>' +
            '<span class="pa" style="color:' + (isPaid?'var(--ok)':late?'var(--crit)':'var(--ink)') + '">' +
              money(p.amt) + '</span>' +
            '<span style="display:flex; gap:6px">' +
              '<button class="mv' + (isPaid?' in':'') + '" data-paytog="' + i + '">' +
                (isPaid ? "Paid" : "Mark paid") + '</button>' +
              '<button class="del" data-paydel="' + i + '">✕</button></span>' +
          '</div>';
        }).join("")
        : '<p style="color:var(--muted); font-size:14px">No payments logged. Add the deposit the ' +
          'moment you book something — deposits are usually 25–50%, and the balance lands ' +
          '14–30 days before the day.</p>') +
        '<div class="addbox" style="margin-top:14px">' +
          '<div class="row two" style="margin-bottom:9px">' +
            '<div><label class="fld">What for</label>' +
              '<input type="text" id="pyWhat" placeholder="Tent deposit"></div>' +
            '<div><label class="fld">Amount</label><input type="number" id="pyAmt" placeholder="0"></div>' +
          '</div>' +
          '<div class="row two" style="margin-bottom:9px">' +
            '<div><label class="fld">Who to</label>' +
              '<input type="text" id="pyWho" placeholder="Company"></div>' +
            '<div><label class="fld">Due date</label><input type="date" id="pyDue"></div>' +
          '</div>' +
          '<div style="display:flex; gap:8px; flex-wrap:wrap">' +
            '<button class="btn sm gold" id="pyAdd">Add as due</button>' +
            '<button class="btn sm quiet" id="pyAddPaid">Add as already paid</button></div>' +
        '</div>' +
      '</div>';
  }
  function wirePayments(){
    function add(status){
      var amt = +document.getElementById("pyAmt").value || 0;
      if(!amt){ toast("Enter the amount"); return; }
      state.payments.push({what:document.getElementById("pyWhat").value.trim(),
        who:document.getElementById("pyWho").value.trim(), amt:amt,
        due:document.getElementById("pyDue").value, status:status});
      save(); var y = window.scrollY; renderVendors(); window.scrollTo(0,y); toast("Added");
    }
    var a = document.getElementById("pyAdd"), b = document.getElementById("pyAddPaid");
    if(a) a.addEventListener("click", function(){ add("Due"); });
    if(b) b.addEventListener("click", function(){ add("Paid"); });
    Array.prototype.forEach.call(view.querySelectorAll("[data-paytog]"), function(x){
      x.addEventListener("click", function(){
        var p = state.payments[+x.getAttribute("data-paytog")];
        p.status = p.status === "Paid" ? "Due" : "Paid";
        save(); var y = window.scrollY; renderVendors(); window.scrollTo(0,y);
      });
    });
    Array.prototype.forEach.call(view.querySelectorAll("[data-paydel]"), function(x){
      x.addEventListener("click", function(){
        state.payments.splice(+x.getAttribute("data-paydel"),1);
        save(); var y = window.scrollY; renderVendors(); window.scrollTo(0,y);
      });
    });
  }

  /* ================= QUESTION POPUP ================= */
  var qmodal = document.getElementById("qmodal"), qpop = document.getElementById("qpop");
  var qpopContent = document.getElementById("qpopContent"), modalOpen = false;
  function openQuestion(i){ modalOpen = true; qmodal.hidden = false; buildQuestion(i); }
  function closeModal(){ if(!modalOpen) return; modalOpen = false; qmodal.hidden = true; render(); }
  document.getElementById("qclose").addEventListener("click", closeModal);
  qmodal.addEventListener("click", function(e){ if(e.target === qmodal) closeModal(); });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });
  function buildQuestion(i){
    var q = Q[i], a = ans(q.id);
    var html = '<div class="seal script">&amp;</div>' +
      '<div class="qcount"><span class="orn">❦</span>Question ' + (i+1) + ' of 20<span class="orn">❦</span></div>' +
      '<div class="qbar"><span class="rail"><i style="width:' + Math.round(i/Q.length*100) + '%"></i></span></div>' +
      '<div class="qsection">' + q.section + '</div>' +
      '<div class="qtitle serif">' + q.title + '</div>' +
      '<div class="qcontext">' + q.context + '</div>';
    q.groups.forEach(function(gr){
      if(gr.label) html += '<div class="grouplabel">' + gr.label + '</div>';
      html += '<div class="chips" data-group="' + gr.key + '">';
      gr.options.forEach(function(opt){
        var on = ((a.picks[gr.key]||[]).indexOf(opt) !== -1);
        html += '<button class="chip' + (on?" on":"") + '" data-opt="' + esc(opt) + '">' + opt + '</button>';
      });
      html += '</div>';
    });
    (q.notes||[]).forEach(function(nt){
      html += '<div class="grouplabel">' + nt.label + '</div>' +
        '<textarea data-note="' + nt.key + '" placeholder="In your own words (optional)&hellip;">' +
        esc(a.notes[nt.key]||"") + '</textarea>';
    });
    html += '<div class="qnav"><button class="btn quiet" id="backBtn">' + (i===0?"Close":"Back") +
      '</button><span class="hint">Saves as you tap</span>' +
      '<button class="btn" id="nextBtn">' + (i===Q.length-1?"Done":"Next") + '</button></div>';
    qpopContent.innerHTML = html;
    qpopContent.scrollTop = 0;
    qpop.style.animation = "none"; void qpop.offsetWidth; qpop.style.animation = "";
    Array.prototype.forEach.call(qpopContent.querySelectorAll(".chips"), function(chipsEl){
      var gkey = chipsEl.getAttribute("data-group");
      var gr = q.groups.filter(function(x){ return x.key === gkey; })[0];
      Array.prototype.forEach.call(chipsEl.querySelectorAll(".chip"), function(chip){
        chip.addEventListener("click", function(){
          var opt = chip.getAttribute("data-opt"), cur = a.picks[gkey] || [];
          if(gr.type === "single"){
            a.picks[gkey] = (cur[0] === opt) ? [] : [opt];
            Array.prototype.forEach.call(chipsEl.querySelectorAll(".chip"), function(cc){ cc.classList.remove("on"); });
            if(a.picks[gkey].length) chip.classList.add("on");
          } else {
            var ix = cur.indexOf(opt);
            if(ix === -1) cur.push(opt); else cur.splice(ix,1);
            a.picks[gkey] = cur; chip.classList.toggle("on");
          }
          save();
        });
      });
    });
    Array.prototype.forEach.call(qpopContent.querySelectorAll("textarea"), function(ta){
      ta.addEventListener("input", function(){
        a.notes[ta.getAttribute("data-note")] = ta.value; save(); });
    });
    document.getElementById("backBtn").addEventListener("click", function(){
      if(i === 0) closeModal(); else buildQuestion(i-1); });
    document.getElementById("nextBtn").addEventListener("click", function(){
      if(i === Q.length-1) closeModal(); else buildQuestion(i+1); });
  }

  save();
  render();
})();
</script>
<script>
if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", function () {
    navigator.serviceWorker.register("sw.js", { updateViaCache: "none" })
      .then(function (reg) { reg.update(); })
      .catch(function () {});
  });
  var reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (reloaded) return;
    reloaded = true;
    location.reload();
  });
}
</script>
</body>
