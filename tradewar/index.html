<html lang="en">

<meta name="theme-color" content="#070b12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070b12'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='7' fill='%23a35d2c'/%3E%3Cpath d='M9 16h14M13 13v6M19 13v6' stroke='%23f4ead8' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}

<script>
'use strict';

/* ------------------------------------------------------------------ *
 * SCFL TRADE WAR — turn-based artillery between two club crests,
 * fought on themed home fields. One file, no build step.
 * ------------------------------------------------------------------ */

const VW = 480, VH = 270;
const STEP = 1000 / 60;

const GRAV      = 0.145;
const WIND_ACC  = 0.011;
const SUBSTEPS  = 4;
const MAX_POWER = 100;
const V_PER_PWR = 0.088;    // power 100 lands just past the far edge
const CREST_R   = 16;       // 32px across
const BLAST_PAD = 18;       // damage falloff is independent of crest size
const EROSION   = 0.40;     // crests chip at 40% of the rate terrain carves

// fall damage: light, and free for ordinary settling

/* ------------------------------------------------------------------ *

  { id:'block',   name:'BLOCKBUSTER',    kind:'shell',  ammo:3,  r:36, dmg:48, speed:0.92, wind:2, scAng:0,   scPwr:0,

  { id:'talk',    name:'SHIT TALK',      kind:'heap',   ammo:5,  r:26, dmg:7,  speed:1.05, wind:1, scAng:0,   scPwr:0,

  { id:'veto',    name:'VETO',           kind:'dig',    ammo:-1, r:34, dmg:4,  speed:1.00, wind:1, scAng:0,   scPwr:0,

const TINT = { lowball:'#ffd86b', waiver:'#7fe3a0', pick1:'#8fd0ff', pick2:'#c9e6ff',
               block:'#ff8a5c', talk:'#b98a4a', veto:'#9aa6bd' };

// Flavour is the shape of a deal, never a real one.
const FLAVOUR = {
  lowball: ['3-FOR-1 OFFER', 'SALARY DUMP', 'BUY LOW, INSULT HIGH', 'TAKE IT OR LEAVE IT', 'SELLING HIGH'],
  waiver:  ['WAIVER CLAIM', 'WIRE PICKUP', 'FREE AGENT GRAB', 'BLIND BID'],
  pick1:   ['FIRST ROUNDER', 'WIN-NOW PICK', 'TOP OF THE BOARD'],
  pick2:   ['SECOND ROUNDER', 'DART THROW', 'LOTTERY TICKET', 'BEST AVAILABLE'],
  block:   ['FIVE-PLAYER BLOCKBUSTER', 'THE MEGADEAL', 'EVERYTHING MUST GO', 'FIRE SALE'],
  talk:    ['2AM DM', 'GROUP CHAT PILE-ON', 'HOT TAKE', 'ALL-CAPS RANT', 'SUBTWEET'],
  veto:    ['LEAGUE VETO', 'COMMISSIONER RULING', 'TRADE REVERSED', 'PROTEST UPHELD'],
};

/* ------------------------------------------------------------------ *
 * ARENAS — each club's home field sets the sky, the backdrop, the
 * props, the turf colours AND the shape of the ground itself.
 * Three are built; every other club falls back to the stadium.
 * ------------------------------------------------------------------ */
const ARENAS = {
  machines: {
    name: 'THE SCRAP WASTES',
    profile: 'terraced',
    sky: ['#0b0a0e', '#241a1a', '#4a2a1c'],
    turf: '#3c3f42', cap: '#7b8288', dark: '#24272a', stripe: 'rgba(255,180,120,.10)',
    back(s){
      // dead gantries and stacks against a rust sky
      ctx.fillStyle = '#15161c';
      for (let i = 0; i < 7; i++){
        const x = (i * 83 + 20) % (VW + 60) - 30, h = 60 + ((i * 37) % 55), w = 13 + (i % 3) * 7;
        ctx.fillRect(x, 150 - h, w, h);
        ctx.fillRect(x - 5, 150 - h - 5, w + 10, 5);
      }
      ctx.strokeStyle = '#1b1d24'; ctx.lineWidth = 2;
      for (let i = 0; i < 4; i++){
        const x = i * 130 + 40;
        ctx.beginPath(); ctx.moveTo(x, 150); ctx.lineTo(x + 26, 84); ctx.lineTo(x + 62, 92); ctx.stroke();
      }
      ctx.fillStyle = 'rgba(255,140,70,.05)';
      for (let i = 0; i < 5; i++) ctx.fillRect((i * 97 - s * 0.1) % VW, 96, 40, 54);
    },
  },
  porkchopexpress: {
    name: 'THE NIGHT MARKET',
    profile: 'street',
    sky: ['#0a0714', '#1d0f2e', '#3b1440'],
    turf: '#33323d', cap: '#5d5a6b', dark: '#1f1e26', stripe: 'rgba(255,120,200,.12)',
    back(s){
      // tenement blocks with lit windows, lanterns strung between
      const cols = ['#141126', '#1a1430', '#100e1f'];
      for (let i = 0; i < 9; i++){
        const x = i * 58 - 10, h = 52 + ((i * 53) % 62), y = 152 - h;
        ctx.fillStyle = cols[i % 3]; ctx.fillRect(x, y, 54, h);
        for (let wy = y + 6; wy < 146; wy += 11)
          for (let wx = x + 5; wx < x + 48; wx += 11){
            const lit = ((wx * 7 + wy * 13 + i * 31) % 5) < 2;
            ctx.fillStyle = lit ? ['#ffcf6b','#ff7ab5','#7fe3ff'][(wx + wy + i) % 3] : '#0b0a16';
            ctx.fillRect(wx, wy, 5, 6);
          }
      }
      ctx.strokeStyle = 'rgba(255,150,90,.35)'; ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x <= VW; x += 8) x === 0 ? ctx.moveTo(0, 100) : ctx.lineTo(x, 100 + Math.sin(x / 34) * 7);
      ctx.stroke();
      for (let i = 0; i < 16; i++){
        const x = i * 31 + 8, y = 100 + Math.sin(x / 34) * 7;
        ctx.fillStyle = i % 2 ? '#ff5c4a' : '#ffc24a';
        ctx.beginPath(); ctx.ellipse(x, y + 6, 3.4, 4.4, 0, 0, 6.284); ctx.fill();
      }
    },
  },
  powersofpain: {
    name: 'THE SQUARED CIRCLE',
    profile: 'ring',
    spawn: [0.24, 0.36, 0.64, 0.76],     // inside the ropes, not out on the floor
    sky: ['#06070d', '#0e1424', '#18203a'],
    turf: '#243f7a', cap: '#4a72c4', dark: '#182a52', stripe: 'rgba(255,255,255,.14)',
    back(s){
      // dark arena: banked crowd, hard spotlights, turnbuckles
      ctx.fillStyle = 'rgba(255,250,225,.055)';
      for (let i = 0; i < 6; i++){
        const lx = 30 + i * 86;
        ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx - 30, 158); ctx.lineTo(lx + 30, 158); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#080b14'; ctx.fillRect(0, 96, VW, 62);
      for (let i = 0; i < 190; i++){
        const cx = (i * 43) % VW, cy = 100 + ((i * 17) % 52);
        ctx.fillStyle = ['#1d2740','#26324f','#161e33'][i % 3];
        ctx.fillRect(cx, cy, 2, 2);
      }
      ctx.fillStyle = '#c8323c';
      [92, VW - 96].forEach(x => { ctx.fillRect(x, 128, 6, 42); ctx.fillRect(x - 3, 124, 12, 6); });
      ctx.strokeStyle = 'rgba(228,236,255,.55)'; ctx.lineWidth = 1.6;
      for (const y of [136, 148, 160]){
        ctx.beginPath(); ctx.moveTo(95, y); ctx.lineTo(VW - 93, y); ctx.stroke();
      }
    },
  },
  _default: {
    name: 'THE STADIUM',
    profile: 'rolling',
    sky: ['#070b14', '#132038', '#2b2438'],
    turf: '#2c5c34', cap: '#59ad63', dark: '#1d3f24', stripe: 'rgba(226,240,255,.13)',
    back(s){
      ctx.fillStyle = 'rgba(255,235,190,.05)';
      for (let i = 0; i < 5; i++){
        const lx = 40 + i * 105;
        ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx - 38, 130); ctx.lineTo(lx + 38, 130); ctx.closePath(); ctx.fill();
      }
      ctx.fillStyle = '#0a111d'; ctx.fillRect(0, 108, VW, 50);
      for (let i = 0; i < 150; i++){
        const cx = (i * 47) % VW, cy = 112 + ((i * 19) % 42);
        ctx.fillStyle = ['#20304a','#27384f','#1a2740'][i % 3];
        ctx.fillRect(cx, cy, 2, 2);
      }
    },

};
const arenaFor = key => ARENAS[key] || ARENAS._default;

/* ------------------------------------------------------------------ *
 * CANVAS
 * ------------------------------------------------------------------ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
cv.width = VW; cv.height = VH;
ctx.imageSmoothingEnabled = false;

function fit(){
  const ctl = document.getElementById('ctl');
  const ctlH = ctl.classList.contains('on') ? ctl.offsetHeight + 16 : 12;
  const w = innerWidth - 12, h = innerHeight - ctlH - 12;
  let s = Math.min(w / VW, h / VH);
  if (s >= 1) s = Math.floor(s * 2) / 2;
  s = Math.max(s, 0.4);
  cv.style.width  = Math.round(VW * s) + 'px';
  cv.style.height = Math.round(VH * s) + 'px';
}
addEventListener('resize', fit);

/* ------------------------------------------------------------------ *
 * CRESTS
 * ------------------------------------------------------------------ */
const LOGO = {};

function dominantAccent(img){
  const n = 24;
  const c = document.createElement('canvas'); c.width = c.height = n;
  const x = c.getContext('2d', { willReadFrequently:true });
  x.drawImage(img, 0, 0, n, n);
  const d = x.getImageData(0, 0, n, n).data;
  const bins = new Map();
  for (let i = 0; i < d.length; i += 4){
    if (d[i+3] < 200) continue;
    const r = d[i], g = d[i+1], b = d[i+2];
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
    if (mx < 45) continue;
    const sat = (mx - mn) / mx;
    if (sat < 0.18 && mx > 225) continue;
    const k = (r>>5)*64 + (g>>5)*8 + (b>>5);
    const e = bins.get(k) || { w:0, r:0, g:0, b:0, n:0 };
    e.w += 1 + sat * 2.5; e.r += r; e.g += g; e.b += b; e.n++;
    bins.set(k, e);
  }
  let best = null;
  for (const e of bins.values()) if (!best || e.w > best.w) best = e;
  if (!best) return { accent:'#6fa8ff', dark:'#22406e', light:'#cfe1ff' };
  const r = best.r/best.n, g = best.g/best.n, b = best.b/best.n;
  const hex = (a,b2,c2) => '#' + [a,b2,c2].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
  const lift = v => Math.min(255, v * 1.15 + 30);
  const glow = v => Math.min(255, v * 0.45 + 140);
  return { accent: hex(lift(r),lift(g),lift(b)), dark: hex(r*0.42,g*0.42,b*0.42), light: hex(glow(r),glow(g),glow(b)) };
}

// 96px badge for a 32px crest: sharp at any device pixel ratio, and it
// leaves headroom for chunks to be blown out of it.
const BADGE = 96;
function badge(img, accent){
  const c = document.createElement('canvas'); c.width = c.height = BADGE;
  const x = c.getContext('2d');
  x.save();
  x.beginPath(); x.arc(BADGE/2, BADGE/2, BADGE/2 - 4, 0, 6.284); x.clip();
  x.fillStyle = '#0e1622'; x.fillRect(0, 0, BADGE, BADGE);
  x.drawImage(img, 3, 3, BADGE - 6, BADGE - 6);
  x.restore();
  x.lineWidth = 5; x.strokeStyle = accent;
  x.beginPath(); x.arc(BADGE/2, BADGE/2, BADGE/2 - 3.5, 0, 6.284); x.stroke();
  x.lineWidth = 2.2; x.strokeStyle = 'rgba(0,0,0,.72)';
  x.beginPath(); x.arc(BADGE/2, BADGE/2, BADGE/2 - 1.2, 0, 6.284); x.stroke();
  return c;
}

function placeholderLogo(i){
  const hue = (i * 360 / TEAMS.length) | 0;
  const c = document.createElement('canvas'); c.width = c.height = 96;
  const x = c.getContext('2d');
  x.fillStyle = 'hsl(' + hue + ',62%,48%)';
  x.beginPath(); x.arc(48, 48, 42, 0, 6.284); x.fill();
  x.strokeStyle = 'hsl(' + hue + ',70%,82%)'; x.lineWidth = 6; x.stroke();
  return c;
}

async function loadAssets(){
  let bundle = null;
  try { const r = await fetch('../scfl-team-logos-resized.json', { cache:'force-cache' }); if (r.ok) bundle = await r.json(); }
  catch (_) {}
  await Promise.all(TEAMS.map((t, i) => new Promise(done => {
    const finish = src => {
      const tone = dominantAccent(src);
      LOGO[t.key] = Object.assign({ img: badge(src, tone.accent) }, tone);
      done();
    };
    const src = bundle && bundle[t.key];
    if (!src) return finish(placeholderLogo(i));
    const img = new Image();
    img.onload  = () => { try { finish(img); } catch (_) { finish(placeholderLogo(i)); } };
    img.onerror = () => finish(placeholderLogo(i));
    img.src = src;
  })));
}

/* ------------------------------------------------------------------ *
 * SOUND
 * ------------------------------------------------------------------ */
const Sound = (() => {
  let ac = null, sfx = null;
  function ensure(){
    if (ac) return ac;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    sfx = ac.createGain(); sfx.gain.value = 0.5; sfx.connect(ac.destination);
    return ac;
  }
  function tone(f, dur, type, vol, at, to){
    ensure();
    const t0 = at || ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol == null ? 0.25 : vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(sfx); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, at, lp){
    ensure();
    const t0 = at || ac.currentTime;
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/n, 1.6);
    const s = ac.createBufferSource(); s.buffer = buf;
    const g = ac.createGain(); g.gain.value = vol == null ? 0.3 : vol;
    if (lp){ const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value = lp; s.connect(f); f.connect(g); }
    else s.connect(g);
    g.connect(sfx); s.start(t0);
  }
  return {
    resume(){ ensure(); if (ac.state === 'suspended') ac.resume(); },
    now(){ return ensure().currentTime; },
    fire(){ tone(220, 0.16, 'square', 0.20, null, 70); noise(0.09, 0.16, null, 1800); },
    boom(big){ noise(big ? 0.55 : 0.34, big ? 0.42 : 0.30, null, big ? 520 : 900);
               tone(big ? 70 : 100, big ? 0.42 : 0.26, 'triangle', 0.26, null, 34); },
    splat(){ noise(0.38, 0.34, null, 380); tone(90, 0.30, 'sine', 0.20, null, 42); },
    dig(){ noise(0.30, 0.24, null, 1300); tone(150, 0.20, 'triangle', 0.14, null, 60); },
    hit(){ const t = Sound.now(); tone(660,0.07,'square',0.22,t); tone(440,0.16,'square',0.20,t+0.06,180); },
    thud(){ noise(0.16, 0.22, null, 300); },
    swap(){ tone(520, 0.05, 'square', 0.14); },
    dud(){ noise(0.14, 0.12, null, 700); },
    win(){ const t = Sound.now(); [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.24,'square',0.22,t+i*0.11)); },
  };
})();

/* ------------------------------------------------------------------ *
 * STATE
 * ------------------------------------------------------------------ */
const G = {
  mode:'load', vsCpu:true, cpuSkill:1,
  pickSide:0, picks:[0, 12], home:0,
  turn:0, wind:0, shake:0,
  msg:'', msgT:0, banner:'', bannerT:0,
  wins:[0,0], winner:-1, arena:null, cpuThink:0, settleT:0,
};
let T = null, P = [], shots = [], bits = [];

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rnd = (a,b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

/* ------------------------------------------------------------------ *
 * TERRAIN — T[x] is the y of the ground in column x. Each arena has
 * its own profile; all of them get smoothed, because sharp one-pixel
 * peaks swallow shots and make aiming feel arbitrary.
 * ------------------------------------------------------------------ */
function smooth(passes){
  for (let p = 0; p < passes; p++){
    const c = Float32Array.from(T);
    for (let x = 1; x < VW - 1; x++) T[x] = (c[x-1] + c[x]*2 + c[x+1]) / 4;
  }
}

function profileRolling(base){
  const oct = [
    { len: rnd(430,620), amp: rnd(26,38) },
    { len: rnd(210,300), amp: rnd(12,20) },
    { len: rnd(105,155), amp: rnd(5,9)   },
    { len: rnd(55,80),   amp: rnd(1.5,3.5) },
  ].map(o => Object.assign(o, { ph: rnd(0,6.283) }));
  for (let x = 0; x < VW; x++){
    let y = base;
    for (const o of oct) y += Math.sin(x / o.len * 6.283 + o.ph) * o.amp;
    T[x] = y;
  }
  smooth(2);
}

function profileTerraced(base){
  profileRolling(base);
  for (let x = 0; x < VW; x++) T[x] = Math.round(T[x] / 11) * 11;   // scrap heaps, mesa steps
  smooth(1);
}

function profileStreet(base){
  // flat rooftops of differing heights, like a row of stalls and shopfronts
  let x = 0;
  while (x < VW){
    const w = Math.round(rnd(34, 76));
    const y = base + rnd(-26, 20);
    for (let i = 0; i < w && x + i < VW; i++) T[x + i] = y;
    x += w;
  }
  smooth(1);
}

function profileRing(base){
  // a canvas mat between the turnbuckles, floor either side
  const floor = base + 34, mat = base - 22;
  const L = 95, R = VW - 93, ramp = 16;
  for (let x = 0; x < VW; x++){
    let y = floor;
    if (x > L - ramp && x < L)      y = floor + (mat - floor) * ((x - (L - ramp)) / ramp);
    else if (x >= L && x <= R)      y = mat + Math.sin(x / 90) * 1.5;
    else if (x > R && x < R + ramp) y = mat + (floor - mat) * ((x - R) / ramp);
    T[x] = y;
  }
  smooth(2);
}

function buildTerrain(profile){
  T = new Float32Array(VW);
  const base = VH * 0.68;
  ({ rolling:profileRolling, terraced:profileTerraced, street:profileStreet, ring:profileRing }
    [profile] || profileRolling)(base);
  for (let x = 0; x < VW; x++) T[x] = clamp(T[x], VH * 0.34, VH - 20);
}

const groundAt = x => T[clamp(Math.round(x), 0, VW - 1)];

/* ------------------------------------------------------------------ *
 * GROUND CHANGES
 * ------------------------------------------------------------------ */
function carve(cx, cy, r){
  for (let dx = -r; dx <= r; dx++){
    const x = Math.round(cx + dx);
    if (x < 0 || x >= VW) continue;
    const h = Math.sqrt(Math.max(0, r*r - dx*dx));
    const top = cy - h, bot = cy + h;
    if (bot > T[x] && top < T[x]) T[x] = Math.min(VH - 2, bot);
  }
}

// Shit Talk works the other way: it puts ground ON the target.
function heap(cx, cy, r, height){
  for (let dx = -r; dx <= r; dx++){
    const x = Math.round(cx + dx);
    if (x < 0 || x >= VW) continue;
    const k = 1 - Math.abs(dx) / r;
    T[x] = Math.max(6, T[x] - height * k * k * (3 - 2 * k));   // smoothstep dome
  }
}

/* ------------------------------------------------------------------ *
 * COMBATANTS
 * ------------------------------------------------------------------ */
function makeSprite(teamKey){
  const src = LOGO[teamKey].img;
  const c = document.createElement('canvas'); c.width = c.height = BADGE;
  c.getContext('2d').drawImage(src, 0, 0);
  return c;
}

// Crests chip away where they are hit, at a fraction of the rate the
// ground does. Purely cosmetic: the hitbox stays a circle.
function erode(p, cx, cy, dmg){
  const g = p.sprite.getContext('2d');
  const R = BADGE / 2;
  // The bite follows the damage taken, not the blast radius: a blast is
  // often wider than the whole crest, so scaling it up erased the badge.
  const lr = R * 0.34 * Math.sqrt(Math.max(dmg, 2) / 26);
  const ang = Math.atan2(cy - p.y, cx - p.x) || 0;
  const lx = R + Math.cos(ang) * R * 0.6;
  const ly = R + Math.sin(ang) * R * 0.6;
  g.save();
  g.globalCompositeOperation = 'destination-out';
  g.beginPath(); g.arc(lx, ly, lr, 0, 6.284); g.fill();
  for (let i = 0; i < 3; i++){
    const a = rnd(0, 6.283), d = lr * rnd(0.4, 0.9);
    g.beginPath(); g.arc(lx + Math.cos(a)*d, ly + Math.sin(a)*d, lr * rnd(0.3, 0.55), 0, 6.284); g.fill();
  }
  g.restore();
}

function makePlayers(){
  const sp = (G.arena && G.arena.spawn) || [30 / VW, 0.27, 0.73, 1 - 30 / VW];
  const lx = Math.round(rnd(sp[0] * VW, sp[1] * VW));
  const rx = Math.round(rnd(sp[2] * VW, sp[3] * VW));
  P = [
    { team:G.picks[0], x:lx, side: 1, hp:100, angle: 50, power:62, r:CREST_R, wep:0, ammo:{}, dead:false, vy:0, fall:0 },
    { team:G.picks[1], x:rx, side:-1, hp:100, angle:130, power:62, r:CREST_R, wep:0, ammo:{}, dead:false, vy:0, fall:0 },
  ];
  for (const p of P){
    for (const w of WEAPONS) p.ammo[w.id] = w.ammo;
    p.sprite = makeSprite(TEAMS[p.team].key);
    // flatten a pad so a crest never balances on a knife edge
    const g = groundAt(p.x);
    for (let x = p.x - 13; x <= p.x + 13; x++){
      const i = clamp(Math.round(x), 0, VW - 1);
      T[i] = T[i] * 0.2 + g * 0.8;
    }
    p.y = groundAt(p.x) - p.r;
  }
}

// Ground falling away drops a crest; ground rising over one buries it.
function updateBodies(){
  for (const p of P){
    if (p.dead) continue;
    const rest = groundAt(p.x) - p.r;
    if (p.y < rest - 0.5){
      p.vy += GRAV;
      p.y += p.vy;
      p.fall += p.vy;
      if (p.y >= rest){
        p.y = rest;
        if (p.fall > FALL_GRACE){
          const d = Math.min(FALL_CAP, Math.round((p.fall - FALL_GRACE) / FALL_PER));
          if (d > 0){ p.hp = Math.max(0, p.hp - d); Sound.thud();
            say(TEAMS[p.team].name + ' FELL  -' + d);
            if (p.hp <= 0) p.dead = true; }
        }
        p.vy = 0; p.fall = 0;
      }
    } else {
      p.vy = 0; p.fall = 0;
      // never lift a crest: if the ground rose over it, it stays buried
    }
  }
}

const buried = p => groundAt(p.x) < p.y - 2;
function say(m){ G.msg = m; G.msgT = 120; }

/* ------------------------------------------------------------------ *
 * FIRING
 * ------------------------------------------------------------------ */
const muzzle = p => {
  const a = p.angle * Math.PI / 180;
  return { x: p.x + Math.cos(a) * 22, y: p.y - Math.sin(a) * 22 };
};

function fire(p){
  const w = WEAPONS[p.wep];
  if (p.ammo[w.id] === 0){ Sound.dud(); say('OUT OF ' + w.name); return; }
  if (p.ammo[w.id] > 0) p.ammo[w.id]--;
  // scatter is applied at launch: the shot leaves off where you aimed
  const ang = p.angle + (w.scAng ? rnd(-w.scAng, w.scAng) : 0);
  const pwr = clamp(p.power * (1 + (w.scPwr ? rnd(-w.scPwr, w.scPwr) / 100 : 0)), 5, MAX_POWER);
  const m = muzzle(p), a = ang * Math.PI / 180, v = pwr * V_PER_PWR * w.speed;
  shots.push({ x:m.x, y:m.y, vx:Math.cos(a)*v, vy:-Math.sin(a)*v, w, owner:P.indexOf(p), trail:[] });
  G.banner = pick(FLAVOUR[w.id]); G.bannerT = 150;
  Sound.fire();
  G.mode = 'fly';
  syncUI();
}

/* ------------------------------------------------------------------ *
 * IMPACT
 * ------------------------------------------------------------------ */
function explode(s, cx, cy){
  const w = s.w;
  const tint = TINT[w.id];

  if (w.kind === 'heap'){
    heap(cx, cy, w.r, 22);
    Sound.splat();
    G.shake = 5;
    for (let i = 0; i < 26; i++){
      const a = rnd(0, 6.283), sp = rnd(0.4, 2.2);
      bits.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1.1,
                  life:rnd(20,44), max:44, c: i % 3 ? '#7c5a2e' : '#4f3a1d', smoke:false });
    }
  } else {
    carve(cx, cy, w.r);
    const big = w.r >= 30;
    w.kind === 'dig' ? Sound.dig() : Sound.boom(big);
    G.shake = big ? 13 : 8;
    for (let i = 0; i < (big ? 34 : 20); i++){
      const a = rnd(0, 6.283), sp = rnd(0.6, big ? 4.4 : 3.0);
      bits.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 0.7,
                  life:rnd(22,52), max:52, c:tint, smoke:Math.random() < 0.45 });
    }
  }

  const reach = w.r + BLAST_PAD;
  P.forEach((p, i) => {
    if (p.dead) return;
    const d = Math.hypot(p.x - cx, p.y - cy);
    if (d > reach) return;
    let dmg = w.dmg * (1 - d / reach);
    if (w.kind === 'sniper' && d < p.r * 0.5) dmg = w.dmg;
    dmg = Math.round(dmg);
    if (dmg <= 0) return;
    erode(p, cx, cy, dmg);
    p.hp = Math.max(0, p.hp - dmg);
    Sound.hit();
    say((i === s.owner ? 'OWN GOAL — ' : '') + TEAMS[p.team].name + '  -' + dmg);
    if (p.hp <= 0) p.dead = true;
  });
}

function stepShots(){
  for (let i = shots.length - 1; i >= 0; i--){
    const s = shots[i];
    let gone = false;
    for (let k = 0; k < SUBSTEPS && !gone; k++){
      const dt = 1 / SUBSTEPS;
      s.vy += GRAV * dt;
      s.vx += G.wind * WIND_ACC * s.w.wind * dt;
      s.x  += s.vx * dt;
      s.y  += s.vy * dt;
      if (s.x < -80 || s.x > VW + 80 || s.y > VH + 120){ gone = true; break; }
      for (const p of P){
        if (p.dead) continue;
        if (Math.hypot(p.x - s.x, p.y - s.y) < p.r + 2){ explode(s, s.x, s.y); gone = true; break; }
      }
      if (gone) break;
      if (s.x >= 0 && s.x < VW && s.y >= groundAt(s.x)){ explode(s, s.x, groundAt(s.x)); gone = true; break; }
    }
    if (gone) shots.splice(i, 1);
    else { s.trail.push({ x:s.x, y:s.y }); if (s.trail.length > 26) s.trail.shift(); }
  }
}

function endTurn(){
  const alive = P.filter(p => !p.dead);
  if (alive.length < 2){
    G.winner = alive.length === 1 ? P.indexOf(alive[0]) : -1;
    if (G.winner >= 0) G.wins[G.winner]++;
    Sound.win();
    G.mode = 'over';
    syncUI();
    return;
  }
  G.turn = 1 - G.turn;
  G.wind = clamp(G.wind + rnd(-0.35, 0.35), -1, 1);
  G.mode = 'aim';
  G.cpuThink = 0;
  syncUI();
}

/* ------------------------------------------------------------------ *
 * THE OPPOSITION
 * ------------------------------------------------------------------ */
function simulate(from, angle, power, w){
  const a = angle * Math.PI / 180, v = power * V_PER_PWR * w.speed;
  let x = from.x + Math.cos(a) * 22, y = from.y - Math.sin(a) * 22;
  let vx = Math.cos(a) * v, vy = -Math.sin(a) * v;
  for (let f = 0; f < 900; f++){
    vy += GRAV; vx += G.wind * WIND_ACC * w.wind;
    x += vx; y += vy;
    if (x < -60 || x > VW + 60 || y > VH + 90) return { x, y, off:true };
    if (x >= 0 && x < VW && y >= groundAt(x)) return { x, y:groundAt(x), off:false };
  }
  return { x, y, off:true };
}

function cpuShoot(p){
  const foe = P[1 - P.indexOf(p)];
  // buried? dig out first — that is what Veto is for
  if (buried(p)){ p.wep = WEAPONS.findIndex(w => w.id === 'veto'); p.angle = 90; p.power = 14; fire(p); return; }
  const usable = WEAPONS.filter(w => p.ammo[w.id] !== 0 && w.id !== 'veto');
  let best = null;
  for (let i = 0; i < 240; i++){
    const w = pick(usable);
    const angle = p.side > 0 ? rnd(18, 84) : rnd(96, 162);
    const power = rnd(34, MAX_POWER);
    const hit = simulate(p, angle, power, w);
    const d = hit.off ? 1e6 : Math.hypot(hit.x - foe.x, hit.y - foe.y);
    const reach = w.r + BLAST_PAD + foe.r;
    let score = d >= reach ? -d / 1000 : w.dmg * (1 - d / reach);
    if (w.scAng) score *= 1 - w.scAng / 18;             // discount the wild ones
    if (w.ammo > 0) score *= 0.5 + 0.5 * (p.ammo[w.id] / w.ammo);
    if (!best || score > best.score) best = { score, angle, power, w };
  }
  if (!best) best = { angle: p.side > 0 ? 45 : 135, power: 60, w: WEAPONS[0] };
  const slop = [15, 7.5, 2.2][G.cpuSkill];
  p.angle = clamp(best.angle + rnd(-slop, slop), 5, 175);
  p.power = clamp(best.power + rnd(-slop, slop) * 1.6, 5, MAX_POWER);
  p.wep = WEAPONS.indexOf(best.w);
  fire(p);
}

/* ------------------------------------------------------------------ *
 * CONTROLS — sliders, nudges, typed entry, ammo tray, fire
 * ------------------------------------------------------------------ */
const $ = id => document.getElementById(id);
const el = {
  ctl:$('ctl'), sA:$('sAngle'), nA:$('nAngle'), sP:$('sPower'), nP:$('nPower'),
  aUp:$('aUp'), aDn:$('aDn'), pUp:$('pUp'), pDn:$('pDn'),
  bAmmo:$('bAmmo'), bFire:$('bFire'), tray:$('tray'), trayList:$('trayList'),
};

const myTurn = () => G.mode === 'aim' && !(G.vsCpu && G.turn === 1);

function syncUI(){
  const live = G.mode !== 'load' && G.mode !== 'title' && P.length;
  el.ctl.classList.toggle('on', live);
  if (!live) { fit(); return; }
  const p = P[G.turn];
  el.ctl.classList.toggle('locked', !myTurn());
  if (document.activeElement !== el.nA){ el.sA.value = Math.round(p.angle); el.nA.value = Math.round(p.angle); }
  if (document.activeElement !== el.nP){ el.sP.value = Math.round(p.power); el.nP.value = Math.round(p.power); }
  const w = WEAPONS[p.wep], n = p.ammo[w.id];
  el.bAmmo.innerHTML = w.name + ' <span class="cnt">' + (n < 0 ? '∞' : '×' + n) + '</span>';
  fit();
}

function setAngle(v){ if (!myTurn()) return; P[G.turn].angle = clamp(v, 5, 175); syncUI(); }
function setPower(v){ if (!myTurn()) return; P[G.turn].power = clamp(v, 5, MAX_POWER); syncUI(); }

el.sA.addEventListener('input', () => setAngle(+el.sA.value));
el.sP.addEventListener('input', () => setPower(+el.sP.value));

// typing an exact value: commit on Enter or blur, ignore junk
function wireNum(input, apply, get){
  const commit = () => { const v = parseFloat(input.value); if (isFinite(v)) apply(v); else input.value = Math.round(get()); syncUI(); };
  input.addEventListener('keydown', e => { if (e.key === 'Enter'){ input.blur(); } e.stopPropagation(); });
  input.addEventListener('blur', commit);
  input.addEventListener('focus', () => input.select());
}
wireNum(el.nA, setAngle, () => P.length ? P[G.turn].angle : 45);
wireNum(el.nP, setPower, () => P.length ? P[G.turn].power : 62);

// nudges: tap for one unit, hold to run
function wireNudge(btn, step, apply, get){
  let timer = null, delay = null;
  const once = () => apply(get() + step);
  const start = e => {
    e.preventDefault(); Sound.resume(); once();
    delay = setTimeout(() => { timer = setInterval(once, 55); }, 380);
  };
  const stop = () => { clearTimeout(delay); clearInterval(timer); timer = delay = null; };
  btn.addEventListener('touchstart', start, { passive:false });
  btn.addEventListener('mousedown', start);
  ['touchend','touchcancel','mouseup','mouseleave'].forEach(ev => btn.addEventListener(ev, stop));
}
wireNudge(el.aDn, -1, setAngle, () => P.length ? P[G.turn].angle : 45);
wireNudge(el.aUp,  1, setAngle, () => P.length ? P[G.turn].angle : 45);
wireNudge(el.pDn, -1, setPower, () => P.length ? P[G.turn].power : 62);
wireNudge(el.pUp,  1, setPower, () => P.length ? P[G.turn].power : 62);

function openTray(){
  if (!myTurn()) return;
  const p = P[G.turn];
  el.trayList.innerHTML = '';
  WEAPONS.forEach((w, i) => {
    const n = p.ammo[w.id];
    const row = document.createElement('div');
    row.className = 'ammo' + (n === 0 ? ' out' : '') + (i === p.wep ? ' sel' : '');
    row.innerHTML = '<span class="dot" style="background:' + TINT[w.id] + '"></span>' +
                    '<span class="an">' + w.name + '</span>' +
                    '<span class="ad">' + w.desc + '</span>' +
                    '<span class="ac">' + (n < 0 ? '∞' : n) + '</span>';
    if (n !== 0) row.addEventListener('click', () => { p.wep = i; Sound.swap(); closeTray(); syncUI(); });
    el.trayList.appendChild(row);
  });
  el.tray.classList.add('on');
}
const closeTray = () => el.tray.classList.remove('on');
el.bAmmo.addEventListener('click', () => { Sound.resume(); openTray(); });
el.tray.addEventListener('click', e => { if (e.target === el.tray) closeTray(); });
el.bFire.addEventListener('click', () => { Sound.resume(); if (myTurn()) fire(P[G.turn]); });

// keyboard stays available on desktop
addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) return;
  Sound.resume();
  if (G.mode === 'title'){
    if (e.code === 'ArrowLeft')  { G.picks[G.pickSide] = (G.picks[G.pickSide] + TEAMS.length - 1) % TEAMS.length; Sound.swap(); }
    if (e.code === 'ArrowRight') { G.picks[G.pickSide] = (G.picks[G.pickSide] + 1) % TEAMS.length; Sound.swap(); }
    if (e.code === 'ArrowUp')    { G.pickSide = 1 - G.pickSide; Sound.swap(); }
    if (e.code === 'ArrowDown')  { G.vsCpu = !G.vsCpu; Sound.swap(); }
    if (e.code === 'Tab')        { e.preventDefault(); G.cpuSkill = (G.cpuSkill + 1) % 3; Sound.swap(); }
    if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); newRound(false); }
    return;
  }
  if (G.mode === 'over'){
    if (e.code === 'Space' || e.code === 'Enter'){
      e.preventDefault();
      if (G.wins[0] >= 3 || G.wins[1] >= 3){ G.wins = [0,0]; G.mode = 'title'; syncUI(); } else newRound(true);
    }
    return;
  }
  if (!myTurn()) return;
  const p = P[G.turn];
  if (e.code === 'ArrowUp')    { e.preventDefault(); setAngle(p.angle + 1); }
  if (e.code === 'ArrowDown')  { e.preventDefault(); setAngle(p.angle - 1); }
  if (e.code === 'ArrowRight') { e.preventDefault(); setPower(p.power + 1); }
  if (e.code === 'ArrowLeft')  { e.preventDefault(); setPower(p.power - 1); }
  if (e.code === 'Tab'){ e.preventDefault();
    for (let i = 1; i <= WEAPONS.length; i++){
      const n = (p.wep + i) % WEAPONS.length;
      if (p.ammo[WEAPONS[n].id] !== 0){ p.wep = n; break; }
    }
    Sound.swap(); syncUI();
  }
  if (e.code === 'Space'){ e.preventDefault(); fire(p); }
});
cv.addEventListener('click', () => {
  Sound.resume();
  if (G.mode === 'title') newRound(false);
  else if (G.mode === 'over'){
    if (G.wins[0] >= 3 || G.wins[1] >= 3){ G.wins = [0,0]; G.mode = 'title'; syncUI(); } else newRound(true);
  }
});

/* ------------------------------------------------------------------ *
 * ROUNDS
 * ------------------------------------------------------------------ */
function newRound(keepScore){
  G.home = 0;                                   // the first club picked hosts
  G.arena = arenaFor(TEAMS[G.picks[G.home]].key);
  buildTerrain(G.arena.profile);
  makePlayers();
  shots = []; bits = [];
  G.wind = rnd(-1, 1);
  G.turn = Math.random() < 0.5 ? 0 : 1;
  G.winner = -1;
  if (!keepScore) G.wins = [0, 0];
  G.mode = 'aim';
  G.banner = ''; G.bannerT = 0;
  say(G.arena.name + '  ·  ' + TEAMS[P[G.turn].team].name + ' TO OPEN');
  closeTray();
  syncUI();
}

/* ------------------------------------------------------------------ *
 * UPDATE
 * ------------------------------------------------------------------ */
function tick(){
  if (G.msgT > 0) G.msgT--;
  if (G.bannerT > 0) G.bannerT--;
  if (G.shake > 0){ G.shake *= 0.86; if (G.shake < 0.4) G.shake = 0; }

  for (let i = bits.length - 1; i >= 0; i--){
    const b = bits[i];
    b.x += b.vx; b.y += b.vy;
    b.vy += b.smoke ? -0.012 : 0.11;
    b.vx *= 0.985;
    if (!b.smoke && b.y >= groundAt(b.x)){ b.y = groundAt(b.x); b.vx *= 0.4; b.vy = 0; }
    if (--b.life <= 0) bits.splice(i, 1);
  }

  if (G.mode === 'title' || G.mode === 'load') return;

  updateBodies();

  if (G.mode === 'aim'){
    if (G.vsCpu && G.turn === 1 && ++G.cpuThink > 42) cpuShoot(P[G.turn]);
  } else if (G.mode === 'fly'){
    stepShots();
    if (!shots.length){ G.mode = 'resolve'; G.settleT = 34; }
  } else if (G.mode === 'resolve'){
    const falling = P.some(p => !p.dead && p.y < groundAt(p.x) - p.r - 0.5);
    if (!falling && --G.settleT <= 0) endTurn();
  }
}

/* ------------------------------------------------------------------ *
 * DRAW
 * ------------------------------------------------------------------ */
function text(str, x, y, col, size, align){
  ctx.fillStyle = col || '#e8eefb';
  ctx.font = '700 ' + (size || 8) + 'px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
  ctx.fillText(str, Math.round(x), Math.round(y));
  ctx.textAlign = 'left';
}
function sh(str, x, y, col, size, align){
  text(str, x + 1, y + 1, 'rgba(0,0,0,.8)', size, align);
  text(str, x, y, col, size, align);
}

function drawArena(a){
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, a.sky[0]); g.addColorStop(0.55, a.sky[1]); g.addColorStop(1, a.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = 'rgba(255,255,255,.26)';
  for (let i = 0; i < 34; i++) ctx.fillRect((i * 97) % VW, (i * 41) % 96, 1, 1);
  a.back(0);
}

function drawTerrain(a){
  ctx.beginPath();
  ctx.moveTo(0, VH);
  for (let x = 0; x < VW; x++) ctx.lineTo(x, T[x]);
  ctx.lineTo(VW, VH); ctx.closePath();
  ctx.fillStyle = a.turf; ctx.fill();
  ctx.strokeStyle = a.cap; ctx.lineWidth = 2;
  ctx.beginPath();
  for (let x = 0; x < VW; x++) x === 0 ? ctx.moveTo(x, T[x]) : ctx.lineTo(x, T[x]);
  ctx.stroke();
  ctx.strokeStyle = a.stripe; ctx.lineWidth = 1;
  for (let x = 24; x < VW; x += 48){
    ctx.beginPath(); ctx.moveTo(x + 0.5, T[x]); ctx.lineTo(x + 0.5, VH); ctx.stroke();
  }
}

// barrel + crest, drawn BEFORE the ground so a buried crest is covered by it
function drawCrestBody(p, dim){
  const lg = LOGO[TEAMS[p.team].key];
  if (!lg) return;
  const a = p.angle * Math.PI / 180;
  ctx.strokeStyle = p.dead ? '#4b5568' : lg.accent;
  ctx.lineWidth = 4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(a) * 25, p.y - Math.sin(a) * 25); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.globalAlpha = p.dead ? 0.34 : (dim ? 0.74 : 1);
  ctx.drawImage(p.sprite, p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  ctx.globalAlpha = 1;
}

function drawBars(){
  for (const p of P){
    const bw = 34, bx = p.x - bw/2;
    const by = Math.min(p.y - p.r - 10, groundAt(p.x) - p.r * 2 - 10);
    ctx.fillStyle = 'rgba(0,0,0,.66)'; ctx.fillRect(bx - 1, by - 1, bw + 2, 6);
    ctx.fillStyle = p.hp > 55 ? '#6fe08a' : p.hp > 25 ? '#ffd257' : '#ff6b5c';
    ctx.fillRect(bx, by, Math.round(bw * p.hp / 100), 4);
    if (buried(p) && !p.dead) sh('BURIED', p.x, by - 11, '#b98a4a', 8, 'center');
  }
}

function drawShots(){
  for (const s of shots){
    const tint = TINT[s.w.id];
    ctx.strokeStyle = tint; ctx.lineWidth = 1; ctx.globalAlpha = 0.42;
    ctx.beginPath();
    s.trail.forEach((t, i) => i ? ctx.lineTo(t.x, t.y) : ctx.moveTo(t.x, t.y));
    ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = tint;
    const r = s.w.kind === 'sniper' ? 1.8 : s.w.r >= 30 ? 3.6 : 2.6;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.284); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(s.x - 0.6, s.y - 0.6, r * 0.42, 0, 6.284); ctx.fill();
  }
}

function drawBits(){
  for (const b of bits){
    const k = b.life / b.max;
    ctx.globalAlpha = Math.max(0, b.smoke ? k * 0.5 : k);
    ctx.fillStyle = b.smoke ? '#8d93a4' : b.c;
    const s = b.smoke ? 3 : 2;
    ctx.fillRect(Math.round(b.x), Math.round(b.y), s, s);
  }
  ctx.globalAlpha = 1;
}

function drawHUD(){
  const p = P[G.turn];
  const lg = LOGO[TEAMS[p.team].key] || { accent:'#8fb6ff', light:'#dbe6f7' };
  ctx.fillStyle = 'rgba(5,9,16,.82)'; ctx.fillRect(0, 0, VW, 17);
  ctx.fillStyle = lg.accent; ctx.fillRect(0, 17, VW, 1);
  sh(TEAMS[p.team].name + (G.turn === G.home ? '  (H)' : ''), 5, 5, lg.light, 9);

  const wx = VW / 2;
  sh('WIND', wx - 44, 5, '#8ea0bd', 8, 'right');
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(wx - 40, 8, 80, 3);
  const ww = G.wind * 40;
  ctx.fillStyle = Math.abs(G.wind) > 0.6 ? '#ff9a6b' : '#8fd0ff';
  ctx.fillRect(wx + (ww < 0 ? ww : 0), 8, Math.abs(ww), 3);
  ctx.fillStyle = '#e8eefb'; ctx.fillRect(wx - 1, 6, 2, 7);

  sh(G.wins[0] + ' - ' + G.wins[1], VW - 5, 5, '#ffe9a8', 9, 'right');

  if (G.bannerT > 0){
    ctx.globalAlpha = Math.min(1, G.bannerT / 30);
    const w = WEAPONS.find(x => FLAVOUR[x.id].includes(G.banner));
    sh(G.banner, VW/2, 24, w ? TINT[w.id] : '#ffd86b', 11, 'center');
    ctx.globalAlpha = 1;
  }
  if (G.msgT > 0){
    ctx.globalAlpha = Math.min(1, G.msgT / 30);
    sh(G.msg, VW/2, VH - 16, '#ffe9a8', 9, 'center');
    ctx.globalAlpha = 1;
  }
}

function drawField(){
  const a = G.arena || ARENAS._default;
  let ox = 0, oy = 0;
  if (G.shake > 0){ ox = (Math.random()-0.5) * G.shake; oy = (Math.random()-0.5) * G.shake; }
  ctx.save(); ctx.translate(Math.round(ox), Math.round(oy));
  drawArena(a);
  P.forEach((p, i) => drawCrestBody(p, G.mode === 'aim' && i !== G.turn));
  drawTerrain(a);
  drawBits(); drawShots(); drawBars();
  ctx.restore();
  drawHUD();
}

/* ------------------------------------------------------------------ *
 * SCREENS
 * ------------------------------------------------------------------ */
let tt = 0;
function drawTitle(){
  tt++;
  drawArena(arenaFor(TEAMS[G.picks[0]].key));
  ctx.fillStyle = 'rgba(4,7,12,.62)'; ctx.fillRect(0, 0, VW, VH);
  sh('S C F L', VW/2, 12, '#ffd86b', 11, 'center');
  sh('TRADE WAR', VW/2, 25, '#f2f6ff', 24, 'center');

  [0, 1].forEach(side => {
    const cx = side === 0 ? VW * 0.27 : VW * 0.73;
    const t = TEAMS[G.picks[side]], lg = LOGO[t.key], on = side === G.pickSide;
    if (on){ ctx.strokeStyle = lg ? lg.accent : '#8fb6ff'; ctx.lineWidth = 1; ctx.strokeRect(cx - 32.5, 62.5, 65, 65); }
    if (lg) ctx.drawImage(lg.img, cx - 29, 66, 58, 58);
    sh(t.name, cx, 132, on ? (lg ? lg.light : '#fff') : '#8ea0bd', 9, 'center');
    sh(side === 0 ? 'HOME' : (G.vsCpu ? 'COMPUTER' : 'AWAY'), cx, 145, side === 0 ? '#ffd86b' : '#6b7b96', 8, 'center');
  });
  sh('VS', VW/2, 88, '#ff8a5c', 14, 'center');
  sh(arenaFor(TEAMS[G.picks[0]].key).name, VW/2, 164, '#8fd0ff', 10, 'center');
  sh('home field is the first club picked', VW/2, 178, '#5d6b83', 8, 'center');

  sh('← →  CLUB    ↑  SIDE    ↓  ' + (G.vsCpu ? '2 PLAYER' : 'VS COMPUTER') +
     (G.vsCpu ? '    TAB  ' + ['LOOSE','DECENT','SHARP'][G.cpuSkill] : ''),
     VW/2, 202, '#6b7b96', 8, 'center');
  if ((tt >> 4) % 2 === 0) sh('SPACE OR TAP TO START', VW/2, 224, '#e8eefb', 11, 'center');
  sh('first to 3 rounds takes it', VW/2, 246, '#4f5c73', 8, 'center');
}

function drawOver(){
  drawField();
  const won = G.winner;
  ctx.fillStyle = 'rgba(5,9,16,.90)'; ctx.fillRect(28, 66, VW - 56, 84);
  const lg = won >= 0 ? LOGO[TEAMS[P[won].team].key] : null;
  ctx.strokeStyle = lg ? lg.accent : '#8ea0bd'; ctx.lineWidth = 1;
  ctx.strokeRect(28.5, 66.5, VW - 57, 83);
  if (won >= 0){
    if (lg) ctx.drawImage(lg.img, VW/2 - 20, 72, 40, 40);
    sh(TEAMS[P[won].team].name, VW/2, 116, lg ? lg.light : '#fff', 12, 'center');
    sh(G.wins[won] >= 3 ? 'TAKES THE SERIES ' + G.wins[0] + '-' + G.wins[1]
                        : 'WINS THE ROUND ' + G.wins[0] + '-' + G.wins[1],
       VW/2, 132, '#ffe9a8', 9, 'center');
  } else sh('BOTH CRESTS DOWN', VW/2, 100, '#ff8a5c', 12, 'center');
  if ((tt++ >> 4) % 2 === 0)
    sh(G.wins[0] >= 3 || G.wins[1] >= 3 ? 'SPACE OR TAP FOR A NEW WAR' : 'SPACE OR TAP FOR THE NEXT ROUND',
       VW/2, 160, '#e8eefb', 9, 'center');
}

function render(){
  if (G.mode === 'title')     drawTitle();
  else if (G.mode === 'over') drawOver();
  else if (T)                 drawField();
}

/* ------------------------------------------------------------------ *
 * LOOP
 * ------------------------------------------------------------------ */
let acc = 0, last = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (!last) last = now;
  acc += Math.min(now - last, 250);
  last = now;
  let guard = 0;
  while (acc >= STEP && guard++ < 5){ tick(); acc -= STEP; }
  render();
}

(async function boot(){
  fit();
  await loadAssets();
  $('boot').classList.add('gone');
  G.picks[0] = Math.floor(Math.random() * TEAMS.length);
  G.picks[1] = (G.picks[0] + 1 + Math.floor(Math.random() * (TEAMS.length - 1))) % TEAMS.length;
  G.mode = 'title';
  syncUI();
  requestAnimationFrame(frame);
})();
</script>
