<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>SCFL Trade Wars</title>
<meta name="description" content="Turn-based artillery between two SCFL crests on destructible home fields.">
<meta name="theme-color" content="#070b12">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070b12'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='7' fill='%23a35d2c'/%3E%3Cpath d='M9 16h14M13 13v6M19 13v6' stroke='%23f4ead8' stroke-width='1.6'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#04060a;overflow:hidden;color:#dbe6f7;
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px}
  canvas{image-rendering:pixelated;display:block;box-shadow:0 0 0 2px #17202e,0 10px 40px rgba(0,0,0,.8)}
  #ctl{width:100%;max-width:700px;display:none;flex-direction:column;gap:7px}
  #ctl.on{display:flex}
  .row{display:flex;align-items:center;gap:7px}
  .lbl{width:54px;font-size:12px;font-weight:700;letter-spacing:1px;color:#8ea0bd;flex:none}
  .nudge{width:40px;height:40px;flex:none;border-radius:9px;border:2px solid #2b3548;
    background:#141c29;color:#cfdcef;font:700 20px/1 ui-monospace,monospace;
    display:flex;align-items:center;justify-content:center;touch-action:manipulation}
  .nudge:active{background:#22304a}
  input[type=range]{flex:1;min-width:60px;height:40px;background:transparent;-webkit-appearance:none;appearance:none}
  input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:#1b2434;border:1px solid #2b3548}
  input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:#1b2434;border:1px solid #2b3548}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-10px;
    border-radius:7px;background:#ffd86b;border:2px solid #7a5f27}
  input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:7px;background:#ffd86b;border:2px solid #7a5f27}
  .num{width:66px;height:40px;flex:none;text-align:center;border-radius:9px;
    border:2px solid #2b3548;background:#0e1622;color:#ffe9a8;
    font:700 17px/1 ui-monospace,monospace;-webkit-user-select:text;user-select:text}
  .num:focus{outline:none;border-color:#ffd86b;background:#161f2e}
  .act{flex:1;height:52px;border-radius:11px;border:2px solid #2b3548;background:#141c29;
    color:#dbe6f7;font:700 14px/1 ui-monospace,monospace;letter-spacing:.5px;
    display:flex;align-items:center;justify-content:center;gap:8px;touch-action:manipulation}
  .act:active{background:#22304a}
  #bFire{flex:1.1;background:#3a1a14;border-color:#8a4030;color:#ffd9cc;font-size:18px}
  #bFire:active{background:#5c281d}
  #ctl.locked{opacity:.4;pointer-events:none}
  #tray{position:fixed;inset:0;background:rgba(3,6,11,.88);display:none;
    align-items:center;justify-content:center;padding:16px;z-index:20}
  #tray.on{display:flex}
  #trayBox{width:100%;max-width:460px;background:#0b1420;border:2px solid #2b3548;border-radius:14px;overflow:hidden}
  #trayBox h3{font-size:12px;letter-spacing:2px;color:#8ea0bd;padding:12px 14px 8px;font-weight:700}
  .ammo{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid #1a2434}
  .ammo:active{background:#16202f}
  .dot{width:13px;height:13px;border-radius:50%;flex:none}
  .an{flex:1.1;font-size:13px;font-weight:700}
  .ad{flex:1.4;font-size:11px;color:#7f8fab}
  .ac{font-size:13px;font-weight:700;color:#ffd86b;width:32px;text-align:right}
  .ammo.out{opacity:.32}
  .ammo.sel{background:#16202f;box-shadow:inset 3px 0 0 #ffd86b}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    color:#56637a;font-size:13px;letter-spacing:2px;z-index:30;background:#04060a}
  #boot.gone{display:none}
</style>
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="ctl">
    <div class="row">
      <span class="lbl">ANGLE</span>
      <button class="nudge" id="aDn">&minus;</button>
      <input type="range" id="sAngle" min="5" max="175" step="1" value="45">
      <button class="nudge" id="aUp">+</button>
      <input class="num" id="nAngle" inputmode="numeric" value="45">
    </div>
    <div class="row">
      <span class="lbl">POWER</span>
      <button class="nudge" id="pDn">&minus;</button>
      <input type="range" id="sPower" min="5" max="100" step="1" value="62">
      <button class="nudge" id="pUp">+</button>
      <input class="num" id="nPower" inputmode="numeric" value="62">
    </div>
    <div class="row">
      <button class="act" id="bAmmo">AMMO</button>
      <button class="act" id="bFire">FIRE</button>
    </div>
  </div>
</div>
<div id="tray"><div id="trayBox"><h3>ORDNANCE</h3><div id="trayList"></div></div></div>
<div id="boot">LOADING THE LEAGUE&hellip;</div>

const FX = {};
let blasts = [];

const clamp = (v,a,b) => v < a ? a : v > b ? b : v;
const rnd = (a,b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ------------------------------------------------------------------ *
 * CANVAS
 * ------------------------------------------------------------------ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha:false });
cv.width = VW; cv.height = VH;
ctx.imageSmoothingEnabled = false;

function fit(){
  const ctl = document.getElementById('ctl');
  const ctlH = ctl.classList.contains('on') ? ctl.offsetHeight + 16 : 12;
  const s = Math.max(0.2, Math.min((innerWidth - 12) / VW, (innerHeight - ctlH - 12) / VH));
  cv.style.width  = Math.round(VW * s) + 'px';
  cv.style.height = Math.round(VH * s) + 'px';
}
addEventListener('resize', fit);

/* ------------------------------------------------------------------ *
 * TERRAIN — a bitmap. terCv holds the art with its alpha; SOL mirrors
 * that alpha as one byte per pixel so collision is an array lookup.
 * ------------------------------------------------------------------ */
const terCv = document.createElement('canvas');
terCv.width = VW; terCv.height = VH;
const terCx = terCv.getContext('2d', { willReadFrequently:true });
let SOL = new Uint8Array(VW * VH);

const solid = (x, y) =>
  x >= 0 && x < VW && y >= 0 && y < VH && SOL[(y | 0) * VW + (x | 0)] === 1;

function syncAlpha(x0, y0, x1, y1){
  x0 = clamp(x0 | 0, 0, VW - 1); x1 = clamp(x1 | 0, 0, VW - 1);
  y0 = clamp(y0 | 0, 0, VH - 1); y1 = clamp(y1 | 0, 0, VH - 1);
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  if (w <= 0 || h <= 0) return;
  const d = terCx.getImageData(x0, y0, w, h).data;
  for (let y = 0; y < h; y++){
    const row = (y0 + y) * VW + x0;
    for (let x = 0; x < w; x++) SOL[row + x] = d[(y * w + x) * 4 + 3] > 128 ? 1 : 0;
  }
}
const syncAll = () => syncAlpha(0, 0, VW - 1, VH - 1);

/* Blasts remove ground. */
function carve(cx, cy, r){
  terCx.save();
  terCx.globalCompositeOperation = 'destination-out';
  // MUST be fully opaque: destination-out removes only as much alpha as it
  // paints, and the ground pass leaves a translucent fillStyle behind.
  terCx.fillStyle = '#000';
  terCx.beginPath(); terCx.arc(cx, cy, r, 0, 6.284); terCx.fill();
  for (let i = 0; i < 5; i++){          // ragged rim, so craters aren't perfect circles
    const a = rnd(0, 6.283), d = r * rnd(0.6, 1.0);
    terCx.beginPath(); terCx.arc(cx + Math.cos(a)*d, cy + Math.sin(a)*d, r * rnd(0.2, 0.4), 0, 6.284); terCx.fill();
  }
  terCx.restore();
  syncAlpha(cx - r - 6, cy - r - 6, cx + r + 6, cy + r + 6);
}

/* Shit talk adds ground, right on top of whoever it hits. */
function heapUp(cx, cy, r, height){
  terCx.save();
  const g = terCx.createLinearGradient(0, cy - height, 0, cy + 10);
  g.addColorStop(0, '#8a6a37'); g.addColorStop(1, '#4a3620');
  terCx.fillStyle = g;
  terCx.beginPath();
  terCx.moveTo(cx - r, cy + 8);
  for (let dx = -r; dx <= r; dx++){
    const k = 1 - Math.abs(dx) / r;
    terCx.lineTo(cx + dx, cy + 8 - height * k * k * (3 - 2 * k));
  }
  terCx.lineTo(cx + r, cy + 8);
  terCx.closePath(); terCx.fill();
  terCx.fillStyle = 'rgba(30,20,10,.5)';
  for (let i = 0; i < 26; i++)
    terCx.fillRect(cx + rnd(-r, r), cy + 8 - rnd(0, height * 0.8), 3, 3);
  terCx.restore();
  syncAlpha(cx - r - 4, cy - height - 12, cx + r + 4, cy + 14);
}

/* ------------------------------------------------------------------ *
 * COLLAPSE — one flood fill from the bottom marks everything still
 * attached. Whatever it misses lifts out as a single falling layer.
 * ------------------------------------------------------------------ */
let falling = null;
const SUP = new Uint8Array(VW * VH);
const FSTACK = new Int32Array(VW * VH);

function collapse(){
  if (falling) return false;
  SUP.fill(0);
  let sp = 0;
  for (let x = 0; x < VW; x++){
    const i = (VH - 1) * VW + x;
    if (SOL[i] && !SUP[i]){ SUP[i] = 1; FSTACK[sp++] = i; }
  }
  while (sp > 0){
    const i = FSTACK[--sp], x = i % VW, y = (i / VW) | 0;
    let j;
    if (x > 0)      { j = i - 1;  if (SOL[j] && !SUP[j]){ SUP[j] = 1; FSTACK[sp++] = j; } }
    if (x < VW - 1) { j = i + 1;  if (SOL[j] && !SUP[j]){ SUP[j] = 1; FSTACK[sp++] = j; } }
    if (y > 0)      { j = i - VW; if (SOL[j] && !SUP[j]){ SUP[j] = 1; FSTACK[sp++] = j; } }
    if (y < VH - 1) { j = i + VW; if (SOL[j] && !SUP[j]){ SUP[j] = 1; FSTACK[sp++] = j; } }
  }

  let n = 0, x0 = VW, y0 = VH, x1 = -1, y1 = -1;
  for (let y = 0; y < VH; y++){
    const row = y * VW;
    for (let x = 0; x < VW; x++){
      const i = row + x;
      if (SOL[i] && !SUP[i]){
        n++;
        if (x < x0) x0 = x; if (x > x1) x1 = x;
        if (y < y0) y0 = y; if (y > y1) y1 = y;
      }
    }
  }
  if (n === 0) return false;

  // too small to be a falling body — let it go as debris
  if (n < MIN_CHUNK){
    const img = terCx.getImageData(x0, y0, x1 - x0 + 1, y1 - y0 + 1);
    const d = img.data, w = x1 - x0 + 1;
    for (let y = 0; y < img.height; y++)
      for (let x = 0; x < w; x++)
        if (!SUP[(y0 + y) * VW + x0 + x]) d[(y * w + x) * 4 + 3] = 0;
    terCx.putImageData(img, x0, y0);
    syncAlpha(x0, y0, x1, y1);
    for (let i = 0; i < 10; i++)
      bits.push({ x:rnd(x0,x1), y:rnd(y0,y1), vx:rnd(-1,1), vy:rnd(-1,0.5),
                  life:rnd(20,40), max:40, c:'#7a6a58', smoke:false });
    return true;
  }

  // lift the loose mass into its own layer
  const w = x1 - x0 + 1, h = y1 - y0 + 1;
  const src = terCx.getImageData(x0, y0, w, h);
  const cut = terCx.createImageData(w, h);
  for (let y = 0; y < h; y++){
    for (let x = 0; x < w; x++){
      const k = (y * w + x) * 4;
      if (!SUP[(y0 + y) * VW + x0 + x] && src.data[k + 3] > 128){
        cut.data[k] = src.data[k]; cut.data[k+1] = src.data[k+1];
        cut.data[k+2] = src.data[k+2]; cut.data[k+3] = src.data[k+3];
        src.data[k + 3] = 0;
      }
    }
  }
  terCx.putImageData(src, x0, y0);
  syncAlpha(x0, y0, x1, y1);

  const fc = document.createElement('canvas'); fc.width = w; fc.height = h;
  fc.getContext('2d').putImageData(cut, 0, 0);

  // lowest solid pixel per column — all the collision test needs
  const foot = new Int32Array(w).fill(-1);
  for (let x = 0; x < w; x++)
    for (let y = h - 1; y >= 0; y--)
      if (cut.data[(y * w + x) * 4 + 3] > 128){ foot[x] = y; break; }

  falling = { cv:fc, x:x0, y:y0, w, h, foot, off:0, vy:0 };
  return true;
}

function stepFalling(){
  if (!falling) return;
  const f = falling;
  f.vy = Math.min(f.vy + GRAV, 14);
  const next = f.off + f.vy;
  let hit = false;
  for (let x = 0; x < f.w; x++){
    if (f.foot[x] < 0) continue;
    const gx = f.x + x, gy = f.y + f.foot[x] + next + 1;
    if (gy >= VH - 1 || solid(gx, gy)){ hit = true; break; }
  }
  if (!hit){ f.off = next; return; }

  // settle: back off to the last clear offset, stamp in, then re-check
  let o = Math.floor(f.off);
  for (let t = 0; t < 20; t++){
    let blocked = false;
    for (let x = 0; x < f.w; x++){
      if (f.foot[x] < 0) continue;
      const gy = f.y + f.foot[x] + o + 1;
      if (gy >= VH - 1 || solid(f.x + x, gy)){ blocked = true; break; }
    }
    if (!blocked) o++; else break;
  }
  const dropped = o;
  terCx.drawImage(f.cv, f.x, f.y + dropped);
  syncAlpha(f.x - 2, f.y - 2, f.x + f.w + 2, f.y + f.h + dropped + 2);

  // masonry landing on a crest hurts, on the same curve as a fall
  for (const p of P){
    if (p.dead) continue;
    if (p.x >= f.x - 8 && p.x <= f.x + f.w + 8 &&
        p.y >= f.y + dropped - 8 && p.y <= f.y + f.h + dropped + 24){
      const d = Math.min(FALL_CAP, Math.round(dropped / FALL_PER) + 3);
      p.hp = Math.max(0, p.hp - d);
      say(TEAMS[p.team].name + ' CRUSHED  -' + d);
      if (p.hp <= 0) p.dead = true;
    }
  }
  for (let i = 0; i < 16; i++)
    bits.push({ x:rnd(f.x, f.x + f.w), y:f.y + f.h + dropped, vx:rnd(-2,2), vy:rnd(-2,0),
                life:rnd(24,48), max:48, c:'#9a8a78', smoke:Math.random() < 0.5 });
  const land = FX[f.w > 120 ? 'falling_dust' : 'debris_small'];
  if (land) blasts.push({ img:land, x:f.x + f.w/2, y:f.y + f.h + dropped - 10,
                          w:Math.max(90, f.w * 0.9), t:0, life:32, glow:false });
  Sound.thud(); G.shake = 9;
  falling = null;
  if (G.cascade < 6){ G.cascade++; collapse(); }
}

/* ------------------------------------------------------------------ *
 * SOUND
 * ------------------------------------------------------------------ */
const Sound = (() => {
  let ac = null, sfx = null;
  function ensure(){
    if (ac) return ac;
    ac = new (window.AudioContext || window.webkitAudioContext)();
    sfx = ac.createGain(); sfx.gain.value = 0.5; sfx.connect(ac.destination);
    return ac;
  }
  function tone(f, dur, type, vol, at, to){
    ensure();
    const t0 = at || ac.currentTime;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(f, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol == null ? 0.25 : vol, t0 + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    o.connect(g); g.connect(sfx); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function noise(dur, vol, at, lp){
    ensure();
    const t0 = at || ac.currentTime;
    const n = Math.floor(ac.sampleRate * dur);
    const buf = ac.createBuffer(1, n, ac.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * Math.pow(1 - i/n, 1.6);
    const s = ac.createBufferSource(); s.buffer = buf;
    const g = ac.createGain(); g.gain.value = vol == null ? 0.3 : vol;
    if (lp){ const f = ac.createBiquadFilter(); f.type='lowpass'; f.frequency.value = lp; s.connect(f); f.connect(g); }
    else s.connect(g);
    g.connect(sfx); s.start(t0);
  }
  return {
    resume(){ ensure(); if (ac.state === 'suspended') ac.resume(); },
    now(){ return ensure().currentTime; },
    fire(){ tone(220,0.16,'square',0.20,null,70); noise(0.09,0.16,null,1800); },
    boom(big){ noise(big?0.55:0.34, big?0.42:0.30, null, big?520:900);
               tone(big?70:100, big?0.42:0.26, 'triangle', 0.26, null, 34); },
    splat(){ noise(0.38,0.34,null,380); tone(90,0.30,'sine',0.20,null,42); },
    dig(){ noise(0.30,0.24,null,1300); tone(150,0.20,'triangle',0.14,null,60); },
    hex(){ const t=Sound.now(); [880,740,622,523].forEach((f,i)=>tone(f,0.22,'sine',0.16,t+i*0.07)); noise(0.4,0.10,t,2600); },
    hit(){ const t=Sound.now(); tone(660,0.07,'square',0.22,t); tone(440,0.16,'square',0.20,t+0.06,180); },
    thud(){ noise(0.20,0.26,null,260); tone(60,0.22,'sine',0.18,null,30); },
    swap(){ tone(520,0.05,'square',0.14); },
    dud(){ noise(0.14,0.12,null,700); },
    win(){ const t=Sound.now(); [523,659,784,1047,1319].forEach((f,i)=>tone(f,0.24,'square',0.22,t+i*0.11)); },
  };
})();

 * CRESTS
 * ------------------------------------------------------------------ */
const LOGO = {};
const BADGE = 128;

function dominantAccent(img){
  const n = 24;
  const c = document.createElement('canvas'); c.width = c.height = n;
  const x = c.getContext('2d', { willReadFrequently:true });
  x.drawImage(img, 0, 0, n, n);
  const d = x.getImageData(0, 0, n, n).data;
  const bins = new Map();
  for (let i = 0; i < d.length; i += 4){
    if (d[i+3] < 200) continue;
    const r = d[i], g = d[i+1], b = d[i+2];
    const mx = Math.max(r,g,b), mn = Math.min(r,g,b);
    if (mx < 45) continue;
    const sat = (mx - mn) / mx;
    if (sat < 0.18 && mx > 225) continue;
    const k = (r>>5)*64 + (g>>5)*8 + (b>>5);
    const e = bins.get(k) || { w:0, r:0, g:0, b:0, n:0 };
    e.w += 1 + sat*2.5; e.r += r; e.g += g; e.b += b; e.n++;
    bins.set(k, e);
  }
  let best = null;
  for (const e of bins.values()) if (!best || e.w > best.w) best = e;
  if (!best) return { accent:'#6fa8ff', light:'#cfe1ff' };
  const r = best.r/best.n, g = best.g/best.n, b = best.b/best.n;
  const hex = (a,b2,c2) => '#' + [a,b2,c2].map(v => Math.round(v).toString(16).padStart(2,'0')).join('');
  return { accent: hex(Math.min(255,r*1.15+30), Math.min(255,g*1.15+30), Math.min(255,b*1.15+30)),
           light:  hex(Math.min(255,r*0.45+140), Math.min(255,g*0.45+140), Math.min(255,b*0.45+140)) };
}

function badge(img, accent){
  const c = document.createElement('canvas'); c.width = c.height = BADGE;
  const x = c.getContext('2d');
  x.save();
  x.beginPath(); x.arc(BADGE/2, BADGE/2, BADGE/2 - 5, 0, 6.284); x.clip();
  x.fillStyle = '#0e1622'; x.fillRect(0, 0, BADGE, BADGE);
  x.drawImage(img, 4, 4, BADGE - 8, BADGE - 8);
  x.restore();
  x.lineWidth = 6; x.strokeStyle = accent;
  x.beginPath(); x.arc(BADGE/2, BADGE/2, BADGE/2 - 4, 0, 6.284); x.stroke();
  x.lineWidth = 3; x.strokeStyle = 'rgba(0,0,0,.72)';
  x.beginPath(); x.arc(BADGE/2, BADGE/2, BADGE/2 - 1.5, 0, 6.284); x.stroke();
  return c;
}

function placeholderLogo(i){
  const hue = (i * 360 / TEAMS.length) | 0;
  const c = document.createElement('canvas'); c.width = c.height = BADGE;
  const x = c.getContext('2d');
  x.fillStyle = 'hsl(' + hue + ',62%,48%)';
  x.beginPath(); x.arc(64, 64, 56, 0, 6.284); x.fill();
  x.strokeStyle = 'hsl(' + hue + ',70%,82%)'; x.lineWidth = 8; x.stroke();
  return c;
}

/* The delivered plates carry a border frame baked in: a band of opaque
   pixels across the top and solid columns down both edges. Left alone the
   top band is an invisible ceiling that detonates every high shot, and
   surfaceAt() finds it instead of the ground. Strip it on load. */
const FRAME_TOP = 18, FRAME_SIDE = 4;
/* Earlier plates shipped with a border frame baked in - an opaque band across
   the top and solid columns down both edges - which acted as an invisible
   ceiling and broke crest placement. The revised plates don't have it, so only
   strip what is actually there rather than blindly clearing good art. */
function deframe(){
  const fill = terCx.getImageData(0, 0, VW, VH).data;
  const rowFill = y => { let n = 0; for (let x = 0; x < VW; x++) if (fill[((y*VW+x)*4)+3] > 128) n++; return n; };
  const colFill = x => { let n = 0; for (let y = 0; y < VH; y++) if (fill[((y*VW+x)*4)+3] > 128) n++; return n; };
  let top = 0;  while (top < FRAME_TOP && rowFill(top) > VW * 0.5) top++;
  let left = 0; while (left < FRAME_SIDE && colFill(left) > VH * 0.9) left++;
  let right = 0; while (right < FRAME_SIDE && colFill(VW - 1 - right) > VH * 0.9) right++;
  if (!top && !left && !right) return;
  terCx.save();
  terCx.globalCompositeOperation = 'destination-out';
  terCx.fillStyle = '#000';
  if (top)   terCx.fillRect(0, 0, VW, top);
  if (left)  terCx.fillRect(0, 0, left, VH);
  if (right) terCx.fillRect(VW - right, 0, right, VH);
  terCx.restore();
}

function proceduralGround(){
  terCx.clearRect(0, 0, VW, VH);
  const base = VH * 0.70;
  const oct = [
    { len:rnd(860,1240), amp:rnd(52,76) }, { len:rnd(420,600), amp:rnd(24,40) },
    { len:rnd(210,310),  amp:rnd(10,18) }, { len:rnd(110,160), amp:rnd(3,7)   },
  ].map(o => Object.assign(o, { ph:rnd(0,6.283) }));
  const h = new Float32Array(VW);
  for (let x = 0; x < VW; x++){
    let y = base;
    for (const o of oct) y += Math.sin(x / o.len * 6.283 + o.ph) * o.amp;
    h[x] = clamp(y, VH * 0.34, VH - 40);
  }
  terCx.beginPath();
  terCx.moveTo(0, VH);
  for (let x = 0; x < VW; x++) terCx.lineTo(x, h[x]);
  terCx.lineTo(VW, VH); terCx.closePath();
  terCx.fillStyle = '#2c5c34'; terCx.fill();
  terCx.strokeStyle = '#59ad63'; terCx.lineWidth = 4;
  terCx.beginPath();
  for (let x = 0; x < VW; x++) x ? terCx.lineTo(x, h[x]) : terCx.moveTo(x, h[x]);
  terCx.stroke();
  terCx.fillStyle = 'rgba(0,0,0,.18)';
  for (let x = 0; x < VW; x += 96) terCx.fillRect(x, 0, 2, VH);
}

function proceduralSky(){
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#070b14'); g.addColorStop(0.5, '#132038'); g.addColorStop(1, '#2b2438');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);
  ctx.fillStyle = 'rgba(255,235,190,.05)';
  for (let i = 0; i < 5; i++){
    const lx = 80 + i * 210;
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx - 76, 260); ctx.lineTo(lx + 76, 260); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = '#0a111d'; ctx.fillRect(0, 216, VW, 100);
  for (let i = 0; i < 260; i++){
    ctx.fillStyle = ['#20304a','#27384f','#1a2740'][i % 3];
    ctx.fillRect((i * 47) % VW, 224 + ((i * 19) % 84), 4, 4);
  }
}

/* ------------------------------------------------------------------ *
 * STATE
 * ------------------------------------------------------------------ */
const G = {
  mode:'load', vsCpu:true, cpuSkill:1,
  pickSide:0, picks:[0, 9], home:0,
  turn:0, wind:0, shake:0, cascade:0,
  msg:'', msgT:0, banner:'', bannerT:0,
  wins:[0,0], winner:-1, arena:null, cpuThink:0, settleT:0,
};
let P = [], shots = [], bits = [];
const say = m => { G.msg = m; G.msgT = 130; };

/* Surface directly beneath a point: first solid pixel scanning down. */
function surfaceAt(x, fromY){
  for (let y = Math.max(0, fromY | 0); y < VH; y++) if (solid(x, y)) return y;
  return VH;
}

function makeSprite(key){
  const c = document.createElement('canvas'); c.width = c.height = BADGE;
  c.getContext('2d').drawImage(LOGO[key].img, 0, 0);
  return c;
}

/* Crests chip where they are hit, at a fraction of the ground's rate.
   Cosmetic only — the hitbox stays a circle. */
function erode(p, cx, cy, r){
  const g = p.sprite.getContext('2d');
  const s = BADGE / (CREST_R * 2);
  const lx = (cx - p.x) * s + BADGE/2, ly = (cy - p.y) * s + BADGE/2, lr = r * EROSION * s;
  g.save();
  g.globalCompositeOperation = 'destination-out';
  g.fillStyle = '#000';
  g.beginPath(); g.arc(lx, ly, lr, 0, 6.284); g.fill();
  for (let i = 0; i < 3; i++){
    const a = rnd(0, 6.283), d = lr * rnd(0.5, 1.0);
    g.beginPath(); g.arc(lx + Math.cos(a)*d, ly + Math.sin(a)*d, lr * rnd(0.28, 0.5), 0, 6.284); g.fill();
  }
  g.restore();
}

/* How much ground sits on the straight line between two points. Zero means
   they can shoot flat at each other, which makes for a dull duel. */
function lineCover(ax, ay, bx, by){
  const n = Math.ceil(Math.hypot(bx - ax, by - ay) / 3);
  let hits = 0;
  for (let i = 1; i < n; i++)
    if (solid(ax + (bx - ax) * i / n, ay + (by - ay) * i / n)) hits++;
  return hits;
}

/* A standable spot: ground under it, headroom above it, not down a pit. */
function standable(x){
  const y = surfaceAt(x, FRAME_TOP + 4);
  if (y >= VH - 10 || y < FRAME_TOP + CREST_R) return null;
  if (solid(x, y - CREST_R - 8)) return null;
  // needs real footing, not a mushroom cap or the lip of a terrace: a thin
  // ledge leaves a crest standing on nothing the moment anything shifts
  let thick = 0;
  for (let d = 1; d <= 14; d++) if (solid(x, y + d)) thick++;
  if (thick < 10) return null;
  // and wide enough to sit on
  if (!solid(x - CREST_R * 0.6, y + 6) || !solid(x + CREST_R * 0.6, y + 6)) return null;
  return { x, y };
}

/* Pick the pair of footings that gives the best fight: ground between them
   so the shot has to arc, and a height difference so the two ends are not
   mirror images. Falls back to whatever is standable if the map is flat. */
function pickSpawns(){
  const gather = (lo, hi) => {
    const out = [];
    for (let t = 0; t < 400 && out.length < 26; t++){
      const c = standable(Math.round(rnd(lo, hi)));
      if (c) out.push(c);
    }
    return out;
  };
  const L = gather(60, VW * 0.30), R = gather(VW * 0.70, VW - 60);
  if (!L.length || !R.length){
    return [L[0] || { x:80, y:surfaceAt(80, FRAME_TOP + 4) },
            R[0] || { x:VW - 80, y:surfaceAt(VW - 80, FRAME_TOP + 4) }];
  }
  let best = null;
  for (const a of L) for (const b of R){
    const cover = lineCover(a.x, a.y - CREST_R, b.x, b.y - CREST_R);
    const drop  = Math.abs(a.y - b.y);
    // reward cover up to a point, then reward height difference
    const score = Math.min(cover, 26) * 4 + drop * 0.35 + rnd(0, 8);
    if (!best || score > best.score) best = { score, a, b, cover, drop };
  }
  return [best.a, best.b];
}

function makePlayers(){
  const [a, b] = pickSpawns();
  P = [
    { team:G.picks[0], x:a.x, side: 1, hp:100, angle: 50, power:62, r:CREST_R, wep:0, ammo:{}, dead:false, vy:0, fall:0, hexed:false },
    { team:G.picks[1], x:b.x, side:-1, hp:100, angle:130, power:62, r:CREST_R, wep:0, ammo:{}, dead:false, vy:0, fall:0, hexed:false },
  ];
  P.forEach((p, i) => {
    for (const w of WEAPONS) p.ammo[w.id] = w.ammo;
    p.sprite = makeSprite(TEAMS[p.team].key);
    p.y = (i === 0 ? a.y : b.y) - p.r;
  });
}

function updateBodies(){
  for (const p of P){
    if (p.dead) continue;
    const surf = surfaceAt(p.x, p.y - p.r + 2);
    const rest = surf - p.r;
    if (p.y < rest - 0.5){
      p.vy += GRAV; p.y += p.vy; p.fall += p.vy;
      if (p.y >= rest){
        p.y = rest;
        if (p.fall > FALL_GRACE){
          const d = Math.min(FALL_CAP, Math.round((p.fall - FALL_GRACE) / FALL_PER));
          if (d > 0){
            p.hp = Math.max(0, p.hp - d); Sound.thud();
            say(TEAMS[p.team].name + ' FELL  -' + d);
            if (p.hp <= 0) p.dead = true;
          }
        }
        p.vy = 0; p.fall = 0;
      }
    } else { p.vy = 0; p.fall = 0; }
  }
}

const buried = p => solid(p.x, p.y - p.r - 6);

/* ------------------------------------------------------------------ *
 * FIRING
 * ------------------------------------------------------------------ */
const muzzle = p => {
  const a = p.angle * Math.PI / 180;
  return { x: p.x + Math.cos(a) * 44, y: p.y - Math.sin(a) * 44 };
};

function fire(p){
  const w = WEAPONS[p.wep];
  if (p.ammo[w.id] === 0){ Sound.dud(); say('OUT OF ' + w.name); return; }
  if (p.ammo[w.id] > 0) p.ammo[w.id]--;

  const m = muzzle(p);
  // Cursed: whatever you fire goes off in your face, however you aimed.
  if (p.hexed){
    p.hexed = false;
    const a = p.angle * Math.PI / 180;
    shots.push({ x:m.x, y:m.y, vx:Math.cos(a)*1.6, vy:-Math.sin(a)*1.6, w, owner:P.indexOf(p), trail:[], fuse:7 });
    G.banner = 'THE CURSE TAKES IT'; G.bannerT = 170;
    Sound.hex();
  } else {
    const ang = p.angle + (w.scAng ? rnd(-w.scAng, w.scAng) : 0);
    const pwr = clamp(p.power * (1 + (w.scPwr ? rnd(-w.scPwr, w.scPwr)/100 : 0)), 5, MAX_POWER);
    const a = ang * Math.PI / 180, v = pwr * V_PER_PWR * w.speed;
    shots.push({ x:m.x, y:m.y, vx:Math.cos(a)*v, vy:-Math.sin(a)*v, w, owner:P.indexOf(p), trail:[], fuse:0 });
    G.banner = pick(FLAVOUR[w.id]); G.bannerT = 160;
  }
  Sound.fire();
  G.mode = 'fly';
  syncUI();
}

function explode(s, cx, cy){
  const w = s.w;
  cx = clamp(cx, 0, VW - 1); cy = clamp(cy, 0, VH - 1);

  if (w.kind === 'heap'){
    heapUp(cx, cy, w.r, 84);   // must clear a 64px crest to actually bury it
    Sound.splat(); G.shake = 8;
    const puff = FX[Math.random() < 0.5 ? 'dust_puff' : 'dust_cloud'];
    if (puff) blasts.push({ img:puff, x:cx, y:cy - 10, w:w.r * 2.4, t:0, life:30, glow:false });
    for (let i = 0; i < 30; i++){
      const a = rnd(0, 6.283), sp = rnd(0.5, 3.0);
      bits.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1.6,
                  life:rnd(22,48), max:48, c: i % 3 ? '#7c5a2e' : '#4f3a1d', smoke:false });
    }
  } else {
    carve(cx, cy, w.r);
    const big = w.r >= 60;
    // salvaged explosion art, scaled to the blast it belongs to
    const band = w.r >= 60 ? ['explosion_large_1','explosion_large_2','explosion_large_3']
               : w.r >= 30 ? ['explosion_medium_1','explosion_medium_2']
                           : ['explosion_small_1','explosion_small_2','explosion_small_3'];
    const sprite = FX[pick(band)];
    if (sprite) blasts.push({ img:sprite, x:cx, y:cy, w:w.r * 2.6, t:0, life:24, glow:true });
    w.kind === 'dig' ? Sound.dig() : Sound.boom(big);
    G.shake = big ? 16 : 10;
    for (let i = 0; i < (big ? 40 : 24); i++){
      const a = rnd(0, 6.283), sp = rnd(0.8, big ? 6 : 4);
      bits.push({ x:cx, y:cy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1,
                  life:rnd(24,56), max:56, c:w.tint, smoke:Math.random() < 0.45 });
    }
  }

  const reach = w.r + BLAST_PAD;
  P.forEach((p, i) => {
    if (p.dead) return;
    const d = Math.hypot(p.x - cx, p.y - cy);
    if (d > reach + p.r) return;
    erode(p, cx, cy, w.r);
    let dmg = w.dmg * (1 - d / (reach + p.r));
    if (w.kind === 'sniper' && d < p.r + 8) dmg = w.dmg;
    dmg = Math.round(dmg);
    if (w.kind === 'hex' && i !== s.owner && d < reach){
      p.hexed = true;
      say(TEAMS[p.team].name + ' IS CURSED');
      Sound.hex();
    }
    if (dmg <= 0) return;
    p.hp = Math.max(0, p.hp - dmg);
    Sound.hit();
    say((i === s.owner ? 'OWN GOAL — ' : '') + TEAMS[p.team].name + '  -' + dmg);
    if (p.hp <= 0) p.dead = true;
  });

  G.cascade = 0;
  collapse();
}

function stepShots(){
  for (let i = shots.length - 1; i >= 0; i--){
    const s = shots[i];
    let gone = false;
    for (let k = 0; k < SUBSTEPS && !gone; k++){
      const dt = 1 / SUBSTEPS;
      if (s.fuse > 0){
        s.fuse -= dt;
        if (s.fuse <= 0){ explode(s, s.x, s.y); gone = true; break; }
      }
      s.vy += GRAV * dt;
      s.vx += G.wind * WIND_ACC * s.w.wind * dt;
      s.x += s.vx * dt; s.y += s.vy * dt;
      if (s.x < -140 || s.x > VW + 140 || s.y > VH + 200){ gone = true; break; }
      for (const p of P){
        if (p.dead) continue;
        if (Math.hypot(p.x - s.x, p.y - s.y) < p.r + 3){ explode(s, s.x, s.y); gone = true; break; }
      }
      if (gone) break;
      if (solid(s.x, s.y)){ explode(s, s.x, s.y); gone = true; break; }
    }
    if (gone) shots.splice(i, 1);
    else { s.trail.push({ x:s.x, y:s.y }); if (s.trail.length > 40) s.trail.shift(); }
  }
}

function endTurn(){
  const alive = P.filter(p => !p.dead);
  if (alive.length < 2){
    G.winner = alive.length === 1 ? P.indexOf(alive[0]) : -1;
    if (G.winner >= 0) G.wins[G.winner]++;
    Sound.win(); G.mode = 'over'; syncUI(); return;
  }
  G.turn = 1 - G.turn;
  G.wind = clamp(G.wind + rnd(-0.35, 0.35), -1, 1);
  G.mode = 'aim'; G.cpuThink = 0;
  syncUI();
}

/* ------------------------------------------------------------------ *
 * THE OPPOSITION
 * ------------------------------------------------------------------ */
function simulate(from, angle, power, w){
  const a = angle * Math.PI / 180, v = power * V_PER_PWR * w.speed;
  let x = from.x + Math.cos(a) * 44, y = from.y - Math.sin(a) * 44;
  let vx = Math.cos(a) * v, vy = -Math.sin(a) * v;
  for (let f = 0; f < 1400; f++){
    vy += GRAV; vx += G.wind * WIND_ACC * w.wind;
    x += vx; y += vy;
    if (x < -120 || x > VW + 120 || y > VH + 160) return { x, y, off:true };
    if (solid(x, y)) return { x, y, off:false };
  }
  return { x, y, off:true };
}

function cpuShoot(p){
  const foe = P[1 - P.indexOf(p)];
  if (p.hexed){                        // burn the cheapest round to break it
    p.wep = WEAPONS.findIndex(w => w.id === 'lowball');
    fire(p); return;
  }
  if (buried(p)){                      // dig out — that is what Veto is for
    p.wep = WEAPONS.findIndex(w => w.id === 'veto');
    p.angle = 90; p.power = 12; fire(p); return;
  }
  const usable = WEAPONS.filter(w => p.ammo[w.id] !== 0 && w.id !== 'veto');
  let best = null;
  for (let i = 0; i < 260; i++){
    const w = pick(usable);
    const angle = p.side > 0 ? rnd(18, 84) : rnd(96, 162);
    const power = rnd(30, MAX_POWER);
    const hit = simulate(p, angle, power, w);
    const d = hit.off ? 1e6 : Math.hypot(hit.x - foe.x, hit.y - foe.y);
    const reach = w.r + BLAST_PAD + foe.r;
    let score = d >= reach ? -d / 1000 : w.dmg * (1 - d / reach);
    if (w.id === 'curse') score = d < reach ? 30 : -d / 1000;
    if (w.scAng) score *= 1 - w.scAng / 18;
    if (w.ammo > 0) score *= 0.5 + 0.5 * (p.ammo[w.id] / w.ammo);
    if (!best || score > best.score) best = { score, angle, power, w };
  }
  if (!best) best = { angle: p.side > 0 ? 45 : 135, power: 60, w: WEAPONS[0] };
  const slop = [11, 5, 1.6][G.cpuSkill];
  p.angle = clamp(best.angle + rnd(-slop, slop), 5, 175);
  p.power = clamp(best.power + rnd(-slop, slop) * 1.6, 5, MAX_POWER);
  p.wep = WEAPONS.indexOf(best.w);
  fire(p);
}

/* ------------------------------------------------------------------ *
 * CONTROLS
 * ------------------------------------------------------------------ */
const el = id => document.getElementById(id);
const UI = { ctl:el('ctl'), sA:el('sAngle'), nA:el('nAngle'), sP:el('sPower'), nP:el('nPower'),
             ammo:el('bAmmo'), fire:el('bFire'), tray:el('tray'), list:el('trayList') };

const myTurn = () => G.mode === 'aim' && !(G.vsCpu && G.turn === 1);

function syncUI(){
  const on = G.mode === 'aim' || G.mode === 'fly' || G.mode === 'resolve';
  UI.ctl.classList.toggle('on', on);
  UI.ctl.classList.toggle('locked', !myTurn());
  if (!P.length) return;
  const p = P[G.turn];
  UI.sA.value = Math.round(p.angle); UI.sP.value = Math.round(p.power);
  if (document.activeElement !== UI.nA) UI.nA.value = Math.round(p.angle);
  if (document.activeElement !== UI.nP) UI.nP.value = Math.round(p.power);
  const w = WEAPONS[p.wep], n = p.ammo[w.id];
  UI.ammo.textContent = w.name + (n < 0 ? '  ∞' : '  ×' + n);
  UI.ammo.style.color = w.tint;
  fit();
}

function setAngle(v){ const p = P[G.turn]; if (!p) return; p.angle = clamp(v, 5, 175); syncUI(); }
function setPower(v){ const p = P[G.turn]; if (!p) return; p.power = clamp(v, 5, MAX_POWER); syncUI(); }

UI.sA.addEventListener('input', () => myTurn() && setAngle(+UI.sA.value));
UI.sP.addEventListener('input', () => myTurn() && setPower(+UI.sP.value));
const commit = (inp, fn) => {
  const v = parseInt(inp.value, 10);
  if (!isNaN(v)) fn(v); else syncUI();
  inp.blur();
};
UI.nA.addEventListener('change', () => commit(UI.nA, setAngle));
UI.nP.addEventListener('change', () => commit(UI.nP, setPower));
UI.nA.addEventListener('keydown', e => { if (e.key === 'Enter') commit(UI.nA, setAngle); });
UI.nP.addEventListener('keydown', e => { if (e.key === 'Enter') commit(UI.nP, setPower); });

let repeat = null;
function nudge(btn, fn, d){
  const go = e => {
    e.preventDefault(); Sound.resume();
    if (!myTurn()) return;
    fn(d);
    let n = 0;
    repeat = setInterval(() => { if (++n > 3) fn(d); }, 90);
  };
  const stop = () => { clearInterval(repeat); repeat = null; };
  btn.addEventListener('pointerdown', go);
  addEventListener('pointerup', stop);
  addEventListener('pointercancel', stop);
}
nudge(el('aDn'), d => setAngle(P[G.turn].angle + d), -1);
nudge(el('aUp'), d => setAngle(P[G.turn].angle + d),  1);
nudge(el('pDn'), d => setPower(P[G.turn].power + d), -1);
nudge(el('pUp'), d => setPower(P[G.turn].power + d),  1);

function openTray(){
  if (!myTurn()) return;
  const p = P[G.turn];
  UI.list.innerHTML = '';
  WEAPONS.forEach((w, i) => {
    const n = p.ammo[w.id];
    const row = document.createElement('div');
    row.className = 'ammo' + (n === 0 ? ' out' : '') + (i === p.wep ? ' sel' : '');
    row.innerHTML = '<span class="dot" style="background:' + w.tint + '"></span>' +
                    '<span class="an">' + w.name + '</span>' +
                    '<span class="ad">' + w.desc + '</span>' +
                    '<span class="ac">' + (n < 0 ? '∞' : n) + '</span>';
    row.onclick = () => { if (n !== 0){ p.wep = i; Sound.swap(); } UI.tray.classList.remove('on'); syncUI(); };
    UI.list.appendChild(row);
  });
  UI.tray.classList.add('on');
}
UI.ammo.addEventListener('click', () => { Sound.resume(); openTray(); });
UI.tray.addEventListener('click', e => { if (e.target === UI.tray) UI.tray.classList.remove('on'); });
UI.fire.addEventListener('click', () => { Sound.resume(); if (myTurn()) fire(P[G.turn]); });

let okEdge = false;
addEventListener('keydown', e => {
  if (document.activeElement === UI.nA || document.activeElement === UI.nP) return;
  Sound.resume();
  const k = e.code;
  if (k === 'Space' || k === 'Enter'){ e.preventDefault(); okEdge = true; if (myTurn()) fire(P[G.turn]); }
  if (!myTurn()) return;
  const step = e.shiftKey ? 5 : 1;
  if (k === 'ArrowUp'   || k === 'KeyW'){ e.preventDefault(); setAngle(P[G.turn].angle + step); }
  if (k === 'ArrowDown' || k === 'KeyS'){ e.preventDefault(); setAngle(P[G.turn].angle - step); }
  if (k === 'ArrowRight'|| k === 'KeyD'){ e.preventDefault(); setPower(P[G.turn].power + step); }
  if (k === 'ArrowLeft' || k === 'KeyA'){ e.preventDefault(); setPower(P[G.turn].power - step); }
  if (k === 'Tab' || k === 'KeyQ'){ e.preventDefault(); openTray(); }
});
cv.addEventListener('pointerdown', () => { okEdge = true; Sound.resume(); });

/* ------------------------------------------------------------------ *
 * ROUND
 * ------------------------------------------------------------------ */
async function newRound(keepScore){
  G.mode = 'load';
  G.home = G.picks[0];
  const key = TEAMS[G.home].key;
  G.arena = await loadArena(key);
  terCx.clearRect(0, 0, VW, VH);
  if (G.arena.terrain){ terCx.drawImage(G.arena.terrain, 0, 0, VW, VH); deframe(); }
  else proceduralGround();
  syncAll();
  makePlayers();
  shots = []; bits = []; blasts = []; falling = null;
  G.wind = rnd(-1, 1);
  G.turn = Math.random() < 0.5 ? 0 : 1;
  G.winner = -1;
  if (!keepScore) G.wins = [0, 0];
  G.mode = 'aim';
  say(G.arena.name);
  syncUI();
}

/* ------------------------------------------------------------------ *
 * UPDATE
 * ------------------------------------------------------------------ */
let titleT = 0;
function tick(){
  if (G.msgT > 0) G.msgT--;
  if (G.bannerT > 0) G.bannerT--;
  if (G.shake > 0){ G.shake *= 0.86; if (G.shake < 0.4) G.shake = 0; }

  for (let i = blasts.length - 1; i >= 0; i--) if (++blasts[i].t >= blasts[i].life) blasts.splice(i, 1);

  for (let i = bits.length - 1; i >= 0; i--){
    const b = bits[i];
    b.x += b.vx; b.y += b.vy;
    b.vy += b.smoke ? -0.02 : 0.22;
    b.vx *= 0.985;
    if (!b.smoke && solid(b.x, b.y)){ b.vy = 0; b.vx *= 0.4; }
    if (--b.life <= 0) bits.splice(i, 1);
  }

  if (G.mode === 'splash' || G.mode === 'select'){ okEdge = false; return; }
  if (G.mode === 'load') return;

  stepFalling();
  updateBodies();

  if (G.mode === 'aim'){
    if (G.vsCpu && G.turn === 1 && !falling){
      if (++G.cpuThink > 46) cpuShoot(P[1]);
    }
  } else if (G.mode === 'fly'){
    stepShots();
    if (!shots.length){ G.mode = 'resolve'; G.settleT = 30; }
  } else if (G.mode === 'resolve'){
    const busy = falling || P.some(p => !p.dead && p.vy !== 0);
    if (!busy && --G.settleT <= 0) endTurn();
  } else if (G.mode === 'over'){
    if (okEdge){
      okEdge = false;
      if (G.wins[0] >= 3 || G.wins[1] >= 3){ G.mode = 'select'; G.wins = [0,0]; syncUI(); }
      else newRound(true);
    }
  }
  okEdge = false;
}

/* ------------------------------------------------------------------ *
 * DRAW
 * ------------------------------------------------------------------ */
function text(str, x, y, col, size, align){
  ctx.fillStyle = col || '#e8eefb';
  ctx.font = '700 ' + (size || 16) + 'px ui-monospace, Menlo, Consolas, monospace';
  ctx.textAlign = align || 'left'; ctx.textBaseline = 'top';
  ctx.fillText(str, Math.round(x), Math.round(y));
  ctx.textAlign = 'left';
}
function sh(str, x, y, col, size, align){
  text(str, x + 2, y + 2, 'rgba(0,0,0,.82)', size, align);
  text(str, x, y, col, size, align);
}

function drawCrest(p, dim){
  const lg = LOGO[TEAMS[p.team].key];
  const a = p.angle * Math.PI / 180;
  ctx.strokeStyle = p.dead ? '#4b5568' : lg.accent;
  ctx.lineWidth = 7; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + Math.cos(a) * 40, p.y - Math.sin(a) * 40); ctx.stroke();
  ctx.lineCap = 'butt';
  ctx.globalAlpha = p.dead ? 0.32 : (dim ? 0.75 : 1);
  ctx.drawImage(p.sprite, p.x - p.r - 2, p.y - p.r - 2, (p.r + 2) * 2, (p.r + 2) * 2);
  ctx.globalAlpha = 1;

  if (p.hexed && !p.dead){
    const t = performance.now() / 260;
    ctx.strokeStyle = '#9fe8ff'; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++){
      const ang = t + i * 1.047, d = p.r + 12 + Math.sin(t * 2 + i) * 3;
      const x = p.x + Math.cos(ang) * d, y = p.y + Math.sin(ang) * d;
      ctx.beginPath(); ctx.moveTo(x - 4, y); ctx.lineTo(x + 4, y);
      ctx.moveTo(x, y - 4); ctx.lineTo(x, y + 4); ctx.stroke();
    }
  }

  const bw = 62, bx = p.x - bw/2, by = p.y - p.r - 18;
  ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fillRect(bx - 2, by - 2, bw + 4, 9);
  ctx.fillStyle = p.hp > 55 ? '#6fe08a' : p.hp > 25 ? '#ffd257' : '#ff6b5c';
  ctx.fillRect(bx, by, Math.round(bw * p.hp / 100), 5);
}

function drawHUD(){
  const p = P[G.turn];
  const lg = LOGO[TEAMS[p.team].key];
  ctx.fillStyle = 'rgba(5,9,16,.84)'; ctx.fillRect(0, 0, VW, 34);
  ctx.fillStyle = lg.accent; ctx.fillRect(0, 34, VW, 2);
  sh(TEAMS[p.team].name, 10, 9, lg.light, 17);

  const wx = VW / 2;
  sh('WIND', wx - 96, 10, '#8ea0bd', 15, 'right');
  ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fillRect(wx - 88, 16, 176, 6);
  const ww = G.wind * 88;
  ctx.fillStyle = Math.abs(G.wind) > 0.6 ? '#ff9a6b' : '#8fd0ff';
  ctx.fillRect(wx + (ww < 0 ? ww : 0), 16, Math.abs(ww), 6);
  ctx.fillStyle = '#e8eefb'; ctx.fillRect(wx - 2, 12, 4, 14);

  const w = WEAPONS[p.wep], n = p.ammo[w.id];
  sh(w.name + (n < 0 ? '' : ' ×' + n), VW - 10, 9, w.tint, 17, 'right');

  ctx.fillStyle = 'rgba(5,9,16,.76)'; ctx.fillRect(0, VH - 30, VW, 30);
  sh('AIM ' + Math.round(p.angle) + '°', 10, VH - 23, '#dbe6f7', 16);
  sh('PWR ' + Math.round(p.power), 150, VH - 23, '#dbe6f7', 16);
  sh(G.arena ? G.arena.name : '', wx, VH - 23, '#7f8fab', 15, 'center');
  sh('BEST OF 5   ' + G.wins[0] + ' – ' + G.wins[1], VW - 10, VH - 23, '#8ea0bd', 16, 'right');
}

function drawField(){
  let ox = 0, oy = 0;
  if (G.shake > 0){ ox = (Math.random()-0.5) * G.shake; oy = (Math.random()-0.5) * G.shake; }
  ctx.save(); ctx.translate(Math.round(ox), Math.round(oy));

  if (G.arena && G.arena.back) ctx.drawImage(G.arena.back, 0, 0, VW, VH);
  else proceduralSky();

  ctx.drawImage(terCv, 0, 0);
  if (falling) ctx.drawImage(falling.cv, falling.x, Math.round(falling.y + falling.off));

  P.forEach((p, i) => drawCrest(p, G.mode === 'aim' && i !== G.turn));

  for (const b of blasts){
    const k = b.t / b.life;
    const w2 = b.w * (0.72 + k * 0.5), h2 = w2 * (b.img.height / b.img.width);
    ctx.globalAlpha = k < 0.35 ? 1 : (1 - k) / 0.65;   // hold the flash, then fade
    if (b.glow) ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(b.img, b.x - w2/2, b.y - h2/2, w2, h2);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;

  for (const b of bits){
    ctx.globalAlpha = Math.max(0, (b.life / b.max) * (b.smoke ? 0.5 : 1));
    ctx.fillStyle = b.smoke ? '#8d93a4' : b.c;
    const s = b.smoke ? 5 : 3;
    ctx.fillRect(Math.round(b.x), Math.round(b.y), s, s);
  }
  ctx.globalAlpha = 1;

  for (const s of shots){
    ctx.strokeStyle = s.w.tint; ctx.lineWidth = 2; ctx.globalAlpha = 0.45;
    ctx.beginPath();
    s.trail.forEach((t, i) => i ? ctx.lineTo(t.x, t.y) : ctx.moveTo(t.x, t.y));
    ctx.stroke(); ctx.globalAlpha = 1;
    ctx.fillStyle = s.w.tint;
    const r = s.w.kind === 'sniper' ? 3 : s.w.r >= 60 ? 7 : 5;
    ctx.beginPath(); ctx.arc(s.x, s.y, r, 0, 6.284); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath(); ctx.arc(s.x - 1, s.y - 1, r * 0.42, 0, 6.284); ctx.fill();
  }
  ctx.restore();

  drawHUD();

  if (G.bannerT > 0 && G.banner){
    ctx.globalAlpha = Math.min(1, G.bannerT / 45);
    ctx.fillStyle = 'rgba(6,10,18,.90)'; ctx.fillRect(0, 44, VW, 34);
    ctx.fillStyle = 'rgba(255,216,107,.55)';
    ctx.fillRect(0, 44, VW, 2); ctx.fillRect(0, 76, VW, 2);
    sh(G.banner, VW/2, 52, '#ffd86b', 18, 'center');
    ctx.globalAlpha = 1;
  }
  if (G.msgT > 0){
    ctx.globalAlpha = Math.min(1, G.msgT / 35);
    sh(G.msg, VW/2, VH - 76, '#ffe9a8', 20, 'center');
    ctx.globalAlpha = 1;
  }
}

/* Tap targets are registered as we draw, then hit-tested on pointerdown. */
let HOT = [];
const hot = (id, x, y, w, h) => { HOT.push({ id, x, y, w, h }); return { x, y, w, h }; };
function hitTest(px, py){
  for (let i = HOT.length - 1; i >= 0; i--){
    const r = HOT[i];
    if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return r.id;
  }
  return null;
}

function button(id, x, y, w, h, label, opts){
  const o = opts || {};
  hot(id, x, y, w, h);
  ctx.fillStyle = o.fill || 'rgba(20,28,41,.92)';
  ctx.fillRect(x, y, w, h);
  ctx.strokeStyle = o.edge || '#2b3548'; ctx.lineWidth = 2;
  ctx.strokeRect(x, y, w, h);
  sh(label, x + w/2, y + h/2 - (o.size || 17) * 0.6, o.col || '#dbe6f7', o.size || 17, 'center');
}

/* ---------------- SPLASH ---------------- */
function drawSplash(){
  titleT++;
  proceduralSky();
  ctx.fillStyle = 'rgba(4,7,12,.66)'; ctx.fillRect(0, 0, VW, VH);
  HOT = [];

  const logo = FX['logo_main'];
  let below = 150;
  if (logo){
    const lw = Math.min(540, VW - 120), lh = lw * (logo.height / logo.width);
    ctx.drawImage(logo, Math.round(VW/2 - lw/2), 34, lw, lh);
    below = 34 + lh + 14;
  } else {
    sh('S C F L', VW/2, 44, '#ffd86b', 26, 'center');
    sh('TRADE WARS', VW/2, 74, '#f2f6ff', 74, 'center');
    below = 168;
  }
  sh('two crests · one hill · nothing left standing', VW/2, below, '#8ea0bd', 17, 'center');

  // two crests trading fire beneath the title
  const gy = 412;
  const a = LOGO[TEAMS[G.picks[0]].key], b = LOGO[TEAMS[G.picks[1]].key];
  ctx.drawImage(a.img, 104, gy - 38, 76, 76);
  ctx.drawImage(b.img, VW - 180, gy - 38, 76, 76);
  const t = (titleT % 150) / 150;
  const arcTop = 118;
  ctx.strokeStyle = 'rgba(255,138,92,.42)'; ctx.lineWidth = 3;
  ctx.beginPath();
  for (let k = 0; k <= 30; k++){
    const u = t * k / 30;
    const x = 160 + (VW - 340) * u, y = gy - 18 - Math.sin(u * Math.PI) * arcTop;
    k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
  const sx = 160 + (VW - 340) * t, sy = gy - 18 - Math.sin(t * Math.PI) * arcTop;
  ctx.fillStyle = '#ff8a5c';
  ctx.beginPath(); ctx.arc(sx, sy, 7, 0, 6.284); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.beginPath(); ctx.arc(sx - 1, sy - 1, 3, 0, 6.284); ctx.fill();

  button('start', VW/2 - 130, 466, 260, 52, 'CHOOSE YOUR CLUBS',
         { fill:'rgba(58,26,20,.95)', edge:'#8a4030', col:'#ffd9cc', size:18 });
  if ((titleT >> 4) % 2 === 0)
    sh('tap to begin', VW/2, 528, '#5d6b80', 13, 'center');
}

/* ---------------- CLUB SELECT ---------------- */
const COLS = 8, CELL = 104, GRID_Y = 240;
const GRID_X = (VW - COLS * CELL) / 2;

function drawSelect(){
  titleT++;
  proceduralSky();
  ctx.fillStyle = 'rgba(4,7,12,.70)'; ctx.fillRect(0, 0, VW, VH);
  HOT = [];

  sh('CHOOSE YOUR CLUBS', VW/2, 18, '#f2f6ff', 30, 'center');
  sh('tap a crest to fill the highlighted slot', VW/2, 46, '#7f8fab', 14, 'center');

  // the two chosen slots
  [0, 1].forEach(side => {
    const cx = side === 0 ? VW * 0.27 : VW * 0.73;
    const t = TEAMS[G.picks[side]], lg = LOGO[t.key];
    const on = side === G.pickSide;
    hot('slot' + side, cx - 62, 82, 124, 124);
    if (on){
      ctx.fillStyle = 'rgba(255,216,107,.10)'; ctx.fillRect(cx - 62, 82, 124, 124);
      ctx.strokeStyle = '#ffd86b'; ctx.lineWidth = 3; ctx.strokeRect(cx - 62, 82, 124, 124);
    } else { ctx.strokeStyle = '#2b3548'; ctx.lineWidth = 2; ctx.strokeRect(cx - 62, 82, 124, 124); }
    ctx.drawImage(lg.img, cx - 52, 92, 104, 104);
    sh(t.name, cx, 212, on ? lg.light : '#8ea0bd', 16, 'center');
    sh(side === 0 ? 'PLAYER 1 · HOME' : (G.vsCpu ? 'COMPUTER' : 'PLAYER 2'), cx, 64, '#6b7b96', 13, 'center');
  });
  sh('VS', VW/2, 128, '#ff8a5c', 32, 'center');

  // all sixteen crests
  TEAMS.forEach((tm, i) => {
    const gx = GRID_X + (i % COLS) * CELL, gy = GRID_Y + Math.floor(i / COLS) * CELL;
    hot('team' + i, gx, gy, CELL, CELL);
    const taken = i === G.picks[0] || i === G.picks[1];
    if (taken){
      ctx.fillStyle = 'rgba(255,216,107,.09)'; ctx.fillRect(gx + 2, gy + 2, CELL - 4, CELL - 4);
      ctx.strokeStyle = i === G.picks[0] ? '#ffd86b' : '#8fd0ff'; ctx.lineWidth = 2;
      ctx.strokeRect(gx + 2, gy + 2, CELL - 4, CELL - 4);
    }
    ctx.globalAlpha = taken ? 1 : 0.72;
    ctx.drawImage(LOGO[tm.key].img, gx + 12, gy + 6, CELL - 24, CELL - 24);
    ctx.globalAlpha = 1;
    const label = tm.name.length > 13 ? tm.name.slice(0, 12) + '…' : tm.name;
    sh(label, gx + CELL/2, gy + CELL - 17, taken ? '#e8eefb' : '#6b7b96', 11, 'center');
  });

  sh('HOME FIELD  ·  ' + (ARENA_NAME[TEAMS[G.picks[0]].key] || 'THE FIELD'),
     VW/2, GRID_Y + 2 * CELL + 6, '#8fd0ff', 15, 'center');

  const by = VH - 62;
  button('mode', 40, by, 236, 48, G.vsCpu ? 'VS COMPUTER' : 'TWO PLAYER', { size:16 });
  if (G.vsCpu)
    button('skill', 288, by, 200, 48, 'AIM: ' + ['LOOSE','DECENT','SHARP'][G.cpuSkill], { size:16, col:'#8fd0ff' });
  const ready = G.picks[0] !== G.picks[1];
  button('go', VW - 300, by, 260, 48, ready ? 'START' : 'PICK TWO CLUBS',
         ready ? { fill:'rgba(58,26,20,.95)', edge:'#8a4030', col:'#ffd9cc', size:20 }
               : { col:'#5d6b80', size:16 });
  button('back', VW - 36 - 0, 8, 28, 28, '×', { size:18 });
}

function selectTap(id){
  if (!id) return;
  if (id === 'back'){ G.mode = 'splash'; Sound.swap(); return; }
  if (id === 'mode'){ G.vsCpu = !G.vsCpu; Sound.swap(); return; }
  if (id === 'skill'){ G.cpuSkill = (G.cpuSkill + 1) % 3; Sound.swap(); return; }
  if (id === 'slot0'){ G.pickSide = 0; Sound.swap(); return; }
  if (id === 'slot1'){ G.pickSide = 1; Sound.swap(); return; }
  if (id === 'go'){
    if (G.picks[0] !== G.picks[1]) newRound(false);
    else Sound.dud();
    return;
  }
  if (id.startsWith('team')){
    const i = +id.slice(4);
    const other = G.picks[1 - G.pickSide];
    if (i === other){                       // tapping the other slot's club swaps them
      G.picks[1 - G.pickSide] = G.picks[G.pickSide];
    }
    G.picks[G.pickSide] = i;
    G.pickSide = 1 - G.pickSide;
    Sound.swap();
  }
}

function drawOver(){
  drawField();
  const won = G.winner;
  ctx.fillStyle = 'rgba(5,9,16,.90)'; ctx.fillRect(80, 140, VW - 160, 180);
  const lg = won >= 0 ? LOGO[TEAMS[P[won].team].key] : null;
  ctx.strokeStyle = lg ? lg.accent : '#8ea0bd'; ctx.lineWidth = 2;
  ctx.strokeRect(80, 140, VW - 160, 180);
  if (won >= 0){
    ctx.drawImage(P[won].sprite, VW/2 - 36, 158, 72, 72);
    sh(TEAMS[P[won].team].name, VW/2, 240, lg.light, 26, 'center');
    sh(G.wins[won] >= 3 ? 'TAKES THE SERIES ' + G.wins[0] + '–' + G.wins[1]
                        : 'WINS THE ROUND ' + G.wins[0] + '–' + G.wins[1], VW/2, 274, '#ffe9a8', 17, 'center');
  } else sh('BOTH CRESTS DOWN', VW/2, 220, '#ff8a5c', 26, 'center');
  if ((titleT++ >> 4) % 2 === 0)
    sh(G.wins[0] >= 3 || G.wins[1] >= 3 ? 'SPACE FOR A NEW WAR' : 'SPACE FOR THE NEXT ROUND',
       VW/2, 340, '#e8eefb', 17, 'center');
}

function render(){
  if (G.mode === 'splash')     drawSplash();
  else if (G.mode === 'select') drawSelect();
  else if (G.mode === 'over')   drawOver();
  else if (G.mode === 'load'){ ctx.fillStyle = '#04060a'; ctx.fillRect(0,0,VW,VH);
                               sh('LOADING…', VW/2, VH/2, '#56637a', 18, 'center'); }
  else                         drawField();
}

/* ---- splash / select input ---- */
function canvasPoint(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width * VW, y:(e.clientY - r.top) / r.height * VH };
}
cv.addEventListener('pointerdown', e => {
  Sound.resume();
  if (G.mode === 'splash'){ G.mode = 'select'; Sound.swap(); return; }
  if (G.mode === 'select'){
    const p = canvasPoint(e);
    selectTap(hitTest(p.x, p.y));
  }
});
addEventListener('keydown', e => {
  if (G.mode === 'splash'){
    if (e.code === 'Space' || e.code === 'Enter'){ e.preventDefault(); G.mode = 'select'; Sound.swap(); }
    return;
  }
  if (G.mode !== 'select') return;
  const n = TEAMS.length;
  if (e.code === 'ArrowLeft'){  e.preventDefault(); G.picks[G.pickSide] = (G.picks[G.pickSide] + n - 1) % n; Sound.swap(); }
  if (e.code === 'ArrowRight'){ e.preventDefault(); G.picks[G.pickSide] = (G.picks[G.pickSide] + 1) % n; Sound.swap(); }
  if (e.code === 'ArrowUp' || e.code === 'ArrowDown'){ e.preventDefault(); G.pickSide = 1 - G.pickSide; Sound.swap(); }
  if (e.code === 'KeyM'){ G.vsCpu = !G.vsCpu; Sound.swap(); }
  if (e.code === 'Tab'){ e.preventDefault(); G.cpuSkill = (G.cpuSkill + 1) % 3; Sound.swap(); }
  if (e.code === 'Space' || e.code === 'Enter'){
    e.preventDefault();
    if (G.picks[0] !== G.picks[1]) newRound(false); else Sound.dud();
  }
});

/* ------------------------------------------------------------------ *
 * LOOP
 * ------------------------------------------------------------------ */
let acc = 0, last = 0;
function frame(now){
  requestAnimationFrame(frame);
  if (!last) last = now;
  acc += Math.min(now - last, 250); last = now;
  let guard = 0;
  while (acc >= STEP && guard++ < 5){ tick(); acc -= STEP; }
  render();
}

(async function boot(){
  let bundle = null;
  try { const r = await fetch('../scfl-team-logos-resized.json', { cache:'force-cache' }); if (r.ok) bundle = await r.json(); }
  catch (_) {}
  await Promise.all(TEAMS.map((t, i) => new Promise(done => {
    const finish = src => {
      let tone; try { tone = dominantAccent(src); } catch (_) { tone = { accent:'#6fa8ff', light:'#cfe1ff' }; }
      LOGO[t.key] = Object.assign({ img: badge(src, tone.accent) }, tone);
      done();
    };
    const src = bundle && bundle[t.key];
    if (!src) return finish(placeholderLogo(i));
    const img = new Image();
    img.onload = () => finish(img);
    img.onerror = () => finish(placeholderLogo(i));
    img.src = src;
  })));
  await Promise.all(Object.entries(FX_DATA).map(([k, uri]) => new Promise(done => {
    const i = new Image();
    i.onload = () => { FX[k] = i; done(); };
    i.onerror = done;
    i.src = uri;
  })));
  fit();
  el('boot').classList.add('gone');
  G.mode = 'splash';
  requestAnimationFrame(frame);
})();
</script>
