<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c20f16">
<title>League Magazine</title>
<style>
  :root{
    --bg:#ffffff; --bg2:#f4f5f6; --card:#ffffff; --card2:#f7f2f2; --border:#e4e0dd;
    --text:#18191d; --dim:#54565c; --faint:#8a8d93;
    --accent:#c20f16; --accent-d:#8f0a10; --on-accent:#ffffff;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); }
  #app{ max-width:820px; margin:0 auto; padding:22px 18px 90px; }
  a{ color:var(--accent); }
  .btn{ border:1px solid var(--accent); background:var(--accent); color:var(--on-accent);
    font-weight:800; font-size:15px; padding:13px 18px; border-radius:12px; cursor:pointer; width:100%; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn.ghost{ background:transparent; color:var(--text); border-color:var(--border); }
  .btn.sm{ width:auto; padding:9px 14px; font-size:13px; }
  .input{ width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:12px;
    color:var(--text); padding:13px; font-size:15px; font-family:var(--sans); }
  .input:focus{ outline:none; border-color:var(--accent); }
  .hint{ color:var(--faint); font-size:12px; margin-top:8px; }
  .err{ color:var(--accent); font-size:13px; font-weight:700; margin-top:10px; }
  .spinner{ width:22px; height:22px; border:3px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite; display:inline-block; vertical-align:middle; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* setup */
  h1{ font-family:var(--serif); font-size:30px; line-height:1.1; margin:0 0 6px; text-wrap:balance; }
  .sub{ color:var(--dim); font-size:15px; line-height:1.55; margin:0 0 24px; max-width:60ch; }
  .step{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px;
    margin-bottom:16px; box-shadow:0 1px 2px rgba(20,10,10,.04), 0 10px 30px -24px rgba(20,10,10,.4); }
  .step-h{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .step-n{ width:26px; height:26px; flex:none; border-radius:50%; background:var(--accent); color:var(--on-accent);
    font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .step-t{ font-weight:800; font-size:16px; }
  .step-d{ color:var(--faint); font-size:12.5px; margin:-8px 0 14px 36px; }
  label.fld{ display:block; font-size:12px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
    color:var(--dim); margin:0 0 6px; }
  .row{ display:flex; gap:12px; flex-wrap:wrap; } .row>*{ flex:1; min-width:0; } .gap{ height:14px; }
  .swatches{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .sw{ width:34px; height:34px; border-radius:9px; border:2px solid transparent; cursor:pointer; position:relative; }
  .sw.on{ border-color:var(--text); }
  .sw.on::after{ content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:15px; font-weight:900; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .sw.custom{ background:conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
  input[type=color]{ position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; }
  .logo-drop{ display:flex; align-items:center; gap:14px; }
  .logo-prev{ width:72px; height:72px; flex:none; border-radius:12px; border:1px dashed var(--border);
    background:var(--bg2); display:flex; align-items:center; justify-content:center; overflow:hidden;
    color:var(--faint); font-size:11px; text-align:center; }
  .logo-prev img{ width:100%; height:100%; object-fit:contain; }
  .league{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px;
    border:1px solid var(--border); border-radius:12px; margin-top:8px; cursor:pointer; }
  .league:hover{ border-color:var(--accent); } .league.on{ border-color:var(--accent); background:var(--card2); }
  .league .ln{ font-weight:800; font-size:15px; } .league .lm{ color:var(--faint); font-size:12px; }
  .preview{ border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .pv-mast{ display:flex; align-items:center; gap:12px; padding:16px; border-bottom:3px solid var(--accent); }
  .pv-mast img{ width:44px; height:44px; object-fit:contain; }
  .pv-kick{ font-size:10px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--accent); }
  .pv-name{ font-family:var(--serif); font-weight:900; font-size:24px; line-height:1.05; }
  .pv-body{ padding:14px 16px; color:var(--dim); font-size:13px; }
  .foot{ text-align:center; color:var(--faint); font-size:11px; margin-top:26px; }

  /* magazine chrome */
  .mag-top{ display:flex; align-items:center; gap:12px; border-bottom:2px solid var(--text);
    padding-bottom:10px; margin-bottom:18px; position:sticky; top:0; background:var(--bg); z-index:5; }
  .mag-top img{ width:34px; height:34px; object-fit:contain; }
  .mag-top .mt-kick{ font-size:9px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--accent); }
  .mag-top .mt-name{ font-family:var(--serif); font-weight:900; font-size:19px; line-height:1; }
  .mag-top .mt-r{ margin-left:auto; display:flex; gap:8px; align-items:center; }
  .wk{ display:flex; align-items:center; gap:6px; }
  .wk button{ background:var(--bg2); border:1px solid var(--border); color:var(--text); width:32px; height:32px;
    border-radius:8px; font-size:18px; font-weight:800; cursor:pointer; }
  .wk .wknow{ font-weight:800; font-size:13px; min-width:74px; text-align:center; }
  .cover{ position:relative; border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-bottom:18px;
    background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 8%, #fff), #fff 70%); border-top:5px solid var(--accent); }
  .cover .cv-in{ padding:22px 20px 24px; }
  .cover .cv-kick{ font-size:11px; font-weight:900; letter-spacing:2.5px; text-transform:uppercase; color:var(--accent); }
  .cover h2{ font-family:var(--serif); font-size:30px; line-height:1.08; margin:8px 0 10px; text-wrap:balance; }
  .cover .cv-dek{ color:var(--dim); font-size:15px; line-height:1.5; max-width:56ch; }
  .sec{ font-size:12px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--accent);
    border-left:4px solid var(--accent); padding:2px 0 2px 10px; margin:26px 0 12px; }
  .sechint{ color:var(--faint); font-size:11px; font-weight:700; margin:-8px 0 12px 14px; }

  /* collapsible matchup articles */
  .game{ background:var(--card); border:1px solid var(--border); border-radius:14px; margin-bottom:12px;
    box-shadow:0 10px 30px -26px rgba(20,10,10,.5); overflow:hidden; }
  .ghead{ display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; }
  .ghead:hover{ background:var(--card2); }
  .gh-main{ flex:1; min-width:0; }
  .gh-line{ font-family:var(--serif); font-weight:800; font-size:17px; line-height:1.15; }
  .gh-score{ color:var(--faint); font-size:12.5px; font-weight:700; margin-top:3px; font-variant-numeric:tabular-nums; }
  .gh-score b{ color:var(--accent); }
  .caret{ flex:none; color:var(--accent); font-size:15px; transition:transform .2s; }
  .game.open .caret{ transform:rotate(90deg); }
  .art{ display:none; padding:0 16px 16px; }
  .game.open .art{ display:block; }
  .art .dek{ font-family:var(--serif); font-style:italic; color:var(--accent-d); font-size:15px; margin:0 0 10px; }
  .art p{ margin:0 0 10px; font-family:var(--serif); font-size:15px; line-height:1.58; color:#25262b; }
  .scoreline{ display:flex; gap:10px; align-items:center; margin:2px 0 12px; }
  .scoreline .sd{ flex:1; display:flex; justify-content:space-between; align-items:baseline; padding:7px 11px; border-radius:9px; background:var(--bg2); }
  .scoreline .sd.win{ background:color-mix(in srgb, var(--accent) 10%, #fff); border:1px solid color-mix(in srgb, var(--accent) 35%, #fff); }
  .scoreline .tm{ font-weight:800; font-size:13.5px; } .scoreline .pt{ font-weight:900; font-size:16px; font-variant-numeric:tabular-nums; }
  .scoreline .vs{ color:var(--faint); font-weight:800; font-size:11px; }

  /* timeline */
  .timeline{ margin:6px 0 12px; padding-top:10px; border-top:1px solid var(--border); }
  .tl-h{ font-size:10px; font-weight:900; letter-spacing:1.2px; text-transform:uppercase; color:var(--faint); margin-bottom:8px; }
  .tlrow{ display:flex; align-items:center; gap:10px; margin:6px 0; }
  .tllab{ width:78px; flex:none; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.4px; }
  .tlbar{ flex:1; height:8px; border-radius:4px; background:#ece9e7; position:relative; overflow:hidden; }
  .tlfill{ position:absolute; left:0; top:0; bottom:0; background:var(--accent); border-radius:4px; }
  .tlsc{ width:96px; flex:none; text-align:right; font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; }
  .tlsc .lz{ color:var(--faint); font-weight:600; }
  .stars{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .chip{ font-size:11px; font-weight:800; background:var(--bg2); border:1px solid var(--border); border-radius:999px; padding:4px 10px; }
  .chip b{ color:var(--accent); }
  .expandall{ font-size:12px; font-weight:800; color:var(--accent); background:none; border:none; cursor:pointer; padding:0; }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .tblwrap{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; }
  th,td{ padding:9px 10px; text-align:right; white-space:nowrap; }
  th:first-child,td:first-child{ text-align:left; }
  thead th{ font-size:10px; letter-spacing:.6px; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--border); }
  tbody tr:nth-child(even){ background:var(--bg2); }
  td.team{ font-weight:800; } .num{ font-variant-numeric:tabular-nums; }
  .rk{ display:inline-flex; width:20px; justify-content:center; color:var(--faint); font-weight:800; }
  .pr{ display:flex; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border); } .pr:last-child{ border-bottom:none; }
  .pr .prk{ font-family:var(--serif); font-weight:900; font-size:26px; width:34px; text-align:center; color:var(--accent); line-height:1; }
  .pr .prb .prt{ font-weight:800; font-size:15px; } .pr .prb .prn{ color:var(--dim); font-size:13.5px; font-family:var(--serif); line-height:1.5; margin-top:2px; }
  .mv{ font-size:11px; font-weight:800; margin-left:6px; } .mv.up{ color:#0a8f3c; } .mv.dn{ color:var(--accent); } .mv.fl{ color:var(--faint); }
  .txn{ padding:10px 4px; border-bottom:1px solid var(--border); font-size:14px; } .txn:last-child{ border-bottom:none; }
  .txn .tk{ font-size:10px; font-weight:900; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin-right:8px; }
  .txn .tt{ font-weight:800; } .txn .add{ color:#0a8f3c; font-weight:700; } .txn .drop{ color:var(--faint); }
  .demoflag{ text-align:center; font-size:11px; color:var(--faint); background:var(--bg2); border:1px dashed var(--border); border-radius:8px; padding:8px; margin-bottom:14px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const LS_KEY='leaguemag.config.v1', PR_KEY='leaguemag.pr.v1';
const $=(s,r=document)=>r.querySelector(s);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const round1=x=>Math.round(x*10)/10;
const sum=a=>a.reduce((s,x)=>s+x,0);
const seededPick=(arr,seed)=>arr[Math.abs(Math.round(seed))%arr.length];
const PRESETS=[['#c20f16','Red'],['#1d4ed8','Blue'],['#047857','Green'],['#7c3aed','Purple'],['#ea580c','Orange'],['#0f172a','Ink']];

let cfg=load()||{name:'',tagline:'',accent:'#c20f16',logo:'',platform:'sleeper',sleeperUser:'',season:'2025',leagueId:'',leagueName:''};
let PLAYERS=null, VIEW={week:null}, DEMO_MODE=false;

function load(){try{return JSON.parse(localStorage.getItem(LS_KEY));}catch(e){return null;}}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(cfg));}
function applyAccent(hex){const r=document.documentElement;r.style.setProperty('--accent',hex);r.style.setProperty('--accent-d',shade(hex,-22));}
function shade(hex,p){const nn=parseInt(hex.slice(1),16);let r=(nn>>16)&255,g=(nn>>8)&255,b=nn&255;const f=1+p/100;
  r=Math.max(0,Math.min(255,r*f))|0;g=Math.max(0,Math.min(255,g*f))|0;b=Math.max(0,Math.min(255,b*f))|0;
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

/* player accessors (PLAYERS is trimmed {n,pos,t}; demo passes plain names as ids) */
function pname(id){ if(DEMO_MODE) return id; const p=PLAYERS&&PLAYERS[id]; return p?p.n:('Player '+id); }
function ppos(id){ const p=PLAYERS&&PLAYERS[id]; return p?p.pos:''; }
function pteam(id){ const p=PLAYERS&&PLAYERS[id]; return p?p.t:''; }
function joinList(a){ if(!a.length)return''; if(a.length===1)return a[0]; if(a.length===2)return a[0]+' and '+a[1]; return a.slice(0,-1).join(', ')+', and '+a[a.length-1]; }
function hasProduction(s){ return !!s && (n(s,'pass_yd')>0||n(s,'rush_yd')>0||n(s,'rec')>0||n(s,'fgm')>0||n(s,'sack')>0||n(s,'def_td')>0); }
const n=(s,k)=>(typeof s?.[k]==='number'?s[k]:0);

/* ===================== SETUP WIZARD ===================== */
function renderSetup(){
  applyAccent(cfg.accent); const app=$('#app'); app.innerHTML='';
  app.appendChild(el(`<div><h1>Set up your league magazine</h1>
    <p class="sub">A weekly magazine for your fantasy league — full matchup write-ups with the play-by-play timing,
      standings, power rankings and transactions, in your colors and under your logo. Saved in your browser. No account, no server.</p></div>`));
  const s1=el(`<div class="step"><div class="step-h"><div class="step-n">1</div><div class="step-t">Name your league</div></div>
    <label class="fld">League name</label><input class="input" id="f-name" placeholder="e.g. The Gridiron Gauntlet" value="${esc(cfg.name)}">
    <div class="gap"></div><label class="fld">Tagline (optional)</label>
    <input class="input" id="f-tag" placeholder="e.g. 12-Team PPR · Est. 2014" value="${esc(cfg.tagline)}"></div>`);
  app.appendChild(s1);
  const s2=el(`<div class="step"><div class="step-h"><div class="step-n">2</div><div class="step-t">Pick your color</div></div><div class="swatches" id="sw"></div></div>`);
  app.appendChild(s2); const sw=$('#sw',s2);
  PRESETS.forEach(([hex,name])=>{const b=el(`<div class="sw" title="${name}" style="background:${hex}"></div>`);b.dataset.hex=hex;
    b.onclick=()=>{cfg.accent=hex;applyAccent(hex);markSw();renderPreview();};sw.appendChild(b);});
  const custom=el(`<div class="sw custom" title="Custom"><input type="color" value="${cfg.accent}"></div>`);
  $('input',custom).oninput=e=>{cfg.accent=e.target.value;applyAccent(cfg.accent);markSw();renderPreview();};sw.appendChild(custom);
  const s3=el(`<div class="step"><div class="step-h"><div class="step-n">3</div><div class="step-t">Upload your logo</div></div>
    <div class="logo-drop"><div class="logo-prev" id="logo-prev">${cfg.logo?`<img src="${cfg.logo}">`:'PNG / JPG<br>square works best'}</div>
    <div><button class="btn ghost sm" id="logo-btn">Choose image…</button>
    ${cfg.logo?'<button class="btn ghost sm" id="logo-clear" style="margin-top:8px">Remove</button>':''}
    <div class="hint">Stored in your browser, embedded in the magazine.</div></div>
    <input type="file" id="logo-file" accept="image/*" hidden></div></div>`);
  app.appendChild(s3);
  $('#logo-btn',s3).onclick=()=>$('#logo-file',s3).click();
  $('#logo-file',s3).onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{cfg.logo=rd.result;renderSetup();};rd.readAsDataURL(f);};
  if($('#logo-clear',s3))$('#logo-clear',s3).onclick=()=>{cfg.logo='';renderSetup();};
  const s4=el(`<div class="step"><div class="step-h"><div class="step-n">4</div><div class="step-t">Connect your Sleeper league</div></div>
    <div class="step-d">Enter your Sleeper username, then pick the league. Only public league data is read.</div>
    <div class="row"><div style="flex:2"><label class="fld">Sleeper username</label>
    <input class="input" id="f-user" placeholder="your Sleeper username" value="${esc(cfg.sleeperUser)}"></div>
    <div style="flex:1"><label class="fld">Season</label><input class="input" id="f-season" value="${esc(cfg.season||'2025')}"></div></div>
    <div class="gap"></div><button class="btn" id="find">Find my leagues</button>
    <div class="err" id="find-err"></div><div id="leagues"></div></div>`);
  app.appendChild(s4); $('#find',s4).onclick=findLeagues;
  const pv=el(`<div class="step"><div class="step-h"><div class="step-n">✦</div><div class="step-t">Preview</div></div>
    <div class="preview" id="preview"></div><div class="gap"></div>
    <button class="btn" id="save" disabled>Save &amp; open my magazine</button>
    <div class="hint" id="save-hint">Connect a league above to finish.</div>
    <div class="gap"></div><button class="btn ghost sm" id="demo">See a demo issue first</button></div>`);
  app.appendChild(pv);
  $('#save',pv).onclick=()=>{collect();save();openMagazine(false);};
  $('#demo',pv).onclick=()=>openMagazine(true);
  app.appendChild(el(`<div class="foot">Self-contained · saved in this browser</div>`));
  ['f-name','f-tag'].forEach(id=>{const nd=$('#'+id);nd&&nd.addEventListener('input',()=>{collect();renderPreview();});});
  markSw(); renderPreview();
}
function markSw(){document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.hex&&s.dataset.hex.toLowerCase()===cfg.accent.toLowerCase()));}
function collect(){cfg.name=($('#f-name')||{}).value??cfg.name;cfg.tagline=($('#f-tag')||{}).value??cfg.tagline;
  cfg.sleeperUser=($('#f-user')||{}).value??cfg.sleeperUser;cfg.season=($('#f-season')||{}).value??cfg.season;}
function renderPreview(){const p=$('#preview');if(!p)return;
  p.innerHTML=`<div class="pv-mast">${cfg.logo?`<img src="${cfg.logo}">`:''}<div>
    <div class="pv-kick">The Weekly · powered by Sleeper</div><div class="pv-name">${esc(cfg.name||'Your League Name')}</div></div></div>
    <div class="pv-body">${esc(cfg.tagline||'Your tagline appears here.')} — full matchup write-ups, standings, power rankings, transactions.</div>`;
  const can=cfg.leagueId&&cfg.name,sb=$('#save'),sh=$('#save-hint');
  if(sb)sb.disabled=!can; if(sh)sh.textContent=can?'Ready.':(cfg.leagueId?'Add a league name up top to finish.':'Connect a league above to finish.');}
async function findLeagues(){
  collect();const err=$('#find-err'),box=$('#leagues');err.textContent='';
  box.innerHTML='<div style="padding:12px 0"><span class="spinner"></span> Looking up your leagues…</div>';
  const user=(cfg.sleeperUser||'').trim();
  if(!user){err.textContent='Enter your Sleeper username first.';box.innerHTML='';return;}
  try{
    const u=await fetch('https://api.sleeper.app/v1/user/'+encodeURIComponent(user)).then(r=>r.ok?r.json():null);
    if(!u||!u.user_id){err.textContent='No Sleeper user by that name. Check the spelling.';box.innerHTML='';return;}
    const season=(cfg.season||'2025').trim();
    const lgs=await fetch(`https://api.sleeper.app/v1/user/${u.user_id}/leagues/nfl/${season}`).then(r=>r.ok?r.json():[]);
    if(!lgs||!lgs.length){err.textContent=`No leagues for ${user} in ${season}. Try another season.`;box.innerHTML='';return;}
    box.innerHTML='';
    lgs.forEach(lg=>{const row=el(`<div class="league" data-id="${lg.league_id}">
      <div><div class="ln">${esc(lg.name)}</div><div class="lm">${lg.total_rosters||'?'} teams · ${lg.season} · ${esc(lg.status||'')}</div></div>
      <div style="color:var(--accent);font-weight:900">Select ›</div></div>`);
      row.onclick=()=>{cfg.leagueId=lg.league_id;cfg.leagueName=lg.name;
        box.querySelectorAll('.league').forEach(r=>r.classList.remove('on'));row.classList.add('on');
        if(!cfg.name){cfg.name=lg.name;const nd=$('#f-name');if(nd)nd.value=lg.name;}renderPreview();};
      box.appendChild(row);});
  }catch(e){err.textContent='Could not reach Sleeper. Check your connection and try again.';box.innerHTML='';}
}

/* ===================== STAT LINES & SCORING ===================== */
function scoreStats(stats,scoring){ if(!stats||!scoring)return 0; let t=0; for(const k in scoring){const v=stats[k]; if(typeof v==='number')t+=v*scoring[k];} return t; }
function rushFrag(s){const a=n(s,'rush_att'),y=Math.round(n(s,'rush_yd')),td=n(s,'rush_td');let f=a?`${a} car, ${y} rush yds`:`${y} rush yds`;if(td)f+=`, ${td} TD`;return f;}
function recFrag(s){const r=n(s,'rec'),y=Math.round(n(s,'rec_yd')),td=n(s,'rec_td'),tg=n(s,'rec_tgt');let f=`${r} rec, ${y} yds`;if(td)f+=`, ${td} TD`;if(tg)f+=` (${tg} tgt)`;return f;}
function statLine(pos,s){ if(!s)return''; const p=[];
  if(pos==='QB'){const c=n(s,'pass_cmp'),a=n(s,'pass_att');if(a)p.push(`${c}/${a}`);if(n(s,'pass_yd'))p.push(`${Math.round(n(s,'pass_yd'))} pass yds`);
    if(n(s,'pass_td'))p.push(`${n(s,'pass_td')} pass TD`);if(n(s,'pass_int'))p.push(`${n(s,'pass_int')} INT`);if(n(s,'rush_yd')>=15||n(s,'rush_td'))p.push(rushFrag(s));return p.filter(Boolean).join(', ');}
  if(pos==='RB'){if(n(s,'rush_att'))p.push(rushFrag(s));if(n(s,'rec'))p.push(recFrag(s));return p.join(' · ');}
  if(pos==='WR'||pos==='TE'){if(n(s,'rec')||n(s,'rec_tgt'))p.push(recFrag(s));if(n(s,'rush_yd')||n(s,'rush_td'))p.push(rushFrag(s));return p.join(' · ');}
  if(pos==='K'){const m=n(s,'fgm'),a=n(s,'fga');if(a)p.push(`${m}/${a} FG`);if(n(s,'xpm'))p.push(`${n(s,'xpm')} XP`);return p.join(', ');}
  if(pos==='DEF'){if(n(s,'sack'))p.push(`${n(s,'sack')} sk`);if(n(s,'int'))p.push(`${n(s,'int')} INT`);if(n(s,'ff'))p.push(`${n(s,'ff')} FF`);if(n(s,'def_td'))p.push(`${n(s,'def_td')} TD`);if(s.pts_allow!==undefined)p.push(`${n(s,'pts_allow')} pts allowed`);return p.join(', ');}
  return ''; }
function scoredTD(s){return (n(s,'rush_td')+n(s,'rec_td')+n(s,'pass_td')+n(s,'def_td'))>0;}
function heroHype(pts,seed){const big=['went thermonuclear for','put on an absolute clinic for','dropped a cool','detonated for','went bananas for'];
  const mid=['went to work for','delivered','posted','came to play and put up'];const low=['scraped together','mustered just','managed a whisper of'];

/* ===================== GAME-WINDOW TIMELINE ===================== */
const SLOT_ORDER=['TNF','SUN_EARLY','SUN_LATE','SNF','MNF'];
const SLOT_LABEL={TNF:'Thursday night',SUN_EARLY:'the early window',SUN_LATE:'the late window',SNF:'Sunday night',MNF:'Monday night'};
const SLOT_SHORT={TNF:'Thu night',SUN_EARLY:'Sun early',SUN_LATE:'Sun late',SNF:'Sun night',MNF:'Mon night'};
const SLOT_CLAUSE={TNF:'in the Thursday night game',SUN_EARLY:'in the early Sunday window',SUN_LATE:'in the late Sunday window',SNF:'in the Sunday night game',MNF:'in the Monday night game'};
function slotClause(slot){return SLOT_CLAUSE[slot]?` ${SLOT_CLAUSE[slot]}`:'';}
function buildTimeline(winner,loser){
  const hasSlots=[...winner.starters,...loser.starters].some(e=>e.slot);
  if(!hasSlots)return null;
  const slotSum=(team,slot)=>team.starters.filter(e=>e.slot===slot).reduce((s,e)=>s+e.points,0);
  let wCum=0,lCum=0; const windows=[];
  for(const slot of SLOT_ORDER){const wPts=round1(slotSum(winner,slot)),lPts=round1(slotSum(loser,slot));
    if(wPts===0&&lPts===0)continue; wCum=round1(wCum+wPts);lCum=round1(lCum+lPts);
    windows.push({slot,name:SLOT_LABEL[slot],wPts,lPts,wCum,lCum,lead:round1(wCum-lCum)});}
  if(!windows.length)return null;
  const fin=windows.length-1; const preFinalLead=fin>0?windows[fin-1].lead:windows[0].lead;
  const maxDeficit=Math.max(0,...windows.map(w=>-w.lead)); const earlyShare=winner.score>0?windows[Math.min(1,fin)].wCum/winner.score:0;
  let arc; if(preFinalLead<0||maxDeficit>=20)arc='comeback';
  else if(maxDeficit<=3)arc=(earlyShare>=0.6&&windows.length>=3)?'frontRun':'wire';
  else if(Math.abs(preFinalLead)<=10)arc='nail'; else arc='steady';
  let dIdx=fin; if(arc==='comeback'){for(let i=1;i<windows.length;i++)if(windows[i-1].lead<=0&&windows[i].lead>0)dIdx=i;}
  const dWin=windows[dIdx]; const dScorers=winner.starters.filter(e=>e.slot===dWin.slot&&e.points>0).sort((a,b)=>b.points-a.points).slice(0,2);
  return {windows,arc,decisive:dWin,dScorers,preFinalLead:Math.abs(preFinalLead)};
}
function writeTimeline(tl,W,L,margin,nm){
  const dw=tl.decisive,first=tl.windows[0],last=tl.windows[tl.windows.length-1];
  const scorers=tl.dScorers.length?joinList(tl.dScorers.map(e=>`${nm(e)} (${e.points})`)):'the late guns';
  const earlyCum=tl.windows[Math.min(1,tl.windows.length-1)].wCum;
  switch(tl.arc){
    case 'comeback': return `It didn't start pretty for ${W}, who trailed for a good chunk of the week before ${scorers} caught fire${slotClause(dw.slot)} and flipped it to ${dw.wCum}–${dw.lCum}. Once ahead, ${W} never gave it back.`;
    case 'frontRun': return `${W} front-loaded the whole thing — ${earlyCum} on the board before the late games even kicked off — then sat back and watched ${L} chase a lead that was never coming back.`;
    case 'nail': return `This one went the distance. ${L} was still within ${tl.preFinalLead} heading into ${last.name}, but ${scorers} slammed the door${slotClause(last.slot)} to make it ${last.wCum}–${last.lCum} final.`;
    case 'wire': return `From the early windows on, ${W} kept ${L} at arm's length, building from ${first.name} through ${last.name} to a comfortable ${last.wCum}–${last.lCum} without ever really sweating it.`;
    default: return `${W} and ${L} traded haymakers into the afternoon before ${W} pulled clear, turning it into a ${last.wCum}–${last.lCum} final by ${last.name}.`;
  }
}

/* ===================== STORY BUILDER (SCFL voice) ===================== */
function writeStory(ctx){
  const {winner,loser,tie,margin,combined}=ctx;
  const seed=Math.round(winner.score*10+loser.score+(winner.rosterId||0));
  const pick=(arr,o)=>seededPick(arr,seed+o);
  const blowout=margin>=35, nail=margin>0&&margin<=12;
  const W=winner.manager,L=loser.manager;
  const nm=e=>pname(e.id);
  const nml=e=>nm(e)+(e&&e.line&&hasProduction(e.stats)?` (${e.line})`:'');
  const wS=[...winner.starters].sort((a,b)=>b.points-a.points);
  const lS=[...loser.starters].sort((a,b)=>b.points-a.points);
  const hero=wS[0]||winner.top, goat=lS[0]||loser.top;
  const heroName=hero?nm(hero):'somebody';
  const heroDifference=!!hero&&!tie&&hero.points>=margin;
  const P=[];
  let headline;
  if(tie)headline=pick([`${W}, ${L} Settle Jack Squat`,`Two Teams, Zero Balls: ${W} Ties ${L}`],1);
  else if(blowout)headline=pick([`${W} Beats the Brakes Off ${L}`,`${W} ${winner.score}, ${L} ${loser.score}: A Damn Massacre`,`${heroName} and ${W} Curb-Stomp ${L}`],1);
  else if(nail)headline=pick([`${heroName} Drags ${W} Past ${L}`,`${W} Survives ${L} by a Nut Hair`,`${L} Shits the Bed Late Against ${W}`],1);
  else headline=pick([`${W} Handles ${L}'s Business`,`${W} Grinds ${L} Into Paste`],1);
  const dek=tie?`Two teams, zero winners, and one scoreboard that needs a drink.`
    :heroDifference?`${heroName} was the whole ballgame — and ${L} had no answer.`
    :blowout?`${W} showed up. ${L} forgot to.`:`Final: ${W} ${winner.score}, ${L} ${loser.score}.`;
  if(tie){
    P.push(`${W} and ${L} spent all week clubbing each other and finished in a ${winner.score}-apiece deadlock — the rare result where both group chats go dead quiet at once. A tie. In football. Somebody explain the point of that.`);
  }else{
    P.push(pick([`Here's how it went down: `,`To the tape. `,`Set the scene: `],2)+
      `${W} ${blowout?pick([`beat the brakes off ${L}`,`ran ${L} off the field`,`treated ${L} like a crash-test dummy`],3):nail?pick([`outlasted ${L}`,`survived ${L}`,`ripped ${L}'s heart out`],3):pick([`handled ${L}`,`ground ${L} down`,`took care of ${L}`],3)}, ${winner.score} to ${loser.score}${nail?`, and the ${margin}-point final doesn't come close to how sweaty it got — ${L} is gonna be sick about this one for a week`:blowout?`, a beatdown so lopsided it oughta be illegal in most states`:''}.`);
  }
  const tl=!tie?buildTimeline(winner,loser):null;
  if(tl)P.push(writeTimeline(tl,W,L,margin,nm));
  if(hero&&hero.points>0){
    let p=`The engine was ${heroName}, who ${heroHype(hero.points,seed)} ${hero.points}`;
    if(hero.line&&hasProduction(hero.stats))p+=` on ${hero.line}`; p+='. ';
    if(heroDifference&&nail){ p+=(scoredTD(hero.stats)?pick([`He found the end zone right when ${W} needed it, and there's your difference: `,`He punched it in with the matchup hanging in the balance: `],4):pick([`And that output is the whole ballgame: `,`Here's the kick in the teeth for ${L}: `],4))+
        pick([`his day was worth more than the ${margin}-point margin by itself. Take him out and ${W} loses, full stop.`,`he alone outscored the ${margin} points ${W} won by. No ${heroName}, no win, and ${L} knows it.`],5);
    }else if(heroDifference){ p+=pick([`Bigger than the margin, bigger than the moment — the man single-handedly ruined ${L}'s week.`,`No ${heroName}, no win for ${W}. Ain't complicated.`],6);
    }else if(blowout){ p+=pick([`By halftime this stopped being a matchup and became a crime scene.`,`${L} brought a squirt gun to a house fire.`],6);
    }else if(hero.points>=22){ p+=pick([`That's not stat-padding, that's a statement.`,`He didn't have to go that hard. He did it anyway.`],6);
    }else{ p+=pick([`Nothing flashy, just enough to cash the check.`,`Quietly did his job while everybody else screwed around.`],6); }
    P.push(p.trim());
  }
  const support=wS.slice(1).filter(e=>e.points>=9).slice(0,3);
  if(support.length){ const items=support.map(e=>`${nm(e)} ${e.points>=20?'piled on':e.points>=13?'added':'kicked in'} ${e.points}${e.line&&hasProduction(e.stats)?` (${e.line})`:''}`);
    P.push(`And ${heroName} didn't do it alone. `+joinList(items)+`. `+pick([`When the whole lineup shows up, this is what it looks like.`,`Depth wins leagues, and ${W}'s got it in spades.`,`That's a roster firing on every cylinder.`],7)); }
  const wQB=winner.starters.find(e=>e.pos==='QB'); const wDEF=winner.starters.find(e=>e.pos==='DEF'&&e.points>=10);
  if(wQB&&wQB!==hero&&!support.includes(wQB)&&wQB.points>=8){ let p=`Under center, ${nm(wQB)} ran the offense like he owned the place${wQB.line?` — ${wQB.line}`:''} for ${wQB.points}.`;
    if(wDEF)p+=` The ${nm(wDEF)} even chipped in ${wDEF.points}, because when it rains it pours.`; P.push(p);
  }else if(wDEF){ P.push(`Don't sleep on the ${nm(wDEF)}, which quietly banked ${wDEF.points} while everyone watched the skill guys.`); }
  if(goat&&goat.points>0&&!tie){ let p=pick([`It wasn't for lack of a pulse on ${L}'s side. `,`${L} didn't go quietly. `,`Credit where it's due — ${L} threw a punch. `],8)+`${nml(goat)} led the resistance with ${goat.points}`;
    const lSup=lS.slice(1).filter(e=>e.points>=11).slice(0,2); if(lSup.length)p+=`, with ${joinList(lSup.map(e=>`${e.points} from ${nm(e)}`))} keeping it interesting`;
    p+=`. `+pick([`But a hell of an effort and four bucks gets you a gas-station coffee.`,`Add it all up and it still spells L-O-S-S.`,`All that, and the scoreboard didn't care.`],9); P.push(p); }
  if(loser.bust){ const b=loser.bust,bn=nm(b),miss=round1(b.projected-b.points);
    P.push(pick([`Now the autopsy, and it's ugly: ${bn} was penciled in for ${b.projected} and turned in a steaming ${b.points}. That's not a slump, that's a hostage situation.`,
      `${bn} is why ${L}'s manager was up at 3 a.m. staring at the ceiling. Projected ${b.projected}, produced ${b.points} — you'd get more out of a Magic 8-Ball.`,
      `Every loss needs a goat, and ${L} nominates ${bn}: ${b.projected} projected, ${b.points} delivered, a ${miss}-point faceplant with the matchup on the line.`],10)); }
  if(loser.benchRegret){ const r=loser.benchRegret,bn=nm(r.bench),sn=nm(r.starter);
    P.push(pick([`And here's the part ${L} will choke on all week: ${bn} dropped ${r.bench.points} on the bench while ${sn} managed ${r.starter.points} in the starting lineup — a ${r.diff}-point coaching decision in a ${margin}-point loss. The call is coming from inside the house.`,
      `File it under self-inflicted: ${r.diff} points of ${bn} rotting on ${L}'s bench while ${sn} no-showed in the lineup. In a ${margin}-point loss.`],11));
  }else if(winner.benchRegret&&!blowout){ const r=winner.benchRegret; P.push(`Even in the win, ${W} left ${r.bench.points} stapled to the bench in ${nm(r.bench)} — a champagne problem, but a problem.`); }
  if(loser.bust&&(loser.bust.projected-loser.bust.points)>=margin&&!tie){ const b=loser.bust;
    P.push(`The cruelest math of the day: ${nm(b)} missed his projection by ${round1(b.projected-b.points)} — more than the entire ${margin}-point final. He hits his number and we're writing ${L}'s victory column instead.`);
  }else{ P.push(pick([`Combined, the two hung ${combined} on the board${combined>=260?' — a genuine track meet':combined<=180?', a rock fight nobody should brag about':''}.`,`Two teams, ${combined} combined points, and exactly one of them gets to feel good about it.`],12)); }
  P.push(pick([`${W} struts into next week; ${L} has some soul-searching and a stiff drink ahead.`,`Print the box score, ${W}. ${L} — light it on fire and never speak of it again.`,`${W} moves to the right side of the standings. ${L} goes home to a group chat that just went quiet.`],13));
  const stars=[hero,goat].filter(e=>e&&e.points>0);
  return {headline,dek,paragraphs:P,winner,loser,tie,margin,combined,timeline:tl,stars};
}

/* ===================== DATA BUILD (live) ===================== */
async function openMagazine(demo){
  DEMO_MODE=!!demo; applyAccent(cfg.accent); const app=$('#app');
  app.innerHTML=`<div style="text-align:center;padding:80px 0;color:var(--dim)"><span class="spinner"></span><div style="margin-top:12px">Building this week's issue…</div></div>`;

  catch(e){ app.innerHTML=`<div class="step"><div class="step-t">Couldn't build the issue</div><p class="sub">${esc(e.message||e)}</p><button class="btn ghost sm" id="back">Back to setup</button></div>`; $('#back').onclick=renderSetup; return; }

}
function trimPlayers(all){const m={};for(const k in all){const p=all[k];if(!p)continue;
  m[k]={n:p.full_name||((p.first_name||'')+' '+(p.last_name||'')).trim()||p.last_name||k,pos:p.position||(p.fantasy_positions&&p.fantasy_positions[0])||'',t:p.team||''};}return m;}

async function buildWeek(){
  const id=cfg.leagueId; if(!id)throw new Error('No league connected.');
  const base='https://api.sleeper.app/v1/';
  const [league,users,rosters,state]=await Promise.all([
    fetch(base+'league/'+id).then(r=>r.json()),
    fetch(base+'league/'+id+'/users').then(r=>r.json()),
    fetch(base+'league/'+id+'/rosters').then(r=>r.json()),
    fetch(base+'state/nfl').then(r=>r.json())]);
  if(!PLAYERS){ PLAYERS=trimPlayers(await fetch(base+'players/nfl').then(r=>r.json())); }
  const curYear=+(state.season||new Date().getFullYear()); const seasonNum=+(cfg.season||state.season||curYear);
  let start; if(VIEW.week)start=VIEW.week; else if(seasonNum<curYear)start=17; else if(state.season_type==='regular'&&state.week>=1)start=state.week; else start=17;
  let week=Math.max(1,start),matchups=[];
  for(let tries=0;tries<18;tries++){ const mk=await fetch(base+`league/${id}/matchups/${week}`).then(r=>r.ok?r.json():[]).catch(()=>[]);
    matchups=mk||[]; if(matchups.some(m=>(m.points||0)>0)||VIEW.week)break; if(week<=1)break; week--; }
  VIEW.week=week;
  const season=cfg.season||state.season;
  const [wStats,wProj,txns]=await Promise.all([
    fetch(base+`stats/nfl/regular/${season}/${week}`).then(r=>r.ok?r.json():{}).catch(()=>({})),
    fetch(base+`projections/nfl/regular/${season}/${week}`).then(r=>r.ok?r.json():{}).catch(()=>({})),
    fetch(base+`league/${id}/transactions/${week}`).then(r=>r.ok?r.json():[]).catch(()=>[])]);
  const teamSlot=await getSlots(season,week);
  return assemble({league,users,rosters,matchups,txns,week,wStats,wProj,teamSlot});
}

/* NFL schedule -> team game-window map (best effort, graceful) */
async function getSlots(season,week){
  try{
    const url=`https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=${season}&seasontype=2&week=${week}`;
    const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),6000);
    const j=await fetch(url,{signal:ctrl.signal}).then(r=>r.ok?r.json():null); clearTimeout(to);
    if(!j||!j.events)return null;
    const map={};
    j.events.forEach(ev=>{ const iso=ev.date; const slot=slotFromISO(iso);
      const comp=ev.competitions&&ev.competitions[0]; if(!comp)return;
      (comp.competitors||[]).forEach(c=>{ const ab=normTeam(c.team&&(c.team.abbreviation||c.team.abbrev)); if(ab)map[ab]=slot; }); });
    return Object.keys(map).length?map:null;
  }catch(e){ return null; }
}
function slotFromISO(iso){ const d=new Date(iso); const day=d.getUTCDay(),h=d.getUTCHours();
  if(day===5&&h<8)return 'TNF'; if(day===2&&h<8)return 'MNF'; if(day===1&&h<8)return 'SNF';
  if(day===0)return h<20?'SUN_EARLY':'SUN_LATE'; if(day===6)return h<21?'SUN_EARLY':'SUN_LATE'; return 'SUN_EARLY'; }
function normTeam(a){ if(!a)return''; a=a.toUpperCase(); return ({WSH:'WAS',JAC:'JAX',LA:'LAR'})[a]||a; }

function assemble({league,users,rosters,matchups,txns,week,wStats,wProj,teamSlot}){
  const scoring=league.scoring_settings||{};
  const uById={}; (users||[]).forEach(u=>uById[u.user_id]=u);
  const rmeta={}; // roster_id -> team meta
  (rosters||[]).forEach(r=>{ const u=uById[r.owner_id]||{}; const meta=u.metadata||{};
    const s=r.settings||{}; rmeta[r.roster_id]={id:r.roster_id,name:meta.team_name||u.display_name||('Team '+r.roster_id),
      w:s.wins||0,l:s.losses||0,t:s.ties||0,pf:(s.fpts||0)+(s.fpts_decimal||0)/100,pa:(s.fpts_against||0)+(s.fpts_against_decimal||0)/100}; });
  const makeEntry=(entry,id)=>{ const pos=ppos(id); const stats=wStats&&wStats[id];
    const pp=entry.players_points||{}; const points=round1(typeof pp[id]==='number'?pp[id]:scoreStats(stats,scoring));
    const projected=round1(scoreStats(wProj&&wProj[id],scoring));
    const slot=teamSlot?(teamSlot[normTeam(pteam(id))]||null):null;
    return {id,pos,points,projected,stats,line:statLine(pos,stats),slot}; };
  const buildTeam=entry=>{ const starterIds=(entry.starters||[]).filter(x=>x&&x!=='0');
    const benchIds=(entry.players||[]).filter(id=>id&&!starterIds.includes(id));
    const starters=starterIds.map(id=>makeEntry(entry,id)); const bench=benchIds.map(id=>makeEntry(entry,id));
    const meta=rmeta[entry.roster_id]||{name:'Team '+entry.roster_id};
    const score=round1(entry.points&&entry.points>0?entry.points:sum(starters.map(e=>e.points)));
    const top=[...starters].sort((a,b)=>b.points-a.points)[0]||null;
    const bustPool=starters.filter(e=>['QB','RB','WR','TE'].includes(e.pos)&&e.projected>=8).sort((a,b)=>(a.points-a.projected)-(b.points-b.projected));
    const bust=(bustPool.length&&bustPool[0].points<bustPool[0].projected-5)?bustPool[0]:null;
    let benchRegret=null; const bestBench=[...bench].sort((a,b)=>b.points-a.points)[0];
    if(bestBench){ const flex=new Set(['RB','WR','TE']); const weak=[...starters].filter(s=>s.pos===bestBench.pos||(flex.has(s.pos)&&flex.has(bestBench.pos))).sort((a,b)=>a.points-b.points)[0];
      if(weak&&bestBench.points-weak.points>=6)benchRegret={bench:bestBench,starter:weak,diff:round1(bestBench.points-weak.points)}; }
    return {rosterId:entry.roster_id,manager:meta.name,score,starters,bench,top,bust,benchRegret}; };
  const byMid={}; (matchups||[]).forEach(m=>{if(m.matchup_id==null)return;(byMid[m.matchup_id]=byMid[m.matchup_id]||[]).push(m);});
  const stories=[];
  Object.values(byMid).forEach(pair=>{ if(pair.length<2)return; const a=buildTeam(pair[0]),b=buildTeam(pair[1]);
    const [winner,loser]=a.score>=b.score?[a,b]:[b,a];
    stories.push(writeStory({winner,loser,tie:a.score===b.score,margin:round1(Math.abs(a.score-b.score)),combined:round1(a.score+b.score)})); });
  stories.sort((a,b)=>(b.combined-b.margin*0.5)-(a.combined-a.margin*0.5));
  const standings=Object.values(rmeta).sort((a,b)=>(b.w-a.w)||(b.pf-a.pf));
  const maxPf=Math.max(1,...standings.map(t=>t.pf));
  const pr=Object.values(rmeta).map(t=>{const gp=t.w+t.l+t.t||1;const wp=(t.w+t.t*0.5)/gp;return {...t,score:0.58*(t.pf/maxPf)+0.42*wp};}).sort((a,b)=>b.score-a.score);
  const tx=parseTxns(txns,rmeta);
  return {leagueName:cfg.name||league.name,week,stories,standings,pr,tx,demo:false};
}
function parseTxns(txns,team){ const out=[];
  (txns||[]).filter(t=>t.status==='complete').forEach(t=>{ if(t.type==='trade'){ const adds=t.adds||{}; const lines=[];
      (t.roster_ids||[]).forEach(r=>{const got=Object.keys(adds).filter(pid=>adds[pid]===r).map(pid=>pname(pid)); if(got.length)lines.push(`${team[r]?team[r].name:('Team '+r)} get ${got.join(', ')}`);});
      out.push({kind:'Trade',text:lines.join(' · ')});
    }else{ const adds=t.adds||{},drops=t.drops||{}; const rid=(t.roster_ids||[])[0]; const who=team[rid]?team[rid].name:('Team '+rid);
      const a=Object.keys(adds).map(pid=>pname(pid)),d=Object.keys(drops).map(pid=>pname(pid)); if(!a.length&&!d.length)return;
      out.push({kind:t.type==='waiver'?'Waiver':'Free Agent',who,adds:a,drops:d}); } });
  return out; }
function prNote(t,rank,total){ const gp=t.w+t.l+t.t||1,ppg=t.pf/gp,seed=Math.round(t.pf)+rank*7;
  if(rank===0)return seededPick([`Best team in the league, and it isn't especially close.`,`Points and wins both — the class of the field.`,`The team to beat, and everyone knows it.`],seed);
  if(ppg>110&&t.l>=t.w)return seededPick([`Scores like a contender, loses like a rebuild — the schedule owes it an apology.`,`Puts up points with nothing to show for it. Brutal luck.`,`Best roster nobody's afraid of yet. The wins are coming.`],seed);
  if(t.w>t.l&&ppg<98)return seededPick([`Winning games it has no business winning. Nobody's complaining.`,`Finds a way every week, box score be damned.`,`Overachieving and unbothered about it.`],seed);
  if(rank>=Math.ceil(total*0.72))return seededPick([`Running out of season to turn it around.`,`The points aren't there and neither are the wins.`,`Playing for draft position at this point.`,`A long month ahead.`],seed);
  return seededPick([`Right in the muddle of the middle.`,`Dangerous on a good week, invisible on a bad one.`,`A win from moving up, a loss from sliding.`,`Quietly hanging around the bubble.`,`Good, not scary — yet.`],seed); }

/* ===================== RENDER ===================== */
function renderMagazine(d,demo){
  applyAccent(cfg.accent);
  const prev=loadPR(d.week),order=d.pr.map(t=>t.id),mv={};
  d.pr.forEach((t,idx)=>{mv[t.id]=(prev&&prev[t.id]!=null)?prev[t.id]-idx:null;});
  if(!demo)savePR(d.week,order);
  const app=$('#app'); app.innerHTML='';
  app.appendChild(el(`<div class="mag-top">${cfg.logo?`<img src="${cfg.logo}">`:''}
    <div><div class="mt-kick">The Weekly</div><div class="mt-name">${esc(d.leagueName)}</div></div>
    <div class="mt-r"><div class="wk"><button id="wprev">‹</button><div class="wknow">Week ${d.week}</div><button id="wnext">›</button></div>
    <button class="btn ghost sm" id="setup">Setup</button></div></div>`));
  if(demo)app.appendChild(el(`<div class="demoflag" id="demoflag" style="cursor:pointer">Sample issue — this is how your weekly magazine will look. <b style="color:var(--accent)">Tap to set up your league</b> — name, colors, logo, and your Sleeper link.</div>`));
  const lead=d.stories[0];
  app.appendChild(el(`<div class="cover"><div class="cv-in"><div class="cv-kick">Week ${d.week} · The Weekly</div>
    <h2>${esc(lead?lead.headline:('Week '+d.week))}</h2>
    <div class="cv-dek">${esc(lead?lead.dek+' Inside: every matchup with the play-by-play timing, the new standings, and the week\'s power rankings.':'')}</div></div></div>`));

  app.appendChild(el(`<div class="sec">The Matchups</div>`));
  if(d.stories.length) app.appendChild(el(`<div class="sechint">Tap any matchup to open the full write-up. <button class="expandall" id="expandall">Open all ↓</button></div>`));
  if(!d.stories.length) app.appendChild(el(`<div class="step"><div style="color:var(--dim);font-family:var(--serif);font-size:15px;line-height:1.5">No scored matchups for Week ${d.week} yet — standings and power rankings below are current. Use the arrows up top to reach a played week.</div></div>`));
  d.stories.forEach((s,i)=>{
    const stars=(s.stars||[]).map(x=>`<span class="chip"><b>${(+x.points).toFixed(1)}</b> ${esc(pname(x.id))}${x.pos?' · '+x.pos:''}</span>`).join('');
    const tlHtml = s.timeline ? renderTimeline(s) : '';
    const g=el(`<div class="game">
      <div class="ghead"><div class="gh-main"><div class="gh-line">${esc(s.headline)}</div>
        <div class="gh-score"><b>${esc(s.winner.manager)} ${s.winner.score.toFixed(1)}</b> · ${esc(s.loser.manager)} ${s.loser.score.toFixed(1)}</div></div>
        <div class="caret">▸</div></div>
      <div class="art">
        <div class="dek">${esc(s.dek)}</div>
        <div class="scoreline"><div class="sd win"><span class="tm">${esc(s.winner.manager)}</span><span class="pt">${s.winner.score.toFixed(1)}</span></div>
          <span class="vs">def.</span><div class="sd"><span class="tm">${esc(s.loser.manager)}</span><span class="pt">${s.loser.score.toFixed(1)}</span></div></div>
        ${tlHtml}
        ${s.paragraphs.map(p=>`<p>${esc(p)}</p>`).join('')}
        <div class="stars">${stars}</div>
      </div></div>`);
    g.querySelector('.ghead').onclick=()=>g.classList.toggle('open');
    app.appendChild(g);
  });

  app.appendChild(el(`<div class="sec">Standings</div>`));
  app.appendChild(el(`<div class="tblwrap"><table><thead><tr><th>Team</th><th>W-L</th><th>PF</th><th>PA</th></tr></thead>
    <tbody>${d.standings.map((t,i)=>`<tr><td class="team"><span class="rk">${i+1}</span> ${esc(t.name)}</td><td class="num">${t.w}-${t.l}${t.t?'-'+t.t:''}</td><td class="num">${t.pf.toFixed(1)}</td><td class="num">${t.pa.toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`));

  app.appendChild(el(`<div class="sec">Power Rankings</div>`));
  const prBox=el(`<div class="step" style="padding:6px 16px"></div>`);
  d.pr.forEach((t,i)=>{const m=mv[t.id]; const mvh=m==null?`<span class="mv fl">NEW</span>`:(m>0?`<span class="mv up">▲${m}</span>`:(m<0?`<span class="mv dn">▼${-m}</span>`:`<span class="mv fl">—</span>`));
    prBox.appendChild(el(`<div class="pr"><div class="prk">${i+1}</div><div class="prb"><div class="prt">${esc(t.name)} ${mvh}</div><div class="prn">${esc(prNote(t,i,d.pr.length))}</div></div></div>`));});
  app.appendChild(prBox);

  app.appendChild(el(`<div class="sec">Transactions</div>`));
  const txBox=el(`<div class="step" style="padding:8px 16px"></div>`);
  if(!d.tx.length)txBox.appendChild(el(`<div style="color:var(--faint);padding:8px 0;font-size:14px">A quiet week on the wire — no completed moves.</div>`));
  d.tx.forEach(t=>{ if(t.kind==='Trade')txBox.appendChild(el(`<div class="txn"><span class="tk">Trade</span><span class="tt">${esc(t.text)}</span></div>`));
    else txBox.appendChild(el(`<div class="txn"><span class="tk">${t.kind}</span><span class="tt">${esc(t.who)}</span> ${t.adds.length?`<span class="add">+ ${esc(t.adds.join(', '))}</span>`:''} ${t.drops.length?`<span class="drop">— ${esc(t.drops.join(', '))}</span>`:''}</div>`));});
  app.appendChild(txBox);

  app.appendChild(el(`<div class="foot">${esc(d.leagueName)} · Week ${d.week} · generated from Sleeper${d.stories[0]&&d.stories[0].timeline?'':' · timing shown when the game schedule is available'}</div>`));
  $('#setup').onclick=renderSetup;
  if($('#demoflag'))$('#demoflag').onclick=renderSetup;
  if($('#expandall'))$('#expandall').onclick=()=>{const opened=document.querySelectorAll('.game.open').length;document.querySelectorAll('.game').forEach(g=>g.classList.toggle('open',opened===0));$('#expandall').textContent=opened===0?'Close all ↑':'Open all ↓';};
  $('#wprev').onclick=()=>{VIEW.week=Math.max(1,d.week-1);openMagazine(demo);};
  $('#wnext').onclick=()=>{VIEW.week=d.week+1;openMagazine(demo);};
  window.scrollTo(0,0);
}
function renderTimeline(s){ const tl=s.timeline; const W=s.winner.manager,L=s.loser.manager;
  const finalW=tl.windows[tl.windows.length-1].wCum||1;
  const rows=tl.windows.map(w=>{ const pct=Math.max(6,Math.min(100,Math.round(w.wCum/finalW*100)));
    return `<div class="tlrow"><div class="tllab">${SLOT_SHORT[w.slot]||w.name}</div>
      <div class="tlbar"><div class="tlfill" style="width:${pct}%"></div></div>
      <div class="tlsc">${w.wCum.toFixed(1)} <span class="lz">– ${w.lCum.toFixed(1)}</span></div></div>`;}).join('');
  return `<div class="timeline"><div class="tl-h">How it unfolded · ${esc(W)} vs ${esc(L)}</div>${rows}</div>`;
}
function loadPR(week){try{const o=JSON.parse(localStorage.getItem(PR_KEY))||{};const p=o[week-1];if(!p)return null;const m={};p.forEach((id,i)=>m[id]=i);return m;}catch(e){return null;}}
function savePR(week,order){try{const o=JSON.parse(localStorage.getItem(PR_KEY))||{};o[week]=order;localStorage.setItem(PR_KEY,JSON.stringify(o));}catch(e){}}

/* ===================== DEMO (baked stats + slots for verification) ===================== */
function st(name,pos,pts,proj,stats,slot){return {id:name,pos,points:pts,projected:proj,stats,line:statLine(pos,stats),slot};}
function team(name,rid,starters){ const score=round1(sum(starters.map(e=>e.points)));
  const top=[...starters].sort((a,b)=>b.points-a.points)[0];
  const bustPool=starters.filter(e=>['QB','RB','WR','TE'].includes(e.pos)&&e.projected>=8).sort((a,b)=>(a.points-a.projected)-(b.points-b.projected));
  const bust=(bustPool.length&&bustPool[0].points<bustPool[0].projected-5)?bustPool[0]:null;
  return {rosterId:rid,manager:name,score,starters,bench:[],top,bust,benchRegret:null}; }
