<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c20f16">
<title>League Magazine — Setup</title>
<style>
  :root{
    --bg:#ffffff; --bg2:#f4f5f6; --card:#ffffff; --card2:#f7f2f2; --border:#e4e0dd;
    --text:#18191d; --dim:#54565c; --faint:#8a8d93;
    --accent:#c20f16; --accent-d:#8f0a10; --on-accent:#ffffff;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); }
  #app{ max-width:760px; margin:0 auto; padding:26px 20px 80px; }

  .brandbar{ display:flex; align-items:center; gap:12px; border-bottom:2px solid var(--text);
    padding-bottom:12px; margin-bottom:22px; }
  .brandbar img{ width:40px; height:40px; object-fit:contain; border-radius:8px; }
  .brandbar .bb-kick{ font-size:10px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--accent); }
  .brandbar .bb-name{ font-family:var(--serif); font-weight:900; font-size:22px; line-height:1.05; }

  h1{ font-family:var(--serif); font-size:30px; line-height:1.1; margin:0 0 6px; text-wrap:balance; }
  .sub{ color:var(--dim); font-size:15px; line-height:1.55; margin:0 0 24px; max-width:60ch; }

  .step{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px 18px 20px;
    margin-bottom:16px; box-shadow:0 1px 2px rgba(20,10,10,.04), 0 10px 30px -24px rgba(20,10,10,.4); }
  .step-h{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .step-n{ width:26px; height:26px; flex:none; border-radius:50%; background:var(--accent); color:var(--on-accent);
    font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .step-t{ font-weight:800; font-size:16px; }
  .step-d{ color:var(--faint); font-size:12.5px; margin:-8px 0 14px 36px; }

  label.fld{ display:block; font-size:12px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
    color:var(--dim); margin:0 0 6px; }
  .input{ width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:12px;
    color:var(--text); padding:13px; font-size:15px; font-family:var(--sans); }
  .input:focus{ outline:none; border-color:var(--accent); }
  .row{ display:flex; gap:12px; flex-wrap:wrap; }
  .row > *{ flex:1; min-width:0; }
  .gap{ height:14px; }

  /* color presets */
  .swatches{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .sw{ width:34px; height:34px; border-radius:9px; border:2px solid transparent; cursor:pointer; position:relative; }
  .sw.on{ border-color:var(--text); }
  .sw.on::after{ content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:15px; font-weight:900; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .sw.custom{ background:conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
  input[type=color]{ position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; }

  /* logo drop */
  .logo-drop{ display:flex; align-items:center; gap:14px; }
  .logo-prev{ width:72px; height:72px; flex:none; border-radius:12px; border:1px dashed var(--border);
    background:var(--bg2); display:flex; align-items:center; justify-content:center; overflow:hidden;
    color:var(--faint); font-size:11px; text-align:center; }
  .logo-prev img{ width:100%; height:100%; object-fit:contain; }
  .btn{ border:1px solid var(--accent); background:var(--accent); color:var(--on-accent);
    font-weight:800; font-size:15px; padding:13px 18px; border-radius:12px; cursor:pointer; width:100%; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn.ghost{ background:transparent; color:var(--text); border-color:var(--border); }
  .btn.sm{ width:auto; padding:9px 14px; font-size:13px; }
  .hint{ color:var(--faint); font-size:12px; margin-top:8px; }
  .err{ color:var(--accent); font-size:13px; font-weight:700; margin-top:10px; min-height:1px; }

  /* league picks */
  .league{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px;
    border:1px solid var(--border); border-radius:12px; margin-top:8px; cursor:pointer; background:var(--card); }
  .league:hover{ border-color:var(--accent); }
  .league .ln{ font-weight:800; font-size:15px; }
  .league .lm{ color:var(--faint); font-size:12px; }
  .league.on{ border-color:var(--accent); background:var(--card2); }

  .preview{ border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .pv-mast{ display:flex; align-items:center; gap:12px; padding:16px; border-bottom:3px solid var(--accent); }
  .pv-mast img{ width:44px; height:44px; object-fit:contain; }
  .pv-kick{ font-size:10px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--accent); }
  .pv-name{ font-family:var(--serif); font-weight:900; font-size:24px; line-height:1.05; }
  .pv-body{ padding:14px 16px; color:var(--dim); font-size:13px; }
  .spinner{ width:22px; height:22px; border:3px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite; display:inline-block; vertical-align:middle; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .foot{ text-align:center; color:var(--faint); font-size:11px; margin-top:26px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";
const LS_KEY = 'leaguemag.config.v1';
const $ = (s,r=document)=>r.querySelector(s);
const el = (h)=>{ const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstChild; };

const PRESETS = [
  ['#c20f16','Red'], ['#1d4ed8','Blue'], ['#047857','Green'],
  ['#7c3aed','Purple'], ['#ea580c','Orange'], ['#0f172a','Ink']
];

let cfg = load() || { name:'', tagline:'', accent:'#c20f16', logo:'', platform:'sleeper',
                      sleeperUser:'', season:'2025', leagueId:'', leagueName:'' };

function load(){ try{ return JSON.parse(localStorage.getItem(LS_KEY)); }catch(e){ return null; } }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(cfg)); }
function applyAccent(hex){ document.documentElement.style.setProperty('--accent', hex);
  document.documentElement.style.setProperty('--accent-d', shade(hex,-22)); }
function shade(hex,p){ const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=(1+p/100); r=Math.max(0,Math.min(255,r*f))|0; g=Math.max(0,Math.min(255,g*f))|0; b=Math.max(0,Math.min(255,b*f))|0;
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1); }

// ---------- SETUP WIZARD ----------
function renderSetup(){
  applyAccent(cfg.accent);
  const app = $('#app'); app.innerHTML='';

  app.appendChild(el(`<div>
    <h1>Set up your league magazine</h1>
    <p class="sub">A weekly, page-turning magazine for your fantasy league — matchups and matchup stories,
      in your colors, under your logo. Everything is saved right here in your browser. No account, no server.</p>
  </div>`));

  // STEP 1 — identity
  const s1 = el(`<div class="step">
    <div class="step-h"><div class="step-n">1</div><div class="step-t">Name your league</div></div>
    <label class="fld">League name</label>
    <input class="input" id="f-name" placeholder="e.g. The Gridiron Gauntlet" value="${esc(cfg.name)}">
    <div class="gap"></div>
    <label class="fld">Tagline (optional)</label>
    <input class="input" id="f-tag" placeholder="e.g. 12-Team PPR · Est. 2014" value="${esc(cfg.tagline)}">
  </div>`);
  app.appendChild(s1);

  // STEP 2 — colors
  const s2 = el(`<div class="step">
    <div class="step-h"><div class="step-n">2</div><div class="step-t">Pick your color</div></div>
    <div class="swatches" id="sw"></div>
  </div>`);
  app.appendChild(s2);
  const sw = $('#sw', s2);
  PRESETS.forEach(([hex,name])=>{
    const b = el(`<div class="sw" title="${name}" style="background:${hex}"></div>`);
    b.onclick=()=>{ cfg.accent=hex; applyAccent(hex); markSw(); renderPreview(); };
    b.dataset.hex=hex; sw.appendChild(b);
  });
  const custom = el(`<div class="sw custom" title="Custom"><input type="color" value="${cfg.accent}"></div>`);
  $('input',custom).oninput=(e)=>{ cfg.accent=e.target.value; applyAccent(cfg.accent); markSw(); renderPreview(); };
  sw.appendChild(custom);

  // STEP 3 — logo
  const s3 = el(`<div class="step">
    <div class="step-h"><div class="step-n">3</div><div class="step-t">Upload your logo</div></div>
    <div class="logo-drop">
      <div class="logo-prev" id="logo-prev">${cfg.logo?`<img src="${cfg.logo}">`:'PNG / JPG<br>square works best'}</div>
      <div>
        <button class="btn ghost sm" id="logo-btn">Choose image…</button>
        ${cfg.logo?'<button class="btn ghost sm" id="logo-clear" style="margin-top:8px">Remove</button>':''}
        <div class="hint">Stored in your browser, embedded in the magazine.</div>
      </div>
      <input type="file" id="logo-file" accept="image/*" hidden>
    </div>
  </div>`);
  app.appendChild(s3);
  $('#logo-btn',s3).onclick=()=>$('#logo-file',s3).click();
  $('#logo-file',s3).onchange=(e)=>{ const f=e.target.files[0]; if(!f) return;
    const rd=new FileReader(); rd.onload=()=>{ cfg.logo=rd.result; renderSetup(); renderPreview(); }; rd.readAsDataURL(f); };
  if($('#logo-clear',s3)) $('#logo-clear',s3).onclick=()=>{ cfg.logo=''; renderSetup(); renderPreview(); };

  // STEP 4 — connect Sleeper
  const s4 = el(`<div class="step">
    <div class="step-h"><div class="step-n">4</div><div class="step-t">Connect your Sleeper league</div></div>
    <div class="step-d">Enter your Sleeper username, then pick the league. We only read public league data.</div>
    <div class="row">
      <div style="flex:2">
        <label class="fld">Sleeper username</label>
        <input class="input" id="f-user" placeholder="your Sleeper username" value="${esc(cfg.sleeperUser)}">
      </div>
      <div style="flex:1">
        <label class="fld">Season</label>
        <input class="input" id="f-season" value="${esc(cfg.season||'2025')}">
      </div>
    </div>
    <div class="gap"></div>
    <button class="btn" id="find">Find my leagues</button>
    <div class="err" id="find-err"></div>
    <div id="leagues"></div>
  </div>`);
  app.appendChild(s4);
  $('#find',s4).onclick=findLeagues;

  // live preview
  const pv = el(`<div class="step">
    <div class="step-h"><div class="step-n">✦</div><div class="step-t">Preview</div></div>
    <div class="preview" id="preview"></div>
    <div class="gap"></div>
    <button class="btn" id="save" disabled>Save & open my magazine</button>
    <div class="hint" id="save-hint">Connect a league above to finish.</div>
  </div>`);
  app.appendChild(pv);
  $('#save',pv).onclick=()=>{ collect(); save(); renderHome(); };

  app.appendChild(el(`<div class="foot">Self-contained · saved in this browser · export a backup anytime</div>`));

  // wire text inputs to live preview
  ['f-name','f-tag'].forEach(id=>{ const n=$('#'+id); n && n.addEventListener('input', ()=>{ collect(); renderPreview(); }); });
  markSw(); renderPreview();
}

function markSw(){ document.querySelectorAll('.sw').forEach(s=>{
  s.classList.toggle('on', s.dataset.hex && s.dataset.hex.toLowerCase()===cfg.accent.toLowerCase()); }); }

function collect(){
  cfg.name = ($('#f-name')||{}).value ?? cfg.name;
  cfg.tagline = ($('#f-tag')||{}).value ?? cfg.tagline;
  cfg.sleeperUser = ($('#f-user')||{}).value ?? cfg.sleeperUser;
  cfg.season = ($('#f-season')||{}).value ?? cfg.season;
}

function renderPreview(){
  const p = $('#preview'); if(!p) return;
  p.innerHTML = `
    <div class="pv-mast">
      ${cfg.logo?`<img src="${cfg.logo}">`:''}
      <div>
        <div class="pv-kick">The Weekly · powered by Sleeper</div>
        <div class="pv-name">${esc(cfg.name||'Your League Name')}</div>
      </div>
    </div>
    <div class="pv-body">${esc(cfg.tagline||'Your tagline appears here.')} — matchups, scores, and the week's stories.</div>`;
  const canSave = cfg.leagueId && cfg.name;
  const sb=$('#save'), sh=$('#save-hint');
  if(sb){ sb.disabled=!canSave; }
  if(sh){ sh.textContent = canSave ? 'Ready.' : (cfg.leagueId?'Add a league name up top to finish.':'Connect a league above to finish.'); }
}

// ---------- SLEEPER FETCH ----------
async function findLeagues(){
  collect();
  const err = $('#find-err'), box = $('#leagues');
  err.textContent=''; box.innerHTML='<div style="padding:12px 0"><span class="spinner"></span> Looking up your leagues…</div>';
  const user = (cfg.sleeperUser||'').trim();
  if(!user){ err.textContent='Enter your Sleeper username first.'; box.innerHTML=''; return; }
  try{
    const u = await fetch('https://api.sleeper.app/v1/user/'+encodeURIComponent(user)).then(r=>r.ok?r.json():null);
    if(!u || !u.user_id){ err.textContent='No Sleeper user by that name. Check the spelling.'; box.innerHTML=''; return; }
    const season = (cfg.season||'2025').trim();
    const leagues = await fetch(`https://api.sleeper.app/v1/user/${u.user_id}/leagues/nfl/${season}`).then(r=>r.ok?r.json():[]);
    if(!leagues || !leagues.length){ err.textContent=`No leagues found for ${user} in ${season}. Try a different season.`; box.innerHTML=''; return; }
    box.innerHTML='';
    leagues.forEach(lg=>{
      const row = el(`<div class="league" data-id="${lg.league_id}">
        <div><div class="ln">${esc(lg.name)}</div><div class="lm">${lg.total_rosters||'?'} teams · ${lg.season} · ${esc(lg.status||'')}</div></div>
        <div style="color:var(--accent);font-weight:900">Select ›</div></div>`);
      row.onclick=()=>{ cfg.leagueId=lg.league_id; cfg.leagueName=lg.name;
        box.querySelectorAll('.league').forEach(r=>r.classList.remove('on')); row.classList.add('on');
        if(!cfg.name) { cfg.name=lg.name; const n=$('#f-name'); if(n) n.value=lg.name; }
        renderPreview(); };
      box.appendChild(row);
    });
  }catch(e){
    err.textContent='Could not reach Sleeper. Check your connection and try again.'; box.innerHTML='';
  }
}

// ---------- HOME (post-setup placeholder) ----------
function renderHome(){
  applyAccent(cfg.accent);
  const app=$('#app'); app.innerHTML='';
  app.appendChild(el(`<div class="brandbar">
    ${cfg.logo?`<img src="${cfg.logo}">`:''}
    <div><div class="bb-kick">The Weekly</div><div class="bb-name">${esc(cfg.name)}</div></div>
    <button class="btn ghost sm" id="edit" style="margin-left:auto">Setup</button>
  </div>`));
  app.appendChild(el(`<div class="step">
    <div class="step-t" style="margin-bottom:6px">✓ Connected: ${esc(cfg.leagueName||cfg.leagueId)}</div>
    <p class="sub" style="margin:0">Your league is linked and your branding is saved. The weekly matchup
      magazine gets generated here — that's the next piece to build in.</p>
  </div>`));
  app.appendChild(el(`<div class="foot">League ID ${esc(cfg.leagueId)} · season ${esc(cfg.season)}</div>`));
  $('#edit').onclick=()=>renderSetup();
}

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// boot
if(cfg.leagueId && cfg.name){ renderHome(); } else { renderSetup(); }
</script>
</body>
</html>
