<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c20f16">
<title>League Magazine</title>
<style>
  :root{
    --bg:#ffffff; --bg2:#f4f5f6; --card:#ffffff; --card2:#f7f2f2; --border:#e4e0dd;
    --text:#18191d; --dim:#54565c; --faint:#8a8d93;
    --accent:#c20f16; --accent-d:#8f0a10; --on-accent:#ffffff;
    --serif:Georgia,'Times New Roman',serif;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--sans); }
  #app{ max-width:820px; margin:0 auto; padding:22px 18px 90px; }
  a{ color:var(--accent); }

  /* ---------- shared ---------- */
  .btn{ border:1px solid var(--accent); background:var(--accent); color:var(--on-accent);
    font-weight:800; font-size:15px; padding:13px 18px; border-radius:12px; cursor:pointer; width:100%; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn.ghost{ background:transparent; color:var(--text); border-color:var(--border); }
  .btn.sm{ width:auto; padding:9px 14px; font-size:13px; }
  .input{ width:100%; background:var(--bg2); border:1px solid var(--border); border-radius:12px;
    color:var(--text); padding:13px; font-size:15px; font-family:var(--sans); }
  .input:focus{ outline:none; border-color:var(--accent); }
  .hint{ color:var(--faint); font-size:12px; margin-top:8px; }
  .err{ color:var(--accent); font-size:13px; font-weight:700; margin-top:10px; }
  .spinner{ width:22px; height:22px; border:3px solid var(--border); border-top-color:var(--accent);
    border-radius:50%; animation:spin .8s linear infinite; display:inline-block; vertical-align:middle; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- setup wizard ---------- */
  h1{ font-family:var(--serif); font-size:30px; line-height:1.1; margin:0 0 6px; text-wrap:balance; }
  .sub{ color:var(--dim); font-size:15px; line-height:1.55; margin:0 0 24px; max-width:60ch; }
  .step{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:18px;
    margin-bottom:16px; box-shadow:0 1px 2px rgba(20,10,10,.04), 0 10px 30px -24px rgba(20,10,10,.4); }
  .step-h{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .step-n{ width:26px; height:26px; flex:none; border-radius:50%; background:var(--accent); color:var(--on-accent);
    font-weight:900; font-size:13px; display:flex; align-items:center; justify-content:center; }
  .step-t{ font-weight:800; font-size:16px; }
  .step-d{ color:var(--faint); font-size:12.5px; margin:-8px 0 14px 36px; }
  label.fld{ display:block; font-size:12px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
    color:var(--dim); margin:0 0 6px; }
  .row{ display:flex; gap:12px; flex-wrap:wrap; } .row>*{ flex:1; min-width:0; } .gap{ height:14px; }
  .swatches{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .sw{ width:34px; height:34px; border-radius:9px; border:2px solid transparent; cursor:pointer; position:relative; }
  .sw.on{ border-color:var(--text); }
  .sw.on::after{ content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:15px; font-weight:900; text-shadow:0 1px 3px rgba(0,0,0,.5); }
  .sw.custom{ background:conic-gradient(from 0deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); }
  input[type=color]{ position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer; }
  .logo-drop{ display:flex; align-items:center; gap:14px; }
  .logo-prev{ width:72px; height:72px; flex:none; border-radius:12px; border:1px dashed var(--border);
    background:var(--bg2); display:flex; align-items:center; justify-content:center; overflow:hidden;
    color:var(--faint); font-size:11px; text-align:center; }
  .logo-prev img{ width:100%; height:100%; object-fit:contain; }
  .league{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 14px;
    border:1px solid var(--border); border-radius:12px; margin-top:8px; cursor:pointer; }
  .league:hover{ border-color:var(--accent); } .league.on{ border-color:var(--accent); background:var(--card2); }
  .league .ln{ font-weight:800; font-size:15px; } .league .lm{ color:var(--faint); font-size:12px; }
  .preview{ border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .pv-mast{ display:flex; align-items:center; gap:12px; padding:16px; border-bottom:3px solid var(--accent); }
  .pv-mast img{ width:44px; height:44px; object-fit:contain; }
  .pv-kick{ font-size:10px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--accent); }
  .pv-name{ font-family:var(--serif); font-weight:900; font-size:24px; line-height:1.05; }
  .pv-body{ padding:14px 16px; color:var(--dim); font-size:13px; }
  .foot{ text-align:center; color:var(--faint); font-size:11px; margin-top:26px; }

  /* ---------- magazine ---------- */
  .mag-top{ display:flex; align-items:center; gap:12px; border-bottom:2px solid var(--text);
    padding-bottom:10px; margin-bottom:18px; position:sticky; top:0; background:var(--bg); z-index:5; }
  .mag-top img{ width:34px; height:34px; object-fit:contain; }
  .mag-top .mt-kick{ font-size:9px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--accent); }
  .mag-top .mt-name{ font-family:var(--serif); font-weight:900; font-size:19px; line-height:1; }
  .mag-top .mt-r{ margin-left:auto; display:flex; gap:8px; align-items:center; }
  .wk{ display:flex; align-items:center; gap:6px; }
  .wk button{ background:var(--bg2); border:1px solid var(--border); color:var(--text); width:32px; height:32px;
    border-radius:8px; font-size:18px; font-weight:800; cursor:pointer; }
  .wk .wknow{ font-weight:800; font-size:13px; min-width:74px; text-align:center; }

  .cover{ position:relative; border:1px solid var(--border); border-radius:16px; overflow:hidden; margin-bottom:18px;
    background:linear-gradient(160deg, color-mix(in srgb, var(--accent) 8%, #fff), #fff 70%); border-top:5px solid var(--accent); }
  .cover .cv-in{ padding:22px 20px 24px; }
  .cover .cv-kick{ font-size:11px; font-weight:900; letter-spacing:2.5px; text-transform:uppercase; color:var(--accent); }
  .cover h2{ font-family:var(--serif); font-size:31px; line-height:1.08; margin:8px 0 10px; text-wrap:balance; }
  .cover .cv-dek{ color:var(--dim); font-size:15px; line-height:1.5; max-width:56ch; }

  .sec{ font-size:12px; font-weight:900; letter-spacing:2px; text-transform:uppercase; color:var(--accent);
    border-left:4px solid var(--accent); padding:2px 0 2px 10px; margin:26px 0 12px; }

  .game{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px 16px 18px; margin-bottom:14px;
    box-shadow:0 10px 30px -26px rgba(20,10,10,.5); }
  .game .gh{ font-family:var(--serif); font-size:20px; line-height:1.15; margin:0 0 10px; }
  .score{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .score .sd{ flex:1; display:flex; justify-content:space-between; align-items:baseline; padding:7px 11px; border-radius:9px; background:var(--bg2); }
  .score .sd.win{ background:color-mix(in srgb, var(--accent) 10%, #fff); border:1px solid color-mix(in srgb, var(--accent) 35%, #fff); }
  .score .tm{ font-weight:800; font-size:14px; } .score .pt{ font-weight:900; font-size:17px; font-variant-numeric:tabular-nums; }
  .score .vs{ color:var(--faint); font-weight:800; font-size:12px; }
  .game p{ margin:0 0 9px; font-family:var(--serif); font-size:15px; line-height:1.55; color:#26272c; }
  .game .stars{ display:flex; gap:8px; flex-wrap:wrap; margin-top:4px; }
  .chip{ font-size:11px; font-weight:800; background:var(--bg2); border:1px solid var(--border); border-radius:999px; padding:4px 10px; }
  .chip b{ color:var(--accent); }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .tblwrap{ overflow-x:auto; border:1px solid var(--border); border-radius:12px; }
  th,td{ padding:9px 10px; text-align:right; white-space:nowrap; }
  th:first-child,td:first-child{ text-align:left; }
  thead th{ font-size:10px; letter-spacing:.6px; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--border); }
  tbody tr:nth-child(even){ background:var(--bg2); }
  td.team{ font-weight:800; } .num{ font-variant-numeric:tabular-nums; }
  .rk{ display:inline-flex; width:20px; justify-content:center; color:var(--faint); font-weight:800; }

  .pr{ display:flex; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border); }
  .pr:last-child{ border-bottom:none; }
  .pr .prk{ font-family:var(--serif); font-weight:900; font-size:26px; width:34px; text-align:center; color:var(--accent); line-height:1; }
  .pr .prb .prt{ font-weight:800; font-size:15px; } .pr .prb .prn{ color:var(--dim); font-size:13.5px; font-family:var(--serif); line-height:1.5; margin-top:2px; }
  .mv{ font-size:11px; font-weight:800; margin-left:6px; } .mv.up{ color:#0a8f3c; } .mv.dn{ color:var(--accent); } .mv.fl{ color:var(--faint); }

  .txn{ padding:10px 4px; border-bottom:1px solid var(--border); font-size:14px; }
  .txn:last-child{ border-bottom:none; }
  .txn .tk{ font-size:10px; font-weight:900; letter-spacing:1px; text-transform:uppercase; color:var(--accent); margin-right:8px; }
  .txn .tt{ font-weight:800; } .txn .add{ color:#0a8f3c; font-weight:700; } .txn .drop{ color:var(--faint); }
  .demoflag{ text-align:center; font-size:11px; color:var(--faint); background:var(--bg2); border:1px dashed var(--border);
    border-radius:8px; padding:6px; margin-bottom:14px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
const LS_KEY='leaguemag.config.v1', PR_KEY='leaguemag.pr.v1';
const $=(s,r=document)=>r.querySelector(s);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild;};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=(arr,seed)=>arr[Math.abs(seed)%arr.length];
const PRESETS=[['#c20f16','Red'],['#1d4ed8','Blue'],['#047857','Green'],['#7c3aed','Purple'],['#ea580c','Orange'],['#0f172a','Ink']];

let cfg=load()||{name:'',tagline:'',accent:'#c20f16',logo:'',platform:'sleeper',sleeperUser:'',season:'2025',leagueId:'',leagueName:''};
let PLAYERS=null, VIEW={week:null};

function load(){try{return JSON.parse(localStorage.getItem(LS_KEY));}catch(e){return null;}}
function save(){localStorage.setItem(LS_KEY,JSON.stringify(cfg));}
function applyAccent(hex){const r=document.documentElement;r.style.setProperty('--accent',hex);r.style.setProperty('--accent-d',shade(hex,-22));}
function shade(hex,p){const n=parseInt(hex.slice(1),16);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;const f=1+p/100;
  r=Math.max(0,Math.min(255,r*f))|0;g=Math.max(0,Math.min(255,g*f))|0;b=Math.max(0,Math.min(255,b*f))|0;
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}

/* ============================ SETUP WIZARD ============================ */
function renderSetup(){
  applyAccent(cfg.accent); const app=$('#app'); app.innerHTML='';
  app.appendChild(el(`<div><h1>Set up your league magazine</h1>
    <p class="sub">A weekly magazine for your fantasy league — matchups and matchup stories, standings, power
      rankings and transactions, in your colors and under your logo. Saved in your browser. No account, no server.</p></div>`));
  const s1=el(`<div class="step"><div class="step-h"><div class="step-n">1</div><div class="step-t">Name your league</div></div>
    <label class="fld">League name</label><input class="input" id="f-name" placeholder="e.g. The Gridiron Gauntlet" value="${esc(cfg.name)}">
    <div class="gap"></div><label class="fld">Tagline (optional)</label>
    <input class="input" id="f-tag" placeholder="e.g. 12-Team PPR · Est. 2014" value="${esc(cfg.tagline)}"></div>`);
  app.appendChild(s1);
  const s2=el(`<div class="step"><div class="step-h"><div class="step-n">2</div><div class="step-t">Pick your color</div></div><div class="swatches" id="sw"></div></div>`);
  app.appendChild(s2); const sw=$('#sw',s2);
  PRESETS.forEach(([hex,name])=>{const b=el(`<div class="sw" title="${name}" style="background:${hex}"></div>`);b.dataset.hex=hex;
    b.onclick=()=>{cfg.accent=hex;applyAccent(hex);markSw();renderPreview();};sw.appendChild(b);});
  const custom=el(`<div class="sw custom" title="Custom"><input type="color" value="${cfg.accent}"></div>`);
  $('input',custom).oninput=e=>{cfg.accent=e.target.value;applyAccent(cfg.accent);markSw();renderPreview();};sw.appendChild(custom);
  const s3=el(`<div class="step"><div class="step-h"><div class="step-n">3</div><div class="step-t">Upload your logo</div></div>
    <div class="logo-drop"><div class="logo-prev" id="logo-prev">${cfg.logo?`<img src="${cfg.logo}">`:'PNG / JPG<br>square works best'}</div>
    <div><button class="btn ghost sm" id="logo-btn">Choose image…</button>
    ${cfg.logo?'<button class="btn ghost sm" id="logo-clear" style="margin-top:8px">Remove</button>':''}
    <div class="hint">Stored in your browser, embedded in the magazine.</div></div>
    <input type="file" id="logo-file" accept="image/*" hidden></div></div>`);
  app.appendChild(s3);
  $('#logo-btn',s3).onclick=()=>$('#logo-file',s3).click();
  $('#logo-file',s3).onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{cfg.logo=rd.result;renderSetup();};rd.readAsDataURL(f);};
  if($('#logo-clear',s3))$('#logo-clear',s3).onclick=()=>{cfg.logo='';renderSetup();};
  const s4=el(`<div class="step"><div class="step-h"><div class="step-n">4</div><div class="step-t">Connect your Sleeper league</div></div>
    <div class="step-d">Enter your Sleeper username, then pick the league. Only public league data is read.</div>
    <div class="row"><div style="flex:2"><label class="fld">Sleeper username</label>
    <input class="input" id="f-user" placeholder="your Sleeper username" value="${esc(cfg.sleeperUser)}"></div>
    <div style="flex:1"><label class="fld">Season</label><input class="input" id="f-season" value="${esc(cfg.season||'2025')}"></div></div>
    <div class="gap"></div><button class="btn" id="find">Find my leagues</button>
    <div class="err" id="find-err"></div><div id="leagues"></div></div>`);
  app.appendChild(s4); $('#find',s4).onclick=findLeagues;
  const pv=el(`<div class="step"><div class="step-h"><div class="step-n">✦</div><div class="step-t">Preview</div></div>
    <div class="preview" id="preview"></div><div class="gap"></div>
    <button class="btn" id="save" disabled>Save &amp; open my magazine</button>
    <div class="hint" id="save-hint">Connect a league above to finish.</div>
    <div class="gap"></div><button class="btn ghost sm" id="demo">See a demo issue first</button></div>`);
  app.appendChild(pv);
  $('#save',pv).onclick=()=>{collect();save();openMagazine();};
  $('#demo',pv).onclick=()=>openMagazine(true);
  app.appendChild(el(`<div class="foot">Self-contained · saved in this browser</div>`));
  ['f-name','f-tag'].forEach(id=>{const n=$('#'+id);n&&n.addEventListener('input',()=>{collect();renderPreview();});});
  markSw(); renderPreview();
}
function markSw(){document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on',s.dataset.hex&&s.dataset.hex.toLowerCase()===cfg.accent.toLowerCase()));}
function collect(){cfg.name=($('#f-name')||{}).value??cfg.name;cfg.tagline=($('#f-tag')||{}).value??cfg.tagline;
  cfg.sleeperUser=($('#f-user')||{}).value??cfg.sleeperUser;cfg.season=($('#f-season')||{}).value??cfg.season;}
function renderPreview(){const p=$('#preview');if(!p)return;
  p.innerHTML=`<div class="pv-mast">${cfg.logo?`<img src="${cfg.logo}">`:''}<div>
    <div class="pv-kick">The Weekly · powered by Sleeper</div><div class="pv-name">${esc(cfg.name||'Your League Name')}</div></div></div>
    <div class="pv-body">${esc(cfg.tagline||'Your tagline appears here.')} — matchups, standings, power rankings, transactions.</div>`;
  const can=cfg.leagueId&&cfg.name,sb=$('#save'),sh=$('#save-hint');
  if(sb)sb.disabled=!can; if(sh)sh.textContent=can?'Ready.':(cfg.leagueId?'Add a league name up top to finish.':'Connect a league above to finish.');}

async function findLeagues(){
  collect();const err=$('#find-err'),box=$('#leagues');err.textContent='';
  box.innerHTML='<div style="padding:12px 0"><span class="spinner"></span> Looking up your leagues…</div>';
  const user=(cfg.sleeperUser||'').trim();
  if(!user){err.textContent='Enter your Sleeper username first.';box.innerHTML='';return;}
  try{
    const u=await fetch('https://api.sleeper.app/v1/user/'+encodeURIComponent(user)).then(r=>r.ok?r.json():null);
    if(!u||!u.user_id){err.textContent='No Sleeper user by that name. Check the spelling.';box.innerHTML='';return;}
    const season=(cfg.season||'2025').trim();
    const lgs=await fetch(`https://api.sleeper.app/v1/user/${u.user_id}/leagues/nfl/${season}`).then(r=>r.ok?r.json():[]);
    if(!lgs||!lgs.length){err.textContent=`No leagues for ${user} in ${season}. Try another season.`;box.innerHTML='';return;}
    box.innerHTML='';
    lgs.forEach(lg=>{const row=el(`<div class="league" data-id="${lg.league_id}">
      <div><div class="ln">${esc(lg.name)}</div><div class="lm">${lg.total_rosters||'?'} teams · ${lg.season} · ${esc(lg.status||'')}</div></div>
      <div style="color:var(--accent);font-weight:900">Select ›</div></div>`);
      row.onclick=()=>{cfg.leagueId=lg.league_id;cfg.leagueName=lg.name;
        box.querySelectorAll('.league').forEach(r=>r.classList.remove('on'));row.classList.add('on');
        if(!cfg.name){cfg.name=lg.name;const n=$('#f-name');if(n)n.value=lg.name;}renderPreview();};
      box.appendChild(row);});
  }catch(e){err.textContent='Could not reach Sleeper. Check your connection and try again.';box.innerHTML='';}
}

/* ============================ MAGAZINE ============================ */
async function openMagazine(demo){
  applyAccent(cfg.accent);const app=$('#app');
  app.innerHTML=`<div style="text-align:center;padding:80px 0;color:var(--dim)"><span class="spinner"></span><div style="margin-top:12px">Building this week's issue…</div></div>`;
  let data;
  try{ data = demo ? DEMO() : await buildWeek(); }
  catch(e){ app.innerHTML=`<div class="step"><div class="step-t">Couldn't build the issue</div>
    <p class="sub">${esc(e.message||e)}</p><button class="btn ghost sm" id="back">Back to setup</button></div>`;
    $('#back').onclick=renderSetup; return; }
  renderMagazine(data, !!demo);
}

async function buildWeek(){
  const id=cfg.leagueId; if(!id) throw new Error('No league connected.');
  const base='https://api.sleeper.app/v1/';
  const [league,users,rosters,state]=await Promise.all([
    fetch(base+'league/'+id).then(r=>r.json()),
    fetch(base+'league/'+id+'/users').then(r=>r.json()),
    fetch(base+'league/'+id+'/rosters').then(r=>r.json()),
    fetch(base+'state/nfl').then(r=>r.json())
  ]);
  if(!PLAYERS){ PLAYERS = trimPlayers(await fetch(base+'players/nfl').then(r=>r.json())); }
  let week = VIEW.week || Math.max(1,(state.week||1) - (state.season_type==='regular'?0:0));
  // if current week has no scores yet, step back to last completed
  VIEW.week = week;
  const [matchups,txns]=await Promise.all([
    fetch(base+`league/${id}/matchups/${week}`).then(r=>r.json()),
    fetch(base+`league/${id}/transactions/${week}`).then(r=>r.json()).catch(()=>[])
  ]);
  return assemble({league,users,rosters,matchups,txns,week});
}

function trimPlayers(all){const m={};for(const k in all){const p=all[k];if(!p)continue;
  m[k]={n:p.full_name||((p.first_name||'')+' '+(p.last_name||'')).trim()||p.last_name||k,pos:p.position||p.fantasy_positions&&p.fantasy_positions[0]||'',t:p.team||''};}return m;}
function pname(id){const p=PLAYERS&&PLAYERS[id];return p?p.n:(''+id);}
function ppos(id){const p=PLAYERS&&PLAYERS[id];return p?p.pos:'';}

function assemble({league,users,rosters,matchups,txns,week}){
  const uById={}; (users||[]).forEach(u=>uById[u.user_id]=u);
  const team={}; // roster_id -> {name, id, w,l,t, pf, pa}
  (rosters||[]).forEach(r=>{
    const u=uById[r.owner_id]||{};
    const meta=u.metadata||{};
    const nm=meta.team_name||u.display_name||('Team '+r.roster_id);
    const s=r.settings||{};
    team[r.roster_id]={id:r.roster_id,name:nm,
      w:s.wins||0,l:s.losses||0,t:s.ties||0,
      pf:(s.fpts||0)+(s.fpts_decimal||0)/100, pa:(s.fpts_against||0)+(s.fpts_against_decimal||0)/100};
  });
  // matchups -> pair by matchup_id
  const byMid={}; (matchups||[]).forEach(m=>{(byMid[m.matchup_id]=byMid[m.matchup_id]||[]).push(m);});
  const games=[];
  Object.values(byMid).forEach(pair=>{
    if(pair.length<2){return;}
    const A=side(pair[0]),B=side(pair[1]);
    const [win,lose]=A.pts>=B.pts?[A,B]:[B,A];
    games.push({win,lose,combined:A.pts+B.pts,margin:Math.abs(A.pts-B.pts)});
  });
  function side(m){const tm=team[m.roster_id]||{name:'Team '+m.roster_id};
    const starters=(m.starters||[]).filter(x=>x&&x!=='0');
    const pp=m.players_points||{};
    const startPts=starters.map(pid=>({pid,pts:+pp[pid]||0})).sort((a,b)=>b.pts-a.pts);
    const bench=(m.players||[]).filter(pid=>!starters.includes(pid)).reduce((s,pid)=>s+(+pp[pid]||0),0);
    return {rid:m.roster_id,team:tm,pts:Math.round((m.points||0)*100)/100,top:startPts.slice(0,2),bench:Math.round(bench*10)/10};
  }
  games.sort((a,b)=>b.combined-a.combined);
  // standings
  const standings=Object.values(team).sort((a,b)=>(b.w-a.w)||(b.pf-a.pf));
  // power rankings
  const maxPf=Math.max(1,...standings.map(t=>t.pf));
  const pr=Object.values(team).map(t=>{const gp=t.w+t.l+t.t||1;const wp=(t.w+t.t*0.5)/gp;
    const score=0.58*(t.pf/maxPf)+0.42*wp; return {...t,score};}).sort((a,b)=>b.score-a.score);
  // transactions
  const tx=parseTxns(txns,team);
  return {leagueName:cfg.name||league.name,week,games,standings,pr,tx,demo:false};
}

function parseTxns(txns,team){
  const out=[];
  (txns||[]).filter(t=>t.status==='complete').forEach(t=>{
    if(t.type==='trade'){
      const parties=(t.roster_ids||[]).map(r=>team[r]?team[r].name:('Team '+r));
      const adds=t.adds||{}; const lines=[];
      (t.roster_ids||[]).forEach(r=>{const got=Object.keys(adds).filter(pid=>adds[pid]===r).map(pid=>pname(pid));
        if(got.length) lines.push(`${team[r]?team[r].name:('Team '+r)} get ${got.join(', ')}`);});
      out.push({kind:'Trade',text:lines.join(' · ')|| parties.join(' ↔ ')});
    } else {
      const adds=t.adds||{},drops=t.drops||{};
      const rid=(t.roster_ids||[])[0]; const who=team[rid]?team[rid].name:('Team '+rid);
      const a=Object.keys(adds).map(pid=>pname(pid)), d=Object.keys(drops).map(pid=>pname(pid));
      if(!a.length&&!d.length)return;
      out.push({kind:t.type==='waiver'?'Waiver':'Free Agent',who,
        adds:a, drops:d});
    }
  });
  return out;
}

/* ---------- SCFL-voice narrative ---------- */
function headline(g,i){
  const w=g.win.team.name, l=g.lose.team.name, m=g.margin, c=g.combined;
  let base;
  if(m>=45) base=pick([`${w} left no doubt against ${l}`,`${w} ran ${l} off the road`,`It was over early for ${l}`],i);
  else if(m>=28) base=pick([`${w} handled ${l}`,`${w} had too much for ${l}`,`${w} pulled away from ${l}`],i+1);
  else if(m>=12) base=pick([`${w} took care of ${l}`,`${w} controlled it against ${l}`,`${w} got by ${l}`],i+2);
  else base=pick([`${w} survived ${l}`,`${w} edged ${l} in a photo finish`,`${l} came up a play short against ${w}`],i+3);
  if(c>=290) base+=' in a shootout';
  else if(c<=170) base+=' in a rock fight';
  return base;
}
function recap(g,i){
  const w=g.win, l=g.lose, m=Math.round(g.margin*10)/10;
  const wt=w.team.name, lt=l.team.name;
  const wTop=w.top[0], lTop=l.top[0];
  const paras=[];
  let p1=`${wt} put up ${w.pts} and ${m<=8?'held on to beat':(m>=40?'buried':'beat')} ${lt}, ${l.pts}.`;
  if(wTop&&wTop.pts>0) p1+=` ${wTop.pts.toFixed(1)} from ${pname(wTop.pid)}${ppos(wTop.pid)?' ('+ppos(wTop.pid)+')':''} did the heavy lifting`+(w.top[1]&&w.top[1].pts>=12?`, with ${pname(w.top[1].pid)} chipping in ${w.top[1].pts.toFixed(1)}.`:'.');
  paras.push(p1);
  let p2='';
  if(lTop&&lTop.pts>0) p2=`${lt} got ${lTop.pts.toFixed(1)} from ${pname(lTop.pid)} and not enough after that.`;
  if(l.bench>=28) p2+=` ${l.bench.toFixed(0)} points sat on the ${lt} bench — a lineup call that'll sting.`;
  else if(m<=6) p2+=` A single swing either way flips this one.`;
  if(p2) paras.push(p2.trim());
  return paras;
}
function prNote(t,rank,total){
  const gp=t.w+t.l+t.t||1, ppg=t.pf/gp, seed=Math.round(t.pf)+rank*7;
  if(rank===0) return pick([`Best team in the league, and it isn't especially close.`,`Points and wins both — the class of the field.`,`The team to beat, and everyone knows it.`],seed);
  if(ppg>110 && t.l>=t.w) return pick([`Scores like a contender, loses like a rebuild — the schedule owes it an apology.`,`Puts up points with nothing to show for it. Brutal luck.`,`Best roster nobody's afraid of yet. The wins are coming.`],seed);
  if(t.w>t.l && ppg<98) return pick([`Winning games it has no business winning. Nobody's complaining.`,`Finds a way every week, box score be damned.`,`Overachieving and unbothered about it.`],seed);
  if(rank>=Math.ceil(total*0.72)) return pick([`Running out of season to turn it around.`,`The points aren't there and neither are the wins.`,`Playing for draft position at this point.`,`A long month ahead.`],seed);
  return pick([`Right in the muddle of the middle.`,`Dangerous on a good week, invisible on a bad one.`,`A win from moving up, a loss from sliding.`,`Quietly hanging around the bubble.`,`Good, not scary — yet.`],seed);
}

/* ---------- render ---------- */
function renderMagazine(d, demo){
  applyAccent(cfg.accent);
  // power-ranking movement vs last stored
  const prev=loadPR(d.week); const order=d.pr.map(t=>t.id);
  const mv={}; d.pr.forEach((t,idx)=>{ if(prev&&prev[t.id]!=null){mv[t.id]=prev[t.id]-idx;} else mv[t.id]=null; });
  if(!demo) savePR(d.week, order);

  const app=$('#app'); app.innerHTML='';
  app.appendChild(el(`<div class="mag-top">${cfg.logo?`<img src="${cfg.logo}">`:''}
    <div><div class="mt-kick">The Weekly</div><div class="mt-name">${esc(d.leagueName)}</div></div>
    <div class="mt-r"><div class="wk"><button id="wprev">‹</button><div class="wknow">Week ${d.week}</div><button id="wnext">›</button></div>
    <button class="btn ghost sm" id="setup">Setup</button></div></div>`));
  if(demo) app.appendChild(el(`<div class="demoflag" id="demoflag" style="cursor:pointer">Sample issue — this is how your weekly magazine will look. <b style="color:var(--accent)">Tap to set up your league</b> — name, colors, logo, and your Sleeper link.</div>`));

  // cover
  const lead=d.games[0];
  const coverHead = lead ? headline(lead,0) : `Week ${d.week}`;
  const highTeam = d.games.reduce((a,g)=>Math.max(a,g.win.pts,g.lose.pts),0);
  const coverDek = lead ? `${lead.win.team.name} set the tone at ${lead.win.pts}, and the rest of the slate had plenty to say. Inside: every matchup, the new standings, this week's power rankings, and who moved.` : '';
  app.appendChild(el(`<div class="cover"><div class="cv-in">
    <div class="cv-kick">Week ${d.week} · The Weekly</div><h2>${esc(coverHead)}</h2>
    <div class="cv-dek">${esc(coverDek)}</div></div></div>`));

  // matchups
  app.appendChild(el(`<div class="sec">The Matchups</div>`));
  d.games.forEach((g,i)=>{
    const stars=[g.win.top[0],g.lose.top[0]].filter(x=>x&&x.pts>0)
      .map(x=>`<span class="chip"><b>${(+x.pts).toFixed(1)}</b> ${esc(pname(x.pid))}${ppos(x.pid)?' · '+ppos(x.pid):''}</span>`).join('');
    const gm=el(`<div class="game"><div class="gh">${esc(headline(g,i))}</div>
      <div class="score">
        <div class="sd win"><span class="tm">${esc(g.win.team.name)}</span><span class="pt">${g.win.pts.toFixed(1)}</span></div>
        <span class="vs">def.</span>
        <div class="sd"><span class="tm">${esc(g.lose.team.name)}</span><span class="pt">${g.lose.pts.toFixed(1)}</span></div>
      </div>
      ${recap(g,i).map(p=>`<p>${esc(p)}</p>`).join('')}
      <div class="stars">${stars}</div></div>`);
    app.appendChild(gm);
  });

  // standings
  app.appendChild(el(`<div class="sec">Standings</div>`));
  app.appendChild(el(`<div class="tblwrap"><table><thead><tr><th>Team</th><th>W-L</th><th>PF</th><th>PA</th></tr></thead>
    <tbody>${d.standings.map((t,i)=>`<tr><td class="team"><span class="rk">${i+1}</span> ${esc(t.name)}</td>
      <td class="num">${t.w}-${t.l}${t.t?'-'+t.t:''}</td><td class="num">${t.pf.toFixed(1)}</td><td class="num">${t.pa.toFixed(1)}</td></tr>`).join('')}</tbody></table></div>`));

  // power rankings
  app.appendChild(el(`<div class="sec">Power Rankings</div>`));
  const prBox=el(`<div class="step" style="padding:6px 16px"></div>`);
  d.pr.forEach((t,i)=>{
    const m=mv[t.id]; const mvh = m==null?`<span class="mv fl">NEW</span>`:(m>0?`<span class="mv up">▲${m}</span>`:(m<0?`<span class="mv dn">▼${-m}</span>`:`<span class="mv fl">—</span>`));
    prBox.appendChild(el(`<div class="pr"><div class="prk">${i+1}</div><div class="prb">
      <div class="prt">${esc(t.name)} ${mvh}</div><div class="prn">${esc(prNote(t,i,d.pr.length))}</div></div></div>`));
  });
  app.appendChild(prBox);

  // transactions
  app.appendChild(el(`<div class="sec">Transactions</div>`));
  const txBox=el(`<div class="step" style="padding:8px 16px"></div>`);
  if(!d.tx.length) txBox.appendChild(el(`<div style="color:var(--faint);padding:8px 0;font-size:14px">A quiet week on the wire — no completed moves.</div>`));
  d.tx.forEach(t=>{
    if(t.kind==='Trade') txBox.appendChild(el(`<div class="txn"><span class="tk">Trade</span><span class="tt">${esc(t.text)}</span></div>`));
    else txBox.appendChild(el(`<div class="txn"><span class="tk">${t.kind}</span><span class="tt">${esc(t.who)}</span> ${t.adds.length?`<span class="add">+ ${esc(t.adds.join(', '))}</span>`:''} ${t.drops.length?`<span class="drop">— ${esc(t.drops.join(', '))}</span>`:''}</div>`));
  });
  app.appendChild(txBox);

  app.appendChild(el(`<div class="foot">${esc(d.leagueName)} · Week ${d.week} · generated from Sleeper</div>`));
  $('#setup').onclick=renderSetup;
  if($('#demoflag')) $('#demoflag').onclick=renderSetup;
  $('#wprev').onclick=()=>{VIEW.week=Math.max(1,(d.week-1));openMagazine(demo);};
  $('#wnext').onclick=()=>{VIEW.week=(d.week+1);openMagazine(demo);};
  window.scrollTo(0,0);
}
function loadPR(week){try{const o=JSON.parse(localStorage.getItem(PR_KEY))||{};const p=o[week-1];if(!p)return null;
  const m={};p.forEach((id,i)=>m[id]=i);return m;}catch(e){return null;}}
function savePR(week,order){try{const o=JSON.parse(localStorage.getItem(PR_KEY))||{};o[week]=order;localStorage.setItem(PR_KEY,JSON.stringify(o));}catch(e){}}

// in demo, pids are already display names
const _pname=pname, _ppos=ppos;
window.pname=null;
function pnameWrap(id){ if(window.__DEMO_NAMES && typeof id==='string' && !PLAYERS) return id; return _pname(id); }
function pposWrap(id){ if(window.__DEMO_NAMES && typeof id==='string' && !PLAYERS) return ''; return _ppos(id); }
// rebind
pname=pnameWrap; ppos=pposWrap;

/* boot */
applyAccent(cfg.accent);
if(cfg.leagueId && cfg.name){ openMagazine(false); } else { openMagazine(true); }
