<style>
/* The Replay Room. Cream stock like the rest of the magazine, with the one
   dark panel on the page being the scoreboard, because a scoreboard is a dark
   thing with lit numerals on it and the eye already knows that.

   House colours, used as the house uses them: red is ahead, blue is behind,
   gold is the moment it changed hands. Nothing else is coloured. */
:root{
  --cream:#fffdfb; --ink:#17181c; --red:#c20f16; --blue:#0e8ab5; --gold:#d8b45a;
  --muted:#65656b; --rule:#e4dfd4; --panel:#17181c; --panel-dim:#8d8d96;
  --serif:Georgia,'Times New Roman',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --bar:104px;  /* the transport is two rows; content must clear it */
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--cream);color:var(--ink);font-family:var(--serif);
  line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px calc(var(--bar) + 30px)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent}

/* ---- masthead ---- */
.mast{display:flex;align-items:center;gap:14px;padding:16px 0 12px;
  border-bottom:3px solid var(--red);margin-bottom:18px}
.mast .f{font-family:var(--sans);font-size:11px;font-weight:900;letter-spacing:.26em;
  text-transform:uppercase;color:var(--red);white-space:nowrap}
.mast .sp{flex:1}
.mast a,.back{font-family:var(--sans);font-size:11px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;color:var(--muted);
  text-decoration:none;white-space:nowrap}
/* three items will not sit on one line at 390px, and the masthead wrapping
   mid-word was the first thing the eye landed on. Inside a game the crest and
   the scoreboard say where you are, so the archive link stands down. */
@media(max-width:470px){
  .mast{gap:10px}
  .mast .f{letter-spacing:.18em}
  .mast a,.back{letter-spacing:.08em}
  body.watching .mast #home{display:none}
}

/* ---- lobby ---- */
h1{font-size:34px;line-height:1.08;margin:0 0 8px;font-weight:900;letter-spacing:-.01em}
.dek{font-style:italic;color:var(--muted);margin:0 0 20px;font-size:17px}
.weeks{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 6px}
.wk{font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;padding:7px 13px;border:1px solid var(--rule);
  color:var(--muted)}
.wk[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.spoil{display:flex;align-items:center;gap:7px;margin:0 0 18px;
  font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.spoil button{border:1px solid var(--rule);padding:5px 10px;font-size:11px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.spoil button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}
.cards{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.cards{grid-template-columns:1fr 1fr}}
.card{border:1px solid var(--rule);width:100%;text-align:left;padding:0;
  display:block;background:var(--cream)}
.card:hover{border-color:var(--ink)}
.card .ln{display:flex;align-items:center;gap:11px;padding:11px 13px}
.card .ln+.ln{border-top:1px solid var(--rule)}
.card img{width:30px;height:30px;object-fit:contain;flex:none}
.card .nm{flex:1;font-size:16px;font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.card .sc{font-family:var(--sans);font-size:15px;font-weight:900;
  font-variant-numeric:tabular-nums;color:var(--muted)}
.card .sc.w{color:var(--red)}
.card .sc.l{color:var(--blue)}
.card .tag{font-family:var(--sans);font-size:9.5px;font-weight:800;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  padding:7px 13px;border-top:1px solid var(--rule);display:flex;gap:12px}
.card .tag b{color:var(--gold);font-weight:800}
.note{font-size:13px;color:var(--muted);margin:22px 0 0;line-height:1.65}

/* ---- scoreboard ---- */
.board{background:var(--panel);color:var(--cream);margin:0 0 14px;
  border-top:3px solid var(--gold)}
.board.flip{animation:flash .9s ease-out}
@keyframes flash{0%{border-top-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
  100%{border-top-color:var(--gold);box-shadow:none}}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px}
.row img{width:36px;height:36px;object-fit:contain;flex:none}
.row .nm{flex:1;font-size:18px;font-weight:700;line-height:1.2}
.row .pts{font-family:var(--sans);font-size:30px;font-weight:900;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;color:var(--panel-dim)}
.row.up .pts{color:#ff5a60}
.row.dn .pts{color:#55c3e8}
.clockbar{display:flex;align-items:center;gap:10px;padding:0 14px 10px}
.clockbar .q{font-family:var(--sans);font-size:11px;font-weight:900;
  letter-spacing:.16em;text-transform:uppercase;color:var(--panel-dim)}
.clockbar .ck{font-family:var(--sans);font-size:17px;font-weight:900;
  font-variant-numeric:tabular-nums;color:var(--cream)}
.clockbar .sp{flex:1}
.clockbar .mg{font-family:var(--sans);font-size:11px;font-weight:800;
  letter-spacing:.1em;text-transform:uppercase;color:var(--panel-dim)}
.gauge{height:4px;background:rgba(255,253,251,.14);position:relative}
.gauge i{position:absolute;top:0;bottom:0;left:50%;width:0;background:var(--gold);
  transition:width .25s linear,left .25s linear}

/* ---- the field ----
   The sprite sheet is drawn in neutral white and grey so it can be tinted per
   team at runtime, which is how sixteen franchises get sixteen kits out of one
   set of drawings. Same engine as the SCFL Network broadcast; the difference is
   that nothing here is simulated -- every figure on this field is doing a thing
   that really happened, for the yardage it really gained.

   What the field does NOT show is down, distance or field position, because the
   replay does not know them: it knows who scored, with what, for how many yards
   and when. So the snap mark is a snap mark and not a yard line, and the only
   distance claimed is the one on the tape. */
.field{margin:0 0 14px;border:1px solid var(--rule);background:#0c2a14;overflow:hidden}
.fbar{display:flex;align-items:center;gap:9px;padding:7px 11px;background:rgba(0,0,0,.42);
  border-bottom:1px solid rgba(255,255,255,.1);font-family:var(--sans);font-size:10.5px;
  font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#cfd6cc}
.fbar b{color:#fff;font-weight:900}
.fbar .kit{width:9px;height:9px;flex:none;border-radius:2px;
  box-shadow:0 0 0 1px rgba(255,255,255,.45)}
.fbar .who{color:#fff;font-weight:900;text-transform:none;letter-spacing:.01em;
  font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46%}
.fbar .sp{flex:1}
.fbar .yd{color:var(--gold)}
.camera{position:relative;height:250px;overflow:hidden;
  perspective:640px;perspective-origin:50% 2%;
  /* A tilted plane is foreshortened, so its top edge projects well below the
     top of the element and leaves a band. Filling that band with distant turf
     rather than black reads as the field carrying on to the far side; black
     read as a hole punched across the middle of it. */
  background:linear-gradient(180deg,#0a2010 0%,#102e18 38%,#17431f 100%)}
/* Blurred, dim and never in focus: it is there so the field has somewhere to
   be, not to be looked at. Nothing in it is a claim about a real stadium --
   the replay knows nothing about where a fantasy game was played. */
.crowd{position:absolute;left:0;right:0;top:0;height:40px;
  background:
    linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.15) 60%,rgba(0,0,0,.6)),
    repeating-linear-gradient(90deg,#2a2f3a 0 3px,#363c49 3px 6px,#22262f 6px 9px);
  filter:blur(1.4px);opacity:.75}
.crowd:after{content:'';position:absolute;left:0;right:0;bottom:0;height:5px;
  background:#101418;box-shadow:0 1px 0 rgba(255,255,255,.12)}
/* The ground is a plane laid back from the viewer, and every figure on it
   counter-rotates so it stands up out of it. Same trick the broadcast uses.
   It runs wider than the camera because the far edge of a tilted plane is
   narrower than the near one, and without the overhang the top corners show
   through to the background. */
/* 56 degrees, not 38. A football field is looked DOWN at -- the eleven men on
   each side spread across its width, and that width is what tells you it is a
   formation and not a queue. At 38 the plane was nearly side-on, there was no
   width to stand anybody in, and everyone ended up on one line at the snap. */
.ground{position:absolute;left:-26%;right:-26%;top:-150px;bottom:0;
  /* Tall in its OWN space because it is laid back: 400px of plane at 56
     degrees projects to about 220, which is what it takes to fill the camera
     under the crowd. At 300 it covered the bottom third and left a band. */
  transform-style:preserve-3d;transform:rotateX(56deg);transform-origin:50% 100%}
.turf{position:absolute;inset:0;
  background:
    linear-gradient(180deg,rgba(0,0,0,.34) 0%,rgba(0,0,0,0) 30%,rgba(255,255,255,.05) 100%),
    repeating-linear-gradient(90deg,#17431f 0,#17431f 40px,#113619 40px,#113619 80px)}
.track{position:absolute;inset:0;will-change:transform;transform-style:preserve-3d}
.hash{position:absolute;top:4%;bottom:10%;width:2px;background:rgba(255,255,255,.15)}
.hash.b{top:0;bottom:2%;background:rgba(255,255,255,.34)}

.ydn{position:absolute;bottom:2px;transform:translateX(-50%);font-family:var(--sans);
  font-size:13px;font-weight:900;color:rgba(255,255,255,.45);letter-spacing:.06em}
.snap{position:absolute;top:0;bottom:0;width:2px;background:rgba(216,180,90,.9);
  box-shadow:0 0 9px rgba(216,180,90,.75)}
.snap span{position:absolute;top:2px;left:5px;font-family:var(--sans);font-size:10px;
  font-weight:900;letter-spacing:.16em;color:var(--gold);white-space:nowrap}
/* Only ever drawn at the end of a play the tape says ended in one. The replay
   has no field position, so an end zone standing there all game would be a
   claim about where the ball was, which it is not entitled to make. */
.endz{position:absolute;top:0;bottom:0;width:62px;display:none;
  background:repeating-linear-gradient(135deg,var(--ezc,#c20f16) 0 10px,
             rgba(0,0,0,.35) 10px 20px);
  border-left:3px solid rgba(255,255,255,.9);opacity:.92}
.endz.on{display:block}
.actor{position:absolute;bottom:14px;z-index:3;pointer-events:none;
  transform:translateX(-50%) rotateX(-56deg);transform-origin:50% 100%}
.actor canvas{display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.65))}
/* Everybody on the field who is not the man the tape names. They are scenery:
   no tag, no number, no face turned to the camera, because the replay does not
   know who they were and the picture must not pretend it does. */
.actor.extra{z-index:2;display:none}
.actor.extra canvas{opacity:.92}
.actor.on{display:block}
.pill{position:absolute;bottom:26px;width:11px;height:7px;border-radius:50%/50%;
  background:#7a4a24;box-shadow:inset 0 0 0 1px rgba(255,255,255,.75);z-index:4;
  pointer-events:none;display:none;
  transform:translateX(-50%) rotateX(-56deg);transform-origin:50% 100%}
/* out of the action, not across it: centred, the chip printed behind whoever
   was carrying the ball at the time */
.pop{position:absolute;right:12px;top:10px;font-family:var(--sans);
  font-size:21px;font-weight:900;color:var(--gold);text-shadow:0 2px 10px rgba(0,0,0,.9);
  opacity:0;z-index:6;pointer-events:none}
.pop.go{animation:popup 1.3s ease-out}
@keyframes popup{0%{opacity:0;transform:translateY(14px) scale(.7)}
  18%{opacity:1;transform:translateY(0) scale(1.1)}
  30%{transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-22px)}}
.tdw{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-family:var(--serif);
  font-weight:900;font-size:30px;letter-spacing:.06em;color:#fff;z-index:7;opacity:0;
  text-shadow:0 2px 14px rgba(0,0,0,.9),0 0 24px var(--twc,#fff);pointer-events:none}
.tdw.go{animation:tdk 1.9s ease}
@keyframes tdk{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}
  26%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.03)}}
.fnote{position:absolute;left:0;right:0;bottom:0;padding:7px 11px;font-family:var(--sans);
  font-size:10.5px;color:#aeb7ac;background:rgba(0,0,0,.5);font-style:italic;display:none}
.fnote.on{display:block}

/* ---- play feed ---- */
.feed{border:1px solid var(--rule);border-bottom:0}
.ev{display:grid;grid-template-columns:50px 1fr auto;gap:0 10px;align-items:start;
  padding:8px 12px;border-bottom:1px solid var(--rule);
  border-left:3px solid transparent;width:100%;text-align:left}
.ev .ck{font-family:var(--sans);font-size:10.5px;font-weight:800;color:var(--muted);
  font-variant-numeric:tabular-nums;padding-top:3px}
.ev .who{font-size:14px;font-weight:700;display:block}
.ev .who small{font-family:var(--sans);font-size:9.5px;font-weight:800;
  letter-spacing:.11em;color:var(--muted);margin-left:5px;vertical-align:1px}
.ev .did{display:block;font-size:12px;color:var(--muted)}
.ev .sc{font-family:var(--sans);font-size:13px;font-weight:800;
  font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:2px}
.ev.go{border-left-color:var(--gold)}
.ev.go .sc{color:var(--gold)}
.ev.td .who:after{content:"TD";font-family:var(--sans);font-size:9px;font-weight:900;
  letter-spacing:.1em;color:var(--red);margin-left:7px;vertical-align:1px}
.ev.res{background:rgba(101,101,107,.06)}
.ev.res .who{font-weight:400;font-style:italic;color:var(--muted)}
.ev .real{grid-column:2/4;font-family:var(--sans);font-size:11px;color:var(--muted);
  margin-top:5px;display:none}
.ev[aria-expanded="true"] .real{display:block}
.empty{padding:26px 14px;color:var(--muted);font-style:italic;font-size:15px;
  border-bottom:1px solid var(--rule)}
.final{padding:14px;border-bottom:1px solid var(--rule);font-family:var(--sans);
  font-size:11px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;
  color:var(--red)}

/* ---- transport ---- */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);
  color:var(--cream);z-index:9;padding-bottom:env(safe-area-inset-bottom)}
.scrub{width:100%;display:block;margin:0;height:22px;background:none;
  -webkit-appearance:none;appearance:none}
.scrub::-webkit-slider-runnable-track{height:3px;background:rgba(255,253,251,.22)}
.scrub::-moz-range-track{height:3px;background:rgba(255,253,251,.22)}
.scrub::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;
  border-radius:50%;background:var(--gold);margin-top:-5px}
.scrub::-moz-range-thumb{width:13px;height:13px;border:0;border-radius:50%;
  background:var(--gold)}
/* A six-across transport ran the speed control off the right edge of a phone,
   where it cannot be reached and cannot be seen to be missing. Two rows:
   what you press constantly on top, what you press occasionally underneath. */
.keys{display:grid;grid-template-columns:1fr auto auto;gap:5px;padding:3px 10px 9px}
.keys button{font-family:var(--sans);font-size:11px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:var(--cream);
  padding:10px 8px;border:1px solid rgba(255,253,251,.2);white-space:nowrap}
.keys button:disabled{opacity:.3;cursor:default}
.keys .go{background:var(--red);border-color:var(--red);font-size:12.5px;
  letter-spacing:.12em}
.keys .jumps{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}
</style>

<div class="wrap">

<div class="mast">
  <span class="f">The Replay Room</span>
  <span class="sp"></span>
  <button class="back" id="back" hidden>&larr; All games</button>
  <a href="scfl-index.html" id="home">The Full Record</a>
</div>

<section id="lobby">
  <h1>Watch the week back</h1>
  <p class="dek">Every matchup is rebuilt out of the plays that really made the
  points and laid onto one sixty-minute clock. Pick a game and sit through it.</p>
  <div class="weeks" id="weeks"></div>
  <div class="spoil">
    <span>Finals</span>
    <button id="spoiler" aria-pressed="false">Hidden</button>
  </div>
  <div class="cards" id="cards"></div>
  <p class="note" id="note"></p>
</section>

<section id="viewer" hidden>
  <div class="board" id="board">
    <div class="row" id="rowA"><img alt=""><span class="nm"></span><span class="pts">0.00</span></div>
    <div class="row" id="rowB"><img alt=""><span class="nm"></span><span class="pts">0.00</span></div>
    <div class="clockbar">
      <span class="q" id="qtr">Pre-game</span><span class="ck" id="clock">15:00</span>
      <span class="sp"></span><span class="mg" id="margin">Level</span>
    </div>
    <div class="gauge"><i id="gauge"></i></div>
  </div>
  <div class="field" id="field">
    <div class="fbar"><i class="kit" id="fkit"></i><b id="fteam">&mdash;</b>
      <span id="fname" class="who"></span>
      <span class="sp"></span><span id="fplay">Kick-off</span></div>
    <div class="camera" id="camera">
      <div class="crowd"></div>
      <div class="ground" id="ground">
        <div class="turf"></div>
        <!-- Everything pinned to the FIELD lives in the track and scrolls with
             it: the markers, the end zone, the line of scrimmage and everyone
             standing on it. Left outside, the linemen and the beaten defender
             slid downfield with the camera and arrived at the end zone with
             the ball carrier. The man with the ball is the exception -- he is
             positioned against the camera each frame, because he is the one
             the camera is following. -->
        <div class="track" id="track">
          <i class="endz" id="endz"></i>
          <div class="actor" id="actor"><canvas id="acv"></canvas></div>
          <i class="pill" id="pill"></i>
        </div>
      </div>
      <div class="pop" id="pop"></div>
      <div class="tdw" id="tdw">TOUCHDOWN</div>
      <div class="fnote" id="fnote"></div>
    </div>
  </div>
  <div class="feed" id="feed"></div>
  <p class="note" id="vnote"></p>
</section>

</div>

<div class="bar" id="bar" hidden>
  <input class="scrub" id="scrub" type="range" min="0" max="3600" value="0" step="1"
         aria-label="Game clock">
  <div class="keys">
    <button class="go" id="play">Play</button>
    <button id="rew" title="Back to kick-off">&#8676;</button>
    <button id="rate" title="How fast the plays come">1&times;</button>
    <span class="jumps">
      <button id="step">Next play</button>
      <button id="nextTd">Next TD</button>
      <button id="nextGo">Lead change</button>
    </span>
  </div>
</div>

<script>
(function(){
'use strict';
// event tuple, as scripts/build_watch.py writes it
var SEC=0,QTR=1,CK=2,SIDE=3,PID=4,PTS=5,TXT=6,FLG=7,S0=8,S1=9,SRC=10,RQ=11,RC=12,
    KIND=13,YDS=14;
var TD=1, GO=2, RES=4;
var FULL=3600, QLEN=900;

var $=function(id){return document.getElementById(id);};
var IDX=null, FEED=null, GAME=null, WEEK=null;
var t=0, playing=false, shown=0, spoil=false;

try{ spoil = localStorage.getItem('scfl-replay-spoil')==='1'; }catch(e){}

function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function crest(slug){return slug? 'crests/'+slug+'.webp' : '';}
function mmss(s){s=Math.max(0,Math.round(s));
  return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

// The clock the game is told on. Quarters of fifteen minutes counting down,
// which is the only thing the fantasy clock ever means -- it is synthesised,
// so it is never a time of day and nothing here reads an hour out of it.
function qtrOf(s){return Math.min(4, Math.floor(s/QLEN)+1);}
function clockOf(s){return s>=FULL? '0:00' : mmss(QLEN-(s%QLEN));}

function load(week){
  return fetch('week-data/'+IDX.season+'-w'+week+'-watch.json',{cache:'no-cache'})
    .then(function(r){ if(!r.ok) throw new Error('week '+week); return r.json(); });
}

/* ---------- the field ----------

   One actor, one ball, and a strip of turf that scrolls under them. The sheet
   is neutral white and grey; tintSheet paints the white to a team's primary and
   the grey to its secondary, so one set of drawings dresses all sixteen. Lifted
   from the SCFL Network broadcast, which invents its drives -- here every
   figure is doing something that really happened, for the yardage on the tape.
*/
var SPR={ok:false,img:null,meta:null,tints:{},RES:2,K:{w:40,h:28,scale:.158}};
(function(){
  var img=new Image();
  Promise.all([
    fetch('scfl-sprites.json').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    new Promise(function(res){img.onload=function(){res(true);};img.onerror=function(){res(false);};
                              img.src='scfl-sprites.png';})
  ]).then(function(a){
    // Without the sheet the field simply never draws a figure. The scoreboard,
    // the feed and every number on the page are unaffected, which is the point
    // of keeping the art out of the data.
    if(!a[0]||!a[1]||!a[0].run) return;
    SPR.meta=a[0]; SPR.img=img; SPR.ok=true;
  }).catch(function(){});
})();

function sprRGB(c){
  var h=(c||'').trim(); if(h[0]==='#') h=h.slice(1);
  if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var n=parseInt(h,16);
  return isNaN(n)?{r:225,g:225,b:225}:{r:(n>>16)&255,g:(n>>8)&255,b:n&255};
}
function tintSheet(c1,c2){
  var key=c1+'|'+c2; if(SPR.tints[key]) return SPR.tints[key];
  var t1=sprRGB(c1), t2=sprRGB(c2);
  var cv=document.createElement('canvas'); cv.width=SPR.img.width; cv.height=SPR.img.height;
  var cx=cv.getContext('2d'); cx.drawImage(SPR.img,0,0);
  var id=cx.getImageData(0,0,cv.width,cv.height), d=id.data;
  for(var i=0;i<d.length;i+=4){
    if(d[i+3]<10) continue;
    var r=d[i],g=d[i+1],b=d[i+2];
    var mx=Math.max(r,g,b), mn=Math.min(r,g,b);
    if(mx-mn>=46) continue;                 // skin, ball and cleats keep their colour
    var l=(r+g+b)/765;
    if(mx>=228){ d[i]=t1.r*l; d[i+1]=t1.g*l; d[i+2]=t1.b*l; }
    else if(mx>=138){ var k=Math.min(1.15,l/0.78);
      d[i]=Math.min(255,t2.r*k); d[i+1]=Math.min(255,t2.g*k); d[i+2]=Math.min(255,t2.b*k); }
  }
  cx.putImageData(id,0,0);
  SPR.tints[key]=cv; return cv;
}

// kind -> [pose, what covers the ground]. 'man' runs it, 'ball' is thrown or
// kicked it, '' means nothing travels: a sack, a fumble, an interception and an
// extra point carry no yardage in the replay, so the field invents none. The
// distance is always the real one -- a 48-yard pass puts the ball 48 yards
// downfield against the markers, and a 4-yard catch moves four.
var POSE={rush:['run','man'], conv:['run','man'], dtd:['run','man'],
          rec:['catch','man'], pass:['throw','ball'], fg:['kick','ball'],
          xp:['kick',''], sack:['sack',''], fum:['hit',''], int:['hit',''],
          dint:['celebrate',''], drec:['celebrate','']};
var PXYD = 12;              // pixels a yard; reset to the camera's own width
var ORIGIN = 0;             // ground-space x of the camera's left edge
var LANE = 0;               // ground-space x of the snap
var DEEP = 0;               // the plane's own height: the field's width
var stageTok = 0;

function buildTrack(){
  var cam=$('camera'), gr=$('ground'), tr=$('track');
  PXYD = Math.max(9, cam.clientWidth/30);
  // The ground runs wider than the camera, so ground-space x=0 is off the left
  // edge of the shot. Everything positioned on the plane has to add that back.
  ORIGIN = (gr.clientWidth - cam.clientWidth)/2;
  LANE = ORIGIN + 92;
  DEEP = gr.clientHeight;
  // NB: this rewrites the track's markers only. The cast and the end zone are
  // children of the track too, so they are detached and put back rather than
  // destroyed.
  var keep=['endz','actor','pill'].map(function(id){return $(id);})
            .filter(function(el){return el;});
  // both ways from the snap, because the two sides attack opposite ends
  var html='', yds=170;
  for(var y=-yds;y<=yds;y+=5){
    var big=(y%10===0);
    html+='<i class="hash'+(big?' b':'')+'" style="left:'+(LANE+y*PXYD)+'px"></i>';
    if(big&&y) html+='<span class="ydn" style="left:'+(LANE+y*PXYD)+'px">'+
                     Math.abs(y)+'</span>';
  }
  html+='<i class="snap" style="left:'+LANE+'px"><span>SNAP</span></i>';
  tr.innerHTML=html;
  keep.forEach(function(el){ tr.appendChild(el); });
  tr.style.transform='translateX(0)';
  buildCast();
}

// Where a football team stands. Each slot is [yards from the snap, how far
// across the field from the near sideline, whose kit, which pose].
//
// This is the SHAPE of a play, not a claim about this one. The replay knows
// who scored, with what, for how many yards and when -- it knows nothing about
// personnel, formation or who lined up where, and the men below are drawn
// accordingly: no names, no numbers, no faces to the camera. What they are for
// is the thing John put his finger on -- without a field's WIDTH with people
// standing in it, every play read as a pile of sprites on one line rather than
// as a game of football.
var SIDE_US=0, SIDE_THEM=1;
var FORMATION=[
  // the line of scrimmage: five against four, with the ball between them
  // a clear gap between them is the one cue that says "line of scrimmage"
  // rather than "heap": at three yards the two lines read as one mass of
  // alternating colour, so they stand four and a half apart.
  [-1.0,0.33,SIDE_US,'lineman'], [-1.0,0.42,SIDE_US,'lineman'],
  [-1.0,0.51,SIDE_US,'lineman'], [-1.0,0.60,SIDE_US,'lineman'],
  [-1.0,0.69,SIDE_US,'lineman'],
  [ 3.4,0.37,SIDE_THEM,'lineman'], [ 3.4,0.47,SIDE_THEM,'lineman'],
  [ 3.4,0.57,SIDE_THEM,'lineman'], [ 3.4,0.67,SIDE_THEM,'lineman'],
  // split wide, and the men on them
  [-0.2,0.04,SIDE_US,'idle'],      [-0.2,0.96,SIDE_US,'idle'],
  [ 5.5,0.05,SIDE_THEM,'backpedal'], [ 5.5,0.95,SIDE_THEM,'backpedal'],
  // a back, and somebody minding the middle
  [-4.6,0.64,SIDE_US,'idle'],      [11.0,0.50,SIDE_THEM,'backpedal']
];
var CAST=[];
function mover_is_man(k){ return k==='man'; }

// Straight into the track, not into a wrapper inside it. A plain div between
// them and the track flattened the 3D context and the whole cast painted
// behind the turf: fifteen men, every canvas full of pixels, none of them on
// screen. The ball carrier was fine throughout, because he hangs off the
// ground itself.
function buildCast(){
  var tr=$('track'); if(!tr) return;
  CAST.forEach(function(el){ if(el.parentNode) el.parentNode.removeChild(el); });
  CAST=[];
  for(var i=0;i<24;i++){   // the formation, the play's own men, and the official
    var d=document.createElement('div');
    d.className='actor extra';
    d.appendChild(document.createElement('canvas'));
    tr.appendChild(d);
    CAST.push(d);
  }
}

// depth across the field -> how far up the plane, in the plane's own pixels
function across(f){ return 14 + f*(DEEP-70); }
function nframes(anim){
  var f=SPR.ok && SPR.meta[anim] && SPR.meta[anim].frames;
  return f ? f.length : 0;
}

// One drawing routine for everybody on the field. `plain` draws off the
// untinted sheet, which is how the referee keeps his stripes -- tint him and
// he comes out dressed as one of the two clubs.
function draw(el,anim,fi,c1,c2,flip,plain){
  if(!SPR.ok) return;
  var frames=SPR.meta[anim]&&SPR.meta[anim].frames;
  if(!frames||!frames.length) return;
  // Clamped here rather than trusted from the caller. The sheet can be re-cut
  // with a different number of frames in any pose, and an index past the end
  // reads as undefined and throws inside the draw -- which took the whole
  // field down while the scoreboard and the feed carried on, so the page
  // looked fine and simply stopped animating.
  fi = (typeof fi === 'number' && isFinite(fi)) ? Math.max(0,Math.floor(fi)) : 0;
  var fr=frames[Math.min(fi,frames.length-1)], K=SPR.K;
  if(!fr) return;
  var cv=el.querySelector('canvas'); if(!cv) return;
  var ctx=cv.getContext('2d');
  if(cv.width!==K.w*SPR.RES){ cv.width=K.w*SPR.RES; cv.height=K.h*SPR.RES;
    cv.style.width=K.w+'px'; cv.style.height=K.h+'px'; }
  ctx.setTransform(SPR.RES,0,0,SPR.RES,0,0);
  ctx.clearRect(0,0,K.w,K.h);
  var sc=K.scale, dw=fr.w*sc, dh=fr.h*sc;
  ctx.translate(K.w/2,K.h);
  if(flip) ctx.scale(-1,1);
  ctx.drawImage(plain?SPR.img:tintSheet(c1,c2),fr.x,fr.y,fr.w,fr.h,-dw/2,-dh,dw,dh);
}
function drawActor(anim,fi,c1,c2){ draw($('actor'),anim,fi,c1,c2,false,false); }

// An extra is anybody the tape does not name: a lineman, a man split wide, a
// beaten defender, the one being sacked. They are placed and posed, never
// tagged and never identified -- the replay knows the scorer and nothing else
// about who was on the field, so the picture says nothing else either.
function place(el,x,depth,anim,fi,c1,c2,flip,plain){
  if(!el) return;
  el.className='actor extra on';
  el.style.left=x+'px';
  el.style.bottom=across(depth)+'px';
  // further up the plane is further away, so he stands behind the men in front
  el.style.zIndex=String(2+Math.round((1-depth)*20));
  draw(el,anim,fi,c1,c2,flip,plain);
}
function hideExtras(){
  CAST.forEach(function(el){ el.className='actor extra'; });
}

function clearField(msg){
  stageTok++;
  $('actor').style.display='none'; $('pill').style.display='none';
  $('fname').textContent='';
  hideExtras();
  var ez=$('endz'); if(ez) ez.className='endz';
  $('fnote').className = msg? 'fnote on' : 'fnote';
  $('fnote').textContent = msg||'';
}

// Which plays happen at a line of scrimmage, and so get a team lined up on
// either side of it. A kick does not, and neither does a defensive return.
var SCRIM={rush:1,rec:1,pass:1,sack:1,conv:1,fum:1,int:1};
// Where the man the tape names starts: yards from the snap, and how far across
// the field. A carrier takes the handoff behind the line, a receiver is already
// downfield, a man making a sack comes off the defensive line.
var START={rush:[-3.0,0.48], conv:[-3.0,0.48], pass:[-3.6,0.50],
           rec:[6.0,0.18], sack:[2.2,0.50], dtd:[3.0,0.36],
           dint:[4.0,0.36], drec:[3.0,0.58], fum:[0.6,0.50],
           int:[-3.6,0.50], fg:[-5.0,0.50], xp:[-5.0,0.50]};

function stage(e){
  if(!GAME) return 0;
  var fl=e[FLG], p=GAME.p[e[PID]], side=GAME.t[e[SIDE]], foe=GAME.t[1-e[SIDE]];
  $('fkit').style.background=side.c1;
  $('fteam').textContent=side.abbr||side.name;

  // A residual is points no single play accounts for. There is nothing to
  // stage, and staging something would be inventing a play that never was.
  if(fl&RES){
    $('fplay').textContent='Scoring adjustment';
    clearField('Points the box score credits that no single play explains. '+
               'Nothing to show, because nothing happened on a field.');
    return 1100/PACE;
  }

  var kind=e[KIND], pose=POSE[kind]||['idle',''];
  var yards=(pose[1] && typeof e[YDS]==='number') ? e[YDS] : 0;
  $('fplay').textContent = e[TXT]||'';
  clearField('');

  // Which way this side attacks. Consecutive plays in these feeds flip from
  // one fantasy team to the other constantly -- their players are in different
  // real games, so both sides score all afternoon. Drawn all one way that
  // alternation reads as noise; drawn as two teams attacking opposite ends it
  // reads as the ball changing hands, which is what it is.
  // Which side has the ball, which is not always the side that scored: a sack
  // and a defensive score are made by the men without it, so the play still
  // runs the OTHER way. Drawn off the scorer, a sack mirrored the whole
  // formation and put the quarterback in front of his own line.
  var defScore=(kind==='sack'||kind==='dint'||kind==='drec'||kind==='dtd');
  var offSide=defScore ? (1-e[SIDE]) : e[SIDE];
  var way=(offSide===0)?1:-1, leftward=(way<0);
  var dirn=way*(yards<0?-1:1);
  var travel=Math.abs(yards)*PXYD;
  var isPass=(kind==='pass'||kind==='rec'), AIR=0.58;
  var losX=LANE, END=losX+dirn*travel;
  var catchX=losX+dirn*travel*AIR;
  var rdep=(e[PID]%2) ? 0.22 : 0.78;         // which side he is split to
  var kits=[[side.c1,side.c2],[foe.c1,foe.c2]];
  // a sack and a defensive score are made BY the defence, so the man the tape
  // names wears the shirt the other eleven are playing against
  if(defScore) kits.reverse();
  var OFF=kits[0], DEF=kits[1];

  var cam=$('camera'), act=$('actor');
  // where the ball ends up, and how much of that the camera has to pan for
  var limit=ORIGIN+cam.clientWidth*(dirn>0?0.66:0.34);
  var reach=dirn>0?Math.min(END,limit):Math.max(END,limit);
  var scroll=END-reach;
  var dur=Math.min(2400, 620+Math.abs(yards)*24)/PACE;
  var span=dur, t0=performance.now(), tok=++stageTok;
  act.style.display='';
  $('fname').textContent=p[0];

  // ---- EVERYBODY HAS A JOB ----
  // Before this, eleven of the thirteen men on the field were placed once and
  // never moved again, so a play was two figures running past a crowd of
  // statues. Every man now has a path and a pose script: linemen fire out and
  // drive, receivers run routes whether or not the ball is going to them,
  // corners run with them, and the back and the linebacker pursue.
  //
  // Facing is DERIVED from which way a man is actually travelling rather than
  // set by hand, which is what had a cornerback sprinting downfield while
  // drawn pointing backwards and defenders diving away from the play.
  var roles=[], slot=0;
  function role(kit,fn,face){
    var el=CAST[slot++]; if(!el) return null;
    var r={el:el,kit:kit,fn:fn,flip:(face==='L')!==leftward,lx:null};
    roles.push(r); return r;
  }
  var yd=function(n){ return losX+dirn*n*PXYD; };   // n yards past the line
  function cyc(h,a){ return Math.floor(h*dur/55)%(nframes(a)||1); }
  function seg(h,a,b){ return Math.max(0,Math.min(1,(h-a)/(b-a))); }
  // a straight run between two points, with a pose that may change late
  function runTo(x0,d0,x1,d1,early,late,at){
    return function(h){
      var k=1-Math.pow(1-Math.min(1,h),2), on=(at!=null&&h>=at);
      return {x:x0+(x1-x0)*k, d:d0+(d1-d0)*k,
              a:on?late:early,
              f:on?Math.floor(seg(h,at,1)*0.9*nframes(late)):cyc(h,early)};
    };
  }

  // the line: five driving forward, four driving back, meeting in between
  for(var i=0;i<5;i++) (function(i){
    var d=0.33+0.09*i;
    role(OFF, function(h){ return {x:yd(-1.0+2.0*Math.min(1,h*3)), d:d,
      a:'lineman', f:h>0.05?2:0}; }, 'R');
  })(i);
  for(var j=0;j<4;j++) (function(j){
    var d=0.37+0.10*j;
    role(DEF, function(h){ return {x:yd(3.4-1.9*Math.min(1,h*3)), d:d,
      a:'lineman', f:h>0.05?2:0}; }, 'L');
  })(j);

  // the two men split wide run their routes on every play, and the two on
  // them run with them -- a receiver who stands still on a running play is the
  // tell that nothing on this field has a job
  var wr=[], cb=[];
  for(var w=0;w<2;w++) (function(w){
    var d0=w?0.96:0.04, d1=w?0.86:0.14;
    wr.push(role(OFF, runTo(yd(-0.2),d0, yd(Math.max(8,Math.abs(yards)*0.7)),d1,
                            'run','run',null), 'R'));
    cb.push(role(DEF, runTo(yd(2.0),d0, yd(Math.max(8,Math.abs(yards)*0.7)+2),d1,
                            'run','run',null), 'R'));
  })(w);

  // the back, and the man in the middle of the defence who goes to the ball
  var backR=role(OFF, runTo(yd(-4.6),0.64, yd(1.0),0.60,'run','lineman',0.5),'R');
  var mikeR=role(DEF, runTo(yd(9.0),0.50, END-dirn*1.2*PXYD,0.46,
                            'run','tackle',0.84),'L');

  // ---- and the men the play is actually about ----
  var meFn, tackler=null;
  if(isPass){
    // One play, not two vignettes: he releases, runs the route, turns for the
    // ball, takes it and carries it on, with a man on him the whole way.
    var pass0={x:yd(-6.4),d:0.50};
    function throwerAt(h){
      return {x:pass0.x, d:pass0.d, a:h<0.22?'throw':'idle',
              f:h<0.22?Math.floor(h*dur/70):0};
    }
    function receiverAt(h){
      if(h<AIR*0.9){ var k=h/(AIR*0.9);
        return {x:losX+(catchX-losX)*k, d:rdep, a:'run', f:cyc(h,'run')}; }
      if(h<AIR+0.07)
        return {x:catchX, d:rdep, a:'catch', f:Math.floor(seg(h,AIR*0.9,AIR+0.07)*nframes('catch'))};
      var k2=seg(h,AIR+0.07,1);
      var dv=(fl&TD)&&Math.abs(yards)>=20&&k2>0.8, st=!(fl&TD)&&k2>0.82;
      return {x:catchX+(END-catchX)*k2, d:rdep,
              a:dv?'dive':st?'hit':'run',
              f:dv?Math.floor(seg(k2,0.8,1)*nframes('dive'))
               :st?Math.floor(seg(k2,0.82,1)*0.8*nframes('hit'))
               :cyc(h,'run')};
    }
    var other=role(OFF,(kind==='rec')?throwerAt:receiverAt,'R');
    meFn=(kind==='rec')?receiverAt:throwerAt;
    // the man covering him, who arrives with him and makes the stop
    tackler=role(DEF, function(h){
      var r=receiverAt(h), back=(h<AIR)?2.0:0.6;
      var on=!(fl&TD)&&h>0.84;
      return {x:r.x-dirn*back*PXYD, d:rdep+(rdep<0.5?0.07:-0.07),
              a:on?'tackle':'run',
              f:on?Math.floor(seg(h,0.84,1)*0.9*nframes('tackle')):cyc(h,'run')};
    }, 'R');
  } else if(kind==='sack'){
    // the tape names the tackler; the man on the floor plays for the other side
    meFn=function(h){ var k=1-Math.pow(1-h,2);
      return {x:yd(3.0-4.4*k), d:0.50, a:h>0.6?'tackle':'run',
              f:h>0.6?Math.floor(seg(h,0.6,1)*0.9*nframes('tackle')):cyc(h,'run')}; };
    role(OFF, function(h){ return {x:yd(-1.6), d:0.50, a:h>0.62?'sack':'idle',
      f:h>0.62?Math.floor(seg(h,0.62,1)*0.9*nframes('sack')):0}; }, 'R');
  } else if(mover_is_man(pose[1])){
    meFn=function(h){
      var k=1-Math.pow(1-h,2);
      var dv=(fl&TD)&&Math.abs(yards)>=20&&h>0.84, st=!(fl&TD)&&h>0.86;
      return {x:losX+(END-losX)*k, d:0.48,
              a:dv?'dive':st?'hit':'run',
              f:dv?Math.floor(seg(h,0.84,1)*nframes('dive'))
               :st?Math.floor(seg(h,0.86,1)*0.8*nframes('hit'))
               :cyc(h,'run')};
    };
    // One man beaten on the way, who dives AT him as he goes past rather than
    // diving at the ground thirty yards behind the play, and one who makes the
    // stop where the gain ends -- because that is where the gain ended.
    if(Math.abs(yards)>=9){
      var mx=losX+(END-losX)*0.45;
      role(DEF, function(h){
        var k=1-Math.pow(1-h,2), at=(h>0.42);
        return {x:mx+(at?dirn*1.6*PXYD*seg(h,0.42,0.62):0), d:0.62-(at?0.10:0),
                a:at?'dive':'run',
                f:at?Math.floor(seg(h,0.42,0.68)*nframes('dive')):cyc(h,'run')};
      }, 'L');
    }
    if(!(fl&TD)) tackler=role(DEF, function(h){
      var k=1-Math.pow(1-h,2), on=h>0.84;
      return {x:yd(Math.abs(yards)+6)-dirn*6*PXYD*k, d:0.40+0.06*k,
              a:on?'tackle':'run',
              f:on?Math.floor(seg(h,0.84,1)*0.9*nframes('tackle')):cyc(h,'run')};
    }, 'L');
  } else {
    meFn=function(h){ return {x:losX+(END-losX)*(1-Math.pow(1-h,2)), d:0.50,
      a:pose[0], f:Math.floor(h*dur/95)}; };
  }

  // the ball, where the ball is a thing that travels on its own
  var pill=$('pill');
  pill.style.display=(isPass||kind==='fg'||kind==='xp')?'block':'none';

  // The end zone is drawn only where the tape says the play ended in one.
  if(fl&TD){
    var ez=$('endz');
    ez.style.setProperty('--ezc', side.c1);
    ez.style.left=END+'px';
    ez.className='endz on';
  }
  var refSlot=slot;

  function put(r,st){
    // facing follows travel, so nobody ever runs one way drawn the other
    if(r.lx!=null){
      if(st.x < r.lx-0.4) r.flip=true;
      else if(st.x > r.lx+0.4) r.flip=false;
    }
    r.lx=st.x;
    place(r.el, st.x, st.d, st.a, st.f, r.kit[0], r.kit[1], r.flip, false);
  }

  var meFlip=leftward, meLast=null;
  (function frame(now){
    if(tok!==stageTok) return;
    var h=Math.max(0,Math.min(1,(now-t0)/dur));
    $('track').style.transform='translateX('+(-scroll*(1-Math.pow(1-h,2)))+'px)';

    for(var ri=0;ri<roles.length;ri++) if(roles[ri]) put(roles[ri], roles[ri].fn(h));

    var me=meFn(h);
    if(meLast!=null){
      if(me.x < meLast-0.4) meFlip=true; else if(me.x > meLast+0.4) meFlip=false;
    }
    meLast=me.x;
    act.style.left=me.x+'px';
    act.style.bottom=across(me.d)+'px';
    act.style.zIndex=String(24+Math.round((1-me.d)*20));
    draw(act, me.a, me.f, side.c1, side.c2, meFlip, false);

    if(pill.style.display==='block'){
      if(isPass){
        var bk=seg(h,0.08,AIR*0.9);
        pill.style.display = h<AIR ? 'block':'none';
        pill.style.left=(yd(-6.4)+(catchX-yd(-6.4))*bk)+'px';
        pill.style.bottom=(across(0.50+(rdep-0.50)*bk)+Math.sin(bk*Math.PI)*50)+'px';
      } else {
        pill.style.left=(losX+(END-losX)*h)+'px';
        pill.style.bottom=(across(0.50)+Math.sin(h*Math.PI)*54)+'px';
      }
    }

    if(h<1) requestAnimationFrame(frame);
    else if(tok===stageTok){
      draw(act,(fl&TD)?'celebrate':me.a,me.f,side.c1,side.c2,meFlip,false);
      if(fl&TD && CAST[refSlot])
        place(CAST[refSlot], END-dirn*30, 0.74, 'ref', 2, '', '', false, true);
    }
  })(t0);

  // the points, and the word, which only prints over a touchdown
  var pop=$('pop');
  pop.textContent=(e[PTS]>0?'+':'')+e[PTS].toFixed(2);
  pop.className='pop'; void pop.offsetWidth; pop.className='pop go';
  if(fl&TD){
    var w=$('tdw'); w.style.setProperty('--twc',side.c1);
    w.className='tdw'; void w.offsetWidth;
    setTimeout(function(){ if(tok===stageTok) w.className='tdw go'; }, dur-180);
  }
  // the tail holds the tackle, or the celebration, on screen long enough to see
  return span + ((fl&TD)?900:520)/PACE;
}


/* ---------- lobby ---------- */

function paintWeeks(){
  $('weeks').innerHTML = IDX.weeks.map(function(w){
    return '<button class="wk" data-w="'+w+'" aria-current="'+(w===WEEK)+'">Week '+w+'</button>';
  }).join('');
}

function paintCards(){
  var html = FEED.games.map(function(g,i){
    var a=g.t[0], b=g.t[1], won=g.f[0]>g.f[1]?0:(g.f[1]>g.f[0]?1:-1);
    function line(s,side){
      var sc = spoil ? '<span class="sc '+(won===side?'w':(won<0?'':'l'))+'">'+
               g.f[side].toFixed(2)+'</span>' : '';
      return '<span class="ln"><img loading="lazy" src="'+crest(s.logo)+'" alt="">'+
             '<span class="nm">'+esc(s.name)+'</span>'+sc+'</span>';
    }
    // the tags are counts out of the rebuilt game, so they give a reason to
    // pick one without saying who won it. Gold is the house signal for the
    // lead changing hands, so a game where it never did does not get to wear
    // it -- and "0 lead changes" is a duller way of saying wire to wire.
    var lc = g.lc===0 ? '<span>Wire to wire</span>'
           : '<b>' + (g.lc===1 ? '1 lead change' : g.lc+' lead changes') + '</b>';
    return '<button class="card" data-g="'+i+'">'+line(a,0)+line(b,1)+
           '<span class="tag">'+lc+'<span>'+g.td+' touchdowns</span>'+
           '<span>'+g.ev.length+' plays</span></span></button>';
  }).join('');
  $('cards').innerHTML = html;
  var tot=0, flips=0;
  FEED.games.forEach(function(g){tot+=g.ev.length; flips+=g.lc;});
  $('note').textContent = 'Week '+FEED.week+': '+tot.toLocaleString()+
    ' plays rebuilt across '+FEED.games.length+' games, and the lead changed '+
    flips+' times. Nothing here is invented — the plays, the yardage and the '+
    'order they happened in are real, and the sixty-minute clock they sit on is '+
    'the only part that is made up.';
}

function goLobby(){
  stop();
  $('viewer').hidden = true; $('bar').hidden = true;
  $('lobby').hidden = false; $('back').hidden = true;
  document.body.classList.remove('watching');
  GAME = null; mark();
}

function setWeek(w){
  WEEK = w; paintWeeks();
  return load(w).then(function(f){ FEED=f; paintCards(); });
}

/* ---------- the game ---------- */

function openGame(i){
  GAME = FEED.games[i];
  $('lobby').hidden = true; $('viewer').hidden = false;
  $('bar').hidden = false; $('back').hidden = false;
  document.body.classList.add('watching');
  [['rowA',0],['rowB',1]].forEach(function(p){
    var r=$(p[0]), s=GAME.t[p[1]];
    r.querySelector('img').src = crest(s.logo);
    r.querySelector('.nm').textContent = s.name;
  });
  $('vnote').textContent = 'Tap any play to see the real one behind it. ' +
    'Gold marks the lead changing hands. The field shows the play and the ' +
    'ground it covered — not where on the pitch it happened, which the ' +
    'replay does not know and will not guess.';
  buildTrack();
  seek(0); mark();
  window.scrollTo(0,0);
}

function rowsFor(n){               // rebuild the feed from scratch up to n
  var out=[], g=GAME;
  for(var i=0;i<n;i++) out.push(row(g.ev[i], i));
  out.reverse();                   // newest at the top: no autoscroll on a phone
  if(n>=g.ev.length && t>=FULL)
    out.unshift('<div class="final">Full time &middot; '+g.f[0].toFixed(2)+
                ' &ndash; '+g.f[1].toFixed(2)+'</div>');
  if(!n) out.push('<div class="empty">Kick-off. Press play.</div>');
  return out.join('');
}

function row(e, i){
  var g=GAME, p=g.p[e[PID]], fl=e[FLG];
  var cls='ev'+((fl&GO)?' go':'')+((fl&TD)?' td':'')+((fl&RES)?' res':'');
  // A residual is points no single play accounts for. It keeps the running
  // score honest and it is NOT a play, so it never gets play text and never
  // gets described as one.
  var did = (fl&RES) ? 'scoring adjustment' : esc(e[TXT]);
  var who = (fl&RES) ? esc(p[0]) : esc(p[0]) + ' <small>' + esc(p[1]) + '</small>';
  var real = '';
  if(!(fl&RES)){
    var id=g.src[e[SRC]].split('_');
    real = 'Really: Q'+esc(e[RQ])+' '+esc(e[RC])+
           (id.length>3 ? ' · '+esc(id[2])+' at '+esc(id[3]) : '')+
           ' · '+(e[PTS]>0?'+':'')+e[PTS].toFixed(2)+' points';
  } else {
    real = 'Points the box score credits that no single play explains. ' +
           'Carried so the running total lands on the true final.';
  }
  return '<button class="ev '+cls.slice(3)+'" data-i="'+i+'" aria-expanded="false">'+
    '<span class="ck">Q'+e[QTR]+' '+esc(e[CK])+'</span>'+
    '<span><span class="who">'+who+'</span><span class="did">'+did+'</span>'+
    '<span class="real">'+real+'</span></span>'+
    '<span class="sc">'+e[S0].toFixed(2)+'&ndash;'+e[S1].toFixed(2)+'</span></button>';
}

function board(){
  var g=GAME, s=[0,0];
  if(shown) { s = [g.ev[shown-1][S0], g.ev[shown-1][S1]]; }
  var lead = s[0]-s[1];
  [['rowA',0],['rowB',1]].forEach(function(p){
    var r=$(p[0]);
    r.querySelector('.pts').textContent = s[p[1]].toFixed(2);
    r.className = 'row' + (lead===0 ? '' :
      ((lead>0) === (p[1]===0) ? ' up' : ' dn'));
  });
  $('qtr').textContent = t<=0 ? 'Pre-game' : (t>=FULL ? 'Full time' : 'Quarter '+qtrOf(t));
  $('clock').textContent = t<=0 ? '15:00' : clockOf(t);
  $('margin').textContent = lead===0 ? 'Level' :
    g.t[lead>0?0:1].name + ' by ' + Math.abs(lead).toFixed(2);
  var w = Math.min(1, Math.abs(lead)/30) * 50;
  var el = $('gauge');
  el.style.width = w+'%';
  el.style.left = lead>=0 ? '50%' : (50-w)+'%';
  $('scrub').value = Math.round(t);
}

function render(){ $('feed').innerHTML = rowsFor(shown); board(); keys(); }

// A jump with nothing left to jump to reads as a broken button rather than as
// an answer, so it says so itself: 0 lead changes means that key is dead for
// the whole game, and both keys die once the last one has gone past.
function keys(){
  var ev=GAME.ev, td=false, go=false;
  for(var i=shown;i<ev.length;i++){
    if(ev[i][FLG]&TD) td=true;
    if(ev[i][FLG]&GO) go=true;
    if(td&&go) break;
  }
  $('nextTd').disabled = !td;
  $('nextGo').disabled = !go;
  $('step').disabled = shown>=ev.length;
}

function seek(to){
  t = Math.max(0, Math.min(FULL, to));
  var n=0, ev=GAME.ev;
  while(n<ev.length && ev[n][SEC]<=t) n++;
  shown = n;
  render();
  if(shown) stage(ev[shown-1]);
  else clearField('Kick-off. Press play.');
}

// At three minutes a game the plays arrive about a second apart and every one
// of them gets staged. At twenty seconds they arrive every sixty milliseconds,
// and staging each would be a strobe. So a play only takes the field if the
// field is free -- except a touchdown or a lead change, which always does,
// because those are the two things anybody is watching for.
// WHY THE CLOCK NO LONGER DRIVES THIS
//
// It used to: the clock ran at so many game-seconds a second and whatever fell
// behind it got staged, unless the field was still busy with the last one, in
// which case the play was dropped. At a minute a game the plays arrive about
// three a second and each animation lasts about one, so the field was showing
// roughly one play in four -- picked by whether it happened to be free. That is
// exactly what "a disjointed video" looks like, and it was not a rendering
// problem, it was the transport.
//
// So the plays drive the clock now. Each one is staged in full, the clock is
// set to the moment that play actually happened, and the next one follows when
// this one is done. Nothing is skipped and nothing overlaps. A game runs about
// three minutes at 1x, which is what it takes to watch two hundred plays.
var PACE = 1, timer = 0;

function goTo(n){
  if(!GAME) return;
  shown = Math.max(0, Math.min(GAME.ev.length, n));
  t = shown ? GAME.ev[shown-1][SEC] : 0;
  if(shown >= GAME.ev.length) t = FULL;
  render();
  if(shown) stage(GAME.ev[shown-1]);
  else clearField('Kick-off. Press play.');
}

function stepOne(){
  if(!playing || !GAME) return;
  if(shown >= GAME.ev.length){ t=FULL; render(); stop(); return; }
  var e = GAME.ev[shown++];
  t = e[SEC];
  render();
  if(e[FLG]&GO){ var b=$('board'); b.classList.remove('flip');
                 void b.offsetWidth; b.classList.add('flip'); }
  var span = stage(e);
  timer = setTimeout(stepOne, span + 240/PACE);
}

function start(){ if(playing||!GAME) return;
  if(shown>=GAME.ev.length) goTo(0);
  playing=true; $('play').textContent='Pause';
  stepOne(); }
function stop(){ playing=false; if(timer) clearTimeout(timer); timer=0;
  var p=$('play'); if(p) p.textContent='Play'; }

// by index, not by clock: several plays can share a second, and seeking to
// that second landed on whichever of them came last
function jump(test){
  var ev=GAME.ev;
  for(var i=shown;i<ev.length;i++) if(test(ev[i])) { goTo(i+1); return; }
  goTo(ev.length);
}

/* ---------- plumbing ---------- */

function mark(){
  var q = GAME ? ('?w='+WEEK+'&g='+FEED.games.indexOf(GAME)) : ('?w='+WEEK);
  history.replaceState(null,'',q);
}

$('weeks').addEventListener('click', function(e){
  var b=e.target.closest('[data-w]'); if(!b) return;
  setWeek(+b.dataset.w).then(mark);
});
$('cards').addEventListener('click', function(e){
  var b=e.target.closest('[data-g]'); if(!b) return;
  openGame(+b.dataset.g);
});
$('feed').addEventListener('click', function(e){
  var b=e.target.closest('.ev'); if(!b) return;
  b.setAttribute('aria-expanded', b.getAttribute('aria-expanded')==='true'?'false':'true');
});
$('spoiler').addEventListener('click', function(){
  spoil=!spoil; this.setAttribute('aria-pressed', spoil);
  this.textContent = spoil? 'Shown':'Hidden';
  try{ localStorage.setItem('scfl-replay-spoil', spoil?'1':'0'); }catch(e){}
  paintCards();
});
$('back').addEventListener('click', goLobby);
$('play').addEventListener('click', function(){ playing? stop():start(); });
$('rew').addEventListener('click', function(){ stop(); seek(0); });
$('step').addEventListener('click', function(){ stop();
  jump(function(){return true;}); });
$('nextTd').addEventListener('click', function(){ stop();
  jump(function(e){return e[FLG]&TD;}); });
$('nextGo').addEventListener('click', function(){ stop();
  jump(function(e){return e[FLG]&GO;}); });
$('scrub').addEventListener('input', function(){ stop(); seek(+this.value); });

var RATES=[[1,'1\u00d7'],[2,'2\u00d7'],[3,'3\u00d7'],[0.5,'\u00bd\u00d7']];
$('rate').addEventListener('click', function(){
  var i=0; RATES.forEach(function(r,n){ if(r[0]===PACE) i=n; });
  var nx=RATES[(i+1)%RATES.length]; PACE=nx[0]; this.textContent=nx[1];
});

document.addEventListener('keydown', function(e){
  if($('viewer').hidden) return;
  if(e.key===' '){ e.preventDefault(); playing?stop():start(); }
  if(e.key==='ArrowRight'){ stop(); jump(function(){return true;}); }
  if(e.key==='Escape') goLobby();
});
document.addEventListener('visibilitychange', function(){ if(document.hidden) stop(); });

fetch('week-data/watch-index.json',{cache:'no-cache'}).then(function(r){return r.json();})
 .then(function(ix){
   IDX=ix;
   var q=new URLSearchParams(location.search);
   var w=+q.get('w'); if(IDX.weeks.indexOf(w)<0) w=IDX.weeks[IDX.weeks.length-1];
   var spoilBtn=$('spoiler');
   spoilBtn.setAttribute('aria-pressed',spoil); spoilBtn.textContent=spoil?'Shown':'Hidden';
   return setWeek(w).then(function(){
     var g=+q.get('g');
     if(q.get('g')!==null && g>=0 && g<FEED.games.length) openGame(g);
   });
 })
 .catch(function(err){
   $('cards').innerHTML = '<p class="note">The week feeds could not be loaded. ' +
     'Run <code>python3 scripts/build_watch.py</code> and reload.</p>';
   if(window.console) console.error(err);
 });
})();
</script>
