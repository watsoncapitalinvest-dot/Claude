<!doctype html><html><body style="margin:0;background:transparent">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
<script type="module">
// Joe transport helicopter (Generals Chinook mesh, repainted) cut into X-COM tiles at 4x.
// World as tiles.html: tile spans x,y in [0,1], z in levels. Craft map 10x10x3, nose toward +x.
import * as THREE from 'three';
import {OBJLoader} from 'three/addons/loaders/OBJLoader.js';
const SS=4, W=128*SS, H=160*SS;
const r=new THREE.WebGLRenderer({antialias:false,alpha:true,preserveDrawingBuffer:true});
r.setSize(W,H); r.setClearColor(0,0); r.outputColorSpace=THREE.SRGBColorSpace; r.localClippingEnabled=true; document.body.appendChild(r.domElement);
const cam=new THREE.OrthographicCamera(-64,64,96,-64,-2000,2000);
const scene=new THREE.Scene(); scene.add(new THREE.AmbientLight(0xffffff,1.0));
const root=new THREE.Group(); root.matrixAutoUpdate=false; root.matrix.set(64,-64,0,0, -32,-32,96,0, 1,1,1,0, 0,0,0,1); scene.add(root);
const holder=new THREE.Group(); root.add(holder);
const LDIR=new THREE.Vector3(0.35,0.75,0.9).normalize();
const PAL={body:'#7a9a44',belly:'#5a7432',glass:'#26405c',rotor:'#2b2b2b',hub:'#5a5a5a',wheel:'#1c1c1c',white:'#f2f2ee'};
window.S=null; const planes=[];
function shade(geo,colFn){ geo=geo.index?geo.toNonIndexed():geo; geo.computeVertexNormals(); const P=geo.attributes.position,N=geo.attributes.normal,n=P.count,C=new Float32Array(n*3),v=new THREE.Vector3(),c=new THREE.Vector3();
  for(let t=0;t<n;t+=3){ v.set(0,0,0); c.set(0,0,0); for(let k=0;k<3;k++){v.add(new THREE.Vector3(N.getX(t+k),N.getY(t+k),N.getZ(t+k))); c.add(new THREE.Vector3(P.getX(t+k),P.getY(t+k),P.getZ(t+k)));} v.normalize(); c.multiplyScalar(1/3);
    const col=new THREE.Color(colFn(c,v)); const d=v.dot(LDIR); const sh=d>0.8?1.0:d>0.45?0.86:d>0.1?0.7:0.56;
    for(let k=0;k<3;k++) C.set([col.r*sh,col.g*sh,col.b*sh],3*(t+k)); }
  geo.setAttribute('color',new THREE.BufferAttribute(C,3)); return geo; }
const MAT=()=>new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide,clippingPlanes:planes});
window.init=async(opt)=>{ if(opt.body){PAL.body=opt.body; PAL.belly=opt.belly;}
  const o=await new OBJLoader().loadAsync(opt.file||'chinook.obj'); const SKIP=/FX|MUZZLE|LIGHT|SMOKE|EXPLO|GLOW|NVBUGGY|_PROP$|^PROPS|TREAD|HOUSECOLOR|BARREL|RECTANGLE/;
  const bb=new THREE.Box3().setFromObject(o); const X0=bb.min.x, X1=bb.max.x, Z0=bb.min.z, Z1=bb.max.z;
  // model units -> tiles: fuselage 40.9 long -> LEN tiles; z: tiles/1.5 per level
  const LEN=opt.len, s=LEN/(opt.model_len||40.9), cx=opt.cx, cy=opt.cy, zs=opt.zs||1, zo=opt.zfix?-Z0:0;
  const T=(x,y,z)=>opt.noseY? new THREE.Vector3(cx+y*s, cy-x*s, (z+zo)*s*zs/1.5) : new THREE.Vector3(cx+x*s, cy-y*s, (z+zo)*s*zs/1.5);
  o.traverse(m=>{ if(!m.isMesh) return; const nm=m.name.toUpperCase(); let g=m.geometry.clone(); const P=g.attributes.position;
    if(SKIP.test(nm)) return;
    const ox=[]; for(let i=0;i<P.count;i++){ ox.push(P.getX(i),P.getZ(i)); const v=T(P.getX(i),P.getY(i),P.getZ(i)); P.setXYZ(i,v.x,v.y,v.z); }
    const isRotor=nm.startsWith('PROPELLER');
    g=shade(g,(c,n)=> isRotor? PAL.rotor :
      (c.z*1.5/s<2.2 && Math.abs(n.z)<0.6 && (cx-c.x)/s>-19 && false)? PAL.wheel :
      (opt.glass && (opt.noseY? (cy-c.y)/s : (c.x-cx)/s) > X1-opt.glass*(X1-X0) && c.z*1.5/(s*zs)-zo > Z0+0.45*(Z1-Z0) && n.z>-0.2)? PAL.glass :
      (n.z<-0.5)? PAL.belly : PAL.body);
    holder.add(new THREE.Mesh(g,MAT())); });
  // rotor blades: three long thin blades per rotor head, laid so they stay inside the 10x10 block
  const heads=opt.heads;
  for(const h of heads){ for(const a of h.ang){ const g=new THREE.BoxGeometry(h.len,0.09,0.03); g.translate(h.len/2,0,0); g.rotateZ(a); g.translate(h.x,h.y,h.z);
      holder.add(new THREE.Mesh(shade(g,()=>PAL.rotor),MAT())); }
    const hub=new THREE.CylinderGeometry(0.12,0.12,0.12,10); hub.rotateX(Math.PI/2); hub.translate(h.x,h.y,h.z-0.02); holder.add(new THREE.Mesh(shade(hub,()=>PAL.hub),MAT())); }
  // white star roundel on both flanks
  const cv=document.createElement('canvas'); cv.width=cv.height=128; const g2=cv.getContext('2d');
  g2.fillStyle=PAL.white; g2.beginPath(); for(let i=0;i<10;i++){const R=i%2?24:60,a=-Math.PI/2+i*Math.PI/5; g2.lineTo(64+R*Math.cos(a),64+R*Math.sin(a));} g2.fill();
  const tex=new THREE.CanvasTexture(cv); tex.colorSpace=THREE.SRGBColorSpace;
  for(const side of (opt.stars||[1])){ const p=new THREE.PlaneGeometry(0.75,0.5); const m=new THREE.Mesh(p,new THREE.MeshBasicMaterial({map:tex,transparent:true,alphaTest:0.5,side:THREE.DoubleSide,clippingPlanes:planes}));
    m.rotation.x=Math.PI/2; if(opt.noseY){ m.rotation.z=Math.PI/2; m.position.set(cx+side*opt.half, cy+(opt.starOff||0), opt.starZ);} else m.position.set(cx-0.2, cy+side*opt.half, opt.starZ); holder.add(m); }
  window.S=s; return true; };
window.renderCell=(i,j,k)=>{ holder.position.set(-i,-j,-k); holder.updateMatrixWorld(true); root.updateMatrixWorld(true);
  planes.length=0; const E=1e-3;
  const loc=[[1,0,0,0],[-1,0,0,1],[0,1,0,0],[0,-1,0,1],[0,0,1,0],[0,0,-1,1]];
  for(const [a,b,c,d] of loc){ const p=new THREE.Plane(new THREE.Vector3(a,b,c),d+E); p.applyMatrix4(root.matrix); planes.push(p); }
  r.render(scene,cam); return r.domElement.toDataURL('image/png'); };
window.renderAll=(MW,ML)=>{ MW=MW||10; ML=ML||10; holder.position.set(0,0,0); planes.length=0; holder.updateMatrixWorld(true);
  const xl=-64*ML-20, xr=64*MW+20, yt=320, yb=-32*(MW+ML)-20; const c2=new THREE.OrthographicCamera(xl,xr,yt,yb,-2000,2000); r.setSize(Math.round((xr-xl)/1),Math.round((yt-yb)/1)); r.render(scene,c2); const u=r.domElement.toDataURL('image/png'); r.setSize(W,H); return u; };
window.ready=true;
</script></body></html>
