# ROSTER hand layer, Cobra batch 1 (the Bible's "Batch 1: Year 1 and Act 2" villains).
# ONLY what the sources do not hold. Name, faction, version, weapon, trait and move names and text,
# real name, rank, dossier and quote come from the Bible, the Catalog and the character articles (build.py).
#   rank      canon rank, or the rank-equivalent the stat model uses (tier) when canon has none
#   primary / secondary / nudge   the stat model's inputs, as for the Joes
#   unit      the OXCE unit type (existing ones are BUILD's; new ones BUILD creates)
#   window    PROPOSED campaign months (earliest-full), only where the calendar names none
#   engine    how the trait / move is built (see ENGINE_SPEC.md): native | script | ai-fork
#   effect    the proposed game numbers
#   voice     deploy / order / kill / hit / down (the move line is the article's quote)
batch: cobra_b1
