# ROSTER hand layer: the Navy divers, CAST's queue after the Batch-1 villains (John 17:09: "queue torpedo, Wet Suit and
# Deep Six after these guys"). ONLY what the sources do not hold; effects are PROPOSED numbers for John's review.
# Water: the game has no underwater battles yet (SEA_BATTLES_DESIGN_v1 is after air and big vehicles), so each trait and
# move also says what it does on a dry map, where these three will fight until then.
batch: joes_navy
characters:
- key: TORPEDO
  source: C_TORPEDO
  rank: W-4
  rankName: Warrant Officer   # US Navy; Catalog: Warrant Officer (W-4)
  primary: Naval & Divers
  secondary: Demolitions & Engineering
  nudge: {Melee: 6, Sta: 6}
  status: 'Mission: Transfer'
  trait: {name: Frogman, text: "Swims like he walks. Charges set by him go off harder.", engine: script, effect: "no TU or energy penalty in water tiles; explosives he primes do +15% damage (dry maps: the explosive bonus only)"}
  move: {engine: request, effect: "Underwater Demolition (Catalog): one action destroys a boat or dock tile; on a dry map, one wall, door or vehicle hull tile next to him"}
  bonds: ["Wet Suit and Deep Six (the SEAL and diver team): any two of them in the squad, both +10 reactions in water"]
  grudges: []
  voice: {deploy: "Water's warm. Let's go.", order: "Aye, aye.", kill: "Sleep with the fishes, bruddah.", hit: "Ow! That stung worse than a jellyfish.", down: "Get me back to the water..."}
- key: WET_SUIT
  source: C_WET_SUIT
  rank: E-5
  rankName: Petty Officer Second Class   # US Navy E-5; the Bible has no rank for him - check his file card
  rankNote: 'ROSTER: no canon rank in the Bible or Catalog - E-5 is a placeholder, check the file card'
  primary: Naval & Divers
  secondary: null
  nudge: {TU: 6, React: 4}
  status: 'Mission: Transfer'
  trait: {name: Wet Feet Only, text: "Faster and sharper near water, short-tempered away from it.", engine: script, effect: "+8 TU each turn he starts in or next to water; -5 bravery on maps with no water at all"}
  move: {engine: request, effect: "Hit and Run (Catalog): moves, attacks and moves again in one turn; in water he submerges after (cannot be seen until his next action)"}
  bonds: ["Torpedo and Deep Six: see Torpedo"]
  grudges: ["Eels (Cobra frogmen, later): +15% damage both ways"]
  voice: {deploy: "Dry land. Great. My favourite.", order: "Yeah, yeah, hooyah.", kill: "Shark bait.", hit: "Agh! I'm leaking!", down: "Tell 'em... I wanted a burial at sea..."}
- key: DEEP_SIX
  source: C_DEEP_SIX
  rank: E-7
  rankName: Chief Petty Officer   # US Navy; Catalog: Chief Petty Officer (E-7)
  primary: Naval & Divers
  secondary: Armor & Vehicles
  nudge: {Sta: 10, Brav: 8, TU: -6}
  status: 'Vehicle: S.H.A.R.C.'
  trait: {name: Deep Pressure, text: "Slow and steady; nothing rattles him.", engine: script, effect: "cannot panic; stun damage to him is halved"}
  move: {engine: request, effect: "Deep Dive (Catalog): in water, he and every diver within 3 tiles vanish from Cobra sight until they attack (dry maps: 1 turn of smoke-like cover on his tile and the 8 around it)"}
  bonds: ["Torpedo and Wet Suit: see Torpedo"]
  grudges: []
  voice: {deploy: "...", order: "Mm.", kill: "...", hit: "Hm.", down: "...quiet down here."}
