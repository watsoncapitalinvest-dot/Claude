  STR_ALIEN_CONTAINMENT_UFOPEDIA: Living Cobra troops are likely to require a special habitat to maintain their life systems. The containment facility can keep up to 10 Cobra life forms in self-contained units.
  STR_PLASMA_DEFENSES_UFOPEDIA: Pulse beam defences provide powerful and efficient protection against incursion by hostile craft.
  STR_FUSION_BALL_DEFENSES_UFOPEDIA: Fusion missiles provide the most effective defence against Cobra attacks. These missiles create an anti-matter implosion which destroys everything within a specific radius.
  STR_GRAV_SHIELD_UFOPEDIA: The Gravity shield repels Cobra craft attempting to land near the base long enough for all defence systems to fire again. In practice this will double the effectiveness of any defence systems at your base.
  STR_MIND_SHIELD_UFOPEDIA: Since Cobra craft rely on brain waves to detect human presence then the most effective counter measure is to shield brain waves from the base. This facility will drastically reduce the chances of detection by Cobra craft.
  STR_PSIONIC_LABORATORY_UFOPEDIA: The brainwave science lab can assess the brainwave potential of all soldiers at the base and give them the necessary training to utilise their brainwave skills. Each lab can train up to ten soldiers. Training is allocated at the end of each month. Brainwave skills used in conjunction with a Brainwave Amp can be used for brainwave attacks during combat.
  STR_HYPER_WAVE_DECODER_UFOPEDIA: Cobra communications rely on a supra-dimensional wave which travels almost instantaneously. The decoder facility intercepts Cobra craft transmissions and decodes the information. This will show the type of Cobra craft, the Cobra race and the type of activity.
  STR_HANGAR_UFOPEDIA: Each hangar can accommodate one craft. There are facilities for maintenance, refuelling and repair of G.I. Joe craft. Each craft stationed at a base must have a free hangar assigned to it which cannot be used by other craft, even if the assigned craft is out on a mission.
  STR_PISTOL_UFOPEDIA: The standard issue G.I. Joe pistol is a high powered semi-automatic with a 12 round capacity.
  STR_PSI_AMP_UFOPEDIA: The Brainwave Amp can only be used by soldiers with brainwave skill. During combat, click on the Brainwave Amp, select the type of attack, and select a target unit with the cursor. There are two types of brainwave attack:{NEWLINE}PANIC UNIT> If the attack is successful it will reduce the target's morale and may cause it to panic.{NEWLINE}MIND CONTROL> If this is successful then you will gain immediate control of the enemy unit as if it was one of your own. It is more difficult to be successful with this type of attack.
  STR_MIND_PROBE_UFOPEDIA: The mind probe is a Cobra communication device which is used to take information directly from brain waves. G.I. Joe units can use this device in combat to display a Cobra's characteristics. Click on the mind probe and the 'use' option. Then click on a Cobra with the cursor.
  STR_PLASMA_PISTOL_UFOPEDIA: Pulse Pistols are a lethal Cobra weapon based on accelerating particles from within a minute anti-gravity field.
  STR_BLASTER_LAUNCHER_UFOPEDIA: This is a Cobra guided missile launcher which fires powerful 'blaster bombs'. When you click to fire the weapon it will generate 'way points' for the blaster bomb to follow. When you have positioned enough way points click on the special launch icon.
  STR_SMALL_LAUNCHER_UFOPEDIA: A small launcher which fires stun bombs. Very useful for capturing live Cobra troops.
