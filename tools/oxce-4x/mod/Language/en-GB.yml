  STR_XCOM_PROJECT_MONTHLY_REPORT: G.I. JOE PROJECT MONTHLY REPORT
  STR_COUNCIL_IS_GENERALLY_SATISFIED: The Joint Chiefs of funding nations is generally satisfied with your progress so far.
  STR_COUNCIL_IS_VERY_PLEASED: The Joint Chiefs of funding nations is very pleased with your excellent progress. Keep up the good work.
  STR_COUNCIL_IS_DISSATISFIED: The Joint Chiefs of funding nations is dissatisfied with your performance. You must improve your effectiveness in dealing with the Cobra menace or risk termination of the project.
  STR_YOU_HAVE_NOT_SUCCEEDED: You have not succeeded in dealing with the Cobra invasion and the Joint Chiefs of funding nations has regrettably decided to terminate the project. Each nation shall deal with the problem as they see fit. We can only hope that we can come to some accommodation with these apparently hostile forces, and that the general population will come to terms with the Cobra visitors.
  STR_COUNTRIES_ARE_PARTICULARLY_HAPPY: '{0} are particularly happy with your progress in dealing with local Cobra incursion and have agreed to increase their funding.'
  STR_COUNTRY_IS_UNHAPPY_WITH_YOUR_ABILITY: '{0} is unhappy with your ability to deal with Cobra activity in its territory and has decided to reduce its financial commitment.'
  STR_COUNTRIES_ARE_UNHAPPY_WITH_YOUR_ABILITY: '{0} are unhappy with your ability to deal with Cobra activity in their territory and have decided to reduce their funding.'
  STR_COUNTRY_HAS_SIGNED_A_SECRET_PACT: '{0} has signed a secret pact with unknown Cobra forces and has withdrawn from the project.'
  STR_COUNTRIES_HAVE_SIGNED_A_SECRET_PACT: '{0} have signed a secret pact with unknown Cobra forces and have withdrawn from the project.'
  STR_COUNCIL_REDUCE_DEBTS: The funding Joint Chiefs is not happy with your financial position. You must reduce your debts below $2million or the project will be terminated.
