  STR_UFO_CRASH_RECOVERY_BRIEFING: Exercise caution - There may be operatives in the Cobra craft or around the crash site. Mission will be successful when all enemy units have been eliminated or neutralised. Recovery of Cobra craft remains, artefacts and Cobra corpses can then be initiated. To abort the mission return G.I. Joe operatives to transport vehicle and click on the 'Abort Mission' icon.
  STR_UFO_GROUND_ASSAULT: COBRA CRAFT GROUND ASSAULT
  STR_UFO_GROUND_ASSAULT_BRIEFING: Explore landing site and, if possible, gain entry to the Cobra craft. Mission will be successful when all enemy units have been eliminated or neutralised. Recovery of Cobra craft, artefacts and Cobra corpses can then be initiated. To abort the mission return G.I. Joe operatives to transport vehicle and click on the 'Abort Mission' icon.
  STR_BASE_DEFENSE_BRIEFING: An Cobra vessel has landed nearby. Our base is in severe danger. As per standard procedure all non-combat personnel and G.I. Joe craft have been evacuated. Cobra units will enter the base via hangar doors or the access lift. Defend the base and its vital installations at all costs - this is a fight to the death. If you click on the 'abort mission' icon you will concede defeat and lose the base.
  STR_ALIEN_BASE_ASSAULT: TERROR DROME ASSAULT
  STR_ALIEN_BASE_ASSAULT_BRIEFING: G.I. Joe operatives have gained entrance to an Terror Drome. The control centre must be destroyed to render the base inoperative. The mission will terminate when all enemies are eliminated, or when your squad has returned to the green exit area (click on the 'abort mission' icon to escape).
  STR_CYDONIA_BRIEFING: You have arrived in Cobra Island. You gain entry to a large underground complex near the Martian Sphinx. You must destroy the Cobra Brain that controls all Cobra activity. The fate of humanity is in your hands....
  STR_TERROR_MISSION_BRIEFING: Mission will be successful when all enemy units have been eliminated or neutralised. You must attempt to save the lives of any civilians in the area by neutralising the Cobra menace. To abort the mission return G.I. Joe operatives to transport vehicle and click on the 'Abort Mission' icon.
  STR_ARE_YOU_SURE_CYDONIA: Are you sure you want to send this craft on a mission to Cobra Island?
