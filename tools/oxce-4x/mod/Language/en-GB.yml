  STR_SECTOID_AUTOPSY_UFOPEDIA: 'INTERROGATION REPORT. Captured Vipers know their squad, their sergeant and nothing else. Cobra keeps its rank and file deliberately ignorant. Their kit is good: modern rifles, body armour and Cobra-issue radios that give away unit call signs.'
  STR_FLOATER_AUTOPSY_UFOPEDIA: INTERROGATION REPORT. Air Vipers are trained for short, violent raids and are poorly prepared for a long fight. Their radios carry flight schedules that our analysts can turn into intercept windows.
  STR_SNAKEMAN_UFOPEDIA: ARASHIKAGE. Storm Shadow's ninja clan works for Cobra as scouts and assassins. They move quietly, strike at close range and vanish. Never leave a flank unwatched when Arashikage are reported in the area.
  STR_SNAKEMAN_AUTOPSY_UFOPEDIA: INTERROGATION REPORT. The Arashikage answer to their clan before they answer to Cobra. Several prisoners hinted that the alliance is one of convenience, a crack worth exploiting.
  STR_MUTON_AUTOPSY_UFOPEDIA: INTERROGATION REPORT. Grenadiers are professionals and talk about money, not ideology. Their shipping manifests trace back to Destro's arms factories, and their equipment is the best Cobra fields.
  STR_ETHEREAL_UFOPEDIA: COBRA COMMAND. The masked leadership of Cobra, led by Cobra Commander himself. They seldom fight, but when they do they are surrounded by the best troops Cobra has. Brainwave research suggests some of them can unsettle a soldier's nerve at range.
  STR_ETHEREAL_AUTOPSY_UFOPEDIA: 'INTERROGATION REPORT. Nobody from Cobra Command has ever been held for long. What we have learned points to a single headquarters on an island off the charts: Cobra Island.'
  STR_CHRYSSALID_AUTOPSY_UFOPEDIA: 'TEARDOWN. Lightweight frame, oversized servos, almost no armour. Its targeting is crude: it goes for the nearest warm body.'
  STR_CELATID_AUTOPSY_UFOPEDIA: TEARDOWN. Heavy chest armour, light back plate. Flank it.
  STR_SILACOID_AUTOPSY_UFOPEDIA: TEARDOWN. Its payload is unstable. Engage it from a distance.
