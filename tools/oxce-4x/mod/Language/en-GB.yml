en-GB:
  STR_AVENGER_UFOPEDIA: TRANSPORTER AND COMBAT SPACECRAFT. THE ULTIMATE REPLICATION OF COBRA TECHNOLOGY.
  STR_LIGHTNING_UFOPEDIA: TRANSPORTER AND COMBAT CRAFT. A CRUDE BUT EFFECTIVE REPLICATION OF COBRA PROPULSION SYSTEMS.
  STR_FIRESTORM_UFOPEDIA: COMBAT CRAFT. THIS ONE-MAN FIGHTER REPLICATES THE CLASSIC COBRA ATTACK CRAFT DESIGN, WITH CENTRAL PROPULSION UNIT.
  STR_SECTOID_UFOPEDIA: 'VIPERS are the backbone of Cobra''s army: conscripts in full-face visor helmets who never show their faces, even to each other. Individually they are average shots. In numbers, dug in and directed by an officer, they are dangerous. Expect them first through every door.'
  STR_SECTOID_AUTOPSY: Viper autopsy
  STR_SNAKEMAN_AUTOPSY: Arashikage autopsy
  STR_ETHEREAL_AUTOPSY: Cobra Command autopsy
  STR_MUTON_UFOPEDIA: IRON GRENADIERS are Destro's private army, hired out to Cobra and paid in M.A.R.S. weapons. They are better armed and better trained than ordinary Vipers, and they hold ground. Bring heavy weapons.
  STR_MUTON_AUTOPSY: Iron Grenadier autopsy
  STR_CELATID_UFOPEDIA: B.A.T. SENTRY. A guard unit left to hold corridors and doorways. Slow, but it fires on anything that moves.
  STR_CELATID_AUTOPSY: B.A.T. Sentry autopsy
  STR_SILACOID_UFOPEDIA: B.A.T. CRAWLER. A low-profile demolition android used to clear tunnels and bunkers.
  STR_SILACOID_AUTOPSY: B.A.T. Crawler autopsy
  STR_CHRYSSALID_UFOPEDIA: B.A.T. INFILTRATOR. A Battle Android Trooper stripped for speed. It closes to melee range and tears into anything it reaches. Kill it before it gets close.
  STR_CHRYSSALID_AUTOPSY: B.A.T. Infiltrator autopsy
  STR_FLOATER_UFOPEDIA: 'AIR VIPERS are Cobra''s rapid-response infantry, inserted by FANG and Firebat aircraft. Lightly armoured and quick to reposition, they rely on surprise. Their weak point is discipline: cut off from their transport, they fall apart.'
  STR_FLOATER_AUTOPSY: Air Viper autopsy
  STR_REAPER_UFOPEDIA: B.A.T. HUNTER. A tracking variant that runs down fleeing civilians and stragglers. Fast on open ground, clumsy in buildings.
  STR_REAPER_AUTOPSY: B.A.T. Hunter autopsy
  STR_REAPER_AUTOPSY_UFOPEDIA: TEARDOWN. Heat and motion sensors in a reinforced head unit. Smoke blinds it.
  STR_SECTOPOD_UFOPEDIA: 'B.A.T. HEAVY. Destro''s heavy-weapons android: thick armour and a shoulder-mounted cannon. Treat it like a light tank.'
  STR_SECTOPOD_AUTOPSY: B.A.T. Heavy autopsy
  STR_SECTOPOD_AUTOPSY_UFOPEDIA: TEARDOWN. The power pack sits behind the left shoulder. Armour-piercing rounds there end it quickly.
  STR_CYBERDISC_UFOPEDIA: B.A.T. DRONE. A flying gun platform that patrols Cobra perimeters and supports assaults from above.
  STR_CYBERDISC_AUTOPSY: B.A.T. Drone autopsy
  STR_CYBERDISC_AUTOPSY_UFOPEDIA: TEARDOWN. Twin rotors and a small fuel cell. It is fragile once its shielding is breached.
  STR_UFO_POWER_SOURCE_UFOPEDIA: The power source of Cobra craft is an anti-matter reactor which uses Cobranium (element 115) to generate powerful gravity waves as well as other forms of energy. The conversion of matter to energy is an incredible 99% efficient, therefore tiny quantities of Cobranium can produce a huge amount of power. This unit can be reproduced easily using Cobra alloys.
  STR_UFO_NAVIGATION_UFOPEDIA: Cobra craft use sophisticated computers to navigate on earth and through space. The system is based on optical processors arranged in network fashion. The control interface is relatively simple - the navigator controls the direction of gravity waves generated by the power source to move the craft in any direction. This system can be used easily by humans, and it can be reproduced using Cobra alloys and other components.
  STR_UFO_CONSTRUCTION_UFOPEDIA: Cobra craft consist of three main components - a power source, a navigation system and a hull built from Cobra alloys. The hull is specially designed to allow gravity waves to be directed and controlled. In addition a small quantity of Cobranium is required to fuel the power source. Once the principles of construction are understood, and the functions of each component are known, then it is possible to build these types of craft.
  STR_ALIEN_FOOD_UFOPEDIA: These chambers contain various enzymes which are used to digest the body parts of cattle, other animals and even humans. The liquid is then consumed as ready digested food - probably direct to the bloodstream. This suggests a certain dependence on earth for food - a symbiosis between earth and Cobra society.
  STR_ALIEN_REPRODUCTION_UFOPEDIA: These chambers contain Cobra foetuses. The design of these containers seems to suggest that the Cobra troops which use this process rely completely on laboratory reproduction. The rich nutrients ensure rapid development of the foetus. This factory line system could generate thousands of Cobra clones in a short space of time. The process could be easily adapted for human reproduction, or Cobra-human hybrids.
  STR_ALIEN_ENTERTAINMENT_UFOPEDIA: The most likely function of these spheres is recreational. The brainwave circuitry stimulates various centres of the brain. The effect is similar to hallucinogenic drugs. This is the only evidence that Cobra troops have any cultural or recreational pastimes.
  STR_ALIEN_SURGERY_UFOPEDIA: This surgical equipment uses laser cutters to extract certain body parts from cattle and other animals. The widespread cattle mutilations can be accounted for by this bizarre Cobra activity. It is likely that these parts are used for nutritional or genetic purposes.
  STR_EXAMINATION_ROOM_UFOPEDIA: In the past many thousands of people have claimed to have been abducted by Cobra troops, sometimes repeatedly. The truth is far more horrific. Humans are abducted, researched and monitored. The best specimens have genetic material extracted. Women have human-Cobra hybrid foetuses implanted, and then removed several months later. Who knows what sinister motives the Cobra troops have?
  STR_ALIEN_ALLOYS_UFOPEDIA: Cobra craft are constructed from special alloys with unique properties. They are extremely light and durable, and can be moulded by electro-magnetic methods. This material can be reproduced and used in many kinds of manufacturing processes.
  STR_ALIEN_ORIGINS_UFOPEDIA: It is clear that we are fighting a losing battle on earth. The Cobra hordes are overwhelming in number. The best we can do is slow down their progress. The only hope for humanity is to tackle the Cobra troops at their source. Our research seems to indicate a nearby base of operations within our solar system. Cobra troops indicate this place to be the centre of an ancient civilisation that pre-dates human history. We must locate this place as soon as possible. However, we need to capture and interrogate a Cobra leader to gain more detailed information. The larger Cobra craft probably contain at least one Cobra leader.
  STR_THE_MARTIAN_SOLUTION_UFOPEDIA: Our research now points to Cobra Island as the base of Cobra operations. The base is well hidden, and contains all the manufacturing and cloning facilities to fuel the infiltration of earth. It also seems to contain a controlling computer of some kind that controls the whole operation. It seems that the hive-like Cobra society has some kind of 'queen bee'. This is their fundamental weakness - if we can eliminate the 'brain' then the body will die. We must step up our research efforts before it is too late. In order to progress we must capture the highest ranking Cobra troops - the commanders - which only reside in Cobra bases and battleships.
  STR_CYDONIA_OR_BUST_UFOPEDIA: It is now clear that the Cobra hordes are being controlled from an underground base in Cobra Island - which is an unusual area of Cobra Island featuring five sided pyramids and a large formation resembling a human face. Cydonian civilisation once flourished on Cobra Island many millions of years ago, but we do not know why it died out, or what the connection is with the latest Cobra activity there. Whatever the explanation we must send an expedition to Cobra Island. This is the only way that we can defeat the Cobra troops. We must destroy the controlling master 'brain'. We will need an Defiant craft equipped with the most awesome destructive power at our disposal. There is nothing more we can learn here - we must await the outcome of the Cydonian assault.
  STR_LIVING_QUARTERS: Barracks
  STR_VICTORY_1: As you enter the chamber you see the Cobra brain - the object of your quest. Before you can fire it communicates to you via a screen at its base. It implores you to listen to its arguments for survival before you make the decision to pull the trigger...
  STR_VICTORY_2: 'The brain speaks: ''Many millions of years ago the planet you call Cobra Island was alive. This life was brought to a barren planet by our civilisation as it was to yours. For millions of years we have visited your planet and genetically developed your species. You cannot kill us, you are part of us...'
  STR_GAME_OVER_1: The Cobra troops attempt to exterminate all humanity, destroying cities and poisoning the air and sea. The resistance of earth armies is futile in the face of vastly superior technology. Surviving generations suffer terrible mutations as they flee Cobra destruction. They are rounded up into slave camps to help transform earth into a Cobra colony which is part of some unknown empire.
  STR_GAME_OVER_2: The knowledge gained through the G.I. Joe project is lost forever. You have failed to save the earth.
  STR_VICTORY_4: The Cobra brain is interrupted by a burst of hot pulse, and the entire Cobra force is defeated.
  STR_VICTORY_5: Once the Cobra troops have lost Cobra Island they have lost the earth. Before long the G.I. Joe research allows humanity to flourish once more, and claim Cobra Island for itself. The Cobra menace has gone, but for how long, no one knows...
  STR_YOU_HAVE_FAILED: You have failed to stop the Cobra onslaught. One by one the funding nations sign pacts with Cobra troops promising technology, prosperity and peace. However it soon becomes clear that the Cobra troops have other plans...
