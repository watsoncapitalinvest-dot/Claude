  STR_TANK_CANNON_UFOPEDIA: Automated Heavy Weapons Platforms are designed to complement a G.I. Joe squad. The combination of high fire power and strong armour makes these units valuable for open terrain fire fights. Make sure that there are sufficient cannon shells in your stores to re-arm tanks. They are armed automatically when you assign them to a squad.
  STR_TANK_ROCKET_LAUNCHER_UFOPEDIA: This automated Heavy Weapons Platform is armed with powerful rockets. This will be devastating for any Cobra foe. Make sure your stores are kept supplied with MOBAT rockets.
  STR_TANK_LASER_CANNON_UFOPEDIA: Laser weapons are a useful addition for MOBATs. It combines heavy firepower with no ammunition restrictions.
  STR_HOVERTANK_PLASMA_UFOPEDIA: Cobra technology has given the MOBAT a new lease of life. The added manoeuvrability of air travel and the power of pulse beams is a lethal combination.
  STR_HOVERTANK_LAUNCHER_UFOPEDIA: This HAVOC has a fusion ball launcher that is capable of immense devastation. Use it with great care. You will have to manufacture the fusion balls to keep these MOBATs fully armed. A fusion ball is an intelligent guided weapon. In order to fire it you select a number of 'way points' with the cursor and then click on the launch icon to fire the fusion ball.
  STR_HEAVY_PLASMA_CLIP_UFOPEDIA: This compact device is used as ammunition for a Heavy Pulse Gun. It contains a small quantity of Cobranium.
  STR_PLASMA_RIFLE_CLIP_UFOPEDIA: This small object is used as a power source for a Pulse Rifle - a medium powered Cobra weapon. Contains a small quantity of Cobranium.
  STR_PLASMA_PISTOL_CLIP_UFOPEDIA: Power source for the small Cobra Pulse Pistol. Contains Cobranium - the source of all Cobra power.
  STR_STUN_BOMB_UFOPEDIA: The Stun Bomb is used for capturing live human specimens, but it can also be used against most Cobra races. It is fired from a Small Launcher.
  STR_ALIEN_RESEARCH_UFOPEDIA: The Cobra research mission is used for collecting basic data on earth and its inhabitants. Small vehicles are predominantly used, with occasional landings in deserted areas. This type of Cobra activity poses the least threat to G.I. Joe, with little concern from governments or the public.
  STR_ALIEN_HARVEST_UFOPEDIA: The Cobra troops have many uses for earth's fauna. Animals are abducted secretly, and returned with various organs removed. Cattle mutilations are predominantly reported along with Cobra craft sightings. This type of Cobra activity causes great concern for governments and considerable anxiety amongst the population. This type of activity occurs mainly in farming land. The theory behind the 'Cobra harvest' suggests that Cobra races originally 'seeded' the planet with its flora and fauna, and now they have returned to reap the harvest they have sown.
  STR_ALIEN_ABDUCTION_UFOPEDIA: This is the most insidious form of Cobra activity. The abduction by Cobra troops is widely reported, despite the Cobra troops' attempts to erase the experience from their victims' memories. Abductees report being subject to humiliating physical examinations, including impregnation of Cobra foetuses and bizarre genetic experiments. The purpose behind this activity appears to be linked to genetic mutation and manipulation of the Cobra troops' own genetic material. This activity causes great alarm, and occurs in populated areas or cities
  STR_ALIEN_INFILTRATION_UFOPEDIA: Earth governments can be infiltrated by Cobra agents which are human in appearance. This can result in official contact between Cobra troops and governments at the highest level. The climax of this activity is characterised by intense Cobra craft activity in the vicinity of major cities. The Cobra troops will attempt to sign a pact with an earth government by offering knowledge of their superior technology. In return the government will allow the Cobra troops to conduct their activity unhindered. This Cobra mission represents the worst threat to G.I. Joe. If a government agrees to a pact then its funding will cease.
  STR_ALIEN_BASE_UFOPEDIA: Cobra troops will construct secret underground bases in remote locations. After some initial reconnaissance flights some intense Cobra craft activity will occur as the base is being built. These bases are known to contain experimental labs for human abductees, and supplies for further activity in the region. The presence of Cobra bases will generate a large amount of reported Cobra activity without the presence of Cobra craft. In order to locate a base a G.I. Joe craft must patrol an area for a few hours to stand some chance of detection.
  STR_ALIEN_TERROR_UFOPEDIA: When the Cobra troops terrorise a city they will deploy some special forces with awesome powers. Civilians will be directly threatened, and governments will be forced to evacuate whole areas. The main purpose behind this activity is to generate sufficient public hysteria so that governments will threaten the G.I. Joe project.
  STR_ALIEN_RETALIATION_UFOPEDIA: If G.I. Joe interceptors are being particularly successful in shooting down Cobra craft then the Cobra troops may take some retaliatory action. This could result in a direct attack against a G.I. Joe base. However, the Cobra troops have to find a G.I. Joe base in order to attack it, and provided Cobra craft are kept away then there should be little danger of an assault.
  STR_ALIEN_SUPPLY_UFOPEDIA: Once an Terror Drome is constructed then it is resupplied on a regular basis by a special supply vessel. If one of these vessels is detected while landing then it is certain that an Terror Drome is nearby.
  STR_SMALL_SCOUT_UFOPEDIA: This tiny craft is primarily used for reconnaissance or research. It normally precedes larger vessels at the start of a Cobra mission.
  STR_LARGE_SCOUT_UFOPEDIA: The largest Cobra scout craft is a general purpose vessel that is used in all types of Cobra mission.
  STR_TERROR_SHIP_UFOPEDIA: The terror ship has a containment facility for large Cobra terror weapons or creatures. It is used to transport these Cobra terrorists into populated areas.
  STR_BATTLESHIP_UFOPEDIA: The battleship is the largest and most powerful Cobra craft. It is normally the primary Cobra mission craft, equipped with powerful weapons and numerous crew members.
  STR_SUPPLY_SHIP_UFOPEDIA: The supply vessel is used during the construction of Cobra bases or for supplying existing bases. It carries Cobra food containers and reproduction chambers.
