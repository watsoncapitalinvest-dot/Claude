en-US:
  STR_ART_SECTION_JOES: "G.I. Joe Team"
  STR_ART_SECTION_COBRA: "Cobra Command"
  STR_ART_SECTION_DREADNOKS: "Dreadnoks"
  STR_ART_SECTION_IRON_GRENADIERS: "Iron Grenadiers"
  STR_ART_SECTION_ENEMY_TROOPS: "Enemy Troop Types"
  STR_ART_BREAKER: "Breaker"
  STR_ART_BREAKER_TEXT: "BREAKER{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Alvin R. Kibbey{NEWLINE}Specialty: Communications; Computer technology; Infantry{NEWLINE}Birthplace: Gatlinburg, Tennessee{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Breaker is the reason the team can talk to itself. Raised in the Smoky Mountains, he learned radios by taking them apart until they gave up their secrets. In the field he carries the squad's link to command, air cover and artillery, and he can pull a Cobra transmission out of static before the enemy knows anyone is listening. He chews gum through firefights and treats a jammed frequency as a personal insult.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rifle and radio{NEWLINE}Signature move: Intercept: reveals every Cobra on the map for one turn{NEWLINE}{NEWLINE}\"If they're talking, I'm listening.\""
  STR_ART_CLUTCH: "Clutch"
  STR_ART_CLUTCH_TEXT: "CLUTCH{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Lance J. Steinberg{NEWLINE}Specialty: Motor vehicles; Transport{NEWLINE}Birthplace: Asbury Park, New Jersey{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Clutch can make anything with an engine go faster than it was built to, and he will tell you so. A Jersey Shore mechanic with a quick mouth and quicker hands, he drives the team's light vehicles like he stole them, and given five minutes alone with a Cobra one, he will. Officers find him exhausting. Drivers who ride with him come back with stories.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm{NEWLINE}Signature move: Hot-Wire: steals a Cobra vehicle{NEWLINE}{NEWLINE}\"Keys are optional.\""
  STR_ART_FLASH: "Flash"
  STR_ART_FLASH_TEXT: "FLASH{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Anthony S. Gambello{NEWLINE}Specialty: Laser weapons; Infantry; Electronics{NEWLINE}Birthplace: Lodi, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Flash was fixing circuit boards while other recruits were learning to lace boots. He carries the team's first working laser rifle, a heavy, power-hungry prototype he keeps alive with spare parts and stubbornness. Calm and methodical, he thinks of a firefight as a wiring problem: find the fault, isolate it, burn it out. When Cobra hides behind armor, Flash is the answer.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: XMLR-1A laser rifle{NEWLINE}Signature move: Overcharge: laser shot that burns through any plating{NEWLINE}{NEWLINE}\"Light travels faster than excuses.\""
  STR_ART_GRAND_SLAM: "Grand Slam"
  STR_ART_GRAND_SLAM_TEXT: "GRAND SLAM{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: James J. Barney{NEWLINE}Specialty: Artillery; Electronics engineering{NEWLINE}Birthplace: Chippewa Falls, Wisconsin{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Grand Slam is a gunner who wanted to be closer to the action than his guns allowed, so he strapped on a jet pack. An artillery man and electronics engineer from the Wisconsin north woods, he flies the experimental J.U.M.P. platform and fires its laser from the air. He is steady, practical and slightly too fond of altitude.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Laser rifle{NEWLINE}Signature move: Jump Strike: J.U.M.P. jet-pack hop across the map, firing his laser on landing{NEWLINE}{NEWLINE}\"Range is just a question of how far you jump.\""
  STR_ART_GRUNT: "Grunt"
  STR_ART_GRUNT_TEXT: "GRUNT{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Robert W. Graves{NEWLINE}Specialty: Infantry; Small arms armor; Artillery coordination{NEWLINE}Birthplace: Columbus, Ohio{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Grunt is the soldier every other soldier is measured against. A college-educated infantryman who chose the ranks over a commission, he knows every weapon in the armory and every regulation in the book, and he would rather fix a problem than complain about it. He is the man who holds the line when the plan falls apart.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-16 rifle{NEWLINE}Signature move: Covering Fire: reaction fire for the whole squad{NEWLINE}{NEWLINE}\"Somebody has to stay. Might as well be me.\""
  STR_ART_HAWK: "Hawk"
  STR_ART_HAWK_TEXT: "HAWK{NEWLINE}G.I. Joe - O-6 Colonel (1982),; O-7 Brigadier General (1986),; O-8 Major General (1992){NEWLINE}Real name: Clayton M. Abernathy{NEWLINE}Specialty: G.I. Joe commander; Artillery; Radar{NEWLINE}Birthplace: Denver, Colorado{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Hawk commands G.I. Joe with a calm that hides a fierce tactical mind. An air defense officer by training, he built the team around a simple idea: the best in every specialty, under one roof, answering to one chain of command. He knows every Joe by name and every loss by heart. When he takes the field himself, it is because there is no one else he would send.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-16 rifle and M1911A1 pistol{NEWLINE}Signature move: Fire Mission: calls an M.M.S. missile strike{NEWLINE}{NEWLINE}\"I don't send anyone where I wouldn't go.\""
  STR_ART_ROCK_N_ROLL: "Rock 'n Roll"
  STR_ART_ROCK_N_ROLL_TEXT: "ROCK 'N ROLL{NEWLINE}G.I. Joe - Sergeant First Class (E-7){NEWLINE}Real name: Craig S. McConnel{NEWLINE}Specialty: Machine Gunner; Infantry; PT Instructor{NEWLINE}Birthplace: Malibu, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Rock 'n Roll carries the heaviest gun in the squad and makes it look easy. A Malibu surfer with a physical trainer's build, he handles a belt-fed machine gun the way other men handle a rifle. He sets up, he lays down fire, and Cobra stops moving. Off duty he is the loudest laugh in the barracks.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-60 machine gun{NEWLINE}Signature move: Rock and Roll: sustained fire over two turns{NEWLINE}{NEWLINE}\"Turn it up.\""
  STR_ART_SCARLETT: "Scarlett"
  STR_ART_SCARLETT_TEXT: "SCARLETT{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Shana M. O'Hara{NEWLINE}Specialty: Counter intelligence{NEWLINE}Birthplace: Atlanta, Georgia{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Scarlett is the team's counter-intelligence officer, and she is very good at being underestimated. A martial artist and analyst from Atlanta, she reads people and documents with the same speed, and her crossbow puts a bolt where a bullet would make too much noise. She plans carefully, fights decisively, and is usually two moves ahead of whoever thinks they are leading.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: XK-1 power crossbow{NEWLINE}Signature move: Triple Bolt: three silent bolts at up to three targets{NEWLINE}{NEWLINE}\"Never mistake quiet for harmless.\""
  STR_ART_SHORT_FUZE: "Short-Fuze"
  STR_ART_SHORT_FUZE_TEXT: "SHORT-FUZE{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: Eric W. Freistadt{NEWLINE}Specialty: Mortar; Artillery; Infantry engineering{NEWLINE}Birthplace: Chicago, Illinois{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Short-Fuze runs the mortar, and he does the math in his head before the tube is level. A Chicago engineer with an artilleryman's patience, he can drop a round over a wall and into a courtyard he has never seen. He is meticulous, a little nervous, and absolutely certain of his firing tables.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-1 81mm mortar{NEWLINE}Signature move: Walking Barrage: three mortar rounds along a line of tiles in one turn{NEWLINE}{NEWLINE}\"Elevation's set. Give me a target.\""
  STR_ART_SNAKE_EYES: "Snake Eyes"
  STR_ART_SNAKE_EYES_TEXT: "SNAKE EYES{NEWLINE}G.I. Joe - Master Sergeant (E-8){NEWLINE}Real name: Classified{NEWLINE}Specialty: Infantry, hand-to-hand combat instructor{NEWLINE}Birthplace: Classified{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Snake Eyes says nothing, and the team has stopped asking why. A commando of extraordinary skill, he moves like a shadow, fights with sword and submachine gun alike, and works best alone with his wolf, Timber. His past is classified and his face is hidden. Everyone who has fought beside him trusts him without reservation.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Mini-Uzi and sword{NEWLINE}Signature move: Shadow Strike: he and Timber attack unseen in one turn; player chooses Timber's target (same or different){NEWLINE}{NEWLINE}\"...\""
  STR_ART_STALKER: "Stalker"
  STR_ART_STALKER_TEXT: "STALKER{NEWLINE}G.I. Joe - Sergeant Major (E-9){NEWLINE}Real name: Lonzo R. Wilkinson{NEWLINE}Specialty: Ranger, Squad commander{NEWLINE}Birthplace: Detroit, Michigan{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Stalker is a Ranger squad leader from Detroit who learned early that the toughest neighborhoods teach the best tactics. He leads from the front, speaks several languages, and knows how to make a small team hit like a large one. Cobra's worst moments usually begin with Stalker's squad already in position.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-32 \"Pulverizer\" submachine gun{NEWLINE}Signature move: Ranger Ambush: squad fires first in the first turn{NEWLINE}{NEWLINE}\"We were here first.\""
  STR_ART_STEELER: "Steeler"
  STR_ART_STEELER_TEXT: "STEELER{NEWLINE}G.I. Joe - First Lieutenant (O-2){NEWLINE}Real name: Ralph W. Pulaski{NEWLINE}Specialty: Tank commander; Armor; Artillery; Transportation{NEWLINE}Birthplace: Pittsburgh, Pennsylvania{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Steeler commands armor and thinks like a chess player. A Pittsburgh engineer's son with a mind for mechanics and maneuver, he treats a tank as a moving fortress and a battlefield as a board to be cleared. He is serious, precise, and never fires without a solution.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Mini-Uzi{NEWLINE}Signature move: Point Blank: tank shot that cannot miss{NEWLINE}{NEWLINE}\"One round, one result.\""
  STR_ART_ZAP: "Zap"
  STR_ART_ZAP_TEXT: "ZAP{NEWLINE}G.I. Joe - Corporal (E-4); Staff Sergeant (E-6); Staff Sergeant (E-7){NEWLINE}Real name: Rafael J. Melendez{NEWLINE}Specialty: Primary: Engineer; Combat Engineer; Anti-Armor Specialist; Secondary: Infantry; Artillery; Combat Engineer{NEWLINE}Birthplace: New York City, New York{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Zap is the team's bazooka man and its demolition expert, a combat engineer who believes most obstacles are best removed entirely. Raised in New York, he studies structures the way a doctor studies anatomy: he knows exactly where one rocket will bring a bunker down. He is cheerful about it.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Bazooka{NEWLINE}Signature move: Bunker Buster: rocket that destroys a wall section and everyone behind it is exposed{NEWLINE}{NEWLINE}\"That wall had it coming.\""
  STR_ART_ACE: "Ace"
  STR_ART_ACE_TEXT: "ACE{NEWLINE}G.I. Joe - Captain (O-3){NEWLINE}Real name: Brad J. Armbruster{NEWLINE}Specialty: Jet fighter pilot{NEWLINE}Birthplace: Providence, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Ace is the best fighter pilot the team has, and the only one who flies like he is playing cards. Cool, cocky and precise, he treats a dogfight as a game of nerve and odds, and he rarely loses. On the ground he is relaxed to the point of lazy. In the air he is something else.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm{NEWLINE}Signature move: Ace Maneuver: dodges every shot in one dogfight round{NEWLINE}{NEWLINE}\"Deal me in.\""
  STR_ART_AIRBORNE: "Airborne"
  STR_ART_AIRBORNE_TEXT: "AIRBORNE{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Franklin E. Talltree{NEWLINE}Specialty: Airborne infantry; Helicopter gunship gunner{NEWLINE}Birthplace: Navajo Reservation, Arizona{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Airborne is the first boot on the ground, dropped from altitude into places no one else can reach. A Navajo paratrooper and helicopter assault specialist, he is quiet, steady and impossible to rattle, and he lands ready to fight. Where the team needs a foothold behind Cobra's lines, Airborne makes one.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: XM-16 attack rifle with bayonet (CAR-15){NEWLINE}Signature move: Drop In: paradrop next to any Cobra unit{NEWLINE}{NEWLINE}\"Look up.\""
  STR_ART_COVER_GIRL: "Cover Girl"
  STR_ART_COVER_GIRL_TEXT: "COVER GIRL{NEWLINE}G.I. Joe - Specialist (E-4){NEWLINE}Real name: Courtney A. Krieger{NEWLINE}Specialty: Armor; AFV Mechanics{NEWLINE}Birthplace: Peoria, Illinois{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Cover Girl drives the Wolverine missile tank, and she knows armor down to the last bolt. A former model who traded the camera for a turret, she is tired of being judged by her face and very happy to be judged by her gunnery. Cobra pilots learn that lesson quickly.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Ripple Fire: her Wolverine fires every missile in one turn{NEWLINE}{NEWLINE}\"Smile for the targeting camera.\""
  STR_ART_DOC: "Doc"
  STR_ART_DOC_TEXT: "DOC{NEWLINE}G.I. Joe - Captain (O-3){NEWLINE}Real name: Carl W. Greer{NEWLINE}Specialty: Medical doctor{NEWLINE}Birthplace: Concord, Massachusetts{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Doc is the team's physician, and he does not carry a gun. A Boston-area surgeon who serves by healing rather than killing, he runs to the wounded under fire with a stretcher and a flare launcher and refuses to be talked out of it. Every Joe in the field is braver because Doc is behind them.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rescue flare launcher (non-lethal) and stretcher{NEWLINE}Signature move: Field Surgery: fully revives a downed Joe{NEWLINE}{NEWLINE}\"Stay down. I'm coming to you.\""
  STR_ART_DUKE: "Duke"
  STR_ART_DUKE_TEXT: "DUKE{NEWLINE}G.I. Joe - Master Sergeant (E-8); Acting First Sergeant{NEWLINE}Real name: Conrad S. Hauser{NEWLINE}Specialty: G.I. Joe field commander and first sergeant{NEWLINE}Birthplace: St. Louis, Missouri{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Duke is the team's field commander and its first sergeant, the man who turns Hawk's plans into moving squads. Tough, fair and direct, he speaks several languages, trained special forces abroad, and leads by being the first one through the door. His people would follow him anywhere, and often have.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-32 submachine gun and binoculars{NEWLINE}Signature move: Yo Joe!: every Joe in sight gets extra movement this turn{NEWLINE}{NEWLINE}\"Yo Joe! On me!\""
  STR_ART_GUNG_HO: "Gung-Ho"
  STR_ART_GUNG_HO_TEXT: "GUNG-HO{NEWLINE}G.I. Joe - Sergeant Major (E-9){NEWLINE}Real name: Ettienne R. LaFitte{NEWLINE}Specialty: Recondo; Jungle Warfare training{NEWLINE}Birthplace: Fer-de-Lance, Louisiana{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Gung-Ho is a Marine from the Louisiana bayou who believes there is no problem a frontal assault can't solve. Loud, fearless and loyal to the bone, he carries a grenade launcher and the kind of confidence that makes nervous recruits stand up straighter. He has never seen a fight he didn't want to be first into.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: XM-76 grenade launcher{NEWLINE}Signature move: Marine Charge: charges and fires without penalty{NEWLINE}{NEWLINE}\"Charge! Then charge again!\""
  STR_ART_SNOW_JOB: "Snow Job"
  STR_ART_SNOW_JOB_TEXT: "SNOW JOB{NEWLINE}G.I. Joe - Sergeant First Class (E-7){NEWLINE}Real name: Harlan W. Moore{NEWLINE}Specialty: Cold weather combat; Ski patrol; Rifle instructor{NEWLINE}Birthplace: Rutland, Vermont{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Snow Job is a ski trooper and rifle instructor from Vermont who fights best when the weather is at its worst. He carries an arctic laser rifle and moves across snow faster than most men walk on pavement. Off duty he is a schemer and a card sharp. On a glacier he is all business.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: XMLR-3A laser rifle and skis{NEWLINE}Signature move: Avalanche: laser shot that triggers snow collapse on Cobra{NEWLINE}{NEWLINE}\"Cold doesn't slow me down. It slows you down.\""
  STR_ART_TORPEDO: "Torpedo"
  STR_ART_TORPEDO_TEXT: "TORPEDO{NEWLINE}G.I. Joe - Warrant Officer (W-4){NEWLINE}Real name: Edward W. Leialoha{NEWLINE}Specialty: S.E.A.L.; Demolitions{NEWLINE}Birthplace: Aiea, Hawaii{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Torpedo is a Navy SEAL from Hawaii who is more comfortable underwater than on land. A demolitions diver and harbor specialist, he swims into places Cobra thought were safe and leaves them in pieces. He is calm, patient and bone-dry in his humor.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Harpoon rifle{NEWLINE}Signature move: Underwater Demolition: destroys a boat or dock in one action{NEWLINE}{NEWLINE}\"See you on the bottom.\""
  STR_ART_TRIPWIRE: "Tripwire"
  STR_ART_TRIPWIRE_TEXT: "TRIPWIRE{NEWLINE}G.I. Joe - Specialist (E-4){NEWLINE}Real name: Tormod S. Skoog{NEWLINE}Specialty: Explosive ordnance disposal; Demolitions{NEWLINE}Birthplace: Hibbing, Minnesota{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Tripwire defuses Cobra's bombs and lays his own, and he is nervous about both. An explosives ordnance specialist from Minnesota, he is clumsy everywhere except where it counts: with his hands on a fuse, he is perfectly steady. The team jokes about him. The team also lets him walk first.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Land mines and mine detector{NEWLINE}Signature move: Minefield: lays mines across a corridor in one action{NEWLINE}{NEWLINE}\"Everybody freeze. No, really.\""
  STR_ART_WILD_BILL: "Wild Bill"
  STR_ART_WILD_BILL_TEXT: "WILD BILL{NEWLINE}G.I. Joe - Chief Warrant Officer (W-4){NEWLINE}Real name: William S. Hardy{NEWLINE}Specialty: Helicopter pilot; Fixed-wing pilot; Aircraft armor; Air Cavalry{NEWLINE}Birthplace: Brady, Texas{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Wild Bill flies helicopters like he is still riding horses on a Texas ranch. A veteran pilot with a cowboy hat, a slow drawl and a steady hand, he brings the Dragonfly in low and close, and he never leaves a man on the ground. He has seen more combat than anyone on the team and talks about it least.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Colt revolver{NEWLINE}Signature move: Gun Run: his Dragonfly strafes a straight line, hitting everything in it{NEWLINE}{NEWLINE}\"Hang on to your hat.\""
  STR_ART_BLOWTORCH: "Blowtorch"
  STR_ART_BLOWTORCH_TEXT: "BLOWTORCH{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: Timothy P. Hanrahan{NEWLINE}Specialty: Flamethrower; Infantry; Special weapons; Small-arms armorer{NEWLINE}Birthplace: Tampa, Florida{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Blowtorch carries the flamethrower, and he respects it more than any man alive. An Irish-born specialist in fire and special weapons, he is careful, deliberate and safety-minded, which is exactly why he is allowed near the thing. When Cobra digs in, Blowtorch clears them out.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Flamethrower{NEWLINE}Signature move: Inferno: sets a whole room ablaze{NEWLINE}{NEWLINE}\"Fire doesn't take sides. I do.\""
  STR_ART_CUTTER: "Cutter"
  STR_ART_CUTTER_TEXT: "CUTTER{NEWLINE}G.I. Joe - Lieutenant Junior Grade (O-2){NEWLINE}Real name: Ronald \"Skip\" A. Stone{NEWLINE}Specialty: Hovercraft captain; Aquatic vehicles operation; Special services{NEWLINE}Birthplace: Kinsley, Kansas{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Cutter captains the Killer W.H.A.L.E. hovercraft and treats it with the affection other men reserve for family. A Kansas farm boy who fell in love with the sea, he runs amphibious landings with a sailor's ease and a mechanic's eye. He talks to his boat. The boat seems to listen.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: BM-201 boarding rifle{NEWLINE}Signature move: Full Throttle: his hovercraft moves double and drops troops anywhere along its path{NEWLINE}{NEWLINE}\"Hold on, we're going ashore.\""
  STR_ART_DEEP_SIX: "Deep Six"
  STR_ART_DEEP_SIX_TEXT: "DEEP SIX{NEWLINE}G.I. Joe - Chief Petty Officer (E-7){NEWLINE}Real name: Malcolm R. Willoughby{NEWLINE}Specialty: Deep sea diver; Underwater demolitions; Motorized craft pilot{NEWLINE}Birthplace: Baltimore, Maryland{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Deep Six works in the dark at the bottom of the sea, and he likes it there. A deep-sea diver and underwater demolitions specialist, he spends long missions alone in heavy suits and comes up quieter than he went down. He is the man to send when the target is below the waterline.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Spear gun{NEWLINE}Signature move: Deep Dive: in water he and nearby divers vanish from Cobra sight until they attack{NEWLINE}{NEWLINE}\"It's peaceful down there. Until I get to work.\""
  STR_ART_MUTT_AND_JUNKYARD: "Mutt and Junkyard"
  STR_ART_MUTT_AND_JUNKYARD_TEXT: "MUTT AND JUNKYARD{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Stanley R. Perlmutter{NEWLINE}Specialty: Animal control and utilization; Infantry; Covert operations{NEWLINE}Birthplace: Iselin, New Jersey{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Mutt is a military police dog handler with a short fuse and a long memory, and Junkyard is the rottweiler who goes everywhere he does. Together they track, chase and take down Cobra troopers who thought they had escaped. Mutt trusts animals more than people. Junkyard trusts only Mutt.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Suppressed MAC-11 and night stick, with Junkyard{NEWLINE}Signature move: Sic 'Em: Junkyard charges a Cobra, pins him and knocks his weapon away{NEWLINE}{NEWLINE}\"Junkyard. Fetch.\""
  STR_ART_RECONDO: "Recondo"
  STR_ART_RECONDO_TEXT: "RECONDO{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Daniel M. LeClaire{NEWLINE}Specialty: Jungle warfare; Infantry; Intelligence{NEWLINE}Birthplace: Wheaton, Wisconsin{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Recondo is a jungle fighter who hates cities, crowds and air conditioning. A long-range reconnaissance specialist from Wisconsin, he spends weeks in the bush and comes back knowing exactly where Cobra is hiding. He is gruff, solitary and unbeatable under a canopy.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-1 4E2X rifle{NEWLINE}Signature move: Jungle Ghost: invisible in jungle for a turn{NEWLINE}{NEWLINE}\"The jungle's on my side.\""
  STR_ART_RIPCORD: "Ripcord"
  STR_ART_RIPCORD_TEXT: "RIPCORD{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Wallace A. Weems{NEWLINE}Specialty: High altitude low opening paratrooper; Airborne infantry; Demolitions{NEWLINE}Birthplace: Columbus, Ohio{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Ripcord is a high-altitude jumper who opens his parachute later than anyone else would dare. A paratrooper and demolitions man from Ohio, he drops into the hardest places to reach and starts work before Cobra hears the plane. He is a romantic, a talker, and very hard to kill.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: SLR-W1L1 rifle with sight{NEWLINE}Signature move: HALO Drop: drops onto any open tile on the map from the air{NEWLINE}{NEWLINE}\"Last one out of the plane buys dinner.\""
  STR_ART_ROADBLOCK: "Roadblock"
  STR_ART_ROADBLOCK_TEXT: "ROADBLOCK{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: Marvin F. Hinton{NEWLINE}Specialty: Infantry; Heavy Weapons; Cook{NEWLINE}Birthplace: Biloxi, Mississippi{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Roadblock carries a heavy machine gun most men can't lift and cooks for the whole team when the shooting stops. A Mississippi heavy weapons man who dreams of running a restaurant, he is gentle, funny and immovable in a fight. When Roadblock sets up, Cobra goes somewhere else.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-2 .50 cal machine gun on tripod{NEWLINE}Signature move: Full Belt: pins every Cobra in an area{NEWLINE}{NEWLINE}\"Dinner's at six. This won't take long.\""
  STR_ART_SPIRIT_AND_FREEDOM: "Spirit and Freedom"
  STR_ART_SPIRIT_AND_FREEDOM_TEXT: "SPIRIT AND FREEDOM{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: Charlie Iron-Knife{NEWLINE}Specialty: Tracking; Infantry; Social Services{NEWLINE}Birthplace: Taos, New Mexico{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Spirit is a tracker and scout from the high desert of New Mexico, and Freedom is the bald eagle who scouts from above. Patient and observant, Spirit reads ground the way others read print, and his arrow launcher hits silently. Freedom sees what no one else can. Between them, nothing hides for long.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Auto-arrow launcher, with Freedom{NEWLINE}Signature move: Eagle Eye: Freedom reveals every Cobra in a wide area for two turns{NEWLINE}{NEWLINE}\"Freedom sees. I follow.\""
  STR_ART_THUNDER: "Thunder"
  STR_ART_THUNDER_TEXT: "THUNDER{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Matthew Harris Breckenridge{NEWLINE}Specialty: Artillery; Bandsman{NEWLINE}Birthplace: Louisville, Kentucky{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Thunder runs the team's self-propelled artillery and plays music in the off hours, and he has strong opinions about both. A Kentucky gunner with a perfect ear for timing, he puts heavy shells exactly where they are called for. He considers a well-placed barrage a kind of composition.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Fire for Effect: his Slugger shells a large area twice{NEWLINE}{NEWLINE}\"Listen for the downbeat.\""
  STR_ART_AIRTIGHT: "Airtight"
  STR_ART_AIRTIGHT_TEXT: "AIRTIGHT{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Kurt Schnurr{NEWLINE}Specialty: Hostile environment; Chemical, biological and radiological warfare; Ordnance{NEWLINE}Birthplace: New Haven, Connecticut{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Airtight is the team's hostile environment specialist: chemical, biological, toxic. A Connecticut-born scientist in a sealed suit, he walks calmly into places that would kill anyone else and measures what is killing them. He is precise to the point of fussiness, and that is exactly what keeps him alive.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm and sniffer{NEWLINE}Signature move: Seal the Area: clears gas and toxic clouds in a radius and protects nearby Joes for three turns{NEWLINE}{NEWLINE}\"Breathe through your nose. Actually, don't breathe.\""
  STR_ART_ALPINE: "Alpine"
  STR_ART_ALPINE_TEXT: "ALPINE{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Albert M. Pine{NEWLINE}Specialty: Mountain trooper; Finance clerk{NEWLINE}Birthplace: Minidoka, Idaho{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Alpine is a mountain trooper from Idaho who would rather climb a cliff than take the trail. With a grappling launcher and a submachine gun, he scales walls and peaks that Cobra assumed no one could reach. He is cheerful, reckless and most comfortable a long way up.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Beretta SMG-12 and grappling launcher{NEWLINE}Signature move: Grapple Line: scales any cliff or wall in one move and leaves a line the squad can use{NEWLINE}{NEWLINE}\"The view's better from the top.\""
  STR_ART_BARBECUE: "Barbecue"
  STR_ART_BARBECUE_TEXT: "BARBECUE{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Gabriel A. Kelly{NEWLINE}Specialty: Firefighting; Infantry{NEWLINE}Birthplace: Boston, Massachusetts{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Barbecue is a firefighter who joined G.I. Joe to fight bigger fires. A Boston smoke-eater with an axe and a foam gun, he puts out what Cobra sets alight and chops through what Cobra locks. He is good-natured, loud and fearless around flame.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Fire axe and foam nozzle gun{NEWLINE}Signature move: Firebreak: puts out all fire in a large area; his axe breaks a door or wall instantly{NEWLINE}{NEWLINE}\"Where there's smoke, there's me.\""
  STR_ART_BAZOOKA: "Bazooka"
  STR_ART_BAZOOKA_TEXT: "BAZOOKA{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: David L. Katzenbogen{NEWLINE}Specialty: Anti-armor; Tank driver{NEWLINE}Birthplace: Hibbing, Minnessota{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Bazooka is a tank killer from Minnesota who is not the quickest thinker on the team but may be the most dependable shot. He carries a missile launcher and a cheerful outlook, and when Cobra's armor rolls out he makes sure it doesn't roll far. The others tease him. They also want him nearby.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M.A.T. missile launcher{NEWLINE}Signature move: Double Tap: two bazooka rockets in one turn{NEWLINE}{NEWLINE}\"Uh, which one do I hit first?\""
  STR_ART_CRANKCASE: "Crankcase"
  STR_ART_CRANKCASE_TEXT: "CRANKCASE{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Elwood G. Indiana{NEWLINE}Specialty: Motor vehicles; Armor{NEWLINE}Birthplace: Lawrence, Kansas{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Crankcase drives the A.W.E. Striker and treats rough terrain as a personal challenge. A Kansas mechanic with a Galil rifle and a heavy foot, he can take a light vehicle over ground that should have stopped it. He is easygoing until someone touches his engine.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Galil assault rifle{NEWLINE}Signature move: Jump the Line: his A.W.E. Striker triple-moves over obstacles, firing at the end{NEWLINE}{NEWLINE}\"If it's got wheels, it's got a way through.\""
  STR_ART_DUSTY: "Dusty"
  STR_ART_DUSTY_TEXT: "DUSTY{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Ronald W. Tadur{NEWLINE}Specialty: Desert warfare; Infantry; Refrigeration and air-conditioning{NEWLINE}Birthplace: Las Vegas, Nevada{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Dusty is a desert trooper from Las Vegas who knows the open sand like other men know their neighborhoods. Patient, sun-hardened and quietly sharp, he watches long horizons and picks off targets at ranges that seem unfair. He moves at night and disappears by day.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: FAMAS with bipod{NEWLINE}Signature move: Desert Ghost: in open or desert terrain unseen at range until he fires; first shot always hits{NEWLINE}{NEWLINE}\"The desert doesn't forgive. Neither do I.\""
  STR_ART_FLINT: "Flint"
  STR_ART_FLINT_TEXT: "FLINT{NEWLINE}G.I. Joe - Warrant Officer (W-2){NEWLINE}Real name: Dashiell R. Faireborn{NEWLINE}Specialty: Infantry; Fixed wing pilot; Rotary wing aircraft pilot{NEWLINE}Birthplace: Wichita, Kansas{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Flint is a warrant officer, a Rhodes Scholar and a man who would rather kick a door in than talk about it. He leads raids with a shotgun and a sharp mind, plans like an officer and fights like a sergeant. Confident and quick, he is happiest in the first seconds of an assault.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Riot shotgun{NEWLINE}Signature move: Breach and Clear: clears a room in one action{NEWLINE}{NEWLINE}\"Doors are just suggestions.\""
  STR_ART_FOOTLOOSE: "Footloose"
  STR_ART_FOOTLOOSE_TEXT: "FOOTLOOSE{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Andrew D. Meyers{NEWLINE}Specialty: Infantry; Special services{NEWLINE}Birthplace: Gary, Indiana{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Footloose is an infantryman who can march farther than anyone on the team and still look relaxed at the end of it. Easygoing and philosophical, he carries a rifle and a rocket launcher across country without complaint. When everyone else is spent, Footloose is still walking.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-16 and M72 LAW{NEWLINE}Signature move: Second Wind: he and nearby Joes shake off fatigue and get extra movement this turn{NEWLINE}{NEWLINE}\"Plenty left in the tank.\""
  STR_ART_FROSTBITE: "Frostbite"
  STR_ART_FROSTBITE_TEXT: "FROSTBITE{NEWLINE}G.I. Joe{NEWLINE}Real name: Farley S. Seward{NEWLINE}Specialty: Motor vehicles; Armor{NEWLINE}Birthplace: Galena, Alaska{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Frostbite drives the Snow Cat and grew up in Alaska, where cold is not a condition but a way of life. Tough, plain-spoken and impossible to rattle, he takes heavy vehicles across ice that would swallow lesser drivers. He thinks Arctic warfare is the only kind worth having.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Scoped M-16{NEWLINE}Signature move: Twin Rockets: his Snow Cat launches both missile sleds at separate targets{NEWLINE}{NEWLINE}\"You're cold? This is nice weather.\""
  STR_ART_HEAVY_METAL: "Heavy Metal"
  STR_ART_HEAVY_METAL_TEXT: "HEAVY METAL{NEWLINE}G.I. Joe{NEWLINE}Real name: Sherman Guderian{NEWLINE}Specialty: Armor; Finance{NEWLINE}Birthplace: Brooklyn, New York{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Heavy Metal commands the Mauler tank and talks almost as loudly as it fires. A Brooklyn armor officer with a flair for showmanship, he loves big guns, fast tracks and an audience. Behind the bluster is a sharp tactician who knows exactly how to use the biggest weapon on the field.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Main Gun: his Mauler scores a guaranteed hit that ignores cover{NEWLINE}{NEWLINE}\"Make some noise!\""
  STR_ART_KEEL_HAUL: "Keel-Haul"
  STR_ART_KEEL_HAUL_TEXT: "KEEL-HAUL{NEWLINE}G.I. Joe - Rear Admiral (O-8){NEWLINE}Real name: Everett P. Colby{NEWLINE}Specialty: U.S.S. Flagg commander; Pilot{NEWLINE}Birthplace: Charlottesville, Virginia{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Keel-Haul commands the U.S.S. Flagg, the aircraft carrier that serves as the team's floating base. A Virginia naval officer of the old school, he runs his ship with discipline and his crew with pride. When his guns speak, the battle changes.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm{NEWLINE}Signature move: Fleet Support: naval gunfire on a target area if the Flagg or a TTBP is in range; otherwise a coastal battery strike{NEWLINE}{NEWLINE}\"All hands, battle stations.\""
  STR_ART_LADY_JAYE: "Lady Jaye"
  STR_ART_LADY_JAYE_TEXT: "LADY JAYE{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: Alison R. Hart-Burnett{NEWLINE}Specialty: Covert operations; Intelligence{NEWLINE}Birthplace: Martha's Vineyard, Massachusetts{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Lady Jaye is a covert operations specialist with a talent for accents, disguises and improvisation. A linguist and actress from Martha's Vineyard, she can pass for almost anyone, and her power javelin hits harder than it looks. She thinks fast, talks faster and never stays where Cobra expects.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Power javelin and surveillance camera{NEWLINE}Signature move: Javelin Volley: two javelins at different targets{NEWLINE}{NEWLINE}\"Darling, I'm whoever I need to be.\""
  STR_ART_QUICK_KICK: "Quick Kick"
  STR_ART_QUICK_KICK_TEXT: "QUICK KICK{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: MacArthur S. Ito{NEWLINE}Specialty: Silent weapons; Martial arts; Infantry; Intelligence{NEWLINE}Birthplace: Los Angeles, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Quick Kick is a martial artist and silent-weapons expert who fights in bare feet and quotes old movies between moves. A Los Angeles stuntman's son trained in several fighting styles, he takes down opponents without firing a shot. He is fast, funny and hard to pin down.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sword and nunchaku{NEWLINE}Signature move: Flurry: unarmed attacks on every adjacent Cobra{NEWLINE}{NEWLINE}\"Hands are faster than holsters.\""
  STR_ART_SGT_SLAUGHTER: "Sgt. Slaughter"
  STR_ART_SGT_SLAUGHTER_TEXT: "SGT. SLAUGHTER{NEWLINE}G.I. Joe - Gunnery Sergeant (E-7){NEWLINE}Real name: Classified{NEWLINE}Specialty: Drill instructor; Infantry; Survival training{NEWLINE}Birthplace: Parris Island, South Carolina{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Sgt. Slaughter is a drill instructor of legendary volume, and recruits who survive his course come out harder than they went in. He is a fierce, unbending soldier who believes in discipline, toughness and the people he trains. In the field he leads from the front and fears nothing.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Swagger stick and fists{NEWLINE}Signature move: Maggot!: every nearby Joe recovers and fights harder{NEWLINE}{NEWLINE}\"Get up, maggot! You're a Joe now!\""
  STR_ART_SHIPWRECK_AND_POLLY: "Shipwreck and Polly"
  STR_ART_SHIPWRECK_AND_POLLY_TEXT: "SHIPWRECK AND POLLY{NEWLINE}G.I. Joe - Chief Petty Officer (E-7){NEWLINE}Real name: Hector X. Delgado{NEWLINE}Specialty: Sailor; S.E.A.L.; Gunner's mate; Machinist{NEWLINE}Birthplace: Chula Vista, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Shipwreck is a sailor, a brawler and a born storyteller, and Polly is the foul-mouthed parrot who rides on his shoulder. A former navy gunner from San Diego, he swings into fights with a grin and a percussion pistol, and he can rig anything aboard a ship. Polly spots trouble. Shipwreck starts it.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Flintlock percussion pistol and boarding hook, with Polly{NEWLINE}Signature move: Polly Spots: reveals every Cobra within a wide radius for one turn{NEWLINE}{NEWLINE}\"Polly, keep an eye out. I'll keep a fist out.\""
  STR_ART_TOLLBOOTH: "Tollbooth"
  STR_ART_TOLLBOOTH_TEXT: "TOLLBOOTH{NEWLINE}G.I. Joe - Specialist (SP-5){NEWLINE}Real name: Chuck X. Goren{NEWLINE}Specialty: Combat engineering; Transportation{NEWLINE}Birthplace: Boise, Idaho{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Tollbooth builds bridges in the middle of firefights. A combat engineer from Idaho who runs the Toss 'n Cross, he can span a river or a ravine before Cobra realizes the team is crossing. He is methodical, cheerful and always measuring something.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rifle and demolition charges{NEWLINE}Signature move: Instant Bridge: spans a gap or river for the whole squad{NEWLINE}{NEWLINE}\"Toll's paid. Everybody across.\""
  STR_ART_BEACH_HEAD: "Beach Head"
  STR_ART_BEACH_HEAD_TEXT: "BEACH HEAD{NEWLINE}G.I. Joe - Staff Sergeant (E-6) later in comics Command Sergeant Major (E-9){NEWLINE}Real name: Wayne R. Sneeden{NEWLINE}Specialty: Ranger; Small-arms armorer{NEWLINE}Birthplace: Auburn, Alabama{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Beach Head is a Ranger and the team's toughest trainer, a man who treats physical fitness like a religion and laziness like a crime. Masked, gruff and relentless, he pushes Joes past their limits and expects them to thank him later. In combat he is everything he preaches.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: XF-7 Wasp submachine gun{NEWLINE}Signature move: Drill Instructor: unnamed Joes in sight act again{NEWLINE}{NEWLINE}\"Again. Faster.\""
  STR_ART_CLAYMORE: "Claymore"
  STR_ART_CLAYMORE_TEXT: "CLAYMORE{NEWLINE}G.I. Joe - Captain (O-3){NEWLINE}Real name: John Zullo{NEWLINE}Specialty: Covert operations; Anti-terrorism; Infantry; Martial arts{NEWLINE}Birthplace: Manchester, Vermont{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Claymore is a covert operations specialist so classified that even his teammates know almost nothing about him. He works alone, sets traps no one sees, and leaves before anyone knows he was there. The rest of the team suspects he prefers it that way.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Suppressed submachine gun{NEWLINE}Signature move: Booby Trap: a hidden mine Cobra can't see, set off by the first Cobra nearby{NEWLINE}{NEWLINE}\"You didn't see me.\""
  STR_ART_CROSS_COUNTRY: "Cross-Country"
  STR_ART_CROSS_COUNTRY_TEXT: "CROSS-COUNTRY{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Robert M. Blais{NEWLINE}Specialty: Armor; Heavy equipment; Transport{NEWLINE}Birthplace: Greensboro, North Carolina{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Cross-Country drives the H.A.V.O.C. and believes the shortest distance between two points is straight through whatever is in the way. A North Carolina heavy-equipment man with a strong accent and stronger opinions, he is loud, proud and very good at his job.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Ordnance Dump: his H.A.V.O.C. fires its whole missile rack across an area{NEWLINE}{NEWLINE}\"Ain't no road? Ain't no problem.\""
  STR_ART_DIAL_TONE: "Dial Tone"
  STR_ART_DIAL_TONE_TEXT: "DIAL TONE{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Jack S. Morelli{NEWLINE}Specialty: Telecommunications; Infantry{NEWLINE}Birthplace: Eugene, Oregon{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Dial Tone is a communications specialist who can patch a radio into anything and listen to everything. Talkative, inventive and easily bored, she keeps the team connected and Cobra's lines compromised. When the network goes down, she is the one who brings it back up.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Suppressed 9mm submachine pistol and radio pack{NEWLINE}Signature move: Call It In: off-map artillery or air strike anywhere he can see (basic mortar strike before support research){NEWLINE}{NEWLINE}\"Hold on, I'm putting you through.\""
  STR_ART_THE_FRIDGE: "The Fridge"
  STR_ART_THE_FRIDGE_TEXT: "THE FRIDGE{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: William Perry{NEWLINE}Specialty: Physical training instructor; Special services{NEWLINE}Birthplace: Aiken, South Carolina{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}The Fridge is a physical training instructor built like his name, and he brings a linebacker's instincts to close combat. Loud, good-humored and nearly unstoppable at a charge, he flattens Cobra troopers who get in his path and then helps them up to do it again.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Fists{NEWLINE}Signature move: Blitz: double-distance charge that tackles a Cobra, knocking him down and stunning him{NEWLINE}{NEWLINE}\"Hut! Hut! Hike!\""
  STR_ART_ICEBERG: "Iceberg"
  STR_ART_ICEBERG_TEXT: "ICEBERG{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Clifton L. Nash{NEWLINE}Specialty: Cold weather combat; Infantry; Survival instructor{NEWLINE}Birthplace: Brownsville, Texas{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Iceberg is a cold-weather soldier from Texas who loves snow because he never saw it as a child. Calm, steady and nearly impossible to tire, he carries a machine gun through blizzards and treats freezing nights as a pleasant change. Cold doesn't bother him. Very little does.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: XM60E3 machine gun{NEWLINE}Signature move: Whiteout: in snow he and nearby Joes are hidden; elsewhere a smoke screen{NEWLINE}{NEWLINE}\"Nice and brisk out here.\""
  STR_ART_LEATHERNECK: "Leatherneck"
  STR_ART_LEATHERNECK_TEXT: "LEATHERNECK{NEWLINE}G.I. Joe - Gunnery Sergeant (E-7){NEWLINE}Real name: Wendell A. Metzger{NEWLINE}Specialty: Infantry; Drill instructor{NEWLINE}Birthplace: Stromsburg, Nebraska{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Leatherneck is a Marine drill instructor who never lets anyone forget which service he came from. Gruff, competitive and loyal, he trades insults with the Army men on the team and would take a bullet for any of them. In the field he is a rock: steady under fire and relentless on the advance.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-16 with M-203 grenade launcher{NEWLINE}Signature move: Semper Fi: every Joe in sight shakes off panic and gets a free reaction shot this turn{NEWLINE}{NEWLINE}\"Marines don't retreat. We advance in another direction.\""
  STR_ART_LIFELINE: "Lifeline"
  STR_ART_LIFELINE_TEXT: "LIFELINE{NEWLINE}G.I. Joe{NEWLINE}Real name: Edwin C. Steen{NEWLINE}Specialty: Medic{NEWLINE}Birthplace: Seattle, Washington{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Lifeline is a rescue specialist who carries a medical kit and a pistol he would rather never draw. A pacifist by conviction and a hero by habit, he runs into fire to drag the wounded out. Cobra troopers who meet him are often surprised to be treated too.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Browning 9mm pistol (defensive only) and medical kit{NEWLINE}Signature move: Rescue Run: carries a downed Joe out of the map{NEWLINE}{NEWLINE}\"Everybody comes home.\""
  STR_ART_LIFT_TICKET: "Lift-Ticket"
  STR_ART_LIFT_TICKET_TEXT: "LIFT-TICKET{NEWLINE}G.I. Joe - Warrant Officer (W-2){NEWLINE}Real name: Victor W. Sikorski{NEWLINE}Specialty: Rotary wing aircraft; Fixed-wing aircraft{NEWLINE}Birthplace: Lawton, Oklahoma{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Lift-Ticket flies the Tomahawk helicopter and talks about flying almost as much as he does it. An Oklahoma pilot who can land in a clearing barely wider than his rotors, he brings troops in and gets the wounded out under fire. He loves his aircraft and complains about everything else.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm{NEWLINE}Signature move: Dust Off: lands and evacuates under fire{NEWLINE}{NEWLINE}\"Get in. Seriously, get in now.\""
  STR_ART_LOW_LIGHT: "Low-Light"
  STR_ART_LOW_LIGHT_TEXT: "LOW-LIGHT{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: Cooper G. MacBride{NEWLINE}Specialty: Night spotter; Infantry; Marksmanship instructor{NEWLINE}Birthplace: Crosby, North Dakota{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Low-Light is the team's night sniper, a farm boy from North Dakota who sees better in the dark than most men see at noon. Quiet and patient, he waits for hours behind a scope and takes one shot. He is uneasy in daylight and deadly after sunset.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Model 85 night-scope sniper rifle and Uzi{NEWLINE}Signature move: One Shot: guaranteed hit at night{NEWLINE}{NEWLINE}\"Lights out.\""
  STR_ART_MAINFRAME: "Mainframe"
  STR_ART_MAINFRAME_TEXT: "MAINFRAME{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Blaine L. Parker{NEWLINE}Specialty: Computer technology; Infantry{NEWLINE}Birthplace: Phoenix, Arizona{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Mainframe is a computer specialist and former Marine who can break into Cobra's networks faster than they can build them. Sharp-witted and slightly arrogant, he treats every security system as a puzzle set by an amateur. He is equally comfortable with a keyboard and a rifle.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm and field computer{NEWLINE}Signature move: Hack: takes over a Cobra turret, door or security system for three turns{NEWLINE}{NEWLINE}\"Access granted. Not that they granted it.\""
  STR_ART_SCI_FI: "Sci-Fi"
  STR_ART_SCI_FI_TEXT: "SCI-FI{NEWLINE}G.I. Joe - Specialist (E-4){NEWLINE}Real name: Seymour P. Fine{NEWLINE}Specialty: Laser weapons systems; Electronics; Infantry{NEWLINE}Birthplace: Geraldine, Montana{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Sci-Fi carries a heavy laser and thinks in terms of energy, focus and heat. A Montana physicist turned soldier, he is enthusiastic, distractible and brilliant, and he tends to explain how his weapon works while firing it. When it hits, it hits through almost anything.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: XH86 LLOM beam laser rifle{NEWLINE}Signature move: Full Power: laser shot that burns through cover and armor in a line{NEWLINE}{NEWLINE}\"It's just light. Very angry light.\""
  STR_ART_SLIP_STREAM: "Slip-Stream"
  STR_ART_SLIP_STREAM_TEXT: "SLIP-STREAM{NEWLINE}G.I. Joe - First Lieutenant (O-2){NEWLINE}Real name: Gregory B. Boyajian{NEWLINE}Specialty: Fighter pilot; Computer technology{NEWLINE}Birthplace: Provo, Utah{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Slip-Stream flies the Conquest jet and treats airspeed as the answer to every question. A Utah pilot and computer whiz, he is cocky, quick and genuinely talented. He rarely stays in one patch of sky long enough to be hit.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm{NEWLINE}Signature move: Strafing Pass: the Conquest makes one pass over the battle if available{NEWLINE}{NEWLINE}\"Too slow.\""
  STR_ART_WET_SUIT: "Wet Suit"
  STR_ART_WET_SUIT_TEXT: "WET SUIT{NEWLINE}G.I. Joe{NEWLINE}Real name: Brian M. Forrest{NEWLINE}Specialty: SEAL; Underwater demolitions{NEWLINE}Birthplace: Myrtle Beach, South Carolina{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Wet Suit is a SEAL from South Carolina who considers dry land an inconvenience. Brash, competitive and always looking for a fight with Cobra's frogmen, he strikes from the water and vanishes back into it. He thinks Torpedo is too cautious.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Spear gun and sea sled{NEWLINE}Signature move: Hit and Run: surfaces, attacks and submerges again in one turn{NEWLINE}{NEWLINE}\"Water's fine. Come on in.\""
  STR_ART_AVALANCHE: "Avalanche"
  STR_ART_AVALANCHE_TEXT: "AVALANCHE{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Ian M. Costello{NEWLINE}Specialty: Armored vehicle driver; Cold weather survival{NEWLINE}Birthplace: Madawask, Maine{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Avalanche drives the Dominator snow tank and grew up on the Canadian border, where winter takes up most of the year. Steady and practical, he rams through ice and drifts that would stop a lighter vehicle. Cold-weather missions are his favorite kind.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: P-480 sub-zero stun gun{NEWLINE}Signature move: Snowplow: his Dominator rams through snow and ice, burying Cobra in its path{NEWLINE}{NEWLINE}\"Snow? That's just road I haven't plowed yet.\""
  STR_ART_BACK_STOP: "Back-Stop"
  STR_ART_BACK_STOP_TEXT: "BACK-STOP{NEWLINE}G.I. Joe{NEWLINE}Real name: Robert A. Levin{NEWLINE}Specialty: Armored vehicles; Armor; Mechanized infantry{NEWLINE}Birthplace: Montreal, Quebec, Canada{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Back-Stop drives the Persuader laser tank and plays the role of the team's immovable object. A Canadian-born armor specialist, he is large, quiet and very hard to push around. He sets up in a gap and dares Cobra to get through.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Overdrive: his Persuader's laser fires twice this turn{NEWLINE}{NEWLINE}\"You're not getting past.\""
  STR_ART_BLASTER: "Blaster"
  STR_ART_BLASTER_TEXT: "BLASTER{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Brian R. Davis{NEWLINE}Specialty: Ground-effect vehicles; Microwave technician{NEWLINE}Birthplace: Panama City, Florida{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Blaster drives the Vindicator hovercraft and carries a boxy laser pistol of his own design. A Florida ground-effect vehicle specialist, he likes speed, gadgets and experimental technology, and he is never happier than when something new works the first time.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: DK-528 infra-green laser pistol{NEWLINE}Signature move: Hover Skim: his Vindicator crosses land and water at triple speed, firing on the move{NEWLINE}{NEWLINE}\"Hovering is just flying without the paperwork.\""
  STR_ART_BLOCKER: "Blocker"
  STR_ART_BLOCKER_TEXT: "BLOCKER{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: David B. McCarthy{NEWLINE}Specialty: Armored vehicles; Mechanized reconnaissance; Special services{NEWLINE}Birthplace: Boston, Massachusetts{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Blocker drives the Eliminator, a fast scout vehicle packed with sensors, and he finds Cobra before Cobra finds him. A Boston reconnaissance man with a laser submachine gun, he is cautious, observant and very good at seeing what is coming.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: XL-13 laser submachine gun{NEWLINE}Signature move: Sensor Sweep: his Eliminator's radar reveals every Cobra vehicle on the map{NEWLINE}{NEWLINE}\"Contact. Many contacts.\""
  STR_ART_CHUCKLES: "Chuckles"
  STR_ART_CHUCKLES_TEXT: "CHUCKLES{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Philip M. Provost{NEWLINE}Specialty: Undercover; Criminal investigations; Intelligence{NEWLINE}Birthplace: Little Rock, Arkansas{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Chuckles is an undercover investigator in a loud tropical shirt, and that is exactly why nobody suspects him. Friendly, funny and endlessly patient, he spends months inside criminal operations collecting evidence. When the time comes, he drops the act very quickly.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Colt Combat Commander .45 with shoulder holster{NEWLINE}Signature move: Undercover: moves among Cobra unrecognized until he attacks; can start a mission already inside{NEWLINE}{NEWLINE}\"I'm just a regular guy. Until I'm not.\""
  STR_ART_CRAZYLEGS: "Crazylegs"
  STR_ART_CRAZYLEGS_TEXT: "CRAZYLEGS{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: David O. Thomas{NEWLINE}Specialty: Assault; Infantry; Parachute rigger{NEWLINE}Birthplace: Fort Dodge, Iowa{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Crazylegs is an assault trooper and parachute rigger from Iowa who takes risks that make his sergeants nervous. Fast, fearless and a little wild, he sprints across open ground under fire and somehow keeps coming back.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: EM-4 assault rifle{NEWLINE}Signature move: Daredevil: dashes through enemy fire without drawing reaction shots{NEWLINE}{NEWLINE}\"They can't hit what they can't catch.\""
  STR_ART_DODGER: "Dodger"
  STR_ART_DODGER_TEXT: "DODGER{NEWLINE}G.I. Joe - Sergeant First Class (E-7){NEWLINE}Real name: Richard Renwick{NEWLINE}Specialty: Armored vehicle operation; Electronics; Laser demolitions{NEWLINE}Birthplace: South Bend, Indiana{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Dodger drives the Marauder laser vehicle and grew up in Indiana as a natural mechanic. Easygoing and practical, he keeps his machine running in conditions that would wreck it and uses its lasers to cut through anything in the way.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Ultrasonic photon rifle{NEWLINE}Signature move: Laser Cut: his Marauder's lasers cut through a wall and whoever is behind it{NEWLINE}{NEWLINE}\"Watch this. No, really, watch.\""
  STR_ART_FAST_DRAW: "Fast Draw"
  STR_ART_FAST_DRAW_TEXT: "FAST DRAW{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Eliot Brown{NEWLINE}Specialty: Mobile missile weapons systems; Ordnance; Clerk{NEWLINE}Birthplace: Collierville, Tennessee{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Fast Draw wears a full missile system on his back and can fire before most gunners have finished aiming. A Tennessee ordnance specialist with fast reflexes, he hunts Cobra vehicles and aircraft and takes pride in hitting first.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: FAFNIR shoulder missile system{NEWLINE}Signature move: Quick Draw: fires two missiles at two different vehicles in one action{NEWLINE}{NEWLINE}\"Draw.\""
  STR_ART_HARDTOP: "Hardtop"
  STR_ART_HARDTOP_TEXT: "HARDTOP{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Nicholas D. Klas{NEWLINE}Specialty: Heavy equipment operation; Electronics{NEWLINE}Birthplace: Chicago, Illinois{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Hardtop runs the Defiant launch complex and its heavy crawler, and he treats the team's biggest machine as his personal domain. A Chicago heavy-equipment and electronics expert, he is proud, territorial and very good at keeping enormous things moving.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Satellite Sweep: a satellite scan of the whole map if satellites cover the region{NEWLINE}{NEWLINE}\"Clear the pad.\""
  STR_ART_JINX: "Jinx"
  STR_ART_JINX_TEXT: "JINX{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Kim Arashikage{NEWLINE}Specialty: Ninja; Intelligence; Finance clerk{NEWLINE}Birthplace: Los Angeles, CA{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Jinx is a ninja trained by the Arashikage clan, an intelligence specialist who fights blindfolded to sharpen her other senses. Quiet, disciplined and lethally fast with twin blades, she is at her best in darkness and smoke.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Twin ninja-to and naginata{NEWLINE}Signature move: Blind Fighting: full strength in darkness and smoke; strikes every adjacent Cobra{NEWLINE}{NEWLINE}\"I don't need to see you.\""
  STR_ART_KNOCKDOWN: "Knockdown"
  STR_ART_KNOCKDOWN_TEXT: "KNOCKDOWN{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Blaine M. Gonsalves{NEWLINE}Specialty: Anti-aircraft; Infantry; Microwave technician{NEWLINE}Birthplace: San Francisco, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Knockdown is an anti-aircraft specialist who believes the sky belongs to whoever can shoot down everything else in it. A San Francisco gunner with an experimental launcher pistol, he watches the clouds constantly and is rarely surprised by what comes out of them.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: X-128 ground-to-air pistol{NEWLINE}Signature move: Flak Curtain: no Cobra aircraft can enter his area this turn{NEWLINE}{NEWLINE}\"Nothing flies here.\""
  STR_ART_LAW_ORDER: "Law & Order"
  STR_ART_LAW_ORDER_TEXT: "LAW & ORDER{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Christopher M. Lavigne{NEWLINE}Specialty: Military police; Intelligence{NEWLINE}Birthplace: Houston, Texas{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Law is a military policeman who works with a German shepherd named Order. By the book, steady and fair, he tracks down Cobra fugitives and brings them in alive. Order handles the running. Law handles the paperwork.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Uzi and M.P. truncheon, with Order{NEWLINE}Signature move: Arrest: Order takes down a fleeing Cobra and Law cuffs him; a guaranteed capture{NEWLINE}{NEWLINE}\"Order, hold.\""
  STR_ART_LT_FALCON: "Lt. Falcon"
  STR_ART_LT_FALCON_TEXT: "LT. FALCON{NEWLINE}G.I. Joe - First Lieutenant (O-2){NEWLINE}Real name: Vincent R. Falcone{NEWLINE}Specialty: Special Forces; Infantry; Medic{NEWLINE}Birthplace: Fayetteville, North Carolina{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Lt. Falcon is a young Special Forces officer, Duke's half-brother, with more talent than discipline. Confident and reckless, he leads Green Beret operations with flair, and he is still learning that leadership means more than courage. When it counts, he gets it right.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: 12-gauge pump shotgun and Bowie knife{NEWLINE}Signature move: Lead From the Front: his squad moves and fires this turn as if fresh{NEWLINE}{NEWLINE}\"Follow me. I know where I'm going. Mostly.\""
  STR_ART_MAVERICK: "Maverick"
  STR_ART_MAVERICK_TEXT: "MAVERICK{NEWLINE}G.I. Joe - Captain (O-3){NEWLINE}Real name: Thomas P. Kiley{NEWLINE}Specialty: Fighter pilot{NEWLINE}Birthplace: Ida Grove, Iowa{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Maverick flies the Vector jet and lives up to his name. A daring Iowa pilot who prefers instinct to procedure, he jams Cobra's communications and flies the missions others call impossible.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Machine pistol{NEWLINE}Signature move: Jammer: his Vector jams Cobra radios, no reinforcements for two turns (short-range jammer without the Vector){NEWLINE}{NEWLINE}\"Rules are for people who land.\""
  STR_ART_MERCER: "Mercer"
  STR_ART_MERCER_TEXT: "MERCER{NEWLINE}G.I. Joe{NEWLINE}Real name: Felix P. Stratton (possible alias){NEWLINE}Specialty: Mercenary; Infantry; Small arms armorer{NEWLINE}Birthplace: Spencer, West Virginia{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Mercer is a former Cobra Viper who saw what Cobra really was and walked away. Now a Joe, he brings an insider's knowledge of Cobra tactics, equipment and habits. Some of the team still don't trust him. He fights harder than any of them.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Machine gun and grenade launcher{NEWLINE}Signature move: Inside Man: reveals what every Cobra in sight will do next turn{NEWLINE}{NEWLINE}\"I know how they think. I used to think it.\""
  STR_ART_OUTBACK: "Outback"
  STR_ART_OUTBACK_TEXT: "OUTBACK{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Stuart R. Selkirk{NEWLINE}Specialty: Wilderness specialist; Infantry; Survival training instructor{NEWLINE}Birthplace: Big Piney, Wyoming{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Outback is a wilderness survival expert from Wyoming who is happiest a hundred miles from the nearest road. Bearded, cheerful and endlessly resourceful, he can live off the land indefinitely and moves through rough country like he owns it.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: G3 rifle{NEWLINE}Signature move: Live Off the Land: heals himself, ignores fatigue and vanishes in wilderness{NEWLINE}{NEWLINE}\"Out here, I'm home.\""
  STR_ART_PAYLOAD: "Payload"
  STR_ART_PAYLOAD_TEXT: "PAYLOAD{NEWLINE}G.I. Joe - Colonel (O-6){NEWLINE}Real name: Mark Morgan, Jr.{NEWLINE}Specialty: Shuttle commander; Astronaut; Fixed-wing pilot{NEWLINE}Birthplace: Cape Canaveral, Florida{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Payload is an astronaut and the commander of the Defiant space shuttle, a test pilot who has flown higher than anyone on the team. Calm, careful and very proud of his suit, he treats every mission as a launch: checklists first, glory later.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm{NEWLINE}Signature move: Space Suit: immune to gas, fire and smoke for the whole mission{NEWLINE}{NEWLINE}\"T-minus whenever you're ready.\""
  STR_ART_PSYCHE_OUT: "Psyche-Out"
  STR_ART_PSYCHE_OUT_TEXT: "PSYCHE-OUT{NEWLINE}G.I. Joe - First Lieutenant (O-2){NEWLINE}Real name: Kenneth D. Rich{NEWLINE}Specialty: Deceptive warfare; Psy-Ops; Social services counselor{NEWLINE}Birthplace: San Francisco, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Psyche-Out is a psychological warfare specialist who fights Cobra's mind before it fights back. A San Francisco counselor turned soldier, he uses deception, sound and suggestion to rattle troops into panic or surrender.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: .45 pistol and sonic field projector{NEWLINE}Signature move: Mind Games: nearby Cobra troopers panic or surrender{NEWLINE}{NEWLINE}\"You don't really want to fight me. Do you?\""
  STR_ART_RED_DOG: "Red Dog"
  STR_ART_RED_DOG_TEXT: "RED DOG{NEWLINE}G.I. Joe - E-5 (equivalent){NEWLINE}Real name: David Taputapu{NEWLINE}Specialty: Infantry{NEWLINE}Birthplace: Pago Pago, Samoa{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Red Dog is a Samoan rugby player and infantryman who prefers to settle disputes at close range. Big, loud and good-natured, he barrels through Cobra lines like a scrum and rarely needs his rifle.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Fists{NEWLINE}Signature move: Scrum: bulldozes through a line of Cobra, knocking them all down{NEWLINE}{NEWLINE}\"Scrum down!\""
  STR_ART_RUMBLER: "Rumbler"
  STR_ART_RUMBLER_TEXT: "RUMBLER{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Earl-Bob Swilley{NEWLINE}Specialty: Fast attack vehicles; Armor; Small arms{NEWLINE}Birthplace: Raeford, North Carolina{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Rumbler drives the Crossfire, a fast attack car with a detachable remote unit, and he likes to arrive at speed. A North Carolina driver with a taste for dust and noise, he is happiest when the vehicle is airborne for a moment.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Remote Unit: launches the Crossfire's detachable remote-control car as a separate unit for three turns{NEWLINE}{NEWLINE}\"Hold on to something.\""
  STR_ART_SNEAK_PEEK: "Sneak Peek"
  STR_ART_SNEAK_PEEK_TEXT: "SNEAK PEEK{NEWLINE}G.I. Joe{NEWLINE}Real name: Owen King{NEWLINE}Birthplace: Bangor, Maine{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Sneak Peek is an advanced reconnaissance specialist with a periscope, binoculars and a radio, and he sees Cobra long before Cobra sees him. Curious, patient and observant, he scouts ahead and tells the team exactly what is waiting around the corner.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-16 and binoculars{NEWLINE}Signature move: Periscope: sees over walls and around corners for a turn, revealing a whole building{NEWLINE}{NEWLINE}\"I've got eyes on it.\""
  STR_ART_STARDUSTER: "Starduster"
  STR_ART_STARDUSTER_TEXT: "STARDUSTER{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: Edward J. Skylar{NEWLINE}Specialty: Jet pack pilot; Infantry; Air Reconnaissance; Helicopter assault{NEWLINE}Birthplace: Burlingame, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Starduster flies a J.U.M.P. jet pack and treats the battlefield as a place best seen from above. A California air reconnaissance trooper, he hovers, fires and moves before Cobra can react.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rifle and J.U.M.P. jet pack{NEWLINE}Signature move: Air Cover: hovers on his J.U.M.P. pack for two turns, firing down with no cover penalty{NEWLINE}{NEWLINE}\"Keep your heads down. I'll keep mine up.\""
  STR_ART_STEAM_ROLLER: "Steam Roller"
  STR_ART_STEAM_ROLLER_TEXT: "STEAM ROLLER{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Averill B. Whitcomb{NEWLINE}Specialty: Heavy equipment operations; Armor{NEWLINE}Birthplace: Duluth, Minnesota{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Steam Roller drives the Mobile Command Center, the team's huge rolling headquarters. A Minnesota heavy-equipment operator with a strong back and a quiet temper, he takes enormous machines where they have no business going.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Command Post: the Mobile Command Center deploys as a bunker; nearby Joes get cover and extended comms{NEWLINE}{NEWLINE}\"It's big. It's slow. It gets there.\""
  STR_ART_TAURUS: "Taurus"
  STR_ART_TAURUS_TEXT: "TAURUS{NEWLINE}G.I. Joe - E-5 (equivalent){NEWLINE}Real name: Varujan Ayvazyan{NEWLINE}Specialty: Demolitions{NEWLINE}Birthplace: Istanbul, Turkey{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Taurus is the demolitions man of the Sky Patrol's European counterpart, a Turkish-born explosives expert with a philosopher's calm. He studies a wall before he removes it and seldom needs a second charge.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rifle and demolition charges{NEWLINE}Signature move: Shaped Charge: blows a hole through any wall or floor in one action{NEWLINE}{NEWLINE}\"There. Now there's a door.\""
  STR_ART_TUNNEL_RAT: "Tunnel Rat"
  STR_ART_TUNNEL_RAT_TEXT: "TUNNEL RAT{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Nicky Lee{NEWLINE}Specialty: Explosives ordnance disposal; Combat engineering{NEWLINE}Birthplace: Brooklyn, New York{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Tunnel Rat is a Brooklyn combat engineer who goes underground when everyone else goes over the top. Wiry, tough and fearless in confined spaces, he clears tunnels, disarms bombs and pops up where Cobra least expects.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: 7.62 machine gun with infrared scope and satchel charge{NEWLINE}Signature move: Tunnel In: enters any building from below, anywhere on the map{NEWLINE}{NEWLINE}\"See you on the other side. Below it, actually.\""
  STR_ART_ARMADILLO: "Armadillo"
  STR_ART_ARMADILLO_TEXT: "ARMADILLO{NEWLINE}G.I. Joe - Sergeant First Class (E-7){NEWLINE}Real name: Philo R. Makepeace{NEWLINE}Specialty: Armored assault vehicles; Advance reconnaissance{NEWLINE}Birthplace: Ft. Huachuca, Arizona{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Armadillo drives the Rolling Thunder, a massive missile platform, and believes in advancing slowly and decisively. An Arizona armor man with a talent for reconnaissance, he is steady, deliberate and very hard to stop once moving.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Lightning Strike: Rolling Thunder launches both Lightning rockets at once{NEWLINE}{NEWLINE}\"Slow and steady wins the war.\""
  STR_ART_BLIZZARD: "Blizzard"
  STR_ART_BLIZZARD_TEXT: "BLIZZARD{NEWLINE}G.I. Joe - Sergeant First Class (E-7){NEWLINE}Real name: Gregory M. Natale{NEWLINE}Specialty: Arctic assault; Infantry; Arctic warfare training instructor{NEWLINE}Birthplace: Wolfboro, North Hampshire{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Blizzard is an arctic assault trooper from New Hampshire who trains in conditions others call survival situations. Tough, disciplined and well-equipped, he leads cold-weather attacks with a sled pack and a machine gun.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Machine gun and pistol{NEWLINE}Signature move: Ice Storm: in cold, nearby Joes ignore weather penalties and Cobra in the area is slowed{NEWLINE}{NEWLINE}\"Weather's on our side.\""
  STR_ART_BUDO: "Budo"
  STR_ART_BUDO_TEXT: "BUDO{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Kyle A. Jesso{NEWLINE}Specialty: Samurai warrior; Infantry; Hand-to-hand combat instructor{NEWLINE}Birthplace: Sacramento, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Budo is a samurai from a long family line of warriors, a man who wears traditional armor and carries a sword with pride. Disciplined and honorable, he blends old fighting arts with modern soldiering and strikes first against anyone who closes on him.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Katana and sai{NEWLINE}Signature move: Iaijutsu: draws and strikes first against anyone who closes on him this turn{NEWLINE}{NEWLINE}\"My blade is quicker than your trigger.\""
  STR_ART_CHARBROIL: "Charbroil"
  STR_ART_CHARBROIL_TEXT: "CHARBROIL{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Carl G. Shannon{NEWLINE}Specialty: Flame weapons; Small arms armorer{NEWLINE}Birthplace: Blackduck, Minnesota{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Charbroil is a flamethrower specialist from Minnesota who handles fire with surprising gentleness. Quiet and professional, he clears bunkers and walls off corridors, and he never forgets how dangerous his weapon is.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Flamethrower{NEWLINE}Signature move: Firewall: a line of fire that blocks a corridor for three turns{NEWLINE}{NEWLINE}\"Stand back. All the way back.\""
  STR_ART_GHOSTRIDER: "Ghostrider"
  STR_ART_GHOSTRIDER_TEXT: "GHOSTRIDER{NEWLINE}G.I. Joe - Major (O-4){NEWLINE}Real name: Jonas S. Jeffries{NEWLINE}Specialty: Stealth fighter pilot; Aeronautical engineer{NEWLINE}Birthplace: Chicago, Illinois{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Ghostrider flies the Phantom X-19 stealth fighter and makes a point of never being seen. A Chicago pilot and engineer, he is quiet, elusive and fond of making Cobra radar operators doubt their equipment.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm{NEWLINE}Signature move: Recon Flyover: the Phantom reveals the whole map for a turn if available{NEWLINE}{NEWLINE}\"You never saw me.\""
  STR_ART_HARDBALL: "Hardball"
  STR_ART_HARDBALL_TEXT: "HARDBALL{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Wilmer S. Duggleby{NEWLINE}Specialty: Multi-shot grenadier; Infantry; Special services{NEWLINE}Birthplace: Cooperstown, New York{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Hardball is a grenadier and former baseball prospect from Cooperstown who throws grenades with pitcher's accuracy. Friendly and competitive, he lobs rounds into windows and over walls and keeps score.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Multi-shot grenade launcher{NEWLINE}Signature move: Fastball: lobs grenades at three separate targets in one turn{NEWLINE}{NEWLINE}\"Strike three.\""
  STR_ART_HIT_RUN: "Hit & Run"
  STR_ART_HIT_RUN_TEXT: "HIT & RUN{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Brent Scott{NEWLINE}Specialty: Infantry; Mountaineering{NEWLINE}Birthplace: Sioux City, Iowa{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Hit & Run is a mountaineering commando who climbs, strikes and is gone before Cobra knows he was there. An Iowa-born Native American scout, he is calm, focused and expert with a rope and a submachine gun.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Colt 9mm submachine gun and grappling hook{NEWLINE}Signature move: Hit and Fade: attacks, then moves out of sight without drawing reaction fire{NEWLINE}{NEWLINE}\"Gone before you turn around.\""
  STR_ART_LIGHTFOOT: "Lightfoot"
  STR_ART_LIGHTFOOT_TEXT: "LIGHTFOOT{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Cory R. Owens{NEWLINE}Specialty: Explosives; Demolitions; Artillery coordinator{NEWLINE}Birthplace: Wichita, Kansas{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Lightfoot is an explosives expert who disarms mines and booby traps with a scientist's patience. A Kansas demolitions man with a mine detector and a remote robot, he moves slowly and safely through ground that would kill anyone else.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm, mine detector and demolition robot{NEWLINE}Signature move: Defuse: disarms every mine and charge in a wide area and can turn a Cobra charge against them{NEWLINE}{NEWLINE}\"Step where I step.\""
  STR_ART_MUSKRAT: "Muskrat"
  STR_ART_MUSKRAT_TEXT: "MUSKRAT{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Ross A. Williams{NEWLINE}Specialty: Swamp fighting; Infantry; Social services{NEWLINE}Birthplace: Thibodaux, Louisiana{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Muskrat is a swamp fighter from Louisiana bayou country who knows marshland like his own backyard. Patient, relaxed and wily, he poles through water Cobra won't enter and appears where nobody is watching.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Super 90 shotgun and machete{NEWLINE}Signature move: Swamp Rat: invisible in swamp and marsh; moves through water without penalty{NEWLINE}{NEWLINE}\"The swamp's friendly. To me.\""
  STR_ART_REPEATER: "Repeater"
  STR_ART_REPEATER_TEXT: "REPEATER{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: Jeffrey R. Therien{NEWLINE}Specialty: Machine gunner; Infantry; Heavy weapons{NEWLINE}Birthplace: Cumberland, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Repeater is a machine gunner who fires on the move with a body-mounted weapon. A Rhode Island heavy-weapons man, he is loud, energetic and fond of keeping Cobra's heads down for as long as the ammunition lasts.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Body-mounted machine gun{NEWLINE}Signature move: Walking Fire: full-auto bursts on the move with no accuracy loss{NEWLINE}{NEWLINE}\"Plenty more where that came from.\""
  STR_ART_SHOCKWAVE: "Shockwave"
  STR_ART_SHOCKWAVE_TEXT: "SHOCKWAVE{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Jason A. Faria{NEWLINE}Specialty: Special weapons and tactics{NEWLINE}Birthplace: Dearborn, Michigan{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Shockwave is a SWAT veteran from Dearborn who specializes in room clearing and hostage rescue. Precise and composed, he enters first, reads the room in an instant and puts Cobra on the floor before they react.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Suppressed machine pistol{NEWLINE}Signature move: Breach and Clear: storms a room and gets the first shot on every Cobra inside{NEWLINE}{NEWLINE}\"Clear.\""
  STR_ART_SKIDMARK: "Skidmark"
  STR_ART_SKIDMARK_TEXT: "SKIDMARK{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Cyril Colombani{NEWLINE}Specialty: Fast attack vehicles; Infantry{NEWLINE}Birthplace: Los Angeles, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Skidmark drives the Desert Fox, a fast attack vehicle, and likes to kick up as much dust as possible. A Los Angeles driver with a racer's instincts, he is brash, fast and fond of sudden turns.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Sandstorm: his Desert Fox kicks up dust that hides the squad for two turns{NEWLINE}{NEWLINE}\"Eat my dust. Literally.\""
  STR_ART_SKYSTRIKER: "Skystriker"
  STR_ART_SKYSTRIKER_TEXT: "SKYSTRIKER{NEWLINE}G.I. Joe - Lieutenant Colonel (O-5){NEWLINE}Real name: Alexander P. Russo{NEWLINE}Specialty: Jet fighter pilot; Combat tactician{NEWLINE}Birthplace: Providence, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Skystriker is a combat jet pilot and tactician who handles the team's front-line fighters with cold precision. Focused and confident, he plans every attack run before he takes off.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm{NEWLINE}Signature move: Tiger Pounce: an air strike from his Tiger Rat if available{NEWLINE}{NEWLINE}\"One pass. That's all I need.\""
  STR_ART_SPEARHEAD_AND_MAX: "Spearhead and Max"
  STR_ART_SPEARHEAD_AND_MAX_TEXT: "SPEARHEAD AND MAX{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Peter R. Millman{NEWLINE}Specialty: Point man; Infantry; Finance{NEWLINE}Birthplace: St. Louis, Missouri{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Spearhead is a point man from St. Louis who goes into the unknown first, and Max is the bobcat who goes with him. Quick-witted and fearless, he finds the danger before the team does, and Max finds it before he does.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rifle and knife, with Max{NEWLINE}Signature move: Max Pounces: Max the bobcat ambushes a Cobra and disarms him{NEWLINE}{NEWLINE}\"Max smells trouble. I like trouble.\""
  STR_ART_STORM_SHADOW: "Storm Shadow"
  STR_ART_STORM_SHADOW_TEXT: "STORM SHADOW{NEWLINE}G.I. Joe - First Sergeant (E-8){NEWLINE}Real name: Thomas S. Arashikage{NEWLINE}Specialty: Ninja; Assassination; Covert Ops; Intelligence{NEWLINE}Birthplace: St. Louis, Missouri{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Storm Shadow is a master ninja of the Arashikage clan who once served Cobra and now fights beside the Joes. Proud, disciplined and haunted by his clan's history, he is a lethal swordsman and archer who chooses his battles carefully.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Bow and twin swords{NEWLINE}Signature move: Arashikage Strike: arrow and sword in one silent turn{NEWLINE}{NEWLINE}\"My honor is my own.\""
  STR_ART_SUPER_TROOPER: "Super Trooper"
  STR_ART_SUPER_TROOPER_TEXT: "SUPER TROOPER{NEWLINE}G.I. Joe - First Lieutenant (O-2){NEWLINE}Real name: Paul Latimer{NEWLINE}Specialty: Infantry; Public relations{NEWLINE}Birthplace: Dayton, Ohio{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Super Trooper is the Army's poster soldier, a public-relations star who also happens to be very good in a fight. Square-jawed and unshakeable, he cannot be rattled and carries the team's spirit on his shoulders.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Assault rifle{NEWLINE}Signature move: Steel Nerves: can't panic or be suppressed, and every hit he lands suppresses{NEWLINE}{NEWLINE}\"Steady as she goes.\""
  STR_ART_WILDCARD: "Wildcard"
  STR_ART_WILDCARD_TEXT: "WILDCARD{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Eric U. Scott{NEWLINE}Specialty: Armored assault vehicles; Chaplain's assistant{NEWLINE}Birthplace: North Hampton, Massachusetts{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Wildcard drives the Mean Dog, an armored assault vehicle, and has a reputation for wrecking everything he drives, including his own. A former chaplain's assistant with a reckless streak, he is fearless and unpredictable.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Juggernaut: his Mean Dog smashes through every obstacle in its path this turn{NEWLINE}{NEWLINE}\"Brakes? Who needs brakes?\""
  STR_ART_WINDMILL: "Windmill"
  STR_ART_WINDMILL_TEXT: "WINDMILL{NEWLINE}G.I. Joe - Captain (O-3){NEWLINE}Real name: Edward J. Roth{NEWLINE}Specialty: Helicopter pilot; Stopped-rotor aircraft{NEWLINE}Birthplace: Allentown, Philadelphia{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Windmill flies the Skystorm helicopter, a stopped-rotor aircraft, and hovers over the battlefield with complete confidence. A Pennsylvania pilot, he loves heavy firepower and staying put while firing all of it.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm{NEWLINE}Signature move: Hover Barrage: his Skystorm hovers and fires every weapon at one target{NEWLINE}{NEWLINE}\"Hold position. Fire everything.\""
  STR_ART_BACKBLAST: "Backblast"
  STR_ART_BACKBLAST_TEXT: "BACKBLAST{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Edward J. Menninger{NEWLINE}Specialty: Anti-aircraft; Air defense; Signal corps{NEWLINE}Birthplace: New York, New York{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Backblast is an air defense specialist who considers every Cobra aircraft a personal affront. A New York gunner with a triple missile launcher, he is gruff, sharp-eyed and very good at clearing the sky.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Triple anti-aircraft missile launcher{NEWLINE}Signature move: Skyfall: a guaranteed kill on any Cobra aircraft or jet-pack trooper in range{NEWLINE}{NEWLINE}\"Nothing's flying over my head.\""
  STR_ART_COUNTDOWN: "Countdown"
  STR_ART_COUNTDOWN_TEXT: "COUNTDOWN{NEWLINE}G.I. Joe - Captain (O-3){NEWLINE}Real name: David D. Dubosky{NEWLINE}Specialty: Astronaut; Fighter pilot; Electronic engineering{NEWLINE}Birthplace: Plainfield, New Jersey{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Countdown is an astronaut and fighter pilot with an engineer's head for numbers. Calm and methodical, he flies space missions and air combat alike with checklists and nerves of steel.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rifle and grappling hook{NEWLINE}Signature move: Ace Maneuver: dodges all fire in one air-combat round{NEWLINE}{NEWLINE}\"Ten, nine, eight...\""
  STR_ART_DEE_JAY: "Dee-Jay"
  STR_ART_DEE_JAY_TEXT: "DEE-JAY{NEWLINE}G.I. Joe - Specialist (SP-4){NEWLINE}Real name: Thomas R. Rossi III{NEWLINE}Specialty: Communications; Radio telephone operator; Infantry{NEWLINE}Birthplace: Providence, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Dee-Jay runs communications for the Battle Force 2000 vehicles and keeps the whole high-tech formation coordinated. A Rhode Island radio man with a talker's charm, he likes loud broadcasts and fast talk.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Laser rifle and loudspeaker pack{NEWLINE}Signature move: Combined Arms: every Battle Force 2000 vehicle in range fires once more this turn{NEWLINE}{NEWLINE}\"You're on the air.\""
  STR_ART_DOGFIGHT: "Dogfight"
  STR_ART_DOGFIGHT_TEXT: "DOGFIGHT{NEWLINE}G.I. Joe - First Lieutenant (O-2){NEWLINE}Real name: James R. King{NEWLINE}Specialty: Fighter pilot; Electronics{NEWLINE}Birthplace: Providence, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Dogfight flies the Mudfighter close-support plane and enjoys getting low and dirty. A Rhode Island pilot and electronics specialist, he is quick-witted, impatient and very good at hitting ground targets.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm{NEWLINE}Signature move: Mud Run: Mudfighter close air support on a target area if available{NEWLINE}{NEWLINE}\"Down in the mud with you.\""
  STR_ART_DOWNTOWN: "Downtown"
  STR_ART_DOWNTOWN_TEXT: "DOWNTOWN{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Thomas P. Riley{NEWLINE}Specialty: Mortar artillery; Infantry; Special operations{NEWLINE}Birthplace: Cleveland, Ohio{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Downtown is a mortar man from Cleveland who can drop rounds within a few feet of friendly troops without hitting them. Careful and precise, he trusts his math and his crew.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Mortar{NEWLINE}Signature move: Danger Close: a mortar strike right beside Joes without hitting them{NEWLINE}{NEWLINE}\"Danger close. And perfectly safe.\""
  STR_ART_HOT_SEAT: "Hot Seat"
  STR_ART_HOT_SEAT_TEXT: "HOT SEAT{NEWLINE}G.I. Joe - Sergeant First Class (E-7){NEWLINE}Real name: Michael A. Provost{NEWLINE}Specialty: Armored vehicle driver; Drill instructor{NEWLINE}Birthplace: Pawtucket, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Hot Seat drives the Raider armored vehicle and pushes it across terrain other drivers refuse. A Rhode Island drill instructor turned driver, he is loud, tough and fond of taking shortcuts.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Go Anywhere: his Raider crosses any terrain this turn, rubble included{NEWLINE}{NEWLINE}\"Shortest way is straight through.\""
  STR_ART_LONG_RANGE: "Long Range"
  STR_ART_LONG_RANGE_TEXT: "LONG RANGE{NEWLINE}G.I. Joe - Sergeant First Class (E-7){NEWLINE}Real name: Karl W. Fritz{NEWLINE}Specialty: Artillery machine operator; Artillery{NEWLINE}Birthplace: Warwick, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Long Range operates the Thunderclap artillery gun and hits targets he cannot see. A Rhode Island artilleryman with a patient streak, he waits for coordinates and delivers from a distance that frustrates Cobra.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Long Shot: a Thunderclap strike anywhere on the map, no spotter needed{NEWLINE}{NEWLINE}\"Coordinates received. Shot out.\""
  STR_ART_RECOIL: "Recoil"
  STR_ART_RECOIL_TEXT: "RECOIL{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Joseph Felton{NEWLINE}Specialty: Long range reconnaissance; Infantry; Radio telephone operator{NEWLINE}Birthplace: Fashion Island, Washington{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Recoil is a long-range reconnaissance man who stays behind Cobra lines for weeks, radioing in everything he sees. Independent, tough and patient, he marks targets and never loses track of them.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rifle, pistol and mines{NEWLINE}Signature move: Long Range Patrol: every Cobra he spots stays marked for the squad all mission{NEWLINE}{NEWLINE}\"I've had you in my sights for a while now.\""
  STR_ART_SCOOP: "Scoop"
  STR_ART_SCOOP_TEXT: "SCOOP{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Leonard Michaels{NEWLINE}Specialty: Combat information; Journalism; Microwave transmission{NEWLINE}Birthplace: Chicago, Illinois{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Scoop is a combat information specialist with a camera, a microphone and a satellite uplink, and he puts Cobra's crimes in front of the world. Brave, curious and a little vain, he believes the truth is a weapon.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Pistol and camera{NEWLINE}Signature move: On Camera: films Cobra in action; winning the mission gives a big goodwill bonus{NEWLINE}{NEWLINE}\"Smile, Cobra. You're on camera.\""
  STR_ART_WINDCHILL: "Windchill"
  STR_ART_WINDCHILL_TEXT: "WINDCHILL{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: Jim Steel{NEWLINE}Specialty: Snow vehicles; Cold weather survival instructor{NEWLINE}Birthplace: Cedar Rapids, Iowa{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Windchill drives the Arctic Blast, a flame-cannon snow vehicle, and trains others to survive extreme cold. An Iowa soldier with a dry sense of humor, he melts ice and Cobra positions with the same machine.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Flame Cannon: his Arctic Blast torches a large area and melts ice into water hazards{NEWLINE}{NEWLINE}\"Warm enough for you?\""
  STR_ART_AIRWAVE: "Airwave"
  STR_ART_AIRWAVE_TEXT: "AIRWAVE{NEWLINE}G.I. Joe - First Sergeant (E-8){NEWLINE}Real name: Cliff V. Mewett{NEWLINE}Specialty: Audible frequencies; Signal Corps Adjutant for JCS{NEWLINE}Birthplace: Louisville, Kentucky{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Airwave is a signal specialist who hears frequencies the rest of the team can't, and he can turn a noisy battlefield into a clear channel. A Kentucky radio expert, he is quiet and attentive, and he makes every call for support land at once.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rifle and radio{NEWLINE}Signature move: Signal Boost: calls in any available off-map support at double effect{NEWLINE}{NEWLINE}\"I hear everything.\""
  STR_ART_ALTITUDE: "Altitude"
  STR_ART_ALTITUDE_TEXT: "ALTITUDE{NEWLINE}G.I. Joe - Sergeant Major (E-9){NEWLINE}Real name: John Edward O. Jones{NEWLINE}Specialty: Reconnaissance; Combat artist{NEWLINE}Birthplace: Cambria, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Altitude is a reconnaissance trooper and combat artist who sketches Cobra positions from a parachute. A California scout with a painter's eye, he sees the whole battlefield at once and passes it to the team.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Missile launcher and rifle{NEWLINE}Signature move: High Ground: reveals the whole map for a turn from his parachute drop{NEWLINE}{NEWLINE}\"From up here, it all makes sense.\""
  STR_ART_AMBUSH: "Ambush"
  STR_ART_AMBUSH_TEXT: "AMBUSH{NEWLINE}G.I. Joe - Private First Class (E-3){NEWLINE}Real name: Aaron McMahon{NEWLINE}Specialty: Concealment; Infantry{NEWLINE}Birthplace: Walnut, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Ambush is a concealment specialist who can vanish into almost any landscape. A California trooper with a taste for solitude, he waits motionless for hours and only reveals himself with his first shot.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: XL70 assault rifle and grenade launcher{NEWLINE}Signature move: Perfect Ambush: invisible until he fires; his first shot can't miss and doesn't reveal him{NEWLINE}{NEWLINE}\"You walked right past me.\""
  STR_ART_BULLHORN: "Bullhorn"
  STR_ART_BULLHORN_TEXT: "BULLHORN{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Stephen A. Ferreira{NEWLINE}Specialty: Intervention; Hostage negotiation; Armor{NEWLINE}Birthplace: Providence, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Bullhorn is a hostage negotiator who prefers talking to shooting and is very good at both. A Rhode Island intervention specialist, he is calm, patient and persuasive, and he ends standoffs without a casualty whenever he can.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Scoped sniper rifle and gas gun{NEWLINE}Signature move: Talk Them Down: a Cobra holding a hostage surrenders, or nearby troopers drop their weapons{NEWLINE}{NEWLINE}\"Let's all put the guns down and talk.\""
  STR_ART_CAPT_GRID_IRON: "Capt. Grid-Iron"
  STR_ART_CAPT_GRID_IRON_TEXT: "CAPT. GRID-IRON{NEWLINE}G.I. Joe - Captain (O-3){NEWLINE}Real name: Terrence Lydon{NEWLINE}Specialty: Hand-to-hand combat{NEWLINE}Birthplace: Evergreen Park, Illinois{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Capt. Grid-Iron is a former football star who brings a coach's playbook to infantry tactics. Energetic and loud, he throws grenades like long passes and treats every assault like a fourth-quarter drive.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Football grenades and machine gun{NEWLINE}Signature move: Hail Mary: a grenade thrown across the whole map with perfect accuracy{NEWLINE}{NEWLINE}\"Run the play!\""
  STR_ART_COLD_FRONT: "Cold Front"
  STR_ART_COLD_FRONT_TEXT: "COLD FRONT{NEWLINE}G.I. Joe - Sergeant First Class (E-7){NEWLINE}Real name: Charles Donahue{NEWLINE}Specialty: Armored vehicle driver; Fire control technician{NEWLINE}Birthplace: Fort Knox, Kentucky{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Cold Front drives the Avalanche, a heavy armored snow vehicle, and lays ice mines across Cobra's routes. A Kentucky fire control technician, he is careful, patient and very hard to surprise.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Ice Mines: his Avalanche seeds a field of ice mines across a route{NEWLINE}{NEWLINE}\"Everyone stays off my ice.\""
  STR_ART_DROP_ZONE: "Drop Zone"
  STR_ART_DROP_ZONE_TEXT: "DROP ZONE{NEWLINE}G.I. Joe - First Sergeant (E-8){NEWLINE}Real name: Samuel C. Delisi{NEWLINE}Specialty: Weapons specialist; Special Forces advisor{NEWLINE}Birthplace: Poteau, Oklahoma{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Drop Zone is a weapons specialist and Special Forces adviser who coordinates whole-squad parachute drops. An Oklahoma paratrooper, he plans insertions down to the second.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Airborne rifle{NEWLINE}Signature move: Mass Drop: drops the whole squad anywhere on the map{NEWLINE}{NEWLINE}\"Green light. Everyone out.\""
  STR_ART_FREEFALL: "Freefall"
  STR_ART_FREEFALL_TEXT: "FREEFALL{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Philip W. Arndt{NEWLINE}Specialty: Paratrooper; Infantry{NEWLINE}Birthplace: Downers Grove, Illinois{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Freefall is a young paratrooper from Illinois who lands on rooftops and attacks before his chute settles. Eager and brash, he is always first out of the plane.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Assault rifle{NEWLINE}Signature move: Rooftop Insertion: drops onto any rooftop and attacks the same turn{NEWLINE}{NEWLINE}\"Last one down's a rookie.\""
  STR_ART_MAJOR_STORM: "Major Storm"
  STR_ART_MAJOR_STORM_TEXT: "MAJOR STORM{NEWLINE}G.I. Joe - Major (O-4){NEWLINE}Real name: Robert G. Swanson{NEWLINE}Specialty: Tank commander; Long range artillery officer; Intelligence{NEWLINE}Birthplace: Providence, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Major Storm commands the General, a massive mobile artillery platform, and believes in overwhelming firepower. A Rhode Island tank officer, he is stern and decisive.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Battle Station: the General's heavy guns all fire this turn{NEWLINE}{NEWLINE}\"All guns. Fire.\""
  STR_ART_PATHFINDER: "Pathfinder"
  STR_ART_PATHFINDER_TEXT: "PATHFINDER{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: William V. Ianotti{NEWLINE}Specialty: Jungle assault; Reconnaissance{NEWLINE}Birthplace: Key West, Florida{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Pathfinder is a jungle assault specialist from Key West who cuts trails where none exist. Hardy and practical, he leads the squad through thick terrain at speed.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Twin machine guns and brush cutter{NEWLINE}Signature move: Machete Path: cuts a path through jungle so the squad moves without penalty{NEWLINE}{NEWLINE}\"Follow the path I make.\""
  STR_ART_RAMPART: "Rampart"
  STR_ART_RAMPART_TEXT: "RAMPART{NEWLINE}G.I. Joe - Petty Officer Third Class (E-4){NEWLINE}Real name: Dwayne A. Felix{NEWLINE}Specialty: Shoreline Defense; Air defense artillery{NEWLINE}Birthplace: New York City, New York{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Rampart is a shoreline defense specialist who guards beaches and harbors with missiles and cannons. A New York air defense gunner, he stands watch over coastlines Cobra wants to land on.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Missile launcher and cannon{NEWLINE}Signature move: Beach Defense: every Cobra boat or landing on his stretch of shore takes fire{NEWLINE}{NEWLINE}\"Not on my beach.\""
  STR_ART_RAPID_FIRE: "Rapid Fire"
  STR_ART_RAPID_FIRE_TEXT: "RAPID FIRE{NEWLINE}G.I. Joe - Captain (O-3){NEWLINE}Real name: Robbie London{NEWLINE}Specialty: Fast attack; Sabotage{NEWLINE}Birthplace: Seattle, Washington{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Rapid Fire is a fast-attack and sabotage specialist from Seattle who fires before most men have aimed. Quick, competitive and confident, he lives up to his name every time.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-17 machine gun{NEWLINE}Signature move: Rapid Fire: three shots in one action{NEWLINE}{NEWLINE}\"Three shots. One second.\""
  STR_ART_SALVO: "Salvo"
  STR_ART_SALVO_TEXT: "SALVO{NEWLINE}G.I. Joe - Sergeant First Class (E-7){NEWLINE}Real name: David K. Hasle{NEWLINE}Specialty: Anti-armor; TOW/Dragon repair{NEWLINE}Birthplace: Arlington, Virginia{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Salvo is an anti-armor specialist who carries a whole missile rack on his back. A Virginia weapons technician, he is big, loud and fond of firing everything at once.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Missile backpack and mine launcher{NEWLINE}Signature move: Full Salvo: six missiles at once across an area{NEWLINE}{NEWLINE}\"Everything. At once.\""
  STR_ART_SKYDIVE: "Skydive"
  STR_ART_SKYDIVE_TEXT: "SKYDIVE{NEWLINE}G.I. Joe - First Sergeant (E-8){NEWLINE}Real name: Lynton N. Felix{NEWLINE}Specialty: Sky Patrol leader; Personnel administration{NEWLINE}Birthplace: Pensacola, Florida{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Skydive leads the Sky Patrol and can land on a single tile from thousands of feet. A Florida paratrooper and administrator, he combines discipline with daring.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rifle and pistol{NEWLINE}Signature move: Precision Landing: lands on any single tile, even a courtyard, and attacks at once{NEWLINE}{NEWLINE}\"Pick a spot. I'll land on it.\""
  STR_ART_STATIC_LINE: "Static Line"
  STR_ART_STATIC_LINE_TEXT: "STATIC LINE{NEWLINE}G.I. Joe - Sergeant First Class (E-7){NEWLINE}Real name: Wallace J. Badducci{NEWLINE}Specialty: Demolitions; Aircraft maintenance{NEWLINE}Birthplace: Chicago, Illinois{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Static Line is a demolitions paratrooper who drops explosives from the air with precision. A Chicago aircraft mechanic turned jumper, he is meticulous and calm.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Gun on harness{NEWLINE}Signature move: Air-Dropped Charge: drops a bomb anywhere he flies over{NEWLINE}{NEWLINE}\"Package delivered.\""
  STR_ART_STRETCHER: "Stretcher"
  STR_ART_STRETCHER_TEXT: "STRETCHER{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Thomas J. Larivee{NEWLINE}Specialty: Medic; Troop transportation{NEWLINE}Birthplace: Hartford, Connecticut{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Stretcher is a medic and troop transport specialist who carries the wounded out at speed. A Connecticut-born rescuer, he refuses to leave anyone behind.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm and medical kit{NEWLINE}Signature move: Evac: carries a downed Joe out at full speed and stabilizes him{NEWLINE}{NEWLINE}\"Hang on. You're coming with me.\""
  STR_ART_SUB_ZERO: "Sub-Zero"
  STR_ART_SUB_ZERO_TEXT: "SUB-ZERO{NEWLINE}G.I. Joe - First Lieutenant (O-2){NEWLINE}Real name: Mark Habershaw{NEWLINE}Specialty: Winter Operations; Field artillery{NEWLINE}Birthplace: Smithfield, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Sub-Zero is a winter operations specialist and artilleryman from Rhode Island who keeps his machine gun working in temperatures that freeze lesser weapons. Quiet and dependable, he pins Cobra in the snow.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Light machine gun and mortar{NEWLINE}Signature move: Cold Steel: heavy machine gun with no cold penalty that pins a whole line{NEWLINE}{NEWLINE}\"Ice in my veins. Lead in yours.\""
  STR_ART_TOPSIDE: "Topside"
  STR_ART_TOPSIDE_TEXT: "TOPSIDE{NEWLINE}G.I. Joe - Petty Officer First Class (E-6){NEWLINE}Real name: John Blanchet{NEWLINE}Specialty: Naval assault; Telecommunications{NEWLINE}Birthplace: Fort Wayne, Indiana{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Topside is a naval assault specialist who boards Cobra ships and docks and clears them. An Indiana sailor, he is strong, fearless and fond of sending enemies over the rail.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun and missile backpack{NEWLINE}Signature move: Man Overboard: knocks Cobra off a deck or dock into the water; bonus when boarding{NEWLINE}{NEWLINE}\"Man overboard.\""
  STR_ART_UPDRAFT: "Updraft"
  STR_ART_UPDRAFT_TEXT: "UPDRAFT{NEWLINE}G.I. Joe - Captain (O-3){NEWLINE}Real name: Matthew W. Smithers{NEWLINE}Specialty: Helicopter pilot; Weapons systems officer{NEWLINE}Birthplace: Bismark, North Dakota{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Updraft flies the Retaliator helicopter and specializes in hot extractions under fire. A North Dakota pilot and weapons officer, he is calm, quick and never late.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm{NEWLINE}Signature move: Hot Extraction: his Retaliator lands anywhere, loads the squad and lifts off in one turn{NEWLINE}{NEWLINE}\"Everybody in. We're leaving.\""
  STR_ART_BIG_BEN: "Big Ben"
  STR_ART_BIG_BEN_TEXT: "BIG BEN{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: David J. Bennet{NEWLINE}Specialty: Special Air Service; Infantry; Subversive operations{NEWLINE}Birthplace: Burford, England{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Big Ben is a British Special Air Service commando attached to G.I. Joe. Tough, dry-humored and highly trained, he plans silent raids and leads them with quiet confidence.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: L7 machine gun and grenades{NEWLINE}Signature move: Who Dares Wins: each Joe in the squad gets one free silent action{NEWLINE}{NEWLINE}\"Quietly does it, lads.\""
  STR_ART_CLEAN_SWEEP: "Clean-Sweep"
  STR_ART_CLEAN_SWEEP_TEXT: "CLEAN-SWEEP{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Daniel W. Price{NEWLINE}Specialty: Chemical operations; Combat engineering{NEWLINE}Birthplace: Elizabeth, New Jersey{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Clean-Sweep is a chemical operations specialist who neutralizes toxic spills with a decontamination rig. A New Jersey combat engineer, he is careful, focused and fearless around hazards.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Laser pistol and sludge vacuum{NEWLINE}Signature move: Decon Spray: neutralizes toxins and blinds nearby Cobra{NEWLINE}{NEWLINE}\"Hold still. You're contaminated.\""
  STR_ART_CLOUDBURST: "Cloudburst"
  STR_ART_CLOUDBURST_TEXT: "CLOUDBURST{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Chuck Ram{NEWLINE}Specialty: Airborne infantry; Aeronautics{NEWLINE}Birthplace: San Diego, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Cloudburst is a glider infantryman who crosses the battlefield silently and drops in unannounced. A San Diego aeronautics specialist, he loves the quiet of unpowered flight.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Airborne rifle{NEWLINE}Signature move: Silent Glide: crosses the map unseen on his glider and drops a grenade{NEWLINE}{NEWLINE}\"No engine. No warning.\""
  STR_ART_HEAVY_DUTY: "Heavy Duty"
  STR_ART_HEAVY_DUTY_TEXT: "HEAVY DUTY{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Lamont A. Morris{NEWLINE}Specialty: Heavy ordnance; Laser weapons systems; Indirect fire infantryman{NEWLINE}Birthplace: Chicago, Illinois{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Heavy Duty is a heavy ordnance specialist who handles the team's biggest portable weapons with ease. A Chicago gunner, he is strong, steady and an expert at firing on the move.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Missile cannon{NEWLINE}Signature move: Heavy Duty: fires his heavy weapon on the move at full accuracy, pinning everything in a cone{NEWLINE}{NEWLINE}\"Heavy duty, light work.\""
  STR_ART_MAJOR_ALTITUDE: "Major Altitude"
  STR_ART_MAJOR_ALTITUDE_TEXT: "MAJOR ALTITUDE{NEWLINE}G.I. Joe - Warrant Officer (W-4){NEWLINE}Real name: Robert D. Owens{NEWLINE}Specialty: Helicopter pilot; Fuselage art designer{NEWLINE}Birthplace: Rumford, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Major Altitude flies a one-man Battle Copter and paints his aircraft himself. A Rhode Island pilot, he is flamboyant, fast and fond of strafing runs.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sidearm{NEWLINE}Signature move: Chopper Rush: his one-man Battle Copter makes a fast strafing run{NEWLINE}{NEWLINE}\"Look out below.\""
  STR_ART_OZONE: "Ozone"
  STR_ART_OZONE_TEXT: "OZONE{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: David P. Kunitz{NEWLINE}Specialty: Environmental health; Chemical science; Atmospheric poisons{NEWLINE}Birthplace: Three Mile Island, Pennsylvania{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Ozone is an environmental health specialist who fights pollution and Cobra's toxic weapons alike. A Pennsylvania chemist, he turns Cobra's own hazards back against them.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Vacuum gun and water gun{NEWLINE}Signature move: Toxic Turnabout: seizes a Cobra toxic weapon and turns it on them{NEWLINE}{NEWLINE}\"Let's clean this up.\""
  STR_ART_SKYMATE: "Skymate"
  STR_ART_SKYMATE_TEXT: "SKYMATE{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Daniel T. Toner{NEWLINE}Specialty: Glider infantry; Australian Special Air Service{NEWLINE}Birthplace: Queenstown, Australia{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Skymate is an Australian glider commando on loan to the team. Cheerful and fearless, he dives on Cobra positions and lands wherever he likes.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Airborne rifle{NEWLINE}Signature move: Dive Bomb: a glider dive attack, then lands anywhere{NEWLINE}{NEWLINE}\"G'day, Cobra.\""
  STR_ART_TRACKER: "Tracker"
  STR_ART_TRACKER_TEXT: "TRACKER{NEWLINE}G.I. Joe - Chief Petty Officer (E-7){NEWLINE}Real name: Christopher R. Groen{NEWLINE}Specialty: Navy S.E.A.L.; Underwater arms{NEWLINE}Birthplace: Helena, Arkansas{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Tracker is a Navy SEAL from Arkansas who hunts fugitives through water and wilderness. Patient and relentless, he never loses a trail.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Machine gun and raft{NEWLINE}Signature move: The Hunt: a fleeing Cobra or villain can't escape the map this mission{NEWLINE}{NEWLINE}\"There's nowhere left to run.\""
  STR_ART_BARRICADE: "Barricade"
  STR_ART_BARRICADE_TEXT: "BARRICADE{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Philip M. Holsinger{NEWLINE}Specialty: Bunker buster; Urban assault{NEWLINE}Birthplace: Pittsburg, Kansas{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Barricade is a bunker buster and urban assault specialist who breaks fortified positions open. A Kansas trooper in heavy armor, he is blunt and unstoppable.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Z-99 sidearm, battering ram and multi-barrel machine gun{NEWLINE}Signature move: Bunker Buster: destroys a fortified position in one shot{NEWLINE}{NEWLINE}\"Knock knock.\""
  STR_ART_BULLET_PROOF: "Bullet-Proof"
  STR_ART_BULLET_PROOF_TEXT: "BULLET-PROOF{NEWLINE}G.I. Joe - Major (O-4){NEWLINE}Real name: Earl S. Morris{NEWLINE}Specialty: D.E.F. leader; Federal Marshall; Urban warfare{NEWLINE}Birthplace: Chicago, Illinois{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Bullet-Proof leads the D.E.F., the team's drug enforcement unit, a federal marshal who raids Cobra's criminal operations. Tough, careful and deeply committed, he believes the war on Cobra's crime is as important as any battle.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: GP-88 field rifle{NEWLINE}Signature move: Raid: storms a Cobra crime site; every trooper inside checks for surrender{NEWLINE}{NEWLINE}\"Everyone on the ground.\""
  STR_ART_DOJO: "Dojo"
  STR_ART_DOJO_TEXT: "DOJO{NEWLINE}G.I. Joe - First Sergeant (E-8){NEWLINE}Real name: Michael P. Russo{NEWLINE}Specialty: Silent weapons; Martial arts; Hand-to-hand combat instruction{NEWLINE}Birthplace: San Francisco, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Dojo is a silent-weapons and martial arts specialist who strikes without a sound. A San Francisco ninja, he is disciplined and fast.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Jungle sword and sickle{NEWLINE}Signature move: Flurry: strikes every adjacent Cobra{NEWLINE}{NEWLINE}\"Silence is my weapon.\""
  STR_ART_GENERAL_FLAGG: "General Flagg"
  STR_ART_GENERAL_FLAGG_TEXT: "GENERAL FLAGG{NEWLINE}G.I. Joe - Brigadier General (O-7){NEWLINE}Real name: Lawrence J. Flagg{NEWLINE}Specialty: G.I. Joe commander; Strategist{NEWLINE}Birthplace: Philadelphia, Pennsylvania{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}General Flagg commanded G.I. Joe before Hawk and returns as its senior strategist. A Philadelphia officer of great experience, he is calm, firm and respected by everyone.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-21 automatic combat rifle{NEWLINE}Signature move: Command Authority: every Joe on the map gets an extra action this turn{NEWLINE}{NEWLINE}\"Every Joe on the line. Now.\""
  STR_ART_NUNCHUK: "Nunchuk"
  STR_ART_NUNCHUK_TEXT: "NUNCHUK{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Ralph Badducci{NEWLINE}Specialty: Ninja; Self-defense instruction; Ordnance{NEWLINE}Birthplace: Brooklyn, New York{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Nunchuk is a Ninja Force fighter who trained in self-defense and ordnance. A Brooklyn martial artist, he is fast and fluid with the weapon he is named for.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Nunchaku and sword{NEWLINE}Signature move: Flurry: strikes every adjacent Cobra{NEWLINE}{NEWLINE}\"Too fast to see.\""
  STR_ART_T_JBANG: "T'Jbang"
  STR_ART_T_JBANG_TEXT: "T'JBANG{NEWLINE}G.I. Joe - Sergeant First Class (E-7){NEWLINE}Real name: Sam LaQuale{NEWLINE}Specialty: Martial arts; Infantry{NEWLINE}Birthplace: East Greenwich, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}T'Jbang is a Ninja Force warrior and Storm Shadow's student, a martial artist who strikes with speed and discipline. Quiet and loyal, he is still learning his master's patience.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Ninja sword{NEWLINE}Signature move: Flurry: strikes every adjacent Cobra{NEWLINE}{NEWLINE}\"My teacher is watching.\""
  STR_ART_BANZAI: "Banzai"
  STR_ART_BANZAI_TEXT: "BANZAI{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Robert J. Traavano{NEWLINE}Specialty: Commando; Nunchaku instructor{NEWLINE}Birthplace: Hartsdale, New York{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Banzai is a Ninja Force commando and nunchaku instructor whose battle cry is louder than his strikes. Energetic and fierce, he charges into close combat with joy.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Katana and long sword{NEWLINE}Signature move: Flurry: strikes every adjacent Cobra{NEWLINE}{NEWLINE}\"Banzai!\""
  STR_ART_BUSHIDO: "Bushido"
  STR_ART_BUSHIDO_TEXT: "BUSHIDO{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Lloyd S. Goldfine{NEWLINE}Specialty: Ninja Force swordsman{NEWLINE}Birthplace: Hollis, Queens, New York{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Bushido is a Ninja Force swordsman who follows a strict warrior code. Serious and honorable, he fights only when he must and wins when he does.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Katana and long sword{NEWLINE}Signature move: Flurry: strikes every adjacent Cobra{NEWLINE}{NEWLINE}\"My code guides my blade.\""
  STR_ART_COLONEL_COURAGE: "Colonel Courage"
  STR_ART_COLONEL_COURAGE_TEXT: "COLONEL COURAGE{NEWLINE}G.I. Joe - Colonel (O-6){NEWLINE}Real name: Cliff V. Mewett{NEWLINE}Specialty: Strategy; Administration{NEWLINE}Birthplace: Louisville, Kentucky{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Colonel Courage is a strategist and administrator who plans operations down to the smallest detail. A Boston officer, he is precise, organized and unexpectedly brave in the field.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Colt .45 pistol and officer's machine gun{NEWLINE}Signature move: Battle Plan: places the whole squad anywhere in the deployment zone; first turn free{NEWLINE}{NEWLINE}\"Everything is in its place.\""
  STR_ART_LONG_ARM: "Long Arm"
  STR_ART_LONG_ARM_TEXT: "LONG ARM{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Thomas P. Mangiaratti{NEWLINE}Specialty: Initial assault; Offensive tactics{NEWLINE}Birthplace: Boulder Creek, California{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Long Arm is an initial-assault specialist who covers huge areas with reaction fire. A California trooper, he is patient, alert and very good at protecting advancing squads.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Missile mega-blaster and rifle{NEWLINE}Signature move: Overwatch: covers a huge area with reaction fire{NEWLINE}{NEWLINE}\"I've got you covered. All of you.\""
  STR_ART_MACE: "Mace"
  STR_ART_MACE_TEXT: "MACE{NEWLINE}G.I. Joe - First Sergeant (E-8){NEWLINE}Real name: Thomas S. Bowman{NEWLINE}Specialty: Undercover surveillance; Intelligence{NEWLINE}Birthplace: Denver, Colorado{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Mace is an undercover surveillance agent who infiltrates Cobra's criminal networks and turns their deals into traps. A Denver intelligence officer, he is careful, patient and ruthless when the trap closes.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: \"Street Sweep\" assault rifle{NEWLINE}Signature move: Sting Operation: a Cobra deal turns into an ambush; every Cobra at the meeting starts surprised{NEWLINE}{NEWLINE}\"Deal's off.\""
  STR_ART_ROBO_JOE: "Robo-Joe"
  STR_ART_ROBO_JOE_TEXT: "ROBO-JOE{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Greg D. Scott{NEWLINE}Specialty: Jet power technology; Criminal termination{NEWLINE}Birthplace: Casper, Wyoming{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Robo-Joe is a cyborg Joe with jet power technology, rebuilt after a near-fatal injury. A Wyoming soldier, he is grim, determined and tougher than any normal man.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Shotgun and missile launcher{NEWLINE}Signature move: Drop In: paradrop anywhere on the map{NEWLINE}{NEWLINE}\"Still here. Still fighting.\""
  STR_ART_SNOW_STORM: "Snow Storm"
  STR_ART_SNOW_STORM_TEXT: "SNOW STORM{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: Guillermo \"Willie\" Suarez{NEWLINE}Specialty: Arctic warfare; Cold weather survival instructor{NEWLINE}Birthplace: Havana, Cuba{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Snow Storm is an arctic warfare specialist and cold-weather instructor born in Havana, which amuses everyone who meets him. Calm and precise, he shoots through blizzards that blind other snipers.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: \"Glacier\" missile gun and rifle{NEWLINE}Signature move: Ice Sniper: in cold, his shots ignore cover{NEWLINE}{NEWLINE}\"Even snow can't hide you.\""
  STR_ART_T_GIN_ZU: "T'gin-Zu"
  STR_ART_T_GIN_ZU_TEXT: "T'GIN-ZU{NEWLINE}G.I. Joe - Corporal (E-4){NEWLINE}Real name: Joseph R. Pamore{NEWLINE}Specialty: Ninja swordsman{NEWLINE}Birthplace: Somers, New York{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}T'gin-Zu is a Ninja Force swordsman who moves silently and strikes once. Disciplined and calm, he trains endlessly to perfect a single cut.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Ninja sword{NEWLINE}Signature move: Flurry: strikes every adjacent Cobra{NEWLINE}{NEWLINE}\"One cut is enough.\""
  STR_ART_EFFECTS: "Effects"
  STR_ART_EFFECTS_TEXT: "EFFECTS{NEWLINE}G.I. Joe - Staff Sergeant (E-6){NEWLINE}Real name: Aaron Beck{NEWLINE}Specialty: Explosives; Munitions ordnance{NEWLINE}Birthplace: Fort Worth, Texas{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Effects is a munitions and explosives specialist who designs breaching charges for every situation. A Texas ordnance man, he is precise and creative.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rifle{NEWLINE}Signature move: Breach: blows a new entrance{NEWLINE}{NEWLINE}\"New door coming up.\""
  STR_ART_GEARS: "Gears"
  STR_ART_GEARS_TEXT: "GEARS{NEWLINE}G.I. Joe - Captain (O-3){NEWLINE}Real name: Joseph A. Morrone{NEWLINE}Specialty: Chief engineer; Research and development{NEWLINE}Birthplace: Westerly, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Gears is the team's chief engineer, an inventor who builds and repairs anything the Joes need. A Rhode Island mechanic, he is clever, curious and never without a tool.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rifle and demolition charges{NEWLINE}Signature move: Breach: blows a new entrance{NEWLINE}{NEWLINE}\"Give me five minutes and a wrench.\""
  STR_ART_ICE_CREAM_SOLDIER: "Ice Cream Soldier"
  STR_ART_ICE_CREAM_SOLDIER_TEXT: "ICE CREAM SOLDIER{NEWLINE}G.I. Joe - Sergeant (E-5){NEWLINE}Real name: Tom-Henry Ragan{NEWLINE}Specialty: Flame thrower; Fire operations; Chef{NEWLINE}Birthplace: Providence, Rhode Island{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Ice Cream Soldier is a flamethrower specialist and chef who cooks for the team between battles. Cheerful and fond of fire, he clears positions with sweeping arcs of flame.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Flamethrower{NEWLINE}Signature move: Scorched Earth: a flamethrower sweep across a wide arc{NEWLINE}{NEWLINE}\"Who ordered it well done?\""
  STR_ART_SPACE_SHOT: "Space Shot"
  STR_ART_SPACE_SHOT_TEXT: "SPACE SHOT{NEWLINE}G.I. Joe{NEWLINE}Real name: George A. Roberts{NEWLINE}Specialty: Interstellar Pilot, Combat Operations Engineer{NEWLINE}Birthplace: Everett, Massachusetts{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Space Shot is an interstellar pilot and combat engineer who flies the team's space missions. An Everett native, he is calm, technical and fearless in vacuum.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: LX-1 laser pistol{NEWLINE}Signature move: Ace Maneuver: dodges all fire in one air-combat round{NEWLINE}{NEWLINE}\"Next stop, orbit.\""
  STR_ART_THUNDERWING: "Thunderwing"
  STR_ART_THUNDERWING_TEXT: "THUNDERWING{NEWLINE}G.I. Joe - Second Lieutenant (O-1){NEWLINE}Real name: Spencer D. Crecelius{NEWLINE}Specialty: Tank commander; Armor; Heavy equipment{NEWLINE}Birthplace: Las Vegas, Nevada{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Thunderwing commands the MOBAT tank and treats armor warfare as a fine art. A Las Vegas tank commander, he is bold and fond of fast assaults.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun{NEWLINE}Signature move: Thunder Run: his MOBAT moves double and fires its main gun twice{NEWLINE}{NEWLINE}\"Full speed. Fire.\""
  STR_ART_COBRA_COMMANDER: "Cobra Commander"
  STR_ART_COBRA_COMMANDER_TEXT: "COBRA COMMANDER{NEWLINE}Cobra{NEWLINE}Real name: Unknown{NEWLINE}Specialty: Cobra leader; Intelligence; Ordnance{NEWLINE}Birthplace: Unknown{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Cobra Commander leads Cobra, and almost nothing else about him is certain. His face is hidden, his real name is unknown, and his voice carries equal parts menace and petulance. A brilliant organizer and a coward under fire, he builds vast schemes and abandons them the moment they turn. He is always the first to escape and never the last to blame someone else.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: \"Venom\" laser pistol (1982 mail-in toy, 3DJoes){NEWLINE}Trait: Coward: withdraws when hurt and always escapes{NEWLINE}Signature move: \"Cobra, retreat!\": he escapes and every Cobra unit in sight gets a free move to pull back{NEWLINE}{NEWLINE}\"Retreat! Retreat! This is not my fault!\""
  STR_ART_MAJOR_BLUDD: "Major Bludd"
  STR_ART_MAJOR_BLUDD_TEXT: "MAJOR BLUDD{NEWLINE}Cobra - Major (O-4){NEWLINE}Real name: Sebastian Bludd{NEWLINE}Specialty: Terrorist; Assassination; Weapons and tactics{NEWLINE}Birthplace: Sydney, Australia{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Bludd sells his loyalty by the contract and his marksmanship by the head. A career mercenary with a prosthetic arm and a long memory, he keeps a private list of Joes who have cost him money or pride, and works through it with patience. Cobra uses him where it needs a professional rather than a fanatic. He fancies himself a poet. Nobody has ever asked to hear more.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Pistol, rocket launcher and missile backpack{NEWLINE}Trait: Grudge: bonus damage against Joes on his marked list{NEWLINE}Signature move: Bounty: marks a Joe; all Cobra units get bonus accuracy against him this mission{NEWLINE}{NEWLINE}\"Everyone has a price. Yours just went up.\""
  STR_ART_DESTRO: "Destro"
  STR_ART_DESTRO_TEXT: "DESTRO{NEWLINE}Iron Grenadiers{NEWLINE}Real name: James McCullen Destro XXIV{NEWLINE}Specialty: Weapons Manufacturer; Terrorist{NEWLINE}Birthplace: Callander, Scotland{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Destro is an arms dealer of ancient Scottish lineage who sells weapons to anyone and wears a steel mask he never removes. Cultured, proud and coldly practical, he supplies Cobra because it pays, and he despises Cobra Commander's incompetence. He keeps his word, values a worthy enemy, and plans to outlast them all.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: High-Density laser gun and armed attache case (toy, 3DJoes){NEWLINE}Trait: Honor: never fires on a downed Joe and keeps his deals{NEWLINE}Signature move: Arms Dealer: resupplies ammo and grenades for every Cobra and Iron Grenadier unit in range{NEWLINE}{NEWLINE}\"War is a business. I am very good at business.\""
  STR_ART_BARONESS: "Baroness"
  STR_ART_BARONESS_TEXT: "BARONESS{NEWLINE}Cobra{NEWLINE}Real name: Anastasia Cisarovna{NEWLINE}Specialty: Intelligence; Fixed-wing pilot; Sabotage{NEWLINE}Birthplace: Unknown (believed to be Eastern Europe, possibly East Germany).{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}The Baroness is Cobra's intelligence chief, a European aristocrat who turned to terror out of boredom and ambition. Elegant, ruthless and an expert spy, she pilots, infiltrates and shoots with equal skill. She shares Destro's contempt for Cobra Commander and his affection for victory.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Laser rifle{NEWLINE}Trait: Spy: starts the battle hidden{NEWLINE}Signature move: Pinpoint: one long-range shot at double accuracy that ignores cover{NEWLINE}{NEWLINE}\"Darling, you never stood a chance.\""
  STR_ART_TOMAX_AND_XAMOT: "Tomax and Xamot"
  STR_ART_TOMAX_AND_XAMOT_TEXT: "TOMAX AND XAMOT{NEWLINE}Cobra{NEWLINE}Real name: Tomax Rogue/Paoli{NEWLINE}Specialty: Crimson Guard commander; Infiltration; Espionage; Sabotage, Propaganda; Corporate law{NEWLINE}Birthplace: Corsica{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Tomax and Xamot are identical twins who command Cobra's elite Crimson Guard. Former mercenaries and financiers, they are so closely linked that one feels the other's pain. Polished, sarcastic and lethal, they fight as a single mind.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Paired pistols and sky hook (toy, 3DJoes){NEWLINE}Trait: Twin Bond: if one goes down, the other rages and tries to carry him off{NEWLINE}Signature move: Mirror Strike: both hit the same target in one turn; the second hit can't miss{NEWLINE}{NEWLINE}\"We are always two steps ahead. Together.\""
  STR_ART_STORM_SHADOW_COBRA: "Storm Shadow (Cobra)"
  STR_ART_STORM_SHADOW_COBRA_TEXT: "STORM SHADOW (COBRA){NEWLINE}Cobra - First Sergeant (E-8){NEWLINE}Real name: Thomas S. Arashikage{NEWLINE}Specialty: Ninja; Assassination; Covert Ops; Intelligence{NEWLINE}Birthplace: St. Louis, Missouri{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}In his Cobra years, Storm Shadow serves as Cobra Commander's bodyguard and assassin, a master ninja of the Arashikage clan hunting the truth behind his uncle's murder. He is proud, silent and lethal with bow and sword. His loyalty to Cobra is a mask, and the mask is slipping.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Bow and swords{NEWLINE}Trait: Silent: attacks don't reveal his position{NEWLINE}Signature move: Arashikage Strike: closes on a target in one move and strikes, ignoring reaction fire{NEWLINE}{NEWLINE}\"I serve Cobra. For now.\""
  STR_ART_ZARTAN: "Zartan"
  STR_ART_ZARTAN_TEXT: "ZARTAN{NEWLINE}Dreadnoks{NEWLINE}Specialty: Master of disguise; Espionage; Assassination; Dreadnok leader{NEWLINE}Birthplace: Unknown, possibly Nice, France{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Zartan is a master of disguise who can become almost anyone, and his own face is rarely seen. Leader of the Dreadnoks and a hired agent of Cobra, he is cunning, unpredictable and loyal only to his own interests and his siblings.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Pistol{NEWLINE}Trait: Chameleon: harder to see in shadow and cover{NEWLINE}Signature move: Disguise: shows as a Joe until he attacks or is spotted{NEWLINE}{NEWLINE}\"Who do you think I am?\""
  STR_ART_FIREFLY: "Firefly"
  STR_ART_FIREFLY_TEXT: "FIREFLY{NEWLINE}Cobra{NEWLINE}Specialty: Sabotage{NEWLINE}Birthplace: France{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Firefly is a saboteur for hire whose name is known and whose face is not. He moves in silence, plants charges no one finds, and leaves fire behind him. Cobra pays well for his services; he would work for anyone who paid better.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Submachine gun and demolition pack{NEWLINE}Trait: Saboteur: his explosives always start fires{NEWLINE}Signature move: Booby Trap: hidden charges on a wall, door or support, set off by contact or on his signal{NEWLINE}{NEWLINE}\"You'll never see me. You'll only hear the bang.\""
  STR_ART_WILD_WEASEL: "Wild Weasel"
  STR_ART_WILD_WEASEL_TEXT: "WILD WEASEL{NEWLINE}Cobra{NEWLINE}Specialty: Ground support pilot{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Wild Weasel flies Cobra's Rattler ground-attack jet and loves strafing runs above all else. A fearless and arrogant pilot, he dives lower and closer than any sane aviator would.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rattler (pilot){NEWLINE}Trait: Ground Attack: strikes hit harder against ground targets{NEWLINE}Signature move: Strafing Run (air battles): one pass hitting every ground or sea unit in a line{NEWLINE}{NEWLINE}\"Low and fast. That's the only way to fly.\""
  STR_ART_SCRAP_IRON: "Scrap-Iron"
  STR_ART_SCRAP_IRON_TEXT: "SCRAP-IRON{NEWLINE}Cobra{NEWLINE}Real name: Unknown{NEWLINE}Specialty: Anti-armor; Experimental weapons{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Scrap-Iron is Cobra's anti-armor specialist, an engineer who designs guided weapons and enjoys watching Joe vehicles burn. Cold, analytical and clever, he steers his missiles around cover with a remote control.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: RAR pistol and remote-guided missile launcher{NEWLINE}Trait: Tank Hunter: bonus damage against vehicles{NEWLINE}Signature move: Remote Missile: a guided shot at a vehicle out of sight, steered around cover{NEWLINE}{NEWLINE}\"Every vehicle has a weak spot. I find it.\""
  STR_ART_COPPERHEAD: "Copperhead"
  STR_ART_COPPERHEAD_TEXT: "COPPERHEAD{NEWLINE}Cobra{NEWLINE}Real name: Unknown{NEWLINE}Specialty: Swamp fighting; Air-driven swamp vehicles{NEWLINE}Birthplace: Unknown{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Copperhead drives Cobra's Water Moccasin swamp boat and knows the bayous better than anyone. A swamp fighter with a fondness for speed, he ferries troops through marshes the Joes avoid.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: M-16 over/under rifle{NEWLINE}Trait: Swamp Rat: no penalty in swamp, river or shallow water{NEWLINE}Signature move: Water Moccasin Rush: his boat crosses the map in one turn and drops troops{NEWLINE}{NEWLINE}\"The swamp's mine. You're just visiting.\""
  STR_ART_BUZZER: "Buzzer"
  STR_ART_BUZZER_TEXT: "BUZZER{NEWLINE}Dreadnoks{NEWLINE}Real name: Richard Blinken-Smythe{NEWLINE}Specialty: Demolitions; Civil disturbance{NEWLINE}Birthplace: Cambridge, England{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Buzzer is a Dreadnok biker with a chainsaw and a ruined academic past. Former university lecturer turned anarchist, he enjoys destruction for its own sake and carves through walls to reach his targets.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Chainsaw{NEWLINE}Trait: Mean: keeps fighting while wounded{NEWLINE}Signature move: Chainsaw: cuts a doorway through a wall and attacks whoever is behind it{NEWLINE}{NEWLINE}\"Mind if I cut in?\""
  STR_ART_RIPPER: "Ripper"
  STR_ART_RIPPER_TEXT: "RIPPER{NEWLINE}Dreadnoks{NEWLINE}Real name: Harry Nod{NEWLINE}Birthplace: Grim Cape, Tasmania{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Ripper is a Dreadnok brute from Tasmania who carries a set of hydraulic jaws. Loud, mean and fond of breaking things open, he rips vehicle hatches and doors apart with gusto.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Jaws-of-life claw{NEWLINE}Trait: Brute: bonus damage at close range{NEWLINE}Signature move: Tear Open: rips open a vehicle hatch or locked door; crew inside are exposed{NEWLINE}{NEWLINE}\"What's inside? Let's find out.\""
  STR_ART_TORCH: "Torch"
  STR_ART_TORCH_TEXT: "TORCH{NEWLINE}Dreadnoks{NEWLINE}Real name: Tom Winken{NEWLINE}Specialty: Acetylene cutting torch{NEWLINE}Birthplace: Botany Bay, New South Wales, Australia{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Torch is a Dreadnok from Botany Bay who carries a cutting torch and sets fire to everything he can reach. Grimy, crude and enthusiastic, he slices through metal walls and leaves them burning.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Cutting torch{NEWLINE}Trait: Firebug: his fire spreads faster{NEWLINE}Signature move: Cut Through: cuts through metal walls and doors and sets them burning{NEWLINE}{NEWLINE}\"It's getting warm in here.\""
  STR_ART_DR_MINDBENDER: "Dr. Mindbender"
  STR_ART_DR_MINDBENDER_TEXT: "DR. MINDBENDER{NEWLINE}Cobra{NEWLINE}Real name: Dr. Brian Binder(possible alias){NEWLINE}Specialty: Scientist; Mind control{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Dr. Mindbender is Cobra's mad scientist, a former orthodontist turned genius of mind control and genetic engineering. Brilliant, vain and deeply unstable, he creates Cobra's most dangerous weapons and creatures.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: .45 pistol and electric prod, mind-control device{NEWLINE}Trait: Mad Scientist: B.A.T.s and engineered troops near him fight better{NEWLINE}Signature move: Mind Control: takes over one unnamed Joe for 2 turns (named Joes resist){NEWLINE}{NEWLINE}\"Your mind belongs to me now.\""
  STR_ART_SERPENTOR: "Serpentor"
  STR_ART_SERPENTOR_TEXT: "SERPENTOR{NEWLINE}Cobra - Emperor{NEWLINE}Specialty: Cobra leader{NEWLINE}Birthplace: Springfield{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Serpentor is Cobra's genetically engineered emperor, created from the DNA of history's greatest conquerors. Arrogant, theatrical and genuinely dangerous, he leads from the front in his Air Chariot and despises Cobra Commander.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Dagger, plus his Air Chariot{NEWLINE}Trait: Arrogant: leads from the front and won't retreat until badly hurt{NEWLINE}Signature move: Emperor's Command: every Cobra unit in sight gets an extra action this turn{NEWLINE}{NEWLINE}\"Kneel before your emperor!\""
  STR_ART_BIG_BOA: "Big Boa"
  STR_ART_BIG_BOA_TEXT: "BIG BOA{NEWLINE}Cobra{NEWLINE}Specialty: Physical trainer; Drill instructor{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Big Boa is Cobra's drill instructor and physical trainer, a hulking boxer who toughens recruits through endless punishment. Fierce and proud, he knocks Joes out with one blow.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Boxing gloves{NEWLINE}Trait: Drill Instructor: nearby Cobra troops don't panic{NEWLINE}Signature move: Haymaker: a melee hit that knocks a Joe out cold for 2 turns{NEWLINE}{NEWLINE}\"Get up. I'm not done with you.\""
  STR_ART_CROC_MASTER: "Croc Master"
  STR_ART_CROC_MASTER_TEXT: "CROC MASTER{NEWLINE}Cobra{NEWLINE}Specialty: Reptile trainer; Cobra Island security{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Croc Master trains crocodiles and guards Cobra's prisoners. Cruel and patient, he releases his animals on anyone near water.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Pistol and crocodile{NEWLINE}Trait: Warden: prisoners in his compounds don't escape{NEWLINE}Signature move: Release the Crocs: crocodiles attack anyone in water or swamp near him{NEWLINE}{NEWLINE}\"My pets are hungry.\""
  STR_ART_CRYSTAL_BALL: "Crystal Ball"
  STR_ART_CRYSTAL_BALL_TEXT: "CRYSTAL BALL{NEWLINE}Cobra{NEWLINE}Real name: Unknown{NEWLINE}Specialty: Hypnotism; Mind control; Interrogation{NEWLINE}Birthplace: Unknown{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Crystal Ball is Cobra's hypnotist and interrogator, a mysterious figure who bends minds with a glittering device. Smooth, sinister and confident, he turns Joes against their friends.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Hypnotic crystal{NEWLINE}Trait: Interrogator: captured Joes give up intel faster{NEWLINE}Signature move: Hypnotize: one Joe in sight attacks his nearest ally for a turn (named Joes get a resist roll){NEWLINE}{NEWLINE}\"Look into the light. Deeper.\""
  STR_ART_RAPTOR: "Raptor"
  STR_ART_RAPTOR_TEXT: "RAPTOR{NEWLINE}Cobra{NEWLINE}Specialty: Falconry; Accountancy{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Raptor is a falconer and former accountant who joined Cobra seeking power. Vain and theatrical, he sends his trained falcon to scout and strike.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Falcon and airfoil glider (toy had no gun; pistol is game default){NEWLINE}Trait: Falconer: his bird extends his sight range{NEWLINE}Signature move: Bird Scout: the falcon reveals every Joe in a wide area, hidden ones included{NEWLINE}{NEWLINE}\"My falcon sees everything.\""
  STR_ART_ZARANA: "Zarana"
  STR_ART_ZARANA_TEXT: "ZARANA{NEWLINE}Dreadnoks{NEWLINE}Real name: Zoe{NEWLINE}Specialty: Disguise; Espionage; Assassination{NEWLINE}Birthplace: Unknown{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Zarana is Zartan's sister, a Dreadnok master of disguise and espionage. Clever, ruthless and charming when it suits her, she can pass for anyone and strike without warning.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Razor spur blade (toy); pistol as game default{NEWLINE}Trait: Spy: starts the battle hidden{NEWLINE}Signature move: Disguise: appears as a civilian until she attacks or is spotted{NEWLINE}{NEWLINE}\"You never knew it was me.\""
  STR_ART_ZANDAR: "Zandar"
  STR_ART_ZANDAR_TEXT: "ZANDAR{NEWLINE}Dreadnoks{NEWLINE}Real name: Zack (Zachary){NEWLINE}Specialty: Camouflage; Covert operations{NEWLINE}Birthplace: Unknown, believed to be somewhere in Florida{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Zandar is Zartan's brother, a Dreadnok camouflage expert who melts into landscapes. Quiet and loyal to his family, he drops smoke and disappears.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Scoped barbed-projectile rifle{NEWLINE}Trait: Camouflage: hard to spot outdoors{NEWLINE}Signature move: Smoke and Vanish: drops smoke; every Dreadnok in it goes hidden{NEWLINE}{NEWLINE}\"Now you see me...\""
  STR_ART_MONKEYWRENCH: "Monkeywrench"
  STR_ART_MONKEYWRENCH_TEXT: "MONKEYWRENCH{NEWLINE}Dreadnoks{NEWLINE}Real name: Bill Winkie{NEWLINE}Specialty: Explosives; Demolitions{NEWLINE}Birthplace: Rhyl, North Wales, UK{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Monkeywrench is a Dreadnok explosives fanatic from Wales who carries grenades by the dozen. Wild and grinning, he hurls them two at a time.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Harpoon gun and grenades{NEWLINE}Trait: Demolitions: his grenades break walls{NEWLINE}Signature move: Grenade Spree: throws two grenades in one turn{NEWLINE}{NEWLINE}\"Catch!\""
  STR_ART_THRASHER: "Thrasher"
  STR_ART_THRASHER_TEXT: "THRASHER{NEWLINE}Dreadnoks{NEWLINE}Real name: Bruno LaCrosse{NEWLINE}Specialty: Demolitions; Civil disturbance; Auto mechanic{NEWLINE}Birthplace: Brussels, Belgium{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Thrasher drives the Dreadnoks' Thunder Machine, a hot-rod war wagon built from scrap. Brash and reckless, he rams through anything in his way.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Thunder Machine (driver){NEWLINE}Trait: Road Rage: his vehicle moves farther{NEWLINE}Signature move: Ram: drives through a wall or light vehicle, damaging both{NEWLINE}{NEWLINE}\"Out of my way!\""
  STR_ART_ZANZIBAR: "Zanzibar"
  STR_ART_ZANZIBAR_TEXT: "ZANZIBAR{NEWLINE}Dreadnoks{NEWLINE}Real name: Morgan Teach{NEWLINE}Birthplace: Cayman Islands{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Zanzibar is a Dreadnok pirate who flies an Air Skiff and loots civilian shipping. Greedy and grinning, he throws nets over Joes and robs everything in sight.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Pistol, plus his Air Skiff{NEWLINE}Trait: Skiff-Borne: he flies, the only Cobra on the board who does, so walls, water and rooftops are nothing to him; his raids on civilian shipping earn Cobra double{NEWLINE}Signature move: Weighted Net: pins one Joe where he stands for a turn or two without wounding him. In water battles, Boarding Raid instead: boards an enemy boat and fights its crew{NEWLINE}{NEWLINE}\"Arr! Everything here is mine!\""
  STR_ART_ROAD_PIG: "Road Pig"
  STR_ART_ROAD_PIG_TEXT: "ROAD PIG{NEWLINE}Dreadnoks{NEWLINE}Real name: Donald DeLuca{NEWLINE}Specialty: Enforcer{NEWLINE}Birthplace: Goblu, Michigan{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Road Pig is a Dreadnok enforcer with a split personality and a cinderblock hammer. Unpredictable and brutal, he smashes walls and Joes alike.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Sledgehammer{NEWLINE}Trait: Berserk: gets stronger as he takes damage{NEWLINE}Signature move: Smash: breaks a wall or support and hits everyone behind it{NEWLINE}{NEWLINE}\"Smash it all!\""
  STR_ART_GNAWGAHYDE: "Gnawgahyde"
  STR_ART_GNAWGAHYDE_TEXT: "GNAWGAHYDE{NEWLINE}Dreadnoks{NEWLINE}Real name: Clyde Hyde{NEWLINE}Specialty: Poaching{NEWLINE}Birthplace: unknown{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Gnawgahyde is a Dreadnok poacher who hunts with wild boars and a rifle. Filthy and greedy, he tracks wounded prey relentlessly.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Hunting rifle and boars{NEWLINE}Trait: Poacher: tracks wounded Joes{NEWLINE}Signature move: Loose the Boars: his boars charge the nearest Joes{NEWLINE}{NEWLINE}\"Somethin's bleedin'. I can smell it.\""
  STR_ART_OVERKILL: "Overkill"
  STR_ART_OVERKILL_TEXT: "OVERKILL{NEWLINE}Cobra{NEWLINE}Real name: Robert Skelton (Devil's Due continuity); Unknown (all other continuities){NEWLINE}Specialty: B.A.T. leader{NEWLINE}Birthplace: Unknown{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Overkill is a cyborg who leads Cobra's B.A.T. androids. Half machine and wholly ruthless, he commands his robots with cold efficiency.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Built-in arm weapons{NEWLINE}Trait: Cyborg: immune to stun and gas{NEWLINE}Signature move: B.A.T. Command: every B.A.T. in sight acts again{NEWLINE}{NEWLINE}\"Machines don't fear. Neither do I.\""
  STR_ART_VOLTAR: "Voltar"
  STR_ART_VOLTAR_TEXT: "VOLTAR{NEWLINE}Iron Grenadiers - General{NEWLINE}Real name: Unknown{NEWLINE}Specialty: Field commander; Strategy and tactics{NEWLINE}Birthplace: Unknown{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Voltar is Destro's general, a tactician who commands the Iron Grenadiers with discipline and his condor. Calculating and ambitious, he wins through maneuver.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Modified Uzi, with his condor{NEWLINE}Trait: Tactician: Iron Grenadiers in his sight act first in the turn{NEWLINE}Signature move: Flanking Order: up to 4 Iron Grenadiers get a free move{NEWLINE}{NEWLINE}\"Flank them. Now.\""
  STR_ART_DARKLON: "Darklon"
  STR_ART_DARKLON_TEXT: "DARKLON{NEWLINE}Iron Grenadiers{NEWLINE}Real name: Unknown{NEWLINE}Specialty: Darklonia ruler; Mercenary business{NEWLINE}Birthplace: Unknown{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Darklon is Destro's cousin, ruler of Darklonia and a would-be usurper of the Destro family. Armored and arrogant, he advances without fear.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Armored suit and rifle{NEWLINE}Trait: Usurper: fights harder when Destro is captured or absent{NEWLINE}Signature move: Iron Will: takes no damage for one turn while advancing{NEWLINE}{NEWLINE}\"The Destro name is mine to claim.\""
  STR_ART_METAL_HEAD: "Metal-Head"
  STR_ART_METAL_HEAD_TEXT: "METAL-HEAD{NEWLINE}Iron Grenadiers{NEWLINE}Real name: Stuart A. Finley{NEWLINE}Specialty: Anti-tank weapons; Ordnance{NEWLINE}Birthplace: Annapolis, Maryland{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Metal-Head is an Iron Grenadier anti-tank specialist with rockets mounted everywhere he could fit them. Loud and theatrical, he destroys vehicles and bunkers.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Rocket launcher{NEWLINE}Trait: Tank Buster: bonus damage against vehicles and bunkers{NEWLINE}Signature move: Twin Rockets: two anti-tank rockets in one turn{NEWLINE}{NEWLINE}\"Boom. Boom. Boom.\""
  STR_ART_OVERLORD: "Overlord"
  STR_ART_OVERLORD_TEXT: "OVERLORD{NEWLINE}Cobra{NEWLINE}Real name: Mikhail Derenko{NEWLINE}Specialty: Conspiracy; Bureaucrat{NEWLINE}Birthplace: Russia{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Overlord is a rogue Cobra commander who seized his own forces and plays all sides. Scheming and ambitious, he bribes troops and attacks the weakest.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Pistol, plus his Dictator vehicle{NEWLINE}Trait: Warlord: in three-way battles he attacks whoever is weakest{NEWLINE}Signature move: Bribe: one unnamed Cobra unit in sight switches to his side for the mission{NEWLINE}{NEWLINE}\"Everyone works for me eventually.\""
  STR_ART_HEADMAN: "Headman"
  STR_ART_HEADMAN_TEXT: "HEADMAN{NEWLINE}Cobra{NEWLINE}Real name: Unknown{NEWLINE}Specialty: Headhunters leader; Illegal narcotics{NEWLINE}Birthplace: Unknown{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Headman leads the Headhunters, Cobra's criminal syndicate. Slick and dangerous, he runs drug and crime operations behind a businessman's smile.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: \"Mega-blast\" combat rifle and missile launcher{NEWLINE}Trait: Crime Boss: Headhunters near him never flee{NEWLINE}Signature move: Bodyguards: a Headhunter squad arrives at the map edge{NEWLINE}{NEWLINE}\"Business is business.\""
  STR_ART_GRISTLE: "Gristle"
  STR_ART_GRISTLE_TEXT: "GRISTLE{NEWLINE}Cobra{NEWLINE}Real name: Danimal J. Rogers{NEWLINE}Specialty: Urban Crime Commander{NEWLINE}Birthplace: Montego Bay, Jamaica{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Gristle is Cobra's urban crime commander, a street-fighter who runs gangs from Jamaica to the slums. Tough and violent, he calls in thugs when cornered.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Tracker missile gun and Bowie knife{NEWLINE}Trait: Street Fighter: bonus on city maps{NEWLINE}Signature move: Street Gang: calls in a squad of armed thugs{NEWLINE}{NEWLINE}\"This is my town.\""
  STR_ART_SLICE: "Slice"
  STR_ART_SLICE_TEXT: "SLICE{NEWLINE}Cobra{NEWLINE}Specialty: Swordsman, Espionage{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Slice is a Cobra ninja swordsman who moves swiftly and strikes everyone around him. Proud and acrobatic, he loves a crowd of enemies.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Swords{NEWLINE}Trait: Swift: extra movement{NEWLINE}Signature move: Whirlwind: hits everyone next to him{NEWLINE}{NEWLINE}\"More of you? Good.\""
  STR_ART_DICE: "Dice"
  STR_ART_DICE_TEXT: "DICE{NEWLINE}Cobra{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Dice is a Cobra ninja who fights with a bo staff and knocks enemies down with sweeping strikes. Agile and laughing, he loves the gamble of close combat.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Bo staff{NEWLINE}Trait: Agile: harder to hit in melee{NEWLINE}Signature move: Staff Sweep: knocks down everyone next to him; they lose their next action{NEWLINE}{NEWLINE}\"Let's roll.\""
  STR_ART_VYPRA: "Vypra"
  STR_ART_VYPRA_TEXT: "VYPRA{NEWLINE}Cobra{NEWLINE}Real name: Ann A. Conda{NEWLINE}Specialty: Intelligence; Martial arts{NEWLINE}Birthplace: New Orleans, Louisiana{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Vypra is a Cobra assassin and martial artist from New Orleans who strikes unseen and vanishes. Cold and patient, she targets officers first.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Pistol and blades{NEWLINE}Trait: Assassin: bonus damage against a target that hasn't spotted her{NEWLINE}Signature move: Vanishing Strike: strikes, then goes hidden{NEWLINE}{NEWLINE}\"You won't see it coming.\""
  STR_ART_CESSPOOL: "Cesspool"
  STR_ART_CESSPOOL_TEXT: "CESSPOOL{NEWLINE}Cobra{NEWLINE}Real name: Vincent A. D'Alleva{NEWLINE}Birthplace: Newton, Massachusetts{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Cesspool is a Cobra polluter who poisons environments for profit. Disfigured and vengeful, he turns battlefields into toxic wasteland.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Toxic-waste weapon{NEWLINE}Trait: Toxic: immune to poison and hazards{NEWLINE}Signature move: Toxic Spill: turns an area into poison ground for several turns{NEWLINE}{NEWLINE}\"Breathe deep.\""
  STR_ART_THE_INTERROGATOR: "The Interrogator"
  STR_ART_THE_INTERROGATOR_TEXT: "THE INTERROGATOR{NEWLINE}Cobra - Classified{NEWLINE}Real name: Unknown{NEWLINE}Specialty: Interrogation{NEWLINE}Birthplace: Unknown{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}The Interrogator extracts secrets from captured Joes and turns them against their friends. Quiet and menacing, he breaks minds through fear.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Signature weapon: Pistol{NEWLINE}Trait: Conditioning: captured unnamed Joes turn into moles faster{NEWLINE}Signature move: Intimidate: one Joe in sight loses his next action{NEWLINE}{NEWLINE}\"Tell me everything.\""
  STR_ART_CRIMSON_GUARD: "Crimson Guard"
  STR_ART_CRIMSON_GUARD_TEXT: "CRIMSON GUARD{NEWLINE}Elite troop - E-4 or equivalent{NEWLINE}Specialty: Elite trooper; Espionage; Accounting{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}The Crimson Guard are Cobra's elite soldiers, highly trained and often placed in civilian lives as sleeper agents. Disciplined and loyal, they guard Cobra's leaders.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Bodyguard: steps in to take a shot meant for a nearby villain{NEWLINE}{NEWLINE}\"For Cobra.\""
  STR_ART_CRIMSON_GUARD_COMMANDER: "Crimson Guard Commander"
  STR_ART_CRIMSON_GUARD_COMMANDER_TEXT: "CRIMSON GUARD COMMANDER{NEWLINE}Elite troop - E-5 or equivalent (squad leaders); E-6 or equivalent (officers){NEWLINE}Specialty: Siegie commander; Elite officer; Political and industrial espionage{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Crimson Guard Commanders lead squads of Cobra's elite troops. Confident and ruthless officers, they rally their soldiers for the hardest missions.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Rally: nearby Crimson Guards get bonus accuracy (officer type){NEWLINE}{NEWLINE}\"Guards, forward.\""
  STR_ART_CRIMSON_GUARD_IMMORTAL: "Crimson Guard Immortal"
  STR_ART_CRIMSON_GUARD_IMMORTAL_TEXT: "CRIMSON GUARD IMMORTAL{NEWLINE}Elite troop - E-4 or equivalent{NEWLINE}Specialty: Elite trooper; Espionage; Accounting{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}The Crimson Guard Immortals are Cobra's most fanatical elite, trained never to surrender. Unbreakable and silent, they fight to the last.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Unbreakable: never surrender or panic, very hard to interrogate{NEWLINE}{NEWLINE}\"We do not yield.\""
  STR_ART_B_A_T: "B.A.T."
  STR_ART_B_A_T_TEXT: "B.A.T.{NEWLINE}Elite troop{NEWLINE}Real name: Battalion Automation Tactics{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}B.A.T.s are Cobra's battle android troopers, mass-produced robots with interchangeable weapon hands. Fearless and relentless, they march into fire without hesitation.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Android: immune to stun, gas and sonic; can't be interrogated; explodes when destroyed; wreck is salvage for research{NEWLINE}{NEWLINE}\"Target acquired.\""
  STR_ART_IRON_GRENADIERS: "Iron Grenadiers"
  STR_ART_IRON_GRENADIERS_TEXT: "IRON GRENADIERS{NEWLINE}Elite troop{NEWLINE}Specialty: Infantry; Terrorism; Sales and marketing{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Iron Grenadiers are Destro's private army, professional soldiers better trained and better equipped than Cobra's troopers. Disciplined and loyal, they fight with cold precision.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Professionals: better reaction fire than any Cobra trooper{NEWLINE}{NEWLINE}\"For Destro.\""
  STR_ART_ANNIHILATOR: "Annihilator"
  STR_ART_ANNIHILATOR_TEXT: "ANNIHILATOR{NEWLINE}Elite troop{NEWLINE}Specialty: Special force trooper; Bodyguard; Airborne assault{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Annihilators are Iron Grenadier helipack troopers who descend from the sky. Fast and aggressive, they strike anywhere on the battlefield.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Helipack Drop: deploys from the air anywhere on the map{NEWLINE}{NEWLINE}\"Incoming!\""
  STR_ART_T_A_R_G_A_T: "T.A.R.G.A.T."
  STR_ART_T_A_R_G_A_T_TEXT: "T.A.R.G.A.T.{NEWLINE}Elite troop{NEWLINE}Specialty: Trans-atmospheric rapid global assault trooper{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}T.A.R.G.A.T.s are trans-atmospheric assault troopers who arrive from orbit. Elite and well-armored, they reinforce the battle at critical moments.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Orbital Drop: arrives mid-battle as reinforcements{NEWLINE}{NEWLINE}\"Drop complete.\""
  STR_ART_NIGHT_CREEPERS: "Night Creepers"
  STR_ART_NIGHT_CREEPERS_TEXT: "NIGHT CREEPERS{NEWLINE}Elite troop{NEWLINE}Specialty: Martial arts; Espionage{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Night Creepers are ninja mercenaries who sell their skills to Cobra. Silent and invisible in darkness, they strike when least expected.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Night Stalkers: invisible in darkness until adjacent{NEWLINE}{NEWLINE}\"...\""
  STR_ART_NIGHT_CREEPER_LEADER: "Night Creeper Leader"
  STR_ART_NIGHT_CREEPER_LEADER_TEXT: "NIGHT CREEPER LEADER{NEWLINE}Elite troop{NEWLINE}Specialty: Night-Creeper commander; Martial arts; Espionage; Business{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}The Night Creeper Leader commands the ninja mercenaries in battle. Cunning and silent, he positions his troops for ambush.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Ambush Order: every Night Creeper starts hidden (officer type){NEWLINE}{NEWLINE}\"Wait. Now.\""
  STR_ART_RED_NINJAS: "Red Ninjas"
  STR_ART_RED_NINJAS_TEXT: "RED NINJAS{NEWLINE}Elite troop{NEWLINE}Specialty: Martial arts; Assassination; Covert operations{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}The Red Ninjas are a clan of assassins who serve Cobra for pay. Agile and deadly, they vanish in smoke and reappear behind you.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Smoke Bomb: vanishes and repositions once per battle{NEWLINE}{NEWLINE}\"Gone.\""
  STR_ART_NINJA_VIPER: "Ninja-Viper"
  STR_ART_NINJA_VIPER_TEXT: "NINJA-VIPER{NEWLINE}Elite troop{NEWLINE}Specialty: Ninja; sabotage{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Ninja-Vipers are Cobra troopers trained in ninja arts. Quiet and lethal, they take down sentries without raising alarm.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Silent Takedown: a melee kill that doesn't alert anyone nearby{NEWLINE}{NEWLINE}\"Silence.\""
  STR_ART_ALLEY_VIPER: "Alley Viper"
  STR_ART_ALLEY_VIPER_TEXT: "ALLEY VIPER{NEWLINE}Elite troop{NEWLINE}Specialty: Urban assault and warfare{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Alley Vipers are Cobra's urban assault troopers, armored and equipped with riot shields. Tough and methodical, they breach doors and hold streets.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Riot Shield: carries cover and can breach doors{NEWLINE}{NEWLINE}\"Push forward.\""
  STR_ART_HEADHUNTER_STORMTROOPERS: "Headhunter Stormtroopers"
  STR_ART_HEADHUNTER_STORMTROOPERS_TEXT: "HEADHUNTER STORMTROOPERS{NEWLINE}Elite troop{NEWLINE}{NEWLINE}DOSSIER{NEWLINE}Headhunter Stormtroopers are the armed enforcers of Headman's criminal syndicate. Brutal and well-armed, they suppress opponents with fire.{NEWLINE}{NEWLINE}IN THE FIELD{NEWLINE}Squad ability: Suppression: pins a Joe so he loses his next action{NEWLINE}{NEWLINE}\"Nobody moves.\""
