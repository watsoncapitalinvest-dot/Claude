<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cobra Economy Simulator</title>
<style>
:root {
  --bg: #12161b; --panel: #1b2128; --panel2: #232b33; --line: #33404c; --ink: #e8ecef; --mute: #93a1ad;
  --olive: #8a9a5b; --gold: #d8b45a; --red: #d0453a; --blue: #4b8ed8; --green: #5fb06a;
  --s1: #9aa5ad; --s2: #5fb06a; --s3: #d8b45a; --s4: #d0453a;
  --k1: #e8ecef; --k2: #9aa5ad; --k3: #d0453a; --k4: #d8b45a; --k5: #4b8ed8; --k6: #b06fd8;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid var(--line); background: #0d1014; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 17px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
header .sub { color: var(--mute); font-size: 12px; }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab { background: var(--panel); border: 1px solid var(--line); color: var(--mute); padding: 7px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
.tab.on { color: var(--ink); border-color: var(--olive); background: #26301f; }
main { display: grid; grid-template-columns: 360px 1fr; min-height: calc(100vh - 58px); }
@media (max-width: 900px) { main { grid-template-columns: 1fr; } }
aside { border-right: 1px solid var(--line); padding: 14px 16px; overflow-y: auto; max-height: calc(100vh - 58px); background: var(--panel); }
@media (max-width: 900px) { aside { max-height: none; border-right: 0; border-bottom: 1px solid var(--line); } }
section.out { padding: 16px 20px; overflow-x: auto; }
label.f { display: block; margin: 9px 0 2px; font-size: 12px; color: var(--mute); }
select, input[type=number] { width: 100%; background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; font: inherit; }
.row { display: grid; grid-template-columns: 1fr 70px; gap: 8px; align-items: center; margin: 5px 0; }
.row span { font-size: 12.5px; }
.row span small { display: block; color: var(--mute); font-size: 11px; line-height: 1.3; }
.row input { padding: 4px 6px; text-align: right; }
.row input.changed { border-color: var(--gold); color: var(--gold); }
details { margin: 10px 0; border: 1px solid var(--line); border-radius: 6px; background: #161b21; }
details > summary { cursor: pointer; padding: 7px 10px; font-weight: 600; font-size: 12.5px; letter-spacing: .03em; color: var(--olive); }
details > div { padding: 2px 10px 10px; }
.grid { display: grid; gap: 4px; font-size: 11.5px; }
.grid input { padding: 3px 4px; text-align: right; font-size: 11.5px; }
.grid .h { color: var(--mute); text-align: right; }
.btns { display: flex; gap: 8px; margin: 14px 0 6px; position: sticky; bottom: 0; background: var(--panel); padding: 8px 0; }
button.go { flex: 1; background: var(--olive); color: #111; border: 0; border-radius: 6px; padding: 10px; font-weight: 700; letter-spacing: .05em; cursor: pointer; font-size: 14px; }
button.go:hover { background: #9fb06a; }
button.reset { background: transparent; color: var(--mute); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; cursor: pointer; font: inherit; }
.note { color: var(--mute); font-size: 12px; margin: 4px 0 12px; }
.warn { border-left: 3px solid var(--gold); padding: 8px 12px; background: #221e12; color: #e8dcb5; font-size: 12.5px; margin-bottom: 14px; border-radius: 0 6px 6px 0; }
h2 { font-size: 15px; margin: 18px 0 8px; color: var(--ink); letter-spacing: .02em; }
h2:first-child { margin-top: 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; margin-bottom: 10px; }
th, td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--mute); font-weight: 600; font-size: 12px; }
.chip { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
.card h3 { margin: 0 0 8px; font-size: 13px; color: var(--mute); font-weight: 600; letter-spacing: .03em; text-transform: uppercase; }
canvas { width: 100%; height: 230px; display: block; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--mute); margin-top: 6px; }
.bar { display: flex; height: 18px; border-radius: 3px; overflow: hidden; background: var(--panel2); }
.bar div { height: 100%; }
.busy { color: var(--gold); font-size: 13px; }
.cmp { font-size: 11px; color: var(--mute); }
.up { color: var(--red); } .down { color: var(--green); }
.replay { margin-top: 18px; }
.rp-ctl { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; font-size: 12.5px; color: var(--mute); }
.rp-ctl select, .rp-ctl input[type=number] { width: auto; padding: 4px 6px; }
.rp-ctl input[type=range] { flex: 1; min-width: 200px; accent-color: var(--gold); }
.rp-ctl button { background: var(--panel2); color: var(--ink); border: 1px solid var(--line); border-radius: 5px; padding: 5px 12px; cursor: pointer; font: inherit; }
.rp-month { color: var(--gold); font-weight: 700; min-width: 74px; }
.rp-svg { width: 100%; background: #0f1317; border: 1px solid var(--line); border-radius: 8px; display: block; }
.rp-log { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12.5px; columns: 2; column-gap: 24px; }
.rp-log li { margin: 2px 0; break-inside: avoid; }
.rp-log li::before { content: '\25B8 '; color: var(--olive); }
.rp-key { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 11.5px; color: var(--mute); margin-top: 8px; }

</style>
</head>
<body>
<header>
  <h1>Cobra Economy Simulator</h1>
  <span class="sub">G.I. Joe XCOM design desk &middot; runs entirely on this PC, nothing is sent anywhere</span>
  <div class="tabs">
    <button class="tab on" data-mode="act1">Act 1 economy</button>
    <button class="tab" data-mode="split">Supply split (parked design)</button>
    <button class="tab" data-mode="world">Secret war (world)</button>
    <button class="tab" data-mode="intel">Intel cases</button>
  </div>
</header>
<main>
  <aside id="side"></aside>
  <section class="out" id="out"><p class="note">Pick a scenario, change any number, press RUN.</p></section>
</main>
<script>
/*__SIM__*/
</script>
<script>
const MODES = {
  act1: {
    title: 'Act 1 economy', defaults: SIM.ACT1_DEFAULTS, scenarios: SIM.ACT1_SCENARIOS, run: SIM.act1, styles: SIM.ACT1_STYLES,
    intro: 'Cobra\'s Act 1 as designed and built: sites, funds, materiel, research, crime, the Terror Drome, and the M.A.R.S. leak from Joe purchases. Same rules as story_tools/act1_cobra_sim_v6.py. One fund = $1,000.',
    groups: [
      ['Run', ['runs', 'months', 'seed']],
      ['The Terror Drome', ['dromeCost', 'donorStep', 'dromeFrom', 'startBuildingAt', 'minBuildMonths']],
      ['M.A.R.S. supply leak', ['leakPct']],
      ['Cobra at the start', ['startFunds', 'startMateriel', 'startFronts', 'startDepots', 'startCells', 'hiddenFindMult', 'offmapBenches']],
      ['Crime, terror and cells', ['crimeOdds', 'crimePays', 'terrorFirstMonth', 'terrorPreDrome', 'terrorPerDrome', 'cellStrikeFrom', 'cellStrikeOdds', 'cellGoal']],
      ['Network and defences', ['defenceCost', 'transferFrom', 'transferTargetSites', 'transferPerMissing', 'bNeedsMonths', 'wellSupplied', 'buildStart', 'pushPastLatest']],
    ],
    tables: [['Cobra sites', ['front', 'factory', 'camp', 'depot', 'lab', 'broadcast', 'drome'], ['cost', 'funds', 'uf', 'mat', 'um', 'mc', 'benches', 'odds', 'loot'],
              {cost: 'cost', funds: 'income', uf: 'upkeep', mat: 'makes', um: 'uses mat', mc: 'mat cost', benches: 'benches', odds: 'build %', loot: 'raid loss'}],
             ['Player styles', SIM.ACT1_STYLES, ['find', 'raids', 'factory', 'intercept', 'respond', 'assault', 'spine', 'spend'],
              {find: 'find', raids: 'raids/mo', factory: 'hit fact.', intercept: 'intercept', respond: 'respond', assault: 'assault', spine: 'Drome found mo', spend: 'buys $k/mo'}]],
  },
  split: {
    title: 'Supply split', defaults: SIM.SPLIT_DEFAULTS, scenarios: SIM.SPLIT_SCENARIOS, run: SIM.split, styles: SIM.SPLIT_STYLES,
    intro: 'The parked design (COBRA_SUPPLY_SPLIT_v1): six stocks, producers as separate sites, a hub per region, standing orders shipped by van, all-or-nothing shortages with a sidearms floor, emergency shipments and pull-back. Every number here is a first guess: this mode is for exploring, not for verdicts.',
    groups: [
      ['Run', ['runs', 'months', 'seed', 'regions', 'garrisons', 'destroMonth']],
      ['Money', ['startFunds', 'regionIncome', 'producerUpkeep', 'rebuildMonths', 'rebuildCost']],
      ['Men and guns (the thesis)', ['manpowerPriority', 'startMen', 'garrisonCap', 'campRecruits', 'recruitCost', 'fundsReserve', 'menLostCobraBattle', 'menLostJoeRaid', 'tierCost']],
      ['Distribution', ['shipFraction', 'ticksPerMonth', 'postureWeight', 'attackPlanBonus', 'underAttackBonus', 'vanSpot']],
      ['Fighting', ['cobraMissions', 'floor']],
      ['Death spiral', ['emergencyThreshold', 'emergencyLoadBattles', 'pullbackEmptyStocks', 'pullbackMonths', 'quietFactor']],
    ],
    tables: [['Per stock', ['produce', 'unitCost', 'upkeep', 'battleNeed', 'battleWants', 'startStock'], SIM.STOCKS, null, true],
             ['Player styles', SIM.SPLIT_STYLES, ['raids', 'ambush', 'intercept', 'intelBoost'],
              {raids: 'raids/mo', ambush: 'ambush', intercept: 'intercept', intelBoost: 'intel x'}]],
  },
};
MODES.world = {
    title: 'Secret war', defaults: SIM.WORLD_DEFAULTS, scenarios: SIM.WORLD_SCENARIOS, run: SIM.world, styles: SIM.WORLD_STYLES,
    intro: 'COBRA_WORLDWIDE_v1: Cobra is in every country from day one, the Joes US-only. Leaks fill a worldwide count; the reveal (Cobra takes Sierra Gordo, goes public, M.A.R.S. joins) fires when the count is full and the floor has passed, or at the ceiling whatever the player did. Abroad runs on its own budget. After the reveal: M.A.R.S. imports arm Sierra Gordo with lasers, and the Joes strike the sites they know. First-guess numbers.',
    groups: [
      ['Run', ['runs', 'months', 'seed']],
      ['The reveal', ['revealThreshold', 'revealFloor', 'revealCeiling']],
      ['Covert operations and leaks', ['covertSuccess', 'covertCaught', 'covertMarks', 'paperworkPerRaid', 'paperworkMarks', 'interrogationPerCapture', 'interrogationMarks', 'liaisonPerMonth', 'newsPerMonth']],
      ['Cobra abroad (offstage)', ['startSitesAbroad', 'growthPerMonth', 'capSitesAbroad', 'sgStartSites', 'sgGrowthPerMonth', 'sgCap', 'sgStartMen', 'sgMenPerMonth']],
      ['After the reveal', ['importsPerMonth', 'importLoad', 'importInterceptBase', 'importInterceptPerPaperwork', 'importInterceptMax', 'cellsPerLaserMan', 'regrowAfterReveal', 'findUnknownPerOp']],
    ],
    tables: [['Leak points', ['points'], SIM.LEAKS, null, true],
             ['Player styles', SIM.WORLD_STYLES, ['ops', 'raids', 'captures', 'strikes', 'goodwill'],
              {ops: 'spy ops/mo', raids: 'US raids/mo', captures: 'captures/mo', strikes: 'strikes abroad/mo', goodwill: 'goodwill x'}]],
};
MODES.intel = {
    title: 'Intel cases', defaults: SIM.INTEL_DEFAULTS, scenarios: SIM.INTEL_SCENARIOS, run: SIM.intel, styles: SIM.INTEL_STYLES,
    intro: 'INTEL_CASES_v1: missions bring things home; at the debrief the player chooses what to send to Intel. Each item opens a case and waits for an analyst (one case a month each). Whether it pays depends on the source. A hit is a key Act 1 clue, a lead to raid, or a name for an intel Joe to chase. Leads age; whether Cobra really moved is hidden and likelier when it is alert. A missed key clue comes back by another road, late. Every run tries all three sending policies. Not modelled yet: disinformation, informants, the traffic scan.',
    groups: [
      ['Run', ['runs', 'months', 'seed']],
      ['Analysts', ['analystsStart', 'analystShare', 'casesPerAnalyst']],
      ['What a hit is', ['keyChance', 'leadChance', 'keyEarly', 'keyGrace']],
      ['Field work (intel Joes)', ['joeJobsPerMonth', 'namePays', 'joeCaught', 'joeHeldMonths']],
      ['The shared squad', ['cobraMoves', 'cobraMovesGrowth', 'answerFirst']],
      ['Leads with a target', ['keyLeadChance', 'dropSideOnKey']],
      ['Leads and old intel', ['staleAfter', 'moveQuiet', 'moveAlert', 'alertRaids', 'trapShare', 'raidCaptures']],
    ],
    tables: [['What a mission brings home', SIM.INTEL_SOURCES, ['perMission', 'pays', 'send_pick', 'send_little', 'key', 'leads', 'from'],
              {perMission: 'per mission', pays: 'pays (0-1)', send_pick: 'sent: pick', send_little: 'sent: little', key: 'key clue (blank = normal)', leads: 'extra leads', from: 'from month'}, true, 'bring.'],
             ['Key clues: due month', ['keyDue'], ['0', '1', '2', '3', '4', '5'], {0: 'routes', 1: 'depot', 2: 'depot 2', 3: 'rumours', 4: 'Drome', 5: 'M.A.R.S.'}, true],
             ['Player styles', SIM.INTEL_STYLES, ['squad', 'squadGrowth', 'seatsPerMonth', 'joeEvery'],
              {squad: 'squad sorties/mo', squadGrowth: 'squad added/mo', seatsPerMonth: 'new seats/mo', joeEvery: 'new intel Joe every (mo)'}]],
};
const LABEL = {
  runs: ['Runs per player style', 'More runs = steadier numbers, slower.'], months: ['Months simulated', ''], seed: ['Random seed', 'Same seed + same numbers = same result.'],
  dromeCost: ['Terror Drome cost', 'funds'], donorStep: ['Backers\' money per month', 'added each month past the Drome month, cumulative'],
  dromeFrom: ['Drome planning starts (month)', ''], startBuildingAt: ['Start building at', 'share of the cost saved'], minBuildMonths: ['Minimum build time (months)', ''],
  leakPct: ['Leak: % of Joe purchases to Cobra', 'AMMO_SUPPLY_v1 is 25'],
  startFunds: ['Starting funds', ''], startMateriel: ['Starting materiel', ''], startFronts: ['Hidden front companies', ''], startDepots: ['Hidden depots', ''], startCells: ['Hidden cells', ''],
  hiddenFindMult: ['Hidden sites: find multiplier', ''], offmapBenches: ['Off-map research benches', 'Cobra Commander\'s own lab'],
  crimeOdds: ['Crime chance per front/cell a month', ''], crimePays: ['A robbery that gets away pays', 'funds'], terrorFirstMonth: ['First terror possible (month)', ''],
  terrorPreDrome: ['Terror chance a month, no Drome', ''], terrorPerDrome: ['Terror chance a month, per Drome', ''], cellStrikeFrom: ['Cell strikes from (month)', ''],
  cellStrikeOdds: ['Cell strike chance per cell a month', ''], cellGoal: ['Cell purse that opens a front', 'funds'],
  defenceCost: ['Defences for a found site', 'funds; then it takes 2 raids'], transferFrom: ['Network transfers from (month)', ''], transferTargetSites: ['Transfers keep a region at', 'working sites'],
  transferPerMissing: ['Transfer per missing site', 'funds'], bNeedsMonths: ['Ending B: network broken for (months)', ''], wellSupplied: ['Well supplied at (materiel)', ''],
  buildStart: ['Cobra builds from (month)', ''], pushPastLatest: ['Research push past the latest month', 'x'],
  regions: ['Regions', ''], garrisons: ['Garrison sites per region', ''], destroMonth: ['Destro joins (month)', 'cells only from then'],
  regionIncome: ['Income per region a month', 'funds'], producerUpkeep: ['Producer upkeep a month', 'funds per site'], rebuildMonths: ['Raided producer down for (months)', ''], rebuildCost: ['Rebuild cost', 'funds'],
  shipFraction: ['Hub ships this share each tick', 'standing orders'], ticksPerMonth: ['Delivery rounds a month', ''], postureWeight: ['Base share weight (posture)', ''],
  attackPlanBonus: ['Share bonus: staging an attack', ''], underAttackBonus: ['Share bonus: under attack', ''], vanSpot: ['Chance a van is spotted', 'before the intel multiplier'],
  cobraMissions: ['Cobra missions per region a month', 'battles that draw stock'], floor: ['Sidearms floor', 'bullets and guns never run out'],
  emergencyThreshold: ['Emergency when region stock below', 'x one battle\'s need'], emergencyLoadBattles: ['Emergency load', 'battles\' worth; 0 = none'],
  pullbackEmptyStocks: ['Pull back when this many stocks empty', 'missiles, vehicles, aircraft'], pullbackMonths: ['Quiet for (months)', ''], quietFactor: ['Missions while quiet', 'x normal'],
  strategy: ['Player strategy', ''],
  revealThreshold: ['Worldwide count that brings the reveal', 'points'], revealFloor: ['Reveal no earlier than (month)', 'floor'], revealCeiling: ['Reveal happens anyway at (month)', 'ceiling: every outcome has a version'],
  covertSuccess: ['Covert op succeeds', 'chance'], covertCaught: ['Covert op: spy caught', 'chance'], covertMarks: ['A success marks a site abroad', 'chance'],
  paperworkPerRaid: ['US raid finds foreign paperwork', 'chance'], paperworkMarks: ['Paperwork marks a site', 'chance'], interrogationPerCapture: ['A prisoner talks', 'chance per capture'],
  interrogationMarks: ['A talking prisoner marks a site', 'chance'], liaisonPerMonth: ['Liaison report a month', 'chance, x goodwill'], newsPerMonth: ['News item a month', 'chance'],
  startSitesAbroad: ['Cobra sites per region at the start', ''], growthPerMonth: ['New sites per region a month', 'before the reveal'], capSitesAbroad: ['Most sites per region', 'not too big'],
  sgStartSites: ['Sierra Gordo sites at the start', ''], sgGrowthPerMonth: ['Sierra Gordo new sites a month', ''], sgCap: ['Sierra Gordo most sites', ''],
  sgStartMen: ['Sierra Gordo men at the start', ''], sgMenPerMonth: ['Sierra Gordo men added a month', 'until the reveal'],
  importsPerMonth: ['M.A.R.S. cargoes a month', 'after the reveal'], importLoad: ['Laser cells per cargo', ''], importInterceptBase: ['Intercept chance', 'base'],
  importInterceptPerPaperwork: ['Intercept chance per paperwork found', 'intel pays'], importInterceptMax: ['Intercept chance at most', ''],
  cellsPerLaserMan: ['Cells to arm one man with a laser', ''], regrowAfterReveal: ['Cobra new sites a month after the reveal', 'per region'], findUnknownPerOp: ['Op finds a new site after the reveal', 'chance'],
  analystsStart: ['Analyst seats on Day 1', 'the rooms\' seats'], analystShare: ['Share of analysts on cases', 'the rest do research'], casesPerAnalyst: ['Cases one analyst works a month', ''],
  keyChance: ['A hit is the next key clue', 'chance, once that clue is due'], leadChance: ['A hit is a lead to raid', 'chance; the rest are names'],
  keyEarly: ['A key clue can be found this early', 'months before it is due'], keyGrace: ['A missed key clue comes back after', 'months past due, by another road'],
  joeJobsPerMonth: ['Names one intel Joe chases a month', ''], namePays: ['A name pays', 'chance; else a regular guy asleep'], joeCaught: ['Intel Joe caught on a job', 'chance'], joeHeldMonths: ['A caught Joe is out for (months)', ''],
  cobraMoves: ['Cobra moves a month', 'terror, robberies, outpost attacks; busy and quiet months'], cobraMovesGrowth: ['Cobra moves added each month', ''],
  keyLeadChance: ['A lead points at the key clue he is after', 'chance; raided first'], dropSideOnKey: ['Let old side leads go once a key clue lands', '1 = yes'],
  answerFirst: ['Answer Cobra first', '1 = always; 0 = leads first while any wait'],
  staleAfter: ['Intel counts as old after (months)', 'the warning: time only'], moveQuiet: ['Cobra moves a site a month, quiet', 'hidden'], moveAlert: ['Cobra moves a site a month, alert', 'hidden'],
  alertRaids: ['Cobra is alert after this many raids', 'in the last 2 months'], trapShare: ['A moved site is a trap', 'share; the rest are empty'], raidCaptures: ['A good raid takes an officer', 'chance; he is sent to Intel next month'],
  manpowerPriority: ['Cobra priority: men vs better guns', '1 = all spare money to men first; the thesis is 0.9'], startMen: ['Men per garrison at the start', ''],
  garrisonCap: ['Most men a garrison holds', ''], campRecruits: ['Recruits a region can train a month', 'its training camp'], recruitCost: ['Cost per recruit', 'funds'],
  fundsReserve: ['Cash Cobra keeps back', 'funds per region'], menLostCobraBattle: ['Men lost in a Cobra mission', ''], menLostJoeRaid: ['Men lost to a Joe raid', ''],
  tierCost: ['Cost of the next gun tier', 'x the tier number, per region; the calendar still caps it'],
};
const STYLE_COL = {absent: 'var(--s1)', cautious: 'var(--s2)', typical: 'var(--s3)', aggressive: 'var(--s4)'};
const STOCK_COL = {bullets: 'var(--k1)', guns: 'var(--k2)', missiles: 'var(--k3)', vehicles: 'var(--k4)', aircraft: 'var(--k5)', cells: 'var(--k6)'};
const VERSION_COL = {'A: Drome assault (finished)': '#5fb06a', 'A: Drome assault (unfinished)': '#9fd08a', 'B: network broken': '#4b8ed8', 'Drome strike': '#d0453a'};
let mode = 'act1', params = {}, baseline = {act1: null, split: null, world: null, intel: null};
const clone = o => JSON.parse(JSON.stringify(o));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v.replace(/var\((--[^)]+)\)/, '$1')).trim() || v;

function build() {
  const M = MODES[mode], side = document.getElementById('side');
  params = clone(M.defaults);
  let h = `<p class="note">${M.intro}</p><label class="f">Scenario</label><select id="scen">` +
    Object.keys(M.scenarios).map(k => `<option>${k}</option>`).join('') + `</select>`;
  if (mode === 'split') h += `<label class="f">Player strategy</label><select id="strategy">${['balanced', 'producers', 'missileWorks', 'hub', 'vans', 'strangle'].map(s => `<option value="${s}">${{balanced: 'Balanced', producers: 'Hit producers', missileWorks: 'Hit the missile works', hub: 'Hit the hub', vans: 'Hunt vans', strangle: 'Strangle region 1'}[s]}</option>`).join('')}</select>`;
  for (const [g, keys] of M.groups) {
    h += `<details ${g === 'Run' || g === 'The Terror Drome' || g === 'Money' ? 'open' : ''}><summary>${g}</summary><div>`;
    for (const k of keys) { const [lab, help] = LABEL[k] || [k, '']; h += `<div class="row"><span>${lab}${help ? `<small>${help}</small>` : ''}</span><input type="number" step="any" data-k="${k}"></div>`; }
    h += `</div></details>`;
  }
  if (mode === 'intel') h += `<label class="f">Sending policy (for the map replay)</label><select id="policy">${SIM.INTEL_POLICIES.map(p => `<option value="${p}" ${p === 'pick' ? 'selected' : ''}>${{everything: 'Send everything', pick: 'Pick and choose', little: 'Send little'}[p]}</option>`).join('')}</select>`;
  for (const [title, rows, cols, names, byStockRows, pre] of M.tables) {
    h += `<details><summary>${title}</summary><div><div class="grid" style="grid-template-columns: 74px repeat(${cols.length}, 1fr)"><span></span>` +
      cols.map(c => `<span class="h">${names ? names[c] : c}</span>`).join('');
    for (const r of rows) {
      h += `<span>${r}</span>` + cols.map(c => `<input type="number" step="any" data-t="${byStockRows ? (pre || '') + r + '.' + c : (title === 'Player styles' ? 'styles.' + r + '.' + c : r + '.' + c)}">`).join('');
    }
    h += `</div></div></details>`;
  }
  h += `<div class="btns"><button class="go" id="go">RUN</button><button class="reset" id="reset">Reset</button></div>`;
  side.innerHTML = h;
  document.getElementById('scen').onchange = applyScenario;
  document.getElementById('go').onclick = run;
  document.getElementById('reset').onclick = () => { document.getElementById('scen').selectedIndex = 0; applyScenario(); };
  if (mode === 'split') document.getElementById('strategy').onchange = e => { params.strategy = e.target.value; };

function line(id, series, unit = '', log = false) {

}

const cross = (x, y, r, c = '#d0453a') => `<path d="M${x - r} ${y - r}L${x + r} ${y + r}M${x + r} ${y - r}L${x - r} ${y + r}" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;

const COLS = ['FRONT', 'CELL', 'DEPOT', 'FACTORY', 'LAB', 'CAMP', 'BROADCAST', 'DROME'];

    if (s.fort) g += `<path d="M${p.x + p.r} ${p.y - p.r - 4}l7 3v5c0 4-3 6-7 8c-4-2-7-4-7-8v-5z" fill="#d8b45a" stroke="#111" stroke-width="1"/>`;

  if (fr.events.some(e => e.kind === 'terror')) g += `<text x="${W - 20}" y="${H - 16}" text-anchor="end" font-size="13" font-weight="700" fill="#d0453a">TERROR ATTACK</text>`;
  if (fr.end) g += `<rect x="${W / 2 - 230}" y="${H - 44}" width="460" height="30" rx="5" fill="#26301f" stroke="#8a9a5b"/><text x="${W / 2}" y="${H - 24}" text-anchor="middle" font-size="14" font-weight="700" fill="#d8b45a">ACT 1 ENDS: ${esc(fr.end)}</text>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  document.getElementById('rp-mon').textContent = 'Month ' + fr.m;
  logList(fr.events);
  document.getElementById('rp-key').innerHTML = `<span>dashed grey = hidden</span><span>blue outline = built, not found</span><span>solid blue = found by the Joes</span><span>gold ring = new this month</span><span>gold shield = dug in</span><span>gold burst = raided</span><span>red cross = destroyed</span><span>green $ = robbery got away &middot; red $ = stopped</span>`;
}

const SC = {bullets: '#e8ecef', guns: '#9aa5ad', missiles: '#d0453a', vehicles: '#d8b45a', aircraft: '#4b8ed8', cells: '#b06fd8'};
function drawSplit(run, i) {
  const F = run.frames, fr = F[i], K = SIM.STOCKS, nR = fr.regions.length, svg = document.getElementById('rp-svg');
  const PW = 300, gap = 30, W = nR * PW + (nR - 1) * gap + 40, H = 430, need = params.battleNeed;
  let g = `<rect width="${W}" height="${H}" fill="#0f1317"/>`;
  const geo = r => { const x0 = 20 + r * (PW + gap); return {x0, prod: k => ({x: x0 + 30 + K.indexOf(k) * 48, y: 70}), hub: {x: x0 + PW / 2, y: 190}, gar: (j, n) => ({x: x0 + 30 + j * ((PW - 60) / Math.max(1, n - 1)), y: 330})}; };
  fr.regions.forEach((reg, r) => { const G = geo(r);
    g += `<rect x="${G.x0}" y="18" width="${PW}" height="${H - 36}" rx="8" fill="${reg.quiet > 0 ? '#1a1712' : '#141a20'}" stroke="#33404c"/>
      <text x="${G.x0 + 12}" y="38" font-size="12.5" font-weight="700" fill="#e8ecef">Region ${r + 1}</text><text x="${G.x0 + PW - 12}" y="38" text-anchor="end" font-size="11.5" fill="#d8b45a">funds ${Math.round(reg.funds)} &middot; gun tier ${reg.tier}/${fr.cap}</text>`;
    if (reg.quiet > 0) g += `<text x="${G.x0 + PW / 2}" y="${H - 30}" text-anchor="middle" font-size="12" font-weight="700" fill="#d8b45a">QUIET: COBRA HAS PULLED BACK</text>`;
    // producers -> hub
    for (const k of K) { const p = G.prod(k), down = reg.producers[k];
      const live = down === 0, locked = down === -1;
      g += `<line x1="${p.x}" y1="${p.y + 14}" x2="${G.hub.x}" y2="${G.hub.y - 26}" stroke="${live ? SC[k] : '#444'}" stroke-width="${live ? 1.6 : 1}" ${live ? '' : 'stroke-dasharray="3 3"'} opacity="${locked ? .15 : .55}"/>`;
      g += `<rect x="${p.x - 14}" y="${p.y - 14}" width="28" height="28" rx="4" fill="${live ? '#1d252d' : '#151515'}" stroke="${locked ? '#333' : SC[k]}" stroke-width="2" opacity="${locked ? .45 : 1}"/>
        <text x="${p.x}" y="${p.y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="${locked ? '#555' : SC[k]}">${k[0].toUpperCase()}${k === 'cells' ? '' : ''}</text>`;
      if (down > 0) g += cross(p.x, p.y, 10) + `<text x="${p.x}" y="${p.y + 28}" text-anchor="middle" font-size="10" fill="#d0453a">${down} mo</text>`;
      if (locked) g += `<text x="${p.x}" y="${p.y + 28}" text-anchor="middle" font-size="9.5" fill="#666">Destro</text>`;
    }
    // hub with stock bars
    g += icon('HUB', G.hub.x, G.hub.y, 24, {fill: '#1b3d6e', stroke: '#4b8ed8', op: 1}) + `<text x="${G.hub.x}" y="${G.hub.y + 4}" text-anchor="middle" font-size="11" font-weight="700" fill="#e8ecef">HUB</text>`;
    K.forEach((k, j) => { const v = reg.hub[k], h = Math.min(30, Math.log10(1 + v) * 12);
      g += `<rect x="${G.hub.x + 34 + j * 9}" y="${G.hub.y + 14 - h}" width="6" height="${h}" fill="${SC[k]}"/>`; });
    // garrisons and vans
    const n = reg.garrisons.length;
    reg.garrisons.forEach((gs, j) => { const q = G.gar(j, n);
      const vans = fr.vans.filter(v => v.r === r && v.g === j), hit = vans.some(v => v.hit), got = vans.some(v => !v.hit);
      if (vans.length) { g += `<line x1="${G.hub.x}" y1="${G.hub.y + 24}" x2="${q.x}" y2="${q.y - 16}" stroke="${got ? '#c9d2d9' : '#555'}" stroke-width="${got ? 1.4 : 1}" opacity=".55"/>`;
        if (hit) { const mx = (G.hub.x + q.x) / 2, my = (G.hub.y + 24 + q.y - 16) / 2; g += cross(mx, my, 6); } }
      const att = gs.attacked === 2;
      g += `<rect x="${q.x - 13}" y="${q.y - 13}" width="26" height="26" rx="3" fill="#16263a" stroke="${gs.short.length ? '#d0453a' : '#4b8ed8'}" stroke-width="${gs.short.length ? 2.5 : 1.5}"/>`;
      if (att) g += burst(q.x + 13, q.y - 13, 8);
      K.forEach((k, s) => { const has = gs.stock[k] >= need[k], cx = q.x - 12.5 + s * 5, cy = q.y + 22;
        const lock = k === 'cells' && reg.producers.cells === -1;
        g += `<circle cx="${cx}" cy="${cy}" r="2.1" fill="${has ? SC[k] : 'none'}" stroke="${lock ? '#333' : (has ? SC[k] : (gs.short.includes(k) ? '#d0453a' : '#555'))}" stroke-width="1"/>`; });
      g += `<text x="${q.x}" y="${q.y + 4}" text-anchor="middle" font-size="10" fill="#93a1ad">G${j + 1}</text><text x="${q.x}" y="${q.y - 18}" text-anchor="middle" font-size="10.5" font-weight="700" fill="${gs.men ? '#e8ecef' : '#d0453a'}">${gs.men} men</text>`;
    });

  for (const e of fr.events.filter(e => e.kind === 'emergency')) { const a = geo(e.from).hub, b = geo(e.to).hub, mx = (a.x + b.x) / 2;
    g += `<path d="M${a.x} ${a.y - 26}Q${mx} ${a.y - 120} ${b.x} ${b.y - 26}" fill="none" stroke="${SC[e.k]}" stroke-width="2.2" stroke-dasharray="6 4"/>`;
    if (e.hit) g += cross(mx, a.y - 74, 7); }
  for (const e of fr.events.filter(e => e.kind === 'raidHub')) { const G = geo(e.r); g += burst(G.hub.x - 22, G.hub.y - 22, 11); }
  for (const e of fr.events.filter(e => e.kind === 'raidProducer')) { const p = geo(e.r).prod(e.k); g += burst(p.x + 14, p.y - 14, 9); }
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  document.getElementById('rp-mon').textContent = 'Month ' + fr.m;
  const shorts = []; fr.regions.forEach((reg, r) => reg.garrisons.forEach((gs, j) => { if (gs.short.length) shorts.push(`<li>Region ${r + 1}, G${j + 1}: a battle found no ${gs.short.join(', no ')}</li>`); }));
  logList(fr.events.filter(e => e.kind !== 'van'), (fr.events.filter(e => e.kind === 'van').length ? `<li>${fr.events.filter(e => e.kind === 'van').length} supply van(s) ambushed</li>` : '') + shorts.join(''));
  document.getElementById('rp-key').innerHTML = `<span>top row: producers (B G M V A C), red cross = wrecked, months to rebuild</span><span>circle: the region's hub, bars = its stock</span><span>bottom: garrisons; dots = which stocks it holds (filled = enough for a battle)</span><span>red border = a battle there found something missing</span><span>grey lines = this month's van deliveries, red cross = ambushed</span><span>dashed curve = emergency shipment</span><span>gold burst = Joe raid</span><span>men above each garrison; gun tier in the region header</span>`;
}

function showWorld(R, B, scen, ms) {
  const S = SIM.WORLD_STYLES, b = B.res, same = B.res === R, K = SIM.LEAKS;
  let h = `<h2>Secret war &middot; ${scen}</h2><p class="note">${params.runs} campaigns per style over ${params.months} months, ${ms.toFixed(0)} ms. ${same ? 'This run is the baseline.' : `Small numbers compare with the baseline run (${B.scen}).`}</p>`;
  h += `<div class="warn">First-guess numbers (STORY, 17 Nov). The reveal's floor is month ${params.revealFloor}, the ceiling month ${params.revealCeiling}; the worldwide count needed is ${params.revealThreshold}.</div>`;
  h += `<h2>The reveal</h2><table><tr><th>Player style</th><th>Reveal month (median)</th><th>Brought early by the leaks</th><th>Cobra sites abroad at the reveal</th><th>Known to the Joes at the reveal</th><th>Spy operations</th><th>Spies caught</th></tr>`;

    h += `<tr><td><span class="chip" style="background:${STYLE_COL[s]}"></span>${s}</td><td>${f(r.revealMed)}${delta(r.revealMed, o.revealMed, 0, true)}</td><td>${pct(r.earlyPct)}</td><td>${f(r.sitesAtReveal)}${delta(r.sitesAtReveal, o.sitesAtReveal, 0, true)}</td><td>${f(r.knownAtReveal, 1)} (${pct(r.knownPctAtReveal)})${delta(r.knownPctAtReveal, o.knownPctAtReveal, 0)}</td><td>${f(r.ops, 1)}</td><td>${f(r.caught, 1)}</td></tr>`; }
  h += `</table><h2>Where the worldwide count came from (points, average)</h2><table><tr><th>Player style</th>${K.map(k => `<th>${k}</th>`).join('')}</tr>`;
  for (const s of S) h += `<tr><td><span class="chip" style="background:${STYLE_COL[s]}"></span>${s}</td>${K.map(k => `<td>${f(R[s].leakBy[k])}</td>`).join('')}</tr>`;
  h += `</table><h2>After the reveal</h2><table><tr><th>Player style</th><th>M.A.R.S. cargoes</th><th>Intercepted</th><th>Sierra Gordo men with lasers (end)</th><th>Known sites struck</th><th>Cobra sites abroad (end)</th></tr>`;
  for (const s of S) { const r = R[s], o = b[s];
    h += `<tr><td><span class="chip" style="background:${STYLE_COL[s]}"></span>${s}</td><td>${f(r.imports, 1)}</td><td>${f(r.intercepted, 1)} (${pct(r.imports ? r.intercepted * 100 / r.imports : 0)})</td><td>${pct(r.laserEnd)}${delta(r.laserEnd, o.laserEnd, 0, true)}</td><td>${f(r.struck, 1)}</td><td>${f(r.sitesEnd)}</td></tr>`; }
  h += `</table><div class="cards">
    <div class="card"><h3>Worldwide count (median); dotted = the threshold</h3><canvas id="w1"></canvas></div>
    <div class="card"><h3>Month of the reveal (share of campaigns)</h3><canvas id="w2"></canvas></div>
    <div class="card"><h3>Cobra sites abroad (median)</h3><canvas id="w3"></canvas></div>
    <div class="card"><h3>Sites known to the Joes (median)</h3><canvas id="w4"></canvas></div>
    <div class="card"><h3>Sierra Gordo men with lasers, % (median)</h3><canvas id="w5"></canvas></div></div>
    <div class="legend">${S.map(s => `<span><span class="chip" style="background:${STYLE_COL[s]}"></span>${s}</span>`).join('')}</div>`;
  document.getElementById('out').innerHTML = h;
  const ser = k => S.map(s => ({col: css(STYLE_COL[s]), data: R[s].track[k]}));
  line('w1', [...ser('count'), {col: '#93a1ad', data: Array(params.months).fill(params.revealThreshold), dash: true}]);
  line('w2', S.map(s => ({col: css(STYLE_COL[s]), data: R[s].hist.map(x => x * 100 / params.runs)})), '%');
  line('w3', ser('sites')); line('w4', ser('known')); line('w5', ser('laser'), '%');
  replayCard();
}
function drawWorld(run, i) {
  const fr = run.frames[i], W = 1100, H = 470, svg = document.getElementById('rp-svg');
  let g = `<rect width="${W}" height="${H}" fill="#0f1317"/>`;
  // the US and the Pit
  const us = {x: 30, y: 60, w: 250, h: 360};
  g += `<rect x="${us.x}" y="${us.y}" width="${us.w}" height="${us.h}" rx="8" fill="#14201a" stroke="#8a9a5b"/>
    <text x="${us.x + 14}" y="${us.y + 24}" font-size="14" font-weight="700" fill="#e8ecef">United States</text>
    <text x="${us.x + 14}" y="${us.y + 44}" font-size="11.5" fill="#93a1ad">The Pit, Staten Island</text>`;
  const pit = {x: us.x + us.w / 2, y: us.y + 120};
  g += `<circle cx="${pit.x}" cy="${pit.y}" r="26" fill="#26301f" stroke="#8a9a5b" stroke-width="2"/><text x="${pit.x}" y="${pit.y + 5}" text-anchor="middle" font-size="13" font-weight="700" fill="#d8b45a">PIT</text>`;
  const thr = params.revealThreshold, frac = Math.min(1, fr.count / thr);
  g += `<text x="${us.x + 14}" y="${us.y + 200}" font-size="12" fill="#e8ecef">Worldwide count ${Math.round(fr.count)} / ${thr}</text>
    <rect x="${us.x + 14}" y="${us.y + 208}" width="${us.w - 28}" height="12" fill="none" stroke="#93a1ad"/><rect x="${us.x + 16}" y="${us.y + 210}" width="${(us.w - 32) * frac}" height="8" fill="#d8b45a"/>
    <text x="${us.x + 14}" y="${us.y + 244}" font-size="11.5" fill="#93a1ad">Reveal window: months ${params.revealFloor}-${params.revealCeiling}</text>
    <text x="${us.x + 14}" y="${us.y + 266}" font-size="11.5" fill="${fr.spiesHeld ? '#d0453a' : '#93a1ad'}">Joe spies held by Cobra: ${fr.spiesHeld}</text>`;
  if (fr.revealed) g += `<text x="${us.x + 14}" y="${us.y + 300}" font-size="12" font-weight="700" fill="#d0453a">COBRA IS PUBLIC</text><text x="${us.x + 14}" y="${us.y + 318}" font-size="11.5" fill="#93a1ad">the world map is open</text>`;
  else g += `<text x="${us.x + 14}" y="${us.y + 300}" font-size="12" font-weight="700" fill="#8a9a5b">THE SECRET WAR</text><text x="${us.x + 14}" y="${us.y + 318}" font-size="11.5" fill="#93a1ad">Joes: US only; intel abroad</text>`;
  // the regions
  const RW = 245, RH = 175, x0 = 320, pos = {};
  fr.regions.forEach((r, k) => { const x = x0 + (k % 3) * (RW + 18), y = 30 + Math.floor(k / 3) * (RH + 30); pos[r.name] = {x, y, cx: x + RW / 2, cy: y + RH / 2};
    const fallen = r.sg && fr.revealed;
    g += `<rect x="${x}" y="${y}" width="${RW}" height="${RH}" rx="8" fill="${fallen ? '#2a1414' : '#141a20'}" stroke="${fallen ? '#d0453a' : '#33404c'}" stroke-width="${fallen ? 2 : 1}"/>
      <text x="${x + 12}" y="${y + 22}" font-size="13" font-weight="700" fill="#e8ecef">${esc(r.name)}</text>
      <text x="${x + RW - 12}" y="${y + 22}" text-anchor="end" font-size="11" fill="#93a1ad">${r.sites} sites &middot; ${r.known} known</text>`;
    if (fallen) g += `<text x="${x + 12}" y="${y + RH - 12}" font-size="11.5" font-weight="700" fill="#d0453a">FALLEN TO COBRA${fr.laserMen ? ` &middot; ${fr.laserMen}/${fr.sgMen} men with lasers` : ''}</text>`;
    for (let j = 0; j < r.sites; j++) { const cx = x + 22 + (j % 9) * 25, cy = y + 52 + Math.floor(j / 9) * 28, kn = j < r.known;
      g += `<circle cx="${cx}" cy="${cy}" r="8" fill="${kn ? '#2f5f9e' : 'none'}" stroke="${kn ? '#8fbaf0' : (fr.revealed ? '#4b8ed8' : '#7d8a96')}" stroke-width="1.5" ${kn || fr.revealed ? '' : 'stroke-dasharray="3 2"'}/>`; } });
  // M.A.R.S.
  const mars = {x: W - 70, y: H - 30};
  if (fr.revealed) g += `<rect x="${mars.x - 52}" y="${mars.y - 16}" width="104" height="28" rx="5" fill="#2a1414" stroke="#d0453a"/><text x="${mars.x}" y="${mars.y + 3}" text-anchor="middle" font-size="12" font-weight="700" fill="#d0453a">M.A.R.S.</text>`;
  // events
  for (const e of fr.events) {
    const p = e.r && pos[e.r];
    if ((e.kind === 'leak' && e.k === 'covert') || e.kind === 'op' || e.kind === 'caught') { if (!p) continue;
      g += `<path d="M${pit.x + 26} ${pit.y}Q${(pit.x + p.cx) / 2} ${Math.min(pit.y, p.cy) - 60} ${p.cx} ${p.cy}" fill="none" stroke="${e.kind === 'caught' ? '#d0453a' : '#5fb06a'}" stroke-width="1.8" stroke-dasharray="6 4"/>`;
      if (e.kind === 'caught') g += cross(p.cx, p.cy, 8); }
    if (e.kind === 'leak' && e.k === 'paperwork' && p) g += `<path d="M${pit.x} ${pit.y + 26}L${p.cx} ${p.cy}" stroke="#d8b45a" stroke-width="1" stroke-dasharray="2 4" opacity=".8"/>`;
    if (e.kind === 'mark' && p) g += `<circle cx="${p.cx}" cy="${p.cy}" r="22" fill="none" stroke="#d8b45a" stroke-width="2"/>`;
    if (e.kind === 'strike' && p) g += burst(p.x + RW - 26, p.y + 44, 11);
    if (e.kind === 'import' || e.kind === 'intercept') { const sg = pos['Sierra Gordo']; const my = (mars.y + sg.cy) / 2 + (Math.random() * 20 - 10);
      g += `<path d="M${mars.x - 52} ${mars.y}Q${(mars.x + sg.cx) / 2} ${my + 60} ${sg.cx} ${sg.y + RH}" fill="none" stroke="#b06fd8" stroke-width="1.8" stroke-dasharray="6 4"/>`;
      if (e.kind === 'intercept') g += cross((mars.x + sg.cx) / 2, my + 30, 8); }
  }
  if (fr.revealNow) g += `<rect x="${W / 2 - 300}" y="${H / 2 - 24}" width="600" height="46" rx="6" fill="#2a1414" stroke="#d0453a" stroke-width="2"/><text x="${W / 2}" y="${H / 2 + 6}" text-anchor="middle" font-size="17" font-weight="700" fill="#d8b45a">COBRA TAKES SIERRA GORDO AND GOES PUBLIC</text>`;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  document.getElementById('rp-mon').textContent = 'Month ' + fr.m;
  logList(fr.events.filter(e => e.kind !== 'grow' || fr.events.length < 6));
  document.getElementById('rp-key').innerHTML = `<span>dashed grey circle = a Cobra site nobody knows about</span><span>solid blue = known to the Joes</span><span>gold ring = marked this month</span><span>green dashed arc = a covert op abroad; red cross = spy caught</span><span>gold dotted = captured paperwork pointing abroad</span><span>purple = M.A.R.S. cargo to Sierra Gordo; cross = intercepted</span><span>gold burst = a Joe strike abroad</span>`;
}

  for (const p of P) for (const s of S) { const r = R[p][s], o = b[p][s];
    h += `<tr><td><span class="chip" style="background:${POL_COL[p]}"></span>${POL_NAME[p]}</td><td><span class="chip" style="background:${STYLE_COL[s]}"></span>${s}</td><td>${f(r.opened)}</td><td>${pct(r.deadPct)}</td><td>${f(r.wait, 1)}${delta(r.wait, o.wait, 1, true)}</td><td>${f(r.backlogEnd)}${delta(r.backlogEnd, o.backlogEnd, 0, true)}</td><td>${f(r.names, 1)}</td><td>${pct(r.namesPaidPct)}</td><td>${f(r.joesCaught, 1)}</td></tr>`; }
  h += `</table><h2>The shared squad: answering Cobra or chasing leads</h2><table><tr><th>Sending</th><th>Player style</th><th>Cobra moves left unanswered</th><th>Leads raided</th><th>Key clues won by a raid</th><th>Old side leads let go</th><th>Leads still waiting at the end</th><th>On old intel</th><th>Empty (Cobra moved)</th><th>Traps</th></tr>`;
  for (const p of P) for (const s of S) { const r = R[p][s];
    h += `<tr><td><span class="chip" style="background:${POL_COL[p]}"></span>${POL_NAME[p]}</td><td><span class="chip" style="background:${STYLE_COL[s]}"></span>${s}</td><td>${pct(r.unansweredPct)}</td><td>${f(r.leadsActed, 1)}</td><td>${f(r.keyByRaid, 1)} <span class="cmp">of ${f(r.keyRaids, 1)} tried</span></td><td>${f(r.dropped, 1)}</td><td>${f(r.leadsEnd, 1)}</td><td>${pct(r.oldPct)}${delta(r.oldPct, b[p][s].oldPct, 0)}</td><td>${pct(r.emptyPct)}</td><td>${pct(r.trapPct)}</td></tr>`; }
  h += `</table><div class="cards">
    <div class="card"><h3>Key clues found, typical player (median)</h3><canvas id="i1"></canvas></div>
    <div class="card"><h3>Cases waiting for an analyst, typical player (median)</h3><canvas id="i2"></canvas></div>
    <div class="card"><h3>Month all six key clues are in, typical player (share)</h3><canvas id="i3"></canvas></div>
    <div class="card"><h3>Key clues found, pick and choose, by player style</h3><canvas id="i4"></canvas></div></div>
    <div class="legend">${P.map(p => `<span><span class="chip" style="background:${POL_COL[p]}"></span>${POL_NAME[p]}</span>`).join('')} &nbsp; ${S.map(s => `<span><span class="chip" style="background:${STYLE_COL[s]}"></span>${s}</span>`).join('')}</div>`;
  document.getElementById('out').innerHTML = h;
  line('i1', P.map(p => ({col: POL_COL[p], data: R[p].typical.track.keys})));
  line('i2', P.map(p => ({col: POL_COL[p], data: R[p].typical.track.backlog})));
  line('i3', P.map(p => ({col: POL_COL[p], data: R[p].typical.hist.map(x => x * 100 / params.runs)})), '%');
  line('i4', S.map(s => ({col: css(STYLE_COL[s]), data: R.pick[s].track.keys})));
  replayCard();
}
function drawIntel(run, i) {
  const fr = run.frames[i], W = 1100, H = 470, svg = document.getElementById('rp-svg');
  const SRC = {officer: '#d8b45a', papers: '#e8ecef', gear: '#7d8a96', lab: '#5fb06a', villain: '#d0453a'};
  let g = `<rect width="${W}" height="${H}" fill="#0f1317"/>`;
  // the Intel app: three panels
  const panel = (x, w, t, sub) => `<rect x="${x}" y="20" width="${w}" height="${H - 40}" rx="8" fill="#141a20" stroke="#33404c"/><text x="${x + 12}" y="44" font-size="13" font-weight="700" fill="#e8ecef">${t}</text><text x="${x + 12}" y="62" font-size="11" fill="#93a1ad">${sub}</text>`;
  g += panel(20, 330, 'Waiting for an analyst', `${fr.queue.length} cases`);
  g += panel(370, 330, 'Worked this month', `${fr.seats} analysts on cases`);
  g += panel(720, 360, 'The field', `Cobra moves ${fr.moves}, answered ${fr.answered} &middot; ${fr.joes} intel Joe${fr.joes === 1 ? '' : 's'} free${fr.held ? `, ${fr.held} caught` : ''} &middot; Cobra ${fr.alert ? 'ALERT' : 'quiet'} (hidden)`);
  fr.queue.slice(0, 96).forEach((c, k) => { const x = 34 + (k % 12) * 26, y = 80 + Math.floor(k / 12) * 26;
    g += `<rect x="${x}" y="${y}" width="20" height="20" rx="3" fill="none" stroke="${SRC[c.src]}" stroke-width="1.5" opacity="${Math.max(0.35, 1 - c.age * 0.12)}"/>`; });
  if (fr.queue.length > 96) g += `<text x="34" y="${H - 34}" font-size="12" fill="#d0453a">+${fr.queue.length - 96} more waiting</text>`;
  const OUT = {dead: ['#55606b', 'dead end'], key: ['#d8b45a', 'KEY CLUE'], lead: ['#5fb06a', 'lead'], name: ['#4b8ed8', 'name']};
  fr.done.slice(0, 96).forEach((d, k) => { const x = 384 + (k % 12) * 26, y = 80 + Math.floor(k / 12) * 26, [col] = OUT[d.out];
    g += `<rect x="${x}" y="${y}" width="20" height="20" rx="3" fill="${d.out === 'dead' ? 'none' : col}" stroke="${d.out === 'dead' ? '#55606b' : col}" stroke-width="1.5"/>`;
    if (d.out === 'dead') g += `<path d="M${x + 4} ${y + 4}L${x + 16} ${y + 16}M${x + 16} ${y + 4}L${x + 4} ${y + 16}" stroke="#55606b" stroke-width="1.5"/>`;
    g += `<rect x="${x}" y="${y + 17}" width="20" height="3" fill="${SRC[d.src]}"/>`; });
  // the field: leads waiting with their age, names waiting, the key clue track
  g += `<text x="734" y="96" font-size="12" fill="#e8ecef">Leads to raid (age in months; the warning is by time only)</text>`;
  fr.leads.slice(0, 20).forEach((ld, k) => { const a = ld.age, x = 734 + (k % 10) * 33, y = 106 + Math.floor(k / 10) * 32, old = a >= params.staleAfter;
    g += `<rect x="${x}" y="${y}" width="27" height="24" rx="3" fill="${old ? '#3a2a10' : '#1d3322'}" stroke="${old ? '#d8b45a' : '#5fb06a'}" stroke-width="${ld.key ? 3 : 1}"/><text x="${x + 13.5}" y="${y + 16}" text-anchor="middle" font-size="11" fill="#e8ecef">${a}${ld.key ? '*' : ''}</text>`; });
  g += `<text x="734" y="196" font-size="12" fill="#e8ecef">Names waiting for an intel Joe: ${fr.names}</text>`;
  g += `<text x="734" y="236" font-size="12" font-weight="700" fill="#d8b45a">Act 1 key clues: ${fr.keys} of ${SIM.INTEL_KEYS.length}</text>`;
  SIM.INTEL_KEYS.forEach((k, j) => { const y = 252 + j * 28, got = j < fr.keys, road = got && run.keyRoad[j] === 'road';
    g += `<rect x="734" y="${y}" width="332" height="22" rx="4" fill="${got ? (road ? '#24303a' : '#3a3215') : '#11161b'}" stroke="${got ? (road ? '#93a1ad' : '#d8b45a') : '#33404c'}"/>
      <text x="744" y="${y + 15}" font-size="11.5" fill="${got ? '#e8ecef' : '#55606b'}">${got ? k : '???'}</text>${got ? `<text x="1056" y="${y + 15}" text-anchor="end" font-size="11" fill="#93a1ad">month ${run.keyMonth[j]}${road ? ', late, by another road' : ''}</text>` : ''}`; });
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.innerHTML = g;
  document.getElementById('rp-mon').textContent = 'Month ' + fr.m;
  logList(fr.events);
  document.getElementById('rp-key').innerHTML = `<span>box outline colour = source: gold officer, white papers, grey gear, green lab files, red named villain</span><span>waiting boxes fade as they age</span><span>worked: grey cross = dead end, gold = key clue, green = lead, blue = a name</span><span>lead boxes: green = fresh, gold = old (warned); thick with * = points at the key clue he is after; whether Cobra moved is hidden</span><span>key clue bars: gold = found by the Joes, grey = came late by another road</span>`;
}

document.querySelectorAll('.tab').forEach(t => t.onclick = () => { document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t)); mode = t.dataset.mode; stopPlay(); build(); });
build();
</script>
