<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>SCFL Brawler — OpenBOR Test</title>
    <style>
        #loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            color: white;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            white-space: pre-line;
            padding: 1em;
            box-sizing: border-box;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div id="loading-overlay">Loading...</div>
    <div id="game-container">
        <canvas id="canvas" tabindex="1"></canvas>
        <div id="overlay"></div>
        <div id="buttons-overlay"></div>
    </div>
    <!--
        Everything that used to be inline <script> code here now lives in
        real external files (errors.js, config.js). If anything between the
        server and this browser strips or ignores inline script content while
        still executing normal external script files — a filter, a security
        profile, some in-app viewer's sanitizer — an inline version of this
        code would silently never run, and nothing downstream (including
        loading main.js) would ever get a chance to either. There is no
        inline JS left on this page for that failure mode to hit.
    -->
    <script src="content/errors.js?v=7"></script>
    <script src="content/config.js?v=7"></script>
</body>
</html>
