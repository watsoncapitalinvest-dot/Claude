<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCFL SportsCenter · Tuesday Edition</title>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://watsoncapitalinvest-dot.github.io/Claude/scfl-sportscenter.html"/>
<meta property="og:title" content="SCFL SportsCenter · Tuesday Edition"/>
<meta property="og:description" content="Marty 'Two Drinks' Malone runs down every game of the SCFL weekend — with the tape to prove it."/>
<meta property="og:image" content="https://watsoncapitalinvest-dot.github.io/Claude/scfl-broadcast-og.png"/>

<style>
  :root{--gold:#d8b45a;--gold-d:#a8863c;--bg:#0d0d13;--panel:#13131a;--line:rgba(216,180,90,.22);
    --text:#efece4;--dim:#8b8b95;--red:#c20f16;
    --serif:Georgia,'Times New Roman',serif;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
  .wrap{max-width:560px;margin:0 auto;padding:10px 10px 30px}
  .mast{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px}
  .mast .t{font-family:var(--serif);font-weight:900;font-size:19px}
  .mast .t span{color:var(--gold)}
  .epchip{font-size:10px;font-weight:900;letter-spacing:.14em;color:#ffd7d7;background:#3d0e10;border:1px solid #a33;border-radius:8px;padding:4px 9px;text-transform:uppercase}
  .stage{position:relative;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#0a0a10;aspect-ratio:4/4.4}
  @media(min-width:520px){.stage{aspect-ratio:16/12}}

  /* ------- desk scene ------- */
  .desk{position:absolute;inset:0;display:flex;flex-direction:column}
  .studio{position:relative;flex:1;background:
    radial-gradient(120% 90% at 50% 0%,#1c2340 0%,#101425 55%,#0a0c16 100%)}
  .skyline{position:absolute;left:0;right:0;bottom:34%;height:22%;opacity:.5;
    background:linear-gradient(0deg,#0c0f1c 0,#0c0f1c 100%);
    -webkit-mask:repeating-linear-gradient(90deg,#000 0 14px,transparent 14px 20px,#000 20px 42px,transparent 42px 47px);
            mask:repeating-linear-gradient(90deg,#000 0 14px,transparent 14px 20px,#000 20px 42px,transparent 42px 47px)}
  .glow{position:absolute;left:10%;right:10%;bottom:30%;height:3px;background:var(--gold);opacity:.5;filter:blur(3px)}
  .desktop{position:absolute;left:0;right:0;bottom:0;height:34%;
    background:linear-gradient(180deg,#241d10,#161209);border-top:3px solid var(--gold-d)}
  .desktop .plate{position:absolute;left:50%;top:44%;transform:translateX(-50%);
    font-family:var(--serif);font-weight:900;font-size:13px;letter-spacing:.24em;color:var(--gold);white-space:nowrap}
  .anchor{position:absolute;left:50%;bottom:26%;transform:translateX(-50%);width:170px;height:190px}
  .anchor svg{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))}
  .mouth{transform-origin:50% 50%}
  .talk .mouth{animation:flap .16s linear infinite alternate}
  @keyframes flap{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
  .talk .headg{animation:bob 1.1s ease-in-out infinite alternate}
  @keyframes bob{from{transform:rotate(-1.4deg)}to{transform:rotate(1.6deg)}}
  .drink{position:absolute;right:14%;bottom:8%;width:36px;height:48px}
  .drink .liq{transition:height .8s ease, y .8s ease}
  .gamecard{position:absolute;top:8px;right:8px;left:8px;display:none;align-items:center;gap:8px;
    background:rgba(6,6,10,.82);border:1px solid var(--line);border-radius:12px;padding:8px 12px;backdrop-filter:blur(4px)}
  .gamecard.on{display:flex}
  .gamecard img{width:34px;height:34px;border-radius:50%;object-fit:cover}
  .gamecard .nm{font-weight:900;font-size:13px;line-height:1.2}
  .gamecard .sc{margin-left:auto;font-family:var(--serif);font-weight:900;font-size:19px}
  .caption{min-height:86px;background:linear-gradient(180deg,#101018,#0b0b11);border-top:2px solid var(--gold-d);
    padding:10px 14px;display:flex;flex-direction:column;justify-content:center}
  .caption .who{font-size:9.5px;font-weight:900;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;margin-bottom:4px}
  .caption .line{font-family:var(--serif);font-size:15.5px;line-height:1.45;color:var(--text)}

  /* ------- tape scene ------- */
  .tape{position:absolute;inset:0;display:none;background:#000}
  .tape.on{display:block}
  .tape iframe{width:100%;height:100%;border:0}
  .tapetag{position:absolute;bottom:10px;left:10px;z-index:3;font-size:9.5px;font-weight:900;letter-spacing:.18em;
    color:#fff;background:var(--red);border-radius:6px;padding:4px 9px;text-transform:uppercase;
    animation:blink 1.2s steps(2) infinite}
  @keyframes blink{50%{opacity:.55}}

  /* ------- rundown + controls ------- */
  .rundown{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:none}
  .rundown::-webkit-scrollbar{display:none}
  .rchip{flex:0 0 auto;border:1px solid var(--line);border-radius:9px;padding:5px 9px;font-size:10px;font-weight:800;
    color:var(--dim);background:var(--panel);white-space:nowrap}
  .rchip.now{color:#20170a;background:linear-gradient(180deg,var(--gold),var(--gold-d));border-color:var(--gold)}
  .rchip.done{color:var(--text);opacity:.6}
  .controls{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .btn{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font-weight:800;font-size:13px;
    padding:11px 18px;border-radius:11px;cursor:pointer;font-family:var(--sans)}
  .btn.primary{background:linear-gradient(180deg,var(--gold),var(--gold-d));color:#20170a;border-color:var(--gold)}
  .btn:disabled{opacity:.4}
  .status{margin-top:10px;text-align:center;font-size:11px;color:var(--dim)}
  .ticker{margin-top:12px;border:1px solid var(--line);border-radius:10px;background:#0a0a10;overflow:hidden;height:30px;position:relative}
  .ticker .tk{position:absolute;white-space:nowrap;line-height:30px;font-size:11.5px;font-weight:800;color:var(--dim);
    animation:tick 40s linear infinite;padding-left:100%}
  .ticker .tk b{color:var(--gold)}
  @keyframes tick{to{transform:translateX(-100%)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast">
    <div class="t">SCFL <span>SportsCenter</span></div>
    <div class="epchip" id="epchip">Tuesday Edition</div>
  </div>

  <div class="stage" id="stage">
    <!-- desk -->
    <div class="desk" id="desk">
      <div class="studio">
        <div class="skyline"></div><div class="glow"></div>
        <div class="gamecard" id="gamecard">
          <img id="gcLogoH" alt=""><div class="nm" id="gcH"></div>
          <div class="sc" id="gcScore">–</div>
          <div class="nm" id="gcA" style="text-align:right"></div><img id="gcLogoA" alt="">
        </div>
        <div class="anchor" id="anchor">
          <svg viewBox="0 0 170 190">
            <g class="headg" style="transform-origin:85px 92px">
              <ellipse cx="85" cy="52" rx="26" ry="29" fill="#a9714b"/>
              <path d="M59 44 Q85 18 111 44 L108 34 Q85 12 62 34 Z" fill="#3c3730"/>
              <rect x="66" y="44" width="16" height="7" rx="3.5" fill="#191d26"/>
              <rect x="88" y="44" width="16" height="7" rx="3.5" fill="#191d26"/>
              <rect x="81" y="46" width="8" height="3" fill="#191d26"/>
              <ellipse cx="85" cy="66" rx="4" ry="2.6" fill="#8a5a3a"/>
              <rect class="mouth" x="74" y="74" width="22" height="6" rx="3" fill="#5c3325"/>
            </g>
            <path d="M38 190 L44 118 Q60 96 85 96 Q110 96 126 118 L132 190 Z" fill="#23262e"/>
            <path d="M74 96 L85 130 L96 96 L90 92 L85 100 L80 92 Z" fill="#efece4"/>
            <path d="M83 100 L87 100 L91 132 L85 142 L79 132 Z" fill="#b8912f"/>
            <path d="M44 118 L58 100 L70 190 L38 190 Z" fill="#1b1e25"/>
            <path d="M126 118 L112 100 L100 190 L132 190 Z" fill="#1b1e25"/>
          </svg>
        </div>
        <div class="desktop">
          <div class="plate">SCFL SPORTSCENTER</div>
        </div>
        <svg class="drink" id="drink" viewBox="0 0 36 48">
          <rect class="liq" id="liq" x="6" y="40" width="24" height="4" fill="#c47a2c" opacity=".9"/>
          <path d="M4 2 L32 2 L30 46 L6 46 Z" fill="none" stroke="#cfd4dd" stroke-width="2.5" opacity=".85"/>
        </svg>
      </div>
      <div class="caption">
        <div class="who" id="capwho">Marty "Two Drinks" Malone</div>
        <div class="line" id="capline">The Tuesday Edition. Every game. Every grudge. All the tape.</div>
      </div>
    </div>
    <!-- tape -->
    <div class="tape" id="tape">
      <div class="tapetag">▶ SCFL Tape</div>
      <iframe id="tapeframe" title="highlight tape"></iframe>
    </div>
  </div>

  <div class="rundown" id="rundown"></div>
  <div class="controls">
    <button class="btn primary" id="startBtn">▶ Start the show</button>
    <button class="btn" id="skipBtn" disabled>⏭ Next segment</button>
    <button class="btn" id="voiceBtn">🎙️ Voice on</button>
  </div>
  <div class="status" id="status">Gathering the weekend's tape…</div>
  <div class="ticker"><div class="tk" id="tk">SCFL NETWORK · TUESDAY EDITION · MARTY "TWO DRINKS" MALONE</div></div>
</div>

<script>
const $=id=>document.getElementById(id);
const KEYS=['wookieleaks','bigblue','beavereaters','guidohaters','powersofpain','newworldorder',
  'masterjeti','horsecollars','porkchopexpress','machines','stillthecream','gumbas',
  'heavyhitters','lilchops','smokedragons','killerklowns'];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const QPS=new URLSearchParams(location.search);
const WEEK=parseInt(QPS.get('week'))||Math.max(1,Math.floor((Date.now()-new Date('2026-08-04').getTime())/6048e5)+1);
$('epchip').textContent='Tuesday Edition · Wk '+WEEK;
$('tk').textContent='SCFL NETWORK · WEEK '+WEEK+' TUESDAY EDITION · MARTY "TWO DRINKS" MALONE AT THE DESK';

// deterministic weekly pairings
const rng=mulberry32(0xC0FFEE+WEEK*7919);
const order=[...KEYS];
for(let i=order.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
const GAMES=[]; for(let i=0;i<16;i+=2) GAMES.push({h:order[i],a:order[i+1],sum:null});

let LOGOS={};
fetch('scfl-team-logos-resized.json').then(r=>r.ok?r.json():{}).then(j=>{LOGOS=j||{};}).catch(()=>{});

// ---- collect game summaries via hidden broadcast iframes ----
let collected=0;
window.addEventListener('message',ev=>{
  const d=ev.data||{};
  if(d.scfl==='summary'){
    const g=GAMES.find(g=>g.h+'|'+g.a===d.key);
    if(g&&!g.sum){ g.sum=d.data; collected++;
      $('status').textContent='Gathering the weekend\'s tape… '+collected+'/8';
      renderRundown();
      if(collected>=GAMES.length) tapeReady(); }
  }
  if(d.scfl==='done') tapeDone();
});
function collect(i){
  if(i>=GAMES.length) return;
  const g=GAMES[i];
  const f=document.createElement('iframe');
  f.style.cssText='position:absolute;width:2px;height:2px;opacity:0;pointer-events:none';
  f.src='broadcast-demo.html?summary=1&h='+g.h+'&a='+g.a;
  document.body.appendChild(f);
  const done=setInterval(()=>{ if(g.sum){clearInterval(done);f.remove();collect(i+1);} },300);
  setTimeout(()=>{ if(!g.sum){clearInterval(done);f.remove();collect(i+1);} },14000);
}
collect(0);
function tapeReady(){
  $('status').textContent='Tape\'s in. Hit Start the show.';
  buildSegments();
}

// ---- rundown chips ----
function renderRundown(){
  const rd=$('rundown'); rd.innerHTML='';
  GAMES.forEach((g,i)=>{
    const c=document.createElement('div'); c.className='rchip'; c.id='rc'+i;
    c.textContent=g.sum?(g.sum.h.abbr+' '+g.sum.finalH.toFixed(1)+' — '+g.sum.finalA.toFixed(1)+' '+g.sum.a.abbr)
      :(g.h.slice(0,6)+' vs '+g.a.slice(0,6));
    rd.appendChild(c);
  });
}
renderRundown();

// ---- Marty's script ----
const last=n=>n.split(' ').slice(-1)[0];
function gameLines(g,i){
  const s=g.sum, hw=s.finalH>=s.finalA;
  const W=hw?s.h:s.a, L=hw?s.a:s.h;
  const ws=hw?s.finalH:s.finalA, ls=hw?s.finalA:s.finalH;
  const margin=(ws-ls).toFixed(1), total=ws+ls;
  const wtop=(hw?s.topH:s.topA)[0], ltop=(hw?s.topA:s.topH)[0];
  const openers=[
    W.name+' '+ws.toFixed(1)+', '+L.name+' '+ls.toFixed(1)+'. ',
    'Next up: '+W.name+' handled business against '+L.name+', '+ws.toFixed(1)+' to '+ls.toFixed(1)+'. ',
    'Over at '+W.name+' stadium: '+W.name+' '+ws.toFixed(1)+', '+L.name+' '+ls.toFixed(1)+'. '
  ];
  let quip;
  if(ws-ls>=35) quip='That was not a football game, folks, that was a crime scene. Somebody call '+L.name+' next of kin.';
  else if(ws-ls<=5) quip='Decided by '+margin+'. I aged three years watching this one and I was already old.';
  else if(total>=250) quip='A combined '+total.toFixed(1)+' points. Defense is illegal in this league, apparently.';
  else if(total<=170) quip='A rock fight. Ugly. I loved every minute and I saw none of it.';
  else quip=W.name+' by '+margin+'. Not pretty. They all count the same, as my second wife used to say.';
  const stud=wtop?(wtop.name+' led the way with '+wtop.pts.toFixed(1)+' — that\'s '+wtop.line+'. '):'';
  const pity=ltop?('For '+L.name+', '+ltop.name+' gave them '+ltop.pts.toFixed(1)+', and it did not matter one bit. '):'';
  const big=s.big?('The play of the game? '+s.big.plain+' '):'';
  return {
    intro:[openers[i%openers.length]+quip, stud+pity+big+'Roll the tape.'],
    outro:[hw? s.h.name+' win it. '+martyTag(i) : s.a.name+' win it. '+martyTag(i)]
  };
}
function martyTag(i){
  const tags=['On we go.','Moving right along.','What a league.','I need a minute. And a refill.',
    'Somewhere, a commissioner is smiling.','That one\'s going on the wall.','And the wire stays frozen, but that\'s politics.','We roll on.'];
  return tags[i%tags.length];
}
function buildSegments(){
  const played=GAMES.filter(g=>g.sum);
  SEGS.length=0;
  SEGS.push({type:'desk',who:'Marty "Two Drinks" Malone',card:null,lines:[
    'Hellooo again, everybody. Marty "Two Drinks" Malone, live from the SCFL SportsCenter desk in beautiful downtown nowhere.',
    'It is Tuesday, which means the weekend happened, and legally, someone has to explain it. Eight games. All the tape. Let\'s get after it.'
  ]});
  played.forEach((g,i)=>{
    const gl=gameLines(g,i);
    SEGS.push({type:'desk',who:'Marty "Two Drinks" Malone',card:g,lines:gl.intro});
    SEGS.push({type:'tape',g});
    SEGS.push({type:'desk',who:'Marty "Two Drinks" Malone',card:g,lines:gl.outro,drink:(i===3||i===7)});
  });
  // Stud of the week
  let stud=null,studTeam=null,dud=null,dudScore=1e9;
  played.forEach(g=>{
    [[g.sum.topH,g.sum.h],[g.sum.topA,g.sum.a]].forEach(([tops,team])=>{
      if(tops[0]&&(!stud||tops[0].pts>stud.pts)){stud=tops[0];studTeam=team;}
    });
    [[g.sum.finalH,g.sum.h],[g.sum.finalA,g.sum.a]].forEach(([sc,team])=>{
      if(sc<dudScore){dudScore=sc;dud=team;}
    });
  });
  if(stud) SEGS.push({type:'desk',who:'Stud of the Week',card:null,lines:[
    'Your Stud of the Week: '+stud.name+' of the '+studTeam.name+'. '+stud.pts.toFixed(1)+' points. '+stud.line+'.',
    'If you had him on your bench, do not tell anybody. Take it to the grave.']});
  if(dud) SEGS.push({type:'desk',who:'Dud of the Week',card:null,lines:[
    'And the Dud of the Week goes to the '+dud.name+', who scored '+dudScore.toFixed(1)+' points. Total. As a team.',
    'I have personally scored more at a buffet. Somebody check on their manager.']});
  SEGS.push({type:'desk',who:'Marty "Two Drinks" Malone',card:null,lines:[
    'That\'s the weekend, folks. The wins are permanent, the losses are somebody else\'s fault, and the waiver wire is still frozen solid.',
    'For SCFL Network, I\'m Marty "Two Drinks" Malone. The second one\'s for the road. Goodnight, everybody.']});
  $('startBtn').disabled=false;
}
const SEGS=[];

// ---- TTS ----
let voiceOn=true, showTok=0, running=false, segIdx=0, drinkN=0;
$('voiceBtn').addEventListener('click',()=>{ voiceOn=!voiceOn;
  $('voiceBtn').textContent=voiceOn?'🎙️ Voice on':'🔇 Voice off';
  if(!voiceOn&&window.speechSynthesis) speechSynthesis.cancel(); });
function pickVoice(){
  if(!window.speechSynthesis) return null;
  const vs=speechSynthesis.getVoices();
  return vs.find(v=>/en[-_]US/i.test(v.lang)&&/Aaron|Fred|Alex|Daniel|Male|Reed/i.test(v.name))
      ||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;
}
function say(text,tok){
  return new Promise(res=>{
    if(tok!==showTok){res();return;}
    $('capline').textContent=text;
    const est=Math.max(1600,text.split(/\s+/).length*340);
    if(!voiceOn||!window.speechSynthesis){ $('anchor').classList.add('talk');
      setTimeout(()=>{$('anchor').classList.remove('talk');res();},Math.min(est,7000)); return; }
    const u=new SpeechSynthesisUtterance(text);
    u.rate=1.04; u.pitch=0.82; const v=pickVoice(); if(v)u.voice=v;
    let done=false; const fin=()=>{ if(done)return; done=true;
      $('anchor').classList.remove('talk'); res(); };
    u.onend=fin; u.onerror=fin; setTimeout(fin,est*2.2);
    $('anchor').classList.add('talk');
    speechSynthesis.speak(u);
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// ---- show engine ----
let tapeResolve=null;
function tapeDone(){ if(tapeResolve){const r=tapeResolve;tapeResolve=null;r();} }
function showCard(g){
  const gc=$('gamecard');
  if(!g||!g.sum){gc.classList.remove('on');return;}
  const s=g.sum;
  $('gcH').textContent=s.h.abbr; $('gcA').textContent=s.a.abbr;
  $('gcScore').textContent=s.finalH.toFixed(1)+' — '+s.finalA.toFixed(1);
  $('gcLogoH').src=LOGOS[s.h.key]||''; $('gcLogoA').src=LOGOS[s.a.key]||'';
  gc.classList.add('on');
}
function setRun(i){
  document.querySelectorAll('.rchip').forEach(c=>c.classList.remove('now'));
  const gi=Math.floor((i-1)/3);
  const c=$('rc'+gi); if(c&&i>0&&gi<GAMES.length){c.classList.add('now');c.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});}
  document.querySelectorAll('.rchip').forEach((c2,j)=>{ if(j<gi)c2.classList.add('done'); });
}
function pour(){
  drinkN=Math.min(2,drinkN+1);
  const h=drinkN*14;
  $('liq').setAttribute('y',String(44-4-h)); $('liq').setAttribute('height',String(4+h));
}
async function runSeg(seg,tok){
  if(seg.type==='desk'){
    $('tape').classList.remove('on'); $('desk').style.display='flex';
    $('capwho').textContent=seg.who;
    showCard(seg.card);
    if(seg.drink){ pour(); }
    for(const line of seg.lines){ if(tok!==showTok)return; await say(line,tok); await wait(280); }
  } else {
    $('desk').style.display='none'; $('tape').classList.add('on');
    const f=$('tapeframe');
    f.src='broadcast-demo.html?tv=1&hl=1&n=8&spd=2&h='+seg.g.h+'&a='+seg.g.a;
    await new Promise(res=>{ tapeResolve=res;
      const cap=setTimeout(()=>{if(tapeResolve){tapeResolve=null;res();}},75000);
      const watch=setInterval(()=>{ if(tok!==showTok){clearInterval(watch);clearTimeout(cap);
        if(tapeResolve){tapeResolve=null;res();} } },300);
    });
    await wait(tok===showTok?2200:0);
    f.src='about:blank';
  }
}
async function runShow(){
  const tok=++showTok; running=true;
  $('startBtn').textContent='↻ Restart show'; $('skipBtn').disabled=false;
  for(segIdx=0; segIdx<SEGS.length; segIdx++){
    if(tok!==showTok) return;
    setRun(segIdx);
    $('status').textContent='Segment '+(segIdx+1)+' of '+SEGS.length;
    await runSeg(SEGS[segIdx],tok);
  }
  if(tok===showTok){ running=false; $('status').textContent='That\'s the show. Same time next Tuesday.'; }
}
$('startBtn').addEventListener('click',()=>{
  if(window.speechSynthesis){ speechSynthesis.cancel(); speechSynthesis.getVoices(); }
  drinkN=0; $('liq').setAttribute('y','40'); $('liq').setAttribute('height','4');
  document.querySelectorAll('.rchip').forEach(c=>c.classList.remove('done','now'));
  runShow();
});
$('skipBtn').addEventListener('click',()=>{
  if(!running) return;
  if(window.speechSynthesis) speechSynthesis.cancel();
  const tok=++showTok; showTok=tok; // invalidate current awaits
  const next=segIdx+1;
  (async()=>{ // resume from the next segment under a fresh token
    const t2=showTok;
    for(segIdx=next; segIdx<SEGS.length; segIdx++){
      if(t2!==showTok) return;
      setRun(segIdx);
      $('status').textContent='Segment '+(segIdx+1)+' of '+SEGS.length;
      await runSeg(SEGS[segIdx],t2);
    }
    if(t2===showTok){ running=false; $('status').textContent='That\'s the show. Same time next Tuesday.'; }
  })();
});
$('startBtn').disabled=true;
</script>
</body>
</html>
