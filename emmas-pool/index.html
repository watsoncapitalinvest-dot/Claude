<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Emma's Pool Cleaning</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Emma's Pool" />
<meta name="theme-color" content="#0A7C84" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --pool:#15C4BE; --pool-deep:#0A7C84; --pool-dark:#06616a;
    --ink:#08323B; --ink-soft:#3C6670;
    --coral:#FF6F91; --coral-deep:#EE4D77; --gold:#FFC24B; --sun:#FFB02E;
    --sand:#FFF7EC; --mint:#B6F0E6; --palm:#1FA463; --lilac:#9D7BE8;
    --line:rgba(8,50,59,.10); --cloud:#EEFBFA; --white:#fff;
    --disp:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --body:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0c2a30;font-family:var(--body);color:var(--ink);overscroll-behavior:none}
  #frame{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--sand);
    position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.4);display:flex;flex-direction:column}
  #scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  ::-webkit-scrollbar{width:0;height:0}
  button{font-family:var(--body);cursor:pointer;border:none;background:none}
  input,textarea,select{font-family:var(--body);font-weight:700;font-size:16px;color:var(--ink)}
  input,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);
    background:var(--white);outline:none}
  textarea{resize:vertical;font-weight:600;line-height:1.45}
  input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--pool-deep);outline-offset:1px}
  h1,h2,h3{font-family:var(--disp);letter-spacing:-.3px}

  /* header / brand */
  .brand{position:relative;overflow:hidden;background:linear-gradient(160deg,var(--coral) 0%,var(--gold) 42%,var(--pool) 100%)}
  .shimmer{position:absolute;inset:0;background:repeating-linear-gradient(110deg,transparent 0 18px,rgba(255,255,255,.10) 18px 22px);animation:drift 9s linear infinite}
  @keyframes drift{to{background-position:220px 0}}
  .sunorb{position:absolute;top:14px;right:24px;width:54px;height:54px;border-radius:60px;
    background:radial-gradient(circle,#FFF3C9 0%,#FFD66B 58%,rgba(255,214,107,0) 72%)}
  .brand-inner{position:relative;padding:22px 22px 6px}
  .pill{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.22);
    border:1px solid rgba(255,255,255,.4);padding:5px 11px;border-radius:30px;backdrop-filter:blur(4px)}
  .pill span{font-weight:800;font-size:11px;letter-spacing:1.4px;color:#fff}
  .brand-title{font-family:var(--disp);font-weight:800;font-size:30px;line-height:1.02;color:#fff;
    margin-top:12px;letter-spacing:-.5px;text-shadow:0 2px 14px rgba(8,50,59,.25)}
  .brand-sub{font-weight:700;font-size:13.5px;color:rgba(255,255,255,.92);margin-top:4px}
  .wave{display:block;width:100%;height:34px}

  .pagehead{background:linear-gradient(135deg,var(--pool),var(--pool-deep));padding:20px 18px 14px;color:#fff}
  .pagehead h1{font-size:25px;color:#fff;display:flex;align-items:center;gap:10px;font-weight:800}
  .pagehead .ps{font-weight:700;font-size:13px;color:rgba(255,255,255,.88);margin-top:3px}

  .pad{padding:16px 18px 26px}
  .seclabel{font-family:var(--disp);font-weight:700;font-size:12.5px;letter-spacing:.4px;
    color:var(--ink);text-transform:uppercase;margin-bottom:8px}
  .card{background:var(--white);border-radius:18px;border:1.5px solid var(--line);padding:15px 16px}
  .muted{color:var(--ink-soft);font-weight:600}

  .field{display:block;margin-bottom:16px}
  .field>.lab{font-weight:800;font-size:14px;color:var(--ink);margin-bottom:6px}
  .field>.hint{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin:-2px 0 8px}

  .chip{display:inline-flex;align-items:center;gap:6px;padding:9px 13px;border-radius:13px;
    border:1.5px solid var(--line);background:var(--white);color:var(--ink-soft);font-weight:800;font-size:13.5px;transition:.12s}
  .chip.on{border-color:var(--pool);background:var(--cloud);color:var(--pool-deep);box-shadow:0 2px 0 var(--pool)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}

  .selcard{text-align:left;padding:18px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--white);width:100%}
  .selcard.on{border:2px solid var(--pool);background:var(--cloud);box-shadow:0 4px 0 rgba(21,196,190,.33)}
  .selcard .t{font-family:var(--disp);font-weight:700;font-size:15.5px}
  .selcard.on .t{color:var(--pool-deep)}
  .selcard .s{font-weight:600;font-size:12.5px;color:var(--ink-soft);margin-top:3px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;width:100%;
    padding:15px 18px;border-radius:16px;font-family:var(--disp);font-weight:700;font-size:16px}
  .btn-primary{background:var(--pool-deep);color:#fff;box-shadow:0 4px 0 var(--pool-dark)}
  .btn-ghost{background:var(--white);color:var(--ink-soft);box-shadow:inset 0 0 0 1.5px var(--line)}
  .btn-aqua{background:linear-gradient(135deg,var(--pool),var(--pool-deep));color:#fff;box-shadow:0 5px 0 var(--pool-dark)}
  .btn-coral{background:linear-gradient(135deg,var(--coral),var(--coral-deep));color:#fff;box-shadow:0 5px 0 #c93760}
  .btn:disabled{opacity:.45}

  .dot{width:9px;height:9px;border-radius:9px;display:inline-block}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* tab bar */
  .tabbar{display:flex;align-items:flex-end;background:var(--white);border-top:1px solid var(--line);
    padding:8px 8px;padding-bottom:max(10px,env(safe-area-inset-bottom))}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;background:none}
  .tab .lb{font-weight:800;font-size:10.5px}
  .fab{width:56px;height:56px;border-radius:20px;margin-top:-28px;
    background:linear-gradient(135deg,var(--coral),var(--coral-deep));box-shadow:0 6px 16px rgba(255,111,145,.5);
    display:grid;place-items:center}

  .iconbtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center}
  .topbar{display:flex;align-items:center;gap:12px;padding:16px 18px;color:#fff}
  .topbar.aqua{background:linear-gradient(135deg,var(--pool),var(--pool-deep))}

  .float{animation:floaty 2.4s ease-in-out infinite}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){.shimmer,.float{animation:none!important}}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;font-size:14px;
    opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:88%;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .progress{display:flex;gap:5px;padding:14px 22px 4px}
  .progress i{flex:1;height:5px;border-radius:5px;background:var(--line)}
  .progress i.on{background:var(--pool)}

  .article p{font-weight:600;font-size:15px;line-height:1.55;margin-bottom:6px}
  .article h3{font-weight:800;font-size:17px;margin:18px 0 8px}
  .article ul{list-style:none;margin:4px 0 8px}
  .article li{display:flex;gap:9px;margin-bottom:7px;font-weight:600;font-size:14.5px;line-height:1.45}
  .article li .b{width:7px;height:7px;border-radius:7px;margin-top:7px;flex-shrink:0}
  .callout{display:flex;gap:10px;background:#FFF4E0;border:1.5px solid rgba(255,194,75,.4);
    border-radius:14px;padding:12px 14px;margin:10px 0;font-weight:700;font-size:13.5px;line-height:1.45}
</style>
</head>
<body>
<div id="frame">
  <div id="scroll"></div>
  <div id="tabhost"></div>
</div>
<div id="toast" class="toast"></div>

<script>
/* ===================== ICONS ===================== */
const ICONS={
  back:'<path d="M19 12H5M12 19l-7-7 7-7"/>',

  home:'<path d="M3 9.6 12 3l9 6.6M5 10v10h14V10"/>',
  trend:'<path d="M3 17l6-6 4 4 7-7M21 7v5h-5"/>',
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  droplet:'<path d="M12 2.7l5.66 5.66a8 8 0 1 1-11.31 0z"/>',
  sun:'<circle cx="12" cy="12" r="4.4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5.6 5.6 4.2 4.2M19.8 19.8l-1.4-1.4M18.4 5.6l1.4-1.4M4.2 19.8l1.4-1.4"/>',
  flask:'<path d="M9 3h6M10 3v6l-5.2 9.1A2 2 0 0 0 6.5 21h11a2 2 0 0 0 1.7-2.9L14 9V3"/>',
  alert:'<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/>',
  sparkles:'<path d="M12 3l1.9 4.6L18.5 9.5 13.9 11.4 12 16l-1.9-4.6L5.5 9.5l4.6-1.9z"/>',
  clip:'<path d="M9 4h6a1 1 0 0 1 1 1v0a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1v0a1 1 0 0 1 1-1z"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>',
  wrench:'<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.7 2.7-2.4-.6-.6-2.4z"/>',
  bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.7 21a2 2 0 0 1-3.4 0"/>',
  cal:'<path d="M3 5h18v16H3zM3 9h18M8 3v4M16 3v4"/>',
  search:'<circle cx="11" cy="11" r="7.5"/><path d="M21 21l-4.3-4.3"/>',
  calc:'<path d="M5 3h14v18H5zM8 7h8M8 11h2M14 11h2M8 15h2M14 15h2M8 19h2M14 19h2"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>',
  wave:'<path d="M2 12c2 1.5 4-1 6 0s4 1.5 6 0 4-1.5 6 0M2 17c2 1.5 4-1 6 0s4 1.5 6 0 4-1.5 6 0"/>',
  beaker:'<path d="M6 3h12M8 3v6l-3.5 7A2.5 2.5 0 0 0 7 20h10a2.5 2.5 0 0 0 2.5-4L16 9V3M7.5 14h9"/>',
  cloud:'<path d="M17.5 19a4.5 4.5 0 0 0 .5-9 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 6 19z"/>',
  rain:'<path d="M16 13a4 4 0 0 0 .5-8 5.5 5.5 0 0 0-10.5 1.4A3 3 0 0 0 6 13M8 17v2M12 17v3M16 17v2"/>',
  cloudsun:'<circle cx="8" cy="8" r="3"/><path d="M8 1v1M8 14v1M1 8h1M14 8h1M3 3l.7.7M12.3 12.3l.7.7M13 3l-.7.7M3.7 12.3 3 13M18 20a3 3 0 0 0 0-6 4 4 0 0 0-7.6-1A2.6 2.6 0 0 0 10 20z"/>',
  wind:'<path d="M3 8h11a2.5 2.5 0 1 0-2.5-2.5M3 12h16a2.5 2.5 0 1 1-2.5 2.5M3 16h9a2.5 2.5 0 1 1-2.5 2.5"/>',
  thermo:'<path d="M12 4a2 2 0 0 0-2 2v8a4 4 0 1 0 4 0V6a2 2 0 0 0-2-2z"/>',
  download:'<path d="M12 3v12M7 11l5 4 5-4M5 21h14"/>',
  share:'<path d="M12 3v13M8 7l4-4 4 4M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/>',
};
function ic(n,o={}){const s=o.size||22,c=o.color||'currentColor',sw=o.sw||2.3,f=o.fill||'none';
  return `<svg viewBox="0 0 24 24" width="${s}" height="${s}" fill="${f}" stroke="${c}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;}

/* ===================== DATA ===================== */
const RANGES={
  fc:{key:'fc',label:'Free Chlorine',short:'Chlorine',unit:'ppm',min:1,max:3,ideal:'1–3 ppm'},
  ph:{key:'ph',label:'pH',short:'pH',unit:'',min:7.2,max:7.8,ideal:'7.4–7.6'},
  ta:{key:'ta',label:'Total Alkalinity',short:'Alk',unit:'ppm',min:80,max:120,ideal:'80–120 ppm'},
  cya:{key:'cya',label:'Stabilizer (CYA)',short:'CYA',unit:'ppm',min:30,max:50,ideal:'30–50 ppm',saltMin:60,saltMax:80},
  ch:{key:'ch',label:'Calcium Hardness',short:'Calcium',unit:'ppm',min:200,max:400,ideal:'200–400 ppm'},
  salt:{key:'salt',label:'Salt',short:'Salt',unit:'ppm',min:2700,max:3400,ideal:'2700–3400 ppm'},
  temp:{key:'temp',label:'Water Temp',short:'Temp',unit:'°F',min:null,max:null,ideal:'78–82 comfort'},
};
const CORE=['fc','ph','ta','cya','ch'];
const FIX={
  fc:{low:"Free chlorine is low — in strong sun, algae and bacteria move in fast. Add chlorine and retest in a few hours. If it's been low for a couple of days, shock at dusk.",
      high:"Chlorine is high. Stop adding sanitizer and let the sun bring it down. Hold off swimming until it's back to 1–3 ppm."},
  ph:{low:"pH is low (acidic) — stings eyes and slowly eats plaster, grout, and metal. Add soda ash (pH Up), then recheck.",
      high:"pH is high — chlorine gets lazy and scale forms at the waterline. Add acid (pH Down) a little at a time."},
  ta:{low:"Total alkalinity is low, so pH won't hold steady. Add baking soda to build a buffer.",
      high:"Total alkalinity is high — it keeps dragging pH up and can cloud water. Lower it slowly with acid."},
  cya:{low:"Stabilizer is low — the sun burns off your chlorine within hours. Add cyanuric acid / conditioner.",
      high:"Stabilizer is high, making chlorine sluggish. The fix is a partial drain & refill to dilute."},
  ch:{low:"Calcium hardness is low — soft water turns corrosive and etches plaster. Add calcium chloride.",
      high:"Calcium hardness is high — scaling and cloudiness risk. Dilute with fresh water; keep pH/alkalinity in check."},
  salt:{low:"Salt is low, so your generator can't make enough chlorine. Add pool salt per your cell's chart.",
      high:"Salt is high. Dilute with fresh water before adding more next time."},
};
const ACTIONS=['Skimmed surface','Emptied baskets','Brushed walls','Vacuumed','Ran the cleaner','Added chlorine','Added pH Down','Added pH Up','Added baking soda','Added shock','Added algaecide','Added stabilizer','Cleaned filter','Added water','Tested water'];
const CLARITY=['Crystal clear','Slightly cloudy','Cloudy','Green tint','Murky'];
const WEATHER=[['Sunny','sun'],['Partly cloudy','cloudsun'],['Cloudy','cloud'],['Rain','rain'],['Storm','rain'],['Windy','wind']];
const SUNINT=['Low','Medium','High','Scorching'];

const LIBRARY=[
 {id:'ranges',icon:'beaker',tint:'var(--pool)',title:'Ideal Ranges',blurb:'The numbers you\'re aiming for.',body:[
   {h:'Your targets'},
   {table:[['Free Chlorine','1–3 ppm','Your sanitizer. Always keep some present.'],['pH','7.4–7.6','Comfort + lets chlorine work. OK 7.2–7.8.'],['Total Alkalinity','80–120 ppm','The buffer that holds pH steady.'],['Stabilizer (CYA)','30–50 ppm','Sunscreen for chlorine. Salt pools 60–80.'],['Calcium Hardness','200–400 ppm','Protects plaster; too high = scale.'],['Salt (salt pools)','2700–3400 ppm','Check your generator\'s exact target.']]},
   {p:'Correct in this order: alkalinity first, then pH, then chlorine. Alkalinity steadies pH, and pH controls how well chlorine works — so balancing top-down saves you chasing your tail.'},
   {callout:'Always trust your product label over any general number. Brands and salt cells vary.'} ]},
 {id:'chem',icon:'flask',tint:'var(--coral)',title:'Pool Chemicals 101',blurb:'What each bottle and bag does.',body:[
   {h:'Sanitizers (chlorine)'},
   {dl:[['Liquid chlorine','~10–12.5%. Fast, no residue, nudges pH up a touch. Great everyday raiser.'],['Trichlor tablets','Slow-dissolving in a floater. Convenient but adds stabilizer and is acidic — watch CYA and pH.'],['Dichlor granular','Fast, near-neutral pH, adds some stabilizer. Good for a quick boost or shock when CYA is low.'],['Cal-hypo','Strong shock. Adds calcium and raises pH; no stabilizer. Skip if calcium is already high.'],['Salt cell','Makes chlorine from dissolved salt. Still test and balance like any pool.']]},
   {h:'Balancers'},
   {dl:[['pH Up — soda ash','Raises pH (and a little alkalinity).'],['pH Down — acid','Muriatic or dry acid. Lowers pH and alkalinity.'],['Alkalinity Up','Baking soda. Raises alkalinity with little pH change.'],['Stabilizer','Cyanuric acid. Shields chlorine from UV.'],['Calcium Up','Calcium chloride. Raises calcium hardness.']]},
   {h:'Problem solvers'},
   {dl:[['Algaecide','Prevents and helps kill algae. A backup to chlorine, not a replacement.'],['Clarifier','Gathers tiny particles so the filter can catch them.'],['Flocculant','Clumps particles to sink, then you vacuum to waste.'],['Sequestrant','Locks up metals to prevent stains and green tint.']]},
   {callout:'Never mix chemicals, and always add chemical to water — never water to chemical.'} ]},
 {id:'test',icon:'clip',tint:'var(--gold)',title:'Testing Guide',blurb:'How and how often to test.',body:[
   {h:'How often'},{p:'Test chlorine and pH 2–3 times a week — daily in peak heat, heavy use, or while fixing a problem. Check alkalinity, calcium, and stabilizer about weekly.'},
   {h:'Do it well'},{list:['Collect water elbow-deep, away from return jets.','Strips are quick; a drop kit is more accurate for chlorine.','Read against the chart in good daylight.','Always test after rain, a party, or a heat swing.']},
   {callout:'Replace test strips each season — old strips read low and send you chasing problems that aren\'t there.'} ]},
 {id:'prob',icon:'alert',tint:'var(--coral-deep)',title:'Problems & Remedies',blurb:'Cloudy, green, smelly — and the fix.',body:[
   {h:'Cloudy water'},{p:'Usually imbalanced chemistry, weak filtration, or high pH/calcium. Test and rebalance, run the filter longer, clean it, and add clarifier. Shock if chlorine has been low.'},
   {h:'Green water / algae'},{p:'Low chlorine plus sun. Brush every surface, drop pH toward 7.2, shock hard, add algaecide, run the pump 24h. Vacuum the dead algae and repeat if still hazy.'},
   {h:'Black algae'},{p:'Dark spots rooted in plaster. Scrub hard, rub a chlorine tablet on the spots, then shock the whole pool. Often takes several rounds.'},
   {h:'Mustard / yellow algae'},{p:'Dusty yellow film that returns. Brush, raise chlorine higher than usual, use a mustard-specific algaecide. Rinse anything that touched the water.'},
   {h:'Pink slime / white mold'},{p:'A bacterial biofilm, not algae. Brush surfaces, shock heavily, clean skimmers and returns. Stubborn cases need the plumbing flushed.'},
   {h:'Eye / skin irritation'},{p:'Almost always pH out of range or chloramines — not "too much chlorine." Fix pH first, then shock.'},
   {h:'Strong chlorine smell'},{p:'That smell is chloramines (used-up chlorine), so you need MORE chlorine, not less. Shock to break them up.'},
   {h:'Scale (white crust)'},{p:'High pH, alkalinity, calcium, or temperature. Lower pH and alkalinity, consider a sequestrant, brush as it softens.'},
   {h:'Stains'},{p:'Usually metals from fill water or corrosion. Use a sequestrant or stain remover, test for metals, treat source water.'},
   {h:'Foaming'},{p:'Often cheap algaecides, very low calcium, or contaminants. Add anti-foam to clear it, then fix the cause.'} ]},
 {id:'shock',icon:'sparkles',tint:'var(--lilac)',title:'Shocking Guide',blurb:'When, how, and how much.',body:[
   {h:'When'},{list:['Weekly in swim season.','After heavy rain, a party, or a heat wave.','When water turns cloudy or green.','When you smell strong chlorine.']},
   {h:'How'},{list:['Shock at dusk or after dark — sun burns off shock.','Run the pump the whole time and for hours after.','Pre-dissolve cal-hypo in a bucket to avoid bleaching.','Broadcast slowly around the perimeter.','Don\'t swim until free chlorine is back to 1–3 ppm.']},
   {callout:'For algae you may need to hold a high chlorine level for a day or two, re-dosing until clear.'} ]},
 {id:'weather',icon:'sun',tint:'var(--sun)',title:'Sun, Heat & Weather',blurb:'Why your pool changes with the sky.',body:[
   {h:'Sun'},{p:'UV destroys unprotected chlorine within hours. Stabilizer (CYA) in range is what lets chlorine survive a sunny afternoon. Full-sun pools burn through chlorine far faster.'},
   {h:'Heat'},{p:'Warm water speeds up algae and chlorine demand. In hot stretches, test more and keep chlorine on the higher side.'},
   {h:'Rain'},{p:'Rain dilutes water, can drop pH and alkalinity, and washes in dust and phosphates that feed algae. Always test the day after a storm.'},
   {h:'Heavy use'},{p:'Swimmers bring sweat, sunscreen, and oils that eat chlorine. After a busy weekend, expect to add chlorine and maybe shock.'},
   {h:'Wind & debris'},{p:'Leaves and pollen consume sanitizer as they break down. Skim daily and empty baskets.'} ]},
 {id:'salt',icon:'droplet',tint:'var(--pool-deep)',title:'Saltwater Pools',blurb:'Living with a salt generator.',body:[
   {h:'How it works'},{p:'A salt cell turns dissolved salt into chlorine continuously, so you rarely add chlorine by hand. You still test and balance everything else like a chlorine pool.'},

let MEM={};
const LS=(()=>{try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return localStorage;}catch(e){return null;}})();
function load(k){try{if(LS){const v=LS.getItem(k);return v?JSON.parse(v):null;}return MEM[k]??null;}catch(e){return null;}}
function store(k,v){try{const s=JSON.stringify(v);if(LS)LS.setItem(k,s);else MEM[k]=v;}catch(e){MEM[k]=v;}}

/* ===================== HELPERS ===================== */
const todayISO=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);};
function fmtDate(iso){const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});}
function cap(s){return s?s[0].toUpperCase()+s.slice(1):s;}
function effRange(p,salt){return(salt&&p.saltMin!=null)?{min:p.saltMin,max:p.saltMax}:{min:p.min,max:p.max};}
function evaluate(key,val,salt){const p=RANGES[key];if(p.min==null||val===''||val==null||isNaN(val))return'none';const{min,max}=effRange(p,salt);const v=parseFloat(val);return v<min?'low':v>max?'high':'good';}
const STATUS={good:{c:'var(--palm)',bg:'#E4F8EC'},low:{c:'#1F8FD6',bg:'#E2F2FC'},high:{c:'var(--coral-deep)',bg:'#FFE6EC'},none:{c:'var(--ink-soft)',bg:'#EFF5F5'}};
function estimateGallons(shape,l,w,d){l=+l||0;w=+w||0;d=+d||0;if(!d||(!l&&shape!=='round'))return 0;let g;
  if(shape==='rectangle')g=l*w*d*7.48;else if(shape==='round')g=l*l*d*5.9;else if(shape==='oval')g=l*w*d*5.9;else g=l*w*d*7.0;
  return Math.round(g/10)*10;}
function round1(n){return Math.round(n*10)/10;}
function fmtFluid(oz){if(oz<0.1)return'a splash';if(oz>=128)return round1(oz/128)+' gal ('+Math.round(oz)+' fl oz)';if(oz>=32)return round1(oz/32)+' qt ('+Math.round(oz)+' fl oz)';if(oz>=8)return round1(oz/8)+' cups ('+Math.round(oz)+' fl oz)';return round1(oz)+' fl oz';}
function fmtWeight(oz){if(oz<0.1)return'a pinch';if(oz>=16)return round1(oz/16)+' lb ('+Math.round(oz)+' oz)';return round1(oz)+' oz';}
function esc(s){return(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ===================== TRENDS ===================== */
function sparkline(values,min,max,color){
  const pts=values.map((v,i)=>({v,i})).filter(p=>p.v!=null&&p.v!==''&&!isNaN(p.v));
  if(pts.length<2)return `<div style="height:64px;display:grid;place-items:center" class="muted">Need 2+ readings</div>`;
  const vals=pts.map(p=>+p.v),lo=Math.min(...vals,min??Infinity),hi=Math.max(...vals,max??-Infinity),pad=(hi-lo)*0.15||1;
  const yMin=lo-pad,yMax=hi+pad,W=300,H=60;const x=i=>(i/(pts.length-1))*W,y=v=>H-((v-yMin)/(yMax-yMin))*H;
  const path=pts.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(+p.v).toFixed(1)}`).join(' ');
  const bt=max!=null?y(max):null,bb=min!=null?y(min):null;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:64px" preserveAspectRatio="none">
    ${bt!=null&&bb!=null?`<rect x="0" y="${bt}" width="${W}" height="${Math.max(0,bb-bt)}" fill="var(--palm)" opacity="0.1"/>`:''}
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(+p.v).toFixed(1)}" r="3" fill="${color}"/>`).join('')}</svg>`;
}

function doseHTML(){
  const p=S.profile,salt=isSalt(),L=latestLog();
  const c=S.calc;
  if(!c.param)c.param='fc';
  const param=c.param;
  // defaults
  const idealMid={fc:2,ph:7.5,ta:100,ch:300,cya:salt?70:40,salt:3200};
  if(c.current==null)c.current=(L&&L.readings?.[param]!=null&&L.readings?.[param]!=='')?L.readings[param]:'';
  if(c.target==null)c.target=idealMid[param];
  const tabs=salt?['fc','ph','ta','ch','cya','salt']:['fc','ph','ta','ch','cya'];
  // product options
  let prodList=[];
  const cur=parseFloat(c.current),tgt=parseFloat(c.target);
  const up=!isNaN(cur)&&!isNaN(tgt)&&tgt>cur, down=!isNaN(cur)&&!isNaN(tgt)&&tgt<cur;
  if(param==='fc')prodList=PRODUCTS.fc;
  else if(param==='ph')prodList=up?PRODUCTS.ph_up:PRODUCTS.ph_down;
  else if(param==='ta')prodList=up?PRODUCTS.ta_up:PRODUCTS.ta_down;
  else if(param==='ch')prodList=up?PRODUCTS.ch_up:[];
  else if(param==='cya')prodList=up?PRODUCTS.cya_up:[];
  else if(param==='salt')prodList=up?PRODUCTS.salt_up:[];
  if(prodList.length&&!prodList.find(x=>x.id===c.product))c.product=prodList[0].id;

  const result=computeDose();
  return `<div style="margin-top:12px">
    <div class="card" style="background:var(--cloud);border-color:var(--mint)"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-weight:800;font-size:13px;color:var(--pool-deep)">YOUR POOL</span><span style="font-family:var(--disp);font-weight:800;font-size:18px;color:var(--pool-deep)">${(p.gallons||0).toLocaleString()} gal</span></div>
      <div class="muted" style="font-size:12px;margin-top:2px">All amounts are calculated for this volume. Edit it in Setup if it's off.</div></div>

    <div class="seclabel" style="margin-top:18px">What are you adjusting?</div>
    <div class="chips" style="margin-bottom:14px">${tabs.map(k=>chip(RANGES[k].short,param===k,`dose-param" data-v="${k}`)).join('')}</div>

    <div style="display:flex;gap:10px">
      ${field('Current reading',`<input inputmode="decimal" data-model="calc.current" value="${esc(c.current)}" placeholder="${idealMid[param]}">`)}
      ${field('Target',`<input inputmode="decimal" data-model="calc.target" value="${esc(c.target)}" placeholder="${idealMid[param]}">`)}
    </div>

    ${prodList.length>1?`<div class="seclabel">Product</div><div class="chips" style="margin-bottom:14px">${prodList.map(pr=>chip(pr.name,c.product===pr.id,`dose-product" data-v="${pr.id}`)).join('')}</div>`:''}

    <div class="card" style="border-left:5px solid var(--lilac)">${result}</div>

    <p class="muted" style="font-size:11.5px;text-align:center;margin-top:14px;line-height:1.45">Estimates for typical conditions. Acid and pH dosing especially depend on your alkalinity — add about ¾, wait, then retest. Always follow the product label and never mix chemicals.</p>
  </div>`;
}
function computeDose(){
  const p=S.profile,c=S.calc,salt=isSalt();
  const param=c.param,cur=parseFloat(c.current),tgt=parseFloat(c.target),gal=p.gallons||0,fv=gal/10000;
  if(isNaN(cur)||isNaN(tgt))return `<div class="muted" style="font-weight:700">Enter your current reading and target to see the dose.</div>`;
  if(!gal)return `<div class="muted" style="font-weight:700">Add your pool volume in Setup to calculate doses.</div>`;
  const head=(t,sub)=>`<div style="font-family:var(--disp);font-weight:800;font-size:15px;margin-bottom:4px">${t}</div><div class="muted" style="font-size:13px;margin-bottom:10px">${sub}</div>`;
  const amount=(txt)=>`<div style="font-family:var(--disp);font-weight:800;font-size:26px;color:var(--lilac);line-height:1.1">${txt}</div>`;
  const steps=(arr)=>`<ul class="article" style="margin-top:10px">${arr.map(s=>`<li><span class="b" style="background:var(--lilac)"></span>${esc(s)}</li>`).join('')}</ul>`;

  if(Math.abs(tgt-cur)<1e-6)return head('Already on target','Nothing to add — you\'re right where you want to be.');

  // dilution result helper
  const dilute=(label)=>{const g=Math.max(0,Math.round(gal*(1-tgt/cur)));return head(label+' only comes down by replacing water',`To go from ${cur} to ${tgt}`)+amount(g.toLocaleString()+' gal')+`<div class="muted" style="font-size:13px;margin-top:6px">Drain and refill about that much with fresh water, then retest. Do it in stages.</div>`;};

  if(param==='fc'){
    if(tgt<cur)return head('Chlorine is above target','')+`<div style="font-weight:600;font-size:14.5px;line-height:1.5">Don't add more — let the sun bring it down. For a big drop, dilute with fresh water. Wait until it's 1–3 ppm before swimming.</div>`;
    const pr=PRODUCTS.fc.find(x=>x.id===c.product)||PRODUCTS.fc[0];const delta=tgt-cur;
    const v=pr.per*delta*fv;const amt=pr.type==='fluid'?fmtFluid(v):fmtWeight(v);
    const st=['Pre-dissolve granular shock in a bucket before adding.','Pour around the perimeter with the pump running.','Best done at dusk so the sun doesn\'t burn it off.','Retest in a few hours; don\'t swim until it\'s back to 1–3 ppm.'];
    return head(pr.name,`To raise chlorine from ${cur} to ${tgt} ppm`)+amount(amt)+(pr.note?`<div class="muted" style="font-size:13px;margin-top:6px">${esc(pr.note)}</div>`:'')+steps(st);
  }
  if(param==='ph'){
    const pr=(tgt>cur?PRODUCTS.ph_up:PRODUCTS.ph_down).find(x=>x.id===c.product)||(tgt>cur?PRODUCTS.ph_up:PRODUCTS.ph_down)[0];
    const dph=Math.abs(tgt-cur);const v=pr.perFullPh*dph*fv;const amt=pr.type==='fluid'?fmtFluid(v):fmtWeight(v);
    const st=tgt>cur?['Pre-dissolve soda ash in a bucket of water.','Broadcast slowly with the pump running.','Retest after a few hours of circulation.']
      :['Add slowly into deeper water, away from fittings, pump running.','Add about ¾ of this, wait 20–30 min, then retest.','This also lowers alkalinity a little.'];
    return head(pr.name,`To move pH from ${cur} to ${tgt}`)+amount(amt)+`<div class="muted" style="font-size:13px;margin-top:6px">${esc(pr.note)}</div>`+steps(st);
  }
  if(param==='ta'){
    const pr=(tgt>cur?PRODUCTS.ta_up:PRODUCTS.ta_down)[0];const d10=Math.abs(tgt-cur)/10;
    const v=pr.per10ppm*d10*fv;const amt=pr.type==='fluid'?fmtFluid(v):fmtWeight(v);
    const st=tgt>cur?['Broadcast baking soda across the surface, pump running.','Brush to help it dissolve; retest after a few hours.']
      :['Add acid in stages over a few days, pump running.','It lowers pH too — recheck pH after.','Retest before adding more.'];
    return head(pr.name,`To move alkalinity from ${cur} to ${tgt} ppm`)+amount(amt)+`<div class="muted" style="font-size:13px;margin-top:6px">${esc(pr.note)}</div>`+steps(st);
  }
  if(param==='ch'){
    if(tgt<cur)return dilute('Calcium hardness');
    const pr=PRODUCTS.ch_up[0];const d10=(tgt-cur)/10;const v=pr.per10ppm*d10*fv;
    return head(pr.name,`To raise calcium from ${cur} to ${tgt} ppm`)+amount(fmtWeight(v))+`<div class="muted" style="font-size:13px;margin-top:6px">${esc(pr.note)}</div>`+steps(['Pre-dissolve in a bucket — it gets hot.','Add slowly with the pump running.','Retest after several hours.']);
  }
  if(param==='cya'){
    if(tgt<cur)return dilute('Stabilizer (CYA)');
    const pr=PRODUCTS.cya_up[0];const d10=(tgt-cur)/10;const v=pr.per10ppm*d10*fv;
    return head(pr.name,`To raise stabilizer from ${cur} to ${tgt} ppm`)+amount(fmtWeight(v))+`<div class="muted" style="font-size:13px;margin-top:6px">${esc(pr.note)}</div>`+steps(['Put it in a sock in the skimmer basket — it dissolves slowly.','Run the pump; it can take a few days to register.','Don\'t backwash for 24–48h after adding.']);
  }
  if(param==='salt'){
    if(tgt<cur)return dilute('Salt');
    const lb=0.00000834*gal*(tgt-cur);
    return head('Pool salt',`To raise salt from ${cur} to ${tgt} ppm`)+amount(fmtWeight(lb*16))+`<div class="muted" style="font-size:13px;margin-top:6px">Use pool-grade salt. Pour across the deep end with the pump running and brush to dissolve.</div>`+steps(['Check your generator\'s target before adding.','Allow 24h and full circulation before retesting.']);
  }
  return '';
}

function download(filename,text,mime){try{const blob=new Blob([text],{type:mime||'text/plain'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);}catch(e){toast('Export not supported here');}}
function exportCSV(){
  const cols=['date','fc','ph','ta','cya','ch','salt','temp','clarity','weather','airTemp','sunInt','actions','notes'];
  const rows=[cols.join(',')];
  [...S.logs].reverse().forEach(l=>{const r=cols.map(c=>{let v;if(['fc','ph','ta','cya','ch','salt','temp'].includes(c))v=l.readings?.[c]??'';else if(c==='actions')v=(l.actions||[]).join('; ');else v=l[c]??'';v=String(v).replace(/"/g,'""');return /[",\n]/.test(v)?`"${v}"`:v;});rows.push(r.join(','));});
  download('emmas-pool-logs.csv',rows.join('\n'),'text/csv');toast('Logs exported');
}
function exportJSON(){download('emmas-pool-backup.json',JSON.stringify({profile:S.profile,logs:S.logs,reminders:S.reminders},null,2),'application/json');toast('Backup downloaded');}
function pad2(n){return String(n).padStart(2,'0');}
function exportICS(){
  const now=new Date();const dt=d=>d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate())+'T'+pad2(d.getHours())+pad2(d.getMinutes())+'00';
  const start=new Date();start.setDate(start.getDate()+1);start.setHours(9,0,0,0);
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Emmas Pool Cleaning//EN\r\nCALSCALE:GREGORIAN\r\n';
  S.reminders.filter(r=>r.on).forEach((r,i)=>{
    const freq=r.days%7===0?`FREQ=WEEKLY;INTERVAL=${r.days/7}`:`FREQ=DAILY;INTERVAL=${r.days}`;
    ics+='BEGIN:VEVENT\r\n'+`UID:emmapool-${r.id}-${now.getTime()}@local\r\n`+`DTSTAMP:${dt(now)}\r\n`+`DTSTART:${dt(start)}\r\n`+`DURATION:PT15M\r\n`+`RRULE:${freq}\r\n`+`SUMMARY:🏊 ${r.title} (Emma's Pool)\r\n`+'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:Pool reminder\r\nTRIGGER:PT0M\r\nEND:VALARM\r\nEND:VEVENT\r\n';
  });
  ics+='END:VCALENDAR';
  download('emmas-pool-reminders.ics',ics,'text/calendar');toast('Opening calendar file…');
}

    case'ob-next':d.step=Math.min(STEPS.length-1,d.step+1);renderOnboarding();break;
    case'ob-finish':finishOnboarding();break;
    // log
    case'set-clarity':S.log.clarity=v;renderLog();break;
    case'set-weather':S.log.weather=v;renderLog();break;
    case'set-sunint':S.log.sunInt=v;renderLog();break;
    case'toggle-act':{const a=S.log.actions||[];S.log.actions=a.includes(v)?a.filter(x=>x!==v):[...a,v];renderLog();break;}
    case'save-log':saveLog();break;
    // dose
    case'dose-param':S.calc={param:v,current:null,target:null};renderTool();break;
    case'dose-product':S.calc.product=v;renderTool();break;
    // reminders
    case'rem-toggle':{const r=S.reminders.find(x=>x.id===id);r.on=!r.on;saveAll();if(S.modal==='reminders')renderReminders();else render();break;}
    case'rem-days':{const r=S.reminders.find(x=>x.id===id);r.days=+v;saveAll();renderReminders();break;}
    case'rem-done':{const r=S.reminders.find(x=>x.id===id);r.last=todayISO();saveAll();toast('Nice — '+r.title.toLowerCase()+' done');if(S.modal==='reminders')renderReminders();else render();break;}
    case'export-ics':exportICS();break;
    case'enable-notif':enableNotif();break;
    case'export-csv':exportCSV();break;
    case'export-json':exportJSON();break;
    case'edit-profile':startEditProfile();break;
    case'reset-all':resetAll();break;
    case'dismiss-install':S.settings.installDismissed=true;saveAll();render();break;
  }
});

function finishOnboarding(){const d=S.draft;const gal=d.autoVol?estimateGallons(d.shape,d.length,d.width,d.depth):(+d.gallons||0);
  S.profile={owner:(d.owner||'Emma').trim(),poolName:(d.poolName||'My Pool').trim(),shape:d.shape,install:d.install,surface:d.surface,waterType:d.waterType,filter:d.filter,sun:d.sun,sunWhen:d.sunWhen,location:(d.location||'').trim(),gallons:gal,dims:{length:d.length,width:d.width,depth:d.depth},createdAt:todayISO()};
  S.draft={};S.view='home';S.modal=null;saveAll();render();toast('All set, '+S.profile.owner+'! 🌴');}
function startEditProfile(){const p=S.profile;S.draft={step:0,owner:p.owner,poolName:p.poolName,shape:p.shape,length:p.dims?.length||'',width:p.dims?.width||'',depth:p.dims?.depth||'',gallons:p.gallons,autoVol:!(p.dims&&p.dims.length),install:p.install,surface:p.surface,waterType:p.waterType,filter:p.filter,sun:p.sun,sunWhen:p.sunWhen,location:p.location};S.profile=null;S.view='onboard';S.modal=null;render();}
function saveLog(){const e=S.log;const entry={date:e.date||todayISO(),readings:e.readings||{},clarity:e.clarity||'Crystal clear',weather:e.weather||'Sunny',airTemp:e.airTemp||'',sunInt:e.sunInt||'High',actions:e.actions||[],notes:e.notes||'',savedAt:new Date().toISOString()};
  S.logs=[entry,...S.logs.filter(x=>x.date!==entry.date)].sort((a,b)=>a.date<b.date?1:-1);
  // auto-stamp test reminder
  const tr=S.reminders.find(r=>r.id==='test');if(tr)tr.last=todayISO();
  S.modal=null;S.view='home';saveAll();render();toast('Log saved ✓');}
function resetAll(){if(!confirm('This erases your pool profile and all logs. Start over?'))return;
  S.profile=null;S.logs=[];S.reminders=defaultReminders();S.settings={installDismissed:false};S.draft={};S.view='home';S.modal=null;saveAll();render();}

/* ===================== INIT ===================== */
if(S.profile&&!S.view)S.view='home';
render();
fireDueNotifs();

/* ===================== PWA: offline support ===================== */
if('serviceWorker'in navigator&&location.protocol!=='file:'){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
</script>
</body>
