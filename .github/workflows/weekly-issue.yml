name: Build the week's issue

# Closing the loop. Until now the Tuesday fetch landed the data and then
# NOTHING happened: six scripts ran on Actions and not one of them built an
# issue, so every magazine needed a hand on a keyboard to exist.
#
# This runs the rest of the chain -- rebuild, write, feed, cover, page -- and
# then puts it in front of the sanity gate. If the gate holds the issue, the
# workflow fails loudly and commits nothing. A free product running itself for
# leagues nobody here has met has no human reading each issue, and the
# dangerous failure is not the crash. It is the confident wrong number.
#
# WHAT IT DOES NOT DO: generate art. The play prompts are already written by
# build_play_art.py; turning them into pictures stays John's step, and the
# cover falls back to the default plate with the week number set on it. No
# model, no key, no bill in this pipeline at all.

on:
  workflow_dispatch:
    inputs:
      week:
        description: 'Week to build (blank = the newest week file on disk)'
        required: false
        default: ''
      season:
        required: false
        default: '2026'
      publish:
        description: 'Commit and push the issue (false = build and gate only)'
        required: false
        default: 'true'
      rebuild_published:
        description: 'Allow rebuilding a week that is already published (dangerous)'
        required: false
        default: 'false'
  workflow_run:
    workflows: ["Fetch a week's matchups"]
    types: [completed]

permissions:
  contents: write

# Per league, not one global group. fetch-week shares a single `fetch-week`
# group and rapid dispatches cancel each other -- that is how week 2 was lost.
# The name carries the repo so this still holds when a second league arrives.
concurrency:
  group: weekly-issue-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    # on workflow_run, only when the fetch actually succeeded
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install what the builders need
        run: python3 -m pip install --quiet pillow

      # The cover and every share card are RASTERISED, not drawn: build_week_cover
      # and build_addendum.shoot() lay the page out in a browser and screenshot
      # it. This container has one at /opt/pw-browsers/chromium and the first
      # version of this workflow quietly assumed a runner did too, so week 8
      # got as far as all eight rebuilt games and then died on the card at the
      # end of build_watch -- no cover, no page, no gate. A runner has node but
      # no browser, so it installs its own and Playwright finds it.
      - name: Cache the browser
        id: pw
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Install the browser the cover is shot in
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      # nflverse play-by-play is a 7MB download a week and never changes once a
      # week is final, so it is cached rather than pulled every run.
      - name: Cache nflverse
        uses: actions/cache@v4
        with:
          path: .cache
          key: nflverse-${{ inputs.season || '2026' }}-${{ github.run_id }}
          restore-keys: nflverse-${{ inputs.season || '2026' }}-

      - name: Work out which week
        id: wk
        env:
          IN_WEEK: ${{ inputs.week }}
          SEASON: ${{ inputs.season || '2026' }}
        run: |
          if [ -n "$IN_WEEK" ]; then
            echo "week=$IN_WEEK" >> "$GITHUB_OUTPUT"
          else
            # the newest plain week file on disk -- the one the fetch just landed
            W=$(ls week-data/${SEASON}-w*.json 2>/dev/null \
                | grep -oE 'w[0-9]+\.json$' | grep -oE '[0-9]+' \
                | sort -n | tail -1)
            echo "week=${W}" >> "$GITHUB_OUTPUT"
          fi

      # Weeks 4 to 6 keep the masthead and the layout they went out with, on
      # purpose: rebuilding a live issue reflows it through every convention
      # that has landed since. Rebuilding week 7 by hand during this work took
      # the tug-of-war off the cover and dropped it from 434kb to 67kb, which
      # is the damage this guard exists to stop.
      - name: Refuse to reflow a published back issue
        env:
          WEEK: ${{ steps.wk.outputs.week }}
          FORCE: ${{ inputs.rebuild_published }}
        run: |
          ISSUE="scfl-week-${WEEK}-issue.html"
          if [ -f "$ISSUE" ] && [ -n "$(git log --oneline -1 -- "$ISSUE")" ] \
             && [ "$FORCE" != "true" ]; then
            echo "Week ${WEEK} is already published."
            echo "Rebuilding it would reflow a live issue. Re-run with"
            echo "rebuild_published=true if that is genuinely what you want."
            exit 1
          fi

      - name: Rebuild the games from the tape
        run: python3 scripts/replay.py --week ${{ steps.wk.outputs.week }}
                                       --season ${{ inputs.season || '2026' }}

      - name: Write the week
        run: python3 scripts/write_week.py --week ${{ steps.wk.outputs.week }}
                                           --season ${{ inputs.season || '2026' }}

      - name: Build the watch feed
        run: python3 scripts/build_watch.py --week ${{ steps.wk.outputs.week }}

      # The gate's headline check is the waiver figure -- 27 upgrades on a
      # 10-team league is why the gate exists -- and for week 8 it did not run
      # at all, because nothing in this chain computed the row and the gate
      # skipped it in silence. It is also the check that needs its own look at
      # the tape, so it goes before the gate and not after.
      - name: Measure the waiver pool
        run: python3 scripts/waiver_depth.py --week ${{ steps.wk.outputs.week }}

      - name: Cover
        run: |
          python3 scripts/build_week_cover.py --week ${{ steps.wk.outputs.week }} \
            --season ${{ inputs.season || '2026' }}

      # ONLY on the shipped default plate.
      #
      # The first version of this step ran whenever the week had no art of its
      # own -- which is exactly the cover build_week_cover DRAWS, and that one
      # already prints "WEEK n" in its own roundel. Week 8 came out of the
      # chain with the number on it twice: the roundel top left and a second
      # numeral bottom right.
      #
      # The three cases, and only one of them wants this script:
      #   art in the week file  -> John's picture. No number unless he asks.
      #   no art                -> the app's own cover, which sets its own.
      #   the shipped plate     -> a bare picture with no furniture at all.
      #                            That is what cover_number.py is for, and it
      #                            is the retail path: a league with no art of
      #                            its own still gets a cover on day one.
      - name: Set the issue number on the default plate
        continue-on-error: true      # a cover without its number still publishes
        env:
          SEASON: ${{ inputs.season || '2026' }}
          WEEK: ${{ steps.wk.outputs.week }}
          LEAGUE: ${{ vars.LEAGUE_NAME || 'SCFL' }}
        run: |
          COV="scfl-week-${WEEK}-cover.jpg"
          ART=$(python3 -c "
          import json,os
          p='week-data/%s-w%s-written.json'%(os.environ['SEASON'],os.environ['WEEK'])
          print((json.load(open(p)).get('cover') or {}).get('art','') if os.path.exists(p) else '')
          ")
          case "$ART" in
            */cover-plate-default.jpg|cover-plate-default.jpg)
              python3 scripts/cover_number.py --cover "$COV" --week "$WEEK" \
                --league "$LEAGUE" --season "$SEASON" --place plate ;;
            "")  echo "week ${WEEK} uses the app's own cover, which sets its own number" ;;
            *)   echo "week ${WEEK} has its own art ($ART) -- no number set" ;;
          esac

      - name: Build the page
        run: python3 scripts/build_week_issue.py --week ${{ steps.wk.outputs.week }}
                                                 --season ${{ inputs.season || '2026' }}

      # ---- the gate. Nothing below this runs if the numbers are wrong. ----
      - name: Sanity gate
        run: |
          python3 scripts/sanity_gate.py --week ${{ steps.wk.outputs.week }} \
            --season ${{ inputs.season || '2026' }}

      - name: Filed and sendable
        run: python3 scripts/check_filed.py || true

      - name: Publish
        if: ${{ inputs.publish != 'false' }}
        run: |
          git config user.name  'SCFL Newsroom'
          git config user.email 'noreply@anthropic.com'
          git add -A
          if git diff --staged --quiet; then
            echo 'nothing changed'
            exit 0
          fi
          git commit -m "Week ${{ steps.wk.outputs.week }}: the issue, built and gated"
          git push

      - name: What held it
        if: failure()
        run: |
          echo "The issue did not publish. Run the gate locally to see why:"
          echo "  python3 scripts/sanity_gate.py --week ${{ steps.wk.outputs.week }}"
