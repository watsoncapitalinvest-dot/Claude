name: Hunt for CC0 sound effects

# The agent sandbox cannot reach any sound library — the egress proxy refuses
# them all — but a runner can. This browses a list of submission pages, keeps
# only what is declared CC0 / public domain, downloads the audio, normalises it
# and commits it to jeopardy/sfx/candidates with a manifest recording where
# every file came from and under what licence.
#
# Nothing here is wired into the game. It is an audition pile.

on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Space-separated submission page URLs"
        required: false
        default: >-
          https://opengameart.org/content/correct-and-wrong-sound-effect
          https://opengameart.org/content/100-cc0-sfx
          https://opengameart.org/content/100-cc0-sfx-2
          https://opengameart.org/content/cc0-sound-effects
          https://opengameart.org/content/soundfx-library-cc0
          https://opengameart.org/content/win-sound-effect
      max_per_page:
        description: "Most files to take from any one submission"
        required: false
        default: "12"

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Browse, filter and fetch
        env:
          PAGES: ${{ inputs.pages }}
          MAXP:  ${{ inputs.max_per_page }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request, pathlib, html

          UA = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/124.0 Safari/537.36"}
          OUT = pathlib.Path("jeopardy/sfx/candidates"); OUT.mkdir(parents=True, exist_ok=True)
          AUDIO = (".wav", ".mp3", ".ogg", ".flac", ".aiff", ".aif")
          maxp = int(os.environ.get("MAXP") or 12)

          def get(url, binary=False):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=60) as r:
                  return r.read() if binary else r.read().decode("utf-8", "replace")

          def licence_of(page_html):
              """Only CC0 / public domain passes. Anything else is skipped."""
              t = re.sub(r"<[^>]+>", " ", page_html)
              t = html.unescape(re.sub(r"\s+", " ", t))
              window = t.lower()
              if "cc0" in window or "public domain" in window:
                  for pat in (r"(CC0\s*1\.0[^.,;]{0,40})", r"(CC0)", r"(Public Domain)"):
                      m = re.search(pat, t, re.I)
                      if m: return m.group(1).strip()
              return None

          def author_of(page_html):
              m = re.search(r'/users/([A-Za-z0-9_\-%.]+)', page_html)
              return urllib.parse.unquote(m.group(1)) if m else "unknown"

          manifest, kept, skipped = [], 0, []
          for page in (os.environ.get("PAGES") or "").split():
              page = page.strip()
              if not page: continue
              print(f"\n=== {page}")
              try:
                  h = get(page)
              except Exception as e:
                  print("  ! unreachable:", e); skipped.append((page, str(e))); continue

              lic = licence_of(h)
              if not lic:
                  print("  ! no CC0/public-domain declaration found — skipping")
                  skipped.append((page, "licence not CC0")); continue
              who = author_of(h)
              print(f"  licence: {lic}   author: {who}")

              links = set()
              for m in re.finditer(r'href="([^"]+)"', h):
                  u = html.unescape(m.group(1))
                  if u.lower().split("?")[0].endswith(AUDIO):
                      links.add(urllib.parse.urljoin(page, u))
              print(f"  {len(links)} audio files linked")

              zips = set()
              for m in re.finditer(r'href="([^"]+)"', h):
                  u = html.unescape(m.group(1))
                  if u.lower().split("?")[0].endswith(".zip"):
                      zips.add(urllib.parse.urljoin(page, u))
              for z in sorted(zips)[:2]:
                  print(f"  zip: {z.rsplit('/',1)[-1]}")
                  try:
                      blob = get(z, binary=True)
                  except Exception as e:
                      print("    ! ", e); continue
                  import io, zipfile
                  try:
                      zf = zipfile.ZipFile(io.BytesIO(blob))
                  except Exception as e:
                      print("    ! not a zip:", e); continue
                  # only small, plainly-named audio members, and only a few
                  members = [m for m in zf.namelist()
                             if m.lower().endswith(AUDIO) and not m.startswith("__MACOSX")]
                  # prefer things that sound like what we need
                  want = re.compile(r"(buzz|wrong|error|fail|correct|right|win|success|"
                                    r"ding|chime|bell|coin|select|click|beep|blip|"
                                    r"reveal|whoosh|swoosh|fanfare|jingle|applause)", re.I)
                  ranked = sorted(members, key=lambda m: (0 if want.search(m) else 1, m))
                  taken = 0
                  for m in ranked:
                      if taken >= maxp: break
                      try: data = zf.read(m)
                      except Exception: continue
                      if not (2_000 < len(data) < 2_000_000): continue
                      base = re.sub(r"[^A-Za-z0-9._-]", "_", m.rsplit("/", 1)[-1])
                      safe = f"{who}__{base}"
                      (OUT / safe).write_bytes(data)
                      manifest.append({"file": safe, "bytes": len(data), "source_page": page,
                                       "source_file": z + "#" + m, "licence": lic, "author": who})
                      kept += 1; taken += 1
                      print(f"    + {safe}  {len(data)/1024:.0f}KB")

              for u in sorted(links)[:maxp]:
                  name = urllib.parse.unquote(u.rsplit("/", 1)[-1].split("?")[0])
                  safe = re.sub(r"[^A-Za-z0-9._-]", "_", name)
                  dest = OUT / safe
                  try:
                      data = get(u, binary=True)
                  except Exception as e:
                      print(f"    ! {name}: {e}"); continue
                  if len(data) > 8_000_000:
                      print(f"    - {name}: {len(data)/1e6:.1f}MB, too big"); continue
                  dest.write_bytes(data)
                  manifest.append({"file": safe, "bytes": len(data), "source_page": page,
                                   "source_file": u, "licence": lic, "author": who})
                  kept += 1
                  print(f"    + {safe}  {len(data)/1024:.0f}KB")

          (OUT / "MANIFEST.json").write_text(json.dumps(
              {"note": "Audition pile. Nothing here is used by the game yet.",
               "kept": kept, "skipped": skipped, "files": manifest}, indent=1))
          print(f"\nkept {kept} files; skipped {len(skipped)} pages")
          PY

      - name: Describe what landed
        run: |
          command -v ffprobe >/dev/null 2>&1 || { echo "(no ffprobe; skipping)"; exit 0; }
          for f in jeopardy/sfx/candidates/*; do
            case "$f" in *.json) continue;; esac
            d=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f" 2>/dev/null)
            printf "%-52s %6.2fs\n" "$(basename "$f")" "${d:-0}"
          done

      - name: Commit the pile
        run: |
          if [ -n "$(git status --porcelain jeopardy/sfx)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add jeopardy/sfx
            git commit -m "Sound-effect candidates, CC0 only, with provenance"
            git push
          else
            echo "nothing new"
          fi
