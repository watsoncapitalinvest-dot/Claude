name: Harvest the Jeopardy league log

# The game posts each finished game to an ntfy.sh topic, which is append-only,
# needs no account and works from a phone. ntfy only keeps twelve hours, so this
# job sweeps the topic every three hours and folds anything new into
# jeopardy/league-log.json, which is the permanent record book. The game reads
# that file for history and the topic for the last few hours, so the board is
# live within seconds and never loses anything.

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jeopardy-log
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sweep the topic
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          TOPIC = "scfl-jeopardy-bc308434afbdf8cc"
          OUT   = "jeopardy/league-log.json"

          try:
              with open(OUT) as f: book = json.load(f)
          except Exception:
              book = {"topic": TOPIC, "games": []}
          games = {g["id"]: g for g in book.get("games", []) if g.get("id")}
          before = len(games)

          url = f"https://ntfy.sh/{TOPIC}/json?poll=1&since=all"
          req = urllib.request.Request(url, headers={"User-Agent": "scfl-harvest"})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  raw = r.read().decode("utf-8", "replace")
          except Exception as e:
              print("topic unreachable:", e); raise SystemExit(0)

          seen = bad = 0
          for line in raw.splitlines():
              line = line.strip()
              if not line: continue
              try:
                  env = json.loads(line)
              except Exception:
                  bad += 1; continue
              if env.get("event") != "message": continue
              seen += 1
              try:
                  row = json.loads(env.get("message") or "")
              except Exception:
                  bad += 1; continue
              if not isinstance(row, dict): bad += 1; continue
              gid = str(row.get("id") or "")
              # id is club-timestamp; anything else is not one of ours
              if "-" not in gid or not gid.rsplit("-", 1)[-1].isdigit():
                  bad += 1; continue
              row["id"] = gid
              games.setdefault(gid, row)   # first write wins, retries are free

          book["topic"] = TOPIC
          book["games"] = sorted(games.values(), key=lambda g: g["id"].rsplit("-", 1)[-1])
          book["updated"] = __import__("time").strftime("%Y-%m-%dT%H:%M:%SZ")
          book["count"]   = len(book["games"])

          os.makedirs("jeopardy", exist_ok=True)
          with open(OUT, "w") as f: json.dump(book, f, indent=1)
          print(f"topic carried {seen} messages ({bad} not ours); "
                f"book {before} -> {len(games)} games")
          PY

      - name: Commit anything new
        run: |
          if ! git diff --quiet -- jeopardy/league-log.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add jeopardy/league-log.json
            git commit -m "Jeopardy league log: $(python3 -c "import json;print(json.load(open('jeopardy/league-log.json'))['count'])") games"
            git push
          else
            echo "nothing new"
          fi
