name: Probe the Jeopardy log backend

# One-off diagnostic. Checks whether ntfy.sh can serve as the league log:
# append-only writes, replay of history, and the CORS headers a phone needs.

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "ntfy topic to probe"
        required: false
        default: ""

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          set -u
          T="${TOPIC:-scfl-probe-$(date +%s)-$RANDOM}"
          echo "topic: $T"
          ORIGIN="https://watsoncapitalinvest-dot.github.io"

          echo; echo "=== 1. preflight (OPTIONS) ==="
          curl -s -i -X OPTIONS "https://ntfy.sh/$T" \
            -H "Origin: $ORIGIN" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" | head -20

          echo; echo "=== 2. POST a game row ==="
          BODY='{"id":"machines-1756000000000","club":"THE MACHINES","total":18600,"right":24,"asked":33}'
          curl -s -i -X POST "https://ntfy.sh/$T" -H "Origin: $ORIGIN" \
            -H "Content-Type: text/plain" -d "$BODY" | head -20

          echo; echo "=== 3. POST a second row ==="
          curl -s -o /dev/null -X POST "https://ntfy.sh/$T" -H "Content-Type: text/plain" \
            -d '{"id":"bigblue-1756000001000","club":"BIG BLUE","total":9400}'
          sleep 2

          echo; echo "=== 4. replay everything (poll=1&since=all) ==="
          curl -s -i "https://ntfy.sh/$T/json?poll=1&since=all" -H "Origin: $ORIGIN" | head -30

          echo; echo "=== 5. how big a message can we send? ==="
          python3 -c "print('x'*3900)" > /tmp/big.txt
          curl -s -o /dev/null -w "3900 bytes -> HTTP %{http_code}\n" -X POST "https://ntfy.sh/$T" --data-binary @/tmp/big.txt
          python3 -c "print('x'*7000)" > /tmp/big2.txt
          curl -s -o /dev/null -w "7000 bytes -> HTTP %{http_code}\n" -X POST "https://ntfy.sh/$T" --data-binary @/tmp/big2.txt

          echo; echo "=== 6. retention note ==="
          curl -s "https://ntfy.sh/v1/health" ; echo
