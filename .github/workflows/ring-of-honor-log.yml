name: Harvest the Ring of Honor votes

# The Ring of Honor page posts each vote and nomination to an ntfy.sh topic,
# append-only, no account, works from a phone. ntfy only keeps twelve hours,
# so this job sweeps the topic every three hours and folds anything new into
# ring-of-honor-votes.json, the permanent record. The page reads that file for
# history and the topic for the last few hours, so it's live within seconds
# and never loses a vote.

on:
  schedule:
    - cron: '37 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ring-of-honor-log
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sweep the topic
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          TOPIC = "scfl-ringofhonor-d2748099"
          OUT   = "ring-of-honor-votes.json"

          try:
              with open(OUT) as f: book = json.load(f)
          except Exception:
              book = {"topic": TOPIC, "entries": []}
          entries = {e["id"]: e for e in book.get("entries", []) if e.get("id")}
          before = len(entries)

          url = f"https://ntfy.sh/{TOPIC}/json?poll=1&since=all"
          req = urllib.request.Request(url, headers={"User-Agent": "scfl-harvest"})
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  raw = r.read().decode("utf-8", "replace")
          except Exception as e:
              print("topic unreachable:", e); raise SystemExit(0)

          seen = bad = 0
          for line in raw.splitlines():
              line = line.strip()
              if not line: continue
              try:
                  env = json.loads(line)
              except Exception:
                  bad += 1; continue
              if env.get("event") != "message": continue
              seen += 1
              try:
                  row = json.loads(env.get("message") or "")
              except Exception:
                  bad += 1; continue
              if not isinstance(row, dict): bad += 1; continue
              rid = str(row.get("id") or "")
              # id is kind-slug-timestamp (vote-... or nom-...); anything else isn't ours
              if "-" not in rid or not rid.rsplit("-", 1)[-1].isdigit():
                  bad += 1; continue
              row["id"] = rid
              entries.setdefault(rid, row)   # first write wins, retries are free

          if len(entries) == before:
              print(f"topic carried {seen} messages ({bad} not ours); "
                    f"nothing new, book stays at {before} entries")
              raise SystemExit(0)

          book["topic"] = TOPIC
          book["entries"] = sorted(entries.values(), key=lambda e: e["id"].rsplit("-", 1)[-1])
          book["updated"] = __import__("time").strftime("%Y-%m-%dT%H:%M:%SZ")
          book["count"]   = len(book["entries"])

          with open(OUT, "w") as f: json.dump(book, f, indent=1)
          print(f"topic carried {seen} messages ({bad} not ours); "
                f"book {before} -> {len(entries)} entries")
          PY

      - name: Commit anything new
        run: |
          if ! git diff --quiet -- ring-of-honor-votes.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add ring-of-honor-votes.json
            git commit -m "Ring of Honor votes: $(python3 -c "import json;print(json.load(open('ring-of-honor-votes.json'))['count'])") entries"
            git push
          else
            echo "nothing new"
          fi
