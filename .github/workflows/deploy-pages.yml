name: Deploy Gridiron GM to GitHub Pages

# Publishes index.html to GitHub Pages on every push to the app branch.
# The configure-pages step enables Pages automatically (source = GitHub Actions),
# so ideally you don't have to touch any repo settings.

on:
  push:
    branches: ["claude/fantasy-football-manager-app-3tpekc"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
