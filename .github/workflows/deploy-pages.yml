name: Deploy site to GitHub Pages

# Publishes the repository to GitHub Pages on every push to an app branch.
# The configure-pages step enables Pages automatically (source = GitHub Actions),
# so ideally you don't have to touch any repo settings.
#
# Whichever branch pushes last is the one that goes live. The wedding branch
# carries the same root content as the fantasy-football branch plus
# wedding/app/, so deploying it keeps the newsroom intact and adds the
# wedding app at /wedding/app/.

on:
  push:
    branches:
      - "claude/fantasy-football-manager-app-3tpekc"
      - "claude/wedding-planning-app-sm4a3g"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
