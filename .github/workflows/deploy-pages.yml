name: Deploy site to GitHub Pages

# Publishes the repository to GitHub Pages on every push to the default branch.
# The configure-pages step enables Pages automatically (source = GitHub Actions),
# so ideally you don't have to touch any repo settings.
#
# Only the default branch may deploy: the github-pages environment restricts
# deployments to it, so pushes from other branches fail before any step runs.
# Site contents: the newsroom at /, the wedding app at /wedding/app/.

on:
  push:
    branches: ["claude/fantasy-football-manager-app-3tpekc"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish. Cancelling it mid-flight meant a quick follow-up
# push killed the deploy before it reached the site, and the site silently stayed
# on an old commit. Queue them instead.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: story publication dates come from the commit that
          # first added each page.
          fetch-depth: 0

      # Every standalone page is a story. Rebuilding the manifest here means a
      # new page shows up in the app's Story Vault on the deploy that ships it,
      # with no list to remember to update.
      - name: Build the Story Vault manifest
        run: python3 scripts/build_stories.py

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      # This site is large, and Pages regularly needs more than the action's
      # 10-minute default to publish it. Give it 30.
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
