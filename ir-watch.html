<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>IR Watch — what an extra spot would actually cost</title>
<meta property="og:type" content="website">
<meta property="og:title" content="IR Watch">
<meta property="og:description" content="Live from Sleeper: how many teams are actually constrained by the two-spot IR, and how many players a third or fourth spot would take off the wire.">
<link rel="icon" href="newsroom-favicon.png">
<style>
:root{--cream:#fffdfb;--paper:#faf7f2;--ink:#17181c;--muted:#65656b;--faint:#9a958c;
 --line:#e6e0d6;--red:#c20f16;--teal:#0e8ab5;
 --serif:Georgia,'Times New Roman',serif;
 --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--serif);font-size:17px;
 line-height:1.6;-webkit-font-smoothing:antialiased;}
.wrap{max-width:940px;margin:0 auto;padding:0 20px 80px;}
.runhead{font-family:var(--sans);font-size:10.5px;font-weight:800;letter-spacing:.22em;
 text-transform:uppercase;color:var(--faint);border-bottom:1px solid var(--line);padding:20px 0 12px;}
.flag{font-family:var(--sans);font-size:10.5px;font-weight:900;letter-spacing:.24em;
 text-transform:uppercase;color:var(--red);margin-top:26px;display:block;}
h1{font-weight:900;font-size:clamp(32px,6.6vw,50px);line-height:1.03;letter-spacing:-.02em;
 margin:12px 0 0;text-wrap:balance;}
h1 em{font-style:normal;color:var(--red);}
.dek{font-style:italic;color:var(--muted);font-size:18px;margin:14px 0 0;max-width:62ch;}
.rule{height:3px;background:var(--red);width:70px;margin:22px 0 26px;}
.sect{font-family:var(--sans);font-size:11px;font-weight:900;letter-spacing:.2em;
 text-transform:uppercase;color:var(--red);margin:42px 0 12px;padding-top:14px;
 border-top:1px solid var(--line);}
p.b{margin:0 0 15px;max-width:64ch;}
.setup{border:1px solid var(--line);border-radius:12px;padding:18px;background:var(--paper);
 max-width:460px;}
input{font-family:var(--sans);font-size:16px;padding:11px 12px;border:1px solid var(--line);
 border-radius:8px;width:100%;background:#fff;color:var(--ink);}
button{font-family:var(--sans);font-size:15px;font-weight:800;padding:11px 16px;border-radius:8px;
 border:1px solid var(--red);background:var(--red);color:#fff;cursor:pointer;margin-top:10px;}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line);}
.lg{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);
 border:1px solid var(--line);margin-top:8px;font-weight:700;}
.hero{display:flex;flex-wrap:wrap;gap:26px 44px;margin:6px 0 26px;padding-bottom:22px;
 border-bottom:1px solid var(--line);}
.hero .k{font-family:var(--sans);font-size:9.5px;font-weight:800;letter-spacing:.14em;
 text-transform:uppercase;color:var(--faint);}
.hero .v{font-size:44px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;}
.hero .v.red{color:var(--red);}
.hero .n{font-family:var(--sans);font-size:11.5px;color:var(--muted);max-width:22ch;}
table{border-collapse:collapse;width:100%;font-family:var(--sans);font-size:13px;}
th,td{padding:7px 8px;}
thead th{font-size:9px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
 color:var(--faint);border-bottom:2px solid var(--ink);text-align:right;white-space:nowrap;}
thead th:first-child{text-align:left;}
tbody th{text-align:left;font-weight:700;white-space:nowrap;}
tbody tr+tr th,tbody tr+tr td{border-top:1px solid var(--line);}
td{text-align:right;font-variant-numeric:tabular-nums;}
.dim{color:var(--faint);}
tr.pinch th,tr.pinch td{background:#fdf3f0;}
tr.pinch th{color:var(--red);}
.pips{display:inline-flex;gap:3px;vertical-align:-1px;}
.pip{width:9px;height:9px;border-radius:2px;background:var(--red);}
.pip.o{background:transparent;border:1px solid var(--line);}
.scroll{overflow-x:auto;}
figcaption{font-family:var(--sans);font-size:11.5px;line-height:1.5;color:var(--muted);
 margin-top:10px;padding-top:9px;border-top:1px solid var(--line);}
.bars{margin-top:6px;}
.brow{display:flex;align-items:center;gap:10px;font-family:var(--sans);font-size:12px;
 padding:4px 0;}
.brow b{width:34px;text-align:right;font-variant-numeric:tabular-nums;}
.btrack{flex:1;height:12px;background:#f0ece4;border-radius:3px;overflow:hidden;}
.btrack i{display:block;height:100%;background:var(--red);}
.btrack i.t{background:var(--teal);}
.err{color:var(--red);font-family:var(--sans);font-size:13px;margin-top:10px;}
.foot{margin-top:44px;border-top:1px solid var(--line);padding-top:16px;font-family:var(--sans);
 font-size:12.5px;color:var(--muted);max-width:72ch;}
.foot a{color:var(--red);font-weight:700;}
@media (max-width:600px){ .hero{gap:18px 26px} .hero .v{font-size:34px} }
</style></head>
<body><div class="wrap">
<div class="runhead">IR Watch &middot; live from Sleeper</div>
<span class="flag">The Record Room</span>
<h1>What An Extra IR Spot <em>Actually</em> Costs</h1>
<p class="dek">Not an opinion. The number of managers who are constrained right now, and the
number of players a third or fourth spot would take off the wire this week.</p>
<div class="rule"></div>
<div id="main"></div>
<div class="foot" id="foot"></div>
</div>
<script>
const API='https://api.sleeper.app/v1';
const HURT=new Set(['IR','Out','Doubtful','PUP','Sus','NA','COV','DNR']);
const FANTASY=new Set(['QB','RB','WR','TE','K','DEF']);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qp=new URLSearchParams(location.search);
const j=u=>fetch(u,{headers:{accept:'application/json'}}).then(r=>{if(!r.ok)throw new Error('Sleeper '+r.status);return r.json();});

// The 5MB player table, kept a day in IndexedDB so a weekly check is instant.
function idb(){return new Promise((res,rej)=>{const q=indexedDB.open('irwatch',1);
  q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function cached(key,ttl,make){
  try{const db=await idb();
    const got=await new Promise(r=>{const t=db.transaction('kv').objectStore('kv').get(key);
      t.onsuccess=()=>r(t.result);t.onerror=()=>r(null);});
    if(got&&Date.now()-got.t<ttl) return got.v;
  }catch{}
  const v=await make();
  try{const db=await idb();db.transaction('kv','readwrite').objectStore('kv').put({t:Date.now(),v},key);}catch{}
  return v;
}

function setup(msg){
  $('#main').innerHTML=`<div class="setup">
    <div style="font-family:var(--sans);font-size:13px;font-weight:700;margin-bottom:8px">Sleeper username</div>
    <input id="u" value="${esc(qp.get('user')||'')}" placeholder="your Sleeper username" autocapitalize="off" autocorrect="off">
    <button id="go">Find my leagues</button>
    <div class="err" id="e">${esc(msg||'')}</div><div id="lgs"></div></div>`;
  $('#go').onclick=async()=>{
    const u=$('#u').value.trim(); if(!u)return;
    $('#e').textContent='Looking…';
    try{
      const user=await j(`${API}/user/${encodeURIComponent(u)}`);
      const st=await j(`${API}/state/nfl`);
      const lgs=await j(`${API}/user/${user.user_id}/leagues/nfl/${st.season}`);
      $('#e').textContent='';
      $('#lgs').innerHTML=lgs.length?lgs.map(l=>
        `<button class="lg" data-id="${esc(l.league_id)}">${esc(l.name)}<br>
         <span class="dim" style="font-weight:500;font-size:12px">${esc(l.season)} · ${l.total_rosters} teams</span></button>`).join('')
        :'<div class="err">No leagues found for that name.</div>';
      $('#lgs').querySelectorAll('.lg').forEach(b=>b.onclick=()=>{
        const url=new URL(location); url.searchParams.set('league',b.dataset.id);
        history.replaceState({},'',url); run(b.dataset.id);});
    }catch(err){ $('#e').textContent=String(err.message||err); }
  };
}

async function run(leagueId){
  $('#main').innerHTML='<p class="b dim">Reading the league…</p>';
  try{
    const st=await j(`${API}/state/nfl`).catch(()=>({}));
    const [lg,rosters,users]=await Promise.all([
      j(`${API}/league/${leagueId}`), j(`${API}/league/${leagueId}/rosters`), j(`${API}/league/${leagueId}/users`)]);
    $('#main').innerHTML='<p class="b dim">Reading the NFL player table (about 5MB, kept for a day)…</p>';
    const db=await cached('players',864e5,()=>j(`${API}/players/nfl`));
    render(compute(lg,rosters,users,db,st));
  }catch(err){ setup('Could not read that league: '+(err.message||err)); }
}

function compute(lg,rosters,users,db,st){
  const cap=(lg.settings&&lg.settings.reserve_slots!=null)?lg.settings.reserve_slots:2;
  const byId={}; users.forEach(u=>byId[u.user_id]=u);
  const nameOf=r=>{const u=byId[r.owner_id]||{};
    return (u.metadata&&u.metadata.team_name)||u.display_name||('Roster '+r.roster_id);};
  const hurt=p=>{const x=db[p]||{}; return HURT.has(x.injury_status)||HURT.has(x.status);};
  const owned=new Set(); const teams=[];
  rosters.forEach(r=>{
    const all=r.players||[], res=r.reserve||[];
    const active=all.filter(p=>!res.includes(p));
    const stranded=active.filter(hurt);
    all.forEach(p=>owned.add(p));
    teams.push({team:nameOf(r), active:active.length, ir:res.length, cap,
      full:res.length>=cap, stranded:stranded.length,
      names:stranded.map(p=>(db[p]||{}).full_name||p).slice(0,6),
      use1:(res.length>=cap&&stranded.length>=1)?1:0,
      use2:(res.length>=cap)?Math.min(2,stranded.length):0});
  });
  let pool=0;
  for(const id in db){const p=db[id];
    if(!owned.has(id)&&p.team&&FANTASY.has(p.position)&&p.status!=='Inactive'&&p.status!=='Retired')pool++;}
  teams.sort((a,b)=>(b.full-a.full)||(b.stranded-a.stranded)||(b.ir-a.ir));
  return {lg,cap,teams,pool,week:st.week||0,season:st.season||'',
    used:teams.reduce((n,t)=>n+t.ir,0), capacity:cap*teams.length,
    atCap:teams.filter(t=>t.full).length, empty:teams.filter(t=>t.ir===0).length,
    stranded:teams.reduce((n,t)=>n+t.stranded,0),
    plus1:teams.reduce((n,t)=>n+t.use1,0), plus2:teams.reduce((n,t)=>n+t.use2,0)};
}

function pips(used,cap){let h='';for(let i=0;i<cap;i++)h+=`<span class="pip${i<used?'':' o'}"></span>`;
  return `<span class="pips">${h}</span>`;}

function render(d){
  const pc=n=>d.pool?(100*n/d.pool).toFixed(2)+'%':'—';
  const rows=d.teams.map(t=>`<tr class="${t.full&&t.stranded?'pinch':''}">
    <th>${esc(t.team)}</th>
    <td>${pips(t.ir,t.cap)} <span class="dim">${t.ir}/${t.cap}</span></td>
    <td>${t.stranded||'<span class="dim">—</span>'}</td>
    <td class="dim">${t.active}</td>
    <td>${t.full&&t.stranded?'<b style="color:var(--red)">yes</b>':'<span class="dim">no</span>'}</td>
    <td class="dim" style="text-align:left;font-size:11.5px">${esc(t.names.join(', '))}</td></tr>`).join('');
  const bar=(lab,n,max,teal)=>`<div class="brow"><b>${n}</b>
    <div class="btrack"><i class="${teal?'t':''}" style="width:${max?100*n/max:0}%"></i></div>
    <span class="dim" style="flex:none">${lab}</span></div>`;
  $('#main').innerHTML=`
    <div class="hero">
      <div><div class="k">Teams actually constrained</div>
        <div class="v red">${d.teams.filter(t=>t.full&&t.stranded).length}<span style="font-size:22px;color:var(--faint)"> / ${d.teams.length}</span></div>
        <div class="n">IR full and still holding an injured player</div></div>
      <div><div class="k">A third spot costs</div><div class="v">${d.plus1}</div>
        <div class="n">players off the wire &middot; ${pc(d.plus1)} of the pool</div></div>
      <div><div class="k">A fourth costs</div><div class="v">${d.plus2}</div>
        <div class="n">${pc(d.plus2)} of the pool</div></div>
      <div><div class="k">Free agents</div><div class="v">${d.pool.toLocaleString()}</div>
        <div class="n">on an NFL roster, fantasy positions</div></div>
    </div>
    <div class="sect">Where the league sits</div>
    <div class="bars">
      ${bar('IR spots filled of '+d.capacity,d.used,d.capacity)}
      ${bar('teams with IR full',d.atCap,d.teams.length)}
      ${bar('teams with nobody on IR',d.empty,d.teams.length,true)}
      ${bar('injured players stuck on active rosters',d.stranded,Math.max(d.stranded,d.capacity))}
    </div>
    <figcaption>An IR slot does not hold a player who would otherwise be free — it holds a man
    already on the roster and frees an <b>active</b> spot, which the manager fills off the wire.
    So the cost of an extra slot is the healthy replacement, one player per slot actually used, and
    the only managers who would use one are those whose IR is full while they still hold an injured
    player. Everyone else costs the pool nothing.</figcaption>
    <div class="sect">Team by team</div>
    <div class="scroll"><table><thead><tr><th>Team</th><th>IR</th><th>Injured, not on IR</th>
      <th>Active</th><th>Would use a 3rd</th><th style="text-align:left">Stuck on the active roster</th>
      </tr></thead><tbody>${rows}</tbody></table></div>
    <figcaption>Shaded rows are the constrained teams — the ones a third spot would actually reach.</figcaption>`;
  $('#foot').innerHTML=`${esc(d.lg.name)} · ${esc(d.season)} season${d.week?' · week '+d.week:''} ·
    IR cap ${d.cap} · read live from Sleeper's public API just now, nothing stored.
    <br>Reload any time for the current picture. Weekly history is kept by
    <b>scripts/ir_watch.py</b>, which writes one row a week and never rewrites an old one.`;
}

const lid=qp.get('league');
if(lid) run(lid); else setup('');
</script></body></html>
