<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SCFL Jeopardy</title>
<meta name="description" content="Twenty-one seasons of the Skirt Chasers Football League, on the board. Harry Doyle hosting.">
<meta name="theme-color" content="#070b16">
<style>
  :root{
    --ink:#eef2fb; --dim:#93a3c0; --faint:#5f6f8d;
    --bg:#070b16; --panel:#111a2e; --edge:#22304c;
    --gold:#f2c14e; --money:#ffd76b; --green:#5fd48a; --red:#ff6b5c; --blue:#7cc0ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);min-height:100dvh;
    font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
  #app{max-width:660px;margin:0 auto;padding:14px 12px 36px;min-height:100dvh;display:flex;flex-direction:column}

  header{text-align:center;padding:6px 0 14px}
  .net{font-size:10px;letter-spacing:5px;color:var(--gold)}
  h1{font-size:27px;letter-spacing:2px;margin:5px 0 3px;font-weight:700}
  .tagline{font-size:11px;color:var(--faint);letter-spacing:.5px}

  /* host */
  .stage{display:flex;align-items:flex-end;gap:12px;background:linear-gradient(180deg,#0d1425,#111a2e);
    border:1px solid var(--edge);border-radius:14px;padding:10px 12px;margin-bottom:14px;min-height:132px}
  .harry{width:104px;flex:none;display:flex;align-items:flex-end;justify-content:center}
  .harry img{width:100%;display:block;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
  .say{flex:1;font-size:13.5px;line-height:1.55;color:var(--dim);padding-bottom:12px}
  .say b{color:var(--ink)}
  .bank{margin-left:auto;text-align:right;flex:none;padding-bottom:12px}
  .bank .lab{font-size:9px;letter-spacing:2px;color:var(--faint)}
  .bank .amt{font-size:22px;font-weight:700;color:var(--money);font-variant-numeric:tabular-nums}
  .bank .amt.neg{color:var(--red)}

  /* board */
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .cat{background:var(--panel);border:1px solid var(--edge);border-radius:8px;
    padding:9px 4px;text-align:center;font-size:9.5px;letter-spacing:.6px;
    font-weight:700;color:var(--gold);min-height:52px;display:flex;align-items:center;justify-content:center;line-height:1.25}
  .tile{background:#16223c;border:1px solid var(--edge);border-radius:8px;height:56px;
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;
    color:var(--money);cursor:pointer;font-variant-numeric:tabular-nums;transition:background .15s}
  .tile:hover:not(.used){background:#1d2c4e}
  .tile.used{background:transparent;border-color:#182338;color:transparent;cursor:default}

  /* clue */
  .clue{display:none;flex-direction:column;flex:1}
  .clue.on{display:flex}
  .ctag{font-size:10px;letter-spacing:2px;color:var(--faint);margin-bottom:8px}
  .ctag .val{color:var(--money)}
  .q{font-size:19px;line-height:1.42;font-weight:700;margin-bottom:18px;text-wrap:balance}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{background:var(--panel);border:2px solid var(--edge);border-radius:10px;padding:13px 14px;
    font:inherit;font-size:14.5px;color:var(--ink);text-align:left;cursor:pointer;
    display:flex;gap:10px;align-items:center;transition:border-color .15s}
  .opt:hover:not(:disabled){border-color:var(--faint)}
  .opt .mk{width:18px;color:var(--faint);font-weight:700;flex:none}
  .opt.right{border-color:var(--green);background:rgba(95,212,138,.11)}
  .opt.wrong{border-color:var(--red);background:rgba(255,107,92,.10)}
  .opt.faded{opacity:.4}
  .fact{margin-top:14px;padding:11px 13px;background:var(--panel);border-left:3px solid var(--gold);
    border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.55;color:var(--dim);display:none}
  .fact.on{display:block}
  .fact b{color:var(--ink)}

  .btn{width:100%;padding:14px;border-radius:10px;border:2px solid var(--gold);background:var(--gold);
    color:#221a08;font:inherit;font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer;margin-top:16px}
  .btn.ghost{background:transparent;color:var(--gold)}
  .btn:active{transform:translateY(1px)}
  .hide{display:none!important}

  /* wager + result */
  .wager{display:flex;gap:8px;align-items:center;margin:14px 0}
  .wager input{flex:1;padding:13px;border-radius:10px;border:2px solid var(--edge);
    background:#0c1424;color:var(--money);font:inherit;font-size:17px;text-align:center;font-weight:700}
  .wager input:focus{outline:none;border-color:var(--gold)}
  .final{text-align:center;padding:10px 0}
  .final .big{font-size:52px;font-weight:700;color:var(--money);font-variant-numeric:tabular-nums;letter-spacing:-1px}
  .verdict{font-size:16px;font-weight:700;margin:12px 0 4px}
  .grid{font-size:22px;letter-spacing:4px;margin:16px 0 4px}
  .foot{text-align:center;font-size:10.5px;color:var(--faint);margin-top:20px;line-height:1.7}
  #load{flex:1;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:11px;letter-spacing:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="net">S C F L &nbsp;N E T W O R K</div>
    <h1>SCFL JEOPARDY</h1>
    <div class="tagline" id="datel">—</div>
  </header>
  <div class="stage">
    <div class="harry"><img id="harry" alt="Harry Doyle"></div>
    <div class="say" id="say">…</div>
    <div class="bank"><div class="lab">BANK</div><div class="amt" id="bank">$0</div></div>
  </div>
  <div id="load">PULLING THE RECORD BOOK…</div>
  <div id="boardWrap" class="hide"><div class="board" id="board"></div></div>
  <div class="clue" id="clue">
    <div class="ctag" id="ctag"></div>
    <div class="q" id="q"></div>
    <div class="opts" id="opts"></div>
    <div class="fact" id="fact"></div>
    <button class="btn hide" id="back">BACK TO THE BOARD</button>
  </div>
  <div id="finalWrap" class="hide">
    <div class="ctag">FINAL CLUE · <span id="fcat"></span></div>
    <div class="q" id="fq">How much are you putting on it?</div>
    <div class="wager"><input id="bet" inputmode="numeric" value="0"><button class="btn ghost" id="allin" style="margin:0;width:auto;padding:13px 16px">ALL IN</button></div>
    <button class="btn" id="lock">LOCK IT IN</button>
  </div>
  <div id="done" class="hide">
    <div class="final">
      <div class="big" id="score">$0</div>
      <div class="verdict" id="verdict"></div>
      <div class="grid" id="grid"></div>
    </div>
    <button class="btn" id="share">COPY RESULT</button>
    <div class="foot" id="foot"></div>
  </div>
</div>

/* --- deterministic PRNG so a given day is identical for everyone --- */
function hash(str){
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function mulberry(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const todayKey = () => {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
};

let RNG = mulberry(hash(todayKey()));
const rint = n => Math.floor(RNG() * n);
const pick = a => a[rint(a.length)];
const shuffle = a => { const c = a.slice(); for (let i = c.length-1; i > 0; i--){ const j = rint(i+1); [c[i],c[j]] = [c[j],c[i]]; } return c; };

/* --- data --- */
const D = {};
async function grab(name, key){
  try { const r = await fetch('../' + name, { cache:'force-cache' }); if (r.ok) D[key] = await r.json(); }
  catch (_) {}
}

/* ------------------------------------------------------------------
 * INDEX — flatten the record book into things we can ask about.
 * Team ids are season-scoped, so every lookup goes through that
 * season's own roster. Champions are stored as owner handles, so they
 * are resolved back to the team name people actually recognise.
 * ------------------------------------------------------------------ */
const IX = { seasons:[], allTime:[], trades:[], picks:[], grades:[] };

function buildIndex(){
  const H = D.history, R = D.records, T = D.trades, DR = D.drafts, G = D.grades;

  if (H && H.seasons) for (const s of H.seasons){
    const names = {}; const owners = {};
    for (const t of s.teams){ names[t.id] = (t.name || '').trim(); owners[t.id] = (t.owner || '').trim(); }
    let champTeam = null;
    for (const t of s.teams) if (t.owner === s.champion) champTeam = (t.name || '').trim();
    const standings = (s.standings || []).map(x => Object.assign({}, x, { team: names[x.teamId] }))
                                         .filter(x => x.team);
    const games = (s.matchups || []).map(m => Object.assign({}, m, {
      homeTeam: names[m.home], awayTeam: names[m.away],
      winner: m.homeScore === m.awayScore ? null : (m.homeScore > m.awayScore ? names[m.home] : names[m.away]),
      top: Math.max(m.homeScore, m.awayScore),
    })).filter(m => m.homeTeam && m.awayTeam);
    IX.seasons.push({ year:s.year, champion:champTeam, championOwner:s.champion,
                      teams:Object.values(names).filter(Boolean), standings, games });
  }

  if (R && R.standings) IX.allTime = R.standings.filter(x => x.numSeasons >= 3);

  if (T && T.trades) for (const tr of T.trades){
    if (!tr.sides || tr.sides.length !== 2) continue;
    for (let i = 0; i < 2; i++){
      const got = (tr.sides[i].gets || []).filter(a => a.player).map(a => a.player);
      if (got.length) IX.trades.push({ year:tr.season, team:(tr.sides[i].team||'').trim(),
                                       from:(tr.sides[1-i].team||'').trim(), players:got });
    }
  }

  if (DR && DR.years) for (const [y, list] of Object.entries(DR.years))
    for (const p of list) if (p.player && p.team)
      IX.picks.push({ year:+y, pick:p.pick, round:p.round, team:p.team.trim(), player:p.player.trim() });

  if (G && G.years) for (const [y, list] of Object.entries(G.years))
    for (const g of list) if (g.grade && g.team) IX.grades.push({ year:+y, team:g.team.trim(), grade:g.grade.trim() });
}

/* --- helpers for building plausible wrong answers --- */
function decoys(right, universe, n){
  const pool = [...new Set(universe)].filter(x => x && x !== right);
  const out = [];
  while (out.length < n && pool.length) out.push(pool.splice(rint(pool.length), 1)[0]);
  return out;
}
const teamUniverse = () => {
  const all = [];
  for (const s of IX.seasons) all.push(...s.teams);
  return all;
};
const ordinal = n => {
  const suf = ['th','st','nd','rd'], v = n % 100;
  return n + (suf[(v - 20) % 10] || suf[v] || suf[0]);
};

/* ------------------------------------------------------------------
 * QUESTION GENERATORS
 * Each returns { tag, q, answer, options, note, tier }
 * tier 1 = most people know it, 3 = only a sicko knows it
 * ------------------------------------------------------------------ */
const GEN = [];
const add = (pool, fn) => GEN.push(Object.assign(fn, { pool }));

// who took the title
add(18, () => {
  const s = pick(IX.seasons.filter(x => x.champion && x.teams.length > 3));
  if (!s) return null;
  return { tier: s.year >= 2021 ? 1 : 2, tag:'CHAMPIONS',
    q:`Who won the SCFL title in ${s.year}?`,
    answer:s.champion, options:[s.champion, ...decoys(s.champion, s.teams, 3)],
    note:`<b>${s.champion}</b> took the ${s.year} title.` };
});

// best record in a season
add(18, () => {
  const s = pick(IX.seasons.filter(x => x.standings.length > 5));
  if (!s) return null;
  const top = s.standings.slice().sort((a,b) => a.rank - b.rank)[0];
  if (!top) return null;
  return { tier:2, tag:'REGULAR SEASON',
    q:`Who finished first in the ${s.year} regular season?`,
    answer:top.team, options:[top.team, ...decoys(top.team, s.teams, 3)],
    note:`<b>${top.team}</b> finished ${top.wins}-${top.losses} with ${Math.round(top.pf)} points for.` };
});

// the cellar
add(18, () => {
  const s = pick(IX.seasons.filter(x => x.standings.length > 5));
  if (!s) return null;
  const last = s.standings.slice().sort((a,b) => b.rank - a.rank)[0];
  if (!last) return null;
  return { tier:3, tag:'THE CELLAR',
    q:`Who finished dead last in ${s.year}?`,
    answer:last.team, options:[last.team, ...decoys(last.team, s.teams, 3)],
    note:`<b>${last.team}</b> came ${ordinal(last.rank)} at ${last.wins}-${last.losses}.` };
});

// highest single score of a season
add(18, () => {
  const s = pick(IX.seasons.filter(x => x.games.length > 10));
  if (!s) return null;
  const g = s.games.slice().sort((a,b) => b.top - a.top)[0];
  const who = g.homeScore > g.awayScore ? g.homeTeam : g.awayTeam;
  return { tier:3, tag:'BIGGEST WEEK',
    q:`Who put up the highest single-week score of ${s.year}?`,
    answer:who, options:[who, ...decoys(who, s.teams, 3)],
    note:`<b>${who}</b> hung <b>${g.top}</b> in week ${g.week} of ${s.year}.` };
});

// head to head result
add(2344, () => {
  const s = pick(IX.seasons.filter(x => x.games.length > 10));
  if (!s) return null;
  const g = pick(s.games.filter(x => x.winner));
  if (!g) return null;
  const other = g.winner === g.homeTeam ? g.awayTeam : g.homeTeam;
  return { tier:3, tag:'HEAD TO HEAD',
    q:`Week ${g.week}, ${s.year}: ${g.homeTeam} vs ${g.awayTeam}. Who won?`,
    answer:g.winner, options:shuffle([g.winner, other]),
    note:`<b>${g.winner}</b> won it ${Math.max(g.homeScore,g.awayScore)}–${Math.min(g.homeScore,g.awayScore)}.` };
});

// all-time crowns
add(1, () => {
  if (IX.allTime.length < 4) return null;
  const top = IX.allTime.slice().sort((a,b) => b.titles - a.titles)[0];
  return { tier:1, tag:'ALL TIME',
    q:'Which club has won the most SCFL titles?',
    answer:top.name, options:[top.name, ...decoys(top.name, IX.allTime.map(x => x.name), 3)],
    note:`<b>${top.name}</b> — ${top.titles} titles across ${top.numSeasons} seasons.` };
});

// perennial bridesmaid
add(1, () => {
  if (IX.allTime.length < 4) return null;
  const top = IX.allTime.slice().sort((a,b) => (b.runnerUps||0) - (a.runnerUps||0))[0];
  if (!top.runnerUps) return null;
  return { tier:2, tag:'ALL TIME',
    q:'Which club has finished runner-up the most times?',
    answer:top.name, options:[top.name, ...decoys(top.name, IX.allTime.map(x => x.name), 3)],
    note:`<b>${top.name}</b> — ${top.runnerUps} runner-up finishes, and ${top.titles} titles.` };
});

// best win rate
add(1, () => {
  if (IX.allTime.length < 4) return null;
  const top = IX.allTime.slice().sort((a,b) => b.winPct - a.winPct)[0];
  return { tier:2, tag:'ALL TIME',
    q:'Which club has the best all-time winning percentage?',
    answer:top.name, options:[top.name, ...decoys(top.name, IX.allTime.map(x => x.name), 3)],
    note:`<b>${top.name}</b> — ${top.record}, a ${(top.winPct*100).toFixed(1)}% clip.` };
});

// who took this player in the draft
add(127, () => {
  const p = pick(IX.picks);
  if (!p) return null;
  return { tier:2, tag:'THE DRAFT',
    q:`Which club drafted ${p.player} in ${p.year}?`,
    answer:p.team, options:[p.team, ...decoys(p.team, IX.picks.map(x => x.team), 3)],
    note:`<b>${p.team}</b> took ${p.player} at pick ${p.pick} in ${p.year}.` };
});

// what came off the board at a slot
add(60, () => {
  const p = pick(IX.picks.filter(x => x.round === 1));
  if (!p) return null;
  return { tier:3, tag:'THE DRAFT',
    q:`Who did ${p.team} take at pick ${p.pick} of the ${p.year} draft?`,

    note:`Pick ${p.pick}, ${p.year}: <b>${p.player}</b> to ${p.team}.` };
});

// who acquired this player
add(200, () => {
  const t = pick(IX.trades.filter(x => x.players.length === 1 && x.team && x.from));
  if (!t) return null;
  return { tier:3, tag:'THE TRADE DESK',
    q:`Which club traded for ${t.players[0]} in ${t.year}?`,

// the draft grade
add(79, () => {
  const g = pick(IX.grades);
  if (!g) return null;
  const all = [...new Set(IX.grades.map(x => x.grade))];
  return { tier:3, tag:'DRAFT GRADES',
    q:`What grade did ${g.team} get for their ${g.year} draft?`,
    answer:g.grade, options:[g.grade, ...decoys(g.grade, all, 3)],
    note:`${g.team}'s ${g.year} draft was graded <b>${g.grade}</b>.` };

// a specific club's haul, rather than only "who has the most"
add(23, () => {
  const c = pick(IX.allTime.filter(x => x.titles > 0));
  if (!c) return null;
  const nums = [...new Set(IX.allTime.map(x => x.titles))].map(String);
  return { tier:2, tag:'ALL TIME',
    q:`How many SCFL titles have ${c.name} won?`,
    answer:String(c.titles), options:[String(c.titles), ...decoys(String(c.titles), nums, 3)],
    note:`<b>${c.name}</b> — ${c.titles} titles, ${c.runnerUps||0} runner-ups, ${c.playoffs} playoff trips in ${c.numSeasons} seasons.` };
});

// most points in a regular season
add(18, () => {
  const s = pick(IX.seasons.filter(x => x.standings.length > 5));
  if (!s) return null;
  const top = s.standings.slice().sort((a,b) => b.pf - a.pf)[0];
  return { tier:3, tag:'SCOREBOARD',
    q:`Who scored the most points in the ${s.year} regular season?`,
    answer:top.team, options:[top.team, ...decoys(top.team, s.teams, 3)],
    note:`<b>${top.team}</b> put up ${Math.round(top.pf)} points in ${s.year}.` };
});

// playoff regulars
add(23, () => {
  const c = pick(IX.allTime.filter(x => x.playoffs != null));
  if (!c) return null;
  const nums = [...new Set(IX.allTime.map(x => x.playoffs))].map(String);
  return { tier:3, tag:'ALL TIME',
    q:`How many times have ${c.name} made the playoffs?`,
    answer:String(c.playoffs), options:[String(c.playoffs), ...decoys(String(c.playoffs), nums, 3)],
    note:`<b>${c.name}</b> — ${c.playoffs} playoff appearances in ${c.numSeasons} seasons.` };
});


/* Weight generators by how many distinct questions they can produce, so
   the handful of one-fact all-time questions stay rare. Capped so the
   enormous matchup pool does not swamp the rest. */
const WEIGHTS = GEN.map(g => Math.min(g.pool || 30, 40));
const WSUM = WEIGHTS.reduce((a, b) => a + b, 0);
function weightedGen(){
  let r = RNG() * WSUM;
  for (let i = 0; i < WEIGHTS.length; i++){ r -= WEIGHTS[i]; if (r <= 0) return i; }
  return WEIGHTS.length - 1;
}

/* ------------------------------------------------------------------
 * THE BOARD — four categories, four clues each, priced by difficulty.
 * Categories come from the generator tags, so a column always holds
 * questions of one kind.
 * ------------------------------------------------------------------ */
const VALUES = [200, 400, 600, 800];

/* The tier a generator declares is too coarse to price a board with - most
   categories only produce tier 3, which made every row equally brutal and
   the $200 as hard as the $800. Score each clue individually instead: older
   seasons are harder to recall, and a two-option clue is a coin flip. */
function hardness(q){
  let h = (q.tier || 2) * 10;
  const m = /\b(19|20)\d{2}\b/.exec(q.q);
  if (m) h += Math.min(20, (2026 - +m[0]) * 1.1);
  if (q.options.length === 2) h -= 7;
  return h;
}
let BOARD = [], bank = 0, marks = [], openCell = null, finalQ = null, finalBet = 0;

function buildBoard(){
  // draw a wide pool, then group it by category
  const pool = {};
  for (let i = 0; i < 900; i++){
    const q = GEN[weightedGen()]();
    if (!q) continue;
    const opts = [...new Set(q.options)].filter(Boolean);
    if (opts.length < 2) continue;
    q.options = opts;
    (pool[q.tag] = pool[q.tag] || []).push(q);
  }
  // a category needs four genuinely different questions to fill a column
  const usable = Object.entries(pool)
    .map(([tag, qs]) => {
      const seen = new Set(), uniq = [];
      for (const q of qs) if (!seen.has(q.q)){ seen.add(q.q); uniq.push(q); }
      return [tag, uniq];
    })
    .filter(([, qs]) => qs.length >= 4);
  if (usable.length < 4) return [];

  // prefer categories whose four clues actually span a range of difficulty,
  // so the price on a tile means something
  const built = usable.map(([tag, qs]) => {
    const scored = qs.map(q => Object.assign(q, { hard: hardness(q) }));
    const sorted = shuffle(scored).sort((a, b) => a.hard - b.hard);
    const four = [sorted[0], sorted[Math.floor(sorted.length/3)],
                  sorted[Math.floor(sorted.length*2/3)], sorted[sorted.length-1]];
    const uniq = [...new Map(four.map(q => [q.q, q])).values()];
    if (uniq.length < 4) return null;
    return { tag, four: uniq.sort((a, b) => a.hard - b.hard),
             spread: uniq[3].hard - uniq[0].hard };
  }).filter(Boolean);
  if (built.length < 4) return [];
  built.sort((a, b) => b.spread - a.spread);
  const chosen = shuffle(built.slice(0, Math.max(4, Math.ceil(built.length * 0.75)))).slice(0, 4);
  return chosen.map(c => ({ tag: c.tag,
    clues: c.four.map((q, i) => ({ q, value: VALUES[i], done: false })) }));
}

function renderBoard(){
  const el = document.getElementById('board');
  el.innerHTML = '';
  BOARD.forEach(col => {
    const c = document.createElement('div');
    c.className = 'cat'; c.textContent = col.tag;
    el.appendChild(c);
  });
  for (let row = 0; row < 4; row++){
    BOARD.forEach((col, ci) => {
      const cell = col.clues[row];
      const t = document.createElement('div');
      t.className = 'tile' + (cell.done ? ' used' : '');
      t.textContent = '$' + cell.value;
      if (!cell.done) t.onclick = () => openClue(ci, row);
      el.appendChild(t);
    });
  }
  paintBank();
}

function paintBank(){
  const el = document.getElementById('bank');
  el.textContent = (bank < 0 ? '-$' : '$') + Math.abs(bank);
  el.className = 'amt' + (bank < 0 ? ' neg' : '');
}

function openClue(ci, row){
  openCell = { ci, row };
  const cell = BOARD[ci].clues[row];
  document.getElementById('boardWrap').classList.add('hide');
  document.getElementById('clue').classList.add('on');
  document.getElementById('ctag').innerHTML = BOARD[ci].tag + ' &nbsp;·&nbsp; <span class="val">$' + cell.value + '</span>';
  document.getElementById('q').textContent = cell.q.q;
  document.getElementById('fact').classList.remove('on');
  document.getElementById('back').classList.add('hide');
  const box = document.getElementById('opts');
  box.innerHTML = '';
  shuffle(cell.q.options).forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="mk">' + String.fromCharCode(65 + i) + '</span><span>' + o + '</span>';
    b.onclick = () => resolve(o, b);
    box.appendChild(b);
  });
  say('talk', pick(LINES.pick));
}

function resolve(choice, btn){
  const { ci, row } = openCell;
  const cell = BOARD[ci].clues[row];
  if (cell.done) return;
  cell.done = true;
  const right = choice === cell.q.answer;
  marks.push(right);
  bank += right ? cell.value : -cell.value;
  paintBank();

  [...document.getElementById('opts').children].forEach(b => {
    b.disabled = true;
    const label = b.querySelector('span:last-child').textContent;
    if (label === cell.q.answer) b.classList.add('right');
    else if (b === btn) b.classList.add('wrong');
    else b.classList.add('faded');
  });
  document.getElementById('fact').innerHTML =
    (right ? '' : '<b>Answer: ' + cell.q.answer + '</b><br>') + cell.q.note;
  document.getElementById('fact').classList.add('on');
  document.getElementById('back').classList.remove('hide');
  say(right ? (cell.value >= 800 ? 'big' : 'right') : 'wrong',
      pick(right ? (cell.value >= 800 ? LINES.rightBig : LINES.right) : LINES.wrong));
}

document.getElementById('back').onclick = () => {
  document.getElementById('clue').classList.remove('on');
  const left = BOARD.some(c => c.clues.some(x => !x.done));
  if (left){
    document.getElementById('boardWrap').classList.remove('hide');
    renderBoard();
    say('idle', 'Board\'s yours.');
  } else startFinal();
};

/* ------------------------------------------------------------------
 * FINAL CLUE — one wager, the hardest thing left in the pool.
 * ------------------------------------------------------------------ */
function startFinal(){
  // hardest available question that did not appear on the board
  const used = new Set();
  BOARD.forEach(c => c.clues.forEach(x => used.add(x.q.q)));
  for (let i = 0; i < 500 && !finalQ; i++){
    const q = GEN[weightedGen()]();
    if (!q || q.tier < 3 || used.has(q.q)) continue;
    const opts = [...new Set(q.options)].filter(Boolean);
    if (opts.length < 2) continue;
    q.options = opts; finalQ = q;
  }
  if (!finalQ){ finish(); return; }
  document.getElementById('finalWrap').classList.remove('hide');
  document.getElementById('fcat').textContent = finalQ.tag;
  const cap = Math.max(0, bank);
  const bet = document.getElementById('bet');
  bet.value = String(cap);
  bet.max = String(cap);
  say('toast', pick(LINES.finalIn) + (cap ? ' You have <b>$' + cap + '</b> to play with.'
                                          : ' You have nothing to play with, which simplifies things.'));
  document.getElementById('allin').onclick = () => { bet.value = String(cap); };
  document.getElementById('lock').onclick = () => {
    let v = parseInt(bet.value, 10);
    if (isNaN(v) || v < 0) v = 0;
    finalBet = Math.min(v, cap);
    document.getElementById('finalWrap').classList.add('hide');
    askFinal();
  };
}

function askFinal(){
  document.getElementById('clue').classList.add('on');
  document.getElementById('ctag').innerHTML = 'FINAL CLUE &nbsp;·&nbsp; <span class="val">$' + finalBet + ' at risk</span>';
  document.getElementById('q').textContent = finalQ.q;
  document.getElementById('fact').classList.remove('on');
  document.getElementById('back').classList.add('hide');
  const box = document.getElementById('opts');
  box.innerHTML = '';
  shuffle(finalQ.options).forEach((o, i) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = '<span class="mk">' + String.fromCharCode(65 + i) + '</span><span>' + o + '</span>';
    b.onclick = () => {
      const right = o === finalQ.answer;
      marks.push(right);
      bank += right ? finalBet : -finalBet;
      paintBank();
      [...box.children].forEach(x => {
        x.disabled = true;
        const label = x.querySelector('span:last-child').textContent;
        if (label === finalQ.answer) x.classList.add('right');
        else if (x === b) x.classList.add('wrong');
        else x.classList.add('faded');
      });
      document.getElementById('fact').innerHTML =
        (right ? '' : '<b>Answer: ' + finalQ.answer + '</b><br>') + finalQ.note;
      document.getElementById('fact').classList.add('on');
      say(right ? 'big' : 'wrong', pick(right ? LINES.finalRight : LINES.finalWrong));
      const go = document.getElementById('back');
      go.textContent = 'FINAL SCORE';
      go.classList.remove('hide');
      go.onclick = finish;
    };
    box.appendChild(b);
  });
  say('talk', 'Here it is.');
}

/* ------------------------------------------------------------------ */
const STORE = 'scfl.jeopardy';
const loadSt = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch (_) { return {}; } };
const saveSt = v => { try { localStorage.setItem(STORE, JSON.stringify(v)); } catch (_) {} };

function finish(){
  document.getElementById('clue').classList.remove('on');
  document.getElementById('boardWrap').classList.add('hide');
  document.getElementById('done').classList.remove('hide');
  const day = todayKey();
  const st = loadSt();
  if (st.lastDay !== day){
    st.lastDay = day;
    st.played = (st.played || 0) + 1;
    st.best = Math.max(st.best || 0, bank);
    saveSt(st);
  }
  document.getElementById('score').textContent = (bank < 0 ? '-$' : '$') + Math.abs(bank);
  document.getElementById('score').style.color = bank > 0 ? 'var(--money)' : 'var(--red)';
  const hits = marks.filter(Boolean).length;
  document.getElementById('verdict').textContent =
    bank <= 0 ? 'Buried by your own league.'
    : bank < 1500 ? 'You were there. Mostly.'
    : bank < 3000 ? 'You know this league.'
    : 'Commissioner material.';
  document.getElementById('grid').textContent = marks.map(m => m ? '🟩' : '🟥').join('');
  document.getElementById('foot').innerHTML =
    'a new board every day &nbsp;·&nbsp; best ' + ((st.best||bank) < 0 ? '-$' : '$') + Math.abs(st.best||bank) +
    '<br>drawn from 21 seasons of the record book';
  say(bank <= 0 ? 'wrong' : 'toast', pick(bank <= 0 ? LINES.bust : LINES.end));
  document.getElementById('share').onclick = async () => {
    const txt = 'SCFL Jeopardy · ' + day + '\n' + marks.map(m => m ? '🟩' : '🟥').join('') +
                '  ' + (bank < 0 ? '-$' : '$') + Math.abs(bank) + '  (' + hits + '/' + marks.length + ')';
    try { await navigator.clipboard.writeText(txt);
          document.getElementById('share').textContent = 'COPIED — PASTE IT IN THE CHAT'; }
    catch (_) { document.getElementById('share').textContent = txt; }
  };
}

(async function boot(){
  await Promise.all([
    grab('history.json','history'), grab('records.json','records'),
    grab('trades.json','trades'),   grab('drafts.json','drafts'),
    grab('pop-grades.json','grades'),
  ]);
  buildIndex();
  for (const [k, uri] of Object.entries(typeof HARRY_ART !== 'undefined' ? HARRY_ART : {})) HARRY[k] = uri;
  const d = new Date();
  document.getElementById('datel').textContent =
    d.toLocaleDateString(undefined, { weekday:'long', month:'long', day:'numeric' });
  BOARD = buildBoard();
  if (!BOARD.length){ document.getElementById('load').textContent = 'THE RECORD BOOK IS MISSING'; return; }
  document.getElementById('load').classList.add('hide');
  document.getElementById('boardWrap').classList.remove('hide');
  renderBoard();
  say('idle', pick(LINES.open));
})();
