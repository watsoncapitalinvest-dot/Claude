<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SCFL Ring of Honor — The Hall</title>
<meta name="description" content="Inducted members of the SCFL Ring of Honor.">
<meta name="theme-color" content="#0a1024">
<meta property="og:type" content="website">
<meta property="og:title" content="SCFL Ring of Honor — The Hall">
<meta property="og:description" content="Inducted members of the SCFL Ring of Honor.">
<meta property="og:url" content="https://watsoncapitalinvest-dot.github.io/Claude/ring-of-honor/hall.html">
<meta property="og:image" content="https://watsoncapitalinvest-dot.github.io/Claude/scfl-ring-of-honor-first-ballot.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="SCFL Ring of Honor — The Hall">
<meta name="twitter:image" content="https://watsoncapitalinvest-dot.github.io/Claude/scfl-ring-of-honor-first-ballot.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;600;700&display=swap');
:root{
  --bg:#0a1024; --panel:rgba(255,255,255,.05); --edge:rgba(255,255,255,.12);
  --ink:#f2f3f6; --dim:#c9cfdd; --faint:#8b93a8;
  --red:#b31b2c; --gold:#ffd35c;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:
    radial-gradient(ellipse at 50% -10%, #241a0e 0%, #0a1024 55%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.012) 0 2px, transparent 2px 6px);
  color:var(--ink);font-family:'Oswald',sans-serif;min-height:100dvh;
  -webkit-font-smoothing:antialiased}
#wrap{max-width:760px;margin:0 auto;padding:0 0 60px}
.stripe{height:8px;background:repeating-linear-gradient(90deg,#ffd35c 0 60px,#0a1024 60px 120px,#b31b2c 120px 180px)}
header{padding:34px 22px 18px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;
  border-bottom:4px solid var(--gold);background:linear-gradient(180deg, rgba(255,211,92,.14), transparent)}
header img{width:78px;height:auto;flex:none;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5))}
header > div{flex:1;min-width:180px}
.eyebrow{font-size:12px;letter-spacing:5px;color:var(--gold);font-weight:600}
h1{font-family:'Anton',sans-serif;font-size:38px;letter-spacing:1px;line-height:.95;color:#fff;
  text-shadow:0 2px 0 #7c1420}
.sub{font-family:'Anton',sans-serif;font-size:20px;letter-spacing:2px;color:#ffd35c}
.ballot-link{flex:none;color:#fff;text-decoration:none;font-size:13px;font-weight:600;
  border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:8px 14px;white-space:nowrap;
  margin-left:auto}
.ballot-link:hover{background:rgba(255,255,255,.08)}
@media (max-width:600px){.ballot-link{margin-left:98px}}
.intro{padding:20px 22px 6px;font-size:14.5px;line-height:1.6;color:var(--dim)}
.intro b{color:#fff}
section{padding:22px 22px 4px}
.year-group{margin-bottom:26px}
.year-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.year-num{font-family:'Anton',sans-serif;font-size:28px;color:var(--gold);letter-spacing:1px}
.year-line{flex:1;height:1px;background:linear-gradient(90deg, rgba(255,211,92,.4), transparent)}
.plaque{background:linear-gradient(160deg, rgba(255,211,92,.09), rgba(255,255,255,.03));
  border:1px solid rgba(255,211,92,.3);border-radius:14px;padding:18px 20px;margin-bottom:12px;
  position:relative;overflow:hidden}
.plaque::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold)}
.plaque-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.plaque-name{font-family:'Anton',sans-serif;font-size:22px;letter-spacing:.5px;color:#fff}
.plaque-cat{font-size:10px;letter-spacing:2px;color:var(--gold);font-weight:700;text-transform:uppercase}
.plaque-team{color:var(--faint);font-size:13px;font-weight:400;font-family:'Oswald',sans-serif}
.plaque-note{color:var(--dim);font-size:13.5px;line-height:1.6;margin-top:10px}
.plaque-meta{margin-top:10px;font-size:11px;color:var(--faint)}
.empty{margin:40px 22px;padding:36px 28px;text-align:center;background:var(--panel);
  border:1px dashed var(--edge);border-radius:16px}
.empty h2{font-family:'Anton',sans-serif;font-size:22px;color:#fff;letter-spacing:1px;margin-bottom:10px}
.empty p{color:var(--dim);font-size:14px;line-height:1.6;max-width:440px;margin:0 auto 18px}
.empty a{display:inline-block;background:var(--red);color:#fff;text-decoration:none;
  font-family:'Anton',sans-serif;font-size:15px;letter-spacing:1px;padding:12px 22px;border-radius:8px}
footer{padding:26px 22px 10px;color:var(--faint);font-size:12px;text-align:center;line-height:1.7}
.loading{padding:60px 22px;text-align:center;color:var(--faint)}
</style>
</head>
<body>
<div class="stripe"></div>
<div id="wrap">
  <header>
    <img src="../scfl-shield.png" alt="SCFL shield">
    <div>
      <div class="eyebrow">SCFL &middot; EST. 2004</div>
      <h1>RING OF HONOR</h1>
      <div class="sub">THE HALL</div>
    </div>
    <a class="ballot-link" href="index.html">Vote the ballot &rarr;</a>
  </header>
  <div class="intro">
    Inducted members of the SCFL Ring of Honor — outside people and athletes the ownership group
    has formally voted in. This page is permanent; new members are added here as the league inducts
    them, never removed.
  </div>
  <div id="content" class="loading">Loading the hall&hellip;</div>
</div>
<script>
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function load() {
  try {
    const r = await fetch('../ring-of-honor-inducted.json?t=' + Date.now(), { cache: 'no-store' });
    return r.ok ? (await r.json()).inducted || [] : [];
  } catch { return []; }
}

function plaque(i) {
  return `<div class="plaque">
    <div class="plaque-top">
      <div>
        <div class="plaque-cat">${esc(i.category === 'athlete' ? 'Athlete' : 'Person')}</div>
        <div class="plaque-name">${esc(i.name)}${i.team ? ` <span class="plaque-team">— ${esc(i.team)}</span>` : ''}</div>
      </div>
    </div>
    ${i.note ? `<div class="plaque-note">${esc(i.note)}</div>` : ''}
    ${i.votesAtInduction != null ? `<div class="plaque-meta">Inducted with ${esc(i.votesAtInduction)} vote${i.votesAtInduction === 1 ? '' : 's'} on record</div>` : ''}
  </div>`;
}

async function render() {
  const inducted = await load();
  const el = document.getElementById('content');
  el.className = '';
  if (!inducted.length) {
    el.innerHTML = `<div class="empty">
      <h2>No members yet</h2>
      <p>The Hall is empty until the league votes its first class in. Cast a vote or nominate
      someone on the current ballot to get things started.</p>
      <a href="index.html">Go to the ballot</a>
    </div>`;
    return;
  }
  const byYear = new Map();
  inducted.forEach(i => {
    if (!byYear.has(i.year)) byYear.set(i.year, []);
    byYear.get(i.year).push(i);
  });
  const years = [...byYear.keys()].sort((a, b) => b - a);
  el.innerHTML = `
    ${years.map(y => `<section class="year-group">
      <div class="year-head"><div class="year-num">${esc(y)}</div><div class="year-line"></div></div>
      ${byYear.get(y).map(plaque).join('')}
    </section>`).join('')}
    <footer>${inducted.length} member${inducted.length === 1 ? '' : 's'} of the SCFL Ring of Honor.</footer>`;
}

render();
</script>
</body>
</html>
